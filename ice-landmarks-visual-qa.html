<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ice Landmarks Visual QA</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce9ef}canvas{display:block}</style>
  <script type="importmap">{"imports":{"three":"./src/3d/vendor/three/three.module.js","three/addons/":"./src/3d/vendor/three/addons/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createIceLandmarks, disposeIceLandmarks } from './src/3d/world/iceLandmarks.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1200, 720);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce9ef);
const hemi = new THREE.HemisphereLight(0xd8ecff, 0x71808a, 1.65);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d7, 3.0);
sun.position.set(600, 850, 400);
sun.castShadow = true;
scene.add(sun);

const sampleHeightMeters = (x, z) => 10 + Math.sin(x * 0.0014) * 2.5 + Math.cos(z * 0.0011) * 1.7;
const landmarks = createIceLandmarks({ sampleHeightMeters, seed: 1337 });
scene.add(landmarks.group);

const box = new THREE.Box3().setFromObject(landmarks.group);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(Math.max(3600, size.x * 1.35), 1200, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xdde7e9, roughness: 0.94 }),
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(center.x, 7.5, center.z);
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(48, 1200 / 720, 0.1, 8000);
const portal = landmarks.group.getObjectByName('ice-wall-cave-portal');
const cave = landmarks.group.getObjectByName('ice-cave-shell');
const views = {
  wall: () => {
    camera.position.set(center.x - size.x * 0.24, box.max.y + 120, center.z + 520);
    camera.lookAt(center.x, box.min.y + size.y * 0.42, center.z);
  },
  cave: () => {
    const target = portal?.getWorldPosition(new THREE.Vector3()) ?? center;
    camera.position.set(target.x + 120, target.y + 26, target.z + 120);
    camera.lookAt(target.x, target.y + 9, target.z);
  },
  interior: () => {
    const target = cave?.geometry?.boundingSphere?.center?.clone() ?? new THREE.Vector3();
    cave?.localToWorld(target);
    camera.position.copy(target).add(new THREE.Vector3(0, 5.5, 0));
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(cave?.quaternion ?? new THREE.Quaternion());
    camera.lookAt(target.clone().add(forward.multiplyScalar(40)).add(new THREE.Vector3(0, 3, 0)));
  },
};

window.__iceQa = {
  ready: true,
  stats: {
    width: size.x, depth: size.z, height: size.y,
    blockers: landmarks.blockers.length,
    roles: landmarks.group.children.map((child) => child.userData?.iceLandmarkRole).filter(Boolean),
  },
  render(view = 'wall') {
    (views[view] || views.wall)();
    renderer.render(scene, camera);
    return this.stats;
  },
};
window.addEventListener('pagehide', () => { disposeIceLandmarks(landmarks); renderer.dispose(); }, { once: true });
window.__iceQa.render('wall');
</script>
</body>
</html>
