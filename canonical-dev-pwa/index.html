<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06040a">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Westeros Developer Standalone Shell</title>
  <style>
    html,body{margin:0;min-height:100%;background:#06040a;color:#f0dfb5;font-family:system-ui,sans-serif}
    main{box-sizing:border-box;max-width:760px;margin:0 auto;padding:48px 24px}
    h1{margin:0 0 12px;font-size:clamp(28px,5vw,48px)}
    p{line-height:1.6;color:#d5c39c}
    nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:32px}
    a{display:block;padding:20px;border:1px solid #6b542d;border-radius:12px;background:#120d18;color:#f0dfb5;text-decoration:none}
    a:focus,a:hover{outline:2px solid #c49a52;outline-offset:3px}
    strong{display:block;margin-bottom:8px;font-size:18px}
    small{display:block;color:#bca97f;line-height:1.45}
  </style>
</head>
<body data-run205-surface="developer-standalone-shell">
  <main>
    <h1>Developer Standalone Shell</h1>
    <p>Bu kurulum yüzeyi yalnız geliştirici doğrulaması içindir. Üretim PWA manifesti, service worker kapsamı ve varsayılan oyuncu başlangıcı değiştirilmez.</p>
    <nav aria-label="Developer standalone world source selection">
      <a id="run205-current" data-run205-source="current" href="../canonical-dev.html?worldSource=current">
        <strong>Current</strong>
        <small>Mevcut developer runtime yolunu aç.</small>
      </a>
      <a id="run205-canonical" data-run205-source="canonical-dev" href="../canonical-dev.html?worldSource=canonical-dev">
        <strong>Canonical</strong>
        <small>Opt-in canonical developer runtime yolunu aç.</small>
      </a>
    </nav>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(error => {
        console.error('[run205 developer shell] service worker registration failed', error);
      });
    }
  </script>
</body>
</html>
