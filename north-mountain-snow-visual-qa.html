<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North Mountain Snow Visual QA</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #aeb8c2; }
    #qa-root { width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #qa-panel { position: fixed; left: 12px; top: 12px; z-index: 2; margin: 0; padding: 9px 11px; border-radius: 5px; background: rgba(12,18,24,.84); color: #f4f7fa; font: 12px/1.45 monospace; pointer-events: none; white-space: pre-wrap; }
    #qa-legend { position: fixed; right: 12px; top: 12px; z-index: 2; padding: 8px 10px; border-radius: 5px; background: rgba(12,18,24,.78); color: #f4f7fa; font: 700 12px/1.5 monospace; pointer-events: none; text-align: right; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./src/3d/vendor/three/three.module.js",
      "three/addons/": "./src/3d/vendor/three/addons/"
    }
  }
  </script>
  <script type="module">
    try {
      const THREE = await import('three');
      const terrain = await import('./src/3d/world/terrainBiomeShading.js');
      const snowTone = await import('./src/3d/world/terrainSnowSurfaceTone.js');
      const config = await import('./src/3d/config.js');
      const alignment = await import('./src/3d/world/worldReferenceAlignment.js');
      window.__northMountainSnowQaModules = Object.freeze({ THREE, terrain, snowTone, ...config, ...alignment });
    } catch (error) {
      window.__northMountainSnowQaBootstrapError = error?.stack || error?.message || String(error);
      console.error('[north-mountain-snow-visual-qa] module bootstrap failed', error);
    }
  </script>
</head>
<body>
  <div id="qa-root"></div>
  <pre id="qa-panel">north mountain snow visual QA</pre>
  <div id="qa-legend">FAR NORTH WINDWARD · FAR NORTH LEE<br>ICE EDGE LEE · TUNDRA LEE<br>full runtime snow + terrain palette</div>
</body>
</html>
