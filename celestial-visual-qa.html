<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Celestial Visual QA</title>
	<style>
		html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071127; }
		#qa-root { width: 100%; height: 100%; }
		canvas { display: block; width: 100%; height: 100%; }
		#qa-panel { position: fixed; left: 14px; top: 12px; z-index: 2; min-width: 290px; margin: 0; padding: 9px 11px; border-radius: 5px; background: rgba(7, 12, 20, 0.78); color: #f5f7fb; font: 12px/1.45 monospace; pointer-events: none; white-space: pre-wrap; }
		#qa-compass { position: fixed; right: 14px; top: 12px; z-index: 2; padding: 7px 10px; border-radius: 5px; background: rgba(7, 12, 20, 0.72); color: #f5f7fb; font: 700 13px/1.2 monospace; pointer-events: none; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./src/3d/vendor/three/three.module.js",
			"three/addons/": "./src/3d/vendor/three/addons/"
		}
	</script>
	<script type="module">
		import * as THREE from 'three';
		import {
			CELESTIAL_ASSET_POLICY,
			createDayNightLighting,
			updateDayNightLighting,
		} from './src/3d/lighting.js';

		window.__celestialQaModules = Object.freeze({
			THREE,
			CELESTIAL_ASSET_POLICY,
			createDayNightLighting,
			updateDayNightLighting,
		});
	</script>
</head>
<body>
	<div id="qa-root"></div>
	<pre id="qa-panel">celestial visual QA</pre>
	<div id="qa-compass">WORLD +X = EAST · -X = WEST · +Y = UP</div>
</body>
</html>
