name: Buzul Muhafızı atmosphere weather director v17
on:
  pull_request:
    paths:
      - 'src/3d/world/photorealisticAtmosphereDirector.js'
      - 'scripts/checkPhotorealisticAtmosphereDirector.mjs'
      - '.github/workflows/buzul-muhafizi-atmosphere-weather-v17.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-atmosphere-weather-v17-20260908'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main ancestry and focused scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | wc -l)" -eq 3
          printf '%s\n' "$files" | grep -Fx 'src/3d/world/photorealisticAtmosphereDirector.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkPhotorealisticAtmosphereDirector.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/buzul-muhafizi-atmosphere-weather-v17.yml'
          additions=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$additions" -le 3000
      - name: Syntax and executable contract
        run: node --check src/3d/world/photorealisticAtmosphereDirector.js && node --check scripts/checkPhotorealisticAtmosphereDirector.mjs && node scripts/checkPhotorealisticAtmosphereDirector.mjs
      - name: Protect shared boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline' src/3d/world/photorealisticAtmosphereDirector.js
          ! grep -nE 'src/3d/world/(terrain|water|sceneManager|naturalGeology|rivers|roads)\.js' src/3d/world/photorealisticAtmosphereDirector.js
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
