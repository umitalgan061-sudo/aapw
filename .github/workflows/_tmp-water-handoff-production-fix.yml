name: Temporary water handoff production fix

on:
  push:
    branches:
      - codex/aapw-realism-20260831-ocean

permissions:
  contents: write

jobs:
  patch-water:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply render-only organic handoff fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/3d/world/water.js')
          text = path.read_text()

          replacements = [
              (
                  "id: 'water-world-surface-variation-2026-09-02-v15-owner-border-optical-seal',",
                  "id: 'water-world-surface-variation-2026-09-02-v16-owner-border-organic-handoff',",
              ),
              (
                  "\t\tfloat localEdgeDistance = max(abs(position.x), abs(position.z));",
                  "\t\tfloat localEdgeDistance = length(position.xz);",
              ),
              (
                  "\tfloat waterFieldEdgeOpticalBlend(vec2 worldXZ) {",
                  "\tfloat organicLayerDistance(vec2 worldXZ) {\n"
                  "\t\tvec2 delta = worldXZ - uCameraPosition.xz;\n"
                  "\t\tfloat radial = length(delta);\n"
                  "\t\tfloat broadWarp = waterSurfaceNoise(worldXZ / 1180.0 + vec2(-4.7, 9.3)) - 0.5;\n"
                  "\t\tvec2 rotated = worldXZ * mat2(0.78, -0.63, 0.63, 0.78);\n"
                  "\t\tfloat mesoWarp = waterSurfaceNoise(rotated / 540.0 + vec2(13.1, -6.8)) - 0.5;\n"
                  "\t\treturn max(0.0, radial + broadWarp * 150.0 + mesoWarp * 62.0);\n"
                  "\t}\n\n"
                  "\tfloat waterFieldEdgeOpticalBlend(vec2 worldXZ) {",
              ),
              (
                  "\t\tfloat layerDistance = max(abs(vWorldPosition.x - uCameraPosition.x), abs(vWorldPosition.z - uCameraPosition.z));",
                  "\t\tfloat layerDistance = organicLayerDistance(vWorldPosition.xz);",
              ),
              (
                  "\t\tfloat fieldEdgeOpticalBlend = waterFieldEdgeOpticalBlend(vWorldPosition.xz) * uFarLayerMask\n\t\t\t* smoothstep(0.72, 0.98, waterField.y)",
                  "\t\tfloat fieldEdgeOpticalBlend = waterFieldEdgeOpticalBlend(vWorldPosition.xz) * uFarLayerMask * farLayerBlend\n\t\t\t* smoothstep(0.72, 0.98, waterField.y)",
              ),
              (
                  "\t\tfloat farMarineOpticalFloor = uFarLayerMask * smoothstep(0.24, 0.92, rawOffshoreOptical) * ${WATER_SURFACE_VARIATION_POLICY.farMarineOpticalDepthFloor.toFixed(2)};",
                  "\t\tfloat farMarineOpticalFloor = uFarLayerMask * farLayerBlend * smoothstep(0.24, 0.92, rawOffshoreOptical) * ${WATER_SURFACE_VARIATION_POLICY.farMarineOpticalDepthFloor.toFixed(2)};",
              ),
              (
                  "\t\tsoftNearFarLayerHandoff: true,\n\t\textendedBackdropBeyondFullWorldFrame: true,",
                  "\t\tsoftNearFarLayerHandoff: true,\n\t\torganicRadialLayerHandoff: true,\n\t\textendedBackdropBeyondFullWorldFrame: true,",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit production fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/3d/world/water.js
          git rm .github/workflows/_tmp-water-handoff-production-fix.yml
          git commit -m "fix(world): combine organic water handoff with owner-border seal"
          git push origin HEAD:codex/aapw-realism-20260831-ocean