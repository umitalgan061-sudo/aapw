name: Run 155 Health Bar Accessibility

on:
  push:
    branches:
      - agent/run155-healthbar-a11y

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: e99de43b99aedf4b6f1556f88c879852e8c22c7d
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and initial concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md
          test -f 3D_GAME_PROGRESS.md
          test -f DECISIONS.md
          test -f QUESTIONS_FOR_OWNER.md
          grep -q 'Run 154' 3D_GAME_PROGRESS.md
          grep -q 'ADR-0176' DECISIONS.md

      - name: Baseline validation on clean main worktree
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run155-baseline"
          git worktree add --detach "$BASELINE" origin/main
          (
            cd "$BASELINE"
            node scripts/checkCheckpointConsistency.js
            node scripts/checkLatestRunUniqueness.js
            node scripts/checkPwaInstallability.js
            node scripts/checkServiceWorkerCache.js
            node scripts/checkWorldEventCatalog.js
            node scripts/checkWorldEventDiversity.js
            node scripts/checkWorldEventDeterminism.js
            node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run155-smoke-before.log"
            test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run155-smoke-before.log")" -ge 34
          )
          git worktree remove "$BASELINE"

      - name: Syntax, target regression and additive-only gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/ui/healthBar.js
          node --check scripts/checkHealthBarAccessibility.js
          python -m py_compile scripts/applyRun155Records.py
          node scripts/checkHealthBarAccessibility.js
          git diff --check origin/main...HEAD
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Repository invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkAssetsManifest.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Mobile and world safety regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Full browser and WebGL smoke after change
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run155-smoke-after.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run155-smoke-after.log")"
          test "$PASS_COUNT" -ge 34
          echo "RUN155_SMOKE=$PASS_COUNT" >> "$GITHUB_ENV"

      - name: Performance snapshot and self-review gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run155
          node scripts/analyzePerfTrend.js
          git diff --check
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Finalize governance records
        shell: bash
        run: |
          set -euo pipefail
          export RUN155_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN155_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          echo "RUN155_TAG=$RUN155_TAG" >> "$GITHUB_ENV"
          python scripts/applyRun155Records.py
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Final concurrency gate, commit, tag and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Westeros Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/3d/ui/healthBar.js scripts/checkHealthBarAccessibility.js scripts/applyRun155Records.py .github/workflows/run155-healthbar-a11y.yml 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          git commit -m "docs(3d): record run155 stable checkpoint"
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          git tag "$RUN155_TAG"
          git push origin HEAD:agent/run155-healthbar-a11y
          git push origin "$RUN155_TAG" || echo "[run155] tag push blocked; STABLE_TAGS.md remains authoritative per GOVERNANCE.md §8.11"
