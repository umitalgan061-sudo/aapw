name: Run 129 Checkpoint Validation

on:
  push:
    branches:
      - agent/run129-checkpoint-consistency
    paths:
      - 'scripts/checkCheckpointConsistency.js'
      - '.github/workflows/run129-checkpoint-validation.yml'

permissions:
  contents: write

concurrency:
  group: run129-checkpoint-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f GOVERNANCE.md
          test -f 3D_GAME_PROGRESS.md
          test -f DECISIONS.md
          test -f QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
          tail -n 120 GOVERNANCE.md
          tail -n 180 3D_GAME_PROGRESS.md
          tail -n 100 DECISIONS.md
          tail -n 80 QUESTIONS_FOR_OWNER.md

      - name: Baseline checkpoint and integrity gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkCheckpointConsistency.js
          node scripts/checkCheckpointConsistency.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Full browser smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")"
          echo "SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"
          test "$PASS_COUNT" -ge 34

      - name: Performance snapshot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run129 | tee "$RUNNER_TEMP/perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/perf-trend.log"
          PERF_ROW="$(tail -n 1 perf_log.csv)"
          echo "PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"

      - name: Self-review and additive guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkCheckpointConsistency.js; then exit 1; fi
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Append governance records and verify checkpoint invariant
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          printf '\n## Run 129 — checkpoint continuity guard (%s)\n' "$STAMP" >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Alt görev: Çoklu ajan/saatlik çalışma kayıtlarının progress + perf + stable-tag arasında kopmasını otomatik yakalayan scripts/checkCheckpointConsistency.js eklendi.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Değişiklik: yalnız yeni dev-tool/CI dosyaları; mevcut runtime/PWA/gameplay kaynaklarından hiçbir satır veya dosya silinmedi/değiştirilmedi.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- DoD: node --check PASS; checkpoint/world-event/PWA/cache/asset/smoke-registry/terrain/road guard PASS; browser smoke ${SMOKE_PASS_COUNT}/34+ PASS; additive-only PASS." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Performans: ${PERF_ROW}" >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Görsel doğrulama: runtime görsel davranışı değişmedi; gerçek Chromium 2D/3D boot ve UI smoke doğrulandı, görsel delta yok.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- ADR: runtime/mimari ürün davranışı değişmediği için yeni ADR gerekmiyor. Memory-leak: yeni runtime listener/timer/DOM/geometry/material yok.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Teknik borç: 0 yeni borç. World Coverage: desktop 96.2% / mobile 4.5% değişmedi. World Evolution delta: 0. Oyuncu fark etmez. Risk: LOW. Güven: 5/5.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- $TAG — run 129 checkpoint continuity guard; browser smoke ${SMOKE_PASS_COUNT}/34+ PASS, additive-only PASS, perf snapshot recorded." >> STABLE_TAGS.md
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
          node scripts/checkCheckpointConsistency.js

      - name: Commit progress and performance log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3D_GAME_PROGRESS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "docs: record run 129 validation and stable checkpoint"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Stable tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "$STABLE_TAG"
          git push origin "$STABLE_TAG"
