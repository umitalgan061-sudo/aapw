name: Player Combat Frame Director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFrameDirector.js'
      - 'scripts/checkPlayerCombatFrameDirector.mjs'
      - '.github/workflows/player-combat-frame-director.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatFrameDirector.js && node --check scripts/checkPlayerCombatFrameDirector.mjs
      - name: Focused contract
        run: node scripts/checkPlayerCombatFrameDirector.mjs
