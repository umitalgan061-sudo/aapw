name: Kizil Ufuk Player Combat Frame Bridge

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFrameBridge.js'
      - 'scripts/checkPlayerCombatFrameBridge.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-frame-bridge.yml'
  push:
    branches:
      - main
      - 'agent/kizil-ufuk-combat-frame-bridge-20260916-r11'
    paths:
      - 'src/3d/gameplay/playerCombatFrameBridge.js'
      - 'scripts/checkPlayerCombatFrameBridge.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-frame-bridge.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatFrameBridge.js && node --check scripts/checkPlayerCombatFrameBridge.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatFrameBridge.mjs
      - name: Diff guard
        shell: bash
        run: |
          changed=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
