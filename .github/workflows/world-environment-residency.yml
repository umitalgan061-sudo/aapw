name: World Environment Residency

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/chunkManager.js'
      - 'src/3d/world/worldEnvironmentResidency.js'
      - 'src/3d/world/worldEnvironmentSurfaceProfiles.js'
      - 'scripts/checkWorldEnvironmentResidency.mjs'
      - 'scripts/checkWorldEnvironmentResidencyBudget.mjs'
      - 'scripts/checkWorldEnvironmentAssetFidelity.mjs'
      - 'scripts/checkWorldEnvironmentResidencyBrowser.mjs'
      - 'scripts/checkWorldEnvironmentMaterialSurfacesBrowser.mjs'
      - 'scripts/checkWorldEnvironmentResidencyAuthority.mjs'
      - '.github/workflows/world-environment-residency.yml'
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: world-environment-residency-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-read live main and enforce bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          BASE_SHA="$(git merge-base HEAD "$LIVE_MAIN_SHA")"
          test "$BASE_SHA" = "$LIVE_MAIN_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA...HEAD"
          ADD="$(git diff --numstat "$BASE_SHA...HEAD" | awk '{s+=$1} END {print s+0}')"
          DEL="$(git diff --numstat "$BASE_SHA...HEAD" | awk '{s+=$2} END {print s+0}')"
          TOTAL=$((ADD + DEL))
          echo "Environment residency diff: additions=$ADD deletions=$DEL total=$TOTAL"
          test "$TOTAL" -le 3000

      - name: Install runtime Three.js dependency
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.180.0

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/worldEnvironmentResidency.js
          node --check src/3d/world/worldEnvironmentSurfaceProfiles.js
          node --check src/3d/world/chunkManager.js
          node --check scripts/checkWorldEnvironmentResidency.mjs
          node --check scripts/checkWorldEnvironmentResidencyBudget.mjs
          node --check scripts/checkWorldEnvironmentAssetFidelity.mjs
          node --check scripts/checkWorldEnvironmentResidencyBrowser.mjs
          node --check scripts/checkWorldEnvironmentMaterialSurfacesBrowser.mjs
          node --check scripts/checkWorldEnvironmentResidencyAuthority.mjs

      - name: Deterministic residency contract
        run: node scripts/checkWorldEnvironmentResidency.mjs

      - name: Ring, distance and budget safety matrix
        run: node scripts/checkWorldEnvironmentResidencyBudget.mjs

      - name: Asset fidelity matrix
        run: node scripts/checkWorldEnvironmentAssetFidelity.mjs

      - name: Residency authority boundary
        run: node scripts/checkWorldEnvironmentResidencyAuthority.mjs

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Shipped createScene residency proof
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWorldEnvironmentResidencyBrowser.mjs

      - name: Shipped createScene material/PBR proof
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWorldEnvironmentMaterialSurfacesBrowser.mjs

      - name: Final exact-main freshness and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA...HEAD"

      - name: Upload createScene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-environment-residency-proof
          if-no-files-found: warn
          path: artifacts/world-environment-residency/
