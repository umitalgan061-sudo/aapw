name: settlement-interaction-journal
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementInteractionJournal.js'
      - 'scripts/checkSettlementInteractionJournal.mjs'
      - '.github/workflows/settlement-interaction-journal.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/checkSettlementInteractionJournal.mjs
      - run: node --check src/3d/gameplay/settlementInteractionJournal.js
      - run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
      - name: guard ownership boundaries
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" -n src/3d/gameplay/settlementInteractionJournal.js
          test "$(git diff --numstat "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
