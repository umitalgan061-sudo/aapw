name: RPG Smithing Service Persistence

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'scripts/checkInteractionExpeditionKitCraft.mjs'
      - 'scripts/checkInteractionProvisioningCraft.mjs'
      - 'scripts/checkInteractionQuartermasterTrade.mjs'
      - 'scripts/checkInteractionSettlementServiceContract.mjs'
      - 'scripts/checkInteractionSettlementServiceBrowser.mjs'
      - 'scripts/checkInteractionSmithingServicePersistence.mjs'
      - 'scripts/checkInteractionTradeLedgerAtomicity.mjs'
      - 'scripts/checkInteractionMasteryEconomyContinuity.mjs'
      - 'scripts/checkInteractionMasteryToSmithingBrowser.mjs'
      - '.github/workflows/rpg-mastery-economy-continuity.yml'
      - '.github/workflows/rpg-smithing-service-persistence.yml'
      - '.github/workflows/rpg-mastery-to-smithing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smithing-service-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD)
          allowed='^(\.github/workflows/(rpg-interaction-quest-loop|rpg-smithing-service-persistence|rpg-mastery-to-smithing|rpg-mastery-economy-continuity)\.yml|scripts/checkInteractionExpeditionKitCraft\.mjs|scripts/checkInteractionProvisioningCraft\.mjs|scripts/checkInteractionQuartermasterTrade\.mjs|scripts/checkInteractionSettlementService(Browser|Contract)\.mjs|scripts/checkInteractionSmithingServicePersistence\.mjs|scripts/checkInteractionTradeLedgerAtomicity\.mjs|scripts/checkInteractionMasteryEconomyContinuity\.mjs|scripts/checkInteractionMasteryToSmithingBrowser\.mjs|src/3d/gameplay/interactionConfig\.js)$'
          if (( ${#paths[@]} )); then
            printf '%s\n' "${paths[@]}" | grep -Ev "$allowed" && exit 1 || true
          fi
          changed="$(git diff --numstat "$base"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 1000
      - name: Syntax and smithing persistence acceptance
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/interactionConfig.js
          node --check scripts/checkInteractionExpeditionKitCraft.mjs
          node --check scripts/checkInteractionProvisioningCraft.mjs
          node --check scripts/checkInteractionQuartermasterTrade.mjs
          node --check scripts/checkInteractionSettlementServiceContract.mjs
          node --check scripts/checkInteractionSettlementServiceBrowser.mjs
          node --check scripts/checkInteractionSmithingServicePersistence.mjs
          node --check scripts/checkInteractionTradeLedgerAtomicity.mjs
          node --check scripts/checkInteractionMasteryEconomyContinuity.mjs
          node --check scripts/checkInteractionMasteryToSmithingBrowser.mjs
          node scripts/checkInteractionExpeditionKitCraft.mjs
          node scripts/checkInteractionProvisioningCraft.mjs
          node scripts/checkInteractionQuartermasterTrade.mjs
          node scripts/checkInteractionSettlementServiceContract.mjs
          node scripts/checkInteractionSmithingServicePersistence.mjs
          node scripts/checkInteractionTradeLedgerAtomicity.mjs
          node scripts/checkInteractionMasteryEconomyContinuity.mjs
      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped settlement service browser proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionSettlementServiceBrowser.mjs
      - name: Shipped-page mastery to smithing browser proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryToSmithingBrowser.mjs
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
