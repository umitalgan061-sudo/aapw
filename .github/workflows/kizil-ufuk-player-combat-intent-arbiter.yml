name: Kızıl Ufuk Player Combat Intent Arbiter

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatIntentArbiter.js'
      - 'scripts/checkPlayerCombatIntentArbiter.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-intent-arbiter.yml'
  push:
    paths:
      - 'src/3d/gameplay/playerCombatIntentArbiter.js'
      - 'scripts/checkPlayerCombatIntentArbiter.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-intent-arbiter.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatIntentArbiter.js && node --check scripts/checkPlayerCombatIntentArbiter.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatIntentArbiter.mjs
      - name: Diff hygiene
        run: |
          additions=$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/playerCombatIntentArbiter.js scripts/checkPlayerCombatIntentArbiter.mjs .github/workflows/kizil-ufuk-player-combat-intent-arbiter.yml | awk '{a += $1} END {print a+0}')
          deletions=$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/playerCombatIntentArbiter.js scripts/checkPlayerCombatIntentArbiter.mjs .github/workflows/kizil-ufuk-player-combat-intent-arbiter.yml | awk '{d += $2} END {print d+0}')
          total=$((additions + deletions))
          test "$total" -le 3000
