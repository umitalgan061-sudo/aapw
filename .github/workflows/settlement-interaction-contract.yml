name: Settlement Interaction Contract

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementInteractionContract.js'
      - 'scripts/checkSettlementInteractionContract.mjs'
      - '.github/workflows/settlement-interaction-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementInteractionContract.js
      - name: Executable contract
        run: node scripts/checkSettlementInteractionContract.mjs
      - name: Ownership boundary
        run: |
          ! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|player\.js|terrain\.js|sceneManager\.js" src/3d/gameplay/settlementInteractionContract.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
