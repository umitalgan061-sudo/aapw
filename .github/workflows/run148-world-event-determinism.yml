name: Run 148 World Event Determinism

on:
  push:
    branches: [agent/run148-world-event-determinism]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_SHA: 23514171fa963349c6ab3b54d65505a12dde26ec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/run148-world-event-determinism
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Snapshot and initial concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md && test -f 3D_GAME_PROGRESS.md && test -f DECISIONS.md && test -f QUESTIONS_FOR_OWNER.md
          grep -q 'ADR-0166' DECISIONS.md
          grep -q 'ADR-0170' DECISIONS.md
          grep -q 'game3d.js' QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
      - name: Baseline governance validation
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run148-baseline"
          git worktree add --detach "$BASELINE" origin/main
          ( cd "$BASELINE" && \
            node scripts/checkCheckpointConsistency.js && \
            node scripts/checkWorldEventCatalog.js && \
            node scripts/checkWorldEventDiversity.js && \
            node scripts/checkRun143WorldEvents.js && node scripts/checkRun144WorldEvents.js && node scripts/checkRun145WorldEvents.js && node scripts/checkRun147WorldEvents.js && \
            node scripts/checkPwaInstallability.js && node scripts/checkServiceWorkerCache.js && \
            node scripts/checkMobileRadius4LiveWorld.js && node scripts/checkMobileVegetationCullingRun141.js && \
            node scripts/terrainSeatSafetyCheck.js && node scripts/roadNetworkSafetyCheck.js && \
            node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run148-smoke-before.log" )
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run148-smoke-before.log")" -ge 34
          git worktree remove "$BASELINE"
      - name: Bootstrap deterministic fixture and static gates
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test "$(git diff --numstat origin/main...HEAD | awk '$2 != 0 {n++} END {print n+0}')" = "0"
          node --check scripts/checkWorldEventDeterminism.js
          node --check src/3d/gameplay/worldEvents.js
          python -m py_compile scripts/finalizeRun148.py
          node scripts/checkWorldEventDeterminism.js --write-fixture
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkRun143WorldEvents.js
          node scripts/checkRun144WorldEvents.js
          node scripts/checkRun145WorldEvents.js
          node scripts/checkRun147WorldEvents.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkWorldEventDeterminism.js scripts/finalizeRun148.py; then exit 1; fi
      - name: Mobile and world safety gates
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Full browser smoke and performance
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run148-smoke-after.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run148-smoke-after.log")" -ge 34
          node scripts/collectPerfSnapshot.js run148
          node scripts/analyzePerfTrend.js
          echo "RUN148_PERF_ROW=$(tail -n 1 perf_log.csv)" >> "$GITHUB_ENV"
      - name: Finalize records
        run: |
          set -euo pipefail
          export RUN148_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN148_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          python scripts/finalizeRun148.py
          echo "RUN148_TAG=$RUN148_TAG" >> "$GITHUB_ENV"
          node scripts/checkCheckpointConsistency.js
      - name: Final concurrency gate and publish branch
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Westeros Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/fixtures/world-events-seed-148.json 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          test "$(git diff --cached --numstat origin/main | awk '$2 != 0 {n++} END {print n+0}')" = "0"
          git commit -m "test(3d): snapshot world-event determinism (run 148)"
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          git tag "$RUN148_TAG"
          git push origin HEAD:agent/run148-world-event-determinism
          git push origin "$RUN148_TAG" || true
