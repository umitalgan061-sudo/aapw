name: Coastal Cryosphere Width

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainBiomeShading.js'
      - 'scripts/checkCoastalCryosphereWidth.mjs'
      - '.github/workflows/coastal-cryosphere-width.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coastal-cryosphere-width:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime test dependency
        run: npm install --no-save --no-package-lock three

      - name: Syntax check
        run: |
          node --check src/3d/world/terrainBiomeShading.js
          node --check scripts/checkCoastalCryosphereWidth.mjs

      - name: Climate-scaled shoreline apron contract
        run: node scripts/checkCoastalCryosphereWidth.mjs
