name: Coastal Realism Sync Main
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/coastal-relief-realism-20260815
      - name: Merge current main without rewriting coastal work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:chatgpt/coastal-relief-realism-20260815
