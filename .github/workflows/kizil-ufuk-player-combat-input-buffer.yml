name: Kızıl Ufuk Player Combat Input Buffer

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatInputBuffer.js'
      - 'scripts/checkPlayerCombatInputBuffer.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-input-buffer.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatInputBuffer.js && node --check scripts/checkPlayerCombatInputBuffer.mjs
      - name: Contract
        run: node scripts/checkPlayerCombatInputBuffer.mjs
      - name: Diff guard
        shell: bash
        run: |
          changed=$(git diff --numstat "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- src/3d/gameplay/playerCombatInputBuffer.js scripts/checkPlayerCombatInputBuffer.mjs .github/workflows/kizil-ufuk-player-combat-input-buffer.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
