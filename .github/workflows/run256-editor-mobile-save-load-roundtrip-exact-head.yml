name: Run 256 Editor Mobile Save Load Roundtrip Exact Head

on:
  push:
    branches:
      - agent/run256-editor-mobile-save-load-roundtrip
    paths:
      - '.github/workflows/run256-editor-mobile-save-load-roundtrip-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run256-editor-mobile-save-load-roundtrip-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun256EditorMobileSaveLoadRoundtrip.js
          node --check src/3d/editor/worldEditor.js
          node --check src/3d/editor/EditorLocalSession.js
          node --check src/3d/editor/EditorSceneSerializer.js
          git diff --check
      - name: Verify Run256 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 256 — World Editor mobile actual-download save→load roundtrip regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run256,2026-08-11,editor-mobile-save-load-roundtrip' perf_log.csv
          grep -Fq 'Run256 editor mobile actual-download save-load roundtrip regression' STABLE_TAGS.md
          grep -Fq '31466599819' 3D_GAME_PROGRESS.md
          grep -Fq '31466599802' 3D_GAME_PROGRESS.md
