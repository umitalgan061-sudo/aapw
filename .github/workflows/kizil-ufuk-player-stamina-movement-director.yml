name: Kizil Ufuk Player Stamina Movement Director

on:
  push:
    branches:
      - 'agent/kizil-ufuk-stamina-movement-director-20260917-r11'
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerStaminaMovementDirector.js'
      - 'scripts/checkKizilUfukPlayerStaminaMovementDirector.mjs'
      - '.github/workflows/kizil-ufuk-player-stamina-movement-director.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD
      - name: Syntax
        run: node --check src/3d/gameplay/playerStaminaMovementDirector.js
      - name: Runtime proof
        run: node scripts/checkKizilUfukPlayerStaminaMovementDirector.mjs
      - name: Scope guard
        run: |
          changed=$(git diff --numstat "$(git rev-parse origin/main)...HEAD" -- | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          ! git diff "$(git rev-parse origin/main)...HEAD" --name-only | grep -E 'EditorMaterialStudio\.js$'
