name: Run216 Instance Coordinator Lifecycle

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorInstanceEditCoordinator.js'
      - 'src/3d/editor/EditorInstanceCoordinatorLifecycle.js'
      - 'scripts/checkRun216InstanceCoordinatorLifecycle.mjs'
      - '.github/workflows/run216-instance-coordinator-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instance-coordinator-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/3d/editor/EditorInstanceCoordinatorLifecycle.js
          node --check scripts/checkRun216InstanceCoordinatorLifecycle.mjs
      - name: Coordinator lifecycle regression
        run: node scripts/checkRun216InstanceCoordinatorLifecycle.mjs src/3d/editor/EditorInstanceCoordinatorLifecycle.js
