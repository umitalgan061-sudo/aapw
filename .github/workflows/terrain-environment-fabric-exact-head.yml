name: Terrain Environment Fabric Exact Head
on:
  pull_request:
    paths:
      - 'src/3d/world/terrainSurfaceFabric.js'
      - 'src/3d/world/terrainEnvironment*.js'
      - 'scripts/checkTerrainEnvironment*.mjs'
      - '.github/workflows/terrain-environment-fabric-exact-head.yml'
  workflow_dispatch:
jobs:
  contract-and-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/checkTerrainSurfaceFabric.mjs
      - run: node scripts/checkTerrainEnvironmentProfiles.mjs
      - run: node scripts/checkTerrainEnvironmentSpatialPolicy.mjs
      - run: node scripts/checkTerrainEnvironmentAssetManifest.mjs
      - run: node scripts/checkTerrainEnvironmentTextureAudit.mjs
      - run: node scripts/checkTerrainEnvironmentSceneBridge.mjs
      - run: node scripts/checkTerrainEnvironmentAssetSourceAdapter.mjs
      - run: node scripts/checkTerrainEnvironmentContractV3.mjs
      - run: node scripts/checkTerrainEnvironmentPolicyBoundaries.mjs
      - run: node -e "import('./src/3d/world/terrainEnvironmentContract.js').then(m=>{const r=m.validateTerrainEnvironmentContract();if(!r.ok)process.exit(1);console.log(JSON.stringify(r));})"
  exact-head-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: verify-head-is-not-detached-from-main
        run: |
          test -n "${GITHUB_SHA}"
          git cat-file -e "${GITHUB_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
