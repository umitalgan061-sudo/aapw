name: One-shot Rect Foundation Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rect-foundation-patch.yml'
      - 'src/3d/world/terrainFoundationConformer.js'
      - 'src/3d/world/terrain.js'
      - 'scripts/checkTerrainFoundationConformer.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair portal manifold and add passage/crown regression
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/foundation-grounding-20260821
          python - <<'PY'
          from pathlib import Path

          p = Path('src/3d/world/iceLandmarks.js')
          s = p.read_text()
          old = '''function makePortalShape(width, height, openingHalfWidth, sideHeight, archRise) {
\tconst halfWidth = width * 0.5;
\tconst shape = new THREE.Shape();
\tshape.moveTo(-halfWidth, 0);
\tshape.lineTo(halfWidth, 0);
\tshape.lineTo(halfWidth, height);
\tshape.lineTo(-halfWidth, height);
\tshape.closePath();

\tconst hole = new THREE.Path();
\thole.moveTo(-openingHalfWidth, 0);
\thole.lineTo(-openingHalfWidth, sideHeight);
\tfor (let step = 0; step <= 16; step += 1) {
\t\tconst angle = Math.PI - (step / 16) * Math.PI;
\t\thole.lineTo(
\t\t\tMath.cos(angle) * openingHalfWidth,
\t\t\tsideHeight + Math.sin(angle) * archRise,
\t\t);
\t}
\thole.lineTo(openingHalfWidth, 0);
\thole.closePath();
\tshape.holes.push(hole);
\treturn shape;
}'''
          new = '''function makePortalShape(width, height, openingHalfWidth, sideHeight, archRise) {
\tconst halfWidth = width * 0.5;
\tconst shape = new THREE.Shape();
\t// The walk-through opening reaches the ground. A Shape hole that touches the outer contour is
\t// degenerate for Earcut and can drop the portal's front/back caps, so trace one concave outer
\t// contour around the arch instead: open at player height, manifold above and beside the portal.
\tshape.moveTo(-halfWidth, 0);
\tshape.lineTo(-openingHalfWidth, 0);
\tshape.lineTo(-openingHalfWidth, sideHeight);
\tfor (let step = 0; step <= 16; step += 1) {
\t\tconst angle = Math.PI - (step / 16) * Math.PI;
\t\tshape.lineTo(
\t\t\tMath.cos(angle) * openingHalfWidth,
\t\t\tsideHeight + Math.sin(angle) * archRise,
\t\t);
\t}
\tshape.lineTo(openingHalfWidth, 0);
\tshape.lineTo(halfWidth, 0);
\tshape.lineTo(halfWidth, height);
\tshape.lineTo(-halfWidth, height);
\tshape.closePath();
\treturn shape;
}'''
          if s.count(old) != 1:
              raise SystemExit(f'portal contour match count {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/checkIceLandmarks.mjs')
          s = p.read_text()
          if "import * as THREE from 'three';" not in s:
              anchor = "import assert from 'node:assert/strict';\n"
              if s.count(anchor) != 1: raise SystemExit('test import anchor changed')
              s = s.replace(anchor, anchor + "import * as THREE from 'three';\n", 1)
          if 'castThroughPortalLocal' not in s:
              anchor = "assert(Math.abs(wall.material?.ior - 1.31) < 1e-9, 'ice IOR must remain physically plausible');\n\n"
              block = '''assert(Math.abs(wall.material?.ior - 1.31) < 1e-9, 'ice IOR must remain physically plausible');

const portalMesh = result.group.getObjectByName('ice-wall-cave-portal');
assert(portalMesh?.isMesh, 'arched cave portal mesh missing');
portalMesh.geometry.computeBoundingBox();
portalMesh.updateWorldMatrix(true, false);
const portalBounds = portalMesh.geometry.boundingBox;
assert(portalBounds, 'portal geometry must expose finite bounds');
const portalRaycaster = new THREE.Raycaster();
function castThroughPortalLocal(localX, localY) {
  const origin = new THREE.Vector3(localX, localY, portalBounds.min.z - 5).applyMatrix4(portalMesh.matrixWorld);
  const direction = new THREE.Vector3(0, 0, 1).transformDirection(portalMesh.matrixWorld);
  portalRaycaster.set(origin, direction);
  return portalRaycaster.intersectObject(portalMesh, false);
}
const archTopY = ICE_LANDMARK_POLICY.cave.openingSideHeightMeters + ICE_LANDMARK_POLICY.cave.openingArchRiseMeters;
assert(castThroughPortalLocal(0, archTopY + 4).length > 0,
  'ice portal crown must retain a closed front/back face above the walk-through arch');
assert.equal(castThroughPortalLocal(0, 1.5).length, 0,
  'ice portal center must remain open at player walking height');

'''
              if s.count(anchor) != 1: raise SystemExit('test portal anchor changed')
              s = s.replace(anchor, block, 1)
          p.write_text(s)
          PY
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/iceLandmarks.js
          node --check scripts/checkIceLandmarks.mjs
          node scripts/checkIceLandmarks.mjs
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          ln -sfn "$RUNNER_TEMP/pw/node_modules" "$GITHUB_WORKSPACE/node_modules"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Render repaired Wall and cave before publishing
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkIceLandmarksVisualQa.js
      - name: Upload repair proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ice-portal-manifold-repair-${{ github.event.pull_request.head.sha }}
          path: artifacts/ice-landmarks-visual-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Publish validated repair and restore workflow state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/foundation-grounding-20260821
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/foundation-grounding-20260821)" || {
            echo 'Branch advanced during validation; refusing to overwrite concurrent work.' >&2
            exit 1
          }
          git show 439681cf4572424c6cf9ac3080740fa367dc414d:.github/workflows/one-shot-rect-foundation-patch.yml > .github/workflows/one-shot-rect-foundation-patch.yml
          git show 439681cf4572424c6cf9ac3080740fa367dc414d:.github/workflows/ice-landmarks-visual-qa.yml > .github/workflows/ice-landmarks-visual-qa.yml
          rm -f .github/workflows/one-shot-ice-portal-manifold.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/3d/world/iceLandmarks.js scripts/checkIceLandmarks.mjs .github/workflows/one-shot-rect-foundation-patch.yml .github/workflows/ice-landmarks-visual-qa.yml
          git add -u -- .github/workflows/one-shot-ice-portal-manifold.yml
          git diff --cached --check
          git commit -m "fix(world): close ice cave portal frame"
          git push origin HEAD:codex/foundation-grounding-20260821
