name: One-shot Rect Foundation Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rect-foundation-patch.yml'
      - 'src/3d/world/terrainFoundationConformer.js'
      - 'src/3d/world/terrain.js'
      - 'scripts/checkTerrainFoundationConformer.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch, validate and publish once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "v11-oriented-rect-cells" src/3d/world/terrainFoundationConformer.js; then
            echo "Rectangular foundation patch already present."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          def r(text, old, new, label):
              if text.count(old) != 1: raise SystemExit(f'{label}: match count {text.count(old)}')
              return text.replace(old, new, 1)
          p = Path('src/3d/world/terrainFoundationConformer.js'); s = p.read_text()
          s = r(s, "id: 'runtime-structure-foundation-conform-2026-08-24-v10-oriented-footprint',\n\tfootprintMode: 'root-oriented-adaptive-four-cell-circle-union-with-aabb-fallback',", "id: 'runtime-structure-foundation-conform-2026-08-24-v11-oriented-rect-cells',\n\tfootprintMode: 'root-oriented-adaptive-four-cell-rectangle-union-with-aabb-fallback',", 'policy')
          old = '''  const cellRadius = Math.max(
    TERRAIN_FOUNDATION_CONFORM_POLICY.minimumInnerRadiusMeters,
    Math.hypot(cellWidth * 0.5, cellDepth * 0.5) + safeInnerMargin,
  );
  const pads = [];'''
          new = '''  const halfWidthMeters = cellWidth * 0.5 + safeInnerMargin;
  const halfDepthMeters = cellDepth * 0.5 + safeInnerMargin;
  const cellRadius = Math.max(TERRAIN_FOUNDATION_CONFORM_POLICY.minimumInnerRadiusMeters, Math.hypot(halfWidthMeters, halfDepthMeters));
  const axisX = oriented ? oriented.axisX : { x: 1, z: 0 };
  const axisZ = oriented ? oriented.axisZ : { x: 0, z: 1 };
  const pads = [];'''
          s = r(s, old, new, 'cell dimensions')
          s = r(s, '''      pads.push({
        x, z,
        innerRadiusMeters: cellRadius,
        outerRadiusMeters: cellRadius + safeFeather,''', '''      pads.push({
        shape: 'oriented-rectangle',
        x, z,
        halfWidthMeters,
        halfDepthMeters,
        axisX: { ...axisX },
        axisZ: { ...axisZ },
        featherMeters: safeFeather,
        innerRadiusMeters: cellRadius,
        outerRadiusMeters: cellRadius + safeFeather,''', 'pad shape')
          p.write_text(s)

          p = Path('src/3d/world/terrain.js'); s = p.read_text()
          marker = '''function flattenWeight(distanceMeters, innerRadiusMeters, outerRadiusMeters) {
\tif (distanceMeters <= innerRadiusMeters) return 1;
\tif (distanceMeters >= outerRadiusMeters) return 0;
\tconst t = 1 - (distanceMeters - innerRadiusMeters) / (outerRadiusMeters - innerRadiusMeters);
\treturn t * t * (3 - 2 * t);
}
'''
          helper = marker + '''
function foundationPadWeight(worldX, worldZ, pad) {
\tif (pad?.shape !== 'oriented-rectangle') return flattenWeight(Math.hypot(worldX - pad.x, worldZ - pad.z), pad.innerRadiusMeters, pad.outerRadiusMeters);
\tconst values = [pad.halfWidthMeters, pad.halfDepthMeters, pad.axisX?.x, pad.axisX?.z, pad.axisZ?.x, pad.axisZ?.z].map(Number);
\tif (!values.every(Number.isFinite)) return 0;
\tconst [halfWidth, halfDepth, axisXX, axisXZ, axisZX, axisZZ] = values;
\tconst dx = worldX - pad.x, dz = worldZ - pad.z;
\tconst outsideX = Math.max(0, Math.abs(dx * axisXX + dz * axisXZ) - halfWidth);
\tconst outsideZ = Math.max(0, Math.abs(dx * axisZX + dz * axisZZ) - halfDepth);
\tconst distance = Math.hypot(outsideX, outsideZ);
\tif (distance <= 0) return 1;
\tconst feather = Math.max(0, Number(pad.featherMeters) || 0);
\treturn feather > 0 ? flattenWeight(distance, 0, feather) : 0;
}
'''
          s = r(s, marker, helper, 'terrain helper')
          s = r(s, '''\t\tfor (const pad of flattenPads) {
\t\t\tconst distanceMeters = Math.hypot(worldX - pad.x, worldZ - pad.z);
\t\t\tconst weight = flattenWeight(distanceMeters, pad.innerRadiusMeters, pad.outerRadiusMeters);''', '''\t\tfor (const pad of flattenPads) {
\t\t\tconst weight = foundationPadWeight(worldX, worldZ, pad);''', 'terrain consumer')
          p.write_text(s)

          p = Path('scripts/checkTerrainFoundationConformer.mjs'); s = p.read_text()
          s = r(s, "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.footprintMode, 'root-oriented-adaptive-four-cell-circle-union-with-aabb-fallback');", "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.footprintMode, 'root-oriented-adaptive-four-cell-rectangle-union-with-aabb-fallback');", 'test policy')
          s = r(s, '''assert(longBuilt.pads.every((pad) => pad.innerRadiusMeters < 14),
\t'adaptive long-axis cells must materially reduce the old 2x2 cell radius');''', '''assert(longBuilt.pads.every((pad) => pad.innerRadiusMeters < 14),
\t'adaptive long-axis cells must materially reduce the old 2x2 cell radius');
assert(longBuilt.pads.every((pad) => pad.shape === 'oriented-rectangle' && pad.halfWidthMeters === 12.5 && pad.halfDepthMeters === 5));''', 'rect assertion')
          s = r(s, '''const nearSideProbeBase = baseSampler(0, 20);''', '''assert.equal(compactSampler(0, 8), baseSampler(0, 8), 'rect cells must preserve terrain beyond the bounded side feather');
const boundedFeather = compactSampler(0, 6);
assert.notEqual(boundedFeather, baseSampler(0, 6));
assert.notEqual(boundedFeather, 120);
const nearSideProbeBase = baseSampler(0, 20);''', 'side regression')
          s = r(s, '''const rotatedSideProbe = { x: -diagonal * 25, z: diagonal * 25 };''', '''const rotatedTightSideProbe = { x: -diagonal * 8, z: diagonal * 8 };
assert.equal(rotatedSampler(rotatedTightSideProbe.x, rotatedTightSideProbe.z), baseSampler(rotatedTightSideProbe.x, rotatedTightSideProbe.z), 'rotated rect cells must preserve near-side terrain beyond feather');
const rotatedSideProbe = { x: -diagonal * 25, z: diagonal * 25 };''', 'rotated regression')
          p.write_text(s)
          PY
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/terrainFoundationConformer.js
          node --check src/3d/world/terrain.js
          node scripts/checkStructureGroundingPolicy.mjs
          node scripts/checkSettlementFoundationAuthority.mjs
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkTerrainFoundationBatchRemoval.mjs
          node scripts/checkWorldFootprintGrounding.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/3d/world/terrainFoundationConformer.js src/3d/world/terrain.js scripts/checkTerrainFoundationConformer.mjs
          git diff --cached --check
          git commit -m "feat(world): conform structure terrain with rectangular cells"
          git push origin HEAD:codex/foundation-grounding-20260821
