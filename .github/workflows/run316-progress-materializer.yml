name: Run 316 Progress Materializer

on:
  push:
    branches:
      - run316-retire-run303-write-workflow
    paths:
      - '.run316-progress-materialize'

permissions:
  contents: write

concurrency:
  group: run316-progress-materializer-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_SHA: d89f1a01c76d48eb60f9f1cad0a6bfac026aa37c
  RUN_BRANCH: run316-retire-run303-write-workflow
  TZ: Europe/Istanbul

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fail closed outside Run316 source branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$RUN_BRANCH"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-current-main preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          node --check scripts/materializeRun316Progress.js

      - name: Install Chromium for real perf sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Materialize Run316 progress stable and performance records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run316-run303-write-workflow-retirement
          node scripts/materializeRun316Progress.js
          node scripts/checkCheckpointConsistency.js
          git diff --check
          git add 3D_GAME_PROGRESS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'3D_GAME_PROGRESS.md\nSTABLE_TAGS.md\nperf_log.csv'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Run316: materialize security checkpoint and continuity records'

      - name: Final exact-current-main gate and publish materialized head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:$RUN_BRANCH"
          TAG='stable-2026-08-12-run316'
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG" || echo "::notice::Stable tag push blocked; STABLE_TAGS.md remains the governance checkpoint record"
