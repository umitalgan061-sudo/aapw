name: SW G07 Terrain3D Road Path

on:
  push:
    branches: [terrain/sw-g07-road-path-20260813]
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/sw/g07_road_path.mjs'
      - 'scripts/checkSWG07RoadPath.mjs'
      - 'godot/terrain-authoring/scripts/validate_g07_terrain3d_road_path.gd'
      - 'godot/terrain-authoring/corner_claims/SW.json'
      - '.github/workflows/sw-g07-terrain3d-road-path.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: f85795822fc9115a9aaafad94842d9c14e411bfe

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/sw/g07_road_path.mjs|scripts/checkSWG07RoadPath.mjs|godot/terrain-authoring/scripts/validate_g07_terrain3d_road_path.gd|godot/terrain-authoring/corner_claims/SW.json|\.github/workflows/sw-g07-terrain3d-road-path.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Live runtime road exclusion and determinism
        run: |
          node --check godot/terrain-authoring/geocells/sw/g07_road_path.mjs
          node --check scripts/checkSWG07RoadPath.mjs
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSWG07RoadPath.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g07-road-path-probe.json | tee "$RUNNER_TEMP/g07-a.log"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSWG07RoadPath.mjs | tee "$RUNNER_TEMP/g07-b.log"
          cmp "$RUNNER_TEMP/g07-a.log" "$RUNNER_TEMP/g07-b.log"
      - name: Install pinned Terrain3D
        run: |
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | grep -F 'TERRAIN3D_VERIFY_OK'
      - name: Download Godot 4.6.3
        run: |
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real Terrain3D import save bake twice
        run: |
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G07_ROAD_PATH_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g07_terrain3d_road_path.gd | tee "$RUNNER_TEMP/t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g07-road-path-imported-topdown.png "$RUNNER_TEMP/g07-a.png"
          G07_ROAD_PATH_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g07_terrain3d_road_path.gd | tee "$RUNNER_TEMP/t3d-b.log"
          cmp "$RUNNER_TEMP/g07-a.png" godot/terrain-authoring/.terrain3d-proof/g07-road-path-imported-topdown.png
          grep -F 'SW_G07_TERRAIN3D_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/t3d-a.log"
          grep -F 'SW_G07_TERRAIN3D_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/t3d-b.log"
      - name: HTerrain and world safety regression
        run: |
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK'
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
      - name: Final exact-main gate
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-g07-terrain3d-road-path-proof
          path: |
            godot/terrain-authoring/.terrain3d-proof/g07-road-path-probe.json
            godot/terrain-authoring/.terrain3d-proof/g07-road-path-imported-topdown.png
          if-no-files-found: warn
