name: Player Combat Intent Arbitration

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatIntentArbitration.js'
      - 'scripts/checkPlayerCombatIntentArbitration.mjs'
      - '.github/workflows/player-combat-intent-arbitration.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerCombatIntentArbitration.js'
      - 'scripts/checkPlayerCombatIntentArbitration.mjs'
      - '.github/workflows/player-combat-intent-arbitration.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate changed-file budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatIntentArbitration.js
          node --check scripts/checkPlayerCombatIntentArbitration.mjs
      - name: Contract
        run: node scripts/checkPlayerCombatIntentArbitration.mjs
      - name: Runtime editor boundary
        run: '! grep -R "EditorMaterialStudio\\|MaterialAssignmentCore\\|WorldAssetPlacementPipeline" src/3d/gameplay/playerCombatIntentArbitration.js'
