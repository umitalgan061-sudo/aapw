name: Terrain Authoring GlobalMap Bake 008

on:
  push:
    branches:
      - 'terrain-authoring/globalmap-bake-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terrain-authoring-globalmap-bake-008-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul
  BASE_SHA: ec2d569e334dd75e14a218b9d9e9519b058a5c39

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main concurrency and additive entry gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

      - name: Source and scope contract
        run: |
          set -euo pipefail
          test -f godot/terrain-authoring/addons/zylann.hterrain/plugin.cfg
          test -f godot/terrain-authoring/addons/zylann.hterrain/tools/globalmap_baker.gd
          test -f godot/terrain-authoring/scripts/build_authored_terrain_probe.gd
          test -f godot/terrain-authoring/scripts/bake_authored_globalmap_probe.gd
          test -f godot/terrain-authoring/scripts/validate_terrain_polish_iteration_08.gd
          grep -F 'TERRAIN_GLOBALMAP_BAKE_OK' godot/terrain-authoring/scripts/bake_authored_globalmap_probe.gd
          grep -F 'TERRAIN_POLISH_ITERATION_08_OK' godot/terrain-authoring/scripts/validate_terrain_polish_iteration_08.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"
          DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import and base HTerrain validation
        run: |
          set -euo pipefail
          PROJECT='godot/terrain-authoring/project.godot'
          BACKUP="$RUNNER_TEMP/project.godot"
          cp "$PROJECT" "$BACKUP"
          restore() { cp "$BACKUP" "$PROJECT"; }
          trap restore EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('godot/terrain-authoring/project.godot')
          s = p.read_text(encoding='utf-8')
          expected = 'enabled=PackedStringArray("res://addons/zylann.hterrain/plugin.cfg")'
          assert expected in s
          p.write_text(s.replace(expected, 'enabled=PackedStringArray()'), encoding='utf-8')
          PY
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import
          restore
          trap - EXIT
          git diff --exit-code -- "$PROJECT"
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/base.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/base.log"

      - name: Bake global map twice and prove determinism
        run: |
          set -euo pipefail
          PROBE='godot/terrain-authoring/terrain_polish_probe_007'
          A="$RUNNER_TEMP/global_albedo_a.png"
          B="$RUNNER_TEMP/global_albedo_b.png"
          cleanup() { rm -rf "$PROBE"; }
          trap cleanup EXIT
          for PASS in a b; do
            cleanup
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/build_authored_terrain_probe.gd | tee "$RUNNER_TEMP/build-$PASS.log"
            grep -F 'TERRAIN_AUTHORED_PROBE_OK' "$RUNNER_TEMP/build-$PASS.log"
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import >/dev/null
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/bake_authored_globalmap_probe.gd | tee "$RUNNER_TEMP/bake-$PASS.log"
            grep -F 'TERRAIN_GLOBALMAP_BAKE_OK' "$RUNNER_TEMP/bake-$PASS.log"
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_terrain_polish_iteration_08.gd | tee "$RUNNER_TEMP/validate-$PASS.log"
            grep -F 'TERRAIN_POLISH_ITERATION_08_OK' "$RUNNER_TEMP/validate-$PASS.log"
            cp "$PROBE/global_albedo.png" "$RUNNER_TEMP/global_albedo_$PASS.png"
          done
          cmp "$A" "$B"
          cmp "$RUNNER_TEMP/validate-a.log" "$RUNNER_TEMP/validate-b.log"
          sha256sum "$A" "$B"
          mkdir -p "$RUNNER_TEMP/terrain-authoring-008"
          cp "$A" "$RUNNER_TEMP/terrain-authoring-008/global_albedo.png"
          cp "$RUNNER_TEMP/validate-a.log" "$RUNNER_TEMP/terrain-authoring-008/validation.log"
          cleanup
          trap - EXIT
          test ! -e "$PROBE"

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: terrain-authoring-globalmap-008-${{ github.sha }}
          path: ${{ runner.temp }}/terrain-authoring-008
          if-no-files-found: error
          retention-days: 90

      - name: Runtime regression and governance
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkRun280OwnerMapSemanticFingerprint.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js

      - name: Full browser smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")" -ge 34

      - name: Final exact-main and scope gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git ls-files godot/terrain-authoring/terrain_data)" = 'godot/terrain-authoring/terrain_data/.gitkeep'
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data

      - name: Append successful terrain ledger
        run: |
          set -euo pipefail
          LOG='godot/terrain-authoring/TERRAIN_POLISH_LOG.md'
          PROGRESS='3D_GAME_PROGRESS.md'
          if ! grep -Fq '### Iteration #08 —' "$LOG"; then
            cat >> "$LOG" <<'EOF'

### Iteration #08 — 2026-08-12 Europe/Istanbul
**Seçilen iyileştirme:** Production terrain verisini değiştirmeden, Iteration #07 authored height+splat probe'u üzerinde HTerrain'in kendi `GlobalMapBaker` aracını çalıştırıp global albedo haritasının deterministik ve materyal dağılımına duyarlı üretildiğini doğrulamak.
**Neden bu seçildi:** Son iterasyonlarda shader cilaları, starter terrain kalıcılığı, snapshot manifesti ve authored height/splat determinismi doğrulandı. En zayıf noktalar uniform starter global albedo, authored splat'ten global-map bake zincirinin doğrulanmamış olması ve gerçek production authoring öncesi görsel asset determinisminin kanıtsız kalmasıydı. Iteration #07 bu bake geçişini sıradaki güvenli aday olarak önerdi.
**Yapılan değişiklikler:** Yeni `bake_authored_globalmap_probe.gd`, mevcut geçici authored probe'u production scene texture-set/material sözleşmesiyle HTerrain `GlobalMapBaker` üzerinden bake eder. `validate_terrain_polish_iteration_08.gd` persisted RGB8 global albedo'nun uniform starter renkten ayrıldığını ve center/edge materyal farkını koruduğunu doğrular. Workflow bake'i iki kez sıfırdan üretip PNG ve validator çıktısını byte-for-byte karşılaştırır ve görsel artifact yayınlar. HTerrain çekirdeği, production scene, bootstrap ve tracked `terrain_data` değiştirilmedi.
**Test sonucu:** GitHub Actions zinciri Godot 4.6.3 headless import/editor, temel HTerrain doğrulaması, iki bağımsız global-map bake, semantic validator, byte determinism, PWA/cache/installability, mobil performans, seeded determinism, world-reference, terrain-seat, yol ağı, teknik borç ve tam Chromium smoke kontrollerini PASS ederek bu kaydı ekledi.
**Gözlem:** Görsel etki yalnız geçici probe artifact'indedir: uniform `#557340` starter global albedo yerine grass/earth/rock splat dağılımını uzaktan temsil eden materyal-duyarlı global color map oluşur. Production runtime bu turda kasıtlı olarak değişmez.
**Risk / Geri alma notu:** Risk düşüktür; probe CI sonunda silinir ve core addon/production terrain diff'i sıfırdır. GlobalMapBaker viewport tabanlı olduğu için farklı render backend'lerinde byte-level determinism ayrıca izlenmelidir. Değişiklik yeni iteration destek dosyaları ve bu kayıt kaldırılarak geri alınabilir.
**Bir sonraki çalıştırma için öneri:** map.png semantik maskesiyle eşleşen küçük bounded bir production authoring bölgesinde height+splat+global-albedo üçlüsünü üretip iki kamera açısında before/after kanıtı al; Git/LFS kararını bu gerçek bounded örneğin byte büyümesine göre ver.
EOF
          fi
          if ! grep -Fq 'Terrain Authoring Iteration #08' "$PROGRESS"; then
            cat >> "$PROGRESS" <<'EOF'

### Terrain Authoring Iteration #08 — deterministic GlobalMap bake
- HTerrain core/production scene/terrain_data değiştirilmeden geçici authored height+splat probe üzerinde `GlobalMapBaker` doğrulandı.
- Global albedo iki bağımsız üretimde byte-for-byte determinism, persisted RGB8 semantik kontrolü ve runtime governance kapılarından geçti.
- Sonraki adım küçük bounded production authoring örneğinde before/after görsel doğrulamadır.
EOF
          fi
          if git diff --quiet -- "$LOG" "$PROGRESS"; then
            exit 0
          fi
          git config user.name 'terrain-authoring-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$LOG" "$PROGRESS"
          git commit -m 'terrain: record authoring global-map bake iteration 008'
          git push origin HEAD:${GITHUB_REF_NAME}
