name: SE G65 Terrain3D Hydrology R5

on:
  push:
    branches: [agent/kizil-ufuk-g65-hydrology-r5-20260813]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Exact main and source fidelity
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test -n "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          echo "$CHANGED"
          if [[ "$GITHUB_EVENT_NAME" == "push" || "${GITHUB_HEAD_REF:-}" == "agent/kizil-ufuk-g65-hydrology-r5-20260813" ]]; then
            test "$(printf '%s\n' "$CHANGED" | tr '\n' ' ')" = ".github/workflows/se-g65-terrain3d-hydrology-r5.yml godot/terrain-authoring/geocells/se/g65_hydrology.mjs godot/terrain-authoring/scripts/validate_g65_terrain3d_hydrology.gd scripts/checkSEG65Hydrology.mjs "
            echo "SE_G65_BOUNDED_SCOPE_MODE=1"
          else
            echo "SE_G65_REGRESSION_MODE=1"
          fi
          node --check godot/terrain-authoring/geocells/se/g65_hydrology.mjs
          node --check scripts/checkSEG65Hydrology.mjs
          node scripts/checkSEG65Hydrology.mjs
      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only
      - name: Godot 4.6.3 and real Terrain3D proof
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot" && unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G65_HYDROLOGY_PROOF_SUFFIX=a "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_hydrology.gd
          G65_HYDROLOGY_PROOF_SUFFIX=b "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_hydrology.gd
          "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd
      - name: Install browser regression runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: World PWA settlement road mobile browser and final freshness
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
