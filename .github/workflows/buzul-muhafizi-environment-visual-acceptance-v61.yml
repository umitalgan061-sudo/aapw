name: Buzul Muhafızı — environment visual acceptance v61
on:
  pull_request:
    paths:
      - 'src/3d/world/environmentVisualAcceptanceV61.js'
      - 'scripts/checkEnvironmentVisualAcceptanceV61.mjs'
      - '.github/workflows/buzul-muhafizi-environment-visual-acceptance-v61.yml'
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax
        run: |
          node --check src/3d/world/environmentVisualAcceptanceV61.js
          node --check scripts/checkEnvironmentVisualAcceptanceV61.mjs
      - name: Executable regression
        run: node scripts/checkEnvironmentVisualAcceptanceV61.mjs
      - name: Ownership boundary
        run: |
          ! grep -R "EditorMaterialStudio.js" -n src/3d/world/environmentVisualAcceptanceV61.js
          ! grep -E "(terrain\.js|water\.js|sceneManager\.js|naturalGeology\.js|rivers\.js|roads\.js)" -n src/3d/world/environmentVisualAcceptanceV61.js
          grep -q "merged-590-authority" src/3d/world/environmentVisualAcceptanceV61.js
      - name: Diff hygiene
        run: |
          git diff --check
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
