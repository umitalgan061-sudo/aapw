name: Şafak Kartalı Living World Director

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldDirector.js'
      - 'src/3d/gameplay/livingWorldThreatMemory.js'
      - 'src/3d/gameplay/livingWorldPopulationBudget.js'
      - 'src/3d/gameplay/livingWorldCrimeReputationPolicy.js'
      - 'src/3d/gameplay/livingWorldAssetPlacementContract.js'
      - 'src/3d/gameplay/livingWorldSettlementAffinity.js'
      - 'src/3d/gameplay/livingWorldReplay.js'
      - 'scripts/checkLivingWorldDirector.mjs'
      - '.github/workflows/safak-kartali-living-world-director.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  living-world-director:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify base freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"
      - name: Node syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/livingWorldDirector.js
          node --check src/3d/gameplay/livingWorldThreatMemory.js
          node --check src/3d/gameplay/livingWorldPopulationBudget.js
          node --check src/3d/gameplay/livingWorldCrimeReputationPolicy.js
          node --check src/3d/gameplay/livingWorldAssetPlacementContract.js
          node --check src/3d/gameplay/livingWorldSettlementAffinity.js
          node --check src/3d/gameplay/livingWorldReplay.js
          node --check scripts/checkLivingWorldDirector.mjs
      - name: Living world vertical slice
        run: node scripts/checkLivingWorldDirector.mjs
      - name: Existing reaction runtime regressions
        shell: bash
        run: |
          node scripts/checkLivingWorldReactionRuntime.mjs
          node scripts/checkLivingWorldReactionScenarioMatrix.mjs
          node scripts/checkLivingWorldReactionTelemetryContract.mjs
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Browser runtime evidence
        run: node scripts/checkLivingWorldReactionBrowser.mjs
      - name: Run 283 Final Head Governance Gate
        run: node scripts/checkRun283FinalHeadGovernance.js
      - name: Runtime boundary and diff budget
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio" -n src/3d/gameplay/livingWorldDirector.js src/3d/gameplay/livingWorldThreatMemory.js src/3d/gameplay/livingWorldPopulationBudget.js src/3d/gameplay/livingWorldCrimeReputationPolicy.js src/3d/gameplay/livingWorldAssetPlacementContract.js src/3d/gameplay/livingWorldSettlementAffinity.js src/3d/gameplay/livingWorldReplay.js
          grep -q "MaterialAssignmentCore.js" src/3d/gameplay/livingWorldAssetPlacementContract.js
          grep -q "WorldAssetPlacementPipeline.js" src/3d/gameplay/livingWorldAssetPlacementContract.js
          lines=$(git diff --numstat "${{ github.event.pull_request.base.sha }}" HEAD -- src/3d/gameplay scripts/checkLivingWorldDirector.mjs .github/workflows/safak-kartali-living-world-director.yml | awk '{a+=$1;d+=$2} END {print a+d+0}')
          echo "changed-lines=$lines"
          test "$lines" -le 3000
          git diff --check
      - name: Determinism smoke
        run: node scripts/checkLivingWorldDirector.mjs
