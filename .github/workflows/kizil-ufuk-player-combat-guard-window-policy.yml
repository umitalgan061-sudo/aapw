name: Kızıl Ufuk Player Combat Guard Window Policy

on:
  push:
    branches:
      - agent/kizil-ufuk-guard-window-policy-20260916-r11
  pull_request:
    paths:
      - src/3d/gameplay/playerCombatGuardWindowPolicy.js
      - scripts/checkKizilUfukPlayerCombatGuardWindowPolicy.mjs
      - .github/workflows/kizil-ufuk-player-combat-guard-window-policy.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/playerCombatGuardWindowPolicy.js
          node --check scripts/checkKizilUfukPlayerCombatGuardWindowPolicy.mjs
      - name: Runtime proof
        run: node scripts/checkKizilUfukPlayerCombatGuardWindowPolicy.mjs
      - name: Scope and boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          if git diff --unified=0 origin/main...HEAD | grep -q 'EditorMaterialStudio.js'; then
            echo 'EditorMaterialStudio runtime boundary violated'
            exit 1
          fi
          git diff --check origin/main...HEAD
