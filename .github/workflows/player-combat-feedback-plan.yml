name: Player Combat Feedback Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFeedbackPlan.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'scripts/checkPlayerCombatFeedbackPlan.mjs'
      - '.github/workflows/player-combat-feedback-plan.yml'

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact PR ancestry
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Run focused proof
        run: node --experimental-strip-types scripts/checkPlayerCombatFeedbackPlan.mjs
      - name: Syntax check typed gameplay
        run: node --check src/3d/gameplay/playerCombatFeedbackPlan.ts
