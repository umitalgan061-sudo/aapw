name: Temporary aerial ecology and snow realism patch

on:
  push:
    branches:
      - codex/aapw-realism-20260831-ocean

permissions:
  contents: write

jobs:
  patch-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aapw-realism-20260831-ocean
          fetch-depth: 0
      - name: Fast-forward live branch
        run: git pull --ff-only origin codex/aapw-realism-20260831-ocean
      - name: Patch production realism
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Shared terrain/vegetation ecological suitability. This is render/scatter only.
          biome = 'src/3d/world/terrainBiomeShading.js'
          replace_once(
              biome,
              "\tforestMaxStrength: 0.88,\n\tgrassVariationFrequency: 0.00042,",
              "\tforestMaxStrength: 0.88,\n\tforestSuitabilitySharedWithVegetation: true,\n\tgrassVariationFrequency: 0.00042,",
          )
          replace_once(
              biome,
              "const scratchRock = new THREE.Color();",
              """/**\n * Shared render/scatter suitability for woodland. Terrain tint and physical tree placement consume\n * the same deterministic field so aerial forest colour cannot drift away from the actual canopy.\n * It is deliberately advisory: canonical biome, terrain height, hydrology and colliders remain\n * untouched.\n */\nexport function terrainForestSuitabilityAtWorldXZ({\n\tworldX = 0,\n\tworldZ = 0,\n\theightAboveSeaMeters = 0,\n\tslopeDegrees = 0,\n} = {}) {\n\tconst P = TERRAIN_BIOME_SHADING_POLICY;\n\tconst climate = northReferenceCryosphereAtWorldXZ(worldX, worldZ);\n\tconst forestNoise01 = signedFbmNoise(\n\t\tworldX * P.forestPatchFrequency - 13.1,\n\t\tworldZ * P.forestPatchFrequency + 7.4,\n\t\tP.forestPatchOctaves,\n\t) * 0.5 + 0.5;\n\tconst forestPatch = smoothstep(P.forestPatchStart, P.forestPatchFull, forestNoise01);\n\tconst notCliff = 1 - smoothstep(P.forestSlopeFalloffStartDegrees, P.forestSlopeFalloffFullDegrees, slopeDegrees);\n\tconst belowTreeLine = 1 - smoothstep(P.forestTreeLineStartMeters, P.forestTreeLineFullMeters, heightAboveSeaMeters);\n\treturn clamp01(\n\t\tforestPatch * notCliff * belowTreeLine * P.forestMaxStrength\n\t\t* (1 - climate.permanentIce) * (1 - climate.tundra * 0.62),\n\t);\n}\n\nconst scratchRock = new THREE.Color();""",
          )
          replace_once(
              biome,
              """\tconst forestNoise01 = signedFbmNoise(worldX * P.forestPatchFrequency - 13.1, worldZ * P.forestPatchFrequency + 7.4, P.forestPatchOctaves) * 0.5 + 0.5;\n\tconst forestPatch = smoothstep(P.forestPatchStart, P.forestPatchFull, forestNoise01);\n\tconst notCliff = 1 - smoothstep(P.forestSlopeFalloffStartDegrees, P.forestSlopeFalloffFullDegrees, slope);\n\tconst belowTreeLine = 1 - smoothstep(P.forestTreeLineStartMeters, P.forestTreeLineFullMeters, height);\n\tconst forestAmount = forestPatch * notCliff * belowTreeLine * P.forestMaxStrength * (1 - permanentNorth) * (1 - tundraNorth * 0.62);""",
              """\tconst forestAmount = terrainForestSuitabilityAtWorldXZ({\n\t\tworldX,\n\t\tworldZ,\n\t\theightAboveSeaMeters: height,\n\t\tslopeDegrees: slope,\n\t});""",
          )

          vegetation = 'src/3d/world/vegetation.js'
          replace_once(
              vegetation,
              "import { northClimateWeightsAtWorldZ } from './terrainBiomeShading.js';",
              "import { northClimateWeightsAtWorldZ, terrainForestSuitabilityAtWorldXZ } from './terrainBiomeShading.js';",
          )
          replace_once(
              vegetation,
              "\tid: 'vegetation-ecological-grove-scatter-2026-08-26-v1',",
              "\tid: 'vegetation-ecological-grove-scatter-2026-09-02-v2-terrain-coherent',",
          )
          replace_once(
              vegetation,
              "\tcoldBackgroundChance: 0.18,\n});",
              "\tcoldBackgroundChance: 0.18,\n\tterrainForestSuitability: true,\n\tbestCandidateEcologySelection: true,\n\tanisotropicSilhouetteScale: true,\n});",
          )
          old_placeability = """export function isPlaceablePosition(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges }) {\n\tfor (const seat of seats) {\n\t\tif (Math.hypot(x - seat.x, z - seat.z) < SEAT_EXCLUSION_RADIUS_METERS) return false;\n\t}\n\tfor (const edge of roadEdges) {\n\t\tconst points = edge.points;\n\t\tfor (let i = 1; i < points.length; i++) {\n\t\t\tconst distance = distancePointToSegment2D(x, z, points[i - 1].x, points[i - 1].z, points[i].x, points[i].z);\n\t\t\tif (distance < ROAD_EXCLUSION_RADIUS_METERS) return false;\n\t\t}\n\t}\n\tconst groundY = sampleHeightMeters(x, z);\n\tif (groundY <= seaLevelMeters + SHORE_MARGIN_METERS) return false;\n\n\tconst dxHeight = sampleHeightMeters(x + SLOPE_SAMPLE_OFFSET_METERS, z) - groundY;\n\tconst dzHeight = sampleHeightMeters(x, z + SLOPE_SAMPLE_OFFSET_METERS) - groundY;\n\tconst gradeXDegrees = (Math.atan2(Math.abs(dxHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\tconst gradeZDegrees = (Math.atan2(Math.abs(dzHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\treturn Math.max(gradeXDegrees, gradeZDegrees) <= MAX_GROUND_SLOPE_DEGREES;\n}\n"""
          new_placeability = """function vegetationSiteProfile(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges }) {\n\tfor (const seat of seats) {\n\t\tif (Math.hypot(x - seat.x, z - seat.z) < SEAT_EXCLUSION_RADIUS_METERS) {\n\t\t\treturn { placeable: false, forestSuitability: 0, slopeDegrees: 90 };\n\t\t}\n\t}\n\tfor (const edge of roadEdges) {\n\t\tconst points = edge.points;\n\t\tfor (let i = 1; i < points.length; i++) {\n\t\t\tconst distance = distancePointToSegment2D(x, z, points[i - 1].x, points[i - 1].z, points[i].x, points[i].z);\n\t\t\tif (distance < ROAD_EXCLUSION_RADIUS_METERS) {\n\t\t\t\treturn { placeable: false, forestSuitability: 0, slopeDegrees: 90 };\n\t\t\t}\n\t\t}\n\t}\n\tconst groundY = sampleHeightMeters(x, z);\n\tif (groundY <= seaLevelMeters + SHORE_MARGIN_METERS) {\n\t\treturn { placeable: false, forestSuitability: 0, slopeDegrees: 90 };\n\t}\n\n\tconst dxHeight = sampleHeightMeters(x + SLOPE_SAMPLE_OFFSET_METERS, z) - groundY;\n\tconst dzHeight = sampleHeightMeters(x, z + SLOPE_SAMPLE_OFFSET_METERS) - groundY;\n\tconst gradeXDegrees = (Math.atan2(Math.abs(dxHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\tconst gradeZDegrees = (Math.atan2(Math.abs(dzHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\tconst slopeDegrees = Math.max(gradeXDegrees, gradeZDegrees);\n\tif (slopeDegrees > MAX_GROUND_SLOPE_DEGREES) {\n\t\treturn { placeable: false, forestSuitability: 0, slopeDegrees };\n\t}\n\treturn {\n\t\tplaceable: true,\n\t\tslopeDegrees,\n\t\tforestSuitability: terrainForestSuitabilityAtWorldXZ({\n\t\t\tworldX: x,\n\t\t\tworldZ: z,\n\t\t\theightAboveSeaMeters: groundY - seaLevelMeters,\n\t\t\tslopeDegrees,\n\t\t}),\n\t};\n}\n\nexport function isPlaceablePosition(x, z, context) {\n\treturn vegetationSiteProfile(x, z, context).placeable;\n}\n"""
          replace_once(vegetation, old_placeability, new_placeability)
          replace_once(
              vegetation,
              """\tconst scale = SCALE_MIN + rng() * (SCALE_MAX - SCALE_MIN);\n\tconst yaw = rng() * Math.PI * 2;\n\tposition.set(x, groundY, z);\n\tquaternion.setFromAxisAngle(up, yaw);\n\tscaleVector.set(scale, scale, scale);""",
              """\tconst scale = SCALE_MIN + rng() * (SCALE_MAX - SCALE_MIN);\n\tconst yaw = rng() * Math.PI * 2;\n\tconst widthScale = scale * (0.88 + rng() * 0.24);\n\tconst heightScale = scale * (0.91 + rng() * 0.24);\n\tconst depthScale = scale * (0.90 + rng() * 0.20);\n\tposition.set(x, groundY, z);\n\tquaternion.setFromAxisAngle(up, yaw);\n\tscaleVector.set(widthScale, heightScale, depthScale);""",
          )
          old_loop = """\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\tconst candidate = !groveHasCenter || rng() < groveBackgroundChance\n\t\t\t\t? sampleAnnulusPoint(rng, 0, 0, 0, radiusMeters)\n\t\t\t\t: sampleAnnulusPoint(rng, groveCenterX, groveCenterZ, 0, groveRadiusMeters);\n\t\t\tconst { x, z } = candidate;\n\t\t\tif (Math.hypot(x, z) > radiusMeters) continue;\n\t\t\tif (!isPlaceablePosition(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges })) continue;\n\t\t\tif (!groveHasCenter) {\n\t\t\t\tgroveHasCenter = true;\n\t\t\t\tgroveCenterX = x;\n\t\t\t\tgroveCenterZ = z;\n\t\t\t\tconst pattern = vegetationGrovePatternForClimate(northReferenceCryosphereAtWorldXZ(x, z));\n\t\t\t\tgroveRadiusMeters = pattern.groveRadiusMeters;\n\t\t\t\tgroveBackgroundChance = pattern.backgroundChance;\n\t\t\t}\n\t\t\tconst entry = perSpecies[pickSpeciesIndexForWorldXZ(rng(), x, z)];\n\t\t\tplaceTreeInstance(entry, x, z, sampleHeightMeters, rng, up, matrix, position, quaternion, scaleVector);\n\t\t\tplacedCount++;\n\t\t\tbreak;\n\t\t}\n\t\tgroveTreesRemaining--;"""
          new_loop = """\t\tlet bestCandidate = null;\n\t\tlet bestCandidateScore = -Infinity;\n\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\tconst backgroundCandidate = !groveHasCenter || rng() < groveBackgroundChance;\n\t\t\tconst candidate = backgroundCandidate\n\t\t\t\t? sampleAnnulusPoint(rng, 0, 0, 0, radiusMeters)\n\t\t\t\t: sampleAnnulusPoint(rng, groveCenterX, groveCenterZ, 0, groveRadiusMeters);\n\t\t\tconst { x, z } = candidate;\n\t\t\tif (Math.hypot(x, z) > radiusMeters) continue;\n\t\t\tconst site = vegetationSiteProfile(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges });\n\t\t\tif (!site.placeable) continue;\n\t\t\t// Keep a little deterministic exploration so low-suitability clearings remain possible, but\n\t\t\t// strongly prefer the exact forest field that shades the canonical terrain beneath the tree.\n\t\t\tconst ecologyScore = site.forestSuitability + rng() * 0.10 + (backgroundCandidate ? 0 : 0.035);\n\t\t\tif (ecologyScore > bestCandidateScore) {\n\t\t\t\tbestCandidate = candidate;\n\t\t\t\tbestCandidateScore = ecologyScore;\n\t\t\t}\n\t\t}\n\t\tif (bestCandidate) {\n\t\t\tconst { x, z } = bestCandidate;\n\t\t\tif (!groveHasCenter) {\n\t\t\t\tgroveHasCenter = true;\n\t\t\t\tgroveCenterX = x;\n\t\t\t\tgroveCenterZ = z;\n\t\t\t\tconst pattern = vegetationGrovePatternForClimate(northReferenceCryosphereAtWorldXZ(x, z));\n\t\t\t\tgroveRadiusMeters = pattern.groveRadiusMeters;\n\t\t\t\tgroveBackgroundChance = pattern.backgroundChance;\n\t\t\t}\n\t\t\tconst entry = perSpecies[pickSpeciesIndexForWorldXZ(rng(), x, z)];\n\t\t\tplaceTreeInstance(entry, x, z, sampleHeightMeters, rng, up, matrix, position, quaternion, scaleVector);\n\t\t\tplacedCount++;\n\t\t}\n\t\tgroveTreesRemaining--;"""
          replace_once(vegetation, old_loop, new_loop)
          old_seat = """\tfor (const seat of clusterSeats) {\n\t\tfor (let treeIndex = 0; treeIndex < clusterTargetPerSeat; treeIndex++) {\n\t\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\t\tconst { x, z } = sampleAnnulusPoint(clusterRng, seat.x, seat.z, clusterInnerRadius, CLUSTER_RING_OUTER_RADIUS_METERS);\n\t\t\t\tif (!isPlaceablePosition(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges })) continue;\n\t\t\t\tconst entry = perSpecies[pickSpeciesIndexForWorldXZ(clusterRng(), x, z)];\n\t\t\t\tplaceTreeInstance(entry, x, z, sampleHeightMeters, clusterRng, up, matrix, position, quaternion, scaleVector);\n\t\t\t\tplacedCount++;\n\t\t\t\tbreak;\n\t\t\t}\n\t\t}\n\t}"""
          new_seat = """\tfor (const seat of clusterSeats) {\n\t\tfor (let treeIndex = 0; treeIndex < clusterTargetPerSeat; treeIndex++) {\n\t\t\tlet bestCandidate = null;\n\t\t\tlet bestCandidateScore = -Infinity;\n\t\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\t\tconst candidate = sampleAnnulusPoint(clusterRng, seat.x, seat.z, clusterInnerRadius, CLUSTER_RING_OUTER_RADIUS_METERS);\n\t\t\t\tconst { x, z } = candidate;\n\t\t\t\tconst site = vegetationSiteProfile(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges });\n\t\t\t\tif (!site.placeable) continue;\n\t\t\t\tconst ecologyScore = site.forestSuitability + clusterRng() * 0.10;\n\t\t\t\tif (ecologyScore > bestCandidateScore) {\n\t\t\t\t\tbestCandidate = candidate;\n\t\t\t\t\tbestCandidateScore = ecologyScore;\n\t\t\t\t}\n\t\t\t}\n\t\t\tif (!bestCandidate) continue;\n\t\t\tconst { x, z } = bestCandidate;\n\t\t\tconst entry = perSpecies[pickSpeciesIndexForWorldXZ(clusterRng(), x, z)];\n\t\t\tplaceTreeInstance(entry, x, z, sampleHeightMeters, clusterRng, up, matrix, position, quaternion, scaleVector);\n\t\t\tplacedCount++;\n\t\t}\n\t}"""
          replace_once(vegetation, old_seat, new_seat)
          replace_once(
              vegetation,
              "\t\tgroveTreeCountMax: spatialPolicy.groveTreeCountMax,\n\t});",
              "\t\tgroveTreeCountMax: spatialPolicy.groveTreeCountMax,\n\t\tterrainForestSuitability: true,\n\t\tbestCandidateEcologySelection: true,\n\t\tanisotropicSilhouetteScale: true,\n\t});",
          )
          replace_once(
              'scripts/checkVegetationEcologicalGroves.mjs',
              "assert.equal(VEGETATION_SPATIAL_PATTERN_POLICY.id, 'vegetation-ecological-grove-scatter-2026-08-26-v1');",
              "assert.equal(VEGETATION_SPATIAL_PATTERN_POLICY.id, 'vegetation-ecological-grove-scatter-2026-09-02-v2-terrain-coherent');",
          )

          # 2) Snow/firn material breakup: colour, roughness and explicit world-space micro-normal only.
          micro = 'src/3d/world/terrainMicroSurface.js'
          replace_once(
              micro,
              "\tid: 'terrain-micro-surface-world-uv-pbr-v7-coastal-weathering',",
              "\tid: 'terrain-micro-surface-world-uv-pbr-v8-cryosphere-firn-weathering',",
          )
          replace_once(
              micro,
              "\tsnowScourReadability: true,\n\tslopeAwareCliffWeathering: true,",
              "\tsnowScourReadability: true,\n\tsnowFirnMaterialBreakup: true,\n\tsnowSastrugiMicroNormal: true,\n\tsnowCrustPowderRoughness: true,\n\tslopeAwareCliffWeathering: true,",
          )
          replace_once(micro, "terrain-world-micro-normal-v7-coastal-weathering", "terrain-world-micro-normal-v8-cryosphere-firn-weathering")
          replace_once(micro, "terrain-world-micro-roughness-v7-coastal-weathering", "terrain-world-micro-roughness-v8-cryosphere-firn-weathering")
          replace_once(micro, "terrain-photoreal-world-surface-v7-coastal-weathering", "terrain-photoreal-world-surface-v8-cryosphere-firn-weathering")
          old_snow = """vec3 terrainPhotoSnowCold = vec3(0.640, 0.688, 0.718);\nvec3 terrainPhotoSnowSun = vec3(0.790, 0.802, 0.794);\nvec3 terrainPhotoSnowBase = mix(terrainPhotoSnowCold, terrainPhotoSnowSun, terrainPhotoRegional * 0.62 + terrainPhotoBroad * 0.38);\ndiffuseColor.rgb = mix(diffuseColor.rgb, terrainPhotoSnowBase, terrainPhotoSnow * 0.30);\nfloat terrainPhotoSnowShadow = terrainPhotoSnow * smoothstep(0.46, 0.80, 1.0 - terrainPhotoLandform);\nfloat terrainPhotoSnowDust = terrainPhotoSnow * smoothstep(0.67, 0.88, terrainPhotoBroad) * smoothstep(0.64, 0.86, terrainPhotoGrain);\nfloat terrainPhotoSnowScour = terrainPhotoSnow * terrainPhotoHighAlpine * smoothstep(0.56, 0.82, terrainPhotoMacro);\nfloat terrainPhotoSnowRockReveal = terrainPhotoSnow * terrainPhotoSteep\n\t* smoothstep(0.48, 0.78, terrainPhotoRidgeNoise(terrainPhotoWarpedXZ / 175.0 + vec2(13.1, -8.6)));\nfloat terrainPhotoSnowDeposit = terrainPhotoSnow * (1.0 - terrainPhotoShoulder)\n\t* smoothstep(0.55, 0.82, 1.0 - terrainPhotoDrainage);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.475, 0.540, 0.578), terrainPhotoSnowShadow * 0.25);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.392, 0.390, 0.370), terrainPhotoSnowDust * 0.11);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.540, 0.580, 0.596), terrainPhotoSnowScour * 0.16);\ndiffuseColor.rgb = mix(diffuseColor.rgb, terrainPhotoRockTone, terrainPhotoSnowRockReveal * 0.46);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.805, 0.820, 0.820), terrainPhotoSnowDeposit * 0.12);"""
          new_snow = """vec3 terrainPhotoSnowCold = vec3(0.640, 0.688, 0.718);\nvec3 terrainPhotoSnowSun = vec3(0.790, 0.802, 0.794);\nvec3 terrainPhotoSnowBase = mix(terrainPhotoSnowCold, terrainPhotoSnowSun, terrainPhotoRegional * 0.62 + terrainPhotoBroad * 0.38);\ndiffuseColor.rgb = mix(diffuseColor.rgb, terrainPhotoSnowBase, terrainPhotoSnow * 0.30);\nfloat terrainPhotoSnowShadow = terrainPhotoSnow * smoothstep(0.46, 0.80, 1.0 - terrainPhotoLandform);\nfloat terrainPhotoSnowDust = terrainPhotoSnow * smoothstep(0.67, 0.88, terrainPhotoBroad) * smoothstep(0.64, 0.86, terrainPhotoGrain);\nfloat terrainPhotoSnowScour = terrainPhotoSnow * terrainPhotoHighAlpine * smoothstep(0.56, 0.82, terrainPhotoMacro);\nfloat terrainPhotoSnowRockReveal = terrainPhotoSnow * terrainPhotoSteep\n\t* smoothstep(0.48, 0.78, terrainPhotoRidgeNoise(terrainPhotoWarpedXZ / 175.0 + vec2(13.1, -8.6)));\nfloat terrainPhotoSnowDeposit = terrainPhotoSnow * (1.0 - terrainPhotoShoulder)\n\t* smoothstep(0.55, 0.82, 1.0 - terrainPhotoDrainage);\n// Keep authoritative snow coverage untouched and vary only the visible material family. Broad firn\n// fields, steep blue-ice windows, wind crust and sheltered powder use unrelated world-space scales\n// so the cryosphere cannot collapse into one bright, uniform aerial patch.\nfloat terrainPhotoFirnField = terrainPhotoFbm(terrainPhotoWarpedXZ / 510.0 + vec2(-22.7, 12.9));\nfloat terrainPhotoCrustField = terrainPhotoRidgeNoise(terrainPhotoWarpedXZ / 145.0 + vec2(7.3, -19.1));\nfloat terrainPhotoPowderField = terrainPhotoFbm(terrainPhotoWarpedXZ / 225.0 + vec2(28.4, 6.7));\nfloat terrainPhotoSnowFirn = terrainPhotoSnow * (0.30 + terrainPhotoHighAlpine * 0.70)\n\t* smoothstep(0.45, 0.76, terrainPhotoFirnField);\nfloat terrainPhotoSnowBlueIce = terrainPhotoSnow * terrainPhotoSteep\n\t* smoothstep(0.58, 0.84, terrainPhotoCrustField) * (0.42 + terrainPhotoHighAlpine * 0.58);\nfloat terrainPhotoSnowSastrugi = terrainPhotoSnow * terrainPhotoShoulder\n\t* smoothstep(0.54, 0.82, terrainPhotoMeso * 0.56 + terrainPhotoCrustField * 0.44);\nfloat terrainPhotoSnowPowder = terrainPhotoSnow * (1.0 - terrainPhotoShoulder * 0.72)\n\t* smoothstep(0.52, 0.80, terrainPhotoPowderField) * smoothstep(0.46, 0.80, 1.0 - terrainPhotoDrainage);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.475, 0.540, 0.578), terrainPhotoSnowShadow * 0.25);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.392, 0.390, 0.370), terrainPhotoSnowDust * 0.11);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.540, 0.580, 0.596), terrainPhotoSnowScour * 0.16);\ndiffuseColor.rgb = mix(diffuseColor.rgb, terrainPhotoRockTone, terrainPhotoSnowRockReveal * 0.46);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.805, 0.820, 0.820), terrainPhotoSnowDeposit * 0.12);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.505, 0.568, 0.596), terrainPhotoSnowFirn * 0.20);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.365, 0.488, 0.548), terrainPhotoSnowBlueIce * 0.20);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.565, 0.604, 0.614), terrainPhotoSnowSastrugi * 0.14);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.820, 0.832, 0.826), terrainPhotoSnowPowder * 0.13);"""
          replace_once(micro, old_snow, new_snow)
          replace_once(
              micro,
              """float terrainPhotoWetPolish = terrainPhotoCoastalWet * 0.085 + terrainPhotoTideStain * 0.095\n\t+ terrainPhotoCoastalRockWet * 0.055 + terrainPhotoRunnel * 0.10 + terrainPhotoAlluvialWash * 0.055;\nfloat terrainPhotoRockPolish = terrainPhotoRockFace * terrainPhotoMoisture * 0.045;\nfloat terrainPhotoSaltCrustRoughness = terrainPhotoSaltSpray * 0.065;\nfloat terrainPhotoGranularRoughness = terrainPhotoScreeBand * 0.055 + terrainPhotoSnowDeposit * 0.025\n\t+ terrainPhotoDryShoulder * 0.045 + terrainPhotoSaltCrustRoughness;\nroughnessFactor = clamp(\n\troughnessFactor - terrainPhotoWetPolish - terrainPhotoRockPolish + terrainPhotoGranularRoughness,\n\t0.48,\n\t1.0\n);""",
              """float terrainPhotoWetPolish = terrainPhotoCoastalWet * 0.085 + terrainPhotoTideStain * 0.095\n\t+ terrainPhotoCoastalRockWet * 0.055 + terrainPhotoRunnel * 0.10 + terrainPhotoAlluvialWash * 0.055;\nfloat terrainPhotoRockPolish = terrainPhotoRockFace * terrainPhotoMoisture * 0.045;\nfloat terrainPhotoSaltCrustRoughness = terrainPhotoSaltSpray * 0.065;\nfloat terrainPhotoSnowCrustPolish = terrainPhotoSnowFirn * 0.045 + terrainPhotoSnowBlueIce * 0.105\n\t+ terrainPhotoSnowSastrugi * 0.035;\nfloat terrainPhotoSnowPowderRoughness = terrainPhotoSnowPowder * 0.075 + terrainPhotoSnowDeposit * 0.035;\nfloat terrainPhotoGranularRoughness = terrainPhotoScreeBand * 0.055 + terrainPhotoSnowDeposit * 0.025\n\t+ terrainPhotoDryShoulder * 0.045 + terrainPhotoSaltCrustRoughness + terrainPhotoSnowPowderRoughness;\nroughnessFactor = clamp(\n\troughnessFactor - terrainPhotoWetPolish - terrainPhotoRockPolish - terrainPhotoSnowCrustPolish + terrainPhotoGranularRoughness,\n\t0.46,\n\t1.0\n);""",
          )
          replace_once(
              micro,
              """\t\t\t.replace(\n\t\t\t\t'#include <roughnessmap_fragment>',""",
              """\t\t\t.replace(\n\t\t\t\t'#include <normal_fragment_maps>',\n\t\t\t\t`#include <normal_fragment_maps>\nfloat terrainPhotoSnowNormalX = terrainPhotoNoise(terrainPhotoXZ / 7.5 + vec2(0.17, 0.0))\n\t- terrainPhotoNoise(terrainPhotoXZ / 7.5 - vec2(0.17, 0.0));\nfloat terrainPhotoSnowNormalZ = terrainPhotoNoise(terrainPhotoXZ / 7.5 + vec2(0.0, 0.17))\n\t- terrainPhotoNoise(terrainPhotoXZ / 7.5 - vec2(0.0, 0.17));\nfloat terrainPhotoSnowNormalGain = terrainPhotoSnow * (0.026 + terrainPhotoSnowSastrugi * 0.065 + terrainPhotoSnowFirn * 0.028);\nnormal = normalize(normal + mat3(viewMatrix) * vec3(terrainPhotoSnowNormalX, 0.0, terrainPhotoSnowNormalZ) * terrainPhotoSnowNormalGain);`,\n\t\t\t)\n\t\t\t.replace(\n\t\t\t\t'#include <roughnessmap_fragment>',""",
          )
          replace_once(
              micro,
              "\t\tsnowScourReadability: true,\n\t\tslopeAwareCliffWeathering: true,",
