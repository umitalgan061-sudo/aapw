name: Player Sprint Dodge Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/player.js'
      - 'src/3d/ui/healthBar.js'
      - 'scripts/checkPlayerSprintDodgeRuntime.mjs'
      - 'scripts/checkHealthBarAccessibility.js'
      - '.github/workflows/player-sprint-dodge.yml'
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: player-sprint-dodge-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env: { TZ: Europe/Istanbul }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/gameplay/player\.js|src/3d/ui/healthBar\.js|scripts/checkPlayerSprintDodgeRuntime\.mjs|scripts/checkHealthBarAccessibility\.js|\.github/workflows/player-sprint-dodge\.yml)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 5
          LINES="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{a+=$1;d+=$2}END{print a+d+0}')"
          echo "PLAYER_SPRINT_DODGE_CHANGED_LINES=$LINES"
          test "$LINES" -le 1000
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Asset-first targeted hydration
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**" --exclude=""
          test -s assets/models/characters/peasant_girl.fbx
          test -s assets/animations/peasant_girl/idle.fbx
          test -s assets/animations/peasant_girl/walking.fbx
          test -s assets/animations/peasant_girl/running.fbx
      - name: Syntax and policy
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/player.js
          node --check src/3d/ui/healthBar.js
          node --check scripts/checkPlayerSprintDodgeRuntime.mjs
          node --check scripts/checkHealthBarAccessibility.js
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped-scene sprint dodge proof
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerSprintDodgeRuntime.mjs --out-dir=artifacts/player-sprint-dodge
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkHealthBarAccessibility.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/game3d-smoke.log"
          grep -F 'PLAYER_SPRINT_DODGE_RUNTIME_OK' <(NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerSprintDodgeRuntime.mjs --out-dir=artifacts/player-sprint-dodge-repeat)
          test -s artifacts/player-sprint-dodge/player-runtime.png
          test -s artifacts/player-sprint-dodge/metrics.json
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-sprint-dodge-proof-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/player-sprint-dodge/
