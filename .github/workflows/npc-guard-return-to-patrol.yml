name: NPC Guard Return To Patrol

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardReturnToPatrol.mjs'
      - '.github/workflows/npc-guard-return-to-patrol.yml'
      - '.github/workflows/npc-movement-safety.yml'
      - '.github/workflows/npc-hearing-framerate-determinism.yml'
      - '.github/workflows/npc-perception-input-safety.yml'

permissions:
  contents: read

concurrency:
  group: npc-guard-return-to-patrol-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Exact-main scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$main_sha"
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" -eq 7
          printf '%s\n' "${files[@]}" | grep -Fx 'src/3d/gameplay/npc.js'
          printf '%s\n' "${files[@]}" | grep -Fx 'scripts/checkNpcGuardLifecycleContract.mjs'
          printf '%s\n' "${files[@]}" | grep -Fx 'scripts/checkNpcGuardReturnToPatrol.mjs'
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/npc-guard-return-to-patrol.yml'
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/npc-movement-safety.yml'
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/npc-hearing-framerate-determinism.yml'
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/npc-perception-input-safety.yml'
          read -r additions deletions < <(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          total=$((additions + deletions))
          echo "scope=${#files[@]} additions=$additions deletions=$deletions total=$total main=$main_sha head=$(git rev-parse HEAD)"
          test "$total" -le 1000

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shipped Three.js runtime dependency
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.180.0

      - name: Syntax
        run: |
          node --check src/3d/gameplay/npc.js
          node --check scripts/checkNpcGuardLifecycleContract.mjs
          node --check scripts/checkNpcGuardReturnToPatrol.mjs

      - name: Guard return-to-patrol runtime regression
        run: node scripts/checkNpcGuardReturnToPatrol.mjs

      - name: Existing guard lifecycle, perception and LOD regressions
        run: |
          node scripts/checkNpcGuardLifecycleContract.mjs
          node scripts/checkNpcGuardPerception.mjs
          node scripts/checkNpcSimulationLod.mjs

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Deterministic runtime source guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'Math\.random\s*\(' src/3d/gameplay/npc.js
          ! grep -n 'EditorMaterialStudio' src/3d/gameplay/npc.js

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
