name: NPC Guard Return To Patrol

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'src/3d/gameplay/npcWorldPlacement.js'
      - 'scripts/checkNpcAssetSpawnContract.mjs'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardReturnToPatrol.mjs'
      - 'scripts/checkNpcPopulationLodRecovery.mjs'
      - 'scripts/checkNpcMovementSafetyBrowser.js'
      - 'scripts/checkNpcWorldPlacementContract.mjs'
      - 'scripts/checkNpcGeographicPlacementDeterminism.mjs'
      - 'scripts/checkNpcGeographicDistributionMatrix.mjs'
      - 'scripts/checkNpcPlacementFailureSafety.mjs'
      - 'scripts/checkNpcConfiguredAssetHydration.mjs'
      - 'scripts/checkNpcMaterialRecipeBrowser.mjs'
      - 'scripts/checkNpcGeographicMaterialBrowser.mjs'
      - 'scripts/checkNpcOwnedOfflineShellDelta.mjs'
      - 'service-worker.js'
      - '.github/workflows/configured-fauna-asset-acceptance.yml'
      - '.github/workflows/npc-asset-spawn-contract.yml'
      - '.github/workflows/npc-guard-assist-lifecycle.yml'
      - '.github/workflows/npc-guard-assist-lod-wake.yml'
      - '.github/workflows/npc-guard-leash.yml'
      - '.github/workflows/npc-guard-lifecycle.yml'
      - '.github/workflows/npc-guard-return-to-patrol.yml'
      - '.github/workflows/npc-geographic-material-placement.yml'
      - '.github/workflows/npc-movement-safety.yml'
      - '.github/workflows/npc-hearing-framerate-determinism.yml'
      - '.github/workflows/npc-perception-input-safety.yml'
      - '.github/workflows/npc-guard-leash-attack-slot-handoff.yml'
      - '.github/workflows/run167-determinism-policy.yml'
      - '.github/workflows/run283-final-head-governance.yml'

permissions:
  contents: read

concurrency:
  group: npc-guard-return-to-patrol-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Exact-main scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$main_sha"
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" -le 29
          allowed='^(src/3d/gameplay/npc\.js|src/3d/gameplay/npcWorldPlacement\.js|scripts/checkNpcAssetSpawnContract\.mjs|scripts/checkNpcGuardLifecycleContract\.mjs|scripts/checkNpcGuardReturnToPatrol\.mjs|scripts/checkNpcPopulationLodRecovery\.mjs|scripts/checkNpcMovementSafetyBrowser\.js|scripts/checkNpcWorldPlacementContract\.mjs|scripts/checkNpcGeographicPlacementDeterminism\.mjs|scripts/checkNpcGeographicDistributionMatrix\.mjs|scripts/checkNpcPlacementFailureSafety\.mjs|scripts/checkNpcConfiguredAssetHydration\.mjs|scripts/checkNpcMaterialRecipeBrowser\.mjs|scripts/checkNpcGeographicMaterialBrowser\.mjs|scripts/checkNpcOwnedOfflineShellDelta\.mjs|service-worker\.js|\.github/workflows/configured-fauna-asset-acceptance\.yml|\.github/workflows/npc-asset-spawn-contract\.yml|\.github/workflows/npc-geographic-material-placement\.yml|\.github/workflows/npc-guard-assist-lifecycle\.yml|\.github/workflows/npc-guard-assist-lod-wake\.yml|\.github/workflows/npc-guard-leash-attack-slot-handoff\.yml|\.github/workflows/npc-guard-leash\.yml|\.github/workflows/npc-guard-lifecycle\.yml|\.github/workflows/npc-guard-return-to-patrol\.yml|\.github/workflows/npc-hearing-framerate-determinism\.yml|\.github/workflows/npc-movement-safety\.yml|\.github/workflows/npc-perception-input-safety\.yml|\.github/workflows/run167-determinism-policy\.yml|\.github/workflows/run283-final-head-governance\.yml)$'
          unexpected="$(printf '%s\n' "${files[@]}" | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'Unexpected path(s):\n%s\n' "$unexpected"; exit 1; }
          read -r additions deletions < <(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          total=$((additions + deletions))
          echo "scope=${#files[@]} additions=$additions deletions=$deletions total=$total main=$main_sha head=$(git rev-parse HEAD)"
          test "$total" -le 3000
          git diff --check origin/main...HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shipped Three.js runtime dependency
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.180.0

      - name: Syntax
        run: |
          node --check src/3d/gameplay/npc.js
          node --check src/3d/gameplay/npcWorldPlacement.js
          node --check scripts/checkNpcGuardLifecycleContract.mjs
          node --check scripts/checkNpcGuardReturnToPatrol.mjs
          node --check scripts/checkNpcPopulationLodRecovery.mjs
          node --check scripts/checkNpcMovementSafetyBrowser.js
          node --check scripts/checkNpcWorldPlacementContract.mjs
          node --check scripts/checkNpcGeographicPlacementDeterminism.mjs
          node --check scripts/checkNpcGeographicDistributionMatrix.mjs
          node --check scripts/checkNpcPlacementFailureSafety.mjs
          node --check scripts/checkNpcOwnedOfflineShellDelta.mjs

      - name: Guard return-to-patrol runtime regression
        run: |
          node scripts/checkNpcGuardReturnToPatrol.mjs
          node scripts/checkNpcPopulationLodRecovery.mjs

      - name: Geographic placement determinism regression
        run: |
          node scripts/checkNpcWorldPlacementContract.mjs
          node scripts/checkNpcGeographicPlacementDeterminism.mjs
          node scripts/checkNpcGeographicDistributionMatrix.mjs
          node scripts/checkNpcPlacementFailureSafety.mjs

      - name: Existing guard lifecycle, perception and LOD regressions
        run: |
          node scripts/checkNpcGuardLifecycleContract.mjs
          node scripts/checkNpcGuardPerception.mjs
          node scripts/checkNpcSimulationLod.mjs

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Deterministic runtime source guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'Math\.random\s*\(' src/3d/gameplay/npc.js src/3d/gameplay/npcWorldPlacement.js
          ! grep -n 'EditorMaterialStudio' src/3d/gameplay/npc.js src/3d/gameplay/npcWorldPlacement.js

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
