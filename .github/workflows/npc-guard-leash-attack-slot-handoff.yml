name: NPC Guard Leash Attack Slot Handoff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'src/3d/gameplay/npcWorldPlacement.js'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardReturnToPatrol.mjs'
      - 'scripts/checkNpcPopulationLodRecovery.mjs'
      - 'scripts/checkNpcMovementSafetyBrowser.js'
      - 'scripts/checkNpcWorldPlacementContract.mjs'
      - 'scripts/checkNpcGeographicPlacementDeterminism.mjs'
      - 'scripts/checkNpcGeographicDistributionMatrix.mjs'
      - 'scripts/checkNpcPlacementFailureSafety.mjs'
      - 'scripts/checkNpcConfiguredAssetHydration.mjs'
      - 'scripts/checkNpcMaterialRecipeBrowser.mjs'
      - 'scripts/checkNpcGeographicMaterialBrowser.mjs'
      - '.github/workflows/configured-fauna-asset-acceptance.yml'
      - '.github/workflows/run167-determinism-policy.yml'
      - '.github/workflows/run283-final-head-governance.yml'
      - '.github/workflows/npc-guard-return-to-patrol.yml'
      - '.github/workflows/npc-geographic-material-placement.yml'
      - '.github/workflows/npc-hearing-framerate-determinism.yml'
      - '.github/workflows/npc-movement-safety.yml'
      - '.github/workflows/npc-perception-input-safety.yml'
      - '.github/workflows/npc-guard-leash-attack-slot-handoff.yml'

permissions:
  contents: read

concurrency:
  group: npc-guard-leash-attack-slot-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Exact-main scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD origin/main)"
          test "$merge_base" = "$main_sha"
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" -le 22
          allowed='^(src/3d/gameplay/npc\.js|src/3d/gameplay/npcWorldPlacement\.js|scripts/checkNpcGuardLifecycleContract\.mjs|scripts/checkNpcGuardReturnToPatrol\.mjs|scripts/checkNpcPopulationLodRecovery\.mjs|scripts/checkNpcMovementSafetyBrowser\.js|scripts/checkNpcWorldPlacementContract\.mjs|scripts/checkNpcGeographicPlacementDeterminism\.mjs|scripts/checkNpcGeographicDistributionMatrix\.mjs|scripts/checkNpcPlacementFailureSafety\.mjs|scripts/checkNpcConfiguredAssetHydration\.mjs|scripts/checkNpcMaterialRecipeBrowser\.mjs|scripts/checkNpcGeographicMaterialBrowser\.mjs|\.github/workflows/configured-fauna-asset-acceptance\.yml|\.github/workflows/run167-determinism-policy\.yml|\.github/workflows/run283-final-head-governance\.yml|\.github/workflows/npc-guard-return-to-patrol\.yml|\.github/workflows/npc-geographic-material-placement\.yml|\.github/workflows/npc-hearing-framerate-determinism\.yml|\.github/workflows/npc-movement-safety\.yml|\.github/workflows/npc-perception-input-safety\.yml|\.github/workflows/npc-guard-leash-attack-slot-handoff\.yml)$'
          unexpected="$(printf '%s\n' "${files[@]}" | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'Unexpected path(s):\n%s\n' "$unexpected"; exit 1; }
          read -r additions deletions < <(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          total=$((additions + deletions))
          echo "scope=${#files[@]} files additions=$additions deletions=$deletions total=$total main=$main_sha head=$(git rev-parse HEAD)"
          test "$total" -le 3000
          git diff --check origin/main...HEAD

      - name: Syntax
        run: |
          node --check src/3d/gameplay/npc.js
          node --check src/3d/gameplay/npcWorldPlacement.js
          node --check scripts/checkNpcGuardLeashAttackSlotHandoff.mjs
          node --check scripts/checkNpcMovementSafetyBrowser.js

      - name: Leash attack-slot handoff regression
        run: node scripts/checkNpcGuardLeashAttackSlotHandoff.mjs

      - name: Existing guard attack and leash regressions
        run: |
          node scripts/checkNpcGuardAttack.mjs
          node scripts/checkNpcGuardLeash.mjs
          node scripts/checkNpcGuardLifecycleContract.mjs
          node scripts/checkNpcWorldPlacementContract.mjs

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Deterministic source guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'Math\.random\s*\(' src/3d/gameplay/npc.js src/3d/gameplay/npcWorldPlacement.js
          ! grep -n 'EditorMaterialStudio' src/3d/gameplay/npc.js src/3d/gameplay/npcWorldPlacement.js

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
