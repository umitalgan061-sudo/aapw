name: settlement dialogue planner
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementDialoguePlanner.js'
      - 'scripts/checkSettlementDialoguePlanner.mjs'
      - '.github/workflows/settlement-dialogue-planner.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/settlementDialoguePlanner.js
      - run: node scripts/checkSettlementDialoguePlanner.mjs
