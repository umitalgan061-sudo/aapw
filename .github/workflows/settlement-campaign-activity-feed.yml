name: Settlement Campaign Activity Feed

on:
  push:
    paths:
      - 'src/3d/gameplay/settlementCampaignActivityFeed.js'
      - 'scripts/checkSettlementCampaignActivityFeed.mjs'
      - '.github/workflows/settlement-campaign-activity-feed.yml'
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementCampaignActivityFeed.js'
      - 'scripts/checkSettlementCampaignActivityFeed.mjs'
      - '.github/workflows/settlement-campaign-activity-feed.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check src/3d/gameplay/settlementCampaignActivityFeed.js && node --check scripts/checkSettlementCampaignActivityFeed.mjs
      - name: Executable contract
        run: node scripts/checkSettlementCampaignActivityFeed.mjs
      - name: Runtime/editor boundary
        run: '! grep -n "EditorMaterialStudio\\|document\\|window\\|MaterialAssignmentCore\\|WorldAssetPlacementPipeline" src/3d/gameplay/settlementCampaignActivityFeed.js'
      - name: Diff budget
        run: test "$(git diff --numstat HEAD~1 HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
