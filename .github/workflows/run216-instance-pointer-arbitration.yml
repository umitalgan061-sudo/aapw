name: Run216 Instance Pointer Arbitration

on:
  push:
    branches:
      - agent/run216-world-editor-transform-controls
    paths:
      - 'src/3d/editor/EditorInstancePointerOwnership.js'
      - 'src/3d/editor/EditorInstanceInteractionBootstrap.js'
      - 'scripts/checkRun216InstancePointerOwnership.mjs'
      - 'scripts/checkRun216InstanceInteractionBootstrap.mjs'
      - '.github/workflows/run216-instance-pointer-arbitration.yml'
  pull_request:
    paths:
      - 'src/3d/editor/EditorInstancePointerOwnership.js'
      - 'src/3d/editor/EditorInstanceInteractionBootstrap.js'
      - 'scripts/checkRun216InstancePointerOwnership.mjs'
      - 'scripts/checkRun216InstanceInteractionBootstrap.mjs'
      - '.github/workflows/run216-instance-pointer-arbitration.yml'

permissions:
  contents: read

jobs:
  instance-pointer-arbitration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/3d/editor/EditorInstancePointerOwnership.js
          node --check src/3d/editor/EditorInstanceInteractionBootstrap.js
          node --check scripts/checkRun216InstancePointerOwnership.mjs
          node --check scripts/checkRun216InstanceInteractionBootstrap.mjs
      - name: Pointer ownership behavior
        run: node scripts/checkRun216InstancePointerOwnership.mjs
      - name: Bootstrap behavior
        run: node scripts/checkRun216InstanceInteractionBootstrap.mjs
