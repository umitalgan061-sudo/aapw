name: Player Combat Lock-On Director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatLockOnDirector.js'
      - 'scripts/checkPlayerCombatLockOnDirector.mjs'
      - '.github/workflows/player-combat-lock-on-director.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerCombatLockOnDirector.js'
      - 'scripts/checkPlayerCombatLockOnDirector.mjs'
      - '.github/workflows/player-combat-lock-on-director.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact-main ancestry and bounded scope
        shell: bash
        run: |
          git fetch --no-tags origin main
          base=$(git merge-base HEAD origin/main)
          test "$base" = "$(git rev-parse origin/main)"
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | wc -l)" -le 3
          ! git diff --check origin/main...HEAD
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Runtime/editor boundary
        run: '! grep -R "EditorMaterialStudio" src/3d/gameplay/playerCombatLockOnDirector.js scripts/checkPlayerCombatLockOnDirector.mjs'
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatLockOnDirector.js && node --check scripts/checkPlayerCombatLockOnDirector.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatLockOnDirector.mjs
