name: Buzul Service Worker Cache Blocker Proof

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: buzul-service-worker-cache-blocker-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-service-worker-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Authoritative service-worker cache contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkServiceWorkerCache.js
          node scripts/checkServiceWorkerCache.js

      - name: Final exact-main freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
