name: Run 258 Editor Mobile Multiobject Save Load Exact Head

on:
  push:
    branches:
      - agent/run258-editor-mobile-multiobject-save-load
    paths:
      - '.github/workflows/run258-editor-mobile-multiobject-save-load-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run258-editor-mobile-multiobject-save-load-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun258EditorMobileMultiobjectSaveLoad.js
          node --check src/3d/editor/worldEditor.js
          node --check src/3d/editor/EditorLocalSession.js
          node --check src/3d/editor/EditorSceneSerializer.js
          git diff --check
      - name: Verify Run258 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 258 — World Editor mobile multi-object actual-download save→load roundtrip regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run258,2026-08-11,editor-mobile-multiobject-save-load' perf_log.csv
          grep -Fq 'Run258 editor mobile multi-object actual-download save-load regression' STABLE_TAGS.md
          grep -Fq '31467491167' 3D_GAME_PROGRESS.md
          grep -Fq '31467491121' 3D_GAME_PROGRESS.md
