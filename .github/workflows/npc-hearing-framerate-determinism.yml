name: NPC Hearing Frame-Rate Determinism

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardReturnToPatrol.mjs'
      - 'scripts/checkNpcPopulationLodRecovery.mjs'
      - 'scripts/checkNpcHearingFrameRateDeterminism.mjs'
      - 'scripts/checkNpcMovementSafetyBrowser.js'
      - 'scripts/checkNpcPerceptionInputSafetyBrowser.js'
      - 'scripts/materializeOwnerApprovedModelManifest.js'
      - 'assets_manifest.json'
      - 'CREDITS.md'
      - '.github/workflows/npc-guard-return-to-patrol.yml'
      - '.github/workflows/npc-hearing-framerate-determinism.yml'
      - '.github/workflows/npc-movement-safety.yml'
      - '.github/workflows/npc-perception-input-safety.yml'
      - '.github/workflows/npc-guard-leash-attack-slot-handoff.yml'
      - '.github/workflows/run167-determinism-policy.yml'
      - '.github/workflows/run283-final-head-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-hearing-framerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/npc\.js|scripts/checkNpcGuardLifecycleContract\.mjs|scripts/checkNpcGuardReturnToPatrol\.mjs|scripts/checkNpcPopulationLodRecovery\.mjs|scripts/checkNpcHearingFrameRateDeterminism\.mjs|scripts/checkNpcMovementSafetyBrowser\.js|scripts/checkNpcPerceptionInputSafetyBrowser\.js|scripts/materializeOwnerApprovedModelManifest\.js|assets_manifest\.json|CREDITS\.md|\.github/workflows/npc-guard-return-to-patrol\.yml|\.github/workflows/npc-hearing-framerate-determinism\.yml|\.github/workflows/npc-movement-safety\.yml|\.github/workflows/npc-perception-input-safety\.yml|\.github/workflows/npc-guard-leash-attack-slot-handoff\.yml|\.github/workflows/run167-determinism-policy\.yml|\.github/workflows/run283-final-head-governance\.yml)$' && exit 1 || true
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END {print s+0}')"
          test $((additions + deletions)) -le 1000
          git diff --check origin/main...HEAD

      - name: Install Chromium outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Hearing determinism proof in shipped browser runtime
        run: node scripts/checkNpcHearingFrameRateDeterminism.mjs

      - name: Perception-input safety proof in shipped browser runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/checkNpcPerceptionInputSafetyBrowser.js; then
            echo "Perception cross-check failed after hearing browser teardown; retrying once after a bounded cooldown."
            sleep 2
            node scripts/checkNpcPerceptionInputSafetyBrowser.js
          fi

      - name: NPC deterministic runtime guard
        run: |
          set -euo pipefail
          node scripts/checkNpcGuardLifecycleContract.mjs
          ! grep -nE 'Math\.random\s*\(' src/3d/gameplay/npc.js

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
