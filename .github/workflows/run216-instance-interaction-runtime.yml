name: Run216 Instance Interaction Runtime

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorInstancePointerController.js'
      - 'src/3d/editor/EditorInstanceTransformBridge.js'
      - 'src/3d/editor/EditorInstanceInteractionRuntime.js'
      - 'scripts/checkRun216InstanceInteractionRuntime.mjs'
      - '.github/workflows/run216-instance-interaction-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instance-interaction-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/3d/editor/EditorInstancePointerController.js
          node --check src/3d/editor/EditorInstanceTransformBridge.js
          node --check src/3d/editor/EditorInstanceInteractionRuntime.js
          node --check scripts/checkRun216InstanceInteractionRuntime.mjs
      - name: Interaction runtime lifecycle regression
        run: node scripts/checkRun216InstanceInteractionRuntime.mjs src/3d/editor
