name: Map-Aligned Snow Pine Climate

on:
  pull_request:
    paths:
      - 'src/3d/world/vegetation.js'
      - 'src/3d/world/northReferenceCryosphere.js'
      - 'src/3d/world/worldReferenceAlignment.js'
      - 'scripts/checkMapAlignedSnowPineClimate.mjs'
      - '.github/workflows/map-aligned-snow-pine-climate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-aligned-snow-pine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime-only test dependency
        run: npm install --no-save --package-lock=false three
      - name: Syntax
        run: |
          node --check src/3d/world/vegetation.js
          node --check src/3d/world/northReferenceCryosphere.js
          node --check scripts/checkMapAlignedSnowPineClimate.mjs
      - name: Map-aligned snow-pine contract
        run: node scripts/checkMapAlignedSnowPineClimate.mjs
