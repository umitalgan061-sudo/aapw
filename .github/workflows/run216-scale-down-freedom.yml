name: Run216 Scale Down Freedom

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorTransformControls.js'
      - 'src/3d/vendor/three/addons/controls/TransformControls.js'
      - 'scripts/checkRun216ScaleDownFreedom.js'
      - '.github/workflows/run216-scale-down-freedom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-down-freedom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check src/3d/editor/EditorTransformControls.js
      - run: node --check scripts/checkRun216ScaleDownFreedom.js
      - run: node scripts/checkRun216ScaleDownFreedom.js
