name: NW G10 Terrain3D Macro Biome

on:
  push:
    branches: [agent/buzul-muhafizi-g10-terrain3d-biome-r6-20260813]
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/nw/g10_biome.mjs'
      - 'scripts/checkNWG10Biome.mjs'
      - 'godot/terrain-authoring/scripts/validate_g10_terrain3d_biome.gd'
      - '.github/workflows/nw-g10-terrain3d-biome.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Europe/Istanbul

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - name: Exact-main and four-file scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/nw/g10_biome.mjs|scripts/checkNWG10Biome.mjs|godot/terrain-authoring/scripts/validate_g10_terrain3d_biome.gd|\.github/workflows/nw-g10-terrain3d-biome.yml)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 4
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g10_hydrology.mjs godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py godot/terrain-authoring/addons/zylann.hterrain

  authoring:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prior Hydrology and deterministic biome twice
        run: |
          set -euo pipefail
          PROOF='godot/terrain-authoring/.terrain3d-proof/g10-biome-probe.json'; mkdir -p "$(dirname "$PROOF")"
          node scripts/checkNWG10Hydrology.mjs | tee "$RUNNER_TEMP/hydro.log"; grep -F NW_G10_HYDROLOGY_VALIDATION_OK "$RUNNER_TEMP/hydro.log"
          node --check godot/terrain-authoring/geocells/nw/g10_biome.mjs; node --check scripts/checkNWG10Biome.mjs
          node scripts/checkNWG10Biome.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/a.log"; cp "$PROOF" "$RUNNER_TEMP/a.json"
          node scripts/checkNWG10Biome.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/b.log"; cp "$PROOF" "$RUNNER_TEMP/b.json"
          cmp "$RUNNER_TEMP/a.log" "$RUNNER_TEMP/b.log"; cmp "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json"; grep -F NW_G10_BIOME_VALIDATION_OK "$RUNNER_TEMP/a.log"
      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.before"
          ok=0; for n in 1 2 3; do if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh; then ok=1; break; fi; sleep $((n*3)); done; test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/verify.log"; grep -F TERRAIN3D_VERIFY_OK "$RUNNER_TEMP/verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"; curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/godot.zip"; unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F 4.6.3; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real Terrain3D Height Color persist LOD0 twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G10_BIOME_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g10_terrain3d_biome.gd | tee "$RUNNER_TEMP/t3da.log"; cp godot/terrain-authoring/.terrain3d-proof/g10-biome-color.png "$RUNNER_TEMP/a.png"
          G10_BIOME_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g10_terrain3d_biome.gd | tee "$RUNNER_TEMP/t3db.log"; cp godot/terrain-authoring/.terrain3d-proof/g10-biome-color.png "$RUNNER_TEMP/b.png"
          grep -F NW_G10_TERRAIN3D_BIOME_VALIDATION_OK "$RUNNER_TEMP/t3da.log"; grep -F NW_G10_TERRAIN3D_BIOME_VALIDATION_OK "$RUNNER_TEMP/t3db.log"; cmp "$RUNNER_TEMP/a.png" "$RUNNER_TEMP/b.png"
      - name: Restore authoring mutations
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/project.before" || cp "$RUNNER_TEMP/project.before" godot/terrain-authoring/project.godot
          rm -rf godot/terrain-authoring/addons/terrain_3d; git restore --worktree -- godot/terrain-authoring/addons/zylann.hterrain; git clean -fdx -- godot/terrain-authoring/terrain_data
          git diff --exit-code -- godot/terrain-authoring/project.godot godot/terrain-authoring/addons/zylann.hterrain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nw-g10-terrain3d-biome-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: godot/terrain-authoring/.terrain3d-proof/

  hterrain:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Download Godot 4.6.3
        run: |
          mkdir -p "$RUNNER_TEMP/godot"; curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/godot.zip"; unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import resources then validate real HTerrain
        run: |
          set -euo pipefail
          P='godot/terrain-authoring/project.godot'; B="$RUNNER_TEMP/project.godot"; cp "$P" "$B"; restore(){ cp "$B" "$P"; }; trap restore EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('godot/terrain-authoring/project.godot'); t=p.read_text()
          both='enabled=PackedStringArray("res://addons/zylann.hterrain/plugin.cfg", "res://addons/terrain_3d/plugin.cfg")'; assert t.count(both)==1
          p.write_text(t.replace(both,'enabled=PackedStringArray()'))
          PY
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import
          python3 - <<'PY'
          from pathlib import Path
          p=Path('godot/terrain-authoring/project.godot'); t=p.read_text(); empty='enabled=PackedStringArray()'; assert t.count(empty)==1
          p.write_text(t.replace(empty,'enabled=PackedStringArray("res://addons/zylann.hterrain/plugin.cfg")'))
          PY
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -F 'Terrain data is null, can'"'"'t update detail layer completely' "$RUNNER_TEMP/editor.log"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd 2>&1 | tee "$RUNNER_TEMP/hterrain.log"
          grep -F HTERRAIN_AUTHORING_VALIDATION_OK "$RUNNER_TEMP/hterrain.log"; ! grep -F 'Terrain data is null, can'"'"'t update detail layer completely' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js; node scripts/checkWorldReferenceMap.js
          restore; trap - EXIT; git diff --exit-code -- "$P"

  runtime:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"; npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0; "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium; echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Settlement road PWA mobile browser regressions
        run: |
          set -euo pipefail; export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/terrainSeatSafetyCheck.js; node scripts/roadNetworkSafetyCheck.js; node scripts/checkRoadVisualContract.js; node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js; node scripts/checkServiceWorkerCache.js; node scripts/checkTechnicalDebt.js; node scripts/checkMobilePerfBudget.js; node scripts/smokeTestGame3D.js

  final-exact-main:
    needs: [authoring, hterrain, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - name: Final exact-main gate
        run: |
          set -euo pipefail; git fetch origin main; test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"; git diff --check origin/main...HEAD
