name: RPG Mastery Economy Continuity

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'scripts/checkInteractionArmorerServiceBrowser.mjs'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionBoardBrowser.mjs'
      - 'scripts/checkInteractionExpeditionKitCraft.mjs'
      - 'scripts/checkInteractionExpeditionRewardProvenance.mjs'
      - 'scripts/checkInteractionExpeditionRewardTradeContinuity.mjs'
      - 'scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs'
      - 'scripts/checkInteractionProvisioningCraft.mjs'
      - 'scripts/checkInteractionQuartermasterTrade.mjs'
      - 'scripts/checkInteractionSettlementServiceBrowser.mjs'
      - 'scripts/checkInteractionSettlementServiceContract.mjs'
      - 'scripts/checkInteractionSmithingServicePersistence.mjs'
      - 'scripts/checkInteractionTradeLedgerAtomicity.mjs'
      - 'scripts/checkInteractionMasteryEconomyContinuity.mjs'
      - 'scripts/checkInteractionMasteryToSmithingBrowser.mjs'
      - '.github/workflows/rpg-expedition-credit-ledger.yml'
      - '.github/workflows/rpg-expedition-reward-provenance.yml'
      - '.github/workflows/rpg-interaction-quest-loop.yml'
      - '.github/workflows/rpg-journey-history-current.yml'
      - '.github/workflows/rpg-mastery-armorer-service.yml'
      - '.github/workflows/rpg-mastery-to-smithing.yml'
      - '.github/workflows/rpg-smithing-service-persistence.yml'
      - '.github/workflows/rpg-mastery-economy-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mastery-economy-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope and quota
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          CURRENT_MAIN="$(git rev-parse origin/main)"
          MERGE_BASE="$(git merge-base HEAD origin/main)"
          test "$MERGE_BASE" = "$CURRENT_MAIN"
          mapfile -t FILES < <(git diff --name-only "$CURRENT_MAIN"...HEAD)
          printf '%s\n' "${FILES[@]}"
          allowed='^(service-worker\.js|\.github/workflows/(rpg-expedition-(credit-ledger|reward-provenance)|rpg-expedition-tavern-recovery|rpg-interaction-quest-loop|rpg-journey-(history-current|ledger-ux)|rpg-mastery-armorer-service|rpg-mastery-(economy-continuity|journal-continuity|to-smithing|travel-continuity)|rpg-smithing-service-persistence|rpg-tavern-receipt-integrity|run167-determinism-policy|run283-final-head-governance)\.yml|scripts/checkInteractionCreditSourceLedgerRestore\.mjs|scripts/checkInteractionExpedition(Board|BoardBrowser|RewardProvenance|RewardTradeContinuity|TradeQuoteAtomicity)\.mjs|scripts/checkInteractionExpeditionKit(Browser|Craft)\.mjs|scripts/checkInteractionMastery(EconomyContinuity|ToSmithingBrowser)\.mjs|scripts/checkInteraction(ArmorerServiceBrowser|ProvisioningCraft|QuartermasterTrade|SettlementService(Browser|Contract)|SmithingServicePersistence|TradeLedger(Atomicity|Browser))\.mjs|src/3d/gameplay/interaction(Economy|Config)?\.js)$'
          if (( ${#FILES[@]} )); then
            printf '%s\n' "${FILES[@]}" | grep -Ev "$allowed" && exit 1 || true
          fi
          CHANGED_LINES="$(git diff --numstat "$CURRENT_MAIN"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          echo "changed_lines=$CHANGED_LINES"
          test "$CHANGED_LINES" -le 1000
      - name: Syntax and mastery economy continuity
        run: |
          set -euo pipefail
          node --check scripts/checkInteractionMasteryEconomyContinuity.mjs
          node scripts/checkInteractionMasteryEconomyContinuity.mjs
      - name: Expedition mastery smithing reward contract
        run: node scripts/checkInteractionExpeditionMasterySmithingReward.mjs
      - name: Trade ledger atomicity contract
        run: node scripts/checkInteractionTradeLedgerAtomicity.mjs
      - name: Settlement service contract
        run: node scripts/checkInteractionSettlementServiceContract.mjs
      - name: Shared material-placement boundary
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
