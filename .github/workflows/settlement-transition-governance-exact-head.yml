name: Settlement Transition Governance Exact Head

on:
  pull_request:
    paths:
      - 'scripts/checkWorldReferenceHydrologyExtent.js'
      - 'scripts/checkFullWorldRuntimeCoverage.mjs'
      - '.github/workflows/settlement-transition-governance-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          test "$BASE" = "$REMOTE_MAIN"

          mapfile -t CHANGED < <(git diff --name-only "$REMOTE_MAIN...HEAD")
          printf 'changed files:\n%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -ge 1

          for path in "${CHANGED[@]}"; do
            case "$path" in
              scripts/checkWorldReferenceHydrologyExtent.js|scripts/checkFullWorldRuntimeCoverage.mjs|.github/workflows/settlement-transition-governance-exact-head.yml) ;;
              *) echo "Unexpected path in bounded settlement-transition candidate: $path" >&2; exit 1 ;;
            esac
          done

          read -r ADD DEL < <(git diff --numstat "$REMOTE_MAIN...HEAD" | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          TOTAL=$((ADD + DEL))
          echo "scope additions=$ADD deletions=$DEL total=$TOTAL"
          test "$TOTAL" -le 1000
          git diff --check "$REMOTE_MAIN...HEAD"

      - name: Syntax
        run: |
          node --check scripts/checkWorldReferenceHydrologyExtent.js
          node --check scripts/checkFullWorldRuntimeCoverage.mjs
          node --check scripts/checkSeededRandomPolicy.js

      - name: Shipped 210m settlement transition contracts
        run: |
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkFullWorldRuntimeCoverage.mjs

      - name: Preserve independent hydrology protection
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '210' scripts/checkWorldReferenceHydrologyExtent.js
          grep -Eq '210' scripts/checkFullWorldRuntimeCoverage.mjs
          grep -Eq '75' scripts/checkWorldReferenceHydrologyExtent.js

      - name: Seeded determinism policy regression
        run: node scripts/checkSeededRandomPolicy.js

      - name: Capture broad Run283 blocker diagnostics
        id: broad-diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/settlement-transition-governance
          {
            echo '=== checkServiceWorkerCache.js ==='
            node scripts/checkServiceWorkerCache.js
            SERVICE_WORKER_STATUS=$?
            echo "exit=$SERVICE_WORKER_STATUS"
            echo
            echo '=== checkSmokeCheckRegistry.js ==='
            node scripts/checkSmokeCheckRegistry.js
            SMOKE_REGISTRY_STATUS=$?
            echo "exit=$SMOKE_REGISTRY_STATUS"
            echo
            echo "service_worker_exit=$SERVICE_WORKER_STATUS"
            echo "smoke_registry_exit=$SMOKE_REGISTRY_STATUS"
            if [ "$SERVICE_WORKER_STATUS" -eq 0 ] && [ "$SMOKE_REGISTRY_STATUS" -eq 0 ]; then
              echo 'broad_diagnostics=green'
              exit 0
            fi
            echo 'broad_diagnostics=blocked'
            exit 1
          } 2>&1 | tee artifacts/settlement-transition-governance/run283-shared-blockers.log

      - name: Upload broad blocker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-transition-run283-shared-blockers
          path: artifacts/settlement-transition-governance/run283-shared-blockers.log
          if-no-files-found: error
          retention-days: 7

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          REMOTE_MAIN="$(git rev-parse origin/main)"
          BASE="$(git merge-base HEAD origin/main)"
          echo "remote-main=$REMOTE_MAIN merge-base=$BASE head=$(git rev-parse HEAD)"
          test "$BASE" = "$REMOTE_MAIN"

      - name: Enforce broad Run283 blocker parity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "broad-diagnostics outcome=${{ steps.broad-diagnostics.outcome }}"
          test "${{ steps.broad-diagnostics.outcome }}" = "success"
