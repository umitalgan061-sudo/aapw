name: Player Combo Director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerComboDirector.ts'
      - 'scripts/checkPlayerComboDirector.mjs'
      - '.github/workflows/player-combo-director.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-combo-director-20260921-r18'

jobs:
  combo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          BASE="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(src/3d/gameplay/playerComboDirector\.ts|scripts/checkPlayerComboDirector\.mjs|\.github/workflows/player-combo-director\.yml)$' | grep -q .; then
            echo 'Unexpected path outside combo-director scope' >&2
            exit 1
          fi
      - name: Syntax
        run: |
          node --check scripts/checkPlayerComboDirector.mjs
          node --check src/3d/gameplay/playerComboDirector.ts
      - name: Combo contract
        run: node scripts/checkPlayerComboDirector.mjs
