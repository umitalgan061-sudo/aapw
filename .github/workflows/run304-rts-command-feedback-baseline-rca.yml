name: Run304 RTS Command Feedback Baseline RCA

on:
  push:
    branches:
      - run304-rts-command-feedback-baseline-rca
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: a5b9dcfc6da0b199db6faa040c87c735bdd2dc58

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove exact untouched main baseline
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | grep -Fx '.github/workflows/run304-rts-command-feedback-baseline-rca.yml'
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
      - name: Install Playwright outside project manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Run untouched-main Run208 feedback contract
        run: node scripts/checkRun208RtsCommandFeedback.js
