name: player-combat-lock-on-hysteresis
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatLockOnProjectionV11.js'
      - 'scripts/checkPlayerCombatLockOnProjectionV11.mjs'
      - '.github/workflows/player-combat-lock-on-hysteresis.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/playerCombatLockOnProjectionV11.js
      - run: node scripts/checkPlayerCombatLockOnProjectionV11.mjs
      - run: node scripts/checkPlayerCombatLockOnProjectionV11.mjs > /tmp/lock-on-a.txt
      - run: node scripts/checkPlayerCombatLockOnProjectionV11.mjs > /tmp/lock-on-b.txt
      - run: cmp /tmp/lock-on-a.txt /tmp/lock-on-b.txt
      - name: Runtime/editor boundary
        run: '! grep -nE "EditorMaterialStudio|document\\.|window\\.|from[[:space:]]+['\"]three['\"]" src/3d/gameplay/playerCombatLockOnProjectionV11.js'
      - name: Diff budget
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
