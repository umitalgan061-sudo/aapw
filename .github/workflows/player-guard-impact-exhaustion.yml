name: Player Guard Impact Exhaustion

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/player.js'
      - 'src/3d/input.js'
      - 'src/3d/camera.js'
      - 'src/3d/ui/touchJoystick.js'
      - 'scripts/checkPlayerCombatVerticalSlice.mjs'
      - 'scripts/checkPlayerGeographicCameraOcclusion.mjs'
      - 'scripts/checkTouchJoystickInputContract.js'
      - 'scripts/checkPlayerTouchCombatRuntime.mjs'
      - 'scripts/checkPlayerGuardImpactExhaustion.mjs'
      - 'scripts/checkPlayerGuardImpactExhaustionRuntime.mjs'
      - 'scripts/checkPlayerCombatFeedback.mjs'
      - 'scripts/checkPlayerMeleeCombo.mjs'
      - 'scripts/checkPlayerStaminaDodge.mjs'
      - 'scripts/checkPlayerStaminaDodgeRuntime.mjs'
      - 'scripts/checkPlayerHitStaggerRuntime.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferDrop.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferRuntime.mjs'
      - '.github/workflows/player-touch-combat-runtime.yml'
      - '.github/workflows/player-hit-stagger-runtime.yml'
      - '.github/workflows/player-recovery-attack-buffer-drop.yml'
      - '.github/workflows/player-combat-recovery-input-isolation.yml'
      - '.github/workflows/player-parry-recovery.yml'
      - '.github/workflows/player-stamina-dodge.yml'
      - '.github/workflows/player-gamepad-parity.yml'
      - '.github/workflows/player-grounding-combat-contract.yml'
      - '.github/workflows/player-combat-vertical-slice.yml'
      - '.github/workflows/player-guard-impact-exhaustion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-guard-impact-exhaustion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          echo "$CHANGED"
          OUT_OF_SCOPE="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/3d/gameplay/player\.js|src/3d/input\.js|src/3d/camera\.js|src/3d/ui/touchJoystick\.js|src/3d/ui/controlsHelp\.js|scripts/checkPlayerCombatVerticalSlice\.mjs|scripts/checkPlayerGeographicCameraOcclusion\.mjs|scripts/checkTouchJoystickInputContract\.js|scripts/checkPlayerTouchCombatRuntime\.mjs|scripts/checkPlayerGuardImpactExhaustion\.mjs|scripts/checkPlayerGuardImpactExhaustionRuntime\.mjs|scripts/checkPlayerCombatFeedback\.mjs|scripts/checkPlayerMeleeCombo\.mjs|scripts/checkPlayerStaminaDodge\.mjs|scripts/checkPlayerStaminaDodgeRuntime\.mjs|scripts/checkPlayerHitStaggerRuntime\.mjs|scripts/checkPlayerRecoveryAttackBufferDrop\.mjs|scripts/checkPlayerRecoveryAttackBufferRuntime\.mjs|\.github/workflows/player-touch-combat-runtime\.yml|\.github/workflows/player-hit-stagger-runtime\.yml|\.github/workflows/player-recovery-attack-buffer-drop\.yml|\.github/workflows/player-combat-recovery-input-isolation\.yml|\.github/workflows/player-parry-recovery\.yml|\.github/workflows/player-stamina-dodge\.yml|\.github/workflows/player-gamepad-parity\.yml|\.github/workflows/player-grounding-combat-contract\.yml|\.github/workflows/player-combat-vertical-slice\.yml|\.github/workflows/player-guard-impact-exhaustion\.yml)$' || true)"
          test -z "$OUT_OF_SCOPE"
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          TOTAL=$((ADD + DEL))
          echo "base=$BASE additions=$ADD deletions=$DEL total=$TOTAL"
          test "$TOTAL" -le 3000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Touch lifecycle acceptance before LFS hydration
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/ui/touchJoystick.js
          node --check src/3d/camera.js
          node --check scripts/checkPlayerGeographicCameraOcclusion.mjs
          node --check scripts/checkTouchJoystickInputContract.js
          node scripts/checkPlayerGeographicCameraOcclusion.mjs
          node scripts/checkTouchJoystickInputContract.js
      - name: Asset-first targeted hydration
        shell: bash
        run: |
          set -euo pipefail
          # Hydrate only families the shipped guard proof actually instantiates.
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/Dragon_Baked_Actions_fbx_7.4_binary.fbx,assets/models/creatures/dragon/textures/**,assets/models/settlements/castles/*_decimated.glb" --exclude=""
          test -s assets/models/characters/peasant_girl.fbx
          test -s assets/animations/peasant_girl/idle.fbx
          test -s assets/animations/peasant_girl/walking.fbx
          test -s assets/animations/peasant_girl/running.fbx
          test -s assets/models/animals/wolf/Wolf-Blender-2.82a.glb
          test -s assets/models/creatures/dragon/Dragon_Baked_Actions_fbx_7.4_binary.fbx
          test -s assets/models/creatures/dragon/textures/Dragon_ground_color.jpg
          test -s assets/models/creatures/dragon/textures/Dragon_Bump_Col2.jpg
          test -s assets/models/creatures/dragon/textures/Dragon_Nor.jpg
          test -s assets/models/creatures/dragon/textures/Dragon_Nor_mirror2.jpg
          test -s assets/models/settlements/castles/icebound_citadel_decimated.glb
      - name: Combat contracts
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/player.js
          node --check src/3d/ui/touchJoystick.js
          node --check scripts/checkPlayerGuardImpactExhaustion.mjs
          node --check scripts/checkPlayerGuardImpactExhaustionRuntime.mjs
          node --check scripts/checkPlayerCombatFeedback.mjs
          node --check scripts/checkPlayerStaminaDodge.mjs
          node --check scripts/checkPlayerStaminaDodgeRuntime.mjs
          node --check scripts/checkPlayerHitStaggerRuntime.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferRuntime.mjs
          node scripts/checkPlayerGuardImpactExhaustion.mjs
          node scripts/checkPlayerCombatFeedback.mjs
          node scripts/checkPlayerStaminaDodge.mjs
          node scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node scripts/checkPlayerImmutableDefenseDamage.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkServiceWorkerCache.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -q 'EditorMaterialStudio' src/3d/gameplay/player.js
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped scene guard runtime proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-guard-impact-exhaustion/stamina-only
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerGuardImpactExhaustionRuntime.mjs --out-dir=artifacts/player-guard-impact-exhaustion/stamina-only 2>&1 | tee artifacts/player-guard-impact-exhaustion/stamina-only/runtime.log
          test -s artifacts/player-guard-impact-exhaustion/stamina-only/player-runtime.png
          test -s artifacts/player-guard-impact-exhaustion/stamina-only/metrics.json
          test -s artifacts/player-guard-impact-exhaustion/stamina-only/runtime.log
          grep -q '"contract": "player-guard-impact-exhaustion-runtime"' artifacts/player-guard-impact-exhaustion/stamina-only/metrics.json
          grep -q '"defenseResult": "guard-break"' artifacts/player-guard-impact-exhaustion/stamina-only/metrics.json
          grep -q '"browserErrors": \[\]' artifacts/player-guard-impact-exhaustion/stamina-only/metrics.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerStaminaDodgeRuntime.mjs --out-dir=artifacts/player-guard-impact-exhaustion 2>&1 | tee artifacts/player-guard-impact-exhaustion/runtime.log
          test -s artifacts/player-guard-impact-exhaustion/player-runtime.png
          test -s artifacts/player-guard-impact-exhaustion/metrics.json
          test -s artifacts/player-guard-impact-exhaustion/runtime.log
          grep -q '"defenseResult": "guard"' artifacts/player-guard-impact-exhaustion/metrics.json
          grep -q '"browserErrors": \[\]' artifacts/player-guard-impact-exhaustion/metrics.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
      - name: Final main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-guard-impact-exhaustion-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/player-guard-impact-exhaustion/
