name: World Asset Surface Reality Exact Head

on:
  push:
    branches:
      - codex/foundation-grounding-20260821
    paths:
      - 'src/3d/materials/MaterialAssignmentCore.js'
      - 'src/3d/materials/worldAssetSurfaceReality.js'
      - 'src/3d/materials/worldMaterialHydrometeoricResponse.js'
      - 'src/3d/world/hydrologySurfaceReality.js'
      - 'scripts/checkWorldAssetSurfaceReality.mjs'
      - '.github/workflows/world-asset-surface-reality-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head and production syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --check src/3d/materials/MaterialAssignmentCore.js
          node --check src/3d/materials/worldAssetSurfaceReality.js
          node --check src/3d/materials/worldMaterialHydrometeoricResponse.js
          node --check src/3d/world/hydrologySurfaceReality.js
          node --check scripts/checkWorldAssetSurfaceReality.mjs
      - name: Resolve vendored Three.js
        run: node scripts/setupNodeThreeShim.mjs
      - name: Run exact-head surface realism contracts
        run: |
          mkdir -p artifacts/world-asset-surface-reality
          node scripts/checkWorldAssetSurfaceReality.mjs \
            | tee artifacts/world-asset-surface-reality/contracts.log
      - name: Install exact browser runtime
        run: |
          npm install --no-save playwright@1.55.0 three
          npx playwright install --with-deps chromium
      - name: Capture full-world visual proof
        run: |
          node scripts/captureFullWorld3DTopdown.mjs \
            --width=1600 --height=1100 --segments=240 \
            --focus=world \
            --output=artifacts/world-asset-surface-reality/full-world.png
      - name: Capture regional surface proof
        run: |
          node scripts/captureFullWorld3DTopdown.mjs \
            --width=1400 --height=1000 --segments=220 \
            --focus=valyria \
            --output=artifacts/world-asset-surface-reality/valyria.png
      - name: Record exact head
        if: always()
        run: |
          printf '%s\n' "$GITHUB_SHA" > artifacts/world-asset-surface-reality/head-sha.txt
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-asset-surface-reality-${{ github.sha }}
          path: artifacts/world-asset-surface-reality/
          if-no-files-found: warn
          retention-days: 14
