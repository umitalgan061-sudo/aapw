name: Kızıl Ufuk player equipment frame delta

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentCombatFrameDelta.js'
      - 'scripts/checkPlayerEquipmentCombatFrameDelta.mjs'
      - '.github/workflows/kizil-ufuk-player-equipment-frame-delta.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check src/3d/gameplay/playerEquipmentCombatFrameDelta.js && node --check scripts/checkPlayerEquipmentCombatFrameDelta.mjs
      - name: Contract
        run: node scripts/checkPlayerEquipmentCombatFrameDelta.mjs
      - name: Diff hygiene
        shell: bash
        run: |
          changed=$(git diff --numstat "$BASE_SHA" "$GITHUB_SHA" -- | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
