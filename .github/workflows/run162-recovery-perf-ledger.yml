name: Run 162 Recovery Perf Ledger

on:
  push:
    branches:
      - agent/run162-keyboard-input-contract
    paths:
      - '.github/workflows/run162-recovery-perf-ledger.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: efc7ca5f338fea91f7a33744a89a19965d5432c9
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Recovery RCA and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md && test -f 3D_GAME_PROGRESS.md && test -f DECISIONS.md && test -f QUESTIONS_FOR_OWNER.md
          echo 'Root Cause: perf_log.csv lacked a trailing newline, so tail -n 1 concatenated run161 and run162 after collectPerfSnapshot append.'
          echo 'Prevention: derive the measured run162 row from collectPerfSnapshot stdout and validate its exact CSV shape before governance append.'
          echo 'Regression: latest-run uniqueness + checkpoint consistency must pass after append.'
      - name: Baseline browser smoke on main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run162-recovery-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run162-recovery-smoke-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run162-recovery-smoke-before.log")" -ge 34)
          git worktree remove "$BASELINE"
      - name: Syntax additive and input contract gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkKeyboardInputContract.js
          node --check scripts/recordRun162Governance.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
      - name: Governance world PWA and mobile gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js
      - name: Existing accessibility regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkControlsHelpAccessibility.js
      - name: Full browser smoke after recovery change and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run162-recovery-smoke-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run162-recovery-smoke-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run162-recovery-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run162-recovery-smoke-after.log"; then exit 1; fi
          echo "RUN162_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"
      - name: Performance snapshot with robust row capture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run162 | tee "$RUNNER_TEMP/run162-recovery-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run162-recovery-perf-trend.log"
          PERF_ROW="$(sed -n 's/^\[collectPerfSnapshot\] sampled: //p' "$RUNNER_TEMP/run162-recovery-perf.log" | tail -n 1)"
          test -n "$PERF_ROW"
          printf '%s\n' "$PERF_ROW" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2},run162,[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+$'
          echo "RUN162_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
      - name: Restore tracked perf ledger before governance append
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- perf_log.csv
      - name: Senior self-review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
      - name: Prepare Run 162 governance values
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN162_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN162_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"
      - name: Record and validate Run 162 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun162Governance.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js
      - name: Commit Run 162 records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "docs(3d): record run162 stable checkpoint"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Best-effort stable tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RUN162_STABLE_TAG"
          git push origin "$RUN162_STABLE_TAG" || true
