name: Kızıl Ufuk Player Combat Reaction Timeline

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatReactionTimeline.js'
      - 'scripts/checkPlayerCombatReactionTimeline.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-reaction-timeline.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-combat-reaction-timeline-20260916-r11'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatReactionTimeline.js && node --check scripts/checkPlayerCombatReactionTimeline.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatReactionTimeline.mjs
      - name: Scope guard
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          test "$(git diff --numstat origin/main...HEAD | awk '{d+=$2} END {print d+0}')" -eq 0
