name: NPC Guard Assist Input Safety

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardAssistInputSafety.mjs'
      - '.github/workflows/npc-guard-assist-input-safety.yml'
  workflow_dispatch:

jobs:
  guard-assist-input-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/checkNpcGuardAssistInputSafety.mjs
