name: NW G01 Terrain3D Runtime Parity

on:
  push:
    branches:
      - agent/buzul-muhafizi-g01-parity-exact-172216-20260814
  pull_request:
    branches: [main]
    paths:
      - 'scripts/checkNWG01RuntimeVisualParity.mjs'
      - 'godot/terrain-authoring/corner_claims/NW.json'
      - '.github/workflows/nw-g01-terrain3d-runtime-parity.yml'
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: nw-g01-terrain3d-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

env: { TZ: Europe/Istanbul }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main bounded qualification scope and quota
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(scripts/checkNWG01RuntimeVisualParity.mjs|godot/terrain-authoring/corner_claims/NW.json|\.github/workflows/nw-g01-terrain3d-runtime-parity.yml)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 3
          A="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1}END{print s+0}')"
          D="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2}END{print s+0}')"
          echo "Runtime parity qualification quota: additions=$A deletions=$D total=$((A+D))"
          test $((A+D)) -le 1000
          for protected in g01_hydrology.mjs g01_biome.mjs g01_relief.mjs g01_rock_snow.mjs g01_road_path.mjs g01_near_detail.mjs; do
            git diff --quiet "$BASE_SHA"...HEAD -- "godot/terrain-authoring/geocells/nw/$protected"
          done
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/g01Terrain3dRuntimeAdapter.js scripts/checkNWG01Terrain3DRuntimeParity.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/validate_g01_terrain3d_runtime_parity.gd
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/terrain.js src/3d/world/roads.js src/3d/world/worldReferenceTerrainAdapter.js
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py service-worker.js
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Reprove merged G01 stack and source determinism
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkNWG01Hydrology.mjs
          node scripts/checkNWG01Biome.mjs
          node scripts/checkNWG01Relief.mjs
          node scripts/checkNWG01RockSnow.mjs
          timeout 180s node scripts/checkNWG01RoadPath.mjs
          node scripts/checkNWG01NearDetail.mjs
          node --check src/3d/world/g01Terrain3dRuntimeAdapter.js
          node --check scripts/checkNWG01Terrain3DRuntimeParity.mjs
          node --check scripts/checkNWG01RuntimeVisualParity.mjs
          node scripts/checkNWG01Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g01-runtime-source.json "$RUNNER_TEMP/source-a.json"
          node scripts/checkNWG01Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-b.log"
          cmp "$RUNNER_TEMP/source-a.log" "$RUNNER_TEMP/source-b.log"
          cmp "$RUNNER_TEMP/source-a.json" godot/terrain-authoring/.terrain3d-proof/g01-runtime-source.json
          grep -F 'NW_G01_RUNTIME_PARITY_SOURCE_OK' "$RUNNER_TEMP/source-a.log"
      - name: Install pinned Terrain3D and preserve HTerrain
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.godot.before-terrain3d"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          grep -F 'res://addons/zylann.hterrain/plugin.cfg' godot/terrain-authoring/project.godot
      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real Terrain3D region persistence and LOD0 proof twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/editor.log"
          G01_RUNTIME_PARITY_PROOF_SUFFIX=a timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g01_terrain3d_runtime_parity.gd | tee "$RUNNER_TEMP/bake-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g01-runtime-bake.json "$RUNNER_TEMP/bake-a.json"
          cp godot/terrain-authoring/.terrain3d-proof/g01-runtime-bake-topdown.png "$RUNNER_TEMP/bake-a.png"
          G01_RUNTIME_PARITY_PROOF_SUFFIX=b timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g01_terrain3d_runtime_parity.gd | tee "$RUNNER_TEMP/bake-b.log"
          jq -S 'del(.savedRegionBytes)' "$RUNNER_TEMP/bake-a.json" > "$RUNNER_TEMP/a.json"
          jq -S 'del(.savedRegionBytes)' godot/terrain-authoring/.terrain3d-proof/g01-runtime-bake.json > "$RUNNER_TEMP/b.json"
          cmp "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json"
          cmp "$RUNNER_TEMP/bake-a.png" godot/terrain-authoring/.terrain3d-proof/g01-runtime-bake-topdown.png
          grep -F 'NW_G01_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake-a.log"
          grep -F 'NW_G01_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake-b.log"
      - name: Verify bake through Three.js world coordinates
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG01Terrain3DRuntimeParity.mjs --verify | tee "$RUNNER_TEMP/runtime.log"
          grep -F 'NW_G01_TERRAIN3D_RUNTIME_PARITY_OK' "$RUNNER_TEMP/runtime.log"
      - name: Near far and full-world top-down visual parity
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkNWG01RuntimeVisualParity.mjs --out-dir=artifacts/nw-g01-runtime-visual | tee "$RUNNER_TEMP/visual.log"
          grep -F 'NW_G01_RUNTIME_VISUAL_PARITY_OK' "$RUNNER_TEMP/visual.log"
          test -s artifacts/nw-g01-runtime-visual/g01-runtime-near.png
          test -s artifacts/nw-g01-runtime-visual/g01-runtime-far.png
          test -s artifacts/nw-g01-runtime-visual/g01-full-world-reference-topdown.png
          test -s artifacts/nw-g01-runtime-visual/metrics.json
      - name: HTerrain regression and deterministic world-reference safety
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
      - name: Settlement and road safety regressions
        run: |
          set -euo pipefail
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
      - name: PWA installability regression
        run: node scripts/checkPwaInstallability.js
      - name: Service worker offline-shell regression
        run: node scripts/checkServiceWorkerCache.js
      - name: Technical debt regression
        run: node scripts/checkTechnicalDebt.js
      - name: Mobile performance budget
        run: node scripts/checkMobilePerfBudget.js
      - name: Browser runtime smoke and clean console
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nw-g01-terrain3d-runtime-parity-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g01-runtime-source.json
            godot/terrain-authoring/.terrain3d-proof/g01-runtime-bake.json
            godot/terrain-authoring/.terrain3d-proof/g01-runtime-bake-topdown.png
            artifacts/nw-g01-runtime-visual/g01-runtime-near.png
            artifacts/nw-g01-runtime-visual/g01-runtime-far.png
            artifacts/nw-g01-runtime-visual/g01-full-world-reference-topdown.png
            artifacts/nw-g01-runtime-visual/metrics.json