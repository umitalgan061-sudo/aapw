name: typescript7-foundation-r2

on:
  push:
    branches:
      - agent/typescript7-runtime-foundation-r2-20260916
    paths:
      - 'src/3d/types/**'
      - 'scripts/generateTypeScript7MigrationMatrix.mjs'
      - 'tsconfig.runtime-foundation.json'
      - '.github/workflows/typescript7-foundation-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typescript7-foundation-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  type-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic migration corpus
        run: node scripts/generateTypeScript7MigrationMatrix.mjs
      - name: Verify corpus cardinality
        run: |
          rows=$(grep -c '"id":[0-9]' artifacts/typescript7-runtime-foundation/migration-contract-matrix.ts)
          test "$rows" -eq 4096
          test "$(grep -c '"id":1,' artifacts/typescript7-runtime-foundation/migration-contract-matrix.ts)" -eq 1
          test "$(grep -c '"id":4096,' artifacts/typescript7-runtime-foundation/migration-contract-matrix.ts)" -eq 1
      - name: Materialize regression corpus
        run: |
          git add -f artifacts/typescript7-runtime-foundation/migration-contract-matrix.ts
          if git diff --cached --quiet; then
            echo 'generated corpus unchanged'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(types): materialize TypeScript 7 migration corpus [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: TypeScript 7 compiler
        run: npx -y -p typescript@7 tsc --version
      - name: Strict typecheck
        run: npx -y -p typescript@7 tsc -p tsconfig.runtime-foundation.json --noEmit
      - name: ESM syntax sanity
        run: node --check scripts/generateTypeScript7MigrationMatrix.mjs
