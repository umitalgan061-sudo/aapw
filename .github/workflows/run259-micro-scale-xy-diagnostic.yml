name: Run259 Micro Scale XY Diagnostic

on:
  push:
    branches:
      - agent/run259-editor-micro-scale-current
    paths:
      - '.github/workflows/run259-micro-scale-xy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-xy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check scripts/diagnoseRun259MicroScaleXYSequence.js
      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Diagnose sequential X to Y editing
        run: node scripts/diagnoseRun259MicroScaleXYSequence.js
