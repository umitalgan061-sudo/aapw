name: player-attack-recovery-window
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAttackRecoveryWindow.js'
      - 'scripts/checkPlayerAttackRecoveryWindow.mjs'
      - '.github/workflows/player-attack-recovery-window.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerAttackRecoveryWindow.js && node --check scripts/checkPlayerAttackRecoveryWindow.mjs
      - name: Executable regression
        run: node scripts/checkPlayerAttackRecoveryWindow.mjs
      - name: Scope and boundary
        shell: bash
        run: |
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 3
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          ! git diff --name-only origin/main...HEAD | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline' || true
          ! git diff origin/main...HEAD | grep -E "from ['\"].*EditorMaterialStudio|import\(['\"].*EditorMaterialStudio" || true
          git diff --check
