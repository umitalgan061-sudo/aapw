name: R11 Typed Gameplay Platform

on:
  pull_request:
    paths:
      - 'src/3d/game3d.ts'
      - 'src/3d/gameplay/**'
      - 'scripts/checkTypedGameplayR11.mjs'
      - 'tests/modern/typedGameplayR11.test.ts'
      - 'package.json'
      - '.github/workflows/r11-typed-gameplay.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/**'
      - 'src/3d/game3d.ts'
      - 'scripts/checkTypedGameplayR11.mjs'
      - 'tests/modern/typedGameplayR11.test.ts'
      - 'package.json'
      - '.github/workflows/r11-typed-gameplay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r11-typed-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package.json
      - name: Install toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typed gameplay ownership gate
        run: npm run verify:typed-gameplay-r11
      - name: Typed gameplay regression tests
        run: npm run test:typed-gameplay-r11
      - name: Full TypeScript verification
        run: npm run typecheck
      - name: Diff hygiene
        run: git diff --check
