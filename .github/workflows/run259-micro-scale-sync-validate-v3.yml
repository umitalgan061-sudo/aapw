name: Run259 Micro Scale Sync Validate V3

on:
  push:
    branches:
      - agent/run259-editor-micro-scale-current
    paths:
      - '.github/workflows/run259-micro-scale-sync-validate-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run259-micro-scale-sync-validate-v3
  cancel-in-progress: false

jobs:
  sync-validate-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge exact live main into candidate working tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          BASE_MAIN="$(git rev-parse origin/main)"
          echo "BASE_MAIN=$BASE_MAIN" >> "$GITHUB_ENV"
          git merge --no-edit origin/main
          test "$BASE_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_MAIN" HEAD
          git diff --check
      - name: Syntax and focused micro-scale contracts
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorScaleInputController.js
          node --check scripts/checkRun259EditorMicroScale.mjs
          node --check scripts/checkRun259EditorMicroScaleInputCommitV2.mjs
          node --check scripts/checkRun259EditorMicroScaleBrowserV2.js
          node scripts/checkRun216ScaleInputController.mjs
          node scripts/checkRun259EditorMicroScale.mjs
          node scripts/checkRun259EditorMicroScaleInputCommitV2.mjs
      - name: PWA deterministic and technical-debt safety
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkTechnicalDebt.js
      - name: Install isolated Chromium tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Real World Editor user-like 0.000001 browser proof
        run: node scripts/checkRun259EditorMicroScaleBrowserV2.js
      - name: Mobile performance and full browser smoke
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js
      - name: Final live-main and additive-only publication gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$BASE_MAIN"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Publish validated synchronized candidate
        run: |
          set -euo pipefail
          git push origin HEAD:agent/run259-editor-micro-scale-current
      - name: Upload final micro-scale browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run259-micro-scale-v3-evidence
          path: artifacts/run259-editor-micro-scale-v2
          if-no-files-found: error
