name: Kızıl Ufuk Player Combat Feedback Envelope

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFeedbackEnvelope.js'
      - 'scripts/checkPlayerCombatFeedbackEnvelope.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-feedback-envelope.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-combat-feedback-envelope-20260916-r11'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-head syntax and runtime proof
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/playerCombatFeedbackEnvelope.js
          node --check scripts/checkPlayerCombatFeedbackEnvelope.mjs
          node scripts/checkPlayerCombatFeedbackEnvelope.mjs
      - name: Additive scope guard
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          test "$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a "+" d}')" = "3+0" || {
            git diff --numstat "$BASE"...HEAD
            exit 1
          }
          test "$(git diff --name-only "$BASE"...HEAD | grep -Ev '^(src/3d/gameplay/playerCombatFeedbackEnvelope.js|scripts/checkPlayerCombatFeedbackEnvelope.mjs|.github/workflows/kizil-ufuk-player-combat-feedback-envelope.yml)$' | wc -l)" -eq 0
