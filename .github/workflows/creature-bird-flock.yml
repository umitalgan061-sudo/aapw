name: Creature Bird Flock

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/creatureBrain.js'
      - 'src/3d/gameplay/livingWorldSpawner.js'
      - 'src/3d/gameplay/creatureSpawner.js'
      - 'scripts/checkCreatureBirdFlock.mjs'
      - 'scripts/checkCreatureBirdFlockPopulation.mjs'
      - 'scripts/checkCreatureBirdFlockLodWake.mjs'
      - 'scripts/checkCreatureBirdFlightLifecycle.mjs'
      - 'scripts/checkCreatureBirdFlockMemoryRelease.mjs'
      - 'scripts/checkCreatureBirdFlockBrowser.js'
      - '.github/workflows/creature-bird-flock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 1000
          git diff --check "$BASE_SHA" HEAD
      - name: Bird flock and fauna regression contracts
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/creatureBrain.js
          node --check scripts/checkCreatureBirdFlock.mjs
          node scripts/checkCreatureBirdFlock.mjs
          node --check scripts/checkCreatureBirdFlockPopulation.mjs
          node scripts/checkCreatureBirdFlockPopulation.mjs
          node --check scripts/checkCreatureBirdFlockLodWake.mjs
          node scripts/checkCreatureBirdFlockLodWake.mjs
          node --check scripts/checkCreatureBirdFlightLifecycle.mjs
          node scripts/checkCreatureBirdFlightLifecycle.mjs
          node --check scripts/checkCreatureBirdFlockMemoryRelease.mjs
          node scripts/checkCreatureBirdFlockMemoryRelease.mjs
          node scripts/checkCreatureThreatMemory.mjs
          node scripts/checkCreatureSimulationLod.mjs
          node scripts/checkCreatureHabitatPlacement.mjs
          node scripts/checkCreaturePredatorPrey.mjs
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSharedMaterialPlacementContract.js
      - name: Install Chromium outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Real Three.js bird flock lifecycle proof
        run: node scripts/checkCreatureBirdFlockBrowser.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
