name: SE G65 Road Path Live-Main Qualification

on:
  push:
    branches: [agent/kizil-ufuk-g65-road-path-postmerge-q1-20260813]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/se-g65-terrain3d-road-path.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g65-road-path-live-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.capture.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove qualification harness scope and capture live main
        id: capture
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = ".github/workflows/se-g65-terrain3d-road-path.yml "
          CURRENT_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT_SHA"
          git fetch origin "$CURRENT_SHA"
          git cat-file -e "$CURRENT_SHA:godot/terrain-authoring/geocells/se/g65_road_path.mjs"
          git cat-file -e "$CURRENT_SHA:godot/terrain-authoring/scripts/validate_g65_terrain3d_road_path.gd"
          git cat-file -e "$CURRENT_SHA:scripts/checkSEG65RoadPath.mjs"
          git cat-file -e "$CURRENT_SHA:godot/terrain-authoring/terrain3d.lock.json"
          echo "main_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "G65_ROAD_PATH_LIVE_MAIN_CAPTURED=$CURRENT_SHA"

  authoring:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.base.outputs.main_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preserve captured live main
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$CURRENT_SHA" = "${{ needs.base.outputs.main_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.base.outputs.main_sha }}"
      - name: Regress merged G65 stack through Road Path
        run: |
          set -euo pipefail
          node scripts/checkSEG65Hydrology.mjs | tee "$RUNNER_TEMP/g65-hydrology.log"
          grep -F 'SE_G65_HYDROLOGY_SOURCE_OK' "$RUNNER_TEMP/g65-hydrology.log"
          node scripts/checkSEG65Biome.mjs | tee "$RUNNER_TEMP/g65-biome.log"
          grep -F 'SE_G65_BIOME_OK' "$RUNNER_TEMP/g65-biome.log"
          node scripts/checkSEG65Relief.mjs | tee "$RUNNER_TEMP/g65-relief.log"
          grep -F 'SE_G65_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g65-relief.log"
          node scripts/checkSEG65RockSnow.mjs | tee "$RUNNER_TEMP/g65-rock-snow.log"
          grep -F 'SE_G65_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/g65-rock-snow.log"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Live G65 Road Path exclusion and deterministic source twice
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g65_road_path.mjs
          node --check scripts/checkSEG65RoadPath.mjs
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65RoadPath.mjs | tee "$RUNNER_TEMP/g65-road-path-a.log"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65RoadPath.mjs | tee "$RUNNER_TEMP/g65-road-path-b.log"
          cmp "$RUNNER_TEMP/g65-road-path-a.log" "$RUNNER_TEMP/g65-road-path-b.log"
          grep -F 'SE_G65_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/g65-road-path-a.log"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65RoadPath.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g65-road-path-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g65-road-path-probe.json
      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real live-main Road Path Terrain3D proof twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G65_ROAD_PATH_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_road_path.gd | tee "$RUNNER_TEMP/g65-road-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-road-path-imported-topdown.png "$RUNNER_TEMP/g65-road-path-a.png"
          G65_ROAD_PATH_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_road_path.gd | tee "$RUNNER_TEMP/g65-road-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-road-path-imported-topdown.png "$RUNNER_TEMP/g65-road-path-b.png"
          grep -F 'SE_G65_TERRAIN3D_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/g65-road-t3d-a.log"
          grep -F 'SE_G65_TERRAIN3D_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/g65-road-t3d-b.log"
          cmp "$RUNNER_TEMP/g65-road-path-a.png" "$RUNNER_TEMP/g65-road-path-b.png"
          python3 - "$RUNNER_TEMP/g65-road-t3d-a.log" "$RUNNER_TEMP/g65-road-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G65_TERRAIN3D_ROAD_PATH_METRICS='):
                      return json.loads(line.split('=', 1)[1])
              raise SystemExit('G65 Road/Path metrics missing')
          a, b = metrics(sys.argv[1]), metrics(sys.argv[2])
          stable = ('terrain3dVersion','regionSize','regionCount','alignedSamples','seamSamples','controlSeamSamples','maxHeightError','maxBlendError','maxSeamHeightError','maxSeamBlendError','outputChecksum','canonicalRoadExclusionMarginMeters','phantomRoadSamples','phantomPathSamples','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert a['terrain3dVersion'] == '1.0.2'
          assert a['regionCount'] >= 4 and a['savedRegionFiles'] >= 4
          assert a['alignedSamples'] == 4225 and a['seamSamples'] == 48 and a['controlSeamSamples'] == 20
          assert a['maxHeightError'] <= 0.012 and a['maxBlendError'] <= 0.006
          assert a['maxSeamHeightError'] <= 0.02 and a['maxSeamBlendError'] <= 0.006
          assert a['canonicalRoadExclusionMarginMeters'] > 100
          assert a['phantomRoadSamples'] == 0 and a['phantomPathSamples'] == 0
          assert a['bakedSurfaces'] >= 1 and a['bakedVertices'] > 0
          print('SE_G65_LIVE_MAIN_TERRAIN3D_ROAD_PATH_STABLE_OK')
          PY
      - name: HTerrain regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"

  world-safety:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.base.outputs.main_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preserve captured live main
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$CURRENT_SHA" = "${{ needs.base.outputs.main_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.base.outputs.main_sha }}"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Settlement and road safety regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js

  platform-safety:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.base.outputs.main_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preserve captured live main
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$CURRENT_SHA" = "${{ needs.base.outputs.main_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.base.outputs.main_sha }}"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Determinism PWA mobile and browser regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

  final-exact-main:
    needs: [base, authoring, world-safety, platform-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Final live-main freshness after all evidence
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT_SHA"
          test "$CURRENT_SHA" = "${{ needs.base.outputs.main_sha }}"
          echo "SE_G65_ROAD_PATH_LIVE_MAIN_QUALIFIED=$CURRENT_SHA"
