name: Terrain Facies Exact Head QA

on:
  push:
    branches:
      - codex/terrain-facies-realism-20260914
    paths:
      - 'src/3d/world/terrainMicroSurface.js'
      - 'src/3d/world/terrainSurfaceFacies.js'
      - 'src/3d/world/terrainSurfaceTransitionField.js'
      - 'scripts/checkTerrainSurfaceFacies.mjs'
      - 'scripts/captureFullWorld3DTopdown.mjs'
      - 'scripts/fullWorld3DTopdownHarness.html'
      - '.github/workflows/terrain-facies-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Assert exact head and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "codex/terrain-facies-realism-20260914"
          echo "Exact head: $(git rev-parse HEAD)"
          echo "Exact branch: $GITHUB_REF_NAME"

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/terrainSurfaceFacies.js
          node --check src/3d/world/terrainSurfaceTransitionField.js
          node --check src/3d/world/terrainMicroSurface.js
          node --check scripts/checkTerrainSurfaceFacies.mjs
          node --check scripts/captureFullWorld3DTopdown.mjs

      - name: Deterministic production contract test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkTerrainSurfaceFacies.mjs

      - name: Install isolated browser dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Full-world WebGL visual proof
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/captureFullWorld3DTopdown.mjs \
            --output=artifacts/terrain-facies/full-world.png \
            --width=1600 --height=1100 --segments=240 --focus=world

      - name: Valyria regional WebGL visual proof
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/captureFullWorld3DTopdown.mjs \
            --output=artifacts/terrain-facies/valyria.png \
            --width=1400 --height=1000 --segments=240 --focus=valyria

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: terrain-facies-render-evidence-${{ github.sha }}
          path: artifacts/terrain-facies/
          if-no-files-found: error
