name: terrain-surface-composition

on:
  push:
    paths:
      - 'src/3d/world/terrainSurfaceComposition.js'
      - 'scripts/checkTerrainSurfaceComposition.mjs'
      - '.github/workflows/terrain-surface-composition.yml'
  pull_request:
    paths:
      - 'src/3d/world/terrainSurfaceComposition.js'
      - 'scripts/checkTerrainSurfaceComposition.mjs'
      - '.github/workflows/terrain-surface-composition.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact main ancestry
        run: git merge-base --is-ancestor origin/main HEAD
      - name: Diff budget
        run: |
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Deterministic terrain surface contract
        run: node scripts/checkTerrainSurfaceComposition.mjs
