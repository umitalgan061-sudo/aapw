name: Terrain Polish Godot Globalmap Baker 008

on:
  push:
    branches:
      - 'terrain/polish-iteration-008-globalmap-baker'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-polish-godot-globalmap-baker-008-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul
  BASE_SHA: 3d404c14b55e3e6121b70430fd0359e532b6f285

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main concurrency and scope gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test -f godot/terrain-authoring/addons/zylann.hterrain/plugin.cfg
          test -f godot/terrain-authoring/scripts/build_authored_terrain_probe.gd
          test -f godot/terrain-authoring/scripts/bake_authored_globalmap_probe_08.gd
          grep -F 'TERRAIN_POLISH_ITERATION_08_OK' godot/terrain-authoring/scripts/bake_authored_globalmap_probe_08.gd
          test "$(git ls-files godot/terrain-authoring/terrain_data)" = 'godot/terrain-authoring/terrain_data/.gitkeep'
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project safely
        run: |
          set -euo pipefail
          PROJECT_FILE='godot/terrain-authoring/project.godot'
          BACKUP_FILE="$RUNNER_TEMP/terrain-polish-project.godot"
          cp "$PROJECT_FILE" "$BACKUP_FILE"
          restore_project() { cp "$BACKUP_FILE" "$PROJECT_FILE"; }
          trap restore_project EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('godot/terrain-authoring/project.godot')
          text = path.read_text(encoding='utf-8')
          expected = 'enabled=PackedStringArray("res://addons/zylann.hterrain/plugin.cfg")'
          assert expected in text
          path.write_text(text.replace(expected, 'enabled=PackedStringArray()'), encoding='utf-8')
          PY
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import
          restore_project
          trap - EXIT
          git diff --exit-code -- "$PROJECT_FILE"

      - name: Validate unchanged production authoring scene
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 2>&1 | tee "$RUNNER_TEMP/editor.log"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd 2>&1 | tee "$RUNNER_TEMP/base.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/base.log"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_terrain_polish_iteration_05.gd 2>&1 | tee "$RUNNER_TEMP/iter05.log"
          grep -F 'TERRAIN_POLISH_ITERATION_05_OK' "$RUNNER_TEMP/iter05.log"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_terrain_polish_iteration_06.gd 2>&1 | tee "$RUNNER_TEMP/iter06.log"
          grep -F 'TERRAIN_POLISH_ITERATION_06_OK' "$RUNNER_TEMP/iter06.log"

      - name: Bake authored global map twice and prove determinism
        run: |
          set -euo pipefail
          PROBE='godot/terrain-authoring/terrain_polish_probe_007'
          cleanup() { rm -rf "$PROBE"; }
          trap cleanup EXIT
          for run in a b; do
            cleanup
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/build_authored_terrain_probe.gd 2>&1 | tee "$RUNNER_TEMP/build-$run.log"
            grep -F 'TERRAIN_AUTHORED_PROBE_OK' "$RUNNER_TEMP/build-$run.log"
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import >/dev/null
            cp "$PROBE/global_albedo.png" "$RUNNER_TEMP/global-before-$run.png"
            timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/bake_authored_globalmap_probe_08.gd 2>&1 | tee "$RUNNER_TEMP/bake-$run.log"
            grep -F 'TERRAIN_POLISH_ITERATION_08_OK' "$RUNNER_TEMP/bake-$run.log"
            test -f "$PROBE/global_albedo.png"
            if cmp -s "$RUNNER_TEMP/global-before-$run.png" "$PROBE/global_albedo.png"; then
              echo 'global map did not change'
              exit 1
            fi
            cp "$PROBE/global_albedo.png" "$RUNNER_TEMP/global-after-$run.png"
          done
          cmp "$RUNNER_TEMP/global-after-a.png" "$RUNNER_TEMP/global-after-b.png"
          cmp "$RUNNER_TEMP/bake-a.log" "$RUNNER_TEMP/bake-b.log"
          cleanup
          trap - EXIT
          test ! -e "$PROBE"

      - name: PWA performance determinism and world-safety regression
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkTechnicalDebt.js

      - name: Browser smoke regression
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")" -ge 34

      - name: Final concurrency and protected-scope gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          test "$(git ls-files godot/terrain-authoring/terrain_data)" = 'godot/terrain-authoring/terrain_data/.gitkeep'
          test ! -e godot/terrain-authoring/terrain_polish_probe_007
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data
