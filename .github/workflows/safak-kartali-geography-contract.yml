name: Safak Kartali Living World Geography Contract

on:
  push:
    branches:
      - 'agent/safak-kartali-living-world-director-20260907'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  geography-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check src/3d/gameplay/livingWorldDirector.js
          node --check src/3d/gameplay/livingWorldGeographyAdapter.js
          node --check src/3d/gameplay/livingWorldGeographicScenarioDirector.js
          node --check src/3d/gameplay/livingWorldGroupDirector.js
          node --check src/3d/gameplay/livingWorldRuntimeAdapter.js
          node --check src/3d/gameplay/livingWorldAssetVisualAdapter.js
          node --check src/3d/gameplay/livingWorldSceneryDistribution.js
          node --check src/3d/materials/RuntimeSurfaceAudit.js
          node --check src/3d/sceneManager.js
      - name: Validate living-world director contract
        run: node scripts/checkLivingWorldDirector.mjs
      - name: Validate living-world geography contract
        run: node scripts/checkLivingWorldGeographyContract.mjs
      - name: Validate group AI contract
        run: node scripts/checkLivingWorldGroupDirector.mjs
      - name: Validate runtime adapter contract
        run: node scripts/checkLivingWorldRuntimeAdapter.mjs
      - name: Validate scenery distribution and authored-surface contract
        run: node scripts/checkLivingWorldSceneryDistributionContract.mjs
      - name: Validate actor visual surface contract
        run: node scripts/checkLivingWorldAssetVisualAdapter.mjs
      - name: Validate geographic scenario contract
        run: node scripts/checkLivingWorldGeographicScenarioDirector.mjs
