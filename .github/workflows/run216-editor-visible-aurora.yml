name: Run216 Editor Visible Aurora

on:
  push:
    branches:
      - agent/run216-owner-editor-usability-fixes
    paths:
      - 'src/3d/editor/EditorLiveWorldVisualSync.js'
      - 'scripts/checkRun216EditorVisibleAuroraBrowser.js'
      - '.github/workflows/run216-editor-visible-aurora.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-visible-aurora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Syntax and source contracts
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorLiveWorldVisualSync.js
          node --check scripts/checkRun216EditorVisibleAuroraBrowser.js
          node --check scripts/checkRun216EditorBrightAuthoring.js
          node --check scripts/checkGameNightReadabilityVisualV2.js
          node --check scripts/checkTechnicalDebt.js
          node scripts/checkRun216EditorBrightAuthoring.js
      - name: Install isolated Chromium proof tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run216-visible-aurora-tools"
          npm install --prefix "$RUNNER_TEMP/run216-visible-aurora-tools" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/run216-visible-aurora-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/run216-visible-aurora-tools/node_modules" >> "$GITHUB_ENV"
      - name: Visible aurora two-angle browser proof
        run: node scripts/checkRun216EditorVisibleAuroraBrowser.js
      - name: Full editor desktop and mobile regression proof
        run: node scripts/checkRun216EditorUsabilityBrowser.js
      - name: Gameplay night readability regression
        run: |
          node scripts/checkGameNightReadabilityVisualV2.js
          node scripts/checkLightingVisualContract.js
      - name: Game smoke PWA performance determinism and debt
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run216-visible-aurora-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run216-visible-aurora-smoke.log")" -ge 34
          grep -F 'zero console/page errors' "$RUNNER_TEMP/run216-visible-aurora-smoke.log"
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js origin/main HEAD
      - name: Final concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload visible aurora evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run216-editor-visible-aurora
          path: artifacts/run216-editor-visible-aurora/*.png
          if-no-files-found: warn

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
