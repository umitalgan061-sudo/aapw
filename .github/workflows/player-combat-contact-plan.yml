name: Player Combat Contact Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatContactPlan.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'scripts/checkPlayerCombatContactPlan.mjs'
      - '.github/workflows/player-combat-contact-plan.yml'
  push:
    branches:
      - main
      - 'agent/kizil-ufuk-combat-contact-plan-*'
    paths:
      - 'src/3d/gameplay/playerCombatContactPlan.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'scripts/checkPlayerCombatContactPlan.mjs'
      - '.github/workflows/player-combat-contact-plan.yml'

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Focused combat contact proof
        run: node --experimental-strip-types scripts/checkPlayerCombatContactPlan.mjs
      - name: TypeScript syntax
        run: node --experimental-strip-types --check src/3d/gameplay/playerCombatContactPlan.ts
