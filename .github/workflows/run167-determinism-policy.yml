name: Run 167 Determinism Policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/checkSeededRandomPolicy.js'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardLeashAttackSlotHandoff.mjs'
      - 'scripts/checkNpcGuardLifecycleBrowser.js'
      - 'scripts/checkNpcGuardGroupLifecycleBrowser.js'
      - 'scripts/checkNpcGuardLifecycleFrameRateBrowser.js'
      - 'scripts/checkNpcGuardOcclusionLifecycleBrowser.js'
      - 'scripts/checkNpcGuardHearingLifecycleBrowser.js'
      - 'scripts/checkConfiguredFaunaAssetsBrowser.mjs'
      - 'scripts/checkConfiguredFaunaRuntimeBrowser.mjs'
      - 'src/3d/**'
      - '.github/workflows/run167-determinism-policy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/checkSeededRandomPolicy.js'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardLeashAttackSlotHandoff.mjs'
      - 'scripts/checkNpcGuardLifecycleBrowser.js'
      - 'scripts/checkNpcGuardGroupLifecycleBrowser.js'
      - 'scripts/checkNpcGuardLifecycleFrameRateBrowser.js'
      - 'scripts/checkNpcGuardOcclusionLifecycleBrowser.js'
      - 'scripts/checkNpcGuardHearingLifecycleBrowser.js'
      - 'scripts/checkConfiguredFaunaAssetsBrowser.mjs'
      - 'scripts/checkConfiguredFaunaRuntimeBrowser.mjs'
      - 'src/3d/**'
      - '.github/workflows/run167-determinism-policy.yml'

permissions:
  contents: read

jobs:
  determinism-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hydrate scoped smoke-test LFS assets
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git lfs version
          INCLUDE='assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**'
          for attempt in 1 2 3; do
            if git lfs pull --include="$INCLUDE" --exclude=""; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          mapfile -t scoped_paths < <(git lfs ls-files -n | grep -E '^assets/models/settlements/castles/|^assets/models/characters/|^assets/animations/peasant_girl/|^assets/models/animals/|^assets/models/creatures/dragon/' || true)
          for asset_path in "${scoped_paths[@]}"; do
            if head -n 1 "$asset_path" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then
              encoded_path="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$asset_path")"
              media_url="https://media.githubusercontent.com/media/umitalgan061-sudo/aapw/$HEAD_SHA/$encoded_path"
              curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/lfs-asset" "$media_url"
              test -s "$RUNNER_TEMP/lfs-asset"
              if head -n 1 "$RUNNER_TEMP/lfs-asset" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then
                echo "Scoped asset remained an LFS pointer: $asset_path" >&2
                exit 1
              fi
              mv "$RUNNER_TEMP/lfs-asset" "$asset_path"
            fi
            test -s "$asset_path"
            if head -n 1 "$asset_path" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then
              echo "Scoped asset was not hydrated: $asset_path" >&2
              exit 1
            fi
          done

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Syntax and determinism policy
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/checkSeededRandomPolicy.js
          node --check scripts/smokeTestGame3D.js
          node --check scripts/checkNpcGuardLifecycleContract.mjs
          node --check scripts/checkNpcGuardLifecycleBrowser.js
          node --check scripts/checkNpcGuardGroupLifecycleBrowser.js
          node --check scripts/checkNpcGuardLifecycleFrameRateBrowser.js
          node --check scripts/checkNpcGuardOcclusionLifecycleBrowser.js
          node --check scripts/checkNpcGuardHearingLifecycleBrowser.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkNpcGuardLifecycleContract.mjs
          node scripts/checkAssetsManifest.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Enforce shared PWA gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js

      - name: Determinism guard regression fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_ROOT="$RUNNER_TEMP/determinism-policy-fixture"
          mkdir -p "$FIXTURE_ROOT/vendor"
          printf '/** Math.random() documentation only */\nexport const seeded = 1;\n' > "$FIXTURE_ROOT/fixture.js"
          printf 'export const thirdParty = Math.random();\n' > "$FIXTURE_ROOT/vendor/third-party.js"
          node scripts/checkSeededRandomPolicy.js "$FIXTURE_ROOT"
          printf 'export const forbidden = Math.random();\n' >> "$FIXTURE_ROOT/fixture.js"
          if node scripts/checkSeededRandomPolicy.js "$FIXTURE_ROOT"; then
            echo 'Determinism guard fixture FAILED: executable Math.random() was accepted.' >&2
            exit 1
          fi

      - name: Browser smoke
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/smokeTestGame3D.js 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          SMOKE_STATUS="${PIPESTATUS[0]}"
          set -e
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log" || true)"
          grep -Ei '\[smokeTestGame3D\] (FAIL|SKIP):|FAIL: unexpected error|WebGL disabled|git lfs|pointer|FBXLoader|GLTFLoader|failed to load|unexpected token|page\.(evaluate|goto)' "$RUNNER_TEMP/smoke.log" \
            | tail -n 20 \
            | while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                echo "::error title=Run 167 browser smoke::$line"
              done || true
          if [ "$SMOKE_STATUS" -ne 0 ]; then exit "$SMOKE_STATUS"; fi
          test "$PASS_COUNT" -ge 34

      - name: Guard lifecycle browser regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkNpcGuardLifecycleBrowser.js
          node scripts/checkNpcGuardGroupLifecycleBrowser.js
          node scripts/checkNpcGuardLifecycleFrameRateBrowser.js
          node scripts/checkNpcGuardOcclusionLifecycleBrowser.js
          node scripts/checkNpcGuardHearingLifecycleBrowser.js

      - name: Upload browser smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run167-browser-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Self review
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkSeededRandomPolicy.js; then exit 1; fi
