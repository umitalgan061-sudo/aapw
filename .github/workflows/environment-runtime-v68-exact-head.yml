name: Environment Runtime V68 Exact Head
on:
  pull_request:
    paths:
      - 'src/3d/world/environmentRuntime*V68.js'
      - 'scripts/checkEnvironmentRuntimeV68*.mjs'
      - '.github/workflows/environment-runtime-v68-exact-head.yml'
permissions:
  contents: read
env:
  V68_ROUND_START: de63bd048609750c05aaa6725caf6d15e5d18170
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact head and fresh main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin main --depth=1
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "${{ github.event.pull_request.base.sha }}" = "$(git rev-parse origin/main)"; fi
      - name: 4000+ V68 envelope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          added="$(git diff --numstat "${V68_ROUND_START}...HEAD" -- 'src/3d/world/environmentRuntime*V68.js' 'scripts/checkEnvironmentRuntimeV68*.mjs' '.github/workflows/environment-runtime-v68-exact-head.yml' | awk '{a+=$1} END{print a+0}')"
          echo "V68 meaningful additions=${added}"
          test "${added}" -ge 4001
      - name: Scope guard
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=A "${V68_ROUND_START}...HEAD" | while read -r file; do case "$file" in src/3d/world/environmentRuntime*V68.js|scripts/checkEnvironmentRuntimeV68*.mjs|.github/workflows/environment-runtime-v68-exact-head.yml|.github/workflows/environment-runtime-v68-generator.yml) ;; *) echo "out-of-scope:${file}"; exit 1 ;; esac; done
      - name: Syntax and generated catalog regression
        run: |
          set -euo pipefail
          for f in src/3d/world/environmentRuntime*V68.js scripts/checkEnvironmentRuntimeV68*.mjs; do node --check "$f"; done
          node scripts/checkEnvironmentRuntimeV68Generated.mjs
      - name: Mutation boundary
        run: |
          set -euo pipefail
          ! grep -R "new THREE\|scene\.add\|addMesh\|addGeometry\|createBoxGeometry\|createSphereGeometry" src/3d/world/environmentRuntime*V68.js
      - name: Diff audit
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"