name: Kızıl Ufuk Player Combat Spatial Query

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatSpatialQuery.js'
      - 'scripts/checkPlayerCombatSpatialQuery.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-spatial-query.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-combat-spatial-query-20260916-r9'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatSpatialQuery.js
          node --check scripts/checkPlayerCombatSpatialQuery.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatSpatialQuery.mjs
      - name: Changed-line guard
        shell: bash
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          LINES="$(git diff --numstat "$BASE"...HEAD -- src/3d/gameplay/playerCombatSpatialQuery.js scripts/checkPlayerCombatSpatialQuery.mjs .github/workflows/kizil-ufuk-player-combat-spatial-query.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$LINES" -le 3000
