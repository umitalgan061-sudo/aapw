name: Terrain Polish Iteration 008

on:
  push:
    branches:
      - 'terrain/polish-iteration-008-*'
  pull_request:
    branches:
      - main
    paths:
      - 'game3d.html'
      - 'src/3d/world/worldReferenceSurfaceTerrainVisual.js'
      - 'scripts/checkTerrainPolishIteration08.js'
      - 'scripts/checkTerrainPolishIteration08Browser.js'
      - '.github/workflows/terrain-polish-iteration-008.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-polish-iteration-008-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '213face9edb0369867e30c9dc1c20fd5d4abe13b' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main concurrency and additive entry gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

      - name: Syntax and Iteration 008 source contract
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          node --check scripts/checkTerrainPolishIteration08.js
          node --check scripts/checkTerrainPolishIteration08Browser.js
          node scripts/checkTerrainPolishIteration08.js
          grep -F "installRuntimePindexTerrainPolish();" game3d.html
          grep -F "initGame3D();" game3d.html

      - name: PWA and semantic source regression
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkRun280OwnerMapSemanticFingerprint.js

      - name: Install Chromium dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Deliberate visual delta proof
        run: |
          set -euo pipefail
          node scripts/checkTerrainPolishIteration08Browser.js | tee "$RUNNER_TEMP/terrain-polish-008-browser.log"
          grep -F '[checkTerrainPolishIteration08Browser] PASS' "$RUNNER_TEMP/terrain-polish-008-browser.log"
          test -f artifacts/terrain-polish-iteration-008/before-after.png
          test -f artifacts/terrain-polish-iteration-008/proof.json
          node - <<'NODE'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync('artifacts/terrain-polish-iteration-008/proof.json','utf8'));
          if (!(proof.measuredChangedVertices > 0)) throw new Error('no measured visual delta');
          if (!(proof.detailTouchedVertices > 0)) throw new Error('prepared pindex detail did not reach runtime terrain');
          if (!proof.heightUnchanged) throw new Error('height changed');
          if (!proof.deterministic) throw new Error('visual output is not deterministic');
          if (!proof.idempotent) throw new Error('runtime polish is not idempotent');
          if (proof.consoleErrors !== 0) throw new Error('browser console errors');
          console.log('TERRAIN_POLISH_ITERATION_008_VISUAL_DELTA_OK', proof.measuredChangedVertices, proof.activePindexes);
          NODE

      - name: Full browser smoke and console regression
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/terrain-polish-008-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/terrain-polish-008-smoke.log")" -ge 34

      - name: Performance determinism world safety governance
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js

      - name: Upload Iteration 008 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: terrain-polish-iteration-008-visible-pindex-${{ github.sha }}
          path: artifacts/terrain-polish-iteration-008
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Final exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --numstat "$BASE_SHA"...HEAD -- game3d.html | awk '{sum += $2} END {print sum+0}')" = '0'
          test "$(git diff --numstat "$BASE_SHA"...HEAD -- src/3d/world/worldReferenceSurfaceTerrainVisual.js | awk '{sum += $2} END {print sum+0}')" = '0'
