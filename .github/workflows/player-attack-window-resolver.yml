name: Player Attack Window Resolver

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAttackWindowResolver.js'
      - 'scripts/checkPlayerAttackWindowResolver.mjs'
      - '.github/workflows/player-attack-window-resolver.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime/editor boundary
        run: |
          ! grep -nE "EditorMaterialStudio|from ['\"]three['\"]|require\(['\"]three['\"]\)" src/3d/gameplay/playerAttackWindowResolver.js
      - name: Execute regression twice
        run: |
          node scripts/checkPlayerAttackWindowResolver.mjs > /tmp/attack-window-a.txt
          node scripts/checkPlayerAttackWindowResolver.mjs > /tmp/attack-window-b.txt
          cmp /tmp/attack-window-a.txt /tmp/attack-window-b.txt
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/playerAttackWindowResolver.js scripts/checkPlayerAttackWindowResolver.mjs .github/workflows/player-attack-window-resolver.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
