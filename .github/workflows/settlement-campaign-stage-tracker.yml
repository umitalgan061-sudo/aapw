name: Settlement Campaign Stage Tracker

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementCampaignStageTracker.js'
      - 'scripts/checkSettlementCampaignStageTracker.mjs'
      - '.github/workflows/settlement-campaign-stage-tracker.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementCampaignStageTracker.js'
      - 'scripts/checkSettlementCampaignStageTracker.mjs'
      - '.github/workflows/settlement-campaign-stage-tracker.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementCampaignStageTracker.js && node --check scripts/checkSettlementCampaignStageTracker.mjs
      - name: Contract
        run: node scripts/checkSettlementCampaignStageTracker.mjs
      - name: Runtime boundary
        run: |
          ! grep -nE "EditorMaterialStudio|document|window|MaterialAssignmentCore|WorldAssetPlacementPipeline" src/3d/gameplay/settlementCampaignStageTracker.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/settlementCampaignStageTracker.js scripts/checkSettlementCampaignStageTracker.mjs .github/workflows/settlement-campaign-stage-tracker.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
