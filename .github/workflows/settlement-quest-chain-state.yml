name: Settlement Quest Chain State
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementQuestChainState.js'
      - 'scripts/checkSettlementQuestChainState.mjs'
      - '.github/workflows/settlement-quest-chain-state.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/settlementQuestChainState.js
      - run: node scripts/checkSettlementQuestChainState.mjs
