name: Living World Perception Policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldPerceptionPolicy.js'
      - 'scripts/checkLivingWorldPerceptionPolicy.mjs'
      - '.github/workflows/living-world-perception-policy.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check src/3d/gameplay/livingWorldPerceptionPolicy.js
      - name: Executable contract
        run: node scripts/checkLivingWorldPerceptionPolicy.mjs
