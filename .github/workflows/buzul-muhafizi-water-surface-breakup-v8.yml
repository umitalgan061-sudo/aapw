name: Buzul Muhafızı - Water Surface Breakup v8
on:
  pull_request:
    paths:
      - 'src/3d/world/waterSurfaceBreakup.js'
      - 'scripts/checkWaterSurfaceBreakup.mjs'
      - '.github/workflows/buzul-muhafizi-water-surface-breakup-v8.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-water-anti-moire-v8-20260908'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Exact main ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          changed="$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 3000
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 3
      - name: Syntax
        run: node --check src/3d/world/waterSurfaceBreakup.js && node --check scripts/checkWaterSurfaceBreakup.mjs
      - name: Executable contract
        run: node scripts/checkWaterSurfaceBreakup.mjs
      - name: Runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/world/waterSurfaceBreakup.js
          git diff --check origin/main...HEAD
