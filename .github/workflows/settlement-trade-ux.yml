name: Settlement Trade UX
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementTradeUx.js'
      - 'src/3d/gameplay/settlementTradeUx.test.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - '.github/workflows/settlement-trade-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - run: npm install --no-package-lock --ignore-scripts
      - run: node --check src/3d/gameplay/settlementTradeUx.js
      - run: node --check src/3d/gameplay/settlementTradeUx.test.js
      - run: node src/3d/gameplay/settlementTradeUx.test.js
