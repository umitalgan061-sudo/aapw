name: settlement-service-receipts

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceReceipts.js'
      - 'scripts/checkSettlementServiceReceipts.mjs'
      - '.github/workflows/settlement-service-receipts.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementServiceReceipts.js && node --check scripts/checkSettlementServiceReceipts.mjs
      - name: Executable contract
        run: node scripts/checkSettlementServiceReceipts.mjs
      - name: Boundary guard
        run: |
          ! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|three|document|window" src/3d/gameplay/settlementServiceReceipts.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/settlementServiceReceipts.js scripts/checkSettlementServiceReceipts.mjs .github/workflows/settlement-service-receipts.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
