name: Run 283 Final Head Governance Gate

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: run283-final-head-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hydrate LFS with bounded object retries
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git config lfs.concurrenttransfers 1
          TARGET_SHA="$(git rev-parse HEAD)"
          test "$TARGET_SHA" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          mapfile -t LFS_PATHS < <(git lfs ls-files --name-only)
          test "${#LFS_PATHS[@]}" -gt 0
          BATCH_SIZE=12
          for ((offset=0; offset<${#LFS_PATHS[@]}; offset+=BATCH_SIZE)); do
            batch=("${LFS_PATHS[@]:offset:BATCH_SIZE}")
            include="$(IFS=,; echo "${batch[*]}")"
            hydrated=0
            for attempt in 1 2 3; do
              echo "Hydrating LFS batch $((offset / BATCH_SIZE + 1)) attempt ${attempt}/3 (${#batch[@]} paths) from ${TARGET_SHA}"
              if git lfs fetch origin "$TARGET_SHA" --include="$include" --exclude=""; then
                hydrated=1
                break
              fi
              sleep "$((attempt * 4))"
            done
            if [ "$hydrated" -eq 1 ]; then
              continue
            fi
            echo "Run283 batch hydration remained incomplete; isolating ${#batch[@]} paths."
            for path in "${batch[@]}"; do
              path_hydrated=0
              for attempt in 1 2 3 4 5; do
                echo "Hydrating Run283 LFS path ${path} attempt ${attempt}/5 from ${TARGET_SHA}"
                if git lfs fetch origin "$TARGET_SHA" --include="$path" --exclude=""; then
                  path_hydrated=1
                  break
                fi
                sleep "$((attempt * 5))"
              done
              if [ "$path_hydrated" -ne 1 ]; then
                echo "Run283 LFS path failed after isolated retries: $path" >&2
                exit 1
              fi
            done
          done
          git lfs checkout
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if head -c 200 "$path" | grep -aq 'version https://git-lfs.github.com/spec/v1'; then
              echo "Run283 LFS pointer remained after hydration: $path" >&2
              exit 1
            fi
          done < <(git lfs ls-files --name-only)

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git lfs fsck
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Governance and core regression contracts
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance determinism world safety debt and browser DoD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run283-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run283-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run283-smoke.log")" -ge 34

      - name: Final exact-main concurrency and additive-only gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
