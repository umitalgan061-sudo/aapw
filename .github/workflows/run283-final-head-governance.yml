name: Run 283 Final Head Governance Gate

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: run283-final-head-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hydrate exact-head LFS with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          test "$TARGET_SHA" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git lfs install --local
          git config lfs.concurrenttransfers 1

          for attempt in 1 2 3; do
            git lfs pull origin "$TARGET_SHA" && break
            sleep $((attempt * 5))
          done
          git lfs checkout

          mapfile -t LFS_PATHS < <(git lfs ls-files -n)
          test "${#LFS_PATHS[@]}" -gt 0
          unresolved=()
          for path in "${LFS_PATHS[@]}"; do
            if [ ! -f "$path" ] || head -c 64 "$path" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
              unresolved+=("$path")
            fi
          done

          if [ "${#unresolved[@]}" -gt 0 ]; then
            printf 'Run283 unresolved after bulk pull: %s path(s)\n' "${#unresolved[@]}"
            for path in "${unresolved[@]}"; do
              hydrated=0
              for attempt in 1 2 3 4 5; do
                if git lfs fetch origin "$TARGET_SHA" --include="$path" --exclude=""; then
                  git lfs checkout -- "$path"
                  if [ -f "$path" ] && ! head -c 64 "$path" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
                    hydrated=1
                    break
                  fi
                fi
                sleep $((attempt * 5))
              done
              if [ "$hydrated" -ne 1 ]; then
                echo "Unhydrated LFS pointer after targeted retries: $path" >&2
                exit 1
              fi
            done
          fi

          while IFS= read -r path; do
            test -f "$path"
            if head -c 64 "$path" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
              echo "Unhydrated LFS pointer: $path" >&2
              exit 1
            fi
          done < <(git lfs ls-files -n)
          git lfs fsck

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          test "$TARGET_SHA" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Governance and core regression contracts
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance determinism world safety debt and browser DoD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run283-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run283-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run283-smoke.log")" -ge 34

      - name: Final exact-main concurrency and additive-only gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD