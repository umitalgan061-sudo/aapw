name: Run 283 Final Head Governance Gate

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: run283-final-head-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git lfs fsck
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Run283 governance contract
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkRun283FinalHeadGovernance.js

      - name: Determinism and asset registry contracts
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js

      - name: Offline shell delta guard
        id: offline_shell
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "new_misses=unknown" >> "$GITHUB_OUTPUT"
          set +e
          node scripts/checkServiceWorkerCache.js > "$RUNNER_TEMP/run283-head-pwa.log" 2>&1
          HEAD_PWA_STATUS=$?
          set -e
          if [ "$HEAD_PWA_STATUS" -ne 0 ]; then
            MAIN_WORKTREE="$RUNNER_TEMP/run283-main-baseline"
            git worktree add --detach "$MAIN_WORKTREE" "$BASE_SHA"
            set +e
            (
              cd "$MAIN_WORKTREE"
              node scripts/checkServiceWorkerCache.js > "$RUNNER_TEMP/run283-main-pwa.log" 2>&1
            )
            MAIN_PWA_STATUS=$?
            set -e
            if [ "$MAIN_PWA_STATUS" -eq 0 ]; then
              cat "$RUNNER_TEMP/run283-head-pwa.log"
              echo "new_misses=true" >> "$GITHUB_OUTPUT"
              exit "$HEAD_PWA_STATUS"
            fi
            sed -n 's/^  - //p' "$RUNNER_TEMP/run283-main-pwa.log" | sort -u > "$RUNNER_TEMP/run283-main-misses.txt"
            sed -n 's/^  - //p' "$RUNNER_TEMP/run283-head-pwa.log" | sort -u > "$RUNNER_TEMP/run283-head-misses.txt"
            comm -13 "$RUNNER_TEMP/run283-main-misses.txt" "$RUNNER_TEMP/run283-head-misses.txt" > "$RUNNER_TEMP/run283-new-misses.txt"
            if [ -s "$RUNNER_TEMP/run283-new-misses.txt" ]; then
              echo "[run283] PR introduces new offline-shell misses:" >&2
              cat "$RUNNER_TEMP/run283-new-misses.txt" >&2
              echo "new_misses=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "[run283] no new offline-shell misses versus exact main"
          fi
          echo "new_misses=false" >> "$GITHUB_OUTPUT"

      - name: PWA installability contract
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/checkPwaInstallability.js

      - name: Smoke registry delta contract
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/checkSmokeCheckRegistry.js > "$RUNNER_TEMP/run283-head-smoke-registry.log" 2>&1
          HEAD_REGISTRY_STATUS=$?
          set -e
          if [ "$HEAD_REGISTRY_STATUS" -ne 0 ]; then
            MAIN_WORKTREE="${MAIN_WORKTREE:-$RUNNER_TEMP/run283-main-baseline}"
            if [ ! -d "$MAIN_WORKTREE/.git" ] && [ ! -f "$MAIN_WORKTREE/.git" ]; then
              git worktree add --detach "$MAIN_WORKTREE" "$BASE_SHA"
            fi
            set +e
            (
              cd "$MAIN_WORKTREE"
              node scripts/checkSmokeCheckRegistry.js > "$RUNNER_TEMP/run283-main-smoke-registry.log" 2>&1
            )
            MAIN_REGISTRY_STATUS=$?
            set -e
            if [ "$MAIN_REGISTRY_STATUS" -eq 0 ]; then
              cat "$RUNNER_TEMP/run283-head-smoke-registry.log"
              exit "$HEAD_REGISTRY_STATUS"
            fi
            grep '^\[checkSmokeCheckRegistry\] FAIL:' "$RUNNER_TEMP/run283-main-smoke-registry.log" | grep -v 'violation(s)' | sort -u > "$RUNNER_TEMP/run283-main-smoke-failures.txt" || true
            grep '^\[checkSmokeCheckRegistry\] FAIL:' "$RUNNER_TEMP/run283-head-smoke-registry.log" | grep -v 'violation(s)' | sort -u > "$RUNNER_TEMP/run283-head-smoke-failures.txt" || true
            comm -13 "$RUNNER_TEMP/run283-main-smoke-failures.txt" "$RUNNER_TEMP/run283-head-smoke-failures.txt" > "$RUNNER_TEMP/run283-new-smoke-failures.txt"
            if [ -s "$RUNNER_TEMP/run283-new-smoke-failures.txt" ]; then
              echo "[run283] PR introduces new smoke-registry violations:" >&2
              cat "$RUNNER_TEMP/run283-new-smoke-failures.txt" >&2
              exit 1
            fi
            echo "[run283] no new smoke-registry violations versus exact main"
          else
            cat "$RUNNER_TEMP/run283-head-smoke-registry.log"
          fi

      - name: World reference delta contracts
        shell: bash
        run: |
          set -euo pipefail
          run_world_reference_contracts() {
            node scripts/checkWorldReferenceMap.js
            node scripts/checkWorldReferenceWaterMask.js
            node scripts/checkWorldReferenceAlignment.js
            node scripts/checkWorldReferenceHydrologyExtent.js
          }

          set +e
          run_world_reference_contracts > "$RUNNER_TEMP/run283-head-world-reference.log" 2>&1
          HEAD_WORLD_REFERENCE_STATUS=$?
          set -e
          if [ "$HEAD_WORLD_REFERENCE_STATUS" -eq 0 ]; then
            cat "$RUNNER_TEMP/run283-head-world-reference.log"
          else
            cat "$RUNNER_TEMP/run283-head-world-reference.log" >&2
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              'scripts/checkWorldReference*.js' \
              'src/3d/world/worldReference*.js'; then
              echo "[run283] world-reference contract or source changed in this PR; refusing baseline escape" >&2
              exit "$HEAD_WORLD_REFERENCE_STATUS"
            fi
            MAIN_WORKTREE="${MAIN_WORKTREE:-$RUNNER_TEMP/run283-main-baseline}"
            if [ ! -d "$MAIN_WORKTREE/.git" ] && [ ! -f "$MAIN_WORKTREE/.git" ]; then
              git worktree add --detach "$MAIN_WORKTREE" "$BASE_SHA"
            fi
            set +e
            (
              cd "$MAIN_WORKTREE"
              node scripts/checkWorldReferenceMap.js &&
              node scripts/checkWorldReferenceWaterMask.js &&
              node scripts/checkWorldReferenceAlignment.js &&
              node scripts/checkWorldReferenceHydrologyExtent.js
            ) > "$RUNNER_TEMP/run283-main-world-reference.log" 2>&1
            MAIN_WORLD_REFERENCE_STATUS=$?
            set -e
            if [ "$MAIN_WORLD_REFERENCE_STATUS" -eq 0 ]; then
              echo "[run283] exact main world-reference contracts are green; head regression is owned by this PR" >&2
              exit "$HEAD_WORLD_REFERENCE_STATUS"
            fi
            echo "[run283] PASS: unchanged world-reference contract/source remains pre-existing exact-main debt"
          fi

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Mobile performance budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js 2>&1 | tee "$RUNNER_TEMP/run283-mobile.log"

      - name: Preserve mobile performance RCA
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run283-mobile-perf-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run283-mobile.log
          if-no-files-found: error
          retention-days: 7

      - name: Runtime determinism contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js

      - name: Terrain seat safety contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/terrainSeatSafetyCheck.js

      - name: Road network safety contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/roadNetworkSafetyCheck.js

      - name: Performance trend contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/analyzePerfTrend.js

      - name: Technical debt contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkTechnicalDebt.js

      - name: Shipped browser definition of done
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js 2>&1 | tee "$RUNNER_TEMP/run283-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run283-smoke.log")" -ge 34

      - name: Preserve shipped browser RCA
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run283-shipped-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run283-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Final exact-main concurrency and additive-only gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

      - name: Enforce offline shell delta outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          latest_new_misses="$(awk -F= '/^new_misses=/{value=$2} END{print value}' "$GITHUB_OUTPUT")"
          test "$latest_new_misses" = false
