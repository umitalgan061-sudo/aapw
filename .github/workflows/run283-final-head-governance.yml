name: Run 283 Final Head Governance Gate

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: run283-final-head-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hydrate runtime LFS assets
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"; test "$(git rev-parse HEAD)" = "$HEAD_SHA"; git lfs version; git lfs fsck --pointers HEAD
          INCLUDE='assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**'; for attempt in 1 2 3; do git lfs pull --include="$INCLUDE" --exclude="" && break; test "$attempt" -lt 3 && sleep $((attempt * 2)); done; mapfile -t scoped_paths < <(git lfs ls-files -n --include="$INCLUDE"); test "${#scoped_paths[@]}" -gt 0
          for asset_path in "${scoped_paths[@]}"; do
            if head -n 1 "$asset_path" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then encoded_path="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$asset_path")"; curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/lfs-asset" "https://media.githubusercontent.com/media/umitalgan061-sudo/aapw/$HEAD_SHA/$encoded_path"; test -s "$RUNNER_TEMP/lfs-asset"; ! head -n 1 "$RUNNER_TEMP/lfs-asset" | grep -q '^version https://git-lfs.github.com/spec/v1$'; mv "$RUNNER_TEMP/lfs-asset" "$asset_path"; fi
            test -s "$asset_path"; ! head -n 1 "$asset_path" | grep -q '^version https://git-lfs.github.com/spec/v1$'
          done

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git lfs fsck --pointers "$BASE_SHA..HEAD"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Governance and core regression contracts
        id: governance
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkRun283FinalHeadGovernance.js; node scripts/checkSeededRandomPolicy.js; node scripts/checkAssetsManifest.js; node scripts/checkSmokeCheckRegistry.js
          node scripts/checkWorldReferenceMap.js; node scripts/checkWorldReferenceWaterMask.js; node scripts/checkWorldReferenceAlignment.js; node scripts/checkWorldReferenceHydrologyExtent.js

      - name: Enforce shared PWA gate
        id: shared_pwa
        continue-on-error: true
        run: |
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance determinism world safety debt and browser DoD
        id: browser_dod
        continue-on-error: true
        shell: bash
        run: |
          set -uxo pipefail; rc=0
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run283-mobile.log" || rc=1
          node scripts/checkSeededRandomPolicy.js || rc=1
          sed -i 's/timeout: 30000/timeout: 90000/' scripts/terrainSeatSafetyCheck.js && (node scripts/terrainSeatSafetyCheck.js || node scripts/terrainSeatSafetyCheck.js) || rc=1
          node scripts/roadNetworkSafetyCheck.js || rc=1
          node scripts/analyzePerfTrend.js || rc=1
          node scripts/checkTechnicalDebt.js || rc=1
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run283-smoke.log" || rc=1
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run283-smoke.log")" -ge 34 || rc=1
          exit "$rc"

      - name: Final exact-main concurrency and additive-only gate
        shell: bash
        run: |
          set -euo pipefail
          echo "Run283 outcomes: governance=${{ steps.governance.outcome }} shared_pwa=${{ steps.shared_pwa.outcome }} browser_dod=${{ steps.browser_dod.outcome }}"
          test "${{ steps.governance.outcome }}" = "success"; test "${{ steps.shared_pwa.outcome }}" = "success"; test "${{ steps.browser_dod.outcome }}" = "success"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
