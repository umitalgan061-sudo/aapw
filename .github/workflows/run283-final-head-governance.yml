name: Run 283 Final Head Governance Gate

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: run283-final-head-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git lfs fsck
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Run283 workflow governance contract
        id: run283_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkRun283FinalHeadGovernance.js

      - name: Seeded random policy
        id: seeded_random
        continue-on-error: true
        shell: bash
        run: node scripts/checkSeededRandomPolicy.js

      - name: Assets manifest contract
        id: assets_manifest
        continue-on-error: true
        shell: bash
        run: node scripts/checkAssetsManifest.js

      - name: Service worker cache contract
        id: service_worker_cache
        continue-on-error: true
        shell: bash
        run: node scripts/checkServiceWorkerCache.js

      - name: PWA installability contract
        id: pwa_installability
        continue-on-error: true
        shell: bash
        run: node scripts/checkPwaInstallability.js

      - name: Smoke registry contract
        id: smoke_registry
        continue-on-error: true
        shell: bash
        run: node scripts/checkSmokeCheckRegistry.js

      - name: World reference map contract
        id: world_reference_map
        continue-on-error: true
        shell: bash
        run: node scripts/checkWorldReferenceMap.js

      - name: World reference water mask contract
        id: world_reference_water_mask
        continue-on-error: true
        shell: bash
        run: node scripts/checkWorldReferenceWaterMask.js

      - name: World reference alignment contract
        id: world_reference_alignment
        continue-on-error: true
        shell: bash
        run: node scripts/checkWorldReferenceAlignment.js

      - name: World reference hydrology extent contract
        id: world_reference_hydrology_extent
        continue-on-error: true
        shell: bash
        run: node scripts/checkWorldReferenceHydrologyExtent.js

      - name: Report governance outcomes
        if: always()
        shell: bash
        run: |
          {
            echo '### Run283 governance RCA'
            echo '| Contract | Outcome |'
            echo '| --- | --- |'
            echo '| Run283 workflow | ${{ steps.run283_contract.outcome }} |'
            echo '| Seeded random | ${{ steps.seeded_random.outcome }} |'
            echo '| Assets manifest | ${{ steps.assets_manifest.outcome }} |'
            echo '| Service worker cache | ${{ steps.service_worker_cache.outcome }} |'
            echo '| PWA installability | ${{ steps.pwa_installability.outcome }} |'
            echo '| Smoke registry | ${{ steps.smoke_registry.outcome }} |'
            echo '| World reference map | ${{ steps.world_reference_map.outcome }} |'
            echo '| World water mask | ${{ steps.world_reference_water_mask.outcome }} |'
            echo '| World alignment | ${{ steps.world_reference_alignment.outcome }} |'
            echo '| Hydrology extent | ${{ steps.world_reference_hydrology_extent.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance determinism world safety debt and browser DoD
        id: runtime_dod
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run283-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run283-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run283-smoke.log")" -ge 34

      - name: Final exact-main concurrency and additive-only gate
        id: final_exact_main
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

      - name: Enforce Run283 final-head qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check_outcome() {
            local name="$1"
            local outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error title=Run283 mandatory contract failed::$name outcome=$outcome"
              failures=$((failures + 1))
            fi
          }
          check_outcome 'Run283 workflow governance' '${{ steps.run283_contract.outcome }}'
          check_outcome 'Seeded random policy' '${{ steps.seeded_random.outcome }}'
          check_outcome 'Assets manifest' '${{ steps.assets_manifest.outcome }}'
          check_outcome 'Service worker cache' '${{ steps.service_worker_cache.outcome }}'
          check_outcome 'PWA installability' '${{ steps.pwa_installability.outcome }}'
          check_outcome 'Smoke registry' '${{ steps.smoke_registry.outcome }}'
          check_outcome 'World reference map' '${{ steps.world_reference_map.outcome }}'
          check_outcome 'World reference water mask' '${{ steps.world_reference_water_mask.outcome }}'
          check_outcome 'World reference alignment' '${{ steps.world_reference_alignment.outcome }}'
          check_outcome 'World reference hydrology extent' '${{ steps.world_reference_hydrology_extent.outcome }}'
          check_outcome 'Runtime/browser DoD' '${{ steps.runtime_dod.outcome }}'
          check_outcome 'Final exact-main concurrency and additive-only gate' '${{ steps.final_exact_main.outcome }}'
          echo "Run283 mandatory failure count: $failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
