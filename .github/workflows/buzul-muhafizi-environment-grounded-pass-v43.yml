name: Buzul Muhafızı — Environment Grounded Pass v43

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/environmentGroundedPassV43.js'
      - 'scripts/checkEnvironmentGroundedPassV43.mjs'
      - '.github/workflows/buzul-muhafizi-environment-grounded-pass-v43.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/world/environmentGroundedPassV43.js'
      - 'scripts/checkEnvironmentGroundedPassV43.mjs'
      - '.github/workflows/buzul-muhafizi-environment-grounded-pass-v43.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Focused scope and diff budget
        run: |
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$files" | grep -Fx 'src/3d/world/environmentGroundedPassV43.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkEnvironmentGroundedPassV43.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/buzul-muhafizi-environment-grounded-pass-v43.yml'
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/world/environmentGroundedPassV43.js
          node --check scripts/checkEnvironmentGroundedPassV43.mjs
      - name: Runtime contract
        run: node scripts/checkEnvironmentGroundedPassV43.mjs
      - name: Boundary guard
        run: |
          ! grep -R "EditorMaterialStudio\|createBoxGeometry\|createSphereGeometry\|createConeGeometry\|terrain.js\|water.js\|sceneManager.js\|naturalGeology.js\|rivers.js\|roads.js" \
            src/3d/world/environmentGroundedPassV43.js \
            scripts/checkEnvironmentGroundedPassV43.mjs
      - name: Diff hygiene
        run: |
          ! git diff --check origin/main...HEAD
