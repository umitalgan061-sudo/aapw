name: One-shot Natural Ridge Patch

on:
  push:
    branches:
      - codex/foundation-grounding-20260821
    paths:
      - '.github/workflows/one-shot-natural-ridge-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch long-range relief and crowd camera
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          relief_path = Path('src/3d/world/worldReferenceMountainRelief.js')
          relief = relief_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          relief = replace_once(
              relief,
              "id: 'owner-map-live-mountain-relief-2026-08-24-v4-ridge-continuity'",
              "id: 'owner-map-live-mountain-relief-2026-08-24-v5-natural-long-ranges'",
              'policy id',
          )

          relief = replace_once(
              relief,
              "\t\t'bone-mountains': Object.freeze({\n\t\t\tpeakMeters: 1100,\n\t\t\tcoreWidthNormalized: 0.008,\n\t\t\touterWidthNormalized: 0.060,\n\t\t\tsummitFloor: 0.28,\n\t\t\tsummitNoiseExponent: 1.5,\n\t\t\tseed: 37,\n\t\t}),",
              "\t\t'bone-mountains': Object.freeze({\n\t\t\tpeakMeters: 820,\n\t\t\tcoreWidthNormalized: 0.007,\n\t\t\touterWidthNormalized: 0.094,\n\t\t\tsummitFloor: 0.36,\n\t\t\tsummitNoiseExponent: 1.3,\n\t\t\tcoordinateWarpScale: 2.0,\n\t\t\tshoulderDetailStrength: 0.22,\n\t\t\tshoulderDetailFrequency: 31,\n\t\t\tseed: 37,\n\t\t}),",
              'bone profile',
          )
          relief = replace_once(
              relief,
              "\t\t'eastern-chain': Object.freeze({\n\t\t\tpeakMeters: 1100,\n\t\t\tcoreWidthNormalized: 0.007,\n\t\t\touterWidthNormalized: 0.055,\n\t\t\tsummitFloor: 0.28,\n\t\t\tsummitNoiseExponent: 1.5,\n\t\t\tseed: 53,\n\t\t}),",
              "\t\t'eastern-chain': Object.freeze({\n\t\t\tpeakMeters: 760,\n\t\t\tcoreWidthNormalized: 0.006,\n\t\t\touterWidthNormalized: 0.088,\n\t\t\tsummitFloor: 0.36,\n\t\t\tsummitNoiseExponent: 1.3,\n\t\t\tcoordinateWarpScale: 2.0,\n\t\t\tshoulderDetailStrength: 0.22,\n\t\t\tshoulderDetailFrequency: 29,\n\t\t\tseed: 53,\n\t\t}),",
              'eastern profile',
          )

          relief = replace_once(
              relief,
              "\treturn policy.minimumScale + (policy.maximumScale - policy.minimumScale) * blend;\n}\n\nfunction sampleTalusBreakup",
              "\treturn policy.minimumScale + (policy.maximumScale - policy.minimumScale) * blend;\n}\n\nfunction sampleProfileShoulderDetailScale(normalizedX, normalizedY, profile) {\n\tconst strength = profile.shoulderDetailStrength ?? 0;\n\tif (strength <= 0) return 1;\n\tconst frequency = profile.shoulderDetailFrequency ?? 29;\n\tconst detail = valueNoise2D(\n\t\tnormalizedX * frequency + profile.seed * 0.17,\n\t\tnormalizedY * frequency - profile.seed * 0.11,\n\t\tprofile.seed + 733,\n\t);\n\treturn 1 + (detail - 0.5) * 2 * strength;\n}\n\nfunction sampleTalusBreakup",
              'shoulder detail helper',
          )

          relief = replace_once(
              relief,
              "\tconst maximumWidthScale = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.shoulderWidthVariation.maximumScale;",
              "\tconst maximumWidthScale = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.shoulderWidthVariation.maximumScale\n\t\t* (1 + (profile.shoulderDetailStrength ?? 0));",
              'compiled width bound',
          )

          relief = replace_once(
              relief,
              "\t\tconst warpPaddingX = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.coordinateWarpNormalized * MAP_ASPECT * 0.5;\n\t\tconst warpPaddingY = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.coordinateWarpNormalized * 0.5;",
              "\t\tconst coordinateWarpScale = chain.profile.coordinateWarpScale ?? 1;\n\t\tconst coordinateWarpNormalized = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.coordinateWarpNormalized * coordinateWarpScale;\n\t\tconst warpPaddingX = coordinateWarpNormalized * MAP_ASPECT * 0.5;\n\t\tconst warpPaddingY = coordinateWarpNormalized * 0.5;",
              'warp padding',
          )
          relief = replace_once(
              relief,
              "\t\t\t* WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.coordinateWarpNormalized * MAP_ASPECT;\n\t\tconst warpY = (valueNoise2D(normalizedX * warpFrequency + 31, normalizedY * warpFrequency - 17, chain.profile.seed) - 0.5)\n\t\t\t* WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.coordinateWarpNormalized;",
              "\t\t\t* coordinateWarpNormalized * MAP_ASPECT;\n\t\tconst warpY = (valueNoise2D(normalizedX * warpFrequency + 31, normalizedY * warpFrequency - 17, chain.profile.seed) - 0.5)\n\t\t\t* coordinateWarpNormalized;",
              'warp application',
          )
          relief = replace_once(
              relief,
              "\t\tconst widthScale = sampleShoulderWidthScale(normalizedX, normalizedY, chain.profile.seed);",
              "\t\tconst widthScale = sampleShoulderWidthScale(normalizedX, normalizedY, chain.profile.seed)\n\t\t\t* sampleProfileShoulderDetailScale(normalizedX, normalizedY, chain.profile);",
              'profile shoulder detail consumption',
          )
          relief_path.write_text(relief)

          continuity_path = Path('scripts/checkEasternMountainRidgeContinuity.mjs')
          continuity_path.write_text(dedent("""\
          #!/usr/bin/env node
          import assert from 'node:assert/strict';

          import {
            REFERENCE_RELIEF_CHAINS,
            WORLD_REFERENCE_MAP,
          } from '../src/3d/world/worldReferenceMap.js';
          import {
            WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY,
            sampleNormalizedReferenceMountainReliefMeters,
            sampleReferenceDryLandWeight,
          } from '../src/3d/world/worldReferenceMountainRelief.js';

          const TARGET_CHAINS = new Set(['bone-mountains', 'eastern-chain']);
          const MAP_ASPECT = WORLD_REFERENCE_MAP.pixelWidth / WORLD_REFERENCE_MAP.pixelHeight;
          const evidence = {};

          function percentile(sorted, fraction) {
            if (!sorted.length) return 0;
            const index = Math.min(sorted.length - 1, Math.max(0, Math.round((sorted.length - 1) * fraction)));
            return sorted[index];
          }

          function isInteriorDry(x, y) {
            const radiusY = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.coastalReliefTaper.radiusNormalized;
            const radiusX = radiusY / MAP_ASPECT;
            const probes = [
              [x, y],
              [x - radiusX, y],
              [x + radiusX, y],
              [x, y - radiusY],
              [x, y + radiusY],
            ];
            return probes.every(([px, py]) =>
              px >= 0 && px <= 1 && py >= 0 && py <= 1 &&
              sampleReferenceDryLandWeight(px, py) >= WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.landGateFull);
          }

          for (const chain of REFERENCE_RELIEF_CHAINS.filter(({ id }) => TARGET_CHAINS.has(id))) {
            const profile = WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.chains[chain.id];
            assert(profile, `${chain.id}: runtime profile missing`);
            assert(profile.peakMeters <= 850, `${chain.id}: peak cap ${profile.peakMeters}m is too tall for a long map-scale ridge`);
            assert(profile.outerWidthNormalized >= 0.085, `${chain.id}: shoulder width ${profile.outerWidthNormalized} is too narrow and column-like`);
            assert(profile.summitFloor >= 0.32, `${chain.id}: summit floor ${profile.summitFloor} can collapse a long ridge into plugs`);
            assert(profile.summitNoiseExponent <= 1.4, `${chain.id}: summit exponent ${profile.summitNoiseExponent} over-concentrates local peaks`);
            assert(profile.coordinateWarpScale >= 1.5 && profile.coordinateWarpScale <= 2.4, `${chain.id}: map-safe ridge warp is outside the audited envelope`);
            assert(profile.shoulderDetailStrength >= 0.15 && profile.shoulderDetailStrength <= 0.28, `${chain.id}: shoulder detail is not visibly irregular but bounded`);

            const allDryHeights = [];
            const heights = [];
            const samples = [];
            for (let segment = 0; segment < chain.points.length - 1; segment += 1) {
              const a = chain.points[segment];
              const b = chain.points[segment + 1];
              for (let step = segment === 0 ? 0 : 1; step <= 80; step += 1) {
                const t = step / 80;
                const x = a[0] + (b[0] - a[0]) * t;
                const y = a[1] + (b[1] - a[1]) * t;
                const dry = sampleReferenceDryLandWeight(x, y);
                const meters = sampleNormalizedReferenceMountainReliefMeters(x, y);
                if (dry < WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.landGateFull) continue;
                assert(Number.isFinite(meters) && meters > 0, `${chain.id}: dry centerline relief vanished at ${x},${y}`);
                allDryHeights.push(meters);
                if (!isInteriorDry(x, y)) continue;
                heights.push(meters);
                samples.push({ x, y, meters });
              }
            }

            assert(allDryHeights.length >= 60, `${chain.id}: too few source-owned dry centerline samples`);
            assert(heights.length >= 36, `${chain.id}: too few interior-dry samples for ridge continuity`);
            const sorted = [...heights].sort((a, b) => a - b);
            const p10 = percentile(sorted, 0.10);
            const median = percentile(sorted, 0.50);
            const p90 = percentile(sorted, 0.90);
            const maximum = sorted.at(-1);
            const minimum = sorted[0];

            assert(p10 >= profile.peakMeters * 0.14, `${chain.id}: interior lower ridge body collapsed (${p10.toFixed(1)}m)`);
            assert(median >= profile.peakMeters * 0.22, `${chain.id}: interior median ridge body is too weak (${median.toFixed(1)}m)`);
            assert(p90 / Math.max(p10, 1) <= 3.2, `${chain.id}: p90/p10 ${(p90 / Math.max(p10, 1)).toFixed(2)} reads as isolated summit spikes`);
            assert(maximum / Math.max(median, 1) <= 2.8, `${chain.id}: max/median ${(maximum / Math.max(median, 1)).toFixed(2)} is too column-like`);

            let largestNeighbourJump = 0;
            for (let index = 1; index < samples.length; index += 1) {
              const previous = samples[index - 1];
              const current = samples[index];
              const distance = Math.hypot(current.x - previous.x, current.y - previous.y);
              if (distance > 0.01) continue;
              const ratio = Math.max(previous.meters, current.meters) / Math.max(1, Math.min(previous.meters, current.meters));
              largestNeighbourJump = Math.max(largestNeighbourJump, ratio);
            }
            assert(largestNeighbourJump <= 1.45, `${chain.id}: adjacent interior ridge samples jump ${largestNeighbourJump.toFixed(2)}x`);

            evidence[chain.id] = {
              dryCenterlineSamples: allDryHeights.length,
              interiorDrySamples: heights.length,
              minimumMeters: Number(minimum.toFixed(2)),
              p10Meters: Number(p10.toFixed(2)),
              medianMeters: Number(median.toFixed(2)),
              p90Meters: Number(p90.toFixed(2)),
              maximumMeters: Number(maximum.toFixed(2)),
              p90ToP10: Number((p90 / Math.max(p10, 1)).toFixed(3)),
              maxToMedian: Number((maximum / Math.max(median, 1)).toFixed(3)),
              largestNeighbourJump: Number(largestNeighbourJump.toFixed(3)),
              peakMeters: profile.peakMeters,
              outerWidthNormalized: profile.outerWidthNormalized,
              summitFloor: profile.summitFloor,
              summitNoiseExponent: profile.summitNoiseExponent,
              shoulderDetailStrength: profile.shoulderDetailStrength,
            };
          }

          assert.deepEqual(Object.keys(evidence).sort(), [...TARGET_CHAINS].sort(), 'both long eastern mountain chains must be audited');
          console.log('EASTERN_MOUNTAIN_RIDGE_CONTINUITY_OK', JSON.stringify({
            policyId: WORLD_REFERENCE_MOUNTAIN_RELIEF_POLICY.id,
            evidence,
          }));
          """))

          crowd_path = Path('scripts/checkNorthSnowPineCrowdVisualQa.js')
          crowd = crowd_path.read_text()
          crowd = replace_once(
              crowd,
              "    const gameplayRender = renderView([520, 185, 610], [0, 48, -30], 'gameplay / three-quarter stand readability');",
              "    const gameplayTarget = [crowdCenter.x, crowdCenter.y + 8, crowdCenter.z];\n    const gameplayCamera = [crowdCenter.x + 260, crowdCenter.y + 105, crowdCenter.z + 320];\n    const gameplayRender = renderView(gameplayCamera, gameplayTarget, 'gameplay / close three-quarter stand readability');",
              'snow-pine gameplay camera',
          )
          crowd_path.write_text(crowd)
          PY

      - name: Validate patched mountain contracts
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/worldReferenceMountainRelief.js
          node --check scripts/checkEasternMountainRidgeContinuity.mjs
          node --check scripts/checkNorthSnowPineCrowdVisualQa.js
          node scripts/checkEasternMountainRidgeContinuity.mjs
          node scripts/checkMountainNaturalizationProfile.mjs
          node scripts/checkMountainNaturalizationDeterminism.mjs

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/3d/world/worldReferenceMountainRelief.js scripts/checkEasternMountainRidgeContinuity.mjs scripts/checkNorthSnowPineCrowdVisualQa.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch changes produced'; exit 1; }
          git commit -m 'feat(world): naturalize long eastern mountain ranges'
          git push origin HEAD:codex/foundation-grounding-20260821
