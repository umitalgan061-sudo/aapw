name: Run 167 Governance Finalize

on:
  push:
    branches:
      - agent/run167-determinism-ci-fix
    paths:
      - 'scripts/recordRun167Governance.js'
      - '.github/workflows/run167-governance-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BASE_SHA: 046b77edb3494bd995a5e46a8bfa782fcac2dc4b
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md && test -f 3D_GAME_PROGRESS.md && test -f DECISIONS.md && test -f QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
          tail -n 180 GOVERNANCE.md
          tail -n 180 3D_GAME_PROGRESS.md
          tail -n 120 DECISIONS.md
          tail -n 100 QUESTIONS_FOR_OWNER.md

      - name: Baseline full browser smoke on main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run167-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run167-smoke-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run167-smoke-before.log")" -ge 34)
          git worktree remove "$BASELINE"

      - name: Syntax deterministic PWA world gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkSeededRandomPolicy.js
          node --check scripts/recordRun167Governance.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Determinism guard regression fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_ROOT="$RUNNER_TEMP/determinism-policy-fixture"
          mkdir -p "$FIXTURE_ROOT/vendor"
          printf '/** Math.random() documentation only */\nexport const seeded = 1;\n' > "$FIXTURE_ROOT/fixture.js"
          printf 'export const thirdParty = Math.random();\n' > "$FIXTURE_ROOT/vendor/third-party.js"
          node scripts/checkSeededRandomPolicy.js "$FIXTURE_ROOT"
          printf 'export const forbidden = Math.random();\n' >> "$FIXTURE_ROOT/fixture.js"
          if node scripts/checkSeededRandomPolicy.js "$FIXTURE_ROOT"; then
            echo 'Determinism guard fixture FAILED: executable Math.random() was accepted.' >&2
            exit 1
          fi

      - name: Full browser smoke after change and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run167-smoke-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run167-smoke-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run167-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run167-smoke-after.log"; then exit 1; fi
          echo "RUN167_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"

      - name: Mobile near and F4 far visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js

      - name: Upload Run 167 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run167-determinism-render-evidence
          path: artifacts/run130-mobile/*.png
          if-no-files-found: error

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run167 | tee "$RUNNER_TEMP/run167-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run167-perf-trend.log"
          PERF_ROW="$(grep '^\[collectPerfSnapshot\] sampled:' "$RUNNER_TEMP/run167-perf.log" | tail -n 1 | sed 's/^\[collectPerfSnapshot\] sampled: //')"
          test -n "$PERF_ROW"
          test "$(printf '%s\n' "$PERF_ROW" | awk -F',' '{print NF}')" -eq 8
          echo "RUN167_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"

      - name: Restore tracked perf ledger before governance append
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- perf_log.csv

      - name: Senior self-review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkSeededRandomPolicy.js scripts/recordRun167Governance.js; then exit 1; fi
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Prepare Run 167 governance values
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN167_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN167_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Record Run 167 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun167Governance.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js

      - name: Final publish concurrency gate and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "docs(governance): record run 167 determinism repair"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:agent/run167-determinism-ci-fix

      - name: Best-effort stable tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RUN167_STABLE_TAG"
          git push origin "$RUN167_STABLE_TAG" || true
