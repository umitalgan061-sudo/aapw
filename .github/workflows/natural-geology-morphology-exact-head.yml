name: Natural Geology Morphology Exact Head

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/naturalGeologyPlacement.js'
      - 'scripts/checkNaturalGeologyMorphology.mjs'
      - 'scripts/captureNaturalGeologyShippedScene.mjs'
      - 'scripts/checkNaturalGeologySourceContract.mjs'
      - '.github/workflows/natural-geology-morphology-exact-head.yml'
  push:
    branches: ['codex/natural-geology-morphology-20260831']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natural-geology-morphology-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact-main base, single purpose and hard quota
        run: |
          set -euo pipefail
          git fetch origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          BASE_SHA="$(git merge-base HEAD "$LIVE_MAIN_SHA")"
          test "$BASE_SHA" = "$LIVE_MAIN_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/naturalGeologyPlacement\.js|scripts/checkNaturalGeologyMorphology\.mjs|scripts/captureNaturalGeologyShippedScene\.mjs|scripts/checkNaturalGeologySourceContract\.mjs|\.github/workflows/natural-geology-morphology-exact-head\.yml)$' | wc -l)" -eq 0
          A="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1}END{print s+0}')"
          D="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2}END{print s+0}')"
          echo "natural geology morphology additions=$A deletions=$D total=$((A+D))"
          test $((A+D)) -le 1000

      - name: Prepare Node terrain imports
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0
          node scripts/setupNodeThreeShim.mjs

      - name: Determinism, morphology, grounding and shared placement contracts
        run: |
          set -euo pipefail
          node --check src/3d/world/naturalGeologyPlacement.js
          node --check scripts/checkNaturalGeologyPlacement.mjs
          node --check scripts/checkNaturalGeologyMorphology.mjs
          node --check scripts/captureNaturalGeologyShippedScene.mjs
          node scripts/checkNaturalGeologyPlacement.mjs
          node scripts/checkNaturalGeologyMorphology.mjs
          node scripts/checkNaturalGeologySourceContract.mjs
          node scripts/checkSharedMaterialPlacementContract.js

      - name: Install Chromium for shipped createScene proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Shipped createScene full-world and terrain-near geology proof
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          sed -i "s/type: 'png' });/type: 'png', timeout: 120000 });/g" scripts/captureNaturalGeologyShippedScene.mjs
          node scripts/captureNaturalGeologyShippedScene.mjs

      - name: Mobile performance regression safety
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          mkdir -p artifacts/natural-geology-morphology/regression-logs
          node scripts/checkMobilePerfBudget.js 2>&1 | tee artifacts/natural-geology-morphology/regression-logs/mobile-perf.log

      - name: Browser regression smoke
        if: always()
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          mkdir -p artifacts/natural-geology-morphology/regression-logs
          node scripts/smokeTestGame3D.js 2>&1 | tee artifacts/natural-geology-morphology/regression-logs/browser-smoke.log

      - name: Final exact-main freshness
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - name: Upload deterministic visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-geology-morphology-proof
          path: artifacts/natural-geology-morphology/
          if-no-files-found: warn
          retention-days: 7
