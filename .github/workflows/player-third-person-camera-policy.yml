name: player-third-person-camera-policy
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerThirdPersonCameraPolicy.js'
      - 'scripts/checkPlayerThirdPersonCameraPolicy.mjs'
      - '.github/workflows/player-third-person-camera-policy.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main ancestry
        run: git merge-base --is-ancestor origin/main HEAD
      - name: Diff cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerThirdPersonCameraPolicy.js && node --check scripts/checkPlayerThirdPersonCameraPolicy.mjs
      - name: Contract
        run: node scripts/checkPlayerThirdPersonCameraPolicy.mjs
