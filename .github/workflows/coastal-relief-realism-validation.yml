name: Coastal Relief Realism Validation
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main focused scope and static contracts
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/(terrain|worldReferenceCoastalRelief|worldReferenceSurfaceTerrainVisual)\.js|scripts/checkWorldReferenceCoastalRelief\.mjs|service-worker\.js|\.github/workflows/coastal-relief-realism-validation\.yml)$' | wc -l)" -eq 0
          node --check src/3d/world/worldReferenceCoastalRelief.js
          node --check src/3d/world/terrain.js
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          node scripts/checkWorldReferenceCoastalRelief.mjs
          node scripts/checkServiceWorkerCache.js
      - name: Hydrate real-game smoke assets
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**" --exclude=""
      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Gameplay terrain safety
        run: |
          set -euo pipefail
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Real runtime coastal geometry proof and screenshots
        run: |
          set -euo pipefail
          mkdir -p artifacts/coastal-relief-realism
          node <<'NODE'
          const fs = require('fs');
          const { startStaticServer, loadPlaywright } = require('./scripts/devServerHelper.js');
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            const i = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[i] : (sorted[i - 1] + sorted[i]) * 0.5;
          };

          (async () => {
            const playwright = loadPlaywright();
            if (!playwright) throw new Error('Playwright unavailable');
            const server = await startStaticServer();
            const baseUrl = `http://127.0.0.1:${server.address().port}`;
            const browser = await playwright.chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1536, height: 1024 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', (e) => errors.push(`page:${e.message}`));
            page.on('console', (m) => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });
            try {
              await page.goto(`${baseUrl}/scripts/fixtures/sw-g07-runtime-visual-harness.html`, { waitUntil: 'load', timeout: 30000 });
              const metrics = await page.evaluate(async () => {
                const importMap = document.createElement('script');
                importMap.type = 'importmap';
                importMap.textContent = JSON.stringify({ imports: {
                  three: '/src/3d/vendor/three/three.module.js',
                  'three/addons/': '/src/3d/vendor/three/addons/',
                } });
                document.head.append(importMap);
                document.body.innerHTML = '<canvas id="coastal-runtime-proof"></canvas>';
                Object.assign(document.documentElement.style, { margin: '0', width: '100%', height: '100%', background: '#07151d' });
                Object.assign(document.body.style, { margin: '0', width: '100%', height: '100%', overflow: 'hidden', background: '#07151d' });
                const canvas = document.getElementById('coastal-runtime-proof');
                Object.assign(canvas.style, { width: '100vw', height: '100vh', display: 'block' });

                const THREE = await import('/src/3d/vendor/three/three.module.js');
                const { createScene } = await import('/src/3d/sceneManager.js');
                const { WORLD_DEFAULTS, WORLD_SCALE } = await import('/src/3d/config.js');
                const { createHeightSampler } = await import('/src/3d/world/terrain.js');
                const { sampleWorldReferenceCoastalProfile, WORLD_REFERENCE_COASTAL_RELIEF_POLICY } = await import('/src/3d/world/worldReferenceCoastalRelief.js');
                const { sampleWorldReferenceMountainReliefMeters } = await import('/src/3d/world/worldReferenceMountainRelief.js');

                const state = createScene(canvas);
                state.controls.enabled = false;
                state.scene.fog = null;
                state.sky.visible = false;
                state.stars.visible = false;
                state.renderer.setPixelRatio(1);
                state.renderer.setSize(1536, 1024, false);
                state.chunkManager.loadSquare(0, 0, 12);

                const sampleHeight = createHeightSampler(WORLD_DEFAULTS.WORLD_SEED);
                const halfWidth = WORLD_SCALE.WORLD_WIDTH_METERS * 0.5;
                const halfDepth = WORLD_SCALE.WORLD_DEPTH_METERS * 0.5;
                const nearshore = [];
                const inland = [];
                const pureSea = [];
                const coastCandidates = [];
                for (let z = -halfDepth; z <= halfDepth; z += 150) {
                  for (let x = -halfWidth; x <= halfWidth; x += 150) {
                    const profile = sampleWorldReferenceCoastalProfile(x, z);
                    if (!profile.insideReference) continue;
                    const height = sampleHeight(x, z);
                    if (profile.surface === 'sea' && profile.dryLandWeight <= 0.05) pureSea.push(height);
                    if (profile.dryLandWeight >= 0.85 && sampleWorldReferenceMountainReliefMeters(x, z) < 8) {
                      if (profile.landDistanceMeters <= 375) nearshore.push(height);
                      if (profile.landDistanceMeters >= 1400) inland.push(height);
                      if (profile.landDistanceMeters >= 300 && profile.landDistanceMeters <= 650 && height < 120) {
                        coastCandidates.push({ x, z, height, distance: profile.landDistanceMeters });
                      }
                    }
                  }
                }
                if (nearshore.length < 20 || inland.length < 20 || pureSea.length < 100) throw new Error('insufficient integrated profile samples');

                const directions = [
                  [1,0],[-1,0],[0,1],[0,-1],[0.707,0.707],[0.707,-0.707],[-0.707,0.707],[-0.707,-0.707],
                ];
                let coastView = null;
                for (const candidate of coastCandidates.sort((a,b) => Math.abs(a.distance-450)-Math.abs(b.distance-450))) {
                  for (const [dx, dz] of directions) {
                    const probe = sampleWorldReferenceCoastalProfile(candidate.x + dx * 800, candidate.z + dz * 800);
                    if (probe.insideReference && probe.surface === 'sea' && probe.dryLandWeight < 0.2) {
                      coastView = { ...candidate, waterDx: dx, waterDz: dz };
                      break;
                    }
                  }
                  if (coastView) break;
                }
                if (!coastView) throw new Error('could not resolve a coast-facing camera anchor');

                window.__coastalProof = { THREE, state, WORLD_SCALE, WORLD_DEFAULTS, sampleHeight, coastView };
                return {
                  policyId: WORLD_REFERENCE_COASTAL_RELIEF_POLICY.id,
                  terrainMeshCount: state.chunkManager.loaded.size,
                  nearshoreCount: nearshore.length,
                  inlandCount: inland.length,
                  pureSeaCount: pureSea.length,
                  nearshoreMedianMeters: nearshore.sort((a,b)=>a-b)[Math.floor(nearshore.length/2)],
                  inlandMedianMeters: inland.sort((a,b)=>a-b)[Math.floor(inland.length/2)],
                  pureSeaMaximumMeters: Math.max(...pureSea),
                  waterLevelMeters: WORLD_DEFAULTS.WATER_LEVEL_METERS,
                  coastView,
                };
              });

              if (metrics.terrainMeshCount < 500) throw new Error(`full-world terrain incomplete: ${metrics.terrainMeshCount}`);
              if (metrics.inlandMedianMeters < metrics.nearshoreMedianMeters + 20) {
                throw new Error(`integrated inland rise too small: shore=${metrics.nearshoreMedianMeters}, inland=${metrics.inlandMedianMeters}`);
              }
              if (metrics.pureSeaMaximumMeters >= metrics.waterLevelMeters + 0.05) {
                throw new Error(`pure sea terrain leaked above water: ${metrics.pureSeaMaximumMeters}`);
              }

              await page.evaluate(() => {
                const { THREE, state, WORLD_SCALE } = window.__coastalProof;
                const worldWidth = WORLD_SCALE.WORLD_WIDTH_METERS;
                const worldDepth = WORLD_SCALE.WORLD_DEPTH_METERS;
                const aspect = 1536 / 1024;
                const halfWidth = Math.max(worldWidth / 2, worldDepth * aspect / 2) * 1.025;
                const halfHeight = halfWidth / aspect;
                state.water.geometry.computeBoundingBox();
                const extent = state.water.geometry.boundingBox.max.x - state.water.geometry.boundingBox.min.x;
                const coverage = Math.max(halfWidth * 2, halfHeight * 2) * 1.04;
                state.water.scale.set(coverage / extent, 1, coverage / extent);
                state.water.position.set(0, state.water.position.y, 0);
                const depthTexture = new THREE.DataTexture(new Uint8Array([255,255,255,255]), 1, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
                depthTexture.needsUpdate = true;
                state.water.material.uniforms.uDepthMap.value = depthTexture;
                state.water.material.uniforms.uDepthFieldExtentMeters.value = 1;
                state.water.material.uniforms.uSwellStrength.value = 0;
                const camera = new THREE.OrthographicCamera(-halfWidth, halfWidth, halfHeight, -halfHeight, 1, 30000);
                camera.up.set(0, 0, -1);
                camera.position.set(0, 13000, 0);
                camera.lookAt(0, 0, 0);
                camera.updateProjectionMatrix();
                state.renderer.render(state.scene, camera);
              });
              await page.screenshot({ path: 'artifacts/coastal-relief-realism/01-uzak-dik-ustten.png' });

              await page.evaluate(() => {
                const { THREE, state, coastView, sampleHeight } = window.__coastalProof;
                const inlandX = coastView.x - coastView.waterDx * 500;
                const inlandZ = coastView.z - coastView.waterDz * 500;
                const lookY = sampleHeight(inlandX, inlandZ) + 35;
                state.water.scale.set(1, 1, 1);
                const cameraX = coastView.x + coastView.waterDx * 1150;
                const cameraZ = coastView.z + coastView.waterDz * 1150;
                state.water.position.set(cameraX, state.water.position.y, cameraZ);
                const camera = new THREE.PerspectiveCamera(48, 1536 / 1024, 1, 22000);
                camera.position.set(cameraX, Math.max(420, coastView.height + 430), cameraZ);
                camera.lookAt(inlandX, lookY, inlandZ);
                camera.updateProjectionMatrix();
                state.renderer.render(state.scene, camera);
              });
              await page.screenshot({ path: 'artifacts/coastal-relief-realism/02-yakin-egik-kiyi-ic-kesim.png' });

              fs.writeFileSync('artifacts/coastal-relief-realism/metrics.json', JSON.stringify({ ...metrics, browserErrors: errors }, null, 2));
              if (errors.length) throw new Error(`browser errors: ${JSON.stringify(errors.slice(0, 10))}`);
              console.log('COASTAL_RELIEF_RUNTIME_OK', JSON.stringify(metrics));
            } finally {
              await page.close();
              await browser.close();
              server.close();
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Full real game smoke regression
        run: node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check "$(git rev-parse origin/main)"...HEAD
      - name: Upload actual runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastal-relief-realism-runtime-proof
          path: artifacts/coastal-relief-realism/
          if-no-files-found: warn
          retention-days: 3
