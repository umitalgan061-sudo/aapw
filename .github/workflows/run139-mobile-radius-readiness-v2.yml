name: Run 139 Mobile Radius Readiness v2

on:
  push:
    branches:
      - agent/run139-mobile-radius-readiness-v2
    paths:
      - 'scripts/checkMobileRadiusReadiness.js'
      - 'scripts/applyRun139Records.py'
      - '.github/workflows/run139-mobile-radius-readiness-v2.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Snapshot and concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1855f2363e830e33c42004bf2b2e9ef1f14c873f"
          test -f GOVERNANCE.md && test -f 3D_GAME_PROGRESS.md && test -f DECISIONS.md && test -f QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
      - name: Integrity gates
        run: |
          set -euo pipefail
          node --check scripts/checkMobileRadiusReadiness.js
          python -m py_compile scripts/applyRun139Records.py
          node scripts/checkCheckpointConsistency.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
      - name: Radius readiness gate
        run: |
          set -euo pipefail
          node scripts/checkMobileRadiusReadiness.js | tee "$RUNNER_TEMP/radius-readiness.log"
          PROJECTION_LINE="$(grep '\[checkMobileRadiusReadiness\] projection ' "$RUNNER_TEMP/radius-readiness.log" | tail -n 1)"
          test -n "$PROJECTION_LINE"
          echo "RADIUS_PROJECTION=${PROJECTION_LINE#*projection }" >> "$GITHUB_ENV"
      - name: Full browser smoke
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")"
          test "$PASS_COUNT" -ge 34
          echo "SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"
      - name: Performance and self-review
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run139
          node scripts/analyzePerfTrend.js
          echo "PERF_ROW=$(tail -n 1 perf_log.csv)" >> "$GITHUB_ENV"
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
      - name: Record and publish
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1855f2363e830e33c42004bf2b2e9ef1f14c873f"
          export RUN139_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN139_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          python scripts/applyRun139Records.py
          node scripts/checkCheckpointConsistency.js
          git config user.name "Westeros Automation"
          git config user.email "actions@users.noreply.github.com"
          git add GOVERNANCE.md DECISIONS.md 3D_GAME_PROGRESS.md STABLE_TAGS.md perf_log.csv scripts/checkMobileRadiusReadiness.js scripts/applyRun139Records.py .github/workflows/run139-mobile-radius-readiness-v2.yml
          git commit -m "test(3d): record mobile radius readiness evidence (run 139)"
          git tag "$RUN139_TAG"
          git push origin HEAD:agent/run139-mobile-radius-readiness-v2
          git push origin "$RUN139_TAG"
