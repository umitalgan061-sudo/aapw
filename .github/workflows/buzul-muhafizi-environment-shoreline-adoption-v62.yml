name: Buzul Muhafızı — Environment Shoreline Adoption v62

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentShorelineAdoptionV62.js'
      - 'scripts/checkEnvironmentShorelineAdoptionV62.mjs'
      - '.github/workflows/buzul-muhafizi-environment-shoreline-adoption-v62.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-environment-shoreline-adoption-v62-20260911'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact-main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Syntax
        run: |
          node --check src/3d/world/environmentShorelineAdoptionV62.js
          node --check scripts/checkEnvironmentShorelineAdoptionV62.mjs
      - name: Executable regression
        run: node scripts/checkEnvironmentShorelineAdoptionV62.mjs
      - name: Diff budget and ownership boundary
        run: |
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          ! git diff origin/main...HEAD -- '*EditorMaterialStudio*'
          ! git diff origin/main...HEAD -- 'src/3d/materials/MaterialAssignmentCore.js'
          ! git diff origin/main...HEAD -- 'src/3d/world/WorldAssetPlacementPipeline.js'
          ! grep -R "Math.random\|from 'three'\|from \"three\"" -n src/3d/world/environmentShorelineAdoptionV62.js scripts/checkEnvironmentShorelineAdoptionV62.mjs
