name: typed-runtime-coverage-r2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/engine-ts/**'
      - 'src/3d/modern/**'
      - 'scripts/generateTypedRuntimeMatrixR1.mjs'
      - 'scripts/checkTypedRuntimeModernization.mjs'
      - 'scripts/checkTypedRuntimeBehavior.mjs'
      - 'package.json'
      - '.github/workflows/typed-runtime-coverage-r2.yml'
  push:
    branches: [agent/typed-runtime-coverage-r2-20260916]
    paths:
      - 'src/engine-ts/**'
      - 'src/3d/modern/**'
      - 'scripts/generateTypedRuntimeMatrixR1.mjs'
      - 'scripts/checkTypedRuntimeModernization.mjs'
      - 'scripts/checkTypedRuntimeBehavior.mjs'
      - 'package.json'
      - '.github/workflows/typed-runtime-coverage-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typed-runtime-coverage-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate exhaustive typed runtime matrix
        run: node scripts/generateTypedRuntimeMatrixR1.mjs
      - name: Typed runtime behavior gate
        run: node --experimental-strip-types scripts/checkTypedRuntimeBehavior.mjs
      - name: Modernization contract gate
        run: node scripts/checkTypedRuntimeModernization.mjs
      - name: Repeatability gate
        run: |
          cp artifacts/typed-runtime-r1/runtime-compatibility.matrix /tmp/aapw-runtime-matrix
          node scripts/generateTypedRuntimeMatrixR1.mjs
          diff -u /tmp/aapw-runtime-matrix artifacts/typed-runtime-r1/runtime-compatibility.matrix
      - name: Materialize deterministic matrix
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name 'aapw-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/typed-runtime-r1/runtime-compatibility.matrix
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci(typed-runtime): materialize exhaustive compatibility corpus [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
