name: Kızıl Ufuk Typed Creature Runtime Wave 13
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/dialogueChoices.ts'
      - 'src/3d/gameplay/dialogueChoices.js'
      - 'src/3d/gameplay/creatureBodyPlans.ts'
      - 'src/3d/gameplay/creatureBodyPlans.js'
      - 'src/3d/gameplay/creatureRig.ts'
      - 'src/3d/gameplay/creatureRig.js'
      - 'src/3d/gameplay/creatureGait.ts'
      - 'src/3d/gameplay/creatureGait.js'
      - 'src/3d/gameplay/dragonSpawns.ts'
      - 'src/3d/gameplay/dragonSpawns.js'
      - 'src/3d/gameplay/creatureBrain.ts'
      - 'src/3d/gameplay/creatureLocomotionStateSynthesis.ts'
      - 'src/3d/gameplay/dragons.js'
      - 'src/3d/gameplay/interactionConfig.ts'
      - 'tests/modern/typedCreatureRuntimeWave13.test.ts'
      - 'scripts/checkTypedCreatureRuntimeWave13.mjs'
      - 'src/3d/modern/creatureRuntimeContractsR13.ts'
      - 'package.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install
      - run: node scripts/checkTypedCreatureRuntimeWave13.mjs
      - run: npm run typecheck
      - run: npm test -- tests/modern/typedCreatureRuntimeWave13.test.ts
