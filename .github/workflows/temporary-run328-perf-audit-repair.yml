name: Temporary Run328 Perf Audit Repair

on:
  push:
    branches:
      - ci/run328-checkpoint-perf-audit-20260813

permissions:
  contents: write

concurrency:
  group: temporary-run328-perf-audit-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ci/run328-checkpoint-perf-audit-20260813

      - name: Append truthful Run328 audit record and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3196d61c1627af845131931c0a9145eae3d9bae9"
          if grep -Eq '(^|,)run328(?:[-_,]|$)' perf_log.csv; then
            echo 'Run328 record already exists; refusing duplicate.' >&2
            exit 1
          fi
          printf '%s\n' '2026-08-13,run328-concurrency-verification,,,,,,,"verification-only concurrency collision; runtime/product source delta 0; full baseline reverified; no new render sample; last measured runtime sample remains run327"' >> perf_log.csv
          tail -n 2 perf_log.csv
          node scripts/checkCheckpointConsistency.js
          git rm .github/workflows/temporary-run328-perf-audit-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perf_log.csv
          git diff --cached --check
          git commit -m 'ci: record run328 verification-only perf audit'
          git push origin HEAD:ci/run328-checkpoint-perf-audit-20260813
