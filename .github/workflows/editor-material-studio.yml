name: Editor Material Studio

on:
  pull_request:
    paths:
      - 'editor.html'
      - 'editor.css'
      - 'src/3d/editor/EditorMaterialStudio.js'
      - 'src/3d/editor/EditorAutoTexture.js'
      - 'src/3d/editor/EditorSceneSerializer.js'
      - 'src/3d/materials/layeredMaterial.js'
      - 'src/3d/materials/textureFactory.js'
      - 'scripts/checkEditorMaterialStudioBrowser.js'
      - '.github/workflows/editor-material-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and 1000-line scope gate
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$MAIN" = "$(git merge-base HEAD "$MAIN")"
          CHANGED="$(git diff --numstat "$MAIN" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          echo "changed_lines=$CHANGED"
          test "$CHANGED" -le 1000
          git diff --check "$MAIN" HEAD
      - name: Syntax
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorMaterialStudio.js
          node --check src/3d/editor/EditorAutoTexture.js
          node --check src/3d/editor/EditorSceneSerializer.js
          node --check src/3d/materials/layeredMaterial.js
          node --check src/3d/materials/textureFactory.js
          node --check scripts/checkEditorMaterialStudioBrowser.js
      - name: Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/checkEditorMaterialStudioBrowser.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$MAIN" = "$(git merge-base HEAD "$MAIN")"
