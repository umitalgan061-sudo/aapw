name: Player Touch Combat Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/input.js'
      - 'src/3d/ui/touchJoystick.js'
      - 'src/3d/gameplay/player.js'
      - 'src/3d/camera.js'
      - 'src/3d/gameLoopHelpers.js'
      - 'scripts/checkPlayerGeographicCameraOcclusion.mjs'
      - 'scripts/checkPlayerTouchCombatRuntime.mjs'
      - 'scripts/checkPlayerEquipmentAssetReadiness.mjs'
      - '.github/workflows/player-touch-combat-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-touch-combat-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shipped-mobile-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test "$((ADD + DEL))" -le 3000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Asset-first shipped-scene hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/animations/peasant_girl/**,assets/models/vegetation/pine_Zt62gceKXZ.glb,assets/models/vegetation/winter_tree.glb,assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb,assets/models/Ay/Moon 2K.fbx,assets/models/fbx/Viking Sword Blend_Viking Sword.fbx" --exclude=""
          test "$(wc -c < assets/models/characters/peasant_girl.fbx)" -gt 512
          test "$(wc -c < assets/animations/peasant_girl/idle.fbx)" -gt 512
          test "$(wc -c < 'assets/models/fbx/Viking Sword Blend_Viking Sword.fbx')" -eq 72380
          ! head -c 128 'assets/models/fbx/Viking Sword Blend_Viking Sword.fbx' | grep -q 'git-lfs.github.com/spec'
      - name: Touch input lifecycle contract
        run: |
          set -euo pipefail
          node --check src/3d/ui/touchJoystick.js
          node scripts/checkTouchJoystickInputContract.js
      - name: Player combat vertical-slice and geographic camera contracts
        run: |
          set -euo pipefail
          node --check src/3d/camera.js
          node --check src/3d/gameLoopHelpers.js
          node --check scripts/checkPlayerGeographicCameraOcclusion.mjs
          node --check scripts/checkPlayerTouchCombatRuntime.mjs
          node --check scripts/checkPlayerEquipmentAssetReadiness.mjs
          node scripts/checkPlayerGeographicCameraOcclusion.mjs
          node scripts/checkPlayerCombatVerticalSlice.mjs
      - name: Shared material placement contract
        run: |
          set -euo pipefail
          node scripts/checkSharedMaterialPlacementContract.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -q 'EditorMaterialStudio' src/3d/ui/touchJoystick.js src/3d/input.js src/3d/camera.js src/3d/gameLoopHelpers.js scripts/checkPlayerEquipmentAssetReadiness.mjs
      - name: Install Chromium
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Hydrated player equipment readiness proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-touch-combat/equipment
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerEquipmentAssetReadiness.mjs --out-dir=artifacts/player-touch-combat/equipment | tee artifacts/player-touch-combat/equipment.log
          grep -q 'PLAYER_EQUIPMENT_ASSET_READINESS_OK' artifacts/player-touch-combat/equipment.log
          test -s artifacts/player-touch-combat/equipment/equipment-asset-readiness.json
          grep -q '"missingAssetCount": 0' artifacts/player-touch-combat/equipment/equipment-asset-readiness.json
          grep -q '"recommendedPalette": "steel"' artifacts/player-touch-combat/equipment/equipment-asset-readiness.json
          grep -q '"productionAttached": false' artifacts/player-touch-combat/equipment/equipment-asset-readiness.json
          grep -q '"browserErrors": \[\]' artifacts/player-touch-combat/equipment/equipment-asset-readiness.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'artifacts/player-touch-combat/equipment/equipment-asset-readiness.json';
          const proof = JSON.parse(fs.readFileSync(path, 'utf8'));
          const equipment = proof.equipment;
          if (!equipment || equipment.placeholder !== false) throw new Error('hydrated equipment proof missing or placeholder');
          if (proof.attachment?.socketSemantic !== 'right-hand' || !proof.attachment?.resolvedBone) throw new Error(`right-hand equipment socket unresolved: ${JSON.stringify(proof.attachment)}`);
          if (proof.materialContract?.sharedMaterialCoreUsed !== true || proof.materialContract?.editorMaterialStudioImported !== false) throw new Error(`shared material contract drift: ${JSON.stringify(proof.materialContract)}`);
          if (equipment.manifest?.asset?.src !== proof.hydration?.equipment?.path) throw new Error(`equipment manifest source drift: ${JSON.stringify(equipment.manifest?.asset)}`);
          if (equipment.manifest?.validation?.ok !== true || equipment.manifest?.validation?.errors?.length) throw new Error(`equipment manifest validation failed: ${JSON.stringify(equipment.manifest?.validation)}`);
          if (!(equipment.meshCount > 0) || !(equipment.materialSlotCount > 0) || !(equipment.namedMaterialCount > 0)) throw new Error('equipment lacks named render/material surfaces');
          const importedSlots = Array.isArray(equipment.textureSlots) ? equipment.textureSlots.filter((slot) => !slot.generated) : [];
          const importedSlotKinds = new Set(importedSlots.map((slot) => slot.slot));
          const hasImportedPbrResponse = importedSlotKinds.has('map') && importedSlotKinds.has('normalMap');
          const hasGeneratedPbrResponse = (equipment.generatedMaterialCount ?? 0) > 0 || (equipment.layeredMaterialCount ?? 0) > 0;
          if (!hasImportedPbrResponse && !hasGeneratedPbrResponse) throw new Error(`visual failure: weapon has no imported or generated PBR response: ${JSON.stringify(importedSlots)}`);
          if (proof.materialContract?.recommendedPalette !== 'steel' || proof.materialContract?.recommendedTextureSize !== 256) throw new Error(`weapon recipe drift: ${JSON.stringify(proof.materialContract)}`);
          if (proof.materialContract?.importedMaterialPreserved !== true) throw new Error('equipment readiness proof unexpectedly rewrote imported material');
          if (proof.browserErrors?.length) throw new Error(`equipment parser browser errors: ${JSON.stringify(proof.browserErrors)}`);
          console.log('PLAYER_EQUIPMENT_MATERIAL_SOCKET_ACCEPTANCE_OK', JSON.stringify({
            source: equipment.source,
            resolvedBone: proof.attachment.resolvedBone,
            meshCount: equipment.meshCount,
            materialSlotCount: equipment.materialSlotCount,
            importedTextureSlots: [...importedSlotKinds].sort(),
            sharedMaterialCoreUsed: proof.materialContract.sharedMaterialCoreUsed,
            recommendedPalette: proof.materialContract.recommendedPalette,
            recommendedTextureSize: proof.materialContract.recommendedTextureSize,
            browserErrors: proof.browserErrors.length,
          }));
          NODE
      - name: Shipped mobile touch combat proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-touch-combat
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerTouchCombatRuntime.mjs --out-dir=artifacts/player-touch-combat | tee artifacts/player-touch-combat.log
          grep -q 'PLAYER_TOUCH_COMBAT_RUNTIME_OK' artifacts/player-touch-combat.log
          test -s artifacts/player-touch-combat/touch-combat-runtime.png
          test -s artifacts/player-touch-combat/touch-combat-runtime.json
          grep -q '"browserErrors": \[\]' artifacts/player-touch-combat/touch-combat-runtime.json
      - name: Shipped character material and grounding acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'artifacts/player-touch-combat/touch-combat-runtime.json';
          if (!fs.existsSync(path)) throw new Error('touch runtime metrics missing; cannot qualify hydrated player material');
          const metrics = JSON.parse(fs.readFileSync(path, 'utf8'));
          const player = metrics.playerAsset;
          if (!player) throw new Error('live player asset proof missing');
          if (player.source !== 'assets/models/characters/peasant_girl.fbx') throw new Error(`unexpected player asset: ${player.source}`);
          if (player.object?.placeholder !== false) throw new Error('hydrated player resolved to placeholder');
          if (!player.materialValidation?.ok || player.materialValidation.errors?.length) throw new Error(`shared material validation failed: ${JSON.stringify(player.materialValidation)}`);
          if (!(player.object?.meshCount > 0) || !(player.object?.materialSlotCount > 0)) throw new Error('player has no renderable mesh/material slots');
          const textureSlots = Array.isArray(player.textureSlots) ? player.textureSlots : [];
          const textured = textureSlots.length > 0;
          const generated = (player.object.generatedMaterialCount ?? 0) > 0;
          const separated = (player.object.materialSlotCount ?? 0) > 1 || (player.object.namedSurfaceCount ?? 0) > 1 || (player.object.namedMaterialCount ?? 0) > 1;
          const flatSingleSurface = player.object.meshCount === 1 && player.object.materialSlotCount === 1 && !textured && !generated;
          if (flatSingleSurface) {
            throw new Error(`visual failure: human is one untextured flat surface; layered fallback=${JSON.stringify(player.recommendedOnly?.layeredFallback ?? null)}`);
          }
          if (!textured && !generated && !separated) throw new Error('visual failure: player lacks texture response and distinct material surfaces');
          if (Math.abs(player.geography?.rootGroundDeltaMeters ?? Infinity) > 0.08) throw new Error(`player root/collider split: ${player.geography?.rootGroundDeltaMeters}`);
          if (Math.abs(player.geography?.visualBottomGroundDeltaMeters ?? Infinity) > 0.35) throw new Error(`player visual feet/ground split: ${player.geography?.visualBottomGroundDeltaMeters}`);
          const summary = {
            source: player.source,
            missingAssetCount: 0,
            meshCount: player.object.meshCount,
            surfaceCount: player.object.surfaceCount,
            materialSlotCount: player.object.materialSlotCount,
            namedSurfaceCount: player.object.namedSurfaceCount,
            namedMaterialCount: player.object.namedMaterialCount,
            generatedMaterialCount: player.object.generatedMaterialCount,
            layeredMaterialCount: player.object.layeredMaterialCount,
            importedTextureSlots: textureSlots.map(({ mesh, material, slot, width, height, paletteId, generated: isGenerated }) => ({ mesh, material, slot, width, height, paletteId, generated: isGenerated })),
            recommendedPalette: player.recommendedOnly?.autoRecipe?.basePaletteId ?? null,
            recommendedTextureSize: player.recommendedOnly?.autoRecipe?.textureSize ?? null,
            layeredFallbackAvailable: Boolean(player.recommendedOnly?.layeredFallback),
            importedMaterialPreserved: player.recommendedOnly?.appliedInProof === false,
            rootGroundDeltaMeters: player.geography.rootGroundDeltaMeters,
            visualBottomGroundDeltaMeters: player.geography.visualBottomGroundDeltaMeters,
            browserErrors: metrics.browserErrors ?? [],
          };
          fs.writeFileSync('artifacts/player-touch-combat/player-material-acceptance.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log('PLAYER_MATERIAL_GROUNDING_GEOMETRY_OK', JSON.stringify({
            source: summary.source,
            meshCount: summary.meshCount,
            materialSlotCount: summary.materialSlotCount,
            rootGroundDeltaMeters: summary.rootGroundDeltaMeters,
            visualBottomGroundDeltaMeters: summary.visualBottomGroundDeltaMeters,
          }));
          if (summary.browserErrors.length) throw new Error(`browser errors: ${JSON.stringify(summary.browserErrors)}`);
          console.log('PLAYER_MATERIAL_GROUNDING_ACCEPTANCE_OK', JSON.stringify(summary));
          NODE
      - name: Final main freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-touch-combat-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/player-touch-combat/
            artifacts/player-touch-combat.log
