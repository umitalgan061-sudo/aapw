name: Player Touch Combat Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/input.js'
      - 'src/3d/ui/touchJoystick.js'
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerTouchCombatRuntime.mjs'
      - '.github/workflows/player-touch-combat-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-touch-combat-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shipped-mobile-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test "$((ADD + DEL))" -le 1000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Asset-first shipped-scene hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/animations/peasant_girl/**,assets/models/vegetation/pine_Zt62gceKXZ.glb,assets/models/vegetation/winter_tree.glb,assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb,assets/models/Ay/Moon 2K.fbx" --exclude=""
          test "$(wc -c < assets/models/characters/peasant_girl.fbx)" -gt 512
          test "$(wc -c < assets/animations/peasant_girl/idle.fbx)" -gt 512
      - name: Static input and shared material contracts
        run: |
          set -euo pipefail
          node --check scripts/checkPlayerTouchCombatRuntime.mjs
          node --check src/3d/ui/touchJoystick.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkPlayerCombatVerticalSlice.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -q 'EditorMaterialStudio' src/3d/ui/touchJoystick.js src/3d/input.js
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped mobile touch combat proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-touch-combat
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerTouchCombatRuntime.mjs --out-dir=artifacts/player-touch-combat | tee artifacts/player-touch-combat.log
          grep -q 'PLAYER_TOUCH_COMBAT_RUNTIME_OK' artifacts/player-touch-combat.log
          test -s artifacts/player-touch-combat/touch-combat-runtime.png
          test -s artifacts/player-touch-combat/touch-combat-runtime.json
          grep -q '"browserErrors": \[\]' artifacts/player-touch-combat/touch-combat-runtime.json
      - name: Final main freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-touch-combat-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/player-touch-combat/
            artifacts/player-touch-combat.log
