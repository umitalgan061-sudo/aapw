name: Kızıl Ufuk - Player Equipment Socket Resolver

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentSocketResolver.js'
      - 'scripts/checkPlayerEquipmentSocketResolver.mjs'
      - '.github/workflows/player-equipment-socket-resolver.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact-main ancestry
        run: git merge-base --is-ancestor origin/main HEAD
      - name: Diff cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Runtime boundary
        run: '! grep -R "EditorMaterialStudio" src/3d/gameplay/playerEquipmentSocketResolver.js scripts/checkPlayerEquipmentSocketResolver.mjs'
      - name: Syntax
        run: node --check scripts/checkPlayerEquipmentSocketResolver.mjs && node --check src/3d/gameplay/playerEquipmentSocketResolver.js
      - name: Focused contract
        run: node scripts/checkPlayerEquipmentSocketResolver.mjs
