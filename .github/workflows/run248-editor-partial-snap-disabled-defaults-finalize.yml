name: Run 248 Editor Partial Snap Disabled Defaults Finalize

on:
  push:
    branches:
      - agent/run248-editor-partial-snap-disabled-defaults
    paths:
      - '.github/workflows/run248-editor-partial-snap-disabled-defaults-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run248-editor-partial-snap-disabled-defaults-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main, syntax and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun248EditorPartialSnapDisabledDefaults.js
          node --check src/3d/editor/EditorLocalSession.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run248 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 248 — World Editor scene-load snap isolation'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Fixed an additive World Editor import regression where a valid scene could have serialized object coordinates quantized by the live pre-load snap setting before the scene editor metadata was applied.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Added a capture-phase validated scene-load guard in `EditorLocalSession.js`: valid imports bypass live snap only during object rehydration, while the canonical loader still restores the serialized/default editor metadata and invalid-scene atomic failure behavior remains unchanged.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent Chromium regression verifies partial `editor: { snapEnabled: false }` metadata preserves exact object identity/name/asset/position/rotation/scale, defaults missing snapSize to 1, keeps owner live-grid policy, clears selection, preserves history stability, and reports zero browser errors.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, seeded determinism, world-reference/hydrology, terrain/road safety, performance trend, technical-debt audit, full browser smoke, final remote-main concurrency/additive gates, visual artifact upload and World Event Determinism Guard PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Source delta is additive-only: `EditorLocalSession.js` +25/-0; regression/workflow files are new. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: Run248 workflow `31460680447` PASS and World Event Determinism Guard `31460680409` PASS. Next safe step: re-read current main and active branches; continue only a distinct, unclaimed World Editor compatibility edge case.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run248,' perf_log.csv; then
            printf 'run248,%s,editor-scene-load-snap-isolation,,,,,,,"additive scene import snap isolation; exact transforms preserved; mobile perf budget, deterministic safety and full browser smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run248 editor scene-load snap isolation' STABLE_TAGS.md; then
            printf '%s — Run248 editor scene-load snap isolation; serialized transforms bypass pre-load live snap while canonical metadata/defaults and invalid-load atomicity remain intact; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run248 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run248): record scene-load snap-isolation checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run248-editor-partial-snap-disabled-defaults
          git push origin "$STABLE_TAG" || true

# Run248 exact-head verification trigger: checkpoint records above are intentionally idempotent.
