name: SE G65 Terrain3D Relief

on:
  push:
    branches: [agent/kizil-ufuk-g65-relief-20260813]
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/se/g65_relief.mjs'
      - 'scripts/checkSEG65Relief.mjs'
      - 'godot/terrain-authoring/scripts/validate_g65_terrain3d_relief.gd'
      - '.github/workflows/se-g65-terrain3d-relief.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g65-terrain3d-relief-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 0fa4fbdf6592add8a483dfdef7404b0a8cd17b4c

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact main and four-file scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --name-only "$BASE_SHA"...HEAD | sort | tr '\n' ' ')" = ".github/workflows/se-g65-terrain3d-relief.yml godot/terrain-authoring/geocells/se/g65_relief.mjs godot/terrain-authoring/scripts/validate_g65_terrain3d_relief.gd scripts/checkSEG65Relief.mjs "
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py

      - name: Merged G65 Hydrology and Biome regressions
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g65_hydrology.mjs
          node --check scripts/checkSEG65Hydrology.mjs
          node scripts/checkSEG65Hydrology.mjs | tee "$RUNNER_TEMP/g65-hydrology.log"
          grep -F 'SE_G65_HYDROLOGY_SOURCE_OK' "$RUNNER_TEMP/g65-hydrology.log"
          node --check godot/terrain-authoring/geocells/se/g65_biome.mjs
          node --check scripts/checkSEG65Biome.mjs
          node scripts/checkSEG65Biome.mjs | tee "$RUNNER_TEMP/g65-biome.log"
          grep -F 'SE_G65_BIOME_OK' "$RUNNER_TEMP/g65-biome.log"

      - name: G65 relief determinism map fidelity and seam metrics
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g65_relief.mjs
          node --check scripts/checkSEG65Relief.mjs
          node scripts/checkSEG65Relief.mjs | tee "$RUNNER_TEMP/g65-relief-a.log"
          node scripts/checkSEG65Relief.mjs | tee "$RUNNER_TEMP/g65-relief-b.log"
          cmp "$RUNNER_TEMP/g65-relief-a.log" "$RUNNER_TEMP/g65-relief-b.log"
          grep -F 'SE_G65_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g65-relief-a.log"
          node scripts/checkSEG65Relief.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g65-relief-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g65-relief-probe.json

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real 257x257 Terrain3D height import region seam save and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G65_RELIEF_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_relief.gd | tee "$RUNNER_TEMP/g65-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-relief-imported-topdown.png "$RUNNER_TEMP/g65-relief-a.png"
          G65_RELIEF_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_relief.gd | tee "$RUNNER_TEMP/g65-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-relief-imported-topdown.png "$RUNNER_TEMP/g65-relief-b.png"
          grep -F 'SE_G65_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g65-t3d-a.log"
          grep -F 'SE_G65_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g65-t3d-b.log"
          cmp "$RUNNER_TEMP/g65-relief-a.png" "$RUNNER_TEMP/g65-relief-b.png"
          python3 - "$RUNNER_TEMP/g65-t3d-a.log" "$RUNNER_TEMP/g65-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G65_TERRAIN3D_RELIEF_METRICS='):
                      return json.loads(line.split('=', 1)[1])
              raise SystemExit('G65 relief metrics missing')
          a, b = metrics(sys.argv[1]), metrics(sys.argv[2])
          stable = ('terrain3dVersion','regionSize','regionCount','alignedSamples','seamSamples','maxAlignedHeightError','maxSeamHeightError','minImportedHeight','maxImportedHeight','outputChecksum','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert a['regionCount'] >= 4 and a['savedRegionFiles'] >= 4
          assert a['bakedSurfaces'] >= 1 and a['bakedVertices'] > 0
          assert a['maxAlignedHeightError'] <= 0.012 and a['maxSeamHeightError'] <= 0.02
          print('SE_G65_TERRAIN3D_RELIEF_STABLE_OK')
          PY

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: HTerrain world road PWA and browser regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g65-terrain3d-relief-proof
          path: |
            godot/terrain-authoring/.terrain3d-proof/g65-relief-probe.json
            godot/terrain-authoring/.terrain3d-proof/g65-relief-imported-topdown.png
          if-no-files-found: warn
