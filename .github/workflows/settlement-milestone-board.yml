name: settlement-milestone-board
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementMilestoneBoard.js'
      - 'scripts/checkSettlementMilestoneBoard.mjs'
      - '.github/workflows/settlement-milestone-board.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/checkSettlementMilestoneBoard.mjs
      - run: node --check src/3d/gameplay/settlementMilestoneBoard.js
      - name: focused diff budget
        shell: bash
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          test "$(printf '%s\n' "$files" | grep -Ec '^(src/3d/gameplay/settlementMilestoneBoard.js|scripts/checkSettlementMilestoneBoard.mjs|.github/workflows/settlement-milestone-board.yml)$')" -eq 3
          lines=$(git diff --numstat "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$lines" -le 3000
          ! git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.js' | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline'