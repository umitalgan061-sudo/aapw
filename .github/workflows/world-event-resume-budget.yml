name: World Event Resume Budget

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/worldEvents.js'
      - 'scripts/checkWorldEventDeterminism.js'
      - 'scripts/checkWorldEventResumeBudget.mjs'
      - 'scripts/game3dSmokeChecksDebugTools.js'
      - 'scripts/game3dSmokeChecksWorldEvents.js'
      - 'scripts/smokeTestGame3D.js'
      - '.github/workflows/world-event-resume-budget.yml'
  workflow_dispatch:

jobs:
  world-event-resume-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and quota
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD)
          printf '%s\n' "${files[@]}"
          allowed='^(src/3d/gameplay/worldEvents\.js|scripts/checkWorldEventDeterminism\.js|scripts/checkWorldEventResumeBudget\.mjs|scripts/game3dSmokeChecksDebugTools\.js|scripts/game3dSmokeChecksWorldEvents\.js|scripts/smokeTestGame3D\.js|\.github/workflows/world-event-resume-budget\.yml)$'
          for file in "${files[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "unexpected scope: $file"; exit 1; }
          done
          changed=$(git diff --numstat "$BASE_SHA"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 1000 || { echo "scope exceeds 1000 changed lines: $changed"; exit 1; }

      - name: Syntax
        run: |
          node --check src/3d/gameplay/worldEvents.js
          node --check scripts/checkWorldEventDeterminism.js
          node --check scripts/checkWorldEventResumeBudget.mjs
          node --check scripts/game3dSmokeChecksDebugTools.js
          node --check scripts/game3dSmokeChecksWorldEvents.js
          node --check scripts/smokeTestGame3D.js

      - name: Deterministic resume budget
        run: node scripts/checkWorldEventResumeBudget.mjs

      - name: Canonical world-event determinism
        run: node scripts/checkWorldEventDeterminism.js

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js
