name: Run 224 Editor Scale History Exact Head

on:
  push:
    branches:
      - agent/run224-editor-scale-history
    paths:
      - '.github/workflows/run224-editor-scale-history-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run224-editor-scale-history-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun224EditorScaleHistory.js
          git diff --check
      - name: Verify Run224 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 224 — World Editor precise scale/history regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run224,2026-08-10,editor-scale-history' perf_log.csv
          grep -Fq 'Run224 editor precise scale/history regression' STABLE_TAGS.md
          grep -Fq '31422841705' 3D_GAME_PROGRESS.md
