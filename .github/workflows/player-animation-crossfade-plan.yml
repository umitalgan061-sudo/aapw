name: Player Animation Crossfade Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAnimationCrossfadePlan.js'
      - 'scripts/checkPlayerAnimationCrossfadePlan.mjs'
      - '.github/workflows/player-animation-crossfade-plan.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerAnimationCrossfadePlan.js && node --check scripts/checkPlayerAnimationCrossfadePlan.mjs
      - name: Regression
        run: node scripts/checkPlayerAnimationCrossfadePlan.mjs
      - name: Determinism
        run: |
          node scripts/checkPlayerAnimationCrossfadePlan.mjs > /tmp/crossfade-a.txt
          node scripts/checkPlayerAnimationCrossfadePlan.mjs > /tmp/crossfade-b.txt
          cmp /tmp/crossfade-a.txt /tmp/crossfade-b.txt
      - name: Runtime/editor boundary
        run: |
          ! grep -R "EditorMaterialStudio\|from 'three'\|from \"three\"" src/3d/gameplay/playerAnimationCrossfadePlan.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
