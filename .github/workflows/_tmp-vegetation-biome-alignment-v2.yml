name: Temporary biome-aligned vegetation realism patch

on:
  push:
    branches:
      - codex/aapw-realism-20260831-ocean

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align live vegetation with terrain forest geography and break primitive silhouette repetition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          terrain = 'src/3d/world/terrainBiomeShading.js'
          replace_once(
              terrain,
              "const scratchRock = new THREE.Color();",
              """/**\n * Shared forest-coverage authority for terrain tint and live vegetation placement. Keeping the\n * same world-space FBM, slope, treeline and map-aligned climate response in one function prevents\n * dark forest ground from drifting away from the stands that visually explain it. Render-only: no\n * terrain height, hydrology, collider or canonical biome membership changes.\n */\nexport function resolveTerrainForestAmount({\n\theightAboveSeaMeters,\n\tslopeDegrees,\n\tworldX = 0,\n\tworldZ = 0,\n\tclimate = null,\n}) {\n\tconst P = TERRAIN_BIOME_SHADING_POLICY;\n\tconst northClimate = climate || northReferenceCryosphereAtWorldXZ(worldX, worldZ);\n\tconst forestNoise01 = signedFbmNoise(\n\t\tworldX * P.forestPatchFrequency - 13.1,\n\t\tworldZ * P.forestPatchFrequency + 7.4,\n\t\tP.forestPatchOctaves,\n\t) * 0.5 + 0.5;\n\tconst forestPatch = smoothstep(P.forestPatchStart, P.forestPatchFull, forestNoise01);\n\tconst notCliff = 1 - smoothstep(P.forestSlopeFalloffStartDegrees, P.forestSlopeFalloffFullDegrees, slopeDegrees);\n\tconst belowTreeLine = 1 - smoothstep(P.forestTreeLineStartMeters, P.forestTreeLineFullMeters, heightAboveSeaMeters);\n\treturn clamp01(\n\t\tforestPatch * notCliff * belowTreeLine * P.forestMaxStrength\n\t\t* (1 - northClimate.permanentIce) * (1 - northClimate.tundra * 0.62),\n\t);\n}\n\nconst scratchRock = new THREE.Color();""",
          )
          replace_once(
              terrain,
              """\tconst forestNoise01 = signedFbmNoise(worldX * P.forestPatchFrequency - 13.1, worldZ * P.forestPatchFrequency + 7.4, P.forestPatchOctaves) * 0.5 + 0.5;\n\tconst forestPatch = smoothstep(P.forestPatchStart, P.forestPatchFull, forestNoise01);\n\tconst notCliff = 1 - smoothstep(P.forestSlopeFalloffStartDegrees, P.forestSlopeFalloffFullDegrees, slope);\n\tconst belowTreeLine = 1 - smoothstep(P.forestTreeLineStartMeters, P.forestTreeLineFullMeters, height);\n\tconst forestAmount = forestPatch * notCliff * belowTreeLine * P.forestMaxStrength * (1 - permanentNorth) * (1 - tundraNorth * 0.62);\n\tif (forestAmount > 0) target.lerp(TERRAIN_BIOME_PALETTE.FOREST, forestAmount);""",
              """\tconst forestAmount = resolveTerrainForestAmount({\n\t\theightAboveSeaMeters: height,\n\t\tslopeDegrees: slope,\n\t\tworldX,\n\t\tworldZ,\n\t\tclimate: northClimate,\n\t});\n\tif (forestAmount > 0) target.lerp(TERRAIN_BIOME_PALETTE.FOREST, forestAmount);""",
          )

          vegetation = 'src/3d/world/vegetation.js'
          replace_once(
              vegetation,
              "import { northClimateWeightsAtWorldZ } from './terrainBiomeShading.js';",
              """import {\n\tTERRAIN_BIOME_SHADING_POLICY,\n\tnorthClimateWeightsAtWorldZ,\n\tresolveTerrainForestAmount,\n} from './terrainBiomeShading.js';""",
          )
          replace_once(
              vegetation,
              """export const VEGETATION_SPATIAL_PATTERN_POLICY = Object.freeze({\n\tid: 'vegetation-ecological-grove-scatter-2026-08-26-v1',\n\tclimateAuthority: VEGETATION_NORTH_CLIMATE_POLICY.climateAuthority,\n\tgroveTreeCountMin: 9,\n\tgroveTreeCountMax: 17,\n\ttemperateGroveRadiusMeters: 170,\n\tcoldGroveRadiusMeters: 125,\n\ttemperateBackgroundChance: 0.26,\n\tcoldBackgroundChance: 0.18,\n});""",
              """export const VEGETATION_SPATIAL_PATTERN_POLICY = Object.freeze({\n\tid: 'vegetation-terrain-biome-aligned-grove-scatter-2026-09-02-v2',\n\tclimateAuthority: VEGETATION_NORTH_CLIMATE_POLICY.climateAuthority,\n\tterrainForestMaskAuthority: TERRAIN_BIOME_SHADING_POLICY.id,\n\tterrainForestMaskAligned: true,\n\tgroveTreeCountMin: 9,\n\tgroveTreeCountMax: 17,\n\ttemperateGroveRadiusMeters: 170,\n\tcoldGroveRadiusMeters: 125,\n\ttemperateBackgroundChance: 0.26,\n\tcoldBackgroundChance: 0.18,\n\tgroveAnchorForestAcceptanceFloor: 0.22,\n\tbackgroundForestAcceptanceFloor: 0.52,\n\tsilhouetteHeightJitter: 0.10,\n\ttrunkWidthJitter: 0.09,\n\tcrownWidthJitter: 0.16,\n\tcrownAspectJitter: 0.08,\n\tmaxLeanDegrees: 2.4,\n});""",
          )
          replace_once(vegetation, 'const MAX_ATTEMPTS_PER_TREE = 8;', 'const MAX_ATTEMPTS_PER_TREE = 12;')
          replace_once(
              vegetation,
              """export function isPlaceablePosition(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges }) {\n\tfor (const seat of seats) {\n\t\tif (Math.hypot(x - seat.x, z - seat.z) < SEAT_EXCLUSION_RADIUS_METERS) return false;\n\t}\n\tfor (const edge of roadEdges) {\n\t\tconst points = edge.points;\n\t\tfor (let i = 1; i < points.length; i++) {\n\t\t\tconst distance = distancePointToSegment2D(x, z, points[i - 1].x, points[i - 1].z, points[i].x, points[i].z);\n\t\t\tif (distance < ROAD_EXCLUSION_RADIUS_METERS) return false;\n\t\t}\n\t}\n\tconst groundY = sampleHeightMeters(x, z);\n\tif (groundY <= seaLevelMeters + SHORE_MARGIN_METERS) return false;\n\n\tconst dxHeight = sampleHeightMeters(x + SLOPE_SAMPLE_OFFSET_METERS, z) - groundY;\n\tconst dzHeight = sampleHeightMeters(x, z + SLOPE_SAMPLE_OFFSET_METERS) - groundY;\n\tconst gradeXDegrees = (Math.atan2(Math.abs(dxHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\tconst gradeZDegrees = (Math.atan2(Math.abs(dzHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\treturn Math.max(gradeXDegrees, gradeZDegrees) <= MAX_GROUND_SLOPE_DEGREES;\n}""",
              """function vegetationSurfaceProfile(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges }) {\n\tfor (const seat of seats) {\n\t\tif (Math.hypot(x - seat.x, z - seat.z) < SEAT_EXCLUSION_RADIUS_METERS) return { placeable: false };\n\t}\n\tfor (const edge of roadEdges) {\n\t\tconst points = edge.points;\n\t\tfor (let i = 1; i < points.length; i++) {\n\t\t\tconst distance = distancePointToSegment2D(x, z, points[i - 1].x, points[i - 1].z, points[i].x, points[i].z);\n\t\t\tif (distance < ROAD_EXCLUSION_RADIUS_METERS) return { placeable: false };\n\t\t}\n\t}\n\tconst groundY = sampleHeightMeters(x, z);\n\tif (groundY <= seaLevelMeters + SHORE_MARGIN_METERS) return { placeable: false, groundY };\n\n\tconst dxHeight = sampleHeightMeters(x + SLOPE_SAMPLE_OFFSET_METERS, z) - groundY;\n\tconst dzHeight = sampleHeightMeters(x, z + SLOPE_SAMPLE_OFFSET_METERS) - groundY;\n\tconst gradeXDegrees = (Math.atan2(Math.abs(dxHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\tconst gradeZDegrees = (Math.atan2(Math.abs(dzHeight), SLOPE_SAMPLE_OFFSET_METERS) * 180) / Math.PI;\n\tconst slopeDegrees = Math.max(gradeXDegrees, gradeZDegrees);\n\tif (slopeDegrees > MAX_GROUND_SLOPE_DEGREES) return { placeable: false, groundY, slopeDegrees };\n\n\tconst climate = northReferenceCryosphereAtWorldXZ(x, z);\n\tconst forestAmount = resolveTerrainForestAmount({\n\t\theightAboveSeaMeters: groundY - seaLevelMeters,\n\t\tslopeDegrees,\n\t\tworldX: x,\n\t\tworldZ: z,\n\t\tclimate,\n\t});\n\t// Green temperate stands follow the exact terrain forest tint. Snow-pine/tundra stands keep\n\t// their established cryosphere ownership instead of being suppressed by the green-forest mask.\n\tconst coldShelter = Math.max(climate.permanentIce, climate.tundra);\n\tconst groveSuitability = Math.max(forestAmount, coldShelter * 0.92);\n\treturn { placeable: true, groundY, slopeDegrees, climate, forestAmount, groveSuitability };\n}\n\nexport function isPlaceablePosition(x, z, context) {\n\treturn vegetationSurfaceProfile(x, z, context).placeable;\n}""",
          )
          replace_once(
              vegetation,
              """function placeTreeInstance(entry, x, z, sampleHeightMeters, rng, up, matrix, position, quaternion, scaleVector) {\n\tconst groundY = sampleHeightMeters(x, z);\n\tconst scale = SCALE_MIN + rng() * (SCALE_MAX - SCALE_MIN);\n\tconst yaw = rng() * Math.PI * 2;\n\tposition.set(x, groundY, z);\n\tquaternion.setFromAxisAngle(up, yaw);\n\tscaleVector.set(scale, scale, scale);\n\tmatrix.compose(position, quaternion, scaleVector);\n\tentry.trunkMesh.setMatrixAt(entry.placedCount, matrix);\n\tentry.foliageMesh.setMatrixAt(entry.placedCount, matrix);\n\tentry.placedCount++;\n}""",
              """function placeTreeInstance(entry, x, z, groundY, rng, up, leanAxis, leanQuaternion, matrix, position, quaternion, scaleVector) {\n\tconst P = VEGETATION_SPATIAL_PATTERN_POLICY;\n\tconst baseScale = SCALE_MIN + rng() * (SCALE_MAX - SCALE_MIN);\n\tconst heightScale = baseScale * (1 + (rng() * 2 - 1) * P.silhouetteHeightJitter);\n\tconst trunkWidthScale = baseScale * (1 + (rng() * 2 - 1) * P.trunkWidthJitter);\n\tconst crownWidthScale = baseScale * (1 + (rng() * 2 - 1) * P.crownWidthJitter);\n\tconst crownAspect = 1 + (rng() * 2 - 1) * P.crownAspectJitter;\n\tconst yaw = rng() * Math.PI * 2;\n\tconst leanAzimuth = yaw + rng() * Math.PI * 2;\n\tconst leanRadians = (rng() * 2 - 1) * P.maxLeanDegrees * Math.PI / 180;\n\n\tposition.set(x, groundY, z);\n\tquaternion.setFromAxisAngle(up, yaw);\n\tleanAxis.set(Math.cos(leanAzimuth), 0, Math.sin(leanAzimuth));\n\tleanQuaternion.setFromAxisAngle(leanAxis, leanRadians);\n\tquaternion.multiply(leanQuaternion);\n\n\tscaleVector.set(trunkWidthScale, heightScale, trunkWidthScale);\n\tmatrix.compose(position, quaternion, scaleVector);\n\tentry.trunkMesh.setMatrixAt(entry.placedCount, matrix);\n\n\tscaleVector.set(crownWidthScale * crownAspect, heightScale, crownWidthScale / crownAspect);\n\tmatrix.compose(position, quaternion, scaleVector);\n\tentry.foliageMesh.setMatrixAt(entry.placedCount, matrix);\n\tentry.placedCount++;\n}""",
          )
          replace_once(
              vegetation,
              """\tconst quaternion = new THREE.Quaternion();\n\tconst scaleVector = new THREE.Vector3();\n\tconst spatialPolicy = VEGETATION_SPATIAL_PATTERN_POLICY;\n\tlet placedCount = 0;""",
              """\tconst quaternion = new THREE.Quaternion();\n\tconst leanAxis = new THREE.Vector3(1, 0, 0);\n\tconst leanQuaternion = new THREE.Quaternion();\n\tconst scaleVector = new THREE.Vector3();\n\tconst spatialPolicy = VEGETATION_SPATIAL_PATTERN_POLICY;\n\tlet placedCount = 0;\n\tlet placedForestAmountSum = 0;\n\tlet placedGroveSuitabilitySum = 0;""",
          )
          replace_once(
              vegetation,
              """\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\tconst candidate = !groveHasCenter || rng() < groveBackgroundChance\n\t\t\t\t? sampleAnnulusPoint(rng, 0, 0, 0, radiusMeters)\n\t\t\t\t: sampleAnnulusPoint(rng, groveCenterX, groveCenterZ, 0, groveRadiusMeters);\n\t\t\tconst { x, z } = candidate;\n\t\t\tif (Math.hypot(x, z) > radiusMeters) continue;\n\t\t\tif (!isPlaceablePosition(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges })) continue;\n\t\t\tif (!groveHasCenter) {\n\t\t\t\tgroveHasCenter = true;\n\t\t\t\tgroveCenterX = x;\n\t\t\t\tgroveCenterZ = z;\n\t\t\t\tconst pattern = vegetationGrovePatternForClimate(northReferenceCryosphereAtWorldXZ(x, z));\n\t\t\t\tgroveRadiusMeters = pattern.groveRadiusMeters;\n\t\t\t\tgroveBackgroundChance = pattern.backgroundChance;\n\t\t\t}\n\t\t\tconst entry = perSpecies[pickSpeciesIndexForWorldXZ(rng(), x, z)];\n\t\t\tplaceTreeInstance(entry, x, z, sampleHeightMeters, rng, up, matrix, position, quaternion, scaleVector);\n\t\t\tplacedCount++;\n\t\t\tbreak;\n\t\t}""",
              """\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\tconst useBackground = groveHasCenter && rng() < groveBackgroundChance;\n\t\t\tconst candidateKind = !groveHasCenter ? 'anchor' : useBackground ? 'background' : 'grove';\n\t\t\tconst candidate = candidateKind === 'grove'\n\t\t\t\t? sampleAnnulusPoint(rng, groveCenterX, groveCenterZ, 0, groveRadiusMeters)\n\t\t\t\t: sampleAnnulusPoint(rng, 0, 0, 0, radiusMeters);\n\t\t\tconst { x, z } = candidate;\n\t\t\tif (Math.hypot(x, z) > radiusMeters) continue;\n\t\t\tconst profile = vegetationSurfaceProfile(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges });\n\t\t\tif (!profile.placeable) continue;\n\n\t\t\tif (candidateKind !== 'grove' && attempt < MAX_ATTEMPTS_PER_TREE - 1) {\n\t\t\t\tconst floor = candidateKind === 'anchor'\n\t\t\t\t\t? spatialPolicy.groveAnchorForestAcceptanceFloor\n\t\t\t\t\t: spatialPolicy.backgroundForestAcceptanceFloor;\n\t\t\t\tconst acceptance = floor + (1 - floor) * profile.groveSuitability;\n\t\t\t\tif (rng() > acceptance) continue;\n\t\t\t}\n\n\t\t\tif (!groveHasCenter) {\n\t\t\t\tgroveHasCenter = true;\n\t\t\t\tgroveCenterX = x;\n\t\t\t\tgroveCenterZ = z;\n\t\t\t\tconst pattern = vegetationGrovePatternForClimate(profile.climate);\n\t\t\t\tgroveRadiusMeters = pattern.groveRadiusMeters;\n\t\t\t\tgroveBackgroundChance = pattern.backgroundChance;\n\t\t\t}\n\t\t\tconst entry = perSpecies[pickSpeciesIndexForClimate(rng(), profile.climate)];\n\t\t\tplaceTreeInstance(entry, x, z, profile.groundY, rng, up, leanAxis, leanQuaternion, matrix, position, quaternion, scaleVector);\n\t\t\tplacedForestAmountSum += profile.forestAmount;\n\t\t\tplacedGroveSuitabilitySum += profile.groveSuitability;\n\t\t\tplacedCount++;\n\t\t\tbreak;\n\t\t}""",
          )
          replace_once(
              vegetation,
              """\t\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\t\tconst { x, z } = sampleAnnulusPoint(clusterRng, seat.x, seat.z, clusterInnerRadius, CLUSTER_RING_OUTER_RADIUS_METERS);\n\t\t\t\tif (!isPlaceablePosition(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges })) continue;\n\t\t\t\tconst entry = perSpecies[pickSpeciesIndexForWorldXZ(clusterRng(), x, z)];\n\t\t\t\tplaceTreeInstance(entry, x, z, sampleHeightMeters, clusterRng, up, matrix, position, quaternion, scaleVector);\n\t\t\t\tplacedCount++;\n\t\t\t\tbreak;\n\t\t\t}""",
              """\t\t\tfor (let attempt = 0; attempt < MAX_ATTEMPTS_PER_TREE; attempt++) {\n\t\t\t\tconst { x, z } = sampleAnnulusPoint(clusterRng, seat.x, seat.z, clusterInnerRadius, CLUSTER_RING_OUTER_RADIUS_METERS);\n\t\t\t\tconst profile = vegetationSurfaceProfile(x, z, { sampleHeightMeters, seaLevelMeters, seats, roadEdges });\n\t\t\t\tif (!profile.placeable) continue;\n\t\t\t\tconst entry = perSpecies[pickSpeciesIndexForClimate(clusterRng(), profile.climate)];\n\t\t\t\tplaceTreeInstance(entry, x, z, profile.groundY, clusterRng, up, leanAxis, leanQuaternion, matrix, position, quaternion, scaleVector);\n\t\t\t\tplacedForestAmountSum += profile.forestAmount;\n\t\t\t\tplacedGroveSuitabilitySum += profile.groveSuitability;\n\t\t\t\tplacedCount++;\n\t\t\t\tbreak;\n\t\t\t}""",
          )
          replace_once(
              vegetation,
              """\tgroup.userData.vegetationSpatialPattern = Object.freeze({\n\t\tpolicyId: spatialPolicy.id,\n\t\tdeterministic: true,\n\t\tclimateAuthority: spatialPolicy.climateAuthority,\n\t\tbaseDensityPerKm2: densityPerKm2,\n\t\tgroveTreeCountMin: spatialPolicy.groveTreeCountMin,\n\t\tgroveTreeCountMax: spatialPolicy.groveTreeCountMax,\n\t});""",
              """\tgroup.userData.vegetationSpatialPattern = Object.freeze({\n\t\tpolicyId: spatialPolicy.id,\n\t\tdeterministic: true,\n\t\tclimateAuthority: spatialPolicy.climateAuthority,\n\t\tterrainForestMaskAuthority: spatialPolicy.terrainForestMaskAuthority,\n\t\tterrainForestMaskAligned: spatialPolicy.terrainForestMaskAligned,\n\t\tbaseDensityPerKm2: densityPerKm2,\n\t\tgroveTreeCountMin: spatialPolicy.groveTreeCountMin,\n\t\tgroveTreeCountMax: spatialPolicy.groveTreeCountMax,\n\t\tmeanTerrainForestAmount: placedCount > 0 ? placedForestAmountSum / placedCount : 0,\n\t\tmeanGroveSuitability: placedCount > 0 ? placedGroveSuitabilitySum / placedCount : 0,\n\t\tdeterministicSilhouetteVariation: true,\n\t\tmaxLeanDegrees: spatialPolicy.maxLeanDegrees,\n\t});""",
          )

          test = 'scripts/checkVegetationEcologicalGroves.mjs'
          replace_once(
              test,
              "import {\n\tVEGETATION_SPATIAL_PATTERN_POLICY,\n\tcreateVegetation,\n\tdisposeVegetation,\n\tvegetationGrovePatternForClimate,\n} from '../src/3d/world/vegetation.js';",
              """import {\n\tVEGETATION_SPATIAL_PATTERN_POLICY,\n\tcreateVegetation,\n\tdisposeVegetation,\n\tvegetationGrovePatternForClimate,\n} from '../src/3d/world/vegetation.js';\nimport { resolveTerrainForestAmount } from '../src/3d/world/terrainBiomeShading.js';""",
          )
          replace_once(
              test,
              """function gridStats(points) {""",
              """function foliageScaleRatios(group) {\n\tconst matrix = new THREE.Matrix4();\n\tconst position = new THREE.Vector3();\n\tconst quaternion = new THREE.Quaternion();\n\tconst scale = new THREE.Vector3();\n\tconst ratios = [];\n\tfor (const mesh of group.children) {\n\t\tif (!mesh?.isInstancedMesh || !mesh.name.endsWith('-foliage')) continue;\n\t\tfor (let index = 0; index < mesh.count; index += 1) {\n\t\t\tmesh.getMatrixAt(index, matrix);\n\t\t\tmatrix.decompose(position, quaternion, scale);\n\t\t\tratios.push(scale.z > 0 ? scale.x / scale.z : 1);\n\t\t}\n\t}\n\treturn ratios;\n}\n\nfunction referenceForestMean() {\n\tlet sum = 0;\n\tlet count = 0;\n\tfor (let z = -RADIUS_METERS; z <= RADIUS_METERS; z += 150) {\n\t\tfor (let x = -RADIUS_METERS; x <= RADIUS_METERS; x += 150) {\n\t\t\tif (Math.hypot(x, z) > RADIUS_METERS) continue;\n\t\t\tsum += resolveTerrainForestAmount({ heightAboveSeaMeters: 100, slopeDegrees: 0, worldX: x, worldZ: z });\n\t\t\tcount += 1;\n\t\t}\n\t}\n\treturn sum / count;\n}\n\nfunction gridStats(points) {""",
          )
          replace_once(
              test,
              "assert.equal(VEGETATION_SPATIAL_PATTERN_POLICY.id, 'vegetation-ecological-grove-scatter-2026-08-26-v1');",
              """assert.equal(VEGETATION_SPATIAL_PATTERN_POLICY.id, 'vegetation-terrain-biome-aligned-grove-scatter-2026-09-02-v2');\nassert.equal(VEGETATION_SPATIAL_PATTERN_POLICY.terrainForestMaskAligned, true);\nassert(VEGETATION_SPATIAL_PATTERN_POLICY.crownWidthJitter > 0);\nassert(VEGETATION_SPATIAL_PATTERN_POLICY.maxLeanDegrees > 0);""",
          )
          replace_once(
              test,
              """\tconst differentPoints = collectTreePositions(different.group);\n\n\tassert.equal(first.placedCount, first.targetCount, 'flat-land fixture must retain the requested total tree budget');""",
              """\tconst differentPoints = collectTreePositions(different.group);\n\tconst crownRatios = foliageScaleRatios(first.group);\n\n\tassert.equal(first.placedCount, first.targetCount, 'flat-land fixture must retain the requested total tree budget');\n\tassert(crownRatios.some((ratio) => Math.abs(ratio - 1) >= 0.025),\n\t\t'foliage instances must break identical primitive silhouettes with deterministic crown aspect variation');""",
          )
          replace_once(
              test,
              """\tassert.equal(first.group.userData.vegetationSpatialPattern.baseDensityPerKm2, DENSITY_PER_KM2);\n\n\tconsole.log('[checkVegetationEcologicalGroves] PASS', JSON.stringify({""",
              """\tassert.equal(first.group.userData.vegetationSpatialPattern.baseDensityPerKm2, DENSITY_PER_KM2);\n\tassert.equal(first.group.userData.vegetationSpatialPattern.terrainForestMaskAligned, true);\n\tconst baselineForestMean = referenceForestMean();\n\tconst placedForestMean = first.group.userData.vegetationSpatialPattern.meanTerrainForestAmount;\n\tassert(placedForestMean >= baselineForestMean + 0.015,\n\t\t`live temperate groves must correlate with the terrain forest mask: placed=${placedForestMean}, baseline=${baselineForestMean}`);\n\n\tconsole.log('[checkVegetationEcologicalGroves] PASS', JSON.stringify({""",
          )
          replace_once(
              test,
              """\t\tmeanNearestNeighbourMeters: Number(nearest.toFixed(2)),\n\t\ttemperateGroveRadiusMeters: temperatePattern.groveRadiusMeters,""",
              """\t\tmeanNearestNeighbourMeters: Number(nearest.toFixed(2)),\n\t\tbaselineForestMean: Number(baselineForestMean.toFixed(3)),\n\t\tplacedForestMean: Number(placedForestMean.toFixed(3)),\n\t\tcrownAspectRange: crownRatios.length ? [Number(Math.min(...crownRatios).toFixed(3)), Number(Math.max(...crownRatios).toFixed(3))] : [],\n\t\ttemperateGroveRadiusMeters: temperatePattern.groveRadiusMeters,""",
          )
          PY

      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs

      - name: Syntax and vegetation regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/terrainBiomeShading.js
          node --check src/3d/world/vegetation.js
          node --check scripts/checkVegetationEcologicalGroves.mjs
          node scripts/checkNorthernVegetationClimate.mjs
          node scripts/checkNorthernVegetationRuntime.mjs
          node scripts/checkNorthernVegetationDeterminism.mjs
          node scripts/checkVegetationEcologicalGroves.mjs
          node scripts/checkNorthSnowPineCrowdReadability.mjs
          node scripts/checkNorthClimateContinuity.mjs
          node scripts/checkNorthMountainSnowline.mjs

      - name: Commit verified production changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/3d/world/terrainBiomeShading.js src/3d/world/vegetation.js scripts/checkVegetationEcologicalGroves.mjs
          git rm .github/workflows/_tmp-vegetation-biome-alignment-v2.yml
          git commit -m "feat(world): align vegetation stands with terrain biomes"
          git push origin HEAD:codex/aapw-realism-20260831-ocean
