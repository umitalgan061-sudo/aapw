name: Run 274 Owner Map Surface Pindexes

on:
  push:
    branches:
      - run274-owner-map-surface-pindexes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run274-owner-map-surface-pindexes-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 85639f9e09ae553ad1fc8ca643ba9ca548bd790b
  OWNER_MAP_SHA: 20702972e8f45f0fbdc4da5fa68e890a82e4e822e1d58e2f369d8bc5b9c571a1
  TZ: Europe/Istanbul

jobs:
  validate:
    if: github.event.head_commit.message != 'run274 validated owner-map surface checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Starting exact-main concurrency and additive-only gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          grep -F "$OWNER_MAP_SHA" WORLD_REFERENCE_MAP.md
          grep -F "$OWNER_MAP_SHA" src/3d/world/worldReferenceSurfacePindexes.js
          grep -F "$OWNER_MAP_SHA" src/3d/world/worldReferenceSurfaceTerrainVisual.js

      - name: Wire canonical-dev surface and prepend PWA ownership additively
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq 'Run274 owner-map semantic terrain offline shell extension.' service-worker.js; then
            TMP_SW="$(mktemp)"
            printf '%s\n' \
              '// Run274 owner-map semantic terrain offline shell extension.' \
              "self.addEventListener('install', () => {" \
              "    GAME3D_SHELL_FILES.push('./src/3d/world/worldReferenceSurfacePindexes.js');" \
              "    GAME3D_SHELL_FILES.push('./src/3d/world/worldReferenceSurfaceTerrainVisual.js');" \
              '});' \
              '' > "$TMP_SW"
            cat service-worker.js >> "$TMP_SW"
            mv "$TMP_SW" service-worker.js
          fi
          if ! grep -Fq 'Run274 canonical owner-map semantic terrain surface activation.' scripts/run201CanonicalDevBoot.mjs; then
            printf '%s\n' \
              '' \
              '// Run274 canonical owner-map semantic terrain surface activation.' \
              "import { applyReferenceSurfaceToTerrainGroup } from '../src/3d/world/worldReferenceSurfaceTerrainVisual.js';" \
              "if (selector.getActiveSource() === 'canonical' && selector.activation?.windowState?.terrainGroup) {" \
              '  const run274Surface = applyReferenceSurfaceToTerrainGroup(selector.activation.windowState.terrainGroup);' \
              "  document.body.dataset.run273SurfaceReady = 'true';" \
              '  document.body.dataset.run273SurfaceSourceSha = run274Surface.sourceMapSha256;' \
              '  document.body.dataset.run273SurfaceCounts = JSON.stringify(run274Surface.counts);' \
              '  document.body.dataset.run273SurfacePindexes = JSON.stringify(run274Surface.pindexVertexCounts);' \
              '  document.body.dataset.run273SurfaceMeshCount = String(run274Surface.meshCount);' \
              '  document.body.dataset.run273SurfaceVertexCount = String(run274Surface.vertexCount);' \
              "  status.textContent += ' | map-surface=' + run274Surface.vertexCount + 'v';" \
              '  state.renderer.render(state.scene, state.camera);' \
              '}' >> scripts/run201CanonicalDevBoot.mjs
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js scripts/run201CanonicalDevBoot.mjs
          git commit -m 'feat(run274): wire owner-map semantic terrain surface'
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --numstat "$BASE_SHA" HEAD -- service-worker.js | awk '{print $2}')" = '0'

      - name: Syntax and 10-pindex semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceSurfacePindexes.js
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          node --check scripts/checkRun274MapSurfacePindexes.js
          node --check scripts/checkRun274CanonicalMapSurfaceBrowser.js
          node --check scripts/run201CanonicalDevBoot.mjs
          node scripts/checkRun274MapSurfacePindexes.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js

      - name: PWA cache and installability regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Install Chromium smoke dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real canonical-dev map-surface browser proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun274CanonicalMapSurfaceBrowser.js
          test -s artifacts/run273-canonical-map-surface/proof.json
          test -s artifacts/run273-canonical-map-surface/canonical-map-surface-online.png
          test -s artifacts/run273-canonical-map-surface/canonical-map-surface-offline.png

      - name: Performance determinism terrain and road safety
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run274-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js

      - name: Full Chromium smoke and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run274-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run274-smoke.log")" -ge 34

      - name: Upload Run274 visual proof
        uses: actions/upload-artifact@v4
        with:
          name: run274-owner-map-surface-proof
          path: artifacts/run273-canonical-map-surface/
          if-no-files-found: error
          retention-days: 14

      - name: Pre-publication exact-main concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

      - name: Record validated Run274 checkpoint and publish branch
        shell: bash
        run: |
          set -euo pipefail
          MARKER='## Run 274 — Owner-map semantic surface + 10 pindexes'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' "- Owner map SHA-256 $OWNER_MAP_SHA remains the exact canonical source provenance. The owner-supplied 1536x1024 map was independently verified against this persisted SHA before implementation." >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- A deterministic 96x64 base mask distinguishes sea/lake/soil/rock/snow. Road remains the existing bridge-aware canonical overlay, so road styling cannot erase sea/lake semantics except on a validated bridge deck.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The source map is partitioned into 10 deterministic west-to-east pindexes for repeatable visual inspection. Canonical-dev terrain receives source-map semantic vertex colors without changing geometry, heights, settlement seats, route geometry, bridge ownership, 2D runtime, or default game3d ownership.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Full-mask/pindex checks, online+offline Chromium visual proof, PWA/cache/installability, mobile performance, seeded determinism, terrain-seat safety, road safety, technical-debt and full browser smoke/console gates passed.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: polish one pindex at a time with PBR/detail layers while retaining this immutable semantic classification and comparing against the canonical owner map.' >> 3D_GAME_PROGRESS.md
          fi
          ADR='## ADR-RUN274 — Owner map surface semantics are classified once and inspected as 10 west-to-east pindexes'
          if ! grep -Fq "$ADR" DECISIONS.md; then
            printf '\n%s\n' "$ADR" >> DECISIONS.md
            printf '%s\n' '- Decision: preserve the owner-supplied map SHA as macro-geography source of truth; use deterministic sea/lake/soil/rock/snow base classification and preserve road/bridge geometry as an overlay. Ten pindexes are an inspection partition only and do not replace the canonical 27x21 clipped chunk ownership grid.' >> DECISIONS.md
            printf '%s\n' '- Rationale: terrain polish must not independently reinvent geography. One immutable map-derived semantic contract keeps hydrology, relief and future pindex-by-pindex PBR work aligned and reversible.' >> DECISIONS.md
          fi
          if ! grep -Fq 'run274,2026-08-11,owner-map-surface-pindexes' perf_log.csv; then
            printf '%s\n' 'run274,2026-08-11,owner-map-surface-pindexes,,,,,,,"owner-map semantic vertex colors; geometry delta 0; visual proof + mandatory regression chain PASS"' >> perf_log.csv
          fi
          if ! grep -Fq 'Run274 owner-map semantic surface' STABLE_TAGS.md; then
            TAG="stable-$(date +%Y-%m-%d-%H%M)"
            printf '\n- `%s` — Run274 owner-map semantic surface + 10 pindexes; source-map provenance, online/offline visual proof, PWA/perf/determinism/terrain-road safety/full smoke PASS.\n' "$TAG" >> STABLE_TAGS.md
          fi
          git add 3D_GAME_PROGRESS.md DECISIONS.md perf_log.csv STABLE_TAGS.md
          git commit -m 'run274 validated owner-map surface checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --numstat "$BASE_SHA" HEAD -- service-worker.js | awk '{print $2}')" = '0'
          git push origin "HEAD:${GITHUB_REF_NAME}"
