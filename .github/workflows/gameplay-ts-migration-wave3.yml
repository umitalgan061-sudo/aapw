name: Kızıl Ufuk Gameplay TypeScript Migration Wave 3

on:
  push:
    branches: ['main', 'agent/kizil-ufuk-ts-gameplay-wave3-20260921-r1']
  pull_request:
    branches: ['main']
    paths:
      - 'src/3d/gameplay/animalConfig.*'
      - 'src/3d/gameplay/dialogueChoices.*'
      - 'src/3d/gameplay/interactionConfig.*'
      - 'src/3d/gameplay/interactionEconomy.*'
      - 'src/3d/gameplay/interactionFieldReadiness.*'
      - 'src/3d/gameplay/livingWorldAssetEvidencePolicy.*'
      - 'scripts/checkGameplayTsMigrationWave3.mjs'
      - 'tests/modern/gameplayTsMigrationWave3.test.ts'
      - '.github/workflows/gameplay-ts-migration-wave3.yml'

permissions:
  contents: read

concurrency:
  group: gameplay-ts-migration-wave3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - run: npm install --no-audit --no-fund

      - name: Exact main ancestry
        run: git fetch origin main --no-tags && git merge-base --is-ancestor origin/main "$GITHUB_SHA"

      - name: Changed-line cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000

      - name: Migration contract
        run: node scripts/checkGameplayTsMigrationWave3.mjs

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Regression
        run: npx vitest run tests/modern/gameplayTsMigrationWave3.test.ts
