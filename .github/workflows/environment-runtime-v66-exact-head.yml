name: Environment Runtime V66 Exact Head

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentRuntime*V66.js'
      - 'src/3d/world/environmentRuntimeV66Audit.js'
      - 'src/3d/world/environmentRuntimeV66Manifest.js'
      - 'scripts/checkEnvironmentRuntimeV66*.mjs'
      - '.github/workflows/environment-runtime-v66-exact-head.yml'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  exact-head-v66:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact head and current PR base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin main --depth=1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            current_main="$(git rev-parse origin/main)"
            test "${base}" = "${current_main}"
          fi
      - name: Verify changed-line envelope
        shell: bash
        run: |
          set -euo pipefail
          base="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          changed="$(git diff --numstat "${base}...HEAD" | awk '{a+=$1;d+=$2} END {print a+d}')"
          echo "base=${base}"
          echo "changed-lines=${changed}"
          test "${changed}" -ge 2850
          test "${changed}" -le 3000
      - name: Verify V66-only scope
        shell: bash
        run: |
          set -euo pipefail
          base="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          bad=0
          while IFS= read -r file; do
            case "$file" in
              src/3d/world/environmentRuntime*V66.js|src/3d/world/environmentRuntimeV66Audit.js|src/3d/world/environmentRuntimeV66Manifest.js|scripts/checkEnvironmentRuntimeV66*.mjs|.github/workflows/environment-runtime-v66-exact-head.yml) ;;
              *) echo "out-of-scope:${file}"; bad=1;;
            esac
          done < <(git diff --name-only "${base}...HEAD")
          test "$bad" -eq 0
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in src/3d/world/environmentRuntime*V66.js scripts/checkEnvironmentRuntimeV66*.mjs; do node --check "$file"; done
      - name: Boundary scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|createBoxGeometry\|createSphereGeometry\|createCylinderGeometry" src/3d/world/environmentRuntime*V66.js
          grep -R -q "WorldAssetPlacementPipeline.js" src/3d/world/environmentRuntimeIntegrationV66.js
          grep -R -q "MaterialAssignmentCore.js" src/3d/world/environmentRuntimeIntegrationV66.js
          grep -R -q "noWorldMutation: true" src/3d/world/environmentRuntimeIntegrationV66.js
      - name: Core V66 regression
        run: node scripts/checkEnvironmentRuntimeV66.mjs
      - name: Edge V66 regression
        run: node scripts/checkEnvironmentRuntimeV66EdgeCases.mjs
      - name: Integration V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Integration.mjs
      - name: Performance V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Performance.mjs
      - name: Spatial stress V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Stress.mjs
      - name: Acceptance V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Acceptance.mjs
      - name: Release acceptance V66 regression
        run: node scripts/checkEnvironmentRuntimeV66ReleaseAcceptance.mjs
      - name: Climate V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Climate.mjs
      - name: Ground V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Ground.mjs
      - name: Weather V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Weather.mjs
      - name: Streaming V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Streaming.mjs
      - name: Acoustics V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Acoustics.mjs
      - name: Geology V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Geology.mjs
      - name: Resonance V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Resonance.mjs
      - name: Continuity V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Continuity.mjs
      - name: Scenario ledger V66 regression
        run: node scripts/checkEnvironmentRuntimeV66ScenarioLedger.mjs
      - name: Biome coverage V66 regression
        run: node scripts/checkEnvironmentRuntimeV66BiomeCoverage.mjs
      - name: Stress ledger V66 regression
        run: node scripts/checkEnvironmentRuntimeV66StressLedger.mjs
      - name: Architecture V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Architecture.mjs
      - name: Quality guard V66 regression
        run: node scripts/checkEnvironmentRuntimeV66QualityGuard.mjs
      - name: Final V66 regression
        run: node scripts/checkEnvironmentRuntimeV66Final.mjs
      - name: Manifest audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { ENVIRONMENT_RUNTIME_V66_MANIFEST as m } from './src/3d/world/environmentRuntimeV66Manifest.js';
          const expected = 19;
          if (m.version !== 66 || m.deterministic !== true || m.noWorldMutation !== true) throw new Error('manifest-contract');
          if (m.features.length !== expected) throw new Error(`features:${m.features.length}`);
          if (m.acceptance.width !== 1536 || m.acceptance.height !== 1024) throw new Error('acceptance');
          console.log(JSON.stringify({ ok: true, features: m.features.length }));
          NODE
      - name: Diff whitespace audit
        run: git diff --check origin/main...HEAD
