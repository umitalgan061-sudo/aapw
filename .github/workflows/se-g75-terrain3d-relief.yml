name: SE G75 Terrain3D Relief

on:
  push:
    branches:
      - agent/kizil-ufuk-g75-relief-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'godot/terrain-authoring/geocells/se/g75_relief.mjs'
      - 'scripts/checkSEG75Relief.mjs'
      - 'godot/terrain-authoring/scripts/validate_g75_terrain3d_relief.gd'
      - 'godot/terrain-authoring/corner_claims/SE.json'
      - '.github/workflows/se-g75-terrain3d-relief.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g75-terrain3d-relief-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 405b8faa5bbfbdcfd9c73ddafa8a05b855cd32ec

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/se/g75_relief.mjs|scripts/checkSEG75Relief.mjs|godot/terrain-authoring/scripts/validate_g75_terrain3d_relief.gd|godot/terrain-authoring/corner_claims/SE.json|\.github/workflows/se-g75-terrain3d-relief.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
      - name: G75 relief determinism map fidelity and seam metrics
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g75_relief.mjs
          node --check scripts/checkSEG75Relief.mjs
          node scripts/checkSEG75Relief.mjs | tee "$RUNNER_TEMP/g75-relief-a.log"
          node scripts/checkSEG75Relief.mjs | tee "$RUNNER_TEMP/g75-relief-b.log"
          cmp "$RUNNER_TEMP/g75-relief-a.log" "$RUNNER_TEMP/g75-relief-b.log"
          grep -F 'SE_G75_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g75-relief-a.log"
          node scripts/checkSEG75Relief.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g75-relief-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g75-relief-probe.json
      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"
          DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real Terrain3D height import save LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G75_RELIEF_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g75_terrain3d_relief.gd | tee "$RUNNER_TEMP/g75-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-relief-imported-topdown.png "$RUNNER_TEMP/g75-relief-a.png"
          G75_RELIEF_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g75_terrain3d_relief.gd | tee "$RUNNER_TEMP/g75-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-relief-imported-topdown.png "$RUNNER_TEMP/g75-relief-b.png"
          grep -F 'SE_G75_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g75-t3d-a.log"
          grep -F 'SE_G75_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g75-t3d-b.log"
          cmp "$RUNNER_TEMP/g75-relief-a.png" "$RUNNER_TEMP/g75-relief-b.png"
      - name: Install Playwright Chromium for world and browser safety
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: HTerrain and world safety regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
      - name: Browser smoke and mobile performance
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g75-terrain3d-relief-proof
          path: |
            godot/terrain-authoring/.terrain3d-proof/g75-relief-probe.json
            godot/terrain-authoring/.terrain3d-proof/g75-relief-imported-topdown.png
          if-no-files-found: warn
