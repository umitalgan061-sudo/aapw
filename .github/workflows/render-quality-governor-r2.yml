name: Render Quality Governor R2
on:
  pull_request:
    paths:
      - 'src/3d/renderQualityGovernorR2.js'
      - 'scripts/checkRenderQualityGovernorR2.mjs'
      - 'scripts/runRenderQualityGovernorR2.mjs'
      - 'artifacts/render-quality-governor-r2/**'
      - 'src/3d/RENDER_QUALITY_GOVERNOR_R2.md'
      - '.github/workflows/render-quality-governor-r2.yml'
  push:
    paths:
      - 'src/3d/renderQualityGovernorR2.js'
      - 'scripts/checkRenderQualityGovernorR2.mjs'
      - 'scripts/runRenderQualityGovernorR2.mjs'
      - 'artifacts/render-quality-governor-r2/**'
      - 'src/3d/RENDER_QUALITY_GOVERNOR_R2.md'
      - '.github/workflows/render-quality-governor-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check src/3d/renderQualityGovernorR2.js && node --check scripts/checkRenderQualityGovernorR2.mjs && node --check scripts/runRenderQualityGovernorR2.mjs
      - name: Contract
        run: node scripts/checkRenderQualityGovernorR2.mjs
      - name: Matrix replay
        run: node scripts/runRenderQualityGovernorR2.mjs
      - name: Diff hygiene
        run: git diff --check
