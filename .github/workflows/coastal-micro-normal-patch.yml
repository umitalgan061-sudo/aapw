name: Coastal Micro Normal Patch
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/coastal-relief-realism-20260815
      - name: Add procedural lighting micro normals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/3d/world/worldReferenceSurfaceTerrainVisual.js')
          text = path.read_text()
          anchor = ".replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>\\nroughnessFactor=mix(roughnessFactor,pindexQualityAtlasData.g,${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.roughnessBlend.toFixed(3)});\\nfloat pindexQualityRoughNoise=texture2D(pindexQualityDetailAtlas,vPindexQualityWorldPosition.xz*0.033+vec2(0.11,0.57)).b*2.0-1.0;\\nroughnessFactor=clamp(roughnessFactor+pindexQualityRoughNoise*${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderRoughnessMicroVariation.toFixed(3)}+pindexQualitySteepRock*0.045,0.18,1.0);`);"
          replacement = ".replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>\\nroughnessFactor=mix(roughnessFactor,pindexQualityAtlasData.g,${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.roughnessBlend.toFixed(3)});\\nfloat pindexQualityRoughNoise=texture2D(pindexQualityDetailAtlas,vPindexQualityWorldPosition.xz*0.033+vec2(0.11,0.57)).b*2.0-1.0;\\nroughnessFactor=clamp(roughnessFactor+pindexQualityRoughNoise*${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderRoughnessMicroVariation.toFixed(3)}+pindexQualitySteepRock*0.045,0.18,1.0);`)\\n\t\t\t.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>\\nvec2 pindexQualityMicroUv=vPindexQualityWorldPosition.xz*0.052;\\nfloat pindexQualityMicroStep=0.018;\\nfloat pindexQualityMicroL=texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv-vec2(pindexQualityMicroStep,0.0)).r*0.65+texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv*2.17-vec2(pindexQualityMicroStep,0.0)+vec2(0.31,0.47)).g*0.35;\\nfloat pindexQualityMicroR=texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv+vec2(pindexQualityMicroStep,0.0)).r*0.65+texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv*2.17+vec2(pindexQualityMicroStep,0.0)+vec2(0.31,0.47)).g*0.35;\\nfloat pindexQualityMicroD=texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv-vec2(0.0,pindexQualityMicroStep)).r*0.65+texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv*2.17-vec2(0.0,pindexQualityMicroStep)+vec2(0.31,0.47)).g*0.35;\\nfloat pindexQualityMicroU=texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv+vec2(0.0,pindexQualityMicroStep)).r*0.65+texture2D(pindexQualityDetailAtlas,pindexQualityMicroUv*2.17+vec2(0.0,pindexQualityMicroStep)+vec2(0.31,0.47)).g*0.35;\\nvec2 pindexQualityMicroGradient=vec2(pindexQualityMicroL-pindexQualityMicroR,pindexQualityMicroD-pindexQualityMicroU);\\nfloat pindexQualityMicroStrength=mix(0.24,0.48,pindexQualitySteepRock)*pindexQualityDry;\\nvec3 pindexQualityMicroWorldNormal=normalize(vPindexQualityWorldNormal+vec3(pindexQualityMicroGradient.x*pindexQualityMicroStrength,0.0,pindexQualityMicroGradient.y*pindexQualityMicroStrength));\\nvec3 pindexQualityMicroViewNormal=normalize(mat3(viewMatrix)*pindexQualityMicroWorldNormal);\\nnormal=normalize(mix(normal,pindexQualityMicroViewNormal,clamp(0.28*pindexQualityDry+0.24*pindexQualitySteepRock,0.0,0.52)));`);"
          if replacement not in text:
            if text.count(anchor) != 1:
              raise SystemExit(f'roughness shader anchor drifted: {text.count(anchor)}')
            text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          git diff --check
      - name: Commit production shader only
        run: |
          if git diff --quiet -- src/3d/world/worldReferenceSurfaceTerrainVisual.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/worldReferenceSurfaceTerrainVisual.js
          git commit -m 'terrain: add procedural surface micro normals'
          git push origin HEAD:chatgpt/coastal-relief-realism-20260815
