name: Safak Kartali faction response proof

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFactionResponse*.js'
      - 'scripts/checkLivingWorldFactionResponse*.mjs'
      - '.github/workflows/safak-kartali-faction-response-proof.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run proof contract
        run: node scripts/checkLivingWorldFactionResponseProof.mjs
