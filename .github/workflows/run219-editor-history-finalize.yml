name: Run 219 Editor History Finalize

on:
  push:
    branches:
      - agent/run219-editor-history-regression
    paths:
      - '.github/workflows/run219-editor-history-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run219-editor-history-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting remote-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Reverify Run219 release gates
        run: |
          set -euo pipefail
          node --check scripts/checkRun219EditorHistoryBrowser.js
          node scripts/checkRun219EditorHistoryBrowser.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js
      - name: Final remote-main concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append Run219 governance records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          cat >> 3D_GAME_PROGRESS.md <<'EOF'

## Run 219 — World Editor undo/redo browser regression
- Added a permanent additive-only Chromium regression for the existing EditorHistoryController surface.
- Verified clean boot history depth, disabled initial undo/redo state, object-creation capture, one-step undo to the exact empty scene, redo restoration of the exact marker-tree asset, redo-stack transitions, and zero browser console/page errors.
- Captured full-page visual evidence after redo restoration.
- PWA cache/installability, mobile performance, deterministic RNG/world-reference/hydrology, terrain/road safety, technical-debt audit, full browser smoke, and final remote-main/additive-only gates all PASS.
- Runtime/product source delta: 0 lines changed. New permanent files are regression/workflow only. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5.
- World Evolution delta: roads +0 km; coverage +0; castles +0; NPCs +0; world events +0; creatures +0. Existing desktop/mobile render metrics unchanged.
- ADR not required: no architecture, persistence, gameplay, public API, deterministic generation, asset-license or runtime behavior decision changed.
- Next safe step: continue additive-only World Editor/RTS usability work from current main without crossing unresolved owner gates.
EOF
          cat >> perf_log.csv <<EOF
run219,$(date +%Y-%m-%d),editor-history-regression,,,,,,,"test-only browser regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"
EOF
          cat >> STABLE_TAGS.md <<EOF
${TAG} — Run219 editor history regression; undo/redo round-trip, visual proof, PWA/perf/determinism/smoke gates verified.
EOF
          echo "STABLE_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Commit verified checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run219): record editor history regression checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run219-editor-history-regression
          git push origin "$STABLE_TAG" || true
