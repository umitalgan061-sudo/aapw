name: Terrain Foundation Conformer

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainFoundationConformer.js'
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - 'src/3d/world/structureGroundingPolicy.js'
      - 'src/3d/world/settlements.js'
      - 'src/3d/world/terrain.js'
      - 'src/3d/world/chunkManager.js'
      - 'src/3d/physics.js'
      - 'scripts/checkStructureGroundingPolicy.mjs'
      - 'scripts/checkStructureSurfacePolicy.mjs'
      - 'scripts/checkSettlementFoundationAuthority.mjs'
      - 'scripts/checkTerrainFoundationConformer.mjs'
      - 'scripts/checkTerrainFoundationBatchRemoval.mjs'
      - 'scripts/checkFoundationRenderPhysicsParity.mjs'
      - 'scripts/setupNodeThreeShim.mjs'
      - '.github/workflows/terrain-foundation-conformer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-conform:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs
      - name: Syntax
        run: |
          node --check src/3d/world/terrainFoundationConformer.js
          node --check src/3d/world/WorldAssetPlacementPipeline.js
          node --check src/3d/world/structureGroundingPolicy.js
          node --check scripts/checkStructureGroundingPolicy.mjs
          node --check scripts/checkStructureSurfacePolicy.mjs
          node --check scripts/checkSettlementFoundationAuthority.mjs
          node --check scripts/checkTerrainFoundationConformer.mjs
          node --check scripts/checkTerrainFoundationBatchRemoval.mjs
          node --check scripts/checkFoundationRenderPhysicsParity.mjs
      - name: Shared structure footprint and surface classification
        run: |
          node scripts/checkStructureGroundingPolicy.mjs
          node scripts/checkStructureSurfacePolicy.mjs
      - name: Settlement render and physics foundation authority
        run: node scripts/checkSettlementFoundationAuthority.mjs
      - name: Shared terrain authority and selective chunk rebuild
        run: |
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkTerrainFoundationBatchRemoval.mjs
          node scripts/checkFoundationRenderPhysicsParity.mjs

  shape-aware-rebuild-publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch production and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def one(text, old, new, label):
              count = text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('src/3d/world/terrainFoundationConformer.js')
          s = p.read_text()
          s = one(s,
              "Runtime structure foundations use an adaptive four-cell circle union over the AABB. Near-square\n * footprints use a 2x2 grid; long/narrow footprints rotate the same four-pad budget into 4x1 or 1x4.\n * Every circle encloses its rectangular cell, so the full base stays flat while narrow structures avoid\n * the side overreach a forced 2x2 grid still produced. Legacy authored seat/castle pads remain ordinary\n * circles and continue to work unchanged in `createHeightSampler`.",
              "Runtime structure foundations use an adaptive four-cell oriented-rectangle union. Near-square\n * footprints use a 2x2 grid; long/narrow footprints rotate the same four-pad budget into 4x1 or 1x4.\n * The same rectangle + feather shape now drives both height influence and resident-chunk rebuild selection,\n * avoiding the obsolete circumscribed-circle rebuild overreach. Legacy authored seat/castle pads remain\n * ordinary circles and continue to use circle-vs-chunk intersection unchanged.", 'module contract')
          s = one(s, "id: 'runtime-structure-foundation-conform-2026-08-24-v11-oriented-rect-cells'", "id: 'runtime-structure-foundation-conform-2026-08-25-v12-shape-aware-rebuild'", 'policy id')
          s = one(s, "chunkRebuildMode: 'union-deduplicated'", "chunkRebuildMode: 'shape-aware-union-deduplicated'", 'mode')
          old = """function circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\tconst half = chunkSizeMeters * 0.5;
\tconst centerX = chunkX * chunkSizeMeters;
\tconst centerZ = chunkZ * chunkSizeMeters;
\tconst closestX = Math.max(centerX - half, Math.min(pad.x, centerX + half));
\tconst closestZ = Math.max(centerZ - half, Math.min(pad.z, centerZ + half));
\treturn Math.hypot(pad.x - closestX, pad.z - closestZ) <= pad.outerRadiusMeters;
}
"""
          new = old + """
function orientedRectangleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\tconst axisXX = finiteNumber(pad.axisX?.x), axisXZ = finiteNumber(pad.axisX?.z);
\tconst axisZX = finiteNumber(pad.axisZ?.x), axisZZ = finiteNumber(pad.axisZ?.z);
\tconst halfWidth = finiteNumber(pad.halfWidthMeters), halfDepth = finiteNumber(pad.halfDepthMeters);
\tconst feather = Math.max(0, finiteNumber(pad.featherMeters) ?? 0);
\tif ([axisXX, axisXZ, axisZX, axisZZ, halfWidth, halfDepth].some((value) => value === null)) return circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
\tconst xLength = Math.hypot(axisXX, axisXZ), zLength = Math.hypot(axisZX, axisZZ);
\tif (xLength < 1e-6 || zLength < 1e-6 || halfWidth < 0 || halfDepth < 0) return circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
\tconst ux = axisXX / xLength, uz = axisXZ / xLength, vx = axisZX / zLength, vz = axisZZ / zLength;
\tif (Math.abs(ux * vx + uz * vz) > 0.08) return circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
\tconst chunkHalf = chunkSizeMeters * 0.5;
\tconst dx = pad.x - chunkX * chunkSizeMeters, dz = pad.z - chunkZ * chunkSizeMeters;
\tconst rectHalfX = halfWidth + feather, rectHalfZ = halfDepth + feather;
\tif (Math.abs(dx) > chunkHalf + rectHalfX * Math.abs(ux) + rectHalfZ * Math.abs(vx)) return false;
\tif (Math.abs(dz) > chunkHalf + rectHalfX * Math.abs(uz) + rectHalfZ * Math.abs(vz)) return false;
\tif (Math.abs(dx * ux + dz * uz) > rectHalfX + chunkHalf * (Math.abs(ux) + Math.abs(uz))) return false;
\tif (Math.abs(dx * vx + dz * vz) > rectHalfZ + chunkHalf * (Math.abs(vx) + Math.abs(vz))) return false;
\treturn true;
}

function foundationIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\treturn pad?.shape === 'oriented-rectangle' ? orientedRectangleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) : circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
}
"""
          s = one(s, old, new, 'intersection')
          s = one(s, "validPads.some((pad) => circleIntersectsChunk(pad, chunk.x, chunk.z, size))", "validPads.some((pad) => foundationIntersectsChunk(pad, chunk.x, chunk.z, size))", 'selector')
          p.write_text(s)

          p = Path('scripts/checkTerrainFoundationConformer.mjs'); s = p.read_text()
          s = one(s, "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.chunkRebuildMode, 'union-deduplicated');", "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.chunkRebuildMode, 'shape-aware-union-deduplicated');", 'assert mode')
          anchor = "assert.deepEqual(events, ['unload:1,0', 'load:1,0'], 'union rebuild must not duplicate unload/load events for one chunk');\nevents.length = 0;\n"
          extra = anchor + """
const shapeEvents = [];
const shapeManager = {
\tchunkSizeMeters: 100,
\tloaded: new Map([['-1,1', {}], ['-1,-1', {}], ['0,0', {}], ['1,1', {}], ['1,-1', {}]]),
\tunloadChunk(x, z) { shapeEvents.push(`unload:${x},${z}`); this.loaded.delete(`${x},${z}`); },
\tloadChunk(x, z) { shapeEvents.push(`load:${x},${z}`); this.loaded.set(`${x},${z}`, {}); },
};
const shapeAwareCount = rebuildChunksForFoundation(shapeManager, {
\tshape: 'oriented-rectangle', x: 0, z: 0,
\thalfWidthMeters: 150, halfDepthMeters: 5,
\taxisX: { x: diagonal, z: diagonal }, axisZ: { x: -diagonal, z: diagonal },
\tfeatherMeters: 2, outerRadiusMeters: Math.hypot(150, 5) + 2,
}, 100);
assert.equal(shapeAwareCount, 3, 'oriented rebuild must exclude off-axis chunks that only intersect the obsolete circle envelope');
assert.deepEqual(shapeEvents, ['unload:-1,-1', 'unload:0,0', 'unload:1,1', 'load:-1,-1', 'load:0,0', 'load:1,1']);
"""
          s = one(s, anchor, extra, 'regression'); p.write_text(s)
          PY
      - name: Validate before publication
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/terrainFoundationConformer.js
          node --check scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkStructureGroundingPolicy.mjs
          node scripts/checkStructureSurfacePolicy.mjs
          node scripts/checkSettlementFoundationAuthority.mjs
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkTerrainFoundationBatchRemoval.mjs
          node scripts/checkFoundationRenderPhysicsParity.mjs
      - name: Publish exact validated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AAPW automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/3d/world/terrainFoundationConformer.js scripts/checkTerrainFoundationConformer.mjs
          git diff --cached --check
          git commit -m 'perf(world): rebuild only foundation-intersecting chunks'
          git push origin HEAD:codex/foundation-grounding-20260821
