name: Terrain Foundation Conformer

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainFoundationConformer.js'
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - 'scripts/checkDisconnectedFoundationIslands.mjs'
      - '.github/scripts/patchFoundationIslands.py'
      - '.github/workflows/terrain-foundation-conformer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation-islands-publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply disconnected foundation islands patch
        run: python .github/scripts/patchFoundationIslands.py
      - name: Validate patched foundation contracts
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/WorldAssetPlacementPipeline.js
          node --check src/3d/world/terrainFoundationConformer.js
          node --check scripts/checkDisconnectedFoundationIslands.mjs
          node scripts/checkGroundContactFootprintFiltering.mjs
          node scripts/checkDisconnectedFoundationIslands.mjs
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkFoundationRenderPhysicsParity.mjs
          node scripts/checkExtendedStructureFoundationConform.mjs
      - name: Restore validation-only workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          git show db02145e9d6d49302c58d392515630853274fdd2:.github/workflows/terrain-foundation-conformer.yml > .github/workflows/terrain-foundation-conformer.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/terrain-foundation-conformer.yml')
          text = path.read_text()
          text = text.replace(
              "      - 'scripts/checkGroundContactFootprintFiltering.mjs'\n      - 'scripts/setupNodeThreeShim.mjs'",
              "      - 'scripts/checkGroundContactFootprintFiltering.mjs'\n      - 'scripts/checkDisconnectedFoundationIslands.mjs'\n      - 'scripts/setupNodeThreeShim.mjs'",
              1,
          )
          text = text.replace(
              "          node --check scripts/checkGroundContactFootprintFiltering.mjs\n      - name: Shared structure footprint",
              "          node --check scripts/checkGroundContactFootprintFiltering.mjs\n          node --check scripts/checkDisconnectedFoundationIslands.mjs\n      - name: Shared structure footprint",
              1,
          )
          text = text.replace(
              "          node scripts/checkGroundContactFootprintFiltering.mjs\n",
              "          node scripts/checkGroundContactFootprintFiltering.mjs\n          node scripts/checkDisconnectedFoundationIslands.mjs\n",
              1,
          )
          path.write_text(text)
          PY
          git rm -- .github/scripts/patchFoundationIslands.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/3d/world/WorldAssetPlacementPipeline.js src/3d/world/terrainFoundationConformer.js scripts/checkDisconnectedFoundationIslands.mjs .github/workflows/terrain-foundation-conformer.yml
          git diff --cached --stat
          git commit -m 'feat(world): preserve disconnected foundation islands'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
