name: Run 331 Checkpoint Continuity

on:
  push:
    branches:
      - governance/run331-checkpoint-continuity-20260813
  pull_request:
    branches:
      - main
    paths:
      - '3D_GAME_PROGRESS.md'
      - 'STABLE_TAGS.md'
      - 'perf_log.csv'
      - '.github/workflows/run331-checkpoint-continuity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run331-checkpoint-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact current main
        id: base
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(3D_GAME_PROGRESS\.md|STABLE_TAGS\.md|perf_log\.csv|\.github/workflows/run331-checkpoint-continuity\.yml)$' | wc -l)" -eq 0
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect materialized Run331 records
        id: records
        run: |
          set -euo pipefail
          if grep -Eq '^## Run 331\b' 3D_GAME_PROGRESS.md \
            && grep -Eiq 'stable-.*Run 331\b' STABLE_TAGS.md \
            && grep -Eq '(^|,)run331-checkpoint-continuity(,|$)' perf_log.csv; then
            echo 'existing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'existing=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real Run331 performance sample
        if: steps.records.outputs.existing != 'true'
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/collectPerfSnapshot.js run331-checkpoint-continuity | tee "$RUNNER_TEMP/run331-perf.log"
          grep -F '[collectPerfSnapshot] sampled:' "$RUNNER_TEMP/run331-perf.log"
          PERF_ROW="$(grep -E '(^|,)run331-checkpoint-continuity(,|$)' perf_log.csv | tail -n 1)"
          test -n "$PERF_ROW"
          printf '%s\n' "$PERF_ROW" > "$RUNNER_TEMP/run331-perf-row.txt"

      - name: Materialize measured continuity records
        if: steps.records.outputs.existing != 'true'
        run: |
          set -euo pipefail
          PERF_ROW="$(cat "$RUNNER_TEMP/run331-perf-row.txt")"
          cat >> 3D_GAME_PROGRESS.md <<EOF

          ## Run 331 (2026-08-13) — checkpoint continuity repair

          - Completed governance-only continuity repair for the inherited checkpoint watermark mismatch: progress had advanced to Run 330 while the stable record remained Run 328 and the performance record remained Run 329.
          - Runtime/product source delta: **0**. This run changes continuity records and its dedicated validation workflow only; it does not alter gameplay, terrain, editor, assets, rendering, PWA runtime, or world data.
          - Real Chromium performance sample recorded by the same exact-head workflow: \`${PERF_ROW}\`.
          - Baseline validation on this exact candidate includes seeded determinism, world-reference contract, service-worker cache, mobile render budget, full Chromium 2D/3D smoke, checkpoint consistency, and final exact-main freshness.
          - Stable checkpoint identifier: \`stable-2026-08-13-run331\`. The workflow creates the local tag after validation and attempts the remote tag push as best effort under GOVERNANCE §8.11's known tag-push constraint.
          - Root cause/prevention: later completed runs must not advance \`3D_GAME_PROGRESS.md\` without a matching measured/explicit performance continuity record and stable checkpoint record; \`scripts/checkCheckpointConsistency.js\` remains the executable guard.
          EOF
          cat >> STABLE_TAGS.md <<'EOF'
          - stable-2026-08-13-run331 — Run 331 — measured checkpoint-continuity repair; runtime/product source delta 0; dedicated exact-head workflow revalidates full browser/mobile/PWA safety before publication.
          EOF
          node scripts/checkCheckpointConsistency.js

      - name: Mandatory checkpoint consistency
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js

      - name: Baseline safety
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.base.outputs.base_sha }}"
          test "$(git merge-base HEAD origin/main)" = "${{ steps.base.outputs.base_sha }}"

      - name: Publish measured Run331 records
        if: steps.records.outputs.existing != 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'Run331 Checkpoint Recorder'
          git config user.email 'actions@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md STABLE_TAGS.md perf_log.csv
          git commit -m 'governance: record measured run331 checkpoint continuity'
          git tag -f stable-2026-08-13-run331
          git push origin HEAD:refs/heads/governance/run331-checkpoint-continuity-20260813
          git push origin refs/tags/stable-2026-08-13-run331 || echo '[run331] remote tag push unavailable; GOVERNANCE §8.11 allows the documented checkpoint record.'
