name: Run 331 Checkpoint Continuity

on:
  push:
    branches:
      - governance/run331-checkpoint-continuity-20260813
  pull_request:
    branches:
      - main
    paths:
      - '3D_GAME_PROGRESS.md'
      - 'STABLE_TAGS.md'
      - 'perf_log.csv'
      - '.github/workflows/run331-checkpoint-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact current main
        id: base
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Real run331 performance sample
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/collectPerfSnapshot.js run331-checkpoint-continuity | tee "$RUNNER_TEMP/run331-perf.log"
          grep -F '[collectPerfSnapshot] sampled:' "$RUNNER_TEMP/run331-perf.log"
      - name: Baseline safety
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js
      - name: Checkpoint consistency after records exist
        if: ${{ hashFiles('STABLE_TAGS.md') != '' }}
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js || {
            echo '[run331] continuity records are not materialized yet; measurement-only push.'
            test ! -s "$RUNNER_TEMP/run331-records-materialized"
          }
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.base.outputs.base_sha }}"
