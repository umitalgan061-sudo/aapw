name: Run 222 Editor Clipboard History Finalize

on:
  push:
    branches:
      - agent/run222-editor-clipboard-history-main-sync
    paths:
      - '.github/workflows/run222-editor-clipboard-history-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run222-editor-clipboard-history-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun222EditorClipboardHistory.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run222 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 222 — World Editor clipboard/history regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies Copy -> Paste creates a second marker-tree object while preserving the copied asset identity.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Paste receives a deterministic generated `-paste-####` editor id and a positive snapped X offset; Undo removes only the pasted object and creates one redo entry.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Ctrl+Shift+Z restores the exact pasted object and consumes redo history; browser console/page errors remain zero.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, deterministic world-reference/hydrology, terrain/road safety, technical-debt audit, full browser smoke, and final remote-main/additive-only gates PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: Run222 current-main workflow `31420348658` PASS. Next safe step: continue additive-only World Editor usability/regression coverage without crossing unresolved owner gates.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run222,2026-08-10,editor-clipboard-history' perf_log.csv; then
            printf 'run222,%s,editor-clipboard-history,,,,,,,"test-only copy/paste undo/redo regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run222 editor clipboard/history regression' STABLE_TAGS.md; then
            printf '%s — Run222 editor clipboard/history regression; deterministic paste identity/offset, undo/redo round-trip, PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run222 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run222): record editor clipboard-history checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run222-editor-clipboard-history-main-sync
          git push origin "$STABLE_TAG" || true
