name: Run 225 Editor Sub-0.01 Scale History V2 Exact Head

on:
  push:
    branches:
      - agent/run225-editor-sub001-scale-history-v2
    paths:
      - '.github/workflows/run225-editor-sub001-scale-history-v2-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run225-editor-sub001-scale-history-v2-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun225EditorSub001ScaleHistoryV2.js
          git diff --check
      - name: Verify Run225 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 225 — World Editor sub-0.01 scale/history regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run225,2026-08-10,editor-sub001-scale-history' perf_log.csv
          grep -Fq 'Run225 editor sub-0.01 scale/history regression' STABLE_TAGS.md
          grep -Fq '31424690149' 3D_GAME_PROGRESS.md
          grep -Fq '31424689829' 3D_GAME_PROGRESS.md
          grep -Fq '31424355194' 3D_GAME_PROGRESS.md
