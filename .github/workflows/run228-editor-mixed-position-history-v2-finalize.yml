name: Run 228 Editor Mixed Position History V2 Finalize

on:
  push:
    branches:
      - agent/run228-editor-mixed-position-history-v2
    paths:
      - '.github/workflows/run228-editor-mixed-position-history-v2-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run228-editor-mixed-position-history-v2-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun228EditorMixedPositionHistory.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run228 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 228 — World Editor mixed-sign position/history regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies mixed-sign decimal Inspector position values (`X=-12.375`, `Y=1.25`, `Z=8.625`) with snap disabled, without changing runtime/product source.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The position edit preserves editor object identity, rotation, and scale; Undo restores the exact original scene object and Redo restores the exact mixed-sign position state.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- History restore selection semantics remain explicit: selection is cleared, the restored hierarchy item is re-selected, and Inspector X/Y/Z values are verified after re-selection.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- V1 workflow `31428810647` proved focused Chromium regression, PWA/cache, mobile performance/determinism/world safety, and full browser smoke; its final concurrency gate correctly rejected publication after concurrent Run226 advanced main.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- V2 was rebuilt additively on Run226 main and workflow `31429382554` PASS, including start/final remote-main gates, additive-only guard, visual evidence upload, PWA/cache, mobile/perf/determinism/world safety and full browser smoke.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- World Event Determinism Guard `31429382607` PASS. Runtime/product source delta: 0 lines changed. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: continue additive-only World Editor transform/history usability coverage without crossing unresolved owner gates and after rechecking concurrent main.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run228,2026-08-10,editor-mixed-position-history' perf_log.csv; then
            printf 'run228,%s,editor-mixed-position-history,,,,,,,"test-only mixed-sign decimal position/undo/redo/reselect regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run228 editor mixed-sign position/history regression' STABLE_TAGS.md; then
            printf '%s — Run228 editor mixed-sign position/history regression; decimal X/Y/Z position survives undo/redo and Inspector re-selection; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run228 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git commit -m 'docs(run228): record mixed-position history checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run228-editor-mixed-position-history-v2
          git push origin "$STABLE_TAG" || true
