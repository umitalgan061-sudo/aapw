name: Run 235 Periodic Platform Control Clean

on:
  push:
    branches:
      - agent/run235-periodic-platform-control-clean
    paths:
      - '.github/workflows/run235-periodic-platform-control-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run235-periodic-platform-control-clean-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting exact-main additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Verify periodic platform gates
        run: |
          set -euo pipefail
          if [ -f package.json ]; then npm audit --audit-level=high; else echo 'npm audit N/A: package.json is absent.'; fi
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js
      - name: Pre-record concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append Run235 records
        run: |
          set -euo pipefail
          printf '\n%s\n%s\n' '### Run235 platform-control superseding note (2026-08-11)' 'The latest periodic platform control is now **run 235 (2026-08-11)**, superseding the historical run199 maintenance note without deleting it. `package.json` remains absent, so `npm audit` remains N/A. PWA installability and service-worker cache completeness PASS; mobile Chromium render sampling remains inside budget at 35 draw calls / 195929 triangles / 30 geometries / 22 textures; seeded-random, canonical world-reference/water/alignment/hydrology, 14/14 terrain-seat safety and the 14-seat road network all PASS; performance-trend analysis reports no sustained heap drift; technical-debt guard and full 2D-offline + 3D-WebGL browser smoke PASS. The initial Run235 proof exposed only a missing Playwright prerequisite in the verification harness; the clean publication includes the corrected harness only. The next periodic platform-control window is approximately **run 255-265**, unless a phase completion or material platform change justifies an earlier check.' >> GOVERNANCE.md
          printf '\n%s\n' '- **Run 235 (2026-08-11, periodic platform control refresh):** §15/run199 maintenance state was due for refresh. Corrected clean verification installs Playwright/Chromium and PASSes mobile render budget (35 draw calls / 195929 triangles / 30 geometries / 22 textures), seeded/world-reference/hydrology, 14/14 terrain-seat, road-network, perf-trend, technical-debt, full 2D-offline/3D-WebGL smoke, console and final remote-main/additive gates. Runtime/product source delta remains 0. Next platform-control window ~run255-265.' >> RULES_CHANGELOG.md
          printf '\n%s\n' '## Run 235 — Periodic platform control refresh' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Governance §15/run199 periodic platform state was due for its 20-30 run refresh; this task intentionally changes no runtime/product source.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- RCA: an earlier proof workflow omitted the Playwright prerequisite before `checkMobilePerfBudget.js`; this was a verification-harness issue only. The clean publication contains only the corrected workflow and leaves the rejected proof branch unmerged.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Corrected verification and independent World Event Determinism Guard PASS. `package.json` remains absent, therefore npm audit is N/A.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- PWA cache/installability PASS. Mobile Chromium sample: 35 draw calls, 195929 triangles, 30 geometries, 22 textures; measurable draw-call/triangle budgets PASS.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Seed policy and canonical reference map/water/alignment/hydrology PASS; terrain-seat safety remains 14/14 and the 13-edge/14-seat road network remains connected at 20.24 km.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Perf trend through run234 reports jsHeapUsedMB first-half 316.0 MB vs second-half 337.2 MB (1.07x), no sustained upward drift. Technical-debt guard PASS with 0 newly-added debt markers and 0 forbidden temporary-solution additions.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Full browser smoke PASS: 2D offline/no-CDN resilience preserved and 3D reaches GAME_READY with zero 3D console/page errors. Runtime/product source delta: 0. Technical debt introduced: 0. Risk: LOW. ADR not required.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Next safe step: re-read current main and concurrent Run232/Run233 state; if their editor surfaces are settled, continue the missing/unknown-asset scene-load regression, otherwise select an independent additive-only task.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' 'run235,2026-08-11,periodic-platform-control,,35,195929,30,22,,"periodic platform control; PWA/cache, mobile budget, determinism/world, terrain/road, perf trend, debt and full browser smoke PASS; runtime/product delta 0"' >> perf_log.csv
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          printf '%s — Run235 periodic platform control; PWA/cache, mobile 35 draw calls/195929 triangles, determinism/world safety, perf trend/debt and full browser smoke verified; runtime delta 0.\n' "$TAG" >> STABLE_TAGS.md
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit clean checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GOVERNANCE.md RULES_CHANGELOG.md 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run235): record clean periodic platform checkpoint'
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check "$CURRENT_MAIN" HEAD
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run235-periodic-platform-control-clean
          git push origin "$STABLE_TAG" || true
