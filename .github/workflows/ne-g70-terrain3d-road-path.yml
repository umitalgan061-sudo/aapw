name: NE G70 Terrain3D Road Path
on:
  push: { branches: ['terrain/ne-g70-terrain3d-road-path-r*-exact-20260814'] }
  pull_request:
    branches: [main]
    paths:
      - godot/terrain-authoring/geocells/ne/g70_road_path.mjs
      - godot/terrain-authoring/scripts/validate_g70_terrain3d_road_path.gd
      - scripts/checkNEG70RoadPath.mjs
      - scripts/checkNEG70RoadPathEnvelope.mjs
      - scripts/checkNEG70RoadPathControlPreflight.mjs
      - scripts/checkNEG70RoadPathVisualEvidence.mjs
      - scripts/checkNEG70RoadPathEvidenceBundle.mjs
      - godot/terrain-authoring/corner_claims/NE.json
      - .github/workflows/ne-g70-terrain3d-road-path.yml
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'ne-g70-road-path-${{ github.head_ref || github.ref_name }}', cancel-in-progress: true }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main nine-file scope and quota
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"; echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(\.github/workflows/ne-g70-terrain3d-road-path.yml|godot/terrain-authoring/corner_claims/NE.json|godot/terrain-authoring/geocells/ne/g70_road_path.mjs|godot/terrain-authoring/scripts/validate_g70_terrain3d_road_path.gd|scripts/checkNEG70RoadPath.mjs|scripts/checkNEG70RoadPathEnvelope.mjs|scripts/checkNEG70RoadPathControlPreflight.mjs|scripts/checkNEG70RoadPathVisualEvidence.mjs|scripts/checkNEG70RoadPathEvidenceBundle.mjs)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 9
          A="$(git diff --numstat origin/main...HEAD|awk '{s+=$1}END{print s+0}')"; D="$(git diff --numstat origin/main...HEAD|awk '{s+=$2}END{print s+0}')"
          echo "ROAD_PATH_CHANGED_LINES=$((A+D))"; test $((A+D)) -le 1000
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py addons/zylann.hterrain src/3d/world/terrain.js src/3d/world/roads.js src/3d/world/worldReferenceTerrainAdapter.js
      - name: Install Playwright for real runtime road proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"; npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Prior layers runtime road exclusion envelope and filtered preflight
        run: |
          set -euo pipefail
          node scripts/checkNEG70Terrain3DHydrology.mjs; node scripts/checkNEG70Terrain3DBiome.mjs; node scripts/checkNEG70Relief.mjs; node scripts/checkNEG70RockSnow.mjs
          node scripts/checkNEG60Hydrology.mjs; node scripts/checkNEG71Hydrology.mjs
          for f in godot/terrain-authoring/geocells/ne/g70_road_path.mjs scripts/checkNEG70RoadPath.mjs scripts/checkNEG70RoadPathEnvelope.mjs scripts/checkNEG70RoadPathControlPreflight.mjs scripts/checkNEG70RoadPathVisualEvidence.mjs scripts/checkNEG70RoadPathEvidenceBundle.mjs; do node --check "$f"; done
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNEG70RoadPath.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g70-road-path-probe.json | tee /tmp/road.log
          grep -F NE_G70_ROAD_PATH_VALIDATION_OK /tmp/road.log
          node scripts/checkNEG70RoadPathEnvelope.mjs | tee /tmp/envelope.log; grep -F NE_G70_ROAD_PATH_ENVELOPE_OK /tmp/envelope.log
          node scripts/checkNEG70RoadPathControlPreflight.mjs | tee /tmp/preflight.log; grep -F NE_G70_ROAD_PATH_CONTROL_PREFLIGHT_OK /tmp/preflight.log
      - name: Install pinned Terrain3D and Godot 4.6.3
        run: |
          set -euo pipefail
          ok=0; for n in 1 2 3; do if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee /tmp/t3d-$n.log; then grep -F TERRAIN3D_INSTALL_OK /tmp/t3d-$n.log; ok=1; break; fi; sleep $((n*3)); done; test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | grep -F TERRAIN3D_VERIFY_OK
          mkdir -p "$RUNNER_TEMP/g"; curl -fL --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/g.zip"; unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP/g"
          G="$(find "$RUNNER_TEMP/g" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$G"; chmod +x "$G"; "$G" --version | grep -F 4.6.3; echo "GODOT_BIN=$G" >> "$GITHUB_ENV"
      - name: Double real Terrain3D Height Control seam persistence and LOD0
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G70_ROAD_PATH_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g70_terrain3d_road_path.gd | tee /tmp/a.log
          cp godot/terrain-authoring/.terrain3d-proof/g70-road-path-bake.json /tmp/a-bake.json; cp godot/terrain-authoring/.terrain3d-proof/g70-road-path-imported-topdown.png /tmp/a.png
          G70_ROAD_PATH_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g70_terrain3d_road_path.gd | tee /tmp/b.log
          cp godot/terrain-authoring/.terrain3d-proof/g70-road-path-bake.json /tmp/b-bake.json; cp godot/terrain-authoring/.terrain3d-proof/g70-road-path-imported-topdown.png /tmp/b.png
          grep -F NE_G70_TERRAIN3D_ROAD_PATH_VALIDATION_OK /tmp/a.log; grep -F NE_G70_TERRAIN3D_ROAD_PATH_VALIDATION_OK /tmp/b.log
          jq -S 'del(.savedRegionBytes)' /tmp/a-bake.json >/tmp/as.json; jq -S 'del(.savedRegionBytes)' /tmp/b-bake.json >/tmp/bs.json; cmp /tmp/as.json /tmp/bs.json; cmp /tmp/a.png /tmp/b.png
          jq -e '.regionCount>=4 and .alignedSamples==4225 and .savedRegionFiles>=4 and .bakedVertices>0 and .maxActualBlend<=0.000001 and .maxSeamBlend<=0.000001' /tmp/b-bake.json
      - name: Visual evidence bundle and repository regressions
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNEG70RoadPathVisualEvidence.mjs --out-dir=artifacts/ne-g70-road-path-visual | tee /tmp/visual.log; grep -F NE_G70_ROAD_PATH_VISUAL_EVIDENCE_OK /tmp/visual.log
          node scripts/checkNEG70RoadPathEvidenceBundle.mjs | tee /tmp/bundle.log; grep -F NE_G70_ROAD_PATH_EVIDENCE_BUNDLE_OK /tmp/bundle.log
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee /tmp/ht.log; grep -F HTERRAIN_AUTHORING_VALIDATION_OK /tmp/ht.log
          node scripts/checkSeededRandomPolicy.js; node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js; node scripts/checkServiceWorkerCache.js; node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main; MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"; git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ne-g70-terrain3d-road-path-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g70-road-path-probe.json
            godot/terrain-authoring/.terrain3d-proof/g70-road-path-bake.json
            godot/terrain-authoring/.terrain3d-proof/g70-road-path-imported-topdown.png
            artifacts/ne-g70-road-path-visual/
