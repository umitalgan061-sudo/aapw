name: Kizil Ufuk Player Combat Animation Transition

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatAnimationTransition.js'
      - 'scripts/checkPlayerCombatAnimationTransition.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-animation-transition.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-head and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              src/3d/gameplay/playerCombatAnimationTransition.js|scripts/checkPlayerCombatAnimationTransition.mjs|.github/workflows/kizil-ufuk-player-combat-animation-transition.yml) ;;
              *) echo "unexpected path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          additions="$(git diff --numstat "${{ github.event.pull_request.base.sha }}" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$additions" -le 3000
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatAnimationTransition.js && node --check scripts/checkPlayerCombatAnimationTransition.mjs
      - name: Deterministic executable contract
        run: node scripts/checkPlayerCombatAnimationTransition.mjs
      - name: Repeat for determinism
        run: |
          first="$(node scripts/checkPlayerCombatAnimationTransition.mjs)"
          second="$(node scripts/checkPlayerCombatAnimationTransition.mjs)"
          test "$first" = "$second"
