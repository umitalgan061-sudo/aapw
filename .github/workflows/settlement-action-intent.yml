name: settlement-action-intent
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementActionIntentBridge.js'
      - 'scripts/checkSettlementActionIntentBridge.mjs'
      - '.github/workflows/settlement-action-intent.yml'
  push:
    paths:
      - 'src/3d/gameplay/settlementActionIntentBridge.js'
      - 'scripts/checkSettlementActionIntentBridge.mjs'
      - '.github/workflows/settlement-action-intent.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/settlementActionIntentBridge.js
      - run: node scripts/checkSettlementActionIntentBridge.mjs
