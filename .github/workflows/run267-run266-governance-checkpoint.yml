name: Run 267 Run266 Governance Checkpoint

on:
  push:
    branches:
      - agent/run267-run266-governance-checkpoint
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run267-run266-governance-checkpoint-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 0fb89b19c5e0ca4afef33ea4faf73985dc56fb17
  TZ: Europe/Istanbul

jobs:
  validate-and-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting concurrency and additive-only gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE_SHA" "$CURRENT_MAIN"
          SAFE_PATHS=(game3d.html index.html service-worker.js giriş.png scripts/checkRun266EntryGate.js scripts/smokeTestGame3D.js scripts/checkPwaInstallability.js scripts/checkServiceWorkerCache.js)
          git diff --quiet "$BASE_SHA" "$CURRENT_MAIN" -- "${SAFE_PATHS[@]}"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and focused Run266 visual behavior proof
        run: |
          set -euo pipefail
          node --check scripts/checkRun266EntryGate.js
          node scripts/checkRun266EntryGate.js
      - name: PWA cache installability performance determinism and world safety
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Full Chromium smoke and console gate
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run267-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run267-smoke.log")" -ge 34
      - name: Upload Run266 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run267-run266-entry-gate-evidence
          path: artifacts/run266-entry-gate
          if-no-files-found: error
          retention-days: 14
      - name: Final concurrency and additive-only gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE_SHA" "$CURRENT_MAIN"
          SAFE_PATHS=(game3d.html index.html service-worker.js giriş.png scripts/checkRun266EntryGate.js scripts/smokeTestGame3D.js scripts/checkPwaInstallability.js scripts/checkServiceWorkerCache.js)
          git diff --quiet "$BASE_SHA" "$CURRENT_MAIN" -- "${SAFE_PATHS[@]}"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check
      - name: Append verified governance checkpoint records
        run: |
          set -euo pipefail
          MARKER='## Run 267 — close Run266 governance checkpoint gap'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Revalidated the merged Run266 2D→3D entry gate without changing runtime behavior: owner giriş.png full-screen gate, deterministic evasive red back control on desktop/mobile, and fixed green enter action remain intact.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Focused real Chromium proof regenerated desktop/mobile visual evidence with zero gate-page console/page errors; full browser smoke, PWA/cache/installability, mobile performance, seeded determinism, world-reference/hydrology, terrain/road safety, perf-trend and technical-debt gates all passed before checkpoint write.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Memory-leak review: checkpoint adds no runtime listeners/timers/DOM/geometry/material ownership; Run266 gate disposal behavior is regression-tested by the focused browser proof.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Risk LOW; runtime/product delta for Run267 is 0. Next safe step must be selected only after refreshing remote main/open PRs and owner gates.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run267,2026-08-11,run266-governance-checkpoint' perf_log.csv; then
            printf '%s\n' 'run267,2026-08-11,run266-governance-checkpoint,,,,,,,"Run266 entry-gate checkpoint; runtime delta 0; focused visual proof + full mandatory chain PASS"' >> perf_log.csv
          fi
          TAG="stable-$(date +%Y-%m-%d-%H%M)"
          if ! grep -Fq 'Run267 Run266 governance checkpoint' STABLE_TAGS.md; then
            printf '\n- `%s` — Run267 Run266 governance checkpoint; desktop/mobile entry-gate visual proof, PWA/perf/determinism/world-safety/full smoke and console-zero PASS.\n' "$TAG" >> STABLE_TAGS.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          if git diff --cached --quiet; then
            echo 'Checkpoint records already present on final head.'
            exit 0
          fi
          git commit -m 'docs(run267): record Run266 governance checkpoint'
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE_SHA" "$CURRENT_MAIN"
          SAFE_PATHS=(game3d.html index.html service-worker.js giriş.png scripts/checkRun266EntryGate.js scripts/smokeTestGame3D.js scripts/checkPwaInstallability.js scripts/checkServiceWorkerCache.js)
          git diff --quiet "$BASE_SHA" "$CURRENT_MAIN" -- "${SAFE_PATHS[@]}"
          git push origin HEAD:agent/run267-run266-governance-checkpoint
          git tag "$TAG" || true
          git push origin "$TAG" || echo 'Known stable-tag push restriction retained per governance.'
