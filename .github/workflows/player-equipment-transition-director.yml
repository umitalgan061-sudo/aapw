name: Player Equipment Transition Director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentTransitionDirector.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'src/3d/gameplay/playerEquipmentCombatProfile.ts'
      - 'scripts/checkPlayerEquipmentTransitionDirector.mjs'
      - 'scripts/testPlayerEquipmentTransitionDirector.mjs'
      - 'scripts/checkPlayerEquipmentTransitionDirectorBoundary.mjs'
      - 'scripts/checkPlayerEquipmentTransitionDirectorNoOpSemantics.mjs'
      - '.github/workflows/player-equipment-transition-director.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install
      - run: node scripts/checkPlayerEquipmentTransitionDirector.mjs
      - run: node --experimental-strip-types scripts/testPlayerEquipmentTransitionDirector.mjs
      - run: node --experimental-strip-types scripts/checkPlayerEquipmentTransitionDirectorBoundary.mjs
      - run: node --experimental-strip-types scripts/checkPlayerEquipmentTransitionDirectorNoOpSemantics.mjs
      - run: npx tsc --noEmit --ignoreConfig --allowImportingTsExtensions --allowJs false --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/3d/gameplay/playerEquipmentTransitionDirector.ts
