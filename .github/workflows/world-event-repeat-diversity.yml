name: World Event Repeat Diversity

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/worldEvents.js'
      - 'scripts/checkWorldEventRepeatDiversity.mjs'
      - 'scripts/checkWorldEventDeterminism.js'
      - 'scripts/fixtures/world-events-seed-148.json'
      - '.github/workflows/world-event-repeat-diversity.yml'
      - '.github/workflows/world-event-resume-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-diversity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact-main scope and budget
        shell: bash
        run: |
          git fetch origin main --no-tags
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          allowed='^(src/3d/gameplay/worldEvents\.js|scripts/checkWorldEventRepeatDiversity\.mjs|\.github/workflows/world-event-repeat-diversity\.yml|\.github/workflows/world-event-resume-budget\.yml)$'
          for file in "${files[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected file: $file"; exit 1; }
          done
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 1000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/worldEvents.js
          node --check scripts/checkWorldEventRepeatDiversity.mjs
      - name: Deterministic repeat diversity
        run: node scripts/checkWorldEventRepeatDiversity.mjs
      - name: Canonical world-event determinism
        run: node scripts/checkWorldEventDeterminism.js
      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
