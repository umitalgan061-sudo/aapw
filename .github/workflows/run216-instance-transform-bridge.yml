name: Run216 Instance Transform Bridge

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorInstanceTransformBridge.js'
      - 'scripts/checkEditorInstanceTransformBridge.js'
      - '.github/workflows/run216-instance-transform-bridge.yml'
  workflow_dispatch:

jobs:
  bridge-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/3d/editor/EditorInstanceTransformBridge.js
          node --check scripts/checkEditorInstanceTransformBridge.js
      - name: Instance TransformControls bridge lifecycle
        run: node scripts/checkEditorInstanceTransformBridge.js
      - name: Additive diff whitespace guard
        run: git diff --check origin/${{ github.base_ref }}...HEAD
