name: Terrain Surface Anti-Tiling
on:
  pull_request:
    paths:
      - 'src/3d/world/terrainSurfaceAntiTiling.js'
      - 'scripts/checkTerrainSurfaceAntiTiling.mjs'
      - '.github/workflows/terrain-surface-anti-tiling.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/world/terrainSurfaceAntiTiling.js && node --check scripts/checkTerrainSurfaceAntiTiling.mjs
      - name: Deterministic anti-tiling contract
        run: node scripts/checkTerrainSurfaceAntiTiling.mjs
