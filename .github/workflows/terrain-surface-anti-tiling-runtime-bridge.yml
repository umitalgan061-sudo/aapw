name: Terrain Surface Anti-Tiling Runtime Bridge

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainSurfaceAntiTiling.js'
      - 'src/3d/world/terrainSurfaceAntiTilingRuntimeBridge.js'
      - 'scripts/checkTerrainSurfaceAntiTilingRuntimeBridge.mjs'
      - '.github/workflows/terrain-surface-anti-tiling-runtime-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - name: Syntax
        run: |
          node --check src/3d/world/terrainSurfaceAntiTiling.js
          node --check src/3d/world/terrainSurfaceAntiTilingRuntimeBridge.js
          node --check scripts/checkTerrainSurfaceAntiTilingRuntimeBridge.mjs
      - name: Runtime bridge contract
        run: node scripts/checkTerrainSurfaceAntiTilingRuntimeBridge.mjs
      - name: Diff budget
        shell: bash
        run: |
          changed=$(git diff --numstat origin/main...HEAD | awk '{ add += $1; del += $2 } END { print add + del }')
          test "${changed:-0}" -le 3000
          git diff --check origin/main...HEAD
