name: settlement-dialogue-consequence-preview
on:
  push:
    branches: ["agent/gunbatimi-settlement-dialogue-consequence-preview-20260909"]
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementDialogueConsequencePreview.js'
      - 'scripts/checkSettlementDialogueConsequencePreview.mjs'
      - '.github/workflows/settlement-dialogue-consequence-preview.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/settlementDialogueConsequencePreview.js
      - run: node scripts/checkSettlementDialogueConsequencePreview.mjs
      - name: Enforce additive focused scope
        shell: bash
        run: |
          changed=$(git diff --numstat origin/main...HEAD | awk '{add+=$1; del+=$2} END {print add+del+0}')
          test "$changed" -le 3000
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          ! printf '%s\n' "$files" | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline'
