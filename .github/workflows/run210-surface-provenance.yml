name: Run 210 Surface Provenance

on:
  push:
    branches: [agent/run210-owner-surface-texture-final]

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: aa4a2d7eba352c77de811b51e5c521f02ea1174e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Current-main and surface-stability gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$BASE_SHA" ]; then
            git diff --quiet "$BASE_SHA" "$CURRENT_MAIN" -- 'assets/textures/yüzey' || exit 1
          fi
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'Run 208 — RTS destination-command visual feedback' 3D_GAME_PROGRESS.md
          grep -F 'ADR-0227' DECISIONS.md
          grep -F 'run 145' QUESTIONS_FOR_OWNER.md
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
      - name: Install metadata dependency outside project manifest
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Read embedded provenance metadata
        run: python scripts/inspectRun210SurfaceProvenance.py
      - name: Upload provenance report
        uses: actions/upload-artifact@v4
        with:
          name: run210-surface-provenance
          path: artifacts/run210-surface-provenance
          if-no-files-found: error
