name: Run 317 Terrain3D Height Field Pipeline

on:
  pull_request:
    paths:
      - 'godot/terrain-authoring/scripts/import_westeros_heightfield.gd'
      - 'godot/terrain-authoring/scripts/validate_terrain3d_authoring.gd'
      - 'godot/terrain-authoring/scripts/render_terrain3d_preview.gd'
      - 'godot/terrain-authoring/terrain3d.lock.json'
      - 'scripts/exportWesterosHeightField.js'
      - 'src/3d/world/terrain.js'
      - 'src/3d/world/settlements.js'
      - 'src/3d/config.js'
      - '.github/workflows/run317-terrain3d-heightfield.yml'
  push:
    branches:
      - 'terrain3d/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run317-terrain3d-heightfield-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul
  GODOT_VERSION: 4.6.3

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Terrain3D via the locked installer
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py
          test -f godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          test -f godot/terrain-authoring/addons/terrain_3d/LICENSE.txt
          test -f godot/terrain-authoring/addons/terrain_3d/bin/libterrain.linux.debug.x86_64.so

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Hydrate scoped shipped-world LFS assets
        run: |
          set -euo pipefail
          # The exporter boots real game3d. Hydrate only families requested by shipped createScene;
          # never feed an LFS pointer to GLTF/FBX loaders and then misdiagnose it as asset corruption.
          git lfs version
          git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**" --exclude=""

      - name: Export the live Westeros height field
        run: |
          set -uo pipefail
          node --check scripts/exportWesterosHeightField.js
          mkdir -p artifacts/run317-terrain3d
          EXPORT_LOG="artifacts/run317-terrain3d/heightfield-export.log"
          set +e
          node scripts/exportWesterosHeightField.js 2>&1 | tee "$EXPORT_LOG"
          STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$STATUS" -ne 0 ]; then
            tail -n 16 "$EXPORT_LOG" | while IFS= read -r line; do
              echo "::error title=Run317 height exporter::$line"
            done
            exit "$STATUS"
          fi
          test -f godot/terrain-authoring/source_data/westeros_height_r32.bin
          test -f godot/terrain-authoring/source_data/westeros_height_r32.json

      - name: Download official Godot editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-$GODOT_VERSION.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-$GODOT_VERSION"
          mkdir -p "$GODOT_DIR"
          curl -sSL --fail \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=$GODOT_VERSION" \
            --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name "Godot_v$GODOT_VERSION-stable_linux.x86_64" -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project assets
        run: |
          set -euo pipefail
          timeout 900s "$GODOT_BIN" --headless --path godot/terrain-authoring --import

      - name: Import the height field into Terrain3D regions
        run: |
          set -uo pipefail
          mkdir -p artifacts/run317-terrain3d
          IMPORT_LOG="artifacts/run317-terrain3d/terrain3d-region-import.log"
          set +e
          timeout 900s "$GODOT_BIN" --headless --path godot/terrain-authoring \
            --script res://scripts/import_westeros_heightfield.gd 2>&1 | tee "$IMPORT_LOG"
          STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$STATUS" -ne 0 ]; then
            tail -n 24 "$IMPORT_LOG" | while IFS= read -r line; do
              echo "::error title=Run317 Terrain3D region import::$line"
            done
            exit "$STATUS"
          fi
          test "$(find godot/terrain-authoring/terrain3d_data -name '*.res' | wc -l)" -eq 36

      - name: Validate authored terrain against the live JS sampler
        run: |
          set -euo pipefail
          timeout 900s "$GODOT_BIN" --headless --path godot/terrain-authoring \
            --script res://scripts/validate_terrain3d_authoring.gd

      - name: Render visual proof
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          command -v xvfb-run
          timeout 900s xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path godot/terrain-authoring \
            --display-driver x11 --rendering-method gl_compatibility --rendering-driver opengl3 \
            --script res://scripts/render_terrain3d_preview.gd
          test -f artifacts/run317-terrain3d/terrain3d-ground-view.png
          test -f artifacts/run317-terrain3d/terrain3d-mountain-view.png

      - name: HTerrain regression — the sibling backend must stay untouched
        run: |
          set -euo pipefail
          test -f godot/terrain-authoring/addons/zylann.hterrain/plugin.cfg
          test -z "$(git status --porcelain godot/terrain-authoring/terrain_data/)"

      - name: Confirm the shipped web game is untouched by this pipeline
        run: |
          set -euo pipefail
          ! grep -rn "terrain3d_data\|addons/terrain_3d" service-worker.js game3d.html index.html
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/smokeTestGame3D.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run317-terrain3d-preview
          path: artifacts/run317-terrain3d/
          if-no-files-found: warn
