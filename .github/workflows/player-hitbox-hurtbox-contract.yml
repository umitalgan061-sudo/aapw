name: player-hitbox-hurtbox-contract
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerHitboxHurtboxContract.js'
      - 'scripts/checkPlayerHitboxHurtboxContract.mjs'
      - '.github/workflows/player-hitbox-hurtbox-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/playerHitboxHurtboxContract.js
      - run: node --check scripts/checkPlayerHitboxHurtboxContract.mjs
      - run: node scripts/checkPlayerHitboxHurtboxContract.mjs
      - run: node scripts/checkPlayerHitboxHurtboxContract.mjs > /tmp/player-hitbox-hurtbox-contract.txt
      - run: test "$(cat /tmp/player-hitbox-hurtbox-contract.txt)" = 'player hitbox/hurtbox contract: PASS'
      - run: |
          if grep -R "EditorMaterialStudio\\|from ['\"]three['\"]" src/3d/gameplay/playerHitboxHurtboxContract.js; then exit 1; fi
