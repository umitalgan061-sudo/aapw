name: NW G11 Terrain3D Runtime Parity R5

on:
  push:
    branches: [ 'terrain/nw-g11-runtime-parity-20260813-r5' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/3d/world/worldReferenceTerrainAdapter.js'
      - 'scripts/checkNWG11Terrain3DRuntimeParity.mjs'
      - 'godot/terrain-authoring/scripts/validate_g11_terrain3d_runtime_parity.gd'
      - 'godot/terrain-authoring/corner_claims/NW.json'
      - '.github/workflows/nw-g11-terrain3d-runtime-parity-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: bf0d791eaa3618044779aa520df17787e8ba801d

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/worldReferenceTerrainAdapter.js|scripts/checkNWG11Terrain3DRuntimeParity.mjs|godot/terrain-authoring/scripts/validate_g11_terrain3d_runtime_parity.gd|godot/terrain-authoring/corner_claims/NW.json|\.github/workflows/nw-g11-terrain3d-runtime-parity-r5.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Capture exact Three.js G11 source twice
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceTerrainAdapter.js
          node --check scripts/checkNWG11Terrain3DRuntimeParity.mjs
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG11Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g11-runtime-source.json "$RUNNER_TEMP/source-a.json"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG11Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-b.log"
          cmp "$RUNNER_TEMP/source-a.json" godot/terrain-authoring/.terrain3d-proof/g11-runtime-source.json
          cmp "$RUNNER_TEMP/source-a.log" "$RUNNER_TEMP/source-b.log"
          grep -F 'NW_G11_PARITY_SOURCE_OK' "$RUNNER_TEMP/source-a.log"
      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Initialize Godot plugins
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          cp "$RUNNER_TEMP/source-a.json" godot/terrain-authoring/.terrain3d-proof/g11-runtime-source.json
      - name: Real Terrain3D guard import roundtrip persist LOD0 bake twice
        run: |
          set -euo pipefail
          G11_PARITY_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g11_terrain3d_runtime_parity.gd | tee "$RUNNER_TEMP/t3d-a.log"
          grep -F 'NW_G11_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/t3d-a.log"
          test -s godot/terrain-authoring/.terrain3d-proof/g11-runtime-bake.json
          cp godot/terrain-authoring/.terrain3d-proof/g11-runtime-bake.json "$RUNNER_TEMP/bake-a.json"
          G11_PARITY_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g11_terrain3d_runtime_parity.gd | tee "$RUNNER_TEMP/t3d-b.log"
          grep -F 'NW_G11_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/t3d-b.log"
          cmp "$RUNNER_TEMP/bake-a.json" godot/terrain-authoring/.terrain3d-proof/g11-runtime-bake.json
      - name: Verify Terrain3D bake in Three.js runtime adapter
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG11Terrain3DRuntimeParity.mjs --verify | tee "$RUNNER_TEMP/parity.log"
          grep -F 'NW_G11_TERRAIN3D_RUNTIME_PARITY_OK' "$RUNNER_TEMP/parity.log"
      - name: HTerrain and world safety regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK'
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nw-g11-terrain3d-runtime-parity-r5-proof
          path: |
            godot/terrain-authoring/.terrain3d-proof/g11-runtime-*.json
            godot/terrain-authoring/.terrain3d-proof/g11-runtime-*.png
          include-hidden-files: true
          if-no-files-found: warn
