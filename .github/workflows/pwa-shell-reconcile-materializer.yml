name: PWA Shell Reconcile Materializer

on:
  push:
    branches:
      - codex/pwa-game3d-shell-reconcile-20260902
    paths:
      - '.pwa-shell-reconcile'

permissions:
  contents: write

concurrency:
  group: pwa-shell-reconcile-materializer-${{ github.ref }}
  cancel-in-progress: false

env:
  RUN_BRANCH: codex/pwa-game3d-shell-reconcile-20260902
  STACK_BASE: 94ba8b73447bbec8e06bd41b0f160e26c9a4e90d
  EXPECTED_MAIN: 4986a578dc657d01442ce12834ba6b67fc23232e

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact stacked-base preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$RUN_BRANCH"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$STACK_BASE" HEAD
          git diff --check "$STACK_BASE" HEAD

      - name: Reconcile current 3D offline shell
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'service-worker.js';
          let source = fs.readFileSync(file, 'utf8');
          const marker = '// Run 2026-09-02 current 3D shell completeness reconciliation.';
          if (source.includes(marker)) throw new Error('PWA reconciliation marker already present');
          const anchor = '// Run346: first audio in the game';
          if (!source.includes(anchor)) throw new Error('Run346 service-worker anchor missing');
          const entries = [
            './src/3d/celestialLightState.js',
            './src/3d/editor/EditorTerrainFoundationGrounder.js',
            './src/3d/world/foundationIslandProbes.js',
            './src/3d/world/geographicReferencePalette.js',
            './src/3d/world/iceLandmarkGeometryBreakup.js',
            './src/3d/world/iceLandmarkRealism.js',
            './src/3d/world/iceLandmarks.js',
            './src/3d/world/naturalGeology.js',
            './src/3d/world/naturalGeologyPlacement.js',
            './src/3d/world/northGroundCoverClimate.js',
            './src/3d/world/northReferenceCryosphere.js',
            './src/3d/world/roadSurfaceProfile.js',
            './src/3d/world/structureGroundingPolicy.js',
            './src/3d/world/terrainFoundationConformer.js',
            './src/3d/world/terrainMacroWeathering.js',
            './src/3d/world/terrainSnowSurfaceTone.js',
            './src/3d/world/terrainWindSnowExposure.js',
            './src/3d/world/valyriaCastleWeathering.js',
            './src/3d/world/valyriaEcology.js',
            './src/3d/world/valyriaGeology.js',
            './src/3d/world/westernMarineShelfTone.js',
            './src/3d/world/westernReferenceSurfaceFabric.js',
            './src/3d/world/windGrass.js',
            './src/3d/world/winterVegetationAsset.js',
            './assets/models/Ay/Moon 2K.fbx',
            './assets/models/Ay/Moon%202K.fbx',
            './assets/models/fbx/dirt_road_test.glb',
            './assets/models/fbx/road_terrain.glb',
            './assets/models/fbx/rocky_terrain_low_poly.glb',
            './assets/models/fbx/rugged_mountain_landscape.glb',
            './assets/models/fbx/desert_rocks.glb',
            './assets/models/fbx/terrain_01.fbx',
            './assets/models/fbx/snow_terrain_low_poly.glb',
            './assets/models/fbx/sNOWlaNDSCAPE.glb',
            './assets/models/vegetation/winter_tree.glb',
            './assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb',
            './assets/models/vegetation/pine_Zt62gceKXZ.glb',
          ];
          const block = `${marker}\n// Preserve the standing all-src/3d + referenced-model contract instead of weakening the gate.\n// Both Moon spellings are retained because shipped code references both; install canonicalizes URLs before addAll.\n${entries.map((entry) => `GAME3D_SHELL_FILES.push('${entry}');`).join('\n')}\n\n`;
          source = source.replace(anchor, block + anchor);
          const cacheOld = "const SHELL_CACHE = 'westeros-shell-v20';";
          if (!source.includes(cacheOld)) throw new Error('Expected shell cache v20 anchor missing');
          source = source.replace(cacheOld, "// Current 3D shell reconciliation refreshes existing offline installs.\nconst SHELL_CACHE = 'westeros-shell-v21';");
          const addAllOld = '.then(cache => cache.addAll(GAME3D_SHELL_FILES))';
          if (!source.includes(addAllOld)) throw new Error('Expected GAME3D addAll anchor missing');
          source = source.replace(addAllOld, '.then(cache => cache.addAll([...new Map(GAME3D_SHELL_FILES.map(file => [new URL(file, self.location.href).href, file])).values()]))');
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check service-worker.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSharedMaterialPlacementContract.js
          git diff --check

      - name: Publish reconciled service worker and retire one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git add service-worker.js
          git rm .github/workflows/pwa-shell-reconcile-materializer.yml .pwa-shell-reconcile
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/pwa-shell-reconcile-materializer.yml\n.pwa-shell-reconcile\nservice-worker.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pwa): reconcile current 3d offline shell'
          git push origin "HEAD:$RUN_BRANCH"
