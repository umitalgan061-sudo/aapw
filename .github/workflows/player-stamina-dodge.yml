name: Player Stamina Sprint Dodge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/**'
      - 'src/3d/input.js'
      - 'src/3d/gameLoopHelpers.js'
      - 'src/3d/ui/**'
      - 'scripts/checkPlayer*.mjs'
      - 'scripts/checkPlayer*.js'
      - 'scripts/checkKizilUfuk*.mjs'
      - 'tests/modern/**'
      - '.github/workflows/player-*.yml'
      - '.github/workflows/kizil-ufuk-*.yml'
      - '.github/tsconfig.kizil-ufuk-player-config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-stamina-dodge-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$CHANGED"
          OUT_OF_SCOPE="$(printf '%s\n' "$CHANGED" | grep -Ev '^(src/3d/gameplay/|src/3d/input\.js$|src/3d/gameLoopHelpers\.js$|src/3d/ui/|scripts/checkPlayer[^/]+\.(mjs|js)$|scripts/checkKizilUfuk[^/]+\.mjs$|tests/modern/|\.github/workflows/player-[^/]+\.yml$|\.github/workflows/kizil-ufuk-[^/]+\.yml$|\.github/tsconfig\.kizil-ufuk-player-config\.json$|docs/PRODUCTION_RUNTIME_V7\.md$)' || true)"
          test -z "$OUT_OF_SCOPE"
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          TOTAL=$((ADD + DEL))
          echo "base=$BASE additions=$ADD deletions=$DEL total=$TOTAL"
          test "$TOTAL" -le 3000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Static contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/playerCombatRuntimeFrameGuard.js
          node --check src/3d/gameplay/playerLocomotionStateSynthesis.js
          node --check src/3d/gameplay/playerLocomotionTransitionWindows.js
          node --check scripts/checkPlayerStaminaDodge.mjs
          node --check scripts/checkPlayerGamepadInput.mjs
          node --check scripts/checkPlayerLocomotionStateSynthesisScenarioMatrix.mjs
          node scripts/checkPlayerStaminaDodge.mjs
          node scripts/checkPlayerGamepadInput.mjs
          node scripts/checkPlayerLocomotionStateSynthesisScenarioMatrix.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -R -q 'EditorMaterialStudio' src/3d/gameplay src/3d/input.js src/3d/gameLoopHelpers.js
      - name: Asset-first targeted hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include='assets/models/characters/**,assets/animations/**' --exclude=''
      - name: Final main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
