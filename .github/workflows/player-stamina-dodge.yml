name: Player Stamina Sprint Dodge

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/player.js'
      - 'src/3d/ui/healthBar.js'
      - 'scripts/checkPlayerStaminaDodge.mjs'
      - '.github/workflows/player-stamina-dodge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
          BASE="$(git merge-base origin/main HEAD)"
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          TOTAL=$((ADD + DEL))
          echo "base=$BASE additions=$ADD deletions=$DEL total=$TOTAL"
          test "$TOTAL" -le 1000

      - name: Static syntax
        run: |
          node --check src/3d/gameplay/player.js
          node --check src/3d/ui/healthBar.js
          node --check scripts/checkPlayerStaminaDodge.mjs

      - name: Player action regression contract
        run: node scripts/checkPlayerStaminaDodge.mjs

      - name: Shared material placement boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -q 'EditorMaterialStudio' src/3d/gameplay/player.js

      - name: Final main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
