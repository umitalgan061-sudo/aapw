name: Buzul Muhafızı terrain visual material adapter v16

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainVisualMaterialAdapter.js'
      - 'scripts/checkTerrainVisualMaterialAdapter.mjs'
      - '.github/workflows/buzul-muhafizi-terrain-visual-material-adapter-v16.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-terrain-visual-material-adapter-v16-20260908'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Enforce focused additive scope
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          printf '%s\n' "$files" | grep -Fx 'src/3d/world/terrainVisualMaterialAdapter.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkTerrainVisualMaterialAdapter.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/buzul-muhafizi-terrain-visual-material-adapter-v16.yml'
          test "$(printf '%s\n' "$files" | wc -l)" -eq 3
          additions=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$additions" -le 3000
      - name: Syntax
        run: node --check src/3d/world/terrainVisualMaterialAdapter.js && node --check scripts/checkTerrainVisualMaterialAdapter.mjs
      - name: Execute real adapter contract
        run: node scripts/checkTerrainVisualMaterialAdapter.mjs
      - name: Protect editor and shared placement boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline" src/3d/world/terrainVisualMaterialAdapter.js
          ! grep -nE "src/3d/world/(terrain|water|sceneManager|naturalGeology|rivers|roads)\.js" src/3d/world/terrainVisualMaterialAdapter.js
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
