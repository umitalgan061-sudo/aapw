name: Apply World Acceptance Texture Ready
on:
  push:
    branches: [agent/buzul-map-reference-geography-db49125]
    paths: ['scripts/applyWorldAcceptanceTextureReadyPatch.mjs','.github/workflows/apply-world-acceptance-texture-ready.yml']
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/buzul-map-reference-geography-db49125 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set -euo pipefail
          node scripts/applyWorldAcceptanceTextureReadyPatch.mjs
          node --check scripts/checkWorldEnvironmentAcceptanceMatrix.mjs
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/applyWorldAcceptanceTextureReadyPatch.mjs .github/workflows/apply-world-acceptance-texture-ready.yml
          git add scripts/checkWorldEnvironmentAcceptanceMatrix.mjs
          git commit -m 'fix(test): accept canvas-backed terrain albedo readiness'
          git push origin HEAD:agent/buzul-map-reference-geography-db49125
