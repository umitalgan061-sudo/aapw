name: Living World Runtime R11

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorld*.ts'
      - 'src/3d/modern/migrationLedgerLivingWorldR11.ts'
      - 'tests/modern/livingWorldRuntimeKernelR11.test.ts'
      - 'scripts/checkLivingWorldRuntimeR11.mjs'
      - 'package.json'
      - '.github/workflows/living-world-r11.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorld*.ts'
      - 'src/3d/modern/migrationLedgerLivingWorldR11.ts'
      - 'tests/modern/livingWorldRuntimeKernelR11.test.ts'
      - 'scripts/checkLivingWorldRuntimeR11.mjs'
      - 'package.json'
      - '.github/workflows/living-world-r11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-world-r11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Architecture gate
        run: npm run verify:living-world-r11
      - name: Focused deterministic tests
        run: npm run test:living-world-r11
      - name: Strict repository typecheck
        run: npm run typecheck
