name: Run 230 Editor Responsive Resize Layout Integrity

on:
  push:
    branches:
      - agent/run230-editor-responsive-resize
    paths:
      - 'scripts/checkRun230EditorResponsiveResizeLayoutIntegrity.js'
      - 'editor.css'
      - '.github/workflows/run230-editor-responsive-resize-layout-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run230-editor-responsive-resize-layout-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting remote-main and additive-only gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
          node --check scripts/checkRun230EditorResponsiveResizeLayoutIntegrity.js
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Strict fresh-mobile and desktop-to-mobile layout integrity
        run: node scripts/checkRun230EditorResponsiveResizeLayoutIntegrity.js
      - name: Upload RCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run230-editor-responsive-resize-layout-integrity
          path: artifacts/run230-editor-responsive-resize-layout-integrity
          if-no-files-found: warn
