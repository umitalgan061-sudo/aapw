name: player-combat-feedback-director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFeedbackDirector.js'
      - 'scripts/checkPlayerCombatFeedbackDirector.mjs'
      - '.github/workflows/player-combat-feedback-director.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/playerCombatFeedbackDirector.js
      - run: node --check scripts/checkPlayerCombatFeedbackDirector.mjs
      - run: node scripts/checkPlayerCombatFeedbackDirector.mjs
      - run: node scripts/checkPlayerCombatFeedbackDirector.mjs > /tmp/feedback-a.txt
      - run: node scripts/checkPlayerCombatFeedbackDirector.mjs > /tmp/feedback-b.txt
      - run: cmp /tmp/feedback-a.txt /tmp/feedback-b.txt
      - run: '! grep -nE "EditorMaterialStudio|from ['\"]three['\"]" src/3d/gameplay/playerCombatFeedbackDirector.js'
      - run: test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/playerCombatFeedbackDirector.js scripts/checkPlayerCombatFeedbackDirector.mjs .github/workflows/player-combat-feedback-director.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
