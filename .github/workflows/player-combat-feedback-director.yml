name: Player Combat Feedback Director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFeedbackDirector.js'
      - 'scripts/checkPlayerCombatFeedbackDirector.mjs'
      - '.github/workflows/player-combat-feedback-director.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/3d/gameplay/playerCombatFeedbackDirector.js
          node --check scripts/checkPlayerCombatFeedbackDirector.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatFeedbackDirector.mjs
      - name: Boundary guard
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" \
            src/3d/gameplay/playerCombatFeedbackDirector.js \
            scripts/checkPlayerCombatFeedbackDirector.mjs
      - name: Diff hygiene
        run: git diff --check
