name: Settlement Reward Preview

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementRewardPreview.ts'
      - 'scripts/checkSettlementRewardPreview.mjs'
      - '.github/workflows/settlement-reward-preview.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementRewardPreview.ts'
      - 'scripts/checkSettlementRewardPreview.mjs'
      - '.github/workflows/settlement-reward-preview.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/checkSettlementRewardPreview.mjs
      - run: node --check scripts/checkSettlementRewardPreview.mjs
      - run: node --check src/3d/gameplay/settlementRewardPreview.ts
