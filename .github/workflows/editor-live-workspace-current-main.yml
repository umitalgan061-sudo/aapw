name: Editor Canonical Live Workspace

on:
  push:
    branches:
      - 'feature/editor-consolidation-current-terrain-20260813'
  pull_request:
    branches:
      - main
    paths:
      - 'edit.html'
      - 'src/3d/editor/EditorLiveWorkspaceEntry.mjs'
      - 'src/3d/editor/EditorGamePreviewLauncher.js'
      - 'scripts/checkEditorLiveWorkspaceEntry.js'
      - '.github/workflows/editor-live-workspace-current-main.yml'

permissions:
  contents: read

concurrency:
  group: editor-canonical-live-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact current main and 1000-line bounded scope
        id: base
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(edit\.html|src/3d/editor/EditorLiveWorkspaceEntry\.mjs|src/3d/editor/EditorGamePreviewLauncher\.js|scripts/checkEditorLiveWorkspaceEntry\.js|\.github/workflows/editor-live-workspace-current-main\.yml)$' | wc -l)" -eq 0
          test "$(git diff --numstat "$BASE_SHA"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 1000
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Canonical editor workspace source contract
        run: |
          set -euo pipefail
          test ! -e edit.html
          node --check src/3d/editor/EditorLiveWorkspaceEntry.mjs
          node --check src/3d/editor/EditorGamePreviewLauncher.js
          node --check scripts/checkEditorLiveWorkspaceEntry.js
          node scripts/checkEditorLiveWorkspaceEntry.js
          grep -F "import('./EditorLiveWorkspaceEntry.mjs')" src/3d/editor/EditorGamePreviewLauncher.js
          grep -F 'CANLI OYUN' src/3d/editor/EditorLiveWorkspaceEntry.mjs
          grep -F 'DÜZENLEME' src/3d/editor/EditorLiveWorkspaceEntry.mjs
          grep -F 'YAN YANA' src/3d/editor/EditorLiveWorkspaceEntry.mjs
          grep -F 'Koda Kaydet' src/3d/editor/EditorLiveWorkspaceEntry.mjs
          grep -F 'host?.contentWindow || window' src/3d/editor/EditorLiveWorkspaceEntry.mjs
          grep -F 'host?.contentDocument || document' src/3d/editor/EditorLiveWorkspaceEntry.mjs

      - name: Install Playwright outside project manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real Chromium canonical editor proof
        run: node scripts/checkEditorLiveWorkspaceEntry.js --browser

      - name: Existing editor and PWA safety gates
        run: |
          set -euo pipefail
          node scripts/checkRun216EditorGamePreviewContract.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkMobilePerfBudget.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Full browser smoke
        run: node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.base.outputs.base_sha }}"
          test "$(git merge-base HEAD origin/main)" = "${{ steps.base.outputs.base_sha }}"
