name: Settlement Quest Objective Planner

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementQuestObjectivePlanner.js'
      - 'scripts/checkSettlementQuestObjectivePlanner.mjs'
      - '.github/workflows/settlement-quest-objective-planner.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementQuestObjectivePlanner.js'
      - 'scripts/checkSettlementQuestObjectivePlanner.mjs'
      - '.github/workflows/settlement-quest-objective-planner.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/3d/gameplay/settlementQuestObjectivePlanner.js
          node --check scripts/checkSettlementQuestObjectivePlanner.mjs
      - name: Focused regression
        run: node scripts/checkSettlementQuestObjectivePlanner.mjs
      - name: Runtime boundary
        run: |
          ! grep -nE "EditorMaterialStudio|document\\.|window\\.|new SettlementManager|new QuestSystem|Math\\.random" src/3d/gameplay/settlementQuestObjectivePlanner.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
