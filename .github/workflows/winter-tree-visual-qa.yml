name: Winter Tree Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/vegetation/winter_tree.glb'
      - 'assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb'
      - 'src/3d/world/winterVegetationAsset.js'
      - 'scripts/firebaseDeployLfsReadiness.mjs'
      - 'scripts/checkWinterTreeVisualQa.js'
      - 'scripts/devServerHelper.js'
      - 'winter-tree-visual-qa.html'
      - '.github/workflows/winter-tree-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pointer state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax
        run: node --check scripts/checkWinterTreeVisualQa.js

      - name: Hydrate verified winter assets
        run: |
          node scripts/firebaseDeployLfsReadiness.mjs \
            --hydrate \
            --scope=winter \
            --manifest=artifacts/winter-tree-visual-qa/lfs-readiness.json

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          ln -s "$RUNNER_TEMP/pw/node_modules" "$GITHUB_WORKSPACE/node_modules"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Render hydrated winter tree
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWinterTreeVisualQa.js

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-tree-visual-qa
          path: artifacts/winter-tree-visual-qa/
          if-no-files-found: error
          retention-days: 7
