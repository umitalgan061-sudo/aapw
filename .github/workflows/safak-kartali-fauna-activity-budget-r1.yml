name: Safak Kartali fauna activity budget R1
on:
  push:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaActivityBudget.js'
      - 'scripts/checkSafakKartaliFaunaActivityBudgetR1.mjs'
      - 'scripts/runSafakKartaliFaunaActivityBudgetR1.mjs'
      - 'artifacts/safak-kartali-fauna-activity-budget-r1/**'
      - 'src/3d/gameplay/FAUNA_ACTIVITY_BUDGET_R1.md'
      - '.github/workflows/safak-kartali-fauna-activity-budget-r1.yml'
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaActivityBudget.js'
      - 'scripts/checkSafakKartaliFaunaActivityBudgetR1.mjs'
      - 'scripts/runSafakKartaliFaunaActivityBudgetR1.mjs'
      - 'artifacts/safak-kartali-fauna-activity-budget-r1/**'
      - 'src/3d/gameplay/FAUNA_ACTIVITY_BUDGET_R1.md'
      - '.github/workflows/safak-kartali-fauna-activity-budget-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check changed-line scope
        run: |
          count=$(git diff --numstat HEAD^ HEAD -- src/3d/gameplay/livingWorldFaunaActivityBudget.js scripts/checkSafakKartaliFaunaActivityBudgetR1.mjs scripts/runSafakKartaliFaunaActivityBudgetR1.mjs artifacts/safak-kartali-fauna-activity-budget-r1 src/3d/gameplay/FAUNA_ACTIVITY_BUDGET_R1.md .github/workflows/safak-kartali-fauna-activity-budget-r1.yml | awk '{add+=$1; del+=$2} END {print add+del}')
          test "${count:-0}" -gt 4000
      - name: Syntax check
        run: node --check src/3d/gameplay/livingWorldFaunaActivityBudget.js && node --check scripts/checkSafakKartaliFaunaActivityBudgetR1.mjs && node --check scripts/runSafakKartaliFaunaActivityBudgetR1.mjs
      - name: Execute contract
        run: node scripts/runSafakKartaliFaunaActivityBudgetR1.mjs
