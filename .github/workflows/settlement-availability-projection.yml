name: settlement availability projection

on:
  pull_request:
    paths:
      - 'src/3d/modern/settlementServiceAvailabilityProjection.ts'
      - 'scripts/checkSettlementServiceAvailabilityProjection.mjs'
      - '.github/workflows/settlement-availability-projection.yml'
  push:
    branches:
      - main

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/checkSettlementServiceAvailabilityProjection.mjs
      - run: node --experimental-strip-types --check src/3d/modern/settlementServiceAvailabilityProjection.ts
