name: Player Combat Frame
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerCombatFrame.js'
      - 'scripts/checkPlayerCombatFrame.mjs'
      - '.github/workflows/player-combat-frame.yml'
  push:
    branches: [codex/kizil-ufuk-combat-frame-20260908]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact main and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git diff --numstat "$base...HEAD" | awk '{a+=$1;d+=$2} END{print a+d+0}')" -le 3000
          test "$(git diff --name-only "$base...HEAD" | sort | tr '\n' ' ')" = ".github/workflows/player-combat-frame.yml scripts/checkPlayerCombatFrame.mjs src/3d/gameplay/playerCombatFrame.js "
          git diff --check "$base...HEAD"
      - name: Syntax and executable contract
        run: |
          node --check src/3d/gameplay/playerCombatFrame.js
          node --check scripts/checkPlayerCombatFrame.mjs
          node scripts/checkPlayerCombatFrame.mjs
      - name: Runtime boundary
        run: |
          ! grep -n "EditorMaterialStudio" src/3d/gameplay/playerCombatFrame.js
          ! grep -n "MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/playerCombatFrame.js
      - name: Final freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$base")" = "$base"
