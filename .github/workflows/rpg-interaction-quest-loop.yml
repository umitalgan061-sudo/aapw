name: RPG Interaction Quest Loop

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'src/3d/gameplay/interactionFieldReadiness.js'
      - 'scripts/checkInteractionQuestLoop.mjs'
      - 'scripts/checkInteractionInventoryRewards.mjs'
      - 'scripts/checkInteractionQuartermasterTrade.mjs'
      - 'scripts/checkInteractionTradeLedgerAtomicity.mjs'
      - 'scripts/checkInteractionTradeLedgerBrowser.mjs'
      - 'scripts/checkInteractionSettlementServiceContract.mjs'
      - 'scripts/checkInteractionSettlementServiceBrowser.mjs'
      - 'scripts/checkInteractionArmorerServiceBrowser.mjs'
      - 'scripts/checkInteractionProvisioningCraft.mjs'
      - 'scripts/checkInteractionProvisioningCraftBrowser.mjs'
      - 'scripts/checkInteractionExpeditionKitCraft.mjs'
      - 'scripts/checkInteractionExpeditionKitBrowser.mjs'
      - 'scripts/checkInteractionFieldReadiness.mjs'
      - 'scripts/checkInteractionFieldReadinessBrowser.mjs'
      - 'scripts/checkInteractionFastTravelBoundary.mjs'
      - 'scripts/checkInteractionRouteProvisions.mjs'
      - 'scripts/checkInteractionRouteProvisionsBrowser.mjs'
      - 'scripts/checkInteractionFastTravelConsumption.mjs'
      - 'scripts/checkInteractionRouteProvisionPersistence.mjs'
      - 'scripts/checkInteractionJourneyPlanning.mjs'
      - 'scripts/checkInteractionJourneyPlanningBrowser.mjs'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionBoardBrowser.mjs'
      - 'scripts/checkInteractionExpeditionTavernRecovery.mjs'
      - 'scripts/checkInteractionExpeditionMasterySmithingReward.mjs'
      - 'scripts/checkInteractionMasteryArmorerServiceBrowser.mjs'
      - 'service-worker.js'
      - '.github/workflows/rpg-expedition-board.yml'
      - '.github/workflows/rpg-journey-history-current.yml'
      - '.github/workflows/rpg-mastery-armorer-service.yml'
      - '.github/workflows/rpg-mastery-to-smithing.yml'
      - '.github/workflows/rpg-mastery-journal-continuity.yml'
      - '.github/workflows/rpg-interaction-quest-loop.yml'
  workflow_dispatch:

concurrency:
  group: rpg-interaction-quest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quest-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" HEAD)
          printf '%s\n' "${FILES[@]}"
          for path in "${FILES[@]}"; do
            case "$path" in
              src/3d/gameplay/interaction.js|src/3d/gameplay/interactionConfig.js|src/3d/gameplay/interactionEconomy.js|src/3d/gameplay/interactionFieldReadiness.js|scripts/checkInteractionQuestLoop.mjs|scripts/checkInteractionInventoryRewards.mjs|scripts/checkInteractionQuartermasterTrade.mjs|scripts/checkInteractionTradeLedgerAtomicity.mjs|scripts/checkInteractionTradeLedgerBrowser.mjs|scripts/checkInteractionSettlementServiceContract.mjs|scripts/checkInteractionSettlementServiceBrowser.mjs|scripts/checkInteractionArmorerServiceBrowser.mjs|scripts/checkInteractionProvisioningCraft.mjs|scripts/checkInteractionProvisioningCraftBrowser.mjs|scripts/checkInteractionExpeditionKitCraft.mjs|scripts/checkInteractionExpeditionKitBrowser.mjs|scripts/checkInteractionFieldReadiness.mjs|scripts/checkInteractionFieldReadinessBrowser.mjs|scripts/checkInteractionFastTravelBoundary.mjs|scripts/checkInteractionRouteProvisions.mjs|scripts/checkInteractionRouteProvisionsBrowser.mjs|scripts/checkInteractionFastTravelConsumption.mjs|scripts/checkInteractionRouteProvisionPersistence.mjs|scripts/checkInteractionJourneyPlanning.mjs|scripts/checkInteractionJourneyPlanningBrowser.mjs|scripts/checkInteractionExpeditionBoard.mjs|scripts/checkInteractionExpeditionBoardBrowser.mjs|scripts/checkInteractionExpeditionRewardProvenance.mjs|scripts/checkInteractionExpeditionRewardTradeContinuity.mjs|scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs|scripts/checkInteractionExpeditionTavernRecovery.mjs|scripts/checkInteractionExpeditionMasterySmithingReward.mjs|scripts/checkInteractionMasteryArmorerServiceBrowser.mjs|scripts/checkInteractionMasteryEconomyContinuity.mjs|scripts/checkInteractionMasteryToSmithingBrowser.mjs|scripts/checkInteractionSmithingServicePersistence.mjs|scripts/checkInteractionTavernReceiptIntegrity.mjs|service-worker.js|.github/workflows/rpg-expedition-credit-ledger.yml|.github/workflows/rpg-expedition-reward-provenance.yml|.github/workflows/rpg-expedition-tavern-recovery.yml|.github/workflows/rpg-interaction-quest-loop.yml|.github/workflows/rpg-journey-history-current.yml|.github/workflows/rpg-journey-ledger-ux.yml|.github/workflows/rpg-mastery-armorer-service.yml|.github/workflows/rpg-mastery-economy-continuity.yml|.github/workflows/rpg-mastery-journal-continuity.yml|.github/workflows/rpg-mastery-to-smithing.yml|.github/workflows/rpg-mastery-travel-continuity.yml|.github/workflows/rpg-smithing-service-persistence.yml|.github/workflows/rpg-tavern-receipt-integrity.yml|.github/workflows/run167-determinism-policy.yml|.github/workflows/run283-final-head-governance.yml) ;;
              *) echo "unexpected RPG scope path: $path" >&2; exit 1 ;;
            esac
          done
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 1000
          git diff --check "$BASE_SHA" HEAD
      - name: Syntax and deterministic quest lifecycle
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/interactionConfig.js
          node --check src/3d/gameplay/interactionEconomy.js
          node --check src/3d/gameplay/interactionFieldReadiness.js
          node --check src/3d/gameplay/interaction.js
          node --check scripts/checkInteractionQuestLoop.mjs
          node --check scripts/checkInteractionInventoryRewards.mjs
          node --check scripts/checkInteractionQuartermasterTrade.mjs
          node --check scripts/checkInteractionTradeLedgerAtomicity.mjs
          node --check scripts/checkInteractionTradeLedgerBrowser.mjs
          node --check scripts/checkInteractionSettlementServiceContract.mjs
          node --check scripts/checkInteractionSettlementServiceBrowser.mjs
          node --check scripts/checkInteractionArmorerServiceBrowser.mjs
          node --check scripts/checkInteractionProvisioningCraft.mjs
          node --check scripts/checkInteractionProvisioningCraftBrowser.mjs
          node --check scripts/checkInteractionExpeditionKitCraft.mjs
          node --check scripts/checkInteractionExpeditionKitBrowser.mjs
          node --check scripts/checkInteractionFieldReadiness.mjs
          node --check scripts/checkInteractionFieldReadinessBrowser.mjs
          node --check scripts/checkInteractionFastTravelBoundary.mjs
          node --check scripts/checkInteractionRouteProvisions.mjs
          node --check scripts/checkInteractionRouteProvisionsBrowser.mjs
          node --check scripts/checkInteractionFastTravelConsumption.mjs
          node --check scripts/checkInteractionRouteProvisionPersistence.mjs
          node --check scripts/checkInteractionJourneyPlanning.mjs
          node --check scripts/checkInteractionJourneyPlanningBrowser.mjs
          node --check scripts/checkInteractionExpeditionBoard.mjs
          node --check scripts/checkInteractionExpeditionBoardBrowser.mjs
          node --check scripts/checkInteractionExpeditionTavernRecovery.mjs
          node --check scripts/checkInteractionExpeditionMasterySmithingReward.mjs
          node --check scripts/checkInteractionMasteryArmorerServiceBrowser.mjs
          node scripts/checkInteractionQuestLoop.mjs
          node scripts/checkInteractionInventoryRewards.mjs
          node scripts/checkInteractionQuartermasterTrade.mjs
          node scripts/checkInteractionTradeLedgerAtomicity.mjs
          node scripts/checkInteractionSettlementServiceContract.mjs
          node scripts/checkInteractionProvisioningCraft.mjs
          node scripts/checkInteractionExpeditionKitCraft.mjs
          node scripts/checkInteractionFieldReadiness.mjs
          node scripts/checkInteractionFastTravelBoundary.mjs
          node scripts/checkInteractionRouteProvisions.mjs
          node scripts/checkInteractionFastTravelConsumption.mjs
          node scripts/checkInteractionRouteProvisionPersistence.mjs
          node scripts/checkInteractionJourneyPlanning.mjs
          node scripts/checkInteractionExpeditionBoard.mjs
          node scripts/checkInteractionExpeditionTavernRecovery.mjs
          node scripts/checkInteractionExpeditionMasterySmithingReward.mjs
      - name: Shared regression contracts
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSharedMaterialPlacementContract.js
      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped browser quartermaster and settlement services
        run: |
          set -euxo pipefail
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionTradeLedgerBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionSettlementServiceBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionArmorerServiceBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionProvisioningCraftBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionExpeditionKitBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionRouteProvisionsBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionJourneyPlanningBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionExpeditionBoardBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryArmorerServiceBrowser.mjs
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git diff --check "$BASE_SHA" HEAD
