name: kizil-ufuk-player-combat-frame-receipt
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFrameReceipt.ts'
      - 'scripts/checkPlayerCombatFrameReceipt.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-frame-receipt.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Exact PR ancestry
        run: test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: TypeScript syntax
        run: node --check src/3d/gameplay/playerCombatFrameReceipt.ts
      - name: Focused deterministic proof
        run: node --experimental-strip-types scripts/checkPlayerCombatFrameReceipt.mjs
