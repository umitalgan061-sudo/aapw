name: modern-nextgen-runtime

on:
  pull_request:
    paths:
      - 'src/3d/modern/nextgen/**'
      - 'tests/modern/nextgen/**'
      - 'scripts/checkNextGenRuntimeV2.mjs'
      - 'package.json'
      - 'tsconfig.modern-nextgen.json'
      - '.github/workflows/modern-nextgen-runtime.yml'
  push:
    branches:
      - main
      - agent/nextgen-evolution-r2-20260916
    paths:
      - 'src/3d/modern/nextgen/**'
      - 'tests/modern/nextgen/**'
      - 'scripts/checkNextGenRuntimeV2.mjs'
      - 'package.json'
      - 'tsconfig.modern-nextgen.json'
      - '.github/workflows/modern-nextgen-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-nextgen-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - name: Install production toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Structural NextGen V2 verification
        run: npm run verify:nextgen
      - name: Focused strict TypeScript verification
        run: npm run typecheck:nextgen-modern
      - name: Focused runtime tests
        run: npm run test:nextgen-modern
      - name: Determinism and unsafe-primitive guard
        run: |
          set -eu
          if grep -R -nE '\beval\s*\(|\bnew Function\s*\(|\bMath\.random\s*\(|\bDate\.now\s*\(' src/3d/modern/nextgen; then
            echo 'Unsafe or ambient nondeterminism found in modern NextGen runtime.'
            exit 1
          fi
