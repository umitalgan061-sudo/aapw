name: Player Combat Hitbox Policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatHitboxPolicy.js'
      - 'scripts/checkPlayerCombatHitboxPolicy.mjs'
      - '.github/workflows/player-combat-hitbox-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Diff cap
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Whitespace
        run: git diff --check origin/main...HEAD
      - name: Runtime boundary
        run: |
          ! grep -R "EditorMaterialStudio" -n src/3d/gameplay/playerCombatHitboxPolicy.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatHitboxPolicy.js
          node --check scripts/checkPlayerCombatHitboxPolicy.mjs
      - name: Focused contract
        run: node scripts/checkPlayerCombatHitboxPolicy.mjs
