name: Run 242 Editor Missing Metadata Defaults V3 Clean Exact Head

on:
  push:
    branches:
      - agent/run242-editor-missing-metadata-defaults-v3-clean
    paths:
      - '.github/workflows/run242-editor-missing-metadata-defaults-v3-clean-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run242-editor-missing-metadata-defaults-v3-clean-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun242EditorMissingMetadataDefaultsV3.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Verify Run242 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 242 — World Editor missing editor-metadata composed defaults regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run242,' perf_log.csv
          grep -Fq 'Run242 editor missing-metadata composed defaults regression' STABLE_TAGS.md
          grep -Fq '31446510611' 3D_GAME_PROGRESS.md
          grep -Fq '31446510555' 3D_GAME_PROGRESS.md
          test -s docs/run242-editor-missing-metadata-defaults-rca.md
