name: Run 180 Wind Grass Integration

on:
  push:
    branches: [agent/run180-wind-grass-integration]
    paths:
      - 'scripts/applyRun180Additions.js'
      - 'scripts/checkWindGrassSceneIntegrationRun180.js'
      - 'scripts/recordRun180Governance.js'
      - '.github/workflows/run180-wind-grass-integration.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      BASE_SHA: 3bba9d3a9bb54eab0ac47c8c4585e1c11de7a4be
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md && test -f 3D_GAME_PROGRESS.md && test -f DECISIONS.md && test -f QUESTIONS_FOR_OWNER.md
          git log -12 --oneline
          tail -n 240 GOVERNANCE.md
          tail -n 220 3D_GAME_PROGRESS.md
          tail -n 220 DECISIONS.md
          tail -n 140 QUESTIONS_FOR_OWNER.md

      - name: Baseline full browser smoke on main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run180-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run180-smoke-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run180-smoke-before.log")" -ge 34)
          git worktree remove "$BASELINE"

      - name: Apply additive first-frame grass hardening
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/applyRun180Additions.js
          node --check scripts/checkWindGrassSceneIntegrationRun180.js
          node --check scripts/recordRun180Governance.js
          node scripts/applyRun180Additions.js
          node --check src/3d/sceneManager.js
          git diff --check
          test "$(git diff --numstat -- src/3d/sceneManager.js | awk '{s += $2} END {print s + 0}')" -eq 0
          grep -F 'run180FirstFrameSafe' src/3d/sceneManager.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD

      - name: Isolated and real-scene grass contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWindGrassContract.js
          node scripts/checkWindGrassSceneIntegrationRun180.js | tee "$RUNNER_TEMP/run180-integration.log"
          SUMMARY="$(grep '^\[checkWindGrassSceneIntegrationRun180\] PASS:' "$RUNNER_TEMP/run180-integration.log" | tail -n1 | sed 's/^\[checkWindGrassSceneIntegrationRun180\] PASS: //')"
          test -n "$SUMMARY"
          echo "RUN180_INTEGRATION_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      - name: Governance deterministic PWA world gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/checkTerrainVisualContract.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js
          node scripts/checkWindGrassContract.js
          node scripts/checkWindGrassSceneIntegrationRun180.js

      - name: Accessibility input and physics regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkJumpArcContract.js
          node scripts/checkEventBusContract.js
          node scripts/checkHealthStateContract.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js

      - name: Mobile streaming LOD and real render budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run180-mobile-budget.log"
          SAMPLE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run180-mobile-budget.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$SAMPLE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$SAMPLE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$SAMPLE")"
          test "$DRAW" -eq 35
          test "$TRI" -eq 195929
          echo "RUN180_MOBILE_BUDGET_SUMMARY=live mobile F2 ${DRAW} draw calls / ${TRI} triangles; grass is +1 draw call / +24,000 triangles over the 34 / 171,929 pre-grass baseline." >> "$GITHUB_ENV"

      - name: Full browser smoke after change and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run180-smoke-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run180-smoke-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run180-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run180-smoke-after.log"; then exit 1; fi
          echo "RUN180_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"

      - name: Mobile near and F4 far visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js

      - name: Upload Run 180 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run180-wind-grass-integration-visual-evidence
          path: artifacts/run130-mobile/*.png
          if-no-files-found: error

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run180 | tee "$RUNNER_TEMP/run180-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run180-trend.log"
          PERF_ROW="$(grep '^\[collectPerfSnapshot\] sampled:' "$RUNNER_TEMP/run180-perf.log" | tail -n1 | sed 's/^\[collectPerfSnapshot\] sampled: //')"
          test -n "$PERF_ROW"
          test "$(printf '%s\n' "$PERF_ROW" | awk -F',' '{print NF}')" -eq 8
          echo "RUN180_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git checkout -- perf_log.csv

      - name: Senior self-review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- src/3d/sceneManager.js | awk '{s += $2} END {print s + 0}')" -eq 0
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/applyRun180Additions.js scripts/checkWindGrassSceneIntegrationRun180.js scripts/recordRun180Governance.js; then exit 1; fi
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWindGrassSceneIntegrationRun180.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Prepare Run 180 governance values
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN180_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN180_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Record Run 180 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun180Governance.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js

      - name: Final publish concurrency gate and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/3d/sceneManager.js 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "fix(world): guarantee first-frame wind grass recenter"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:agent/run180-wind-grass-integration

      - name: Push stable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RUN180_STABLE_TAG"
          git push origin "$RUN180_STABLE_TAG" || true
