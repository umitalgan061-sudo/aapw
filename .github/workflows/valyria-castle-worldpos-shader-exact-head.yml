name: Valyria Castle Worldpos Shader Exact Head

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/valyriaCastleWeathering.js'
      - 'scripts/checkValyriaCastleWeathering.mjs'
      - '.github/workflows/valyria-castle-worldpos-shader-exact-head.yml'

permissions:
  contents: read

jobs:
  valyria-castle-worldpos-shader:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          test -n "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              src/3d/world/valyriaCastleWeathering.js|scripts/checkValyriaCastleWeathering.mjs|.github/workflows/valyria-castle-worldpos-shader-exact-head.yml) ;;
              *) echo "unexpected path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          TOTAL="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$TOTAL" -le 1000
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Shader source and regression contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/valyriaCastleWeathering.js
          node --check scripts/checkValyriaCastleWeathering.mjs
          node scripts/checkValyriaCastleWeathering.mjs

      - name: Shared placement and determinism contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkSeededRandomPolicy.js

      - name: Run283 governance diagnostic parity
        id: run283_diag
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > "$RUNNER_TEMP/run283-governance-diagnostics.txt"
          status=0
          for script in \
            scripts/checkRun283FinalHeadGovernance.js \
            scripts/checkSeededRandomPolicy.js \
            scripts/checkAssetsManifest.js \
            scripts/checkServiceWorkerCache.js \
            scripts/checkPwaInstallability.js \
            scripts/checkSmokeCheckRegistry.js \
            scripts/checkWorldReferenceMap.js \
            scripts/checkWorldReferenceWaterMask.js \
            scripts/checkWorldReferenceAlignment.js \
            scripts/checkWorldReferenceHydrologyExtent.js
          do
            echo "===== $script =====" | tee -a "$RUNNER_TEMP/run283-governance-diagnostics.txt"
            node "$script" 2>&1 | tee -a "$RUNNER_TEMP/run283-governance-diagnostics.txt"
            rc=${PIPESTATUS[0]}
            echo "exit=$rc" | tee -a "$RUNNER_TEMP/run283-governance-diagnostics.txt"
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          echo "aggregate_exit=$status" | tee -a "$RUNNER_TEMP/run283-governance-diagnostics.txt"
          exit "$status"

      - name: Upload Run283 governance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valyria-worldpos-run283-governance-diagnostics
          path: ${{ runner.temp }}/run283-governance-diagnostics.txt
          if-no-files-found: error
          retention-days: 7

      - name: Final exact-main freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git diff --check "$BASE_SHA" HEAD
