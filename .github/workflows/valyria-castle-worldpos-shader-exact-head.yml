name: Valyria Castle Worldpos Shader Exact Head

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/valyriaCastleWeathering.js'
      - 'scripts/checkValyriaCastleWeathering.mjs'
      - 'scripts/checkValyriaCastleWeatheringBrowser.mjs'
      - '.github/workflows/valyria-castle-worldpos-shader-exact-head.yml'

permissions:
  contents: read

jobs:
  valyria-castle-worldpos-shader:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          test -n "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              src/3d/world/valyriaCastleWeathering.js|scripts/checkValyriaCastleWeathering.mjs|scripts/checkValyriaCastleWeatheringBrowser.mjs|.github/workflows/valyria-castle-worldpos-shader-exact-head.yml) ;;
              *) echo "unexpected path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          TOTAL="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$TOTAL" -le 1000
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Shader source and regression contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/valyriaCastleWeathering.js
          node --check scripts/checkValyriaCastleWeathering.mjs
          node --check scripts/checkValyriaCastleWeatheringBrowser.mjs
          node scripts/checkValyriaCastleWeathering.mjs

      - name: Shared placement and determinism contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkSeededRandomPolicy.js

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          # This repository intentionally has no root package.json/lockfile. Follow the established
          # exact-head browser lane used by the atmosphere workflow instead of npm ci, which cannot
          # succeed without a project manifest.
          npm install --no-save playwright three
          npx playwright install --with-deps chromium

      - name: Mobile Chromium Valyria shader compile proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkValyriaCastleWeatheringBrowser.mjs

      - name: Hydrate shipped mobile-runtime LFS families
        shell: bash
        run: |
          set -euo pipefail
          # checkMobilePerfBudget boots the shipped game3d scene, not the isolated Valyria fixture.
          # Match the established browser/mobile lanes so real model binaries are available instead
          # of letting Git-LFS pointer text trigger unrelated loader/placeholder failures.
          git lfs install --local
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/animations/peasant_girl/**" --exclude=""

      - name: Repository mobile performance safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/valyria-mobile-perf
          set +e
          node scripts/checkMobilePerfBudget.js 2>&1 | tee artifacts/valyria-mobile-perf/mobile-perf.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > artifacts/valyria-mobile-perf/exit-code.txt
          exit "$status"

      - name: Upload mobile performance RCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valyria-mobile-perf-${{ github.event.pull_request.head.sha }}
          path: artifacts/valyria-mobile-perf/
          if-no-files-found: error
          retention-days: 7

      - name: Final exact-main freshness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git diff --check "$BASE_SHA" HEAD
