name: Player Combat Feedback Presentation

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFeedbackPresentation.js'
      - 'scripts/checkPlayerCombatFeedbackPresentation.mjs'
      - '.github/workflows/player-combat-feedback-presentation.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry
        run: |
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatFeedbackPresentation.js
          node --check scripts/checkPlayerCombatFeedbackPresentation.mjs
      - name: Contract
        run: node scripts/checkPlayerCombatFeedbackPresentation.mjs
      - name: Diff cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Whitespace
        run: git diff --check origin/main...HEAD
