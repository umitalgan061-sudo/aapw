name: Player Combat Resolution Director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatResolutionDirector.js'
      - 'scripts/checkPlayerCombatResolutionDirector.mjs'
      - '.github/workflows/player-combat-resolution-director.yml'
  push:
    branches:
      - 'codex/kizil-ufuk-combat-resolution-director-20260907'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main freshness and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA=$(git rev-parse origin/main)
          test "$(git merge-base HEAD "$MAIN_SHA")" = "$MAIN_SHA"
          read -r ADD DEL < <(git diff --numstat "$MAIN_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test "$((ADD + DEL))" -le 3000
          git diff --check "$MAIN_SHA" HEAD
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatResolutionDirector.js && node --check scripts/checkPlayerCombatResolutionDirector.mjs
      - name: Shared Material Placement boundary
        shell: bash
        run: |
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -R "EditorMaterialStudio" -n src/3d/gameplay/playerCombatResolutionDirector.js
      - name: Combat resolution contract
        run: node scripts/checkPlayerCombatResolutionDirector.mjs
