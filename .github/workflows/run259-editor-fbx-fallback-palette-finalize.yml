name: Run 259 Editor FBX Fallback Palette Finalize

on:
  push:
    branches:
      - agent/run259-editor-fbx-fallback-palette
    paths:
      - '.github/workflows/run259-editor-fbx-fallback-palette-finalize.yml'
      - 'scripts/checkRun259EditorFallbackMaterialVisual.js'

permissions:
  contents: write

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun259EditorFallbackMaterialVisual.js
          git diff --check
      - name: Install Chromium validation dependency
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Two-angle visual evidence and console cleanliness
        run: node scripts/checkRun259EditorFallbackMaterialVisual.js
      - name: Upload Run259 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run259-editor-fallback-palette-visual-evidence
          path: artifacts/run259-editor-fallback-palette/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Full mandatory validation chain
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorFallbackMaterialPalette.js
          node --check src/3d/editor/EditorAssetManager.js
          node --check scripts/checkRun259EditorFallbackMaterialPalette.mjs
          node --check scripts/checkRun259EditorFallbackMaterialIntegration.mjs
          node scripts/checkRun259EditorFallbackMaterialPalette.mjs
          node scripts/checkRun259EditorFallbackMaterialIntegration.mjs
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js
      - name: Final remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run259 records
        run: |
          set -euo pipefail
          MARKER='## Run 259 — deterministic FBX fallback material palette'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Added an additive-only deterministic muted fallback palette for grayscale/untextured FBX materials in the World Editor; textured, vertex-colored and already-colored materials remain untouched.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Focused palette/integration tests, PWA cache/installability, mobile performance, determinism/world-safety, technical-debt audit and full browser smoke all pass on the exact PR head.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Visual DoD evidence: two Chromium camera angles generated by scripts/checkRun259EditorFallbackMaterialVisual.js; three fallback meshes receive deterministic differentiated colors and browser console/page errors remain zero.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Memory-leak review: fallback palette clones only materials it replaces; ownership remains with EditorAssetManager existing traversal/disposal lifecycle. No new listeners, timers or persistent DOM are added by runtime code.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Technical debt counter: checkTechnicalDebt PASS; no new TEMP/HACK/FIXME/WORKAROUND debt introduced.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: continue World Editor visual/readability improvements only after re-reading current main and open PRs; do not revive superseded Run257 work.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run259,2026-08-11,editor-fbx-fallback-palette' perf_log.csv; then
            printf '%s\n' 'run259,2026-08-11,editor-fbx-fallback-palette,,,,,,,"visual/material-only editor improvement; mobile perf budget PASS; full smoke PASS; console/page errors 0"' >> perf_log.csv
          fi
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          if ! grep -Fq 'Run259 deterministic FBX fallback palette' STABLE_TAGS.md; then
            printf '\n- `%s` — Run259 deterministic FBX fallback palette; full DoD + two-angle visual evidence PASS.\n' "$TAG" >> STABLE_TAGS.md
          fi
          git tag "$TAG" || true
          git push origin "$TAG" || echo 'Known tag-push restriction; local tag + STABLE_TAGS record retained per governance.'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          if git diff --cached --quiet; then
            echo 'Run259 records already present'
          else
            git commit -m 'docs(run259): record verified fallback palette checkpoint'
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
            git push origin HEAD:agent/run259-editor-fbx-fallback-palette
          fi
