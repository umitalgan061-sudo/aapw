name: Run 193 Canonical Scene Shadow Adapter

on:
  push:
    branches: [chatgpt/run193-canonical-scene-shadow-adapter]
    paths:
      - 'src/3d/world/worldReferenceSceneShadowAdapter.js'
      - 'scripts/checkCanonicalSceneShadowAdapter.js'
      - 'scripts/applyRun193PwaPrecacheAddition.js'
      - 'scripts/recordRun193CanonicalSceneShadowAdapter.js'
      - '.github/workflows/run193-canonical-scene-shadow-adapter.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: 8b67532cecc9934feff2c258b025827e429e81f7
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot additive PWA and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F '## Run 192 — Canonical road + stone-bridge scene integration shadow proof' 3D_GAME_PROGRESS.md
          grep -F '## ADR-0212 — Prove bridge-aware canonical road scene composition before any live full-reference switch (run 192)' DECISIONS.md
          if grep -q '^## Run 193 ' 3D_GAME_PROGRESS.md; then echo 'Run193 already occupied on main'; exit 1; fi
          if grep -q '^## ADR-0213 ' DECISIONS.md; then echo 'ADR-0213 already occupied on main'; exit 1; fi
          node --check src/3d/world/worldReferenceSceneShadowAdapter.js
          node --check scripts/checkCanonicalSceneShadowAdapter.js
          node --check scripts/applyRun193PwaPrecacheAddition.js
          node --check scripts/recordRun193CanonicalSceneShadowAdapter.js
          node scripts/applyRun193PwaPrecacheAddition.js
          grep -F "GAME3D_SHELL_FILES.push('./src/3d/world/worldReferenceSceneShadowAdapter.js');" service-worker.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"

      - name: Baseline full browser smoke on current main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run193-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run193-smoke-before.log")
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run193-smoke-before.log")" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run193-smoke-before.log" | grep -F 'zero console/page errors'
          git worktree remove "$BASELINE"

      - name: Prior canonical bridge rock and scene invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCanonicalRockPlacementShadow.js --verify-fixture
          node scripts/checkCanonicalRockGeometryShadow.js --verify-fixture
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture
          node scripts/checkCanonicalStoneBridgeTraversalReadiness.js
          node scripts/checkCanonicalRoadBridgeSceneShadow.js

      - name: Reusable bounded canonical scene window proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCanonicalSceneShadowAdapter.js | tee "$RUNNER_TEMP/run193-scene.log"
          BUDGET="$(grep '^\[checkCanonicalSceneShadowAdapter\] BUDGET:' "$RUNNER_TEMP/run193-scene.log" | tail -n1 | sed 's/^\[checkCanonicalSceneShadowAdapter\] BUDGET: //')"
          SUMMARY="$(grep '^\[checkCanonicalSceneShadowAdapter\] PASS:' "$RUNNER_TEMP/run193-scene.log" | tail -n1 | sed 's/^\[checkCanonicalSceneShadowAdapter\] PASS: //')"
          test -n "$BUDGET"
          test -n "$SUMMARY"
          echo "RUN193_BUDGET_JSON=$BUDGET" >> "$GITHUB_ENV"
          echo "RUN193_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          test -s artifacts/run193-canonical-scene-shadow-adapter/proof.json
          test -s artifacts/run193-canonical-scene-shadow-adapter/canonical-window-near.png
          test -s artifacts/run193-canonical-scene-shadow-adapter/canonical-window-far.png

      - name: Canonical world visual and lifecycle regression gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkFullReferenceMigrationDryRun.js
          node scripts/checkWorldReferenceMigrationDryRun.js
          node scripts/checkCanonicalHydrologyTerrainShadow.js
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkTerrainVisualContract.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js
          node scripts/checkWindGrassContractRun180.js
          node scripts/checkWindGrassSceneIntegrationRun180.js

      - name: Determinism PWA accessibility input and physics gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js
          node scripts/checkJumpArcContract.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Mobile streaming LOD and live budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run193-mobile.log"
          LIVE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run193-mobile.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$LIVE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$LIVE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$LIVE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000
          echo "RUN193_LIVE_MOBILE_JSON=$LIVE" >> "$GITHUB_ENV"

      - name: Full browser smoke and console gate after adapter
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run193-smoke-after.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run193-smoke-after.log")"
          test "$PASS_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run193-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run193-smoke-after.log"; then exit 1; fi
          echo "RUN193_SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run193 | tee "$RUNNER_TEMP/run193-perf.log"
          ROW="$(tail -n1 perf_log.csv)"
          echo "$ROW" | grep -F ',run193,'
          echo "RUN193_PERF_ROW=$ROW" >> "$GITHUB_ENV"
          node scripts/analyzePerfTrend.js
          git checkout -- perf_log.csv

      - name: Senior self review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' src/3d/world/worldReferenceSceneShadowAdapter.js scripts/checkCanonicalSceneShadowAdapter.js scripts/recordRun193CanonicalSceneShadowAdapter.js; then exit 1; fi
          node scripts/checkCanonicalSceneShadowAdapter.js > "$RUNNER_TEMP/run193-final.log"
          grep -F '[checkCanonicalSceneShadowAdapter] PASS:' "$RUNNER_TEMP/run193-final.log"
          node scripts/checkCanonicalStoneBridgeTraversalReadiness.js >/dev/null
          node scripts/checkServiceWorkerCache.js
          git diff --check "$BASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git show origin/main:3D_GAME_PROGRESS.md | grep -q '^## Run 193 '; then echo 'Run193 occupied before publish'; exit 1; fi
          if git show origin/main:DECISIONS.md | grep -q '^## ADR-0213 '; then echo 'ADR-0213 occupied before publish'; exit 1; fi

      - name: Upload Run 193 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run193-canonical-scene-shadow-adapter
          path: |
            artifacts/run193-canonical-scene-shadow-adapter/proof.json
            artifacts/run193-canonical-scene-shadow-adapter/canonical-window-near.png
            artifacts/run193-canonical-scene-shadow-adapter/canonical-window-far.png
          if-no-files-found: error

      - name: Record validated governance checkpoint on branch
        shell: bash
        run: |
          set -euo pipefail
          export RUN193_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN193_STABLE_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          export RUN193_SUMMARY RUN193_BUDGET_JSON RUN193_LIVE_MOBILE_JSON RUN193_SMOKE_PASS_COUNT RUN193_PERF_ROW
          node scripts/recordRun193CanonicalSceneShadowAdapter.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js WORLD_REFERENCE_MAP.md 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git commit -m 'docs(run193): record validated bounded canonical scene checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git show origin/main:3D_GAME_PROGRESS.md | grep -q '^## Run 193 '; then echo 'Run193 occupied immediately before branch publish'; exit 1; fi
          if git show origin/main:DECISIONS.md | grep -q '^## ADR-0213 '; then echo 'ADR-0213 occupied immediately before branch publish'; exit 1; fi
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "$RUN193_STABLE_TAG"
          git push origin "$RUN193_STABLE_TAG" || echo '[run193] stable tag push unavailable; STABLE_TAGS record retained per governance known limitation.'
