name: Run216 Editor Road Model

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorRoadModel.js'
      - 'scripts/checkRun216EditorRoadModel.mjs'
      - '.github/workflows/run216-editor-road-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-road-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check src/3d/editor/EditorRoadModel.js
      - run: node --check scripts/checkRun216EditorRoadModel.mjs
      - run: node scripts/checkRun216EditorRoadModel.mjs
