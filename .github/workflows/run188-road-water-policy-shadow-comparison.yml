name: Run 188 Road Water Policy Shadow Comparison

on:
  push:
    branches: [chatgpt/run188-road-water-policy-shadow-comparison]
    paths:
      - 'scripts/checkRoadWaterPolicyComparison.js'
      - 'scripts/fixtures/run188-road-water-policy.json'
      - 'scripts/recordRun188Governance.js'
      - '.github/workflows/run188-road-water-policy-shadow-comparison.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: b7f570884f7f58d391c6fdb16393adef8bce9d5a
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Snapshot and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F '## Run 187 — Canonical chunk + water + collider integration shadow' 3D_GAME_PROGRESS.md
          grep -F '## ADR-0207 — Prove canonical terrain as real chunk geometry against the existing water plane and collider shape before live integration (run 187)' DECISIONS.md
          grep -F '# Run 187 Road/Water Owner Gate' ROAD_WATER_OWNER_GATE.md
          if grep -q '^## ADR-0208 ' DECISIONS.md; then echo 'ADR-0208 already occupied on main'; exit 1; fi
          if grep -q '^## Run 188 ' 3D_GAME_PROGRESS.md; then echo 'Run188 already occupied on main'; exit 1; fi
          git log -12 --oneline
          tail -n 120 3D_GAME_PROGRESS.md
          tail -n 100 DECISIONS.md
          tail -n 80 QUESTIONS_FOR_OWNER.md

      - name: Baseline full browser smoke on Run 187 main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run188-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run188-smoke-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run188-smoke-before.log")" -ge 34)
          git worktree remove "$BASELINE"

      - name: Syntax additive and deterministic owner-policy comparison
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkRoadWaterPolicyComparison.js
          node --check scripts/recordRun188Governance.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check
          node scripts/checkRoadWaterPolicyComparison.js | tee "$RUNNER_TEMP/run188-policy.log"
          SUMMARY="$(grep '^\[checkRoadWaterPolicyComparison\] PASS:' "$RUNNER_TEMP/run188-policy.log" | tail -n1 | sed 's/^\[checkRoadWaterPolicyComparison\] PASS: //')"
          CHECKSUM="$(grep '^\[checkRoadWaterPolicyComparison\] CHECKSUM:' "$RUNNER_TEMP/run188-policy.log" | tail -n1 | awk '{print $3}')"
          test -n "$SUMMARY"
          test -n "$CHECKSUM"
          test -s artifacts/run188-road-water-policy/comparison.json
          echo "RUN188_POLICY_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          echo "RUN188_POLICY_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Canonical map terrain chunk water and road gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkFullReferenceMigrationDryRun.js
          node scripts/checkWorldReferenceMigrationDryRun.js
          node scripts/checkCanonicalHydrologyTerrainShadow.js
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkTerrainVisualContract.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js
          node scripts/checkWindGrassContractRun180.js
          node scripts/checkWindGrassSceneIntegrationRun180.js

      - name: Determinism assets PWA governance a11y input physics gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkJumpArcContract.js
          node scripts/checkEventBusContract.js
          node scripts/checkHealthStateContract.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js

      - name: Mobile streaming LOD and real render budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run188-mobile-budget.log"
          SAMPLE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run188-mobile-budget.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$SAMPLE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$SAMPLE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$SAMPLE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000
          echo "RUN188_MOBILE_BUDGET_SUMMARY=live mobile F2 ${DRAW} draw calls / ${TRI} triangles, under <500 / <500K; Run188 test-only comparison adds zero live render cost." >> "$GITHUB_ENV"

      - name: Full browser smoke after change and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run188-smoke-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run188-smoke-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run188-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run188-smoke-after.log"; then exit 1; fi
          echo "RUN188_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"

      - name: Mobile near and F4 far visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js

      - name: Upload Run 188 evidence
        uses: actions/upload-artifact@v4
        with:
          name: run188-road-water-policy-shadow-evidence
          path: |
            artifacts/run188-road-water-policy/comparison.json
            artifacts/run130-mobile/*.png
          if-no-files-found: error

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run188 | tee "$RUNNER_TEMP/run188-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run188-trend.log"
          PERF_ROW="$(grep '^\[collectPerfSnapshot\] sampled:' "$RUNNER_TEMP/run188-perf.log" | tail -n1 | sed 's/^\[collectPerfSnapshot\] sampled: //')"
          test -n "$PERF_ROW"
          test "$(printf '%s\n' "$PERF_ROW" | awk -F',' '{print NF}')" -eq 8
          echo "RUN188_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git checkout -- perf_log.csv

      - name: Senior self-review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkRoadWaterPolicyComparison.js scripts/recordRun188Governance.js; then exit 1; fi
          git diff --quiet "$BASE_SHA" HEAD -- src/3d script.js service-worker.js index.html game3d.html manifest.json
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/checkServiceWorkerCache.js
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if grep -q '^## ADR-0208 ' DECISIONS.md; then echo 'ADR-0208 occupied before publish'; exit 1; fi
          if grep -q '^## Run 188 ' 3D_GAME_PROGRESS.md; then echo 'Run188 occupied before publish'; exit 1; fi

      - name: Prepare Run 188 governance values
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN188_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN188_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Record Run 188 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun188Governance.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js

      - name: Final publish concurrency gate and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git ls-remote --tags origin "refs/tags/$RUN188_STABLE_TAG" | grep -q .; then echo 'stable tag already exists'; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROAD_WATER_OWNER_GATE.md WORLD_REFERENCE_MAP.md 3D_GAME_PROGRESS.md DECISIONS.md QUESTIONS_FOR_OWNER.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "test(world): record road water policy shadow comparison"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:chatgpt/run188-road-water-policy-shadow-comparison
          git tag "$RUN188_STABLE_TAG"
          git push origin "$RUN188_STABLE_TAG" || true
