name: Terrain Cryosphere Freeze-Thaw Exact Head QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/terrainSurfaceCryosphere.js'
      - 'scripts/checkTerrainCryosphereFreezeThaw.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-cryosphere-freeze-thaw:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Syntax gate
        run: node --check scripts/checkTerrainCryosphereFreezeThaw.mjs
      - name: Freeze-thaw contract
        run: node scripts/checkTerrainCryosphereFreezeThaw.mjs
