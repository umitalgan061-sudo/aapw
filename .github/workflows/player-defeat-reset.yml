name: Player Defeat Reset Contract

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerDefeatResetContract.mjs'
      - '.github/workflows/player-defeat-reset.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-defeat-reset-contract-*'

permissions:
  contents: read

jobs:
  defeat-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify current-main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -le 2
          for file in "${files[@]}"; do
            case "$file" in
              scripts/checkPlayerDefeatResetContract.mjs|.github/workflows/player-defeat-reset.yml) ;;
              *) echo "unexpected scope: $file" >&2; exit 1 ;;
            esac
          done
          stats=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          read -r additions deletions <<< "$stats"
          test $((additions + deletions)) -le 1000

      - name: Syntax and defeat lifecycle contract
        run: |
          node --check src/3d/gameplay/player.js
          node --check scripts/checkPlayerDefeatResetContract.mjs
          node scripts/checkPlayerDefeatResetContract.mjs

      - name: Regress recovery and combat lifecycle contracts
        run: |
          node scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node scripts/checkPlayerCombatRecoveryInputIsolation.mjs
          node --check scripts/checkPlayerHitStaggerRuntime.mjs
          node scripts/checkPlayerDodgeIFrames.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
