name: settlement-campaign-notification-policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementCampaignNotificationPolicy.js'
      - 'scripts/checkSettlementCampaignNotificationPolicy.mjs'
      - '.github/workflows/settlement-campaign-notification-policy.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementCampaignNotificationPolicy.js'
      - 'scripts/checkSettlementCampaignNotificationPolicy.mjs'
      - '.github/workflows/settlement-campaign-notification-policy.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: node --check src/3d/gameplay/settlementCampaignNotificationPolicy.js && node --check scripts/checkSettlementCampaignNotificationPolicy.mjs
      - name: Execute deterministic contract
        run: node scripts/checkSettlementCampaignNotificationPolicy.mjs
      - name: Protect runtime/editor boundary
        run: |
          ! grep -n "EditorMaterialStudio\\|document\\.\\|window\\." src/3d/gameplay/settlementCampaignNotificationPolicy.js
      - name: Enforce bounded scope
        run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/settlementCampaignNotificationPolicy.js scripts/checkSettlementCampaignNotificationPolicy.mjs .github/workflows/settlement-campaign-notification-policy.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
