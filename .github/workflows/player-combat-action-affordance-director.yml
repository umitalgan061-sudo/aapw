name: player-combat-action-affordance-director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatActionAffordanceDirector.js'
      - 'scripts/checkPlayerCombatActionAffordanceDirector.mjs'
      - '.github/workflows/player-combat-action-affordance-director.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact-main ancestry
        run: |
          BASE="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE" HEAD
      - name: Focused diff budget and boundary
        run: |
          BASE="$(git rev-parse origin/main)"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$CHANGED" | grep -Ev '^(src/3d/gameplay/playerCombatActionAffordanceDirector\.js|scripts/checkPlayerCombatActionAffordanceDirector\.mjs|\.github/workflows/player-combat-action-affordance-director\.yml)$' && exit 1 || true
          test "$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          ! git diff "$BASE"...HEAD --binary | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|\.glb|\.fbx|\.blend|assets/models|assets/animations|assets/textures|assets/particles|assets/audio'
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatActionAffordanceDirector.js
          node --check scripts/checkPlayerCombatActionAffordanceDirector.mjs
      - name: Executable regression
        run: node scripts/checkPlayerCombatActionAffordanceDirector.mjs
      - name: Diff hygiene
        run: git diff --check "$BASE"...HEAD
