name: Player Combat Action Gate

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatActionGate.ts'
      - 'scripts/checkPlayerCombatActionGate.mjs'
      - '.github/workflows/player-combat-action-gate.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-combat-action-gate-20260924-r11'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-main ancestry
        shell: bash
        run: |
          git fetch origin main --depth=1
          BASE="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE" HEAD
      - name: TypeScript syntax
        run: node --experimental-strip-types --check src/3d/gameplay/playerCombatActionGate.ts
      - name: Focused proof
        run: node --experimental-strip-types scripts/checkPlayerCombatActionGate.mjs
