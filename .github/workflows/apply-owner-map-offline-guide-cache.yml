name: Apply Owner Map Offline Guide Cache

on:
  push:
    branches:
      - agent/buzul-map-reference-geography-db49125
    paths:
      - 'scripts/applyOwnerMapOfflineGuideCachePatch.mjs'
      - '.github/workflows/apply-owner-map-offline-guide-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/buzul-map-reference-geography-db49125
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify cache patch
        run: |
          set -euo pipefail
          node scripts/applyOwnerMapOfflineGuideCachePatch.mjs
          node --check service-worker.js
          node scripts/checkServiceWorkerCache.js
      - name: Commit production change and remove temporary patch files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/applyOwnerMapOfflineGuideCachePatch.mjs .github/workflows/apply-owner-map-offline-guide-cache.yml
          git add service-worker.js
          git commit -m 'fix(pwa): cache owner-map feature guides offline'
          git push origin HEAD:agent/buzul-map-reference-geography-db49125
