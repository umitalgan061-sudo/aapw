name: Dragon Dive Heading

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/dragonFlightMath.js'
      - 'src/3d/gameplay/dragonController.js'
      - 'scripts/checkDragonDiveHeading.mjs'
      - '.github/workflows/dragon-dive-heading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dragon-dive-heading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify exact current main and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/dragonFlightMath\.js|scripts/checkDragonDiveHeading\.mjs|\.github/workflows/dragon-dive-heading\.yml)$' && exit 1 || true
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END {print s+0}')"
          test $((additions + deletions)) -le 1000

      - name: Syntax and deterministic 3D dive-orientation contract
        run: |
          node --check src/3d/gameplay/dragonFlightMath.js
          node --check src/3d/gameplay/dragonController.js
          node --check scripts/checkDragonDiveHeading.mjs
          node scripts/checkDragonDiveHeading.mjs

      - name: Preserve shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Runtime ownership guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'EditorMaterialStudio' src/3d/gameplay/dragonFlightMath.js
          grep -q 'applyDiveOffset' src/3d/gameplay/dragonController.js
          grep -q 'alignDiveOrientation' src/3d/gameplay/dragonController.js
          grep -q 'clampAltitudeAboveGround(model' src/3d/gameplay/dragonController.js
          grep -q 'DRAGON_TERRAIN_LOOKAHEAD_METERS' src/3d/gameplay/dragonFlightMath.js
          grep -q 'DRAGON_TERRAIN_PROBE_SPACING_METERS' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonPreviousRenderedX' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonPreviousRenderedZ' src/3d/gameplay/dragonFlightMath.js
          grep -q 'segmentCount' src/3d/gameplay/dragonFlightMath.js
          grep -q 'actual rendered +Z motion even when yaw faces +X' scripts/checkDragonDiveHeading.mjs
          node - <<'NODE'
          const fs = require('fs');
          const controller = fs.readFileSync('src/3d/gameplay/dragonController.js', 'utf8');
          const clamp = controller.indexOf('clampAltitudeAboveGround(model');
          const align = controller.indexOf('alignDiveOrientation(model');
          if (clamp < 0 || align < 0 || align < clamp) throw new Error('final dive orientation must be recomputed after terrain clamp');
          const math = fs.readFileSync('src/3d/gameplay/dragonFlightMath.js', 'utf8');
          const currentProbe = math.indexOf('sampleGroundY(object3D.position.x, object3D.position.z)');
          const retainedMotion = math.indexOf('object3D.position.x - previousX');
          const segments = math.indexOf('Math.ceil(lookAheadMeters / spacing)');
          const loop = math.indexOf('segment <= segmentCount');
          if (currentProbe < 0 || retainedMotion < currentProbe || segments < retainedMotion || loop < segments) {
            throw new Error('terrain lookahead must prefer retained rendered motion before sweeping the bounded subdivided strip');
          }
          NODE

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
