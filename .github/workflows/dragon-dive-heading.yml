name: Dragon Dive Heading

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/dragonFlightMath.js'
      - 'src/3d/gameplay/dragonController.js'
      - 'src/3d/gameplay/dragonReactionState.js'
      - 'scripts/checkDragonDiveHeading.mjs'
      - 'scripts/checkDragonTerrainSampleResilience.mjs'
      - '.github/workflows/dragon-dive-heading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dragon-dive-heading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify exact current main and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/dragonFlightMath\.js|scripts/checkDragonTerrainSampleResilience\.mjs|\.github/workflows/dragon-dive-heading\.yml)$' && exit 1 || true
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END {print s+0}')"
          test $((additions + deletions)) -le 1000

      - name: Syntax and deterministic 3D dive-orientation contract
        run: |
          node --check src/3d/gameplay/dragonFlightMath.js
          node --check src/3d/gameplay/dragonController.js
          node --check src/3d/gameplay/dragonReactionState.js
          node --check scripts/checkDragonDiveHeading.mjs
          node --check scripts/checkDragonTerrainSampleResilience.mjs
          node scripts/checkDragonDiveHeading.mjs
          node scripts/checkDragonTerrainSampleResilience.mjs

      - name: Preserve shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Runtime ownership and terrain sweep budget guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'EditorMaterialStudio' src/3d/gameplay/dragonFlightMath.js
          grep -q 'applyDiveOffset' src/3d/gameplay/dragonController.js
          grep -q 'alignDiveOrientation' src/3d/gameplay/dragonController.js
          grep -q 'clampAltitudeAboveGround(model' src/3d/gameplay/dragonController.js
          grep -q 'DRAGON_TERRAIN_LOOKAHEAD_METERS' src/3d/gameplay/dragonFlightMath.js
          grep -q 'DRAGON_TERRAIN_PROBE_SPACING_METERS' src/3d/gameplay/dragonFlightMath.js
          grep -q 'DRAGON_TERRAIN_MAX_TRAVERSED_SWEEP_METERS' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonPreviousRenderedX' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonPreviousRenderedZ' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonTerrainSweepDiscontinuity' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonTerrainSampleCount' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonTerrainInvalidSampleCount' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonTerrainSampleExceptionCount' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonTerrainLastSafeAltitudeY' src/3d/gameplay/dragonFlightMath.js
          grep -q 'dragonTerrainUsingSafeAltitudeFallback' src/3d/gameplay/dragonFlightMath.js
          grep -q 'canUseSafeAltitudeFallback = !skippedDiscontinuity' src/3d/gameplay/dragonFlightMath.js
          grep -q 'try {' src/3d/gameplay/dragonFlightMath.js
          grep -q 'groundY = sampleGroundY(x, z)' src/3d/gameplay/dragonFlightMath.js
          grep -q 'sampleSegmentGround' src/3d/gameplay/dragonFlightMath.js
          grep -q 'traversedDistance <= boundedMaxTraversed' src/3d/gameplay/dragonFlightMath.js
          grep -q 'pursuitCenterTerrainSampleExceptionCount' src/3d/gameplay/dragonReactionState.js
          grep -q 'pursuitCenterTerrainInvalidSampleCount' src/3d/gameplay/dragonReactionState.js
          grep -q 'centerGroundY = sampleGroundY(state.center.x, state.center.z)' src/3d/gameplay/dragonReactionState.js
          grep -q 'Number.isFinite(centerGroundY)' src/3d/gameplay/dragonReactionState.js
          grep -q 'kilometre-scale retained displacement must be classified as a discontinuity' scripts/checkDragonDiveHeading.mjs
          grep -q 'long-frame traversed segment must be sampled before projecting new lookahead' scripts/checkDragonDiveHeading.mjs
          grep -q 'valid forward ridge must still clamp altitude when the current sample is NaN' scripts/checkDragonTerrainSampleResilience.mjs
          grep -q 'an isolated terrain sampler exception must not abort the dragon update' scripts/checkDragonTerrainSampleResilience.mjs
          grep -q 'an all-throwing transient terrain frame must not let an active dive descend below the last proven safe altitude' scripts/checkDragonTerrainSampleResilience.mjs
          grep -q 'finite terrain recovery must release the transient fallback and resume the current terrain floor' scripts/checkDragonTerrainSampleResilience.mjs
          grep -q 'a throwing pursuit-center terrain sample must not abort the configured dragon update' scripts/checkDragonTerrainSampleResilience.mjs
          grep -q 'all-throwing terrain data with no prior safe latch must preserve the requested rendered altitude' scripts/checkDragonTerrainSampleResilience.mjs
          grep -q 'all-invalid terrain data with no prior safe latch must preserve the requested rendered altitude' scripts/checkDragonTerrainSampleResilience.mjs
          node - <<'NODE'
          const fs = require('fs');
          const controller = fs.readFileSync('src/3d/gameplay/dragonController.js', 'utf8');
          const clamp = controller.indexOf('clampAltitudeAboveGround(model');
          const align = controller.indexOf('alignDiveOrientation(model');
          if (clamp < 0 || align < 0 || align < clamp) throw new Error('final dive orientation must be recomputed after terrain clamp');
          const math = fs.readFileSync('src/3d/gameplay/dragonFlightMath.js', 'utf8');
          const currentProbe = math.indexOf('probeGround(object3D.position.x, object3D.position.z)');
          const retainedMotion = math.indexOf('object3D.position.x - previousX');
          const traversedSweep = math.indexOf('traversedDistance <= boundedMaxTraversed');
          const discontinuity = math.indexOf('skippedDiscontinuity = true');
          const forwardSweep = math.lastIndexOf('sampleSegmentGround(');
          const fallback = math.indexOf('canUseSafeAltitudeFallback = !skippedDiscontinuity');
          const safeLatch = math.indexOf('dragonTerrainLastSafeAltitudeY = object3D.position.y');
          if (currentProbe < 0 || retainedMotion < currentProbe || traversedSweep < retainedMotion || discontinuity < traversedSweep || forwardSweep < discontinuity) {
            throw new Error('terrain safety must bound retained travel before projecting forward lookahead');
          }
          if (fallback < forwardSweep || safeLatch < fallback) {
            throw new Error('last-safe altitude fallback must run only after the full terrain sweep and refresh only after finite terrain proof');
          }
          NODE

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
