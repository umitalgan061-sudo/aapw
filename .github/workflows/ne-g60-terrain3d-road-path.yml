name: NE G60 Terrain3D Road Path
on:
  push: { branches: ['terrain/ne-g60-terrain3d-road-path-r*-exact-*-20260815'] }
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ne-g60-terrain3d-road-path.yml
      - godot/terrain-authoring/geocells/ne/g60_road_path.mjs
      - godot/terrain-authoring/scripts/validate_g60_terrain3d_road_path.gd
      - scripts/checkNEG60RoadPath.mjs
      - scripts/checkNEG60RoadPathControlPreflight.mjs
      - scripts/checkNEG60RoadPathNeighborSeams.mjs
      - scripts/checkNEG60RoadPathVisualEvidence.mjs
      - scripts/checkNEG60RoadPathEvidenceBundle.mjs
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'ne-g60-road-path-${{ github.head_ref || github.ref_name }}', cancel-in-progress: true }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main scope quota and prior layers
        run: |
          set -euo pipefail
          git lfs fsck
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"; echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(\.github/workflows/ne-g60-terrain3d-road-path.yml|godot/terrain-authoring/geocells/ne/g60_road_path.mjs|godot/terrain-authoring/scripts/validate_g60_terrain3d_road_path.gd|scripts/checkNEG60RoadPath.mjs|scripts/checkNEG60RoadPathControlPreflight.mjs|scripts/checkNEG60RoadPathNeighborSeams.mjs|scripts/checkNEG60RoadPathVisualEvidence.mjs|scripts/checkNEG60RoadPathEvidenceBundle.mjs)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 8
          A="$(git diff --numstat origin/main...HEAD|awk '{s+=$1}END{print s+0}')"; D="$(git diff --numstat origin/main...HEAD|awk '{s+=$2}END{print s+0}')"
          echo "G60_ROAD_PATH_CHANGED_LINES=$((A+D))"; test $((A+D)) -le 1000
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py addons/zylann.hterrain src/3d/world/terrain.js src/3d/world/roads.js godot/terrain-authoring/corner_claims/NE.json
          node scripts/checkNEG60Hydrology.mjs; node scripts/checkNEG60Terrain3DBiome.mjs; node scripts/checkNEG60Relief.mjs; node scripts/checkNEG60RockSnow.mjs
          node scripts/checkNEG70RoadPath.mjs --help >/dev/null 2>&1 || true
          node scripts/checkNEG61Hydrology.mjs
          for f in godot/terrain-authoring/geocells/ne/g60_road_path.mjs scripts/checkNEG60RoadPath.mjs scripts/checkNEG60RoadPathControlPreflight.mjs scripts/checkNEG60RoadPathNeighborSeams.mjs scripts/checkNEG60RoadPathVisualEvidence.mjs scripts/checkNEG60RoadPathEvidenceBundle.mjs; do node --check "$f"; done
      - name: Install Chromium and prove live road exclusion
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"; npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNEG60RoadPath.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g60-road-path-probe.json | tee /tmp/source.log
          grep -F NE_G60_ROAD_PATH_VALIDATION_OK /tmp/source.log
          node scripts/checkNEG60RoadPathControlPreflight.mjs | tee /tmp/control.log; grep -F NE_G60_ROAD_PATH_CONTROL_PREFLIGHT_OK /tmp/control.log
          node scripts/checkNEG60RoadPathNeighborSeams.mjs | tee /tmp/seam.log; grep -F NE_G60_ROAD_PATH_NEIGHBOR_SEAMS_OK /tmp/seam.log
      - name: Pinned Terrain3D Godot and double native proof
        run: |
          set -euo pipefail
          ok=0; for n in 1 2 3; do if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee /tmp/t3d-$n.log; then grep -F TERRAIN3D_INSTALL_OK /tmp/t3d-$n.log; ok=1; break; fi; sleep $((n*3)); done; test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | grep -F TERRAIN3D_VERIFY_OK
          mkdir -p "$RUNNER_TEMP/g"; curl -fL --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/g.zip"; unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP/g"
          G="$(find "$RUNNER_TEMP/g" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$G"; chmod +x "$G"; "$G" --version | grep -F 4.6.3; echo "GODOT_BIN=$G" >> "$GITHUB_ENV"
          timeout 180s "$G" --headless --editor --path godot/terrain-authoring --quit-after 45
          G60_ROAD_PATH_PROOF_SUFFIX=a timeout 240s "$G" --headless --path godot/terrain-authoring --script res://scripts/validate_g60_terrain3d_road_path.gd | tee /tmp/a.log
          cp godot/terrain-authoring/.terrain3d-proof/g60-road-path-bake.json /tmp/a.json; cp godot/terrain-authoring/.terrain3d-proof/g60-road-path-imported-topdown.png /tmp/a.png
          G60_ROAD_PATH_PROOF_SUFFIX=b timeout 240s "$G" --headless --path godot/terrain-authoring --script res://scripts/validate_g60_terrain3d_road_path.gd | tee /tmp/b.log
          cp godot/terrain-authoring/.terrain3d-proof/g60-road-path-bake.json /tmp/b.json; cp godot/terrain-authoring/.terrain3d-proof/g60-road-path-imported-topdown.png /tmp/b.png
          grep -F NE_G60_TERRAIN3D_ROAD_PATH_VALIDATION_OK /tmp/a.log; grep -F NE_G60_TERRAIN3D_ROAD_PATH_VALIDATION_OK /tmp/b.log
          jq -S 'del(.savedRegionBytes)' /tmp/a.json >/tmp/as.json; jq -S 'del(.savedRegionBytes)' /tmp/b.json >/tmp/bs.json; cmp /tmp/as.json /tmp/bs.json; cmp /tmp/a.png /tmp/b.png
          jq -e '.regionCount>=4 and .alignedSamples==4225 and .seamSamples==60 and .forbiddenRoadPathOverlaySamples==0 and .savedRegionFiles>=4 and .bakedVertices>0 and .maxActualBlend<=0.000001 and .maxSeamBlend<=0.000001' /tmp/b.json
      - name: Visual repository and final freshness gates
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNEG60RoadPathVisualEvidence.mjs --out-dir=artifacts/ne-g60-road-path-visual | tee /tmp/visual.log; grep -F NE_G60_ROAD_PATH_VISUAL_EVIDENCE_OK /tmp/visual.log
          node scripts/checkNEG60RoadPathEvidenceBundle.mjs | tee /tmp/bundle.log; grep -F NE_G60_ROAD_PATH_EVIDENCE_BUNDLE_OK /tmp/bundle.log
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee /tmp/ht.log; grep -F HTERRAIN_AUTHORING_VALIDATION_OK /tmp/ht.log
          node scripts/checkSeededRandomPolicy.js; node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js; node scripts/checkServiceWorkerCache.js; node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
          git fetch origin main; MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"; git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ne-g60-terrain3d-road-path-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g60-road-path-*.json
            godot/terrain-authoring/.terrain3d-proof/g60-road-path-*.png
            artifacts/ne-g60-road-path-visual/
