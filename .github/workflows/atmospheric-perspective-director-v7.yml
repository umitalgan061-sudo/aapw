name: Atmospheric Perspective Director v7

on:
  pull_request:
    paths:
      - 'src/3d/world/atmosphericPerspectiveDirector.js'
      - 'scripts/checkAtmosphericPerspectiveDirector.mjs'
      - '.github/workflows/atmospheric-perspective-director-v7.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-atmosphere-contrast-v7-20260908'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Verify exact-main ancestry and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          test "$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')" -eq 3
      - name: Syntax
        run: |
          node --check src/3d/world/atmosphericPerspectiveDirector.js
          node --check scripts/checkAtmosphericPerspectiveDirector.mjs
      - name: Executable contract
        run: node scripts/checkAtmosphericPerspectiveDirector.mjs
      - name: Runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "EditorMaterialStudio.js" src/3d/world/atmosphericPerspectiveDirector.js
          ! grep -n "MaterialAssignmentCore.js\|WorldAssetPlacementPipeline.js" src/3d/world/atmosphericPerspectiveDirector.js
          git diff --check origin/main...HEAD
