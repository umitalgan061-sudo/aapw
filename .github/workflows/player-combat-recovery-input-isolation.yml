name: Player Combat Recovery Input Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/player.js'
      - 'src/3d/camera.js'
      - 'scripts/checkPlayerGeographicCameraOcclusion.mjs'
      - 'scripts/checkPlayerCombatRecoveryInputIsolation.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferDrop.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferRuntime.mjs'
      - 'scripts/checkPlayerHitStaggerRuntime.mjs'
      - '.github/workflows/player-combat-recovery-input-isolation.yml'
      - '.github/workflows/player-recovery-attack-buffer-drop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-combat-recovery-input-isolation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  recovery-input-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test "$((ADD + DEL))" -le 3000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Static recovery/input contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/camera.js
          node --check scripts/checkPlayerGeographicCameraOcclusion.mjs
          node scripts/checkPlayerGeographicCameraOcclusion.mjs
          node --check scripts/checkPlayerCombatRecoveryInputIsolation.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferRuntime.mjs
          node scripts/checkPlayerCombatRecoveryInputIsolation.mjs | tee recovery-input-contract.log
          grep -q 'PLAYER_COMBAT_RECOVERY_INPUT_ISOLATION_OK' recovery-input-contract.log
          node scripts/checkPlayerRecoveryAttackBufferDrop.mjs | tee recovery-buffer-contract.log
          grep -q 'PLAYER_RECOVERY_ATTACK_BUFFER_DROP_OK' recovery-buffer-contract.log
          node scripts/checkPlayerStaminaDodge.mjs
          node scripts/checkPlayerCombatFeedback.mjs
          node scripts/checkPlayerGroundingCombatContract.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          ! grep -q 'EditorMaterialStudio' src/3d/gameplay/player.js src/3d/camera.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
      - name: Asset-first shipped-scene hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/models/vegetation/pine_Zt62gceKXZ.glb,assets/models/vegetation/winter_tree.glb,assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb,assets/models/Ay/Moon 2K.fbx,assets/animations/peasant_girl/**" --exclude=""
          required_assets=(
            "assets/models/characters/peasant_girl.fbx"
            "assets/animations/peasant_girl/idle.fbx"
            "assets/animations/peasant_girl/walking.fbx"
            "assets/animations/peasant_girl/running.fbx"
            "assets/models/vegetation/pine_Zt62gceKXZ.glb"
            "assets/models/vegetation/winter_tree.glb"
            "assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb"
            "assets/models/Ay/Moon 2K.fbx"
          )
          for asset in "${required_assets[@]}"; do
            test -s "$asset"
            if head -c 128 "$asset" | grep -q 'git-lfs.github.com/spec'; then
              echo "LFS pointer remained after hydration: $asset" >&2
              exit 1
            fi
          done
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped scene recovery/browser proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-combat-recovery-input
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerRecoveryAttackBufferRuntime.mjs --out-dir=artifacts/player-combat-recovery-input/recovery-buffer | tee artifacts/player-combat-recovery-input/recovery-buffer.log
          grep -q 'PLAYER_RECOVERY_ATTACK_BUFFER_RUNTIME_OK' artifacts/player-combat-recovery-input/recovery-buffer.log
          grep -q '"browserErrors": \[\]' artifacts/player-combat-recovery-input/recovery-buffer/recovery-attack-buffer-runtime.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerHitStaggerRuntime.mjs --out-dir=artifacts/player-combat-recovery-input/hit-stagger | tee artifacts/player-combat-recovery-input/hit-stagger.log
          grep -q 'PLAYER_HIT_STAGGER_RUNTIME_OK' artifacts/player-combat-recovery-input/hit-stagger.log
          grep -q '"browserErrors": \[\]' artifacts/player-combat-recovery-input/hit-stagger/hit-stagger-runtime.json
          node scripts/checkMobilePerfBudget.js | tee artifacts/player-combat-recovery-input/mobile-perf.log
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js | tee artifacts/player-combat-recovery-input/browser-smoke.log
      - name: Final main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - name: Shared PWA shell contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-combat-recovery-input-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovery-input-contract.log
            recovery-buffer-contract.log
            artifacts/player-combat-recovery-input/
