name: settlement-dialogue-condition-matrix
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementDialogueConditionMatrix.js'
      - 'scripts/checkSettlementDialogueConditionMatrix.mjs'
      - '.github/workflows/settlement-dialogue-condition-matrix.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementDialogueConditionMatrix.js && node --check scripts/checkSettlementDialogueConditionMatrix.mjs
      - name: Executable regression
        run: node scripts/checkSettlementDialogueConditionMatrix.mjs
      - name: Scope and boundaries
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          ! printf '%s\n' "$files" | grep -E '(^|/)(EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline)'
          ! printf '%s\n' "$files" | grep -E '\.(glb|gltf|fbx|blend|png|jpg|jpeg|webp|mp3|wav|ogg)$'
          additions=$(git diff --numstat "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$additions" -le 3000
