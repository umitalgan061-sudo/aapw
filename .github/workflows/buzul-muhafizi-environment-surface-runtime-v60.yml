name: Buzul Muhafizi - Environment Surface Runtime v60

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentSurfaceRuntimeV60.js'
      - 'scripts/checkEnvironmentSurfaceRuntimeV60.mjs'
      - '.github/workflows/buzul-muhafizi-environment-surface-runtime-v60.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-surface-runtime-v60:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact-main ancestry and focused diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$files" | grep -Fx 'src/3d/world/environmentSurfaceRuntimeV60.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkEnvironmentSurfaceRuntimeV60.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/buzul-muhafizi-environment-surface-runtime-v60.yml'
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          git diff --check origin/main...HEAD
      - name: Syntax
        run: node --check src/3d/world/environmentSurfaceRuntimeV60.js
      - name: Executable regression
        run: node scripts/checkEnvironmentSurfaceRuntimeV60.mjs
      - name: Ownership and shared contract boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'EditorMaterialStudio|from[[:space:]]+["'"'"'][^"'"'"']*three|new[[:space:]]+(Mesh|BoxGeometry|SphereGeometry|ConeGeometry)|assets/models|hydrate|loadAsset' src/3d/world/environmentSurfaceRuntimeV60.js
          grep -q 'merged-590' src/3d/world/environmentSurfaceRuntimeV60.js
          grep -q 'hydrate-load' src/3d/world/environmentSurfaceRuntimeV60.js
      - name: Contract outputs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fullWorld' src/3d/world/environmentSurfaceRuntimeV60.js
          grep -q 'visibleRectangularWater' src/3d/world/environmentSurfaceRuntimeV60.js
          grep -q 'visibleWaterMoire' src/3d/world/environmentSurfaceRuntimeV60.js
          grep -q 'queryCapabilities' src/3d/world/environmentSurfaceRuntimeV60.js
