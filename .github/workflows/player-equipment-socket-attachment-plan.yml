name: Player Equipment Socket Attachment Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentSocketAttachmentPlan.ts'
      - 'src/3d/gameplay/playerEquipmentTransitionCheckpoint.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'src/3d/gameplay/playerEquipmentCombatProfile.ts'
      - 'scripts/checkPlayerEquipmentSocketAttachmentPlan.mjs'
      - 'scripts/checkPlayerEquipmentSocketAttachmentPlanInvariants.mjs'
      - 'scripts/checkPlayerEquipmentSocketAttachmentPlanCheckpointParity.mjs'
      - 'scripts/checkPlayerEquipmentSocketAttachmentPlanGuard.mjs'
      - '.github/workflows/player-equipment-socket-attachment-plan.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install
      - run: node --experimental-strip-types scripts/checkPlayerEquipmentSocketAttachmentPlan.mjs
      - run: node --experimental-strip-types scripts/checkPlayerEquipmentSocketAttachmentPlanInvariants.mjs
      - run: node --experimental-strip-types scripts/checkPlayerEquipmentSocketAttachmentPlanCheckpointParity.mjs
      - run: node --experimental-strip-types scripts/checkPlayerEquipmentSocketAttachmentPlanGuard.mjs
      - run: npx tsc --noEmit --ignoreConfig --allowImportingTsExtensions --allowJs false --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/3d/gameplay/playerEquipmentSocketAttachmentPlan.ts
