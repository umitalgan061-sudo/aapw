name: Terrain Polish Iteration 007

on:
  push:
    branches:
      - 'terrain/polish-iteration-007-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-polish-iteration-007-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul
  BASE_SHA: a879d098033d942c9ce9bac1ab861897ef1d1238

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main concurrency and additive entry gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          python3 - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          protected = [
              'godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd',
              'godot/terrain-authoring/TERRAIN_POLISH_LOG.md',
          ]
          out = subprocess.check_output(['git', 'diff', '--numstat', f'{base}...HEAD', '--', *protected], text=True)
          for line in out.splitlines():
              added, deleted, path = line.split('\t', 2)
              if deleted != '0':
                  raise SystemExit(f'non-additive terrain diff: {path} deleted={deleted} added={added}')
          PY

      - name: Iteration 007 source and scope contract
        run: |
          set -euo pipefail
          test -f godot/terrain-authoring/addons/zylann.hterrain/plugin.cfg
          test -f godot/terrain-authoring/scripts/validate_terrain_polish_iteration_07.gd
          test -f godot/terrain-authoring/scripts/build_terrain_data_snapshot.py
          test -f godot/terrain-authoring/TERRAIN_POLISH_LOG.md
          grep -F 'STARTER_MACRO_TINT_MIN := 0.94' godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          grep -F '_seed_starter_macro_tint(data)' godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          grep -F 'TERRAIN_POLISH_ITERATION_07_OK' godot/terrain-authoring/scripts/validate_terrain_polish_iteration_07.gd
          grep -F '### Iteration #07' godot/terrain-authoring/TERRAIN_POLISH_LOG.md
          test "$(git ls-files godot/terrain-authoring/terrain_data)" = 'godot/terrain-authoring/terrain_data/.gitkeep'
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data
          git diff --quiet "$BASE_SHA"...HEAD -- .gitignore .gitattributes

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' \
            --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Godot resource import without first-scan plugin races
        run: |
          set -euo pipefail
          PROJECT_FILE='godot/terrain-authoring/project.godot'
          BACKUP_FILE="$RUNNER_TEMP/terrain-polish-project.godot"
          cp "$PROJECT_FILE" "$BACKUP_FILE"
          restore_project() { cp "$BACKUP_FILE" "$PROJECT_FILE"; }
          trap restore_project EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('godot/terrain-authoring/project.godot')
          text = path.read_text(encoding='utf-8')
          expected = 'enabled=PackedStringArray("res://addons/zylann.hterrain/plugin.cfg")'
          assert expected in text
          path.write_text(text.replace(expected, 'enabled=PackedStringArray()'), encoding='utf-8')
          PY
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import 2>&1 | tee "$RUNNER_TEMP/terrain-polish-import.log"
          restore_project
          trap - EXIT
          git diff --exit-code -- "$PROJECT_FILE"

      - name: Godot editor and terrain validation
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 2>&1 | tee "$RUNNER_TEMP/terrain-polish-editor.log"
          if grep -F 'Terrain data is null, can'"'"'t update detail layer completely' "$RUNNER_TEMP/terrain-polish-editor.log"; then
            echo 'Unexpected HTerrain detail-layer initialization error in editor log.' >&2
            exit 1
          fi
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd 2>&1 | tee "$RUNNER_TEMP/terrain-polish-base-validation.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/terrain-polish-base-validation.log"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_terrain_polish_iteration_07.gd 2>&1 | tee "$RUNNER_TEMP/terrain-polish-iteration-validation.log"
          grep -F 'TERRAIN_POLISH_ITERATION_07_OK' "$RUNNER_TEMP/terrain-polish-iteration-validation.log"

      - name: Build and verify deterministic HTerrain snapshot
        run: |
          set -euo pipefail
          SNAPSHOT_DIR="$RUNNER_TEMP/hterrain-authoring-snapshot-007"
          SECOND_DIR="$RUNNER_TEMP/hterrain-authoring-snapshot-007-repeat"
          python3 godot/terrain-authoring/scripts/build_terrain_data_snapshot.py --source godot/terrain-authoring/terrain_data --output "$SNAPSHOT_DIR" | tee "$RUNNER_TEMP/terrain-snapshot.log"
          grep -F 'TERRAIN_DATA_SNAPSHOT_OK' "$RUNNER_TEMP/terrain-snapshot.log"
          python3 godot/terrain-authoring/scripts/build_terrain_data_snapshot.py --source godot/terrain-authoring/terrain_data --output "$SECOND_DIR" >/dev/null
          cmp "$SNAPSHOT_DIR/manifest.json" "$SECOND_DIR/manifest.json"
          python3 - "$SNAPSHOT_DIR" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          paths = {item['path']: item for item in manifest['files']}
          assert 'color.png' in paths and 'global_albedo.png' in paths
          for name in ('color.png', 'global_albedo.png'):
              data = (root / name).read_bytes()
              assert len(data) == paths[name]['size']
              assert hashlib.sha256(data).hexdigest() == paths[name]['sha256']
          print(f"TERRAIN_POLISH_ITERATION_07_SNAPSHOT_OK files={manifest['file_count']} bytes={manifest['total_bytes']}")
          PY

      - name: Upload verified HTerrain authoring snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hterrain-authoring-snapshot-iteration-007-${{ github.sha }}
          path: ${{ runner.temp }}/hterrain-authoring-snapshot-007
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: PWA cache and installability regression
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js

      - name: Install Chromium smoke and performance dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance determinism world safety governance
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/terrain-polish-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkRun280OwnerMapSemanticFingerprint.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js

      - name: Full browser smoke and console regression
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/terrain-polish-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/terrain-polish-smoke.log")" -ge 34

      - name: Final exact-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git ls-files godot/terrain-authoring/terrain_data)" = 'godot/terrain-authoring/terrain_data/.gitkeep'
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data
