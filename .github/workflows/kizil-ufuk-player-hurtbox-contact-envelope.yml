name: Kızıl Ufuk Player Hurtbox Contact Envelope

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerHurtboxContactEnvelope.js'
      - 'scripts/checkPlayerHurtboxContactEnvelope.mjs'
      - '.github/workflows/kizil-ufuk-player-hurtbox-contact-envelope.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact-main ancestry
        shell: bash
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$(git rev-parse origin/main)" "$GITHUB_SHA"
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerHurtboxContactEnvelope.js
          node --check scripts/checkPlayerHurtboxContactEnvelope.mjs
      - name: Deterministic runtime proof
        run: node scripts/checkPlayerHurtboxContactEnvelope.mjs
      - name: Runtime/editor boundary
        run: |
          ! grep -R "EditorMaterialStudio" -n src/3d/gameplay/playerHurtboxContactEnvelope.js
          ! grep -E "from ['\"].*(three|EditorMaterialStudio)" -n src/3d/gameplay/playerHurtboxContactEnvelope.js
      - name: Scope guard
        shell: bash
        run: |
          additions=$(git diff --numstat "$(git rev-parse origin/main)"...HEAD | awk '{a+=$1; d+=$2} END {print a+0}')
          deletions=$(git diff --numstat "$(git rev-parse origin/main)"...HEAD | awk '{d+=$2} END {print d+0}')
          test "$deletions" -eq 0
          test "$additions" -le 3000
