name: RPG Expedition Reward Provenance

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionBoardBrowser.mjs'
      - 'scripts/checkInteractionExpeditionRewardProvenance.mjs'
      - 'scripts/checkInteractionExpeditionRewardTradeContinuity.mjs'
      - 'scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs'
      - '.github/workflows/rpg-expedition-credit-ledger.yml'
      - '.github/workflows/rpg-expedition-reward-provenance.yml'
      - '.github/workflows/rpg-mastery-to-smithing.yml'
      - '.github/workflows/rpg-mastery-travel-continuity.yml'

permissions:
  contents: read

jobs:
  expedition-reward-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Exact-main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse origin/main)" = "$base_sha"
          test "$(git rev-parse HEAD)" = "$head_sha"
          test "$(git merge-base "$base_sha" "$head_sha")" = "$base_sha"
          git diff --check "$base_sha...$head_sha"
          mapfile -t files < <(git diff --name-only "$base_sha...$head_sha")
          test ${#files[@]} -ge 1
          for path in "${files[@]}"; do
            case "$path" in
              src/3d/gameplay/interaction.js|src/3d/gameplay/interactionEconomy.js|scripts/checkInteractionExpeditionBoard.mjs|scripts/checkInteractionExpeditionBoardBrowser.mjs|scripts/checkInteractionExpeditionRewardProvenance.mjs|scripts/checkInteractionExpeditionRewardTradeContinuity.mjs|scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs|.github/workflows/rpg-expedition-credit-ledger.yml|.github/workflows/rpg-expedition-reward-provenance.yml|.github/workflows/rpg-mastery-to-smithing.yml|.github/workflows/rpg-mastery-travel-continuity.yml) ;;
              *) echo "Unexpected path: $path" >&2; exit 1 ;;
            esac
          done
          changed=$(git diff --numstat "$base_sha...$head_sha" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 1000

      - name: Syntax and expedition reward provenance acceptance
        run: |
          node --check src/3d/gameplay/interaction.js
          node --check src/3d/gameplay/interactionEconomy.js
          node --check scripts/checkInteractionExpeditionBoard.mjs
          node --check scripts/checkInteractionExpeditionBoardBrowser.mjs
          node --check scripts/checkInteractionExpeditionRewardProvenance.mjs
          node --check scripts/checkInteractionExpeditionRewardTradeContinuity.mjs
          node --check scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs
          node --check scripts/checkInteractionMasteryTravelContinuityBrowser.mjs
          node scripts/checkInteractionExpeditionRewardProvenance.mjs
          node scripts/checkInteractionExpeditionRewardTradeContinuity.mjs
          node scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs

      - name: Canonical crafted receipt provenance regression
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createInteractionEconomyState } from './src/3d/gameplay/interactionEconomy.js';

          const vendorEconomy = createInteractionEconomyState(40);
          const forgedVendorReceipt = vendorEconomy.purchase(
            { id: 'dragonstone-field-ration', itemId: 'dragonstone-field-ration' },
            () => ({ ok: true, crafted: true, outputItemId: 'forged-maintenance-kit' }),
          );
          assert.equal(forgedVendorReceipt.ok, true);
          assert.equal(forgedVendorReceipt.craftedItemId, null, 'plain vendor callbacks cannot forge a crafted output identity');

          const serviceEconomy = createInteractionEconomyState(40);
          const canonicalServiceReceipt = serviceEconomy.purchase(
            { id: 'dragonstone-whetstone', itemId: 'dragonstone-whetstone' },
            () => ({ ok: true, crafted: true, outputItemId: 'forged-maintenance-kit' }),
          );
          assert.equal(canonicalServiceReceipt.ok, true);
          assert.equal(canonicalServiceReceipt.craftedItemId, 'dragonstone-expedition-maintenance-kit', 'service receipts must report the canonical authored recipe output');
          NODE

      - name: Existing expedition board regression
        run: node scripts/checkInteractionExpeditionBoard.mjs

      - name: Existing expedition credit ledger regression
        run: node scripts/checkInteractionExpeditionCreditLedger.mjs

      - name: Existing quartermaster trade regression
        run: node scripts/checkInteractionQuartermasterTrade.mjs

      - name: Existing mastery economy continuity regression
        run: node scripts/checkInteractionMasteryEconomyContinuity.mjs

      - name: Shared Material Placement Contract regression
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Shipped browser expedition board proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionExpeditionBoardBrowser.mjs

      - name: Shipped browser mastery to smithing persistence proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryToSmithingBrowser.mjs

      - name: Shipped browser mastery travel continuity proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryTravelContinuityBrowser.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = '${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'