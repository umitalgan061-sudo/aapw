name: Run 306 Apply FBX Node Boot Guard

on:
  push:
    branches:
      - agent/run306-editor-fbx-pack-node-guard
    paths:
      - '.github/workflows/run306-apply-node-boot-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run306-apply-node-boot-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main additive preflight
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append Node-safe browser boot guard
        run: |
          set -euo pipefail
          TARGET='src/3d/editor/EditorScaleInputController.js'
          if ! grep -Fq 'RUN306_NODE_BOOT_GUARD_V1' "$TARGET"; then
            printf '%s\n' '' '// RUN306_NODE_BOOT_GUARD_V1 — prevent browser-only queued boot from running inside Node DOM stubs.' "if (typeof document === 'undefined' || typeof window === 'undefined' || typeof window.requestAnimationFrame !== 'function') {" '  bootRun305FbxPackController = async () => {};' '}' >> "$TARGET"
          fi
          node --check "$TARGET"
          node scripts/checkRun216ScaleInputController.mjs
          node scripts/materializeRun216ServiceWorkerCache.js --verify-only
          node scripts/checkRun216ServiceWorkerMaterializer.js
          git diff --check
          git add "$TARGET"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(run306): guard FBX browser boot in Node stubs'
          CURRENT_MAIN="$(git rev-parse origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git push origin HEAD:agent/run306-editor-fbx-pack-node-guard
