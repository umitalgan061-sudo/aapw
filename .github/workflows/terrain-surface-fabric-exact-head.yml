name: Terrain Surface Fabric Exact Head

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/terrain.js'
      - 'src/3d/world/terrainSurfaceFabric.js'
      - 'src/3d/world/terrainEnvironmentProfiles.js'
      - 'scripts/checkTerrainSurfaceFabric.mjs'
      - '.github/workflows/terrain-surface-fabric-exact-head.yml'
  push:
    branches:
      - codex/buzul-muhafizi-terrain-environment-fabric-20260907

permissions:
  contents: read

jobs:
  terrain-surface-fabric:
    name: Exact-head terrain surface fabric contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: JavaScript syntax
        run: |
          node --check src/3d/world/terrain.js
          node --check src/3d/world/terrainSurfaceFabric.js
          node --check src/3d/world/terrainEnvironmentProfiles.js
          node --check scripts/checkTerrainSurfaceFabric.mjs

      - name: Terrain surface fabric contract
        run: node scripts/checkTerrainSurfaceFabric.mjs

      - name: Diff hygiene
        run: git diff --check
