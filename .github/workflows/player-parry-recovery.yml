name: Player Parry Recovery

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/player.js'
      - 'src/3d/input.js'
      - 'src/3d/camera.js'
      - 'src/3d/gameLoopHelpers.js'
      - 'src/3d/ui/touchJoystick.js'
      - 'src/3d/ui/controlsHelp.js'
      - 'scripts/checkPlayerCombatVerticalSlice.mjs'
      - 'scripts/checkPlayerGeographicCameraOcclusion.mjs'
      - 'scripts/checkPlayerMeleeCombo.mjs'
      - 'scripts/checkTouchJoystickInputContract.js'
      - 'scripts/checkPlayerParryRecovery.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferDrop.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferRuntime.mjs'
      - 'scripts/checkPlayerGamepadInput.mjs'
      - 'scripts/checkPlayerGamepadRuntime.mjs'
      - 'scripts/checkPlayerLockOnRuntime.mjs'
      - 'scripts/checkPlayerDodgeIFrameRuntime.mjs'
      - 'scripts/checkPlayerHitStaggerRuntime.mjs'
      - 'scripts/checkPlayerStaminaDodgeRuntime.mjs'
      - 'scripts/checkPlayerTouchCombatRuntime.mjs'
      - 'scripts/checkPlayerGuardImpactExhaustionRuntime.mjs'
      - 'scripts/checkPlayerEquipmentAssetReadiness.mjs'
      - 'scripts/checkPlayerEquipmentSocketRuntime.mjs'
      - '.github/workflows/player-combat-vertical-slice.yml'
      - '.github/workflows/player-recovery-attack-buffer-drop.yml'
      - '.github/workflows/player-combat-recovery-input-isolation.yml'
      - '.github/workflows/player-stamina-dodge.yml'
      - '.github/workflows/player-guard-impact-exhaustion.yml'
      - '.github/workflows/player-gamepad-parity.yml'
      - '.github/workflows/player-grounding-combat-contract.yml'
      - '.github/workflows/player-hit-stagger-runtime.yml'
      - '.github/workflows/player-touch-combat-runtime.yml'
      - '.github/workflows/player-equipment-socket-runtime.yml'
      - '.github/workflows/player-parry-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parry-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          BASE="$(git merge-base HEAD origin/main)"
          test "$BASE" = "$(git rev-parse origin/main)"
          mapfile -t files < <(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "${files[@]}"
          for file in "${files[@]}"; do
            case "$file" in
              src/3d/gameplay/player.js|src/3d/input.js|src/3d/camera.js|src/3d/gameLoopHelpers.js|src/3d/ui/touchJoystick.js|src/3d/ui/controlsHelp.js|scripts/checkPlayerCombatVerticalSlice.mjs|scripts/checkPlayerGeographicCameraOcclusion.mjs|scripts/checkPlayerMeleeCombo.mjs|scripts/checkTouchJoystickInputContract.js|scripts/checkPlayerParryRecovery.mjs|scripts/checkPlayerRecoveryAttackBufferDrop.mjs|scripts/checkPlayerRecoveryAttackBufferRuntime.mjs|scripts/checkPlayerGamepadInput.mjs|scripts/checkPlayerGamepadRuntime.mjs|scripts/checkPlayerLockOnRuntime.mjs|scripts/checkPlayerDodgeIFrameRuntime.mjs|scripts/checkPlayerHitStaggerRuntime.mjs|scripts/checkPlayerStaminaDodgeRuntime.mjs|scripts/checkPlayerTouchCombatRuntime.mjs|scripts/checkPlayerGuardImpactExhaustionRuntime.mjs|scripts/checkPlayerEquipmentAssetReadiness.mjs|scripts/checkPlayerEquipmentSocketRuntime.mjs|.github/workflows/player-combat-vertical-slice.yml|.github/workflows/player-recovery-attack-buffer-drop.yml|.github/workflows/player-combat-recovery-input-isolation.yml|.github/workflows/player-stamina-dodge.yml|.github/workflows/player-guard-impact-exhaustion.yml|.github/workflows/player-gamepad-parity.yml|.github/workflows/player-grounding-combat-contract.yml|.github/workflows/player-hit-stagger-runtime.yml|.github/workflows/player-touch-combat-runtime.yml|.github/workflows/player-equipment-socket-runtime.yml|.github/workflows/player-parry-recovery.yml) ;;
              *) echo "Unexpected path: $file" >&2; exit 1 ;;
            esac
          done
          changed="$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/player.js
          node --check src/3d/camera.js
          node --check src/3d/gameLoopHelpers.js
          node --check src/3d/ui/touchJoystick.js
          node --check scripts/checkPlayerGeographicCameraOcclusion.mjs
          node --check scripts/checkTouchJoystickInputContract.js
          node --check scripts/checkPlayerParryRecovery.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferRuntime.mjs
          node --check scripts/checkPlayerGamepadInput.mjs
          node --check scripts/checkPlayerGamepadRuntime.mjs
          node --check scripts/checkPlayerLockOnRuntime.mjs
          node --check scripts/checkPlayerDodgeIFrameRuntime.mjs
          node --check scripts/checkPlayerHitStaggerRuntime.mjs
          node --check scripts/checkPlayerStaminaDodgeRuntime.mjs
          node --check scripts/checkPlayerTouchCombatRuntime.mjs
          node --check scripts/checkPlayerGuardImpactExhaustionRuntime.mjs
          node --check scripts/checkPlayerEquipmentAssetReadiness.mjs
          node --check scripts/checkPlayerEquipmentSocketRuntime.mjs
      - name: Geographic camera regression
        run: node scripts/checkPlayerGeographicCameraOcclusion.mjs
      - name: Touch input lifecycle contract
        run: node scripts/checkTouchJoystickInputContract.js
      - name: Parry recovery regression
        run: |
          node scripts/checkPlayerParryRecovery.mjs
          node scripts/checkPlayerRecoveryAttackBufferDrop.mjs
      - name: Stamina dodge standing contract
        id: stamina
        run: node scripts/checkPlayerStaminaDodge.mjs
      - name: Combat vertical slice standing contract
        id: vertical
        if: success() || failure()
        run: node scripts/checkPlayerCombatVerticalSlice.mjs
      - name: Immutable defense damage standing contract
        id: immutable
        if: success() || failure()
        run: node scripts/checkPlayerImmutableDefenseDamage.mjs
      - name: Require standing player combat contracts
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.stamina.outcome }}" != failure
          test "${{ steps.vertical.outcome }}" != failure
          test "${{ steps.immutable.outcome }}" != failure
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
