name: player-input-intent-normalizer

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerInputIntentNormalizer.js'
      - 'scripts/checkPlayerInputIntentNormalizer.mjs'
      - '.github/workflows/player-input-intent-normalizer.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerInputIntentNormalizer.js
      - name: Executable regression
        run: node scripts/checkPlayerInputIntentNormalizer.mjs
      - name: Runtime boundary
        run: |
          ! grep -nE "EditorMaterialStudio|document\.|window\.|three" src/3d/gameplay/playerInputIntentNormalizer.js
      - name: Diff hygiene
        run: git diff --check
