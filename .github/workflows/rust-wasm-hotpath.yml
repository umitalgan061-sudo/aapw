name: rust-wasm-hotpath

on:
  push:
    paths:
      - 'wasm/**'
      - 'src/engine-ts/wasmHotPath.ts'
      - 'src/engine-ts/workerSimulation.ts'
      - 'src/engine-ts/wasmHotPathVectors.ts'
      - 'scripts/checkWasmHotPath.mjs'
      - 'scripts/generateWasmHotPathMatrix.mjs'
      - 'scripts/buildWasmHotPath.mjs'
      - 'artifacts/wasm-hotpath/**'
      - '.github/workflows/rust-wasm-hotpath.yml'
  pull_request:
    paths:
      - 'wasm/**'
      - 'src/engine-ts/wasmHotPath.ts'
      - 'src/engine-ts/workerSimulation.ts'
      - 'src/engine-ts/wasmHotPathVectors.ts'
      - 'scripts/checkWasmHotPath.mjs'
      - 'scripts/generateWasmHotPathMatrix.mjs'
      - 'scripts/buildWasmHotPath.mjs'
      - 'artifacts/wasm-hotpath/**'
      - '.github/workflows/rust-wasm-hotpath.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Generate deterministic vector corpus
        run: node scripts/generateWasmHotPathMatrix.mjs
      - name: Check Rust target
        run: cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Build release WASM
        run: npm run build:wasm
      - name: Typecheck
        run: npm run typecheck
      - name: Validate hot-path contract and corpus
        run: npm run verify:wasm-hotpath
      - name: Ensure release asset exists
        run: test -s public/wasm/aapw_hotpath.wasm
      - name: Materialize generated assets on non-main pushes
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/wasm-hotpath/vectors public/wasm/aapw_hotpath.wasm
          if git diff --cached --quiet; then
            echo 'Generated WASM asset and conformance corpus are unchanged.'
          else
            git commit -m 'ci(wasm): materialize release hotpath and conformance corpus [skip ci]'
            git push
          fi
