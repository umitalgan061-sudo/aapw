name: rust-wasm-hotpath

on:
  push:
    paths:
      - 'wasm/**'
      - 'src/engine-ts/wasmHotPath.ts'
      - 'src/engine-ts/workerSimulation.ts'
      - 'scripts/checkWasmHotPath.mjs'
      - 'scripts/generateWasmHotPathMatrix.mjs'
      - 'artifacts/wasm-hotpath/**'
      - '.github/workflows/rust-wasm-hotpath.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Generate parity corpus
        run: node scripts/generateWasmHotPathMatrix.mjs
      - name: Check Rust target
        run: cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Typecheck
        run: npm run typecheck
      - name: Validate parity contract
        run: node scripts/checkWasmHotPath.mjs
      - name: Materialize generated corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/wasm-hotpath/validation-matrix.ndjson
          if git diff --cached --quiet; then
            echo 'Generated parity corpus is unchanged.'
          else
            git commit -m 'ci(wasm): materialize deterministic hot-path parity corpus [skip ci]'
            git push
          fi
