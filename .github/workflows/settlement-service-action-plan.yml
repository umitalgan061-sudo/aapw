name: Settlement Service Action Plan

on:
  pull_request:
    paths:
      - 'src/3d/modern/settlementServiceInteraction.ts'
      - 'src/3d/modern/settlementServiceActionPlan.ts'
      - 'tests/modern/settlementServiceActionPlan.test.ts'
      - '.github/workflows/settlement-service-action-plan.yml'
  push:
    branches:
      - main

jobs:
  settlement-service-action-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/modern/settlementServiceActionPlan.test.ts --reporter=dot
