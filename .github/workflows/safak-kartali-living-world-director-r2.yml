name: Safak Kartali living world director runtime R2

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldDirectorRuntimeAdapter.js'
      - 'src/3d/gameplay/livingWorldOccupationSchedule.js'
      - 'src/3d/gameplay/livingWorldEcologyPolicy.js'
      - 'src/3d/gameplay/livingWorldEventDirectorAdapter.js'
      - 'scripts/checkSafakKartaliLivingWorldDirectorRuntime.mjs'
      - 'scripts/generateSafakKartaliLivingWorldDirectorMatrix.mjs'
      - 'scripts/livingWorldDirectorScenarioMatrixA.mjs'
      - 'scripts/livingWorldDirectorScenarioMatrixB.mjs'
      - '.github/workflows/safak-kartali-living-world-director-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check scripts/checkSafakKartaliLivingWorldDirectorRuntime.mjs
          node --check scripts/generateSafakKartaliLivingWorldDirectorMatrix.mjs
          node --check scripts/livingWorldDirectorScenarioMatrixA.mjs
          node --check scripts/livingWorldDirectorScenarioMatrixB.mjs
      - name: Runtime acceptance proof
        run: node scripts/checkSafakKartaliLivingWorldDirectorRuntime.mjs
      - name: Generate deterministic 4096-case evidence
        run: |
          set -euo pipefail
          node scripts/generateSafakKartaliLivingWorldDirectorMatrix.mjs
          test "$(wc -l < artifacts/safak-kartali-living-world-director-matrix.jsonl)" -eq 4097
          test "$(jq -s 'length' artifacts/safak-kartali-living-world-director-matrix.jsonl)" -eq 4097
          test "$(jq -s '[.[].digest] | unique | length' artifacts/safak-kartali-living-world-director-matrix.jsonl)" -gt 1
      - name: Persist deterministic evidence artifact
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/safak-kartali-living-world-director-matrix.jsonl
          if git diff --cached --quiet; then
            echo 'No evidence artifact changes.'
            exit 0
          fi
          git commit -m 'test(living-world): materialize 4096-case director evidence'
          git push origin HEAD:${GITHUB_HEAD_REF:-agent/safak-kartali-living-world-20260915-r2}
