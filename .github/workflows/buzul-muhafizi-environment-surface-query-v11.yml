name: Buzul Muhafızı Environment Surface Query v11

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentSurfaceQuery.js'
      - 'scripts/checkEnvironmentSurfaceQuery.mjs'
      - '.github/workflows/buzul-muhafizi-environment-surface-query-v11.yml'
  push:
    branches:
      - main
    paths:
      - 'src/3d/world/environmentSurfaceQuery.js'
      - 'scripts/checkEnvironmentSurfaceQuery.mjs'
      - '.github/workflows/buzul-muhafizi-environment-surface-query-v11.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/world/environmentSurfaceQuery.js|scripts/checkEnvironmentSurfaceQuery.mjs|.github/workflows/buzul-muhafizi-environment-surface-query-v11.yml) ;;
              *) echo "Unexpected changed path: $file"; exit 1 ;;
            esac
          done <<< "$files"
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Syntax
        run: node --check src/3d/world/environmentSurfaceQuery.js && node --check scripts/checkEnvironmentSurfaceQuery.mjs
      - name: Executable contract
        run: node scripts/checkEnvironmentSurfaceQuery.mjs
      - name: Runtime/editor boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/world/environmentSurfaceQuery.js
          ! grep -R "canonical.*=.*true\|mutat.*terrain\|createMesh\|new THREE" src/3d/world/environmentSurfaceQuery.js
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
