name: Kizil Ufuk Player Combat Presentation Window
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatPresentationWindow.ts'
      - 'scripts/checkPlayerCombatPresentationWindow.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-presentation-window.yml'
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/checkPlayerCombatPresentationWindow.mjs
      - run: node --check scripts/checkPlayerCombatPresentationWindow.mjs
