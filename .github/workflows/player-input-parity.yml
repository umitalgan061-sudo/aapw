name: Player Input Parity
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerInputParity.js'
      - 'scripts/checkPlayerInputParity.mjs'
      - '.github/workflows/player-input-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD
      - name: Diff cap
        run: |
          changed=$(git diff --numstat "$(git rev-parse origin/main)...HEAD" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerInputParity.js
          node --check scripts/checkPlayerInputParity.mjs
      - name: Contract
        run: node scripts/checkPlayerInputParity.mjs
