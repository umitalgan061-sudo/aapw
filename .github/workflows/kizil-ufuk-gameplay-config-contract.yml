name: Kızıl Ufuk Gameplay Config Contract

on:
  push:
    branches: ['main', 'agent/kizil-ufuk-player-authority-v7-20260917-r1']
  pull_request:
    branches: ['main']
    paths:
      - 'src/3d/gameplay/**Config.ts'
      - 'src/3d/gameplay/**Config.js'
      - 'tests/modern/gameplayConfigContracts.test.ts'
      - 'scripts/checkKizilUfukGameplayConfig.mjs'
      - '.github/workflows/kizil-ufuk-gameplay-config-contract.yml'

permissions:
  contents: read

concurrency:
  group: kizil-ufuk-gameplay-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Exact main ancestry
        run: git fetch origin main --no-tags && git merge-base --is-ancestor origin/main "$GITHUB_SHA"

      - name: Changed-line cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Gameplay contract executable proof
        run: node --experimental-strip-types scripts/checkKizilUfukGameplayConfig.mjs

      - name: Gameplay contract Vitest
        run: npx vitest run tests/modern/gameplayConfigContracts.test.ts
