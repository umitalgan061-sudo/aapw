name: One-shot Adaptive Foundation Cluster

on:
  push:
    branches:
      - codex/foundation-grounding-20260821
    paths:
      - '.github/workflows/one-shot-adaptive-foundation-cluster.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch adaptive foundation cells
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          path = Path('src/3d/world/terrainFoundationConformer.js')
          text = path.read_text()
          text = replace_once(
              text,
              "Runtime structure foundations use a four-cell circle union over the AABB. Each quarter-cell circle\n * encloses its entire rectangular cell, so the full building base is still guaranteed to be flat, but\n * long/narrow structures no longer flatten the huge empty corners of one AABB-enclosing circle.",
              "Runtime structure foundations use an adaptive four-cell circle union over the AABB. Near-square\n * footprints use a 2x2 grid; long/narrow footprints rotate the same four-pad budget into 4x1 or 1x4.\n * Every circle encloses its rectangular cell, so the full base stays flat while narrow structures avoid\n * the side overreach a forced 2x2 grid still produced.",
              'module comment',
          )
          text = replace_once(
              text,
              "id: 'runtime-structure-foundation-conform-2026-08-24-v7-footprint-cluster',\n\tfootprintMode: 'aabb-quarter-cell-circle-union',\n\tclusterColumns: 2,\n\tclusterRows: 2,\n\tmaximumClusterPads: 4,",
              "id: 'runtime-structure-foundation-conform-2026-08-24-v8-adaptive-footprint-cluster',\n\tfootprintMode: 'aabb-adaptive-four-cell-circle-union',\n\tdefaultClusterColumns: 2,\n\tdefaultClusterRows: 2,\n\tlongAxisClusterCells: 4,\n\tlongAxisAspectThreshold: 2.5,\n\tmaximumClusterPads: 4,",
              'policy',
          )
          old = """function createQuarterCellPads(bounds, targetHeight, key, safeInnerMargin, safeFeather) {
\tconst width = bounds.maxX - bounds.minX;
\tconst depth = bounds.maxZ - bounds.minZ;
\tconst columns = width > 0 ? TERRAIN_FOUNDATION_CONFORM_POLICY.clusterColumns : 1;
\tconst rows = depth > 0 ? TERRAIN_FOUNDATION_CONFORM_POLICY.clusterRows : 1;
\tconst cellWidth = columns > 0 ? width / columns : 0;
\tconst cellDepth = rows > 0 ? depth / rows : 0;
"""
          new = """function chooseAdaptiveGrid(width, depth) {
\tif (width <= 0 && depth <= 0) return { columns: 1, rows: 1 };
\tif (depth <= 0) return { columns: TERRAIN_FOUNDATION_CONFORM_POLICY.longAxisClusterCells, rows: 1 };
\tif (width <= 0) return { columns: 1, rows: TERRAIN_FOUNDATION_CONFORM_POLICY.longAxisClusterCells };
\tconst aspect = width / depth;
\tif (aspect >= TERRAIN_FOUNDATION_CONFORM_POLICY.longAxisAspectThreshold) {
\t\treturn { columns: TERRAIN_FOUNDATION_CONFORM_POLICY.longAxisClusterCells, rows: 1 };
\t}
\tif (aspect <= 1 / TERRAIN_FOUNDATION_CONFORM_POLICY.longAxisAspectThreshold) {
\t\treturn { columns: 1, rows: TERRAIN_FOUNDATION_CONFORM_POLICY.longAxisClusterCells };
\t}
\treturn {
\t\tcolumns: TERRAIN_FOUNDATION_CONFORM_POLICY.defaultClusterColumns,
\t\trows: TERRAIN_FOUNDATION_CONFORM_POLICY.defaultClusterRows,
\t};
}

function createAdaptiveCellPads(bounds, targetHeight, key, safeInnerMargin, safeFeather) {
\tconst width = bounds.maxX - bounds.minX;
\tconst depth = bounds.maxZ - bounds.minZ;
\tconst { columns, rows } = chooseAdaptiveGrid(width, depth);
\tconst cellWidth = width / columns;
\tconst cellDepth = depth / rows;
"""
          text = replace_once(text, old, new, 'adaptive grid helper')
          text = replace_once(
              text,
              "const pads = createQuarterCellPads(bounds, targetHeight, key, safeInnerMargin, safeFeather);",
              "const pads = createAdaptiveCellPads(bounds, targetHeight, key, safeInnerMargin, safeFeather);",
              'adaptive grid call',
          )
          path.write_text(text)

          test_path = Path('scripts/checkTerrainFoundationConformer.mjs')
          test = test_path.read_text()
          test = replace_once(
              test,
              "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.footprintMode, 'aabb-quarter-cell-circle-union');",
              "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.footprintMode, 'aabb-adaptive-four-cell-circle-union');",
              'policy assertion',
          )
          test = replace_once(
              test,
              "assert.equal(longBuilt.pads.length, 4);\nconst compactSampler = createHeightSampler(123, undefined, longBuilt.pads);",
              "assert.equal(longBuilt.pads.length, 4);\nassert(longBuilt.pads.every((pad) => Math.abs(pad.z) < 1e-9),\n\t'100x10m hall should rotate the four-cell budget into a 4x1 grid along its long axis');\nassert.deepEqual(longBuilt.pads.map((pad) => Number(pad.x.toFixed(1))), [-37.5, -12.5, 12.5, 37.5]);\nassert(longBuilt.pads.every((pad) => pad.innerRadiusMeters < 14),\n\t'adaptive long-axis cells must materially reduce the old 2x2 cell radius');\nconst compactSampler = createHeightSampler(123, undefined, longBuilt.pads);",
              'long hall layout assertions',
          )
          test = replace_once(
              test,
              "const sideProbeBase = createHeightSampler(123, undefined, [])(0, 35);\nassert.equal(compactSampler(0, 35), sideProbeBase,\n\t'compact footprint cluster must not flatten distant side terrain that lies inside the old enclosing-circle envelope');",
              "const baseSampler = createHeightSampler(123, undefined, []);\nconst nearSideProbeBase = baseSampler(0, 20);\nassert.equal(compactSampler(0, 20), nearSideProbeBase,\n\t'adaptive 4x1 cells must preserve side terrain that the previous forced 2x2 cluster still feathered');\nconst sideProbeBase = baseSampler(0, 35);\nassert.equal(compactSampler(0, 35), sideProbeBase,\n\t'compact footprint cluster must not flatten distant side terrain that lies inside the old enclosing-circle envelope');",
              'side probe assertions',
          )
          test = replace_once(
              test,
              "PASS: compact quarter-cell foundation clusters cover the full AABB without the old enclosing-circle side overreach",
              "PASS: adaptive four-cell foundation clusters cover the full AABB and rotate along long footprints to reduce side overreach",
              'pass message',
          )
          test_path.write_text(test)
          PY

      - name: Validate foundation contracts
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/terrainFoundationConformer.js
          node --check scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkTerrainFoundationBatchRemoval.mjs
          node scripts/checkSettlementFoundationAuthority.mjs
          node scripts/checkVillageFootprintGrounding.mjs

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name "AAPW automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/3d/world/terrainFoundationConformer.js scripts/checkTerrainFoundationConformer.mjs
          git diff --cached --check
          git commit -m "feat(world): adapt foundation cluster to footprint aspect"
          git push origin HEAD:codex/foundation-grounding-20260821
