name: Settlement Route Summary

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementRouteSummary.ts'
      - 'scripts/checkSettlementRouteSummary.mjs'
      - '.github/workflows/settlement-route-summary.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/checkSettlementRouteSummary.mjs
      - run: node --check scripts/checkSettlementRouteSummary.mjs
