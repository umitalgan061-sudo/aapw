name: Run 215 World Editor Transform Controls

on:
  push:
    branches:
      - agent/run215-world-editor-transform-controls
    paths:
      - '.github/workflows/run215-world-editor-transform-controls.yml'
      - 'src/3d/editor/worldEditor.js'
      - 'scripts/checkRun215WorldEditorTransformControls.js'
      - 'editor.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting main concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)"
          tail -n 120 GOVERNANCE.md
          tail -n 80 3D_GAME_PROGRESS.md
          tail -n 80 DECISIONS.md
          tail -n 80 QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'Eşzamanlılık Kontrolü' GOVERNANCE.md
      - name: Install Playwright outside project manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and additive gates
        run: |
          set -euo pipefail
          node --check src/3d/editor/worldEditor.js
          node --check scripts/checkRun214WorldEditorFoundation.js
          node --check scripts/checkRun215WorldEditorTransformControls.js
          node scripts/checkWorldEditorFoundation.js
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
          git diff --numstat "$(git rev-parse origin/main)" -- editor.html src/3d/editor/worldEditor.js scripts/checkRun215WorldEditorTransformControls.js .github/workflows/run215-world-editor-transform-controls.yml | awk '$2 != 0 { exit 1 }'
      - name: Existing editor baseline proof
        run: node scripts/checkRun214WorldEditorFoundation.js
      - name: Focused transform controls desktop mobile proof
        run: node scripts/checkRun215WorldEditorTransformControls.js
      - name: Existing game pre-final smoke
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run215-smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run215-smoke.log")"
          test "$PASS_COUNT" -ge 34
          grep -F 'zero console/page errors' "$RUNNER_TEMP/run215-smoke.log"
          echo "RUN215_SMOKE_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"
      - name: PWA performance determinism and world safety gates
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/collectPerfSnapshot.js run215 | tee "$RUNNER_TEMP/run215-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run215-perf-trend.log"
          PERF_ROW="$(tail -n 1 perf_log.csv)"
          echo "RUN215_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
      - name: Self-review gate
        run: |
          set -euo pipefail
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' src/3d/editor/worldEditor.js scripts/checkRun215WorldEditorTransformControls.js; then exit 1; fi
          grep -F 'transformSelectionObserver.disconnect();' src/3d/editor/worldEditor.js
          grep -F 'handle.geometry.dispose();' src/3d/editor/worldEditor.js
          grep -F 'handle.material.dispose();' src/3d/editor/worldEditor.js
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
      - name: Append verified Run215 records
        run: |
          set -euo pipefail
          cat >> 3D_GAME_PROGRESS.md <<'EOF'

          ## Run 215 — World Editor transform authoring controls
          - Extended the isolated World Editor with an additive transform-authoring layer for normal editable objects: visible X/Y/Z move, rotate and scale handles plus W/E/R shortcuts.
          - Added World/Local orientation switching (button + Q shortcut). Translation continues to reuse the editor's existing Snap state and defaults to 1 metre; rotation uses a 15° snapped step when Snap is enabled.
          - Gizmo changes write back into the existing Inspector and Hierarchy; Inspector remains the same scene owner. Instanced formation groups remain intentionally excluded from individual transform editing.
          - Focused desktop/mobile Chromium proof, Run214 editor regression proof, 34+ game smoke, PWA/cache/installability, mobile render budget, seeded RNG/world-reference, terrain-seat and road-network safety gates PASS with zero console/page errors.
          - Memory-leak checklist: one MutationObserver + pointer listeners added for transform authoring; pagehide disconnects/removes listeners and disposes all gizmo geometry/material resources. OrbitControls are disabled only while dragging and restored on pointerup.
          - World Evolution delta: roads +0 km; coverage +0; castles +0; NPCs +0; events +0; creatures +0. Existing desktop/mobile world coverage is unchanged.
          - Technical debt: the editor now has functional transform controls, but the exact upstream Three.js r160 `TransformControls.js` vendor file is still not copied into the repo; this run uses an editor-owned compatible gizmo to preserve additive-only/PWA boundaries. Risk: LOW. Confidence: 4/5.
          - Next safe step: either vendor the exact r160 TransformControls implementation as a no-runtime-ownership replacement layer, or continue editor scene rehydration for serialized instance groups; do not touch owner-gated radius-5/game3d split/world-event checksum items.
          EOF
          cat >> DECISIONS.md <<'EOF'

          ## ADR-0233 — Keep editor transform authoring inside the existing scene owner
          **Risk:** LOW

          **Decision:** Add move/rotate/scale authoring as an additive gizmo layer inside `src/3d/editor/worldEditor.js`. It operates only on the editor's existing `selectedObject`, scene, Inspector and OrbitControls ownership. Normal objects are transformable; `InstancedMesh` formation groups remain read-only at the individual-instance level.

          **Why:** The editor already owns selection, transforms and JSON serialization. A second scene/state owner would create synchronization and disposal risk. Reusing the existing Inspector and Snap state keeps authoring deterministic and preserves the separation from game3d/RTS runtime ownership.

          **Alternatives considered:** embed controls into `game3d.js`; mutate RTS simulation state; make instance groups editable one-by-one; replace the existing editor scene. Rejected because they cross ownership boundaries or undermine GPU-instanced formation semantics.

          **Consequences:** W/E/R select translate/rotate/scale, Q toggles World/Local, drag operations update the existing Inspector immediately, and pagehide disposes the transform resources. The exact upstream Three.js r160 TransformControls vendor copy remains a follow-up maintenance improvement rather than a prerequisite for this editor-only behavior.

          **Affected systems:** `src/3d/editor/worldEditor.js`, focused Run215 test/CI, progress/perf/stable records. Existing 2D, game3d, RTS, deterministic world and PWA asset graph remain unchanged.

          **Rollback:** because the implementation is additive at the end of the editor module, a future owner-approved cleanup can remove the Run215 block; Run214 editor behavior remains the baseline.
          EOF
          TAG="stable-$(TZ=Europe/Istanbul date +%Y-%m-%d-%H%M)"
          echo "$TAG — Run215 World Editor transform controls; W/E/R, World/Local, 1m Snap contract and desktop/mobile regression gates verified." >> STABLE_TAGS.md
          echo "RUN215_STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Final remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
          git diff --numstat "$CURRENT_MAIN" -- editor.html src/3d/editor/worldEditor.js scripts/checkRun215WorldEditorTransformControls.js .github/workflows/run215-world-editor-transform-controls.yml | awk '$2 != 0 { exit 1 }'
      - name: Commit verified Run215 records and stable checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m 'docs(run215): record verified editor transform controls'
          git tag "$RUN215_STABLE_TAG"
          git push origin HEAD:agent/run215-world-editor-transform-controls
          git push origin "$RUN215_STABLE_TAG" || true
      - name: Upload Run215 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run215-world-editor-transform-controls
          path: artifacts/run215/*.png
          if-no-files-found: error
