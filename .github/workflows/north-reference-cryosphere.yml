name: North Reference Cryosphere

on:
  pull_request:
    paths:
      - 'src/3d/world/northReferenceCryosphere.js'
      - 'src/3d/world/worldReferenceMap.js'
      - 'src/3d/world/worldReferenceAlignment.js'
      - 'src/3d/config.js'
      - 'scripts/checkNorthReferenceCryosphere.mjs'
      - '.github/workflows/north-reference-cryosphere.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          node --check src/3d/world/northReferenceCryosphere.js
          node --check scripts/checkNorthReferenceCryosphere.mjs

      - name: Validate map-aligned north cryosphere
        run: node scripts/checkNorthReferenceCryosphere.mjs
