name: Kızıl Ufuk Player Equipment Socket Runtime

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentSocketRuntime.js'
      - 'scripts/checkPlayerEquipmentSocketRuntime.mjs'
      - '.github/workflows/kizil-ufuk-player-equipment-socket-runtime.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-equipment-socket-runtime-20260916-r11'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact changed-scope guard
        run: |
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha || 'origin/main' }}" HEAD | wc -l)" -le 3
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerEquipmentSocketRuntime.js
          node --check scripts/checkPlayerEquipmentSocketRuntime.mjs
      - name: Deterministic socket runtime proof
        run: |
          node scripts/checkPlayerEquipmentSocketRuntime.mjs
          node scripts/checkPlayerEquipmentSocketRuntime.mjs
      - name: Additive-only guard
        run: |
          git diff --numstat "${{ github.event.pull_request.base.sha || 'origin/main' }}" HEAD
          test "$(git diff --numstat "${{ github.event.pull_request.base.sha || 'origin/main' }}" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          test "$(git diff --numstat "${{ github.event.pull_request.base.sha || 'origin/main' }}" HEAD | awk '{d+=$2} END {print d+0}')" -eq 0
