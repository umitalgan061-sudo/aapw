name: World Asset Geography Planner

on:
  workflow_dispatch:
  push:
    branches:
      - codex/foundation-grounding-20260821
  pull_request:
    paths:
      - 'src/3d/world/worldAssetGeographyProfile.js'
      - 'src/3d/world/worldAssetRegionalAnchors.js'
      - 'src/3d/world/worldAssetGeographyDistributionPlanner.js'
      - 'src/3d/world/worldAssetTransitionField.js'
      - 'src/3d/world/worldAssetGeographyMaterialBridge.js'
      - 'src/3d/world/WorldAssetGeographyPlacementBridge.js'
      - 'scripts/checkWorldAssetGeographyDistributionPlanner.mjs'
      - 'scripts/checkWorldAssetGeographyMaterialBridge.mjs'
      - 'scripts/checkWorldAssetGeographyPlannerStress.mjs'
      - 'scripts/checkWorldAssetTransitionField.mjs'
      - 'scripts/checkWorldAssetBoundaryContinuity.mjs'
      - 'scripts/checkWorldAssetRegionalCoverage.mjs'

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Geography distribution planner
        run: node scripts/checkWorldAssetGeographyDistributionPlanner.mjs

      - name: Geography material bridge
        run: node scripts/checkWorldAssetGeographyMaterialBridge.mjs

      - name: Transition field
        run: node scripts/checkWorldAssetTransitionField.mjs

      - name: Boundary continuity
        run: node scripts/checkWorldAssetBoundaryContinuity.mjs

      - name: Regional coverage
        run: node scripts/checkWorldAssetRegionalCoverage.mjs

      - name: Large geography stress matrix
        run: node scripts/checkWorldAssetGeographyPlannerStress.mjs

      - name: Existing geography distribution contract
        run: node scripts/checkWorldAssetGeographyDistribution.mjs

      - name: Existing material geography matrix
        run: node scripts/checkWorldAssetMaterialGeographyMatrix.mjs

      - name: Existing geography stress contract
        run: node scripts/checkWorldAssetGeographyStress.mjs

      - name: Guard against canonical geometry writes
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const sources = [
            'src/3d/world/worldAssetGeographyProfile.js',
            'src/3d/world/worldAssetRegionalAnchors.js',
            'src/3d/world/worldAssetGeographyDistributionPlanner.js',
            'src/3d/world/worldAssetTransitionField.js',
            'src/3d/world/worldAssetGeographyMaterialBridge.js',
          ];
          for (const source of sources) {
            const text = fs.readFileSync(source, 'utf8');
            for (const term of ['setHeight', 'setY', 'terrainHeight =', 'waterLevel =']) {
              if (text.includes(term)) throw new Error(`${source} contains geometry-authority write: ${term}`);
            }
          }
          console.log('geometry-authority-guard=PASS');
          NODE

      - name: Print exact head
        run: git rev-parse HEAD
