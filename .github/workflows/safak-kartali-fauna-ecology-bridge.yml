name: safak-kartali-fauna-ecology-bridge

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaEcologyBridge.js'
      - 'scripts/checkLivingWorldFaunaEcologyBridge.mjs'
      - '.github/workflows/safak-kartali-fauna-ecology-bridge.yml'
  push:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaEcologyBridge.js'
      - 'scripts/checkLivingWorldFaunaEcologyBridge.mjs'
      - '.github/workflows/safak-kartali-fauna-ecology-bridge.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax and executable regression
        run: |
          node --check src/3d/gameplay/livingWorldFaunaEcologyBridge.js
          node --check scripts/checkLivingWorldFaunaEcologyBridge.mjs
          node scripts/checkLivingWorldFaunaEcologyBridge.mjs
      - name: Deterministic double run
        run: |
          node scripts/checkLivingWorldFaunaEcologyBridge.mjs > /tmp/fauna-a.txt
          node scripts/checkLivingWorldFaunaEcologyBridge.mjs > /tmp/fauna-b.txt
          cmp /tmp/fauna-a.txt /tmp/fauna-b.txt
      - name: Runtime/editor and placement boundaries
        run: |
          ! grep -nE "EditorMaterialStudio|from ['\"]three['\"]|EventBus|ActorRegistry" src/3d/gameplay/livingWorldFaunaEcologyBridge.js
          grep -n "MaterialAssignmentCore" src/3d/gameplay/livingWorldFaunaEcologyBridge.js
          grep -n "WorldAssetPlacementPipeline" src/3d/gameplay/livingWorldFaunaEcologyBridge.js
      - name: Exact-main ancestry and diff budget
        run: |
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
          changed=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}"...HEAD | awk '{a+=$1; d+=$2} END{print a+d+0}')
          echo "changed-line-budget=${changed}"
          test "$changed" -le 3000
