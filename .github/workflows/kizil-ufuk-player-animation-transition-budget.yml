name: Kızıl Ufuk Player Animation Transition Budget

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAnimationTransitionBudget.js'
      - 'scripts/checkKizilUfukPlayerAnimationTransitionBudget.mjs'
      - '.github/workflows/kizil-ufuk-player-animation-transition-budget.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-head ancestry
        run: |
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerAnimationTransitionBudget.js
          node --check scripts/checkKizilUfukPlayerAnimationTransitionBudget.mjs
      - name: Runtime contract
        run: node scripts/checkKizilUfukPlayerAnimationTransitionBudget.mjs
      - name: Shared runtime boundary
        run: |
          ! grep -R "EditorMaterialStudio\\|MaterialAssignmentCore\\|WorldAssetPlacementPipeline" src/3d/gameplay/playerAnimationTransitionBudget.js scripts/checkKizilUfukPlayerAnimationTransitionBudget.mjs
      - name: Diff budget
        run: |
          changed=$(git diff --numstat "$(git merge-base HEAD origin/main)" HEAD | awk '{add+=$1; del+=$2} END {print add+del+0}')
          test "$changed" -le 3000
