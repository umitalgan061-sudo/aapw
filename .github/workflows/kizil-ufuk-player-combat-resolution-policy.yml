name: Kizil Ufuk Player Combat Resolution Policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatResolutionPolicy.js'
      - 'scripts/checkPlayerCombatResolutionPolicy.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-resolution-policy.yml'
  push:
    branches:
      - main
      - 'agent/kizil-ufuk-combat-resolution-policy-*'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-main ancestry
        run: |
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatResolutionPolicy.js
      - name: Deterministic executable proof
        run: node scripts/checkPlayerCombatResolutionPolicy.mjs
      - name: Scope
        run: |
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | grep -c '^src/3d/gameplay/playerCombatResolutionPolicy.js$')" -eq 1
          test "$(printf '%s\n' "$files" | grep -c '^scripts/checkPlayerCombatResolutionPolicy.mjs$')" -eq 1
          test "$(printf '%s\n' "$files" | grep -c '^\.github/workflows/kizil-ufuk-player-combat-resolution-policy.yml$')" -eq 1
          test -z "$(printf '%s\n' "$files" | grep 'EditorMaterialStudio.js' || true)"
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
