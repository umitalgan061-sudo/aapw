name: player-hitbox-hurtbox-resolution

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerHitboxHurtboxResolution.js'
      - 'scripts/checkPlayerHitboxHurtboxResolution.mjs'
      - '.github/workflows/player-hitbox-hurtbox-resolution.yml'
  push:
    branches:
      - 'codex/kizil-ufuk-hitbox-hurtbox-resolution-20260909'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerHitboxHurtboxResolution.js
          node --check scripts/checkPlayerHitboxHurtboxResolution.mjs
      - name: Contract regression
        run: node scripts/checkPlayerHitboxHurtboxResolution.mjs
      - name: Scope and hygiene
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only origin/main...HEAD)
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$files" | grep -Fx '.github/workflows/player-hitbox-hurtbox-resolution.yml'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkPlayerHitboxHurtboxResolution.mjs'
          printf '%s\n' "$files" | grep -Fx 'src/3d/gameplay/playerHitboxHurtboxResolution.js'
          test -z "$(git diff --check origin/main...HEAD)"
          ! git diff origin/main...HEAD -- . ':!src/3d/gameplay/playerHitboxHurtboxResolution.js' ':!scripts/checkPlayerHitboxHurtboxResolution.mjs' ':!.github/workflows/player-hitbox-hurtbox-resolution.yml' | grep -E '^\+.*(EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|new THREE\.)'
