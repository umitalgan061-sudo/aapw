name: Terrain Environment Variant Policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/terrainEnvironmentVariantPolicy.js'
      - 'scripts/checkTerrainEnvironmentVariantPolicy.mjs'
      - '.github/workflows/terrain-environment-variant-policy.yml'
  push:
    branches:
      - codex/buzul-muhafizi-terrain-environment-fabric-20260907

permissions:
  contents: read

jobs:
  variant-policy:
    name: Habitat-driven authored asset diversity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check src/3d/world/terrainEnvironmentVariantPolicy.js
          node --check scripts/checkTerrainEnvironmentVariantPolicy.mjs
      - name: Habitat variant contract
        run: node scripts/checkTerrainEnvironmentVariantPolicy.mjs
      - name: Diff hygiene
        run: git diff --check
