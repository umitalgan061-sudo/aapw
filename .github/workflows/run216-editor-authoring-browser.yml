name: Run216 Editor Authoring Browser Proof

on:
  push:
    branches:
      - agent/run216-world-editor-transform-controls
    paths:
      - 'editor.html'
      - 'editor.css'
      - 'src/3d/editor/**'
      - 'scripts/checkRun216EditorAuthoringContract.js'
      - 'scripts/checkRun216EditorAuthoringBrowser.js'
      - '.github/workflows/run216-editor-authoring-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-authoring-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Concurrency and additive source gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun216EditorAuthoringContract.js
          node --check scripts/checkRun216EditorAuthoringBrowser.js
          node --check src/3d/editor/EditorClipboardController.js
          node --check src/3d/editor/EditorEditModeEnvironment.js
          node --check src/3d/editor/EditorRoadController.js
          node --check src/3d/editor/EditorTerrainPaintController.js
          git diff --check

      - name: Consolidated authoring contract
        run: node scripts/checkRun216EditorAuthoringContract.js

      - name: Install temporary Chromium proof tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run216-editor-authoring-tools"
          npm install --prefix "$RUNNER_TEMP/run216-editor-authoring-tools" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/run216-editor-authoring-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/run216-editor-authoring-tools/node_modules" >> "$GITHUB_ENV"

      - name: Desktop and mobile authoring proof
        run: node scripts/checkRun216EditorAuthoringBrowser.js

      - name: Final concurrency and additive source gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check

      - name: Upload authoring evidence
        uses: actions/upload-artifact@v4
        with:
          name: run216-editor-authoring-browser
          path: artifacts/run216-editor-authoring/*.png
          if-no-files-found: error
