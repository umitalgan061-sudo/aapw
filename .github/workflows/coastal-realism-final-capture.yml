name: Coastal Realism Final Capture
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Capture actual runtime
        run: node scripts/captureCoastalRealismProof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastal-realism-final-capture
          path: artifacts/coastal-realism-final-capture/
          if-no-files-found: warn
          retention-days: 3
