name: Kızıl Ufuk Player Combat Outcome Ledger

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatOutcomeLedger.js'
      - 'scripts/checkKizilUfukPlayerCombatOutcomeLedger.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-outcome-ledger.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatOutcomeLedger.js && node --check scripts/checkKizilUfukPlayerCombatOutcomeLedger.mjs
      - name: Deterministic contract
        run: node scripts/checkKizilUfukPlayerCombatOutcomeLedger.mjs
      - name: Changed-line guard
        run: |
          additions=$(git diff --numstat origin/main...HEAD | awk '{a += $1} END {print a + 0}')
          deletions=$(git diff --numstat origin/main...HEAD | awk '{d += $2} END {print d + 0}')
          total=$((additions + deletions))
          test "$total" -le 3000
