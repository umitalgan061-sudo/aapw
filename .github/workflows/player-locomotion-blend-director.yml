name: player-locomotion-blend-director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerLocomotionBlendDirector.js'
      - 'scripts/checkPlayerLocomotionBlendDirector.mjs'
      - '.github/workflows/player-locomotion-blend-director.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact-main ancestry
        run: git merge-base --is-ancestor origin/main HEAD
      - name: Focused scope
        run: |
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          echo "$files" | grep -Ev '^(src/3d/gameplay/playerLocomotionBlendDirector.js|scripts/checkPlayerLocomotionBlendDirector.mjs|.github/workflows/player-locomotion-blend-director.yml)$' && exit 1 || true
      - name: Diff budget
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax
        run: node --check src/3d/gameplay/playerLocomotionBlendDirector.js && node --check scripts/checkPlayerLocomotionBlendDirector.mjs
      - name: Runtime contract
        run: node scripts/checkPlayerLocomotionBlendDirector.mjs
      - name: Editor/runtime boundary
        run: '! grep -nE "EditorMaterialStudio|document\\.|window\\." src/3d/gameplay/playerLocomotionBlendDirector.js'
