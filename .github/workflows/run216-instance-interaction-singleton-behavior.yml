name: Run216 Instance Interaction Singleton Behavior

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorInstanceInteractionSingleton.js'
      - 'scripts/checkRun216InstanceInteractionSingletonBehavior.mjs'
      - '.github/workflows/run216-instance-interaction-singleton-behavior.yml'
  workflow_dispatch:

jobs:
  singleton-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/3d/editor/EditorInstanceInteractionSingleton.js
          node --check scripts/checkRun216InstanceInteractionSingletonBehavior.mjs
      - name: Execute singleton lifecycle behavior
        run: node scripts/checkRun216InstanceInteractionSingletonBehavior.mjs
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
