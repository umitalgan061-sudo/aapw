name: Kızıl Ufuk Player Combat Animation Final

on:
  pull_request:
    paths:
      - 'src/3d/game3d.ts'
      - 'src/3d/gameplay/player.ts'
      - 'src/3d/gameplay/playerConfig.ts'
      - 'src/3d/gameplay/playerEquipmentCombatProfile.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRuntime.ts'
      - 'src/3d/gameplay/playerAnimationDirector.ts'
      - 'src/3d/gameplay/playerAnimationDirector.legacy.js'
      - 'tests/modern/playerModernizationR1.test.ts'
      - 'tests/modern/playerEquipmentCombatRulesStrict.test.ts'
      - 'tests/modern/playerAnimationDirectorStrict.test.ts'
      - 'scripts/checkPlayerModernizationR1.mjs'
      - 'scripts/checkPlayerEquipmentCombatSceneContract.mjs'
      - 'scripts/checkPlayerAnimationDirector.mjs'
      - 'tsconfig.player-modernization.json'
      - 'tsconfig.player-equipment-strict.json'
      - 'tsconfig.player-animation-strict.json'
      - 'package.json'
      - '.github/workflows/kizil-ufuk-player-combat-animation-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kizil-ufuk-player-combat-animation-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: false
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package.json
      - name: Install toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Strict player typecheck
        run: npm run typecheck:player-modern
      - name: Strict player regression
        run: npm run test:player-modern
      - name: Strict equipment typecheck
        run: npm run typecheck:player-equipment-strict
      - name: Strict equipment regression
        run: npm run test:player-equipment-strict
      - name: Strict animation typecheck
        run: npm run typecheck:player-animation-strict
      - name: Strict animation regression
        run: npm run test:player-animation-strict
      - name: Shipped scene equipment/combat contract
        run: node scripts/checkPlayerEquipmentCombatSceneContract.mjs
      - name: Animation owner contract
        run: node scripts/checkPlayerAnimationDirector.mjs
      - name: Source ownership and material boundary proof
        run: node scripts/checkPlayerModernizationR1.mjs
      - name: Diff hygiene
        run: git diff --check
