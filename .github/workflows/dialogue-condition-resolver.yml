name: Dialogue Condition Resolver

on:
  push:
    paths:
      - 'src/3d/gameplay/dialogueConditionResolver.js'
      - 'scripts/checkDialogueConditionResolver.mjs'
      - '.github/workflows/dialogue-condition-resolver.yml'
  pull_request:
    paths:
      - 'src/3d/gameplay/dialogueConditionResolver.js'
      - 'scripts/checkDialogueConditionResolver.mjs'
      - '.github/workflows/dialogue-condition-resolver.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/dialogueConditionResolver.js
      - run: node scripts/checkDialogueConditionResolver.mjs
