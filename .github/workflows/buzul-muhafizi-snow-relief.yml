name: Buzul Muhafızı Snow Relief

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/terrainWindSnowExposure.js'
      - 'scripts/checkTerrainWindSnowExposure.mjs'
      - 'scripts/checkTerrainWindSnowOrographicFold.mjs'
      - 'scripts/checkTerrainWindSnowFieldMatrix.mjs'
      - 'scripts/checkTerrainWindSnowVisualEnvelope.mjs'
      - 'scripts/checkTerrainWindSnowRuntimeParity.mjs'
      - 'scripts/checkTerrainWindSnowReferenceFieldSweep.mjs'
      - 'scripts/checkTerrainWindSnowEdgeCases.mjs'
      - 'scripts/checkTerrainWindSnowToneChain.mjs'
      - 'scripts/checkWorldEnvironmentAcceptanceMatrix.mjs'
      - '.github/workflows/buzul-muhafizi-snow-relief.yml'
      - 'docs/TERRAIN_WIND_SNOW_SURFACE_CONTRACT.md'
      - 'docs/TERRAIN_WIND_SNOW_ACCEPTANCE_MATRIX.md'
      - 'docs/TERRAIN_WIND_SNOW_RUNBOOK.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Europe/Istanbul

jobs:
  production-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Re-read live main and enforce bounded production scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          MERGE_BASE="$(git merge-base HEAD "$LIVE_MAIN_SHA")"
          test "$MERGE_BASE" = "$LIVE_MAIN_SHA"
          ADD="$(git diff --numstat "$LIVE_MAIN_SHA...HEAD" | awk '{a+=$1} END {print a+0}')"
          DEL="$(git diff --numstat "$LIVE_MAIN_SHA...HEAD" | awk '{d+=$2} END {print d+0}')"
          TOTAL=$((ADD + DEL))
          echo "LIVE_MAIN_SHA=$LIVE_MAIN_SHA"
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "ADDITIONS=$ADD DELETIONS=$DEL TOTAL=$TOTAL"
          test "$TOTAL" -le 3000
          test "$TOTAL" -ge 250
          git diff --check "$LIVE_MAIN_SHA...HEAD"
          git diff --name-only "$LIVE_MAIN_SHA...HEAD" | while IFS= read -r path; do
            case "$path" in
              src/3d/world/terrainWindSnowExposure.js|scripts/checkTerrainWindSnowExposure.mjs|scripts/checkTerrainWindSnowOrographicFold.mjs|scripts/checkTerrainWindSnowFieldMatrix.mjs|scripts/checkTerrainWindSnowVisualEnvelope.mjs|scripts/checkTerrainWindSnowRuntimeParity.mjs|scripts/checkTerrainWindSnowReferenceFieldSweep.mjs|scripts/checkTerrainWindSnowEdgeCases.mjs|scripts/checkTerrainWindSnowToneChain.mjs|scripts/checkWorldEnvironmentAcceptanceMatrix.mjs|.github/workflows/buzul-muhafizi-snow-relief.yml|docs/TERRAIN_WIND_SNOW_SURFACE_CONTRACT.md|docs/TERRAIN_WIND_SNOW_ACCEPTANCE_MATRIX.md|docs/TERRAIN_WIND_SNOW_RUNBOOK.md) ;;
              *) echo "Unexpected path outside single-purpose snow-relief slice: $path"; exit 1 ;;
            esac
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime Three.js dependency
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.180.0

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/terrainWindSnowExposure.js
          node --check scripts/checkTerrainWindSnowExposure.mjs
          node --check scripts/checkTerrainWindSnowOrographicFold.mjs
          node --check scripts/checkTerrainWindSnowFieldMatrix.mjs
          node --check scripts/checkTerrainWindSnowVisualEnvelope.mjs
          node --check scripts/checkTerrainWindSnowRuntimeParity.mjs
          node --check scripts/checkTerrainWindSnowReferenceFieldSweep.mjs
          node --check scripts/checkTerrainWindSnowEdgeCases.mjs
          node --check scripts/checkTerrainWindSnowToneChain.mjs

      - name: Source-to-runtime parity contract
        run: node scripts/checkTerrainWindSnowRuntimeParity.mjs

      - name: Existing directional snow contract
        run: node scripts/checkTerrainWindSnowExposure.mjs

      - name: Existing orographic-fold contract
        run: node scripts/checkTerrainWindSnowOrographicFold.mjs

      - name: Exhaustive deterministic field matrix
        run: node scripts/checkTerrainWindSnowFieldMatrix.mjs

      - name: Spatial visual-envelope acceptance
        run: node scripts/checkTerrainWindSnowVisualEnvelope.mjs

      - name: Reference relief field sweep
        run: node scripts/checkTerrainWindSnowReferenceFieldSweep.mjs

      - name: Numerical edge-case acceptance
        run: node scripts/checkTerrainWindSnowEdgeCases.mjs

      - name: Renderer-facing snow tone chain
        run: node scripts/checkTerrainWindSnowToneChain.mjs

      - name: Install Playwright Chromium for shipped runtime proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Run shipped createScene world-environment evidence
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWorldEnvironmentAcceptanceMatrix.mjs

      - name: Final exact-main freshness and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN_SHA"
          test "$(git merge-base HEAD origin/main)" = "$LIVE_MAIN_SHA"
          git diff --check "$LIVE_MAIN_SHA...HEAD"
          ADD="$(git diff --numstat "$LIVE_MAIN_SHA...HEAD" | awk '{a+=$1} END {print a+0}')"
          DEL="$(git diff --numstat "$LIVE_MAIN_SHA...HEAD" | awk '{d+=$2} END {print d+0}')"
          test $((ADD + DEL)) -le 3000

      - name: Upload shipped visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buzul-muhafizi-snow-relief-proof
          if-no-files-found: warn
          path: artifacts/world-environment-acceptance/
