name: Run 183 Physical Wind Grass Final

on:
  push:
    branches: [agent/run183-wind-grass-final]
    paths:
      - 'scripts/applyRun180WindGrassAdditions.js'
      - 'scripts/checkWindGrassContractRun180.js'
      - 'scripts/checkWindGrassSceneIntegrationRun180.js'
      - 'scripts/recordRun183Governance.js'
      - 'scripts/fixtures/run180-scene-harness.html'
      - '.github/workflows/run183-wind-grass-final.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      BASE_SHA: 1726d7ec59b9c922e7a55077638803e8451cb7a6
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md && test -f 3D_GAME_PROGRESS.md && test -f DECISIONS.md && test -f QUESTIONS_FOR_OWNER.md
          if grep -q '^## ADR-0203 ' DECISIONS.md; then echo 'ADR-0203 already occupied on main'; exit 1; fi
          git log -12 --oneline
          tail -n 280 GOVERNANCE.md
          tail -n 220 3D_GAME_PROGRESS.md
          tail -n 220 DECISIONS.md
          tail -n 160 QUESTIONS_FOR_OWNER.md

      - name: Baseline full browser smoke on Run 182 main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run183-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run183-smoke-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run183-smoke-before.log")" -ge 34)
          git worktree remove "$BASELINE"

      - name: Apply additive physical wind grass
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/applyRun180WindGrassAdditions.js
          node --check scripts/checkWindGrassContractRun180.js
          node --check scripts/checkWindGrassSceneIntegrationRun180.js
          node --check scripts/recordRun183Governance.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          node scripts/applyRun180WindGrassAdditions.js
          node --check src/3d/sceneManager.js
          node --check src/3d/world/vegetation.js
          git diff --check
          test "$(git diff --numstat -- src/3d/sceneManager.js src/3d/world/vegetation.js | awk '{s += $2} END {print s + 0}')" -eq 0
          grep -F 'RUN180_WIND_GRASS_CONFIG' src/3d/sceneManager.js
          grep -F 'disposeVegetationWithWindGrassRun180' src/3d/world/vegetation.js

      - name: Isolated and real-scene grass contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWindGrassContractRun180.js | tee "$RUNNER_TEMP/run183-grass.log"
          GRASS_SUMMARY="$(grep '^\[checkWindGrassContractRun180\] PASS:' "$RUNNER_TEMP/run183-grass.log" | tail -n1 | sed 's/^\[checkWindGrassContractRun180\] PASS: //')"
          test -n "$GRASS_SUMMARY"
          echo "RUN183_GRASS_SUMMARY=$GRASS_SUMMARY" >> "$GITHUB_ENV"
          node scripts/checkWindGrassSceneIntegrationRun180.js | tee "$RUNNER_TEMP/run183-integration.log"
          INTEGRATION_SUMMARY="$(grep '^\[checkWindGrassSceneIntegrationRun180\] PASS:' "$RUNNER_TEMP/run183-integration.log" | tail -n1 | sed 's/^\[checkWindGrassSceneIntegrationRun180\] PASS: //')"
          test -n "$INTEGRATION_SUMMARY"
          echo "RUN183_INTEGRATION_SUMMARY=$INTEGRATION_SUMMARY" >> "$GITHUB_ENV"

      - name: Canonical map hydrology extent and world safety gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkTerrainVisualContract.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js

      - name: Determinism assets PWA and governance gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkWindGrassContractRun180.js
          node scripts/checkWindGrassSceneIntegrationRun180.js

      - name: Accessibility input and physics regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkJumpArcContract.js
          node scripts/checkEventBusContract.js
          node scripts/checkHealthStateContract.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js

      - name: Mobile streaming LOD and real render budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run183-mobile-budget.log"
          SAMPLE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run183-mobile-budget.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$SAMPLE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$SAMPLE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$SAMPLE")"
          test "$DRAW" -eq 35
          test "$TRI" -eq 195929
          echo "RUN183_MOBILE_BUDGET_SUMMARY=live mobile F2 ${DRAW} draw calls / ${TRI} triangles; grass is +1 draw call / +24,000 triangles over the 34 / 171,929 pre-grass baseline." >> "$GITHUB_ENV"

      - name: Full browser smoke after change and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run183-smoke-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run183-smoke-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run183-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run183-smoke-after.log"; then exit 1; fi
          echo "RUN183_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"

      - name: Mobile near and F4 far visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js

      - name: Upload Run 183 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run183-physical-wind-grass-final-evidence
          path: artifacts/run130-mobile/*.png
          if-no-files-found: error

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run183 | tee "$RUNNER_TEMP/run183-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run183-trend.log"
          PERF_ROW="$(grep '^\[collectPerfSnapshot\] sampled:' "$RUNNER_TEMP/run183-perf.log" | tail -n1 | sed 's/^\[collectPerfSnapshot\] sampled: //')"
          test -n "$PERF_ROW"
          test "$(printf '%s\n' "$PERF_ROW" | awk -F',' '{print NF}')" -eq 8
          echo "RUN183_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git checkout -- perf_log.csv

      - name: Senior self-review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- src/3d/sceneManager.js src/3d/world/vegetation.js | awk '{s += $2} END {print s + 0}')" -eq 0
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/applyRun180WindGrassAdditions.js scripts/checkWindGrassContractRun180.js scripts/checkWindGrassSceneIntegrationRun180.js scripts/recordRun183Governance.js; then exit 1; fi
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkWindGrassSceneIntegrationRun180.js
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if grep -q '^## ADR-0203 ' DECISIONS.md; then echo 'ADR-0203 occupied before publish'; exit 1; fi

      - name: Prepare Run 183 governance values
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN183_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN183_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Record Run 183 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun183Governance.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js

      - name: Final publish concurrency gate and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git ls-remote --tags origin "refs/tags/$RUN183_STABLE_TAG" | grep -q .; then echo 'stable tag already exists'; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/3d/sceneManager.js src/3d/world/vegetation.js 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "feat(world): add deterministic physical wind grass"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:agent/run183-wind-grass-final

      - name: Push stable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RUN183_STABLE_TAG"
          git push origin "$RUN183_STABLE_TAG"
