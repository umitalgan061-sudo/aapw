name: Buzul Muhafizi environment visual evidence v37
on:
  pull_request:
    paths:
      - 'src/3d/world/environmentVisualEvidence.js'
      - 'scripts/checkEnvironmentVisualEvidence.mjs'
      - '.github/workflows/buzul-muhafizi-environment-visual-evidence-v37.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-environment-visual-evidence-v37-20260909'

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify additive scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}")
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/world/environmentVisualEvidence.js|scripts/checkEnvironmentVisualEvidence.mjs|.github/workflows/buzul-muhafizi-environment-visual-evidence-v37.yml) ;;
              *) echo "out-of-scope file: $file"; exit 1 ;;
            esac
          done <<< "$files"
      - name: Syntax
        run: node --check src/3d/world/environmentVisualEvidence.js && node --check scripts/checkEnvironmentVisualEvidence.mjs
      - name: Executable regression
        run: node scripts/checkEnvironmentVisualEvidence.mjs
      - name: Contract boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "EditorMaterialStudio|from ['\"]three['\"]|createScene\(|terrain\.js|water\.js|sceneManager\.js|naturalGeology\.js|rivers\.js|roads\.js" src/3d/world/environmentVisualEvidence.js
          ! grep -nE "assets/models|assets/textures|\.glb|\.fbx|\.blend|base64" src/3d/world/environmentVisualEvidence.js scripts/checkEnvironmentVisualEvidence.mjs
      - name: Diff budget
        shell: bash
        run: |
          set -euo pipefail
          additions=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" | awk '{a+=$1; d+=$2} END {print a+0}')
          deletions=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" | awk '{a+=$1; d+=$2} END {print d+0}')
          total=$((additions + deletions))
          test "$total" -le 3000
