name: Buzul Settlement 210 Governance RCA

on:
  push:
    branches:
      - agent/buzul-settlement-210-governance-exact-main-20260903
  pull_request:
    branches: [main]
    paths:
      - scripts/checkWorldReferenceHydrologyExtent.js
      - scripts/checkFullWorldRuntimeCoverage.mjs
      - .github/workflows/buzul-settlement-210-governance-rca.yml

permissions:
  contents: read

concurrency:
  group: buzul-settlement-210-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-governance-rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Shipped 210m hydrology contract
        id: hydrology
        continue-on-error: true
        run: node scripts/checkWorldReferenceHydrologyExtent.js

      - name: Full-world runtime coverage contract
        id: coverage
        continue-on-error: true
        run: node scripts/checkFullWorldRuntimeCoverage.mjs

      - name: Run283 governance authority
        id: run283_authority
        continue-on-error: true
        run: node scripts/checkRun283FinalHeadGovernance.js

      - name: Seeded random policy
        id: seeded
        continue-on-error: true
        run: node scripts/checkSeededRandomPolicy.js

      - name: Assets manifest
        id: assets
        continue-on-error: true
        run: node scripts/checkAssetsManifest.js

      - name: Service worker cache
        id: sw
        continue-on-error: true
        run: node scripts/checkServiceWorkerCache.js

      - name: PWA installability
        id: pwa
        continue-on-error: true
        run: node scripts/checkPwaInstallability.js

      - name: Smoke registry
        id: smoke
        continue-on-error: true
        run: node scripts/checkSmokeCheckRegistry.js

      - name: World reference map
        id: map
        continue-on-error: true
        run: node scripts/checkWorldReferenceMap.js

      - name: World reference water mask
        id: water_mask
        continue-on-error: true
        run: node scripts/checkWorldReferenceWaterMask.js

      - name: World reference alignment
        id: alignment
        continue-on-error: true
        run: node scripts/checkWorldReferenceAlignment.js

      - name: Enforce exact governance result
        if: always()
        shell: bash
        env:
          HYDROLOGY: ${{ steps.hydrology.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          RUN283_AUTHORITY: ${{ steps.run283_authority.outcome }}
          SEEDED: ${{ steps.seeded.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          SW: ${{ steps.sw.outcome }}
          PWA: ${{ steps.pwa.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          MAP: ${{ steps.map.outcome }}
          WATER_MASK: ${{ steps.water_mask.outcome }}
          ALIGNMENT: ${{ steps.alignment.outcome }}
        run: |
          set -euo pipefail
          failures=0
          {
            echo '### Buzul exact-head governance matrix'
            echo
            echo '| Contract | Outcome |'
            echo '|---|---|'
            for pair in \
              "hydrology:$HYDROLOGY" \
              "full_world_coverage:$COVERAGE" \
              "run283_authority:$RUN283_AUTHORITY" \
              "seeded:$SEEDED" \
              "assets:$ASSETS" \
              "service_worker:$SW" \
              "pwa:$PWA" \
              "smoke_registry:$SMOKE" \
              "reference_map:$MAP" \
              "water_mask:$WATER_MASK" \
              "alignment:$ALIGNMENT"; do
              name="${pair%%:*}"
              outcome="${pair#*:}"
              echo "| $name | $outcome |"
              if [ "$outcome" != success ]; then
                echo "::error title=Buzul governance blocker::$name outcome=$outcome"
                failures=$((failures + 1))
              fi
            done
            echo
            echo "**failure_count:** $failures"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0

      - name: Final exact-main freshness
        if: always()
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
