name: NW G10 Canonical Relief Field

on:
  push:
    branches:
      - agent/buzul-muhafizi-g10-canonical-relief-exact-cdca07-20260814
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/worldReferenceReliefField.js'
      - 'scripts/checkNWG10CanonicalReliefField.mjs'
      - 'scripts/checkNWG10CanonicalReliefGuardBands.mjs'
      - 'scripts/checkNWG10CanonicalReliefNoGrid.mjs'
      - 'scripts/emitNWG10CanonicalReliefProbe.mjs'
      - 'godot/terrain-authoring/scripts/validate_g10_canonical_relief_field.gd'
      - '.github/workflows/nw-g10-canonical-relief-field.yml'
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: nw-g10-canonical-relief-field-${{ github.ref }}
  cancel-in-progress: true

env: { TZ: Europe/Istanbul }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true, ref: "${{ github.event.pull_request.head.sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact-main bounded scope and quota
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/worldReferenceReliefField.js|scripts/checkNWG10CanonicalReliefField.mjs|scripts/checkNWG10CanonicalReliefGuardBands.mjs|scripts/checkNWG10CanonicalReliefNoGrid.mjs|scripts/emitNWG10CanonicalReliefProbe.mjs|godot/terrain-authoring/scripts/validate_g10_canonical_relief_field.gd|\.github/workflows/nw-g10-canonical-relief-field.yml)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 7
          A="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1}END{print s+0}')"
          D="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2}END{print s+0}')"
          echo "NW G10 canonical relief quota additions=$A deletions=$D total=$((A+D))"
          test $((A+D)) -le 1000
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/worldReferenceWaterMask.js
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/worldReferenceHydrology.js
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/terrain.js src/3d/world/roads.js service-worker.js

      - name: Syntax deterministic morphology guard bands and no-grid contract
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceReliefField.js
          node --check scripts/checkNWG10CanonicalReliefField.mjs
          node --check scripts/checkNWG10CanonicalReliefGuardBands.mjs
          node --check scripts/checkNWG10CanonicalReliefNoGrid.mjs
          node --check scripts/emitNWG10CanonicalReliefProbe.mjs
          node scripts/checkWorldReferenceMap.js
          node scripts/checkNWG10CanonicalReliefField.mjs | tee "$RUNNER_TEMP/relief-a.log"
          node scripts/checkNWG10CanonicalReliefField.mjs | tee "$RUNNER_TEMP/relief-b.log"
          cmp "$RUNNER_TEMP/relief-a.log" "$RUNNER_TEMP/relief-b.log"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/relief-a.log"
          grep -F '"water": 60' "$RUNNER_TEMP/relief-a.log"
          grep -F '"land": 36' "$RUNNER_TEMP/relief-a.log"
          node scripts/checkNWG10CanonicalReliefGuardBands.mjs | tee "$RUNNER_TEMP/guard.log"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/guard.log"
          node scripts/checkNWG10CanonicalReliefNoGrid.mjs | tee "$RUNNER_TEMP/no-grid.log"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/no-grid.log"
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          node scripts/emitNWG10CanonicalReliefProbe.mjs --out=godot/terrain-authoring/.terrain3d-proof/g10-canonical-relief-probe.json
          cp godot/terrain-authoring/.terrain3d-proof/g10-canonical-relief-probe.json "$RUNNER_TEMP/probe-a.json"
          node scripts/emitNWG10CanonicalReliefProbe.mjs --out=godot/terrain-authoring/.terrain3d-proof/g10-canonical-relief-probe.json
          cmp "$RUNNER_TEMP/probe-a.json" godot/terrain-authoring/.terrain3d-proof/g10-canonical-relief-probe.json

      - name: Install and verify pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          grep -F 'res://addons/zylann.hterrain/plugin.cfg' godot/terrain-authoring/project.godot

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Terrain3D multi-region import persistence and LOD0 twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/editor.log"
          G10_CANONICAL_RELIEF_SUFFIX=a timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g10_canonical_relief_field.gd | tee "$RUNNER_TEMP/t3d-a.log"
          G10_CANONICAL_RELIEF_SUFFIX=b timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g10_canonical_relief_field.gd | tee "$RUNNER_TEMP/t3d-b.log"
          grep -F 'NW_G10_CANONICAL_RELIEF_TERRAIN3D_OK' "$RUNNER_TEMP/t3d-a.log"
          grep -F 'NW_G10_CANONICAL_RELIEF_TERRAIN3D_OK' "$RUNNER_TEMP/t3d-b.log"
          grep -F '"regions":4' "$RUNNER_TEMP/t3d-a.log"

      - name: HTerrain settlement road determinism and PWA safety
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkMobilePerfBudget.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nw-g10-canonical-relief-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: godot/terrain-authoring/.terrain3d-proof/g10-canonical-relief-probe.json
