name: Settlement Save Checkpoint Projection

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementSaveCheckpointProjection.js'
      - 'scripts/checkSettlementSaveCheckpointProjection.mjs'
      - '.github/workflows/settlement-save-checkpoint-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementSaveCheckpointProjection.js
      - name: Regression
        run: node scripts/checkSettlementSaveCheckpointProjection.mjs
      - name: Determinism
        run: |
          a=$(node scripts/checkSettlementSaveCheckpointProjection.mjs)
          b=$(node scripts/checkSettlementSaveCheckpointProjection.mjs)
          test "$a" = "$b"
      - name: Boundary
        run: |
          ! grep -R "EditorMaterialStudio\|three" src/3d/gameplay/settlementSaveCheckpointProjection.js
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
