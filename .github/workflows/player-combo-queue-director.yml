name: Player Combo Queue Director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerComboQueueDirector.js'
      - 'scripts/checkPlayerComboQueueDirector.mjs'
      - '.github/workflows/player-combo-queue-director.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerComboQueueDirector.js'
      - 'scripts/checkPlayerComboQueueDirector.mjs'
      - '.github/workflows/player-combo-queue-director.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact scope
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}")
          count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)
          test "$count" -eq 3
          printf '%s\n' "$files" | grep -Fx 'src/3d/gameplay/playerComboQueueDirector.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkPlayerComboQueueDirector.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/player-combo-queue-director.yml'
          ! printf '%s\n' "$files" | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline'
      - name: Diff budget
        shell: bash
        run: |
          set -euo pipefail
          additions=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$additions" -le 3000
      - name: Syntax
        run: node --check src/3d/gameplay/playerComboQueueDirector.js && node --check scripts/checkPlayerComboQueueDirector.mjs
      - name: Executable contract
        run: node scripts/checkPlayerComboQueueDirector.mjs
