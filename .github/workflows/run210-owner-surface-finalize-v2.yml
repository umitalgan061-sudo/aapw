name: Run 210 Owner Surface Finalize V2

on:
  push:
    branches:
      - agent/run210-owner-surface-texture-final
    paths:
      - '.github/workflows/run210-owner-surface-finalize-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Current-main concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          MERGE_BASE="$(git merge-base HEAD origin/main)"
          test "$CURRENT_MAIN" = "$MERGE_BASE"
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'ADR-0227' DECISIONS.md
      - name: Add owner surface to offline caches additively
        run: |
          set -euo pipefail
          if ! grep -Fq "Run210 owner surface offline cache" service-worker.js; then
            cat >> service-worker.js <<'EOF'

          // Run210 owner surface offline cache: additive-only extension for the current RTS terrain detail.
          // Image requests are cache-first in MEDIA_CACHE, while the JS module belongs to the shell graph.
          GAME3D_SHELL_FILES.push('./src/3d/rts/rtsSurfaceTexture.js');
          self.addEventListener('install', (event) => {
              event.waitUntil(
                  caches.open(MEDIA_CACHE)
                      .then(cache => cache.add('./assets/textures/yüzey/overlay/overlay.png'))
                      .catch(error => console.warn('[SW] Run210 surface media cache skipped:', error))
              );
          });
          EOF
          fi
          node --check service-worker.js
          node --check src/3d/rts/rtsSurfaceTexture.js
          node --check scripts/checkRun210RtsSurfaceTexture.js
          node --check scripts/checkRun210RtsSurfaceOffline.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
      - name: Install Playwright outside project manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Online surface browser proof
        run: node scripts/checkRun210RtsSurfaceTexture.js
      - name: Fresh-install offline PWA proof
        run: node scripts/checkRun210RtsSurfaceOffline.js
      - name: Legacy browser smoke
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run210-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run210-smoke.log")" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run210-smoke.log" | grep -F 'zero console/page errors'
      - name: Determinism world terrain and roads
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Append verified Run210 records
        run: |
          set -euo pipefail
          cat >> 3D_GAME_PROGRESS.md <<'EOF'

          ## Run 210 — Owner surface texture production activation
          - Owner decision (2026-08-09): the project owner explicitly instructed that the uploaded `assets/textures/yüzey` surface be merged and used as the current RTS ground texture. This resolves the product-use decision; it does not invent an upstream third-party license.
          - Runtime: `overlay/overlay.png` is projected onto the existing deterministic terrain with full-world, world-space clamped UVs. Terrain heights, roads, castles, water, physics and gameplay geometry are unchanged. Detail opacity is 0.24 so the procedural medieval palette remains dominant.
          - Adaptive path: 3072x3072 source -> 1024x1024 desktop runtime texture / 512x512 coarse-pointer-mobile runtime texture; source image decodes once per page.
          - Browser proof: desktop 529 textured chunks, 66 draw calls, 821483 triangles; mobile 90 textured chunks, 28 draw calls, 202770 triangles; zero console/page errors on both.
          - PWA/offline: `rtsSurfaceTexture.js` is in `GAME3D_SHELL_FILES` and `overlay.png` is installed into `MEDIA_CACHE`. Fresh-install -> network offline -> RTS + surface cache boot is proven by `checkRun210RtsSurfaceOffline.js` with zero offline RTS console/page errors.
          - Regression: 34+ legacy browser smoke checks, deterministic RNG policy, world-reference map/water/alignment/hydrology, 14/14 terrain-seat safety and 14/14 road connectivity PASS; additive-only policy PASS.
          - Provenance: embedded metadata identifies Photoshop/Autodesk tooling but no reliable author/source URL/license. Owner authorizes private-project runtime use; public/commercial redistribution remains gated until a real source/license is supplied. No license value was guessed.
          - Technical debt: +1 bounded provenance item (upstream surface source/license unknown); runtime integration debt introduced: 0.
          - Next safe step: real-device visual calibration only if needed; do not replace deterministic height/physics data with the uploaded OBJ.
          EOF

          cat >> DECISIONS.md <<'EOF'

          ## ADR-0228 — Activate the owner-uploaded surface as current RTS terrain detail while keeping provenance as a distribution gate
          **Risk:** MEDIUM

          **Decision:** Following the owner's direct 2026-08-09 merge/use instruction, `assets/textures/yüzey/overlay/overlay.png` becomes the current RTS terrain detail layer. It is blended at 0.24 over existing deterministic terrain with world-space UVs; desktop derives 1024² and coarse-pointer/mobile derives 512². The service worker caches the module in the shell graph and the image in media cache for fresh-install offline RTS boot.

          **Why:** Real Chromium proof shows the surface improves ground detail without replacing world geometry or violating desktop/mobile budgets. World-space UVs avoid chunk seams and adaptive downsampling avoids keeping a 3072² runtime texture.

          **Alternatives:** Keep unused pending provenance (conflicts with explicit owner private-use decision); replace terrain with uploaded OBJ (rejected: no usable UV contract and needless height/physics risk); display raw aerial image (rejected: excessive visual strength and memory cost).

          **Consequences:** RTS ground uses the selected surface online and offline while terrain heights, seeded generation, roads, castles, water and movement remain unchanged. Upstream source/author/license remains unknown and is not guessed; the owner instruction is a project-use decision, not a third-party rights claim. Public/commercial redistribution stays gated on provenance.

          **Affected systems:** `rts.html`, `src/3d/rts/rtsSurfaceTexture.js`, `service-worker.js`, PWA shell/media caches, RTS terrain visuals. 2D and character-mode behavior are unchanged.

          **Rollback:** disable the additive RTS surface installer/cache additions in an owner-approved future change; deterministic terrain underneath remains the rollback target.
          EOF

          cat >> QUESTIONS_FOR_OWNER.md <<'EOF'

          - **✅ ÇÖZÜLDÜ (run 210, ADR-0228) Uploaded `yüzey` package should be the current ground texture?** Owner answered directly on 2026-08-09: merge it and use this look for the current ground. Run210 activates the proven `overlay.png` detail layer for RTS. Upstream provenance is still factually unknown, so no license was guessed and public/commercial redistribution remains gated until source/license evidence exists.
          EOF

          cat >> perf_log.csv <<'EOF'
          run210,2026-08-09,desktop-rts,,66,821483,,,,"owner surface; 529 textured chunks; 3072 source -> 1024 runtime; console/page errors 0"
          run210,2026-08-09,mobile-rts,,28,202770,,,,"owner surface; 90 textured chunks; 3072 source -> 512 runtime; console/page errors 0"
          EOF
      - name: Final concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          MERGE_BASE="$(git merge-base HEAD origin/main)"
          test "$CURRENT_MAIN" = "$MERGE_BASE"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Commit production activation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js 3D_GAME_PROGRESS.md DECISIONS.md QUESTIONS_FOR_OWNER.md perf_log.csv
          git diff --cached --check
          git commit -m 'feat(run210): activate owner surface with offline PWA support'
          git push origin HEAD:agent/run210-owner-surface-texture-final
