name: Buzul Muhafizi - World Ground Query Contract v47

on:
  pull_request:
    paths:
      - 'src/3d/world/WorldGroundQueryContract.js'
      - 'scripts/checkWorldGroundQueryContract.mjs'
      - '.github/workflows/buzul-muhafizi-ground-query-contract-v47.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/world/WorldGroundQueryContract.js'
      - 'scripts/checkWorldGroundQueryContract.mjs'
      - '.github/workflows/buzul-muhafizi-ground-query-contract-v47.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Scope and diff budget
        run: |
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          test "$(printf '%s\n' "$files" | wc -l | tr -d ' ')" -eq 3
          printf '%s\n' "$files" | grep -Fx 'src/3d/world/WorldGroundQueryContract.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkWorldGroundQueryContract.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/buzul-muhafizi-ground-query-contract-v47.yml'
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Syntax
        run: node --check src/3d/world/WorldGroundQueryContract.js
      - name: Executable contract
        run: node scripts/checkWorldGroundQueryContract.mjs
      - name: Ownership boundary
        run: |
          ! grep -nE "createGeometry|new THREE|EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|terrain\.js|water\.js|sceneManager\.js|naturalGeology\.js|rivers\.js|roads\.js" src/3d/world/WorldGroundQueryContract.js
