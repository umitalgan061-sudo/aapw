name: Pindex Quality V2 Detail Bootstrap

on:
  push:
    branches:
      - terrain/pindex-quality-v2-20260812

permissions:
  contents: write

jobs:
  rewrite-detail-shader:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace only the V2 shader installer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('src/3d/world/worldReferenceSurfaceTerrainVisual.js')
          fragment = Path('.github/pindex-quality-v2/detail-shader.fragment').read_text().strip()
          text = source.read_text()
          start_marker = 'function installRuntimePindexQualityV2Shader(material) {'
          end_marker = '/** V2 adds no second per-vertex pass: Iteration #08 remains CPU authoring; V2 is GPU shading. */'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          source.write_text(text[:start] + fragment + '\n\n' + text[end:])
          PY
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          node scripts/checkTerrainPindexQualityV2.js
          git diff --check
      - name: Commit organic GPU detail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/3d/world/worldReferenceSurfaceTerrainVisual.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "terrain: replace directional grain with organic GPU noise atlas"
          git push origin HEAD:terrain/pindex-quality-v2-20260812
