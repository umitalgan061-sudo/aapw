name: Player Combat Action Router
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatActionRouter.js'
      - 'scripts/checkPlayerCombatActionRouter.mjs'
      - '.github/workflows/player-combat-action-router.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main ancestry
        run: git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - name: Diff cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatActionRouter.js && node --check scripts/checkPlayerCombatActionRouter.mjs
      - name: Contract
        run: node scripts/checkPlayerCombatActionRouter.mjs
