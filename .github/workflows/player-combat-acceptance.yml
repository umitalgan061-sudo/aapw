name: Player Combat Acceptance

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatAcceptance.ts'
      - 'scripts/checkPlayerCombatAcceptance.mjs'
      - '.github/workflows/player-combat-acceptance.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact main ancestry
        shell: bash
        run: |
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: TypeScript syntax
        run: node --experimental-strip-types --check src/3d/gameplay/playerCombatAcceptance.ts
      - name: Focused proof
        run: node --experimental-strip-types scripts/checkPlayerCombatAcceptance.mjs
