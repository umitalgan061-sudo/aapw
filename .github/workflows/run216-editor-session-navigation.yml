name: Run216 Editor Session Navigation

on:
  push:
    branches:
      - agent/run216-world-editor-transform-controls
    paths:
      - 'editor.html'
      - 'src/3d/editor/EditorTerrainSemantics.js'
      - 'src/3d/editor/EditorLocalSession.js'
      - 'src/3d/editor/EditorHistoryController.js'
      - 'src/3d/editor/EditorLocationNavigator.js'
      - 'src/3d/editor/EditorGamePreviewLauncher.js'
      - 'scripts/checkRun216EditorSessionNavigationContract.js'
      - 'scripts/checkRun216EditorHistoryContract.js'
      - 'scripts/checkRun216EditorSessionNavigationBrowserSafe.js'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-session-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-session-navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Syntax and source contracts
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorTerrainSemantics.js
          node --check src/3d/editor/EditorLocalSession.js
          node --check src/3d/editor/EditorHistoryController.js
          node --check src/3d/editor/EditorLocationNavigator.js
          node --check src/3d/editor/EditorGamePreviewLauncher.js
          node --check scripts/checkRun216EditorSessionNavigationContract.js
          node --check scripts/checkRun216EditorHistoryContract.js
          node --check scripts/checkRun216EditorSessionNavigationBrowserSafe.js
          node scripts/checkRun216EditorSessionNavigationContract.js
          node scripts/checkRun216EditorHistoryContract.js
          node scripts/materializeRun216ServiceWorkerCache.js --self-test
          node scripts/checkRun216ServiceWorkerMaterializer.js
      - name: Install isolated Chromium proof tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run216-editor-session-tools"
          npm install --prefix "$RUNNER_TEMP/run216-editor-session-tools" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/run216-editor-session-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/run216-editor-session-tools/node_modules" >> "$GITHUB_ENV"
      - name: Desktop and mobile session navigation proof
        run: node scripts/checkRun216EditorSessionNavigationBrowserSafe.js
      - name: Existing editor and game safety
        run: |
          set -euo pipefail
          node scripts/checkRun216EditorUsabilityContract.js
          node scripts/checkRun216EditorGamePreviewContract.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run216-session-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run216-session-smoke.log")" -ge 34
          grep -F 'zero console/page errors' "$RUNNER_TEMP/run216-session-smoke.log"
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
      - name: Final concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload session evidence
        uses: actions/upload-artifact@v4
        with:
          name: run216-editor-session-navigation
          path: artifacts/run216-editor-session-navigation-safe/*.png
          if-no-files-found: error
