name: Run 264 Y Scale Writer Diagnostic

on:
  push:
    branches: [agent/run264-micro-scale-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright outside repo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Trace real Y-scale writers
        run: |
          set -euo pipefail
          node --check scripts/diagnoseRun264YScaleWriter.js
          node scripts/diagnoseRun264YScaleWriter.js | tee "$RUNNER_TEMP/run264-y-writer.log"
          grep '^\[run264-y-writer\]' "$RUNNER_TEMP/run264-y-writer.log"
