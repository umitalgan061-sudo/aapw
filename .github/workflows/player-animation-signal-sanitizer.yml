name: Player Animation Signal Sanitizer

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAnimationSignalSanitizer.js'
      - 'scripts/checkPlayerAnimationSignalSanitizer.mjs'
      - '.github/workflows/player-animation-signal-sanitizer.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-animation-transition-hysteresis-20260915'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact head
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Current main ancestry
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerAnimationSignalSanitizer.js
          node --check scripts/checkPlayerAnimationSignalSanitizer.mjs
      - name: Focused regression
        run: node scripts/checkPlayerAnimationSignalSanitizer.mjs
      - name: Deterministic repeat
        run: |
          node scripts/checkPlayerAnimationSignalSanitizer.mjs > /tmp/signal-a.log
          node scripts/checkPlayerAnimationSignalSanitizer.mjs > /tmp/signal-b.log
          diff -u /tmp/signal-a.log /tmp/signal-b.log
      - name: Ownership boundary
        run: |
          ! grep -nE "from ['\"]three['\"]|EventBus|ActorRegistry|EditorMaterialStudio|WorldAssetPlacementPipeline|MaterialAssignmentCore" src/3d/gameplay/playerAnimationSignalSanitizer.js
