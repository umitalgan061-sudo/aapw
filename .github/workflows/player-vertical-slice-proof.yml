name: Player Vertical Slice Proof
on:
  push:
    branches: ['agent/kizil-ufuk-player-vertical-slice-proof-20260910']
  pull_request:
    paths:
      - 'src/3d/gameplay/playerVerticalSliceProof.js'
      - 'scripts/checkPlayerVerticalSliceProof.mjs'
      - '.github/workflows/player-vertical-slice-proof.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scope and boundary guard
        shell: bash
        run: |
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = ".github/workflows/player-vertical-slice-proof.yml scripts/checkPlayerVerticalSliceProof.mjs src/3d/gameplay/playerVerticalSliceProof.js "
          ! grep -R "EditorMaterialStudio\|from './player.js'\|from '../editor" src/3d/gameplay/playerVerticalSliceProof.js
      - name: Syntax
        run: node --check src/3d/gameplay/playerVerticalSliceProof.js && node --check scripts/checkPlayerVerticalSliceProof.mjs
      - name: Deterministic executable contract
        run: |
          node scripts/checkPlayerVerticalSliceProof.mjs > /tmp/proof-a.txt
          node scripts/checkPlayerVerticalSliceProof.mjs > /tmp/proof-b.txt
          diff -u /tmp/proof-a.txt /tmp/proof-b.txt
      - name: Diff budget
        shell: bash
        run: |
          additions=$(git diff --numstat origin/main...HEAD | awk '{a+=$1} END {print a+0}')
          deletions=$(git diff --numstat origin/main...HEAD | awk '{d+=$2} END {print d+0}')
          total=$((additions + deletions))
          test "$total" -le 3000
          test "$deletions" -eq 0
