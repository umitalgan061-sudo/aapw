name: player-combat-state-projection

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatStateProjection.js'
      - 'scripts/checkPlayerCombatStateProjection.mjs'
      - '.github/workflows/player-combat-state-projection.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce exact main ancestry and focused scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          files="$(git diff --name-only origin/main...HEAD)"
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/gameplay/playerCombatStateProjection.js|scripts/checkPlayerCombatStateProjection.mjs|.github/workflows/player-combat-state-projection.yml) ;;
              *) echo "Unexpected file: $file"; exit 1 ;;
            esac
          done <<< "$files"
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Check runtime/editor boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/playerCombatStateProjection.js
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatStateProjection.js
      - name: Executable contract
        run: node scripts/checkPlayerCombatStateProjection.mjs
      - name: Diff hygiene
        run: test -z "$(git diff --check origin/main...HEAD)"
