name: Living World Threat Decision Policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldThreatDecisionPolicy.js'
      - 'scripts/checkLivingWorldThreatDecisionPolicy.mjs'
      - '.github/workflows/living-world-threat-decision-policy.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/livingWorldThreatDecisionPolicy.js && node --check scripts/checkLivingWorldThreatDecisionPolicy.mjs
      - name: Executable contract
        run: node scripts/checkLivingWorldThreatDecisionPolicy.mjs
