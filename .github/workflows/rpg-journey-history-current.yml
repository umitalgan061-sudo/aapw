name: RPG Journey History Current Main

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'src/3d/gameplay/interactionFieldReadiness.js'
      - 'scripts/checkInteractionJourneyHistoryWindow.mjs'
      - 'scripts/checkInteractionJourneyHistoryWindowCurrent.mjs'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionRewardProvenance.mjs'
      - '.github/workflows/rpg-expedition-credit-ledger.yml'
      - '.github/workflows/rpg-expedition-reward-provenance-current-main.yml'
      - '.github/workflows/rpg-expedition-tavern-recovery.yml'
      - '.github/workflows/rpg-interaction-quest-loop.yml'
      - '.github/workflows/rpg-tavern-receipt-integrity.yml'
      - '.github/workflows/rpg-journey-ledger-ux.yml'
      - '.github/workflows/rpg-journey-history-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-history-current:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD)
          allowed='^(src/3d/gameplay/interaction(Config|Economy|FieldReadiness)?\.js|scripts/checkInteraction(JourneyHistoryWindow(Current)?|Expedition(Board|RewardProvenance))\.mjs|\.github/workflows/rpg-(journey-history-current|journey-ledger-ux|expedition-credit-ledger|expedition-reward-provenance-current-main|expedition-tavern-recovery|interaction-quest-loop|tavern-receipt-integrity)\.yml)$'
          if (( ${#paths[@]} )); then
            printf '%s\n' "${paths[@]}" | grep -Ev "$allowed" && exit 1 || true
          fi
          changed="$(git diff --numstat "$base"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 1000
      - name: Syntax and current journey history acceptance
        run: |
          set -euo pipefail
          node --check scripts/checkInteractionJourneyHistoryWindow.mjs
          node --check scripts/checkInteractionJourneyHistoryWindowCurrent.mjs
          node scripts/checkInteractionSettlementServiceContract.mjs
          node scripts/checkInteractionJourneyPlanning.mjs
          node scripts/checkInteractionTavernReceiptIntegrity.mjs
          node scripts/checkInteractionJourneyLedgerUx.mjs
          node scripts/checkInteractionExpeditionTavernRecovery.mjs
          node scripts/checkInteractionJourneyHistoryWindow.mjs
          node scripts/checkInteractionJourneyHistoryWindowCurrent.mjs
      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped settlement service browser proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionSettlementServiceBrowser.mjs
      - name: Shipped journey continuity browser proof
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryTravelContinuityBrowser.mjs
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD
