name: player combat targeting director
on:
  push:
    branches: ["codex/kizil-ufuk-lock-on-targeting-director-20260911"]
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatTargetingDirector.js'
      - 'scripts/checkPlayerCombatTargetingDirector.mjs'
      - '.github/workflows/player-combat-targeting-director.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check src/3d/gameplay/playerCombatTargetingDirector.js
      - run: node scripts/checkPlayerCombatTargetingDirector.mjs
      - run: node scripts/checkPlayerCombatTargetingDirector.mjs > /tmp/a
      - run: node scripts/checkPlayerCombatTargetingDirector.mjs > /tmp/b && cmp /tmp/a /tmp/b
      - run: "! grep -R -nE "EditorMaterialStudio|from ['\"]three['\"]" src/3d/gameplay/playerCombatTargetingDirector.js"
