name: Terrain Surface Anti-Tiling Runtime

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainSurfaceAntiTiling.js'
      - 'src/3d/world/terrainSurfaceAntiTilingRuntime.js'
      - 'scripts/checkTerrainSurfaceAntiTiling.mjs'
      - 'scripts/checkTerrainSurfaceAntiTilingRuntime.mjs'
      - '.github/workflows/terrain-surface-anti-tiling-runtime.yml'

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check src/3d/world/terrainSurfaceAntiTilingRuntime.js
      - name: Runtime contract
        run: node scripts/checkTerrainSurfaceAntiTilingRuntime.mjs
