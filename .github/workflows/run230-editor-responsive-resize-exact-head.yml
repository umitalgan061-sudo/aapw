name: Run 230 Editor Responsive Resize Exact Head

on:
  push:
    branches:
      - agent/run230-editor-responsive-resize
    paths:
      - '.github/workflows/run230-editor-responsive-resize-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run230-editor-responsive-resize-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun230EditorResponsiveResize.js
          node --check scripts/checkRun230EditorResponsiveResizeLayoutIntegrity.js
          git diff --check
      - name: Verify Run230 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 230 — World Editor mobile responsive layout integrity' 3D_GAME_PROGRESS.md
          grep -Fq 'editor-responsive-layout-integrity' perf_log.csv
          grep -Fq 'Run230 editor mobile responsive layout integrity' STABLE_TAGS.md
          grep -Fq '31431633060' 3D_GAME_PROGRESS.md
          grep -Fq '31431633073' 3D_GAME_PROGRESS.md
          grep -Fq '31431633081' 3D_GAME_PROGRESS.md
          grep -Fq 'body.scrollWidth=2293' 3D_GAME_PROGRESS.md
