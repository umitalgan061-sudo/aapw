name: Player Combat Feedback Haptic Activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/input.js'
      - 'scripts/checkPlayerGamepadInput.mjs'
      - 'scripts/checkPlayerCombatFeedbackHapticActivation.mjs'
      - '.github/workflows/player-combat-feedback-haptic-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-combat-feedback-haptic-activation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and bounded Kizil Ufuk scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$MAIN_SHA")" = "$MAIN_SHA"
          git diff --check "$MAIN_SHA"...HEAD
          CHANGED="$(git diff --name-only "$MAIN_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/input\.js|scripts/checkPlayerGamepadInput\.mjs|scripts/checkPlayerCombatFeedbackHapticActivation\.mjs|\.github/workflows/player-combat-feedback-haptic-activation\.yml)$' | wc -l)" -eq 0
          read -r ADD DEL < <(git diff --numstat "$MAIN_SHA"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test $((ADD + DEL)) -le 1000
          echo "BASE_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
      - name: Haptic activation and receipt semantics
        run: |
          set -euo pipefail
          node --check src/3d/input.js
          node --check scripts/checkPlayerGamepadInput.mjs
          node --check scripts/checkPlayerCombatFeedbackHapticActivation.mjs
          node scripts/checkPlayerGamepadInput.mjs
          node scripts/checkPlayerCombatFeedbackHapticActivation.mjs
      - name: Shared runtime contracts
        run: |
          set -euo pipefail
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          ! grep -q 'EditorMaterialStudio' src/3d/input.js
      - name: Final main freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
