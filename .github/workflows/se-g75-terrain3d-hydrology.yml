name: SE G75 Terrain3D Hydrology

on:
  push:
    branches:
      - terrain/se-g75-terrain3d-hydrology-20260812
  pull_request:
    branches:
      - main
    paths:
      - 'godot/terrain-authoring/geocells/se/g75_hydrology.mjs'
      - 'scripts/checkSEG75Hydrology.mjs'
      - 'godot/terrain-authoring/scripts/validate_g75_terrain3d.gd'
      - 'godot/terrain-authoring/corner_claims/SE.json'
      - '.github/workflows/se-g75-terrain3d-hydrology.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g75-terrain3d-hydrology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and five-file bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA='405b8faa5bbfbdcfd9c73ddafa8a05b855cd32ec'
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/se/g75_hydrology.mjs|scripts/checkSEG75Hydrology.mjs|godot/terrain-authoring/scripts/validate_g75_terrain3d.gd|godot/terrain-authoring/corner_claims/SE.json|\.github/workflows/se-g75-terrain3d-hydrology.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('godot/terrain-authoring/terrain3d.lock.json').read_text())
          assert lock['tag'] == 'v1.0.2-stable'
          assert lock['version'] == '1.0.2'
          assert lock['sha256'] == 'a071850250ec5e596aa54da61c01d75768774eb379ee997584d426a45f4884a2'
          print('TERRAIN3D_LOCK_SCHEMA_OK')
          PY

      - name: Canonical G75 determinism and guard-band probe
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g75_hydrology.mjs
          node --check scripts/checkSEG75Hydrology.mjs
          node scripts/checkSEG75Hydrology.mjs | tee "$RUNNER_TEMP/g75-first.log"
          node scripts/checkSEG75Hydrology.mjs | tee "$RUNNER_TEMP/g75-second.log"
          cmp "$RUNNER_TEMP/g75-first.log" "$RUNNER_TEMP/g75-second.log"
          grep -F 'SE_G75_HYDROLOGY_VALIDATION_OK' "$RUNNER_TEMP/g75-first.log"
          node scripts/checkSEG75Hydrology.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g75-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g75-probe.json

      - name: Install exact pinned Terrain3D backend
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh 2>&1 | tee "$RUNNER_TEMP/terrain3d-install-$attempt.log"; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          test "$installed" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/terrain3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/terrain3d-verify.log"
          test -f godot/terrain-authoring/addons/terrain_3d/plugin.cfg

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' \
            --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Prove real G75 Terrain3D region save and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G75_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring \
            --script res://scripts/validate_g75_terrain3d.gd | tee "$RUNNER_TEMP/g75-t3d-a.log"
          G75_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring \
            --script res://scripts/validate_g75_terrain3d.gd | tee "$RUNNER_TEMP/g75-t3d-b.log"
          grep -F 'SE_G75_TERRAIN3D_VALIDATION_OK' "$RUNNER_TEMP/g75-t3d-a.log"
          grep -F 'SE_G75_TERRAIN3D_VALIDATION_OK' "$RUNNER_TEMP/g75-t3d-b.log"
          python3 - "$RUNNER_TEMP/g75-t3d-a.log" "$RUNNER_TEMP/g75-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G75_TERRAIN3D_METRICS='):
                      return json.loads(line.split('=', 1)[1])
              raise SystemExit('missing Terrain3D metrics')
          a, b = metrics(sys.argv[1]), metrics(sys.argv[2])
          keys = ('terrain3dVersion','regionSize','regionCount','sampleCount','maxHeightError','heightSpan','outputChecksum','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in keys} == {k:b[k] for k in keys}
          assert a['savedRegionFiles'] >= 1 and b['savedRegionFiles'] >= 1
          assert a['savedRegionBytes'] > 0 and b['savedRegionBytes'] > 0
          assert a['heightSpan'] <= 1e-5 and b['heightSpan'] <= 1e-5
          print('G75_TERRAIN3D_STABLE_METRICS_OK')
          PY

      - name: Preserve HTerrain regression control
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring \
            --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/g75-hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/g75-hterrain.log"

      - name: Install Chromium safety dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Safety PWA performance determinism
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkTechnicalDebt.js

      - name: Full browser smoke and console regression
        run: node scripts/smokeTestGame3D.js

      - name: Final exact-main and backend-integrity gate
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA='405b8faa5bbfbdcfd9c73ddafa8a05b855cd32ec'
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
