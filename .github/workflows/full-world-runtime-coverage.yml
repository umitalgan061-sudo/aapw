name: Full World Runtime Coverage
on:
  push:
    branches: ['terrain/shared-full-world-runtime-exact-*-20260815']
  pull_request:
    branches: [main]
    paths:
      - src/3d/config.js
      - src/3d/world/terrain.js
      - scripts/checkFullWorldRuntimeCoverage.mjs
      - scripts/checkFullWorldRuntimeBrowser.mjs
      - .github/workflows/full-world-runtime-coverage.yml
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: full-world-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/config.js|src/3d/world/terrain.js|scripts/checkFullWorldRuntimeCoverage.mjs|scripts/checkFullWorldRuntimeBrowser.mjs|\.github/workflows/full-world-runtime-coverage.yml)$' | wc -l)" -eq 0
          A="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END{print s+0}')"
          D="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END{print s+0}')"
          echo "FULL_WORLD_RUNTIME_CHANGED_LINES=$((A+D))"
          test $((A+D)) -le 1000
          node --check src/3d/config.js
          node --check src/3d/world/terrain.js
          node --check scripts/checkFullWorldRuntimeCoverage.mjs
          node --check scripts/checkFullWorldRuntimeBrowser.mjs
      - name: Full-map single-source and mountain contracts
        run: |
          set -euo pipefail
          node scripts/checkFullWorldRuntimeCoverage.mjs
          node scripts/checkWorldReferenceMountainRelief.mjs
          node scripts/checkWorldReferenceMap.js
          node scripts/checkSeededRandomPolicy.js
      - name: Install browser harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Browser render physics parity
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" node scripts/checkFullWorldRuntimeBrowser.mjs
      - name: Hydrate scoped smoke LFS assets
        run: |
          set -euo pipefail
          git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**" --exclude=""
      - name: Settlement road PWA mobile and browser safety
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$NODE_PATH" node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$NODE_PATH" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$NODE_PATH" node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD