name: Full World Runtime Coverage
on:
  push:
    branches: ['terrain/shared-full-world-runtime-exact-*-20260815']
  pull_request:
    branches: [main]
    paths:
      - game3d.html
      - src/3d/config.js
      - src/3d/sky.js
      - src/3d/world/terrain.js
      - src/3d/world/water.js
      - src/3d/world/waterDepthField.js
      - src/3d/world/settlements.js
      - scripts/checkFullWorldRuntimeCoverage.mjs
      - scripts/checkFullWorldRuntimeBrowser.mjs
      - scripts/checkWorldEnvironmentAcceptanceMatrix.mjs
      - scripts/checkWorldReferenceAlignment.js
      - scripts/checkWorldReferenceHydrologyExtent.js
      - scripts/checkMapAlignedTerrainPBR.mjs
      - scripts/checkTerrainMicroSurface.mjs
      - scripts/checkWorldWaterCoverageP0.mjs
      - scripts/checkWaterCoverageRasterQuality.mjs
      - scripts/checkWaterCoverageSamplingBudget.mjs
      - scripts/roadNetworkSafetyCheck.js
      - scripts/game3dSmokeChecksScene.js
      - .github/workflows/world-map-aligned-terrain-pbr.yml
      - .github/workflows/live-map-shallow-water-visual.yml
      - .github/workflows/world-environment-acceptance.yml
      - .github/workflows/run167-determinism-policy.yml
      - .github/workflows/run317-terrain3d-heightfield.yml
      - .github/workflows/live-map-mountain-relief.yml
      - .github/workflows/full-world-runtime-coverage.yml
      - .github/workflows/buzul-settlement-210-governance-rca.yml
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: full-world-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(game3d.html|fixtures/world-reference-mountain-relief-v1\.json|src/3d/config.js|src/3d/sky.js|src/3d/world/terrain.js|src/3d/world/water.js|src/3d/world/waterDepthField.js|src/3d/world/settlements.js|src/3d/world/worldReferenceMountainRelief\.js|scripts/captureLiveWorldMountainNaturalization\.mjs|scripts/checkMountainNaturalizationDeterminism\.mjs|scripts/checkMountainNaturalizationProfile\.mjs|scripts/checkMountainPassReliefSafety\.mjs|scripts/checkMountainVisualProofContract\.mjs|scripts/checkWorldReferenceMountainRelief\.mjs|scripts/checkFullWorldRuntimeCoverage.mjs|scripts/checkFullWorldRuntimeBrowser.mjs|scripts/checkWorldEnvironmentAcceptanceMatrix.mjs|scripts/checkWorldReferenceAlignment.js|scripts/checkWorldReferenceHydrologyExtent.js|scripts/checkMapAlignedTerrainPBR.mjs|scripts/checkTerrainMicroSurface.mjs|scripts/checkWorldWaterCoverageP0.mjs|scripts/checkWaterCoverageRasterQuality.mjs|scripts/checkWaterCoverageSamplingBudget.mjs|scripts/checkWaterSurfVisualContract.mjs|scripts/checkWaterVisualContract.js|scripts/terrainSeatSafetyCheck.js|scripts/roadNetworkSafetyCheck.js|scripts/game3dSmokeChecksScene.js|\.github/workflows/world-map-aligned-terrain-pbr\.yml|\.github/workflows/live-map-shallow-water-visual\.yml|\.github/workflows/world-environment-acceptance\.yml|\.github/workflows/run167-determinism-policy\.yml|\.github/workflows/run317-terrain3d-heightfield\.yml|\.github/workflows/live-map-mountain-relief\.yml|\.github/workflows/full-world-runtime-coverage\.yml|\.github/workflows/buzul-settlement-210-governance-rca\.yml)$' | wc -l)" -eq 0
          A="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END{print s+0}')"
          D="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END{print s+0}')"
          echo "FULL_WORLD_RUNTIME_CHANGED_LINES=$((A+D))"
          test $((A+D)) -le 3000
          node --check src/3d/config.js
          node --check src/3d/sky.js
          node --check src/3d/world/terrain.js
          node --check src/3d/world/water.js
          node --check src/3d/world/waterDepthField.js
          node --check src/3d/world/settlements.js
          node --check scripts/checkFullWorldRuntimeCoverage.mjs
          node --check scripts/checkFullWorldRuntimeBrowser.mjs
          node --check scripts/checkWorldEnvironmentAcceptanceMatrix.mjs
          node --check scripts/checkWorldReferenceAlignment.js
          node --check scripts/checkWorldReferenceHydrologyExtent.js
          node --check scripts/checkMapAlignedTerrainPBR.mjs
          node --check scripts/checkTerrainMicroSurface.mjs
          node --check scripts/checkWorldWaterCoverageP0.mjs
          node --check scripts/checkWaterCoverageRasterQuality.mjs
          node --check scripts/checkWaterCoverageSamplingBudget.mjs
          node --check scripts/game3dSmokeChecksScene.js
          grep -F "editorPatch') === '1'" game3d.html
      - name: Install water contract runtime dependency
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0
      - name: Full-map single-source and scoped mountain contracts
        id: static_world_contracts
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/checkFullWorldRuntimeCoverage.mjs
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          if git diff --quiet origin/main...HEAD -- \
            fixtures/world-reference-mountain-relief-v1.json \
            src/3d/world/worldReferenceMountainRelief.js \
            scripts/checkWorldReferenceMountainRelief.mjs \
            scripts/captureLiveWorldMountainNaturalization.mjs \
            scripts/checkMountainNaturalizationDeterminism.mjs \
            scripts/checkMountainNaturalizationProfile.mjs \
            scripts/checkMountainPassReliefSafety.mjs \
            scripts/checkMountainVisualProofContract.mjs; then
            echo 'Mountain-owned sources are byte-identical to exact main; #1050 owns current policy/fixture requalification.'
          else
            node scripts/checkWorldReferenceMountainRelief.mjs
          fi
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldWaterCoverageP0.mjs
          node scripts/checkWaterCoverageRasterQuality.mjs
          node scripts/checkWaterCoverageSamplingBudget.mjs
          node scripts/checkSeededRandomPolicy.js
      - name: Install browser harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Hydrate shipped full-world LFS assets
        run: |
          set -euo pipefail
          git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/Ay/Moon 2K.fbx,assets/models/vegetation/pine_Zt62gceKXZ.glb,assets/models/vegetation/winter_tree.glb,assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb,assets/models/fbx/rocky_terrain_low_poly.glb,assets/models/fbx/desert_rocks.glb" --exclude=""
          test "$(stat -c %s 'assets/models/Ay/Moon 2K.fbx')" -eq 33404
          test "$(stat -c %s assets/models/vegetation/pine_Zt62gceKXZ.glb)" -eq 2219996
          test "$(stat -c %s assets/models/vegetation/winter_tree.glb)" -eq 2008660
          test "$(stat -c %s assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb)" -eq 659652
          test "$(stat -c %s assets/models/fbx/rocky_terrain_low_poly.glb)" -eq 5708516
          test "$(stat -c %s assets/models/fbx/desert_rocks.glb)" -eq 12773288
      - name: Browser render physics parity
        id: browser_render_parity
        continue-on-error: true
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" node scripts/checkFullWorldRuntimeBrowser.mjs
      - name: Runtime terrain road and mobile safety
        id: runtime_world_safety
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$NODE_PATH" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$NODE_PATH" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$NODE_PATH" node scripts/smokeTestGame3D.js
      - name: PWA technical-debt and external shell safety
        id: pwa_world_safety
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/checkPwaInstallability.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkServiceWorkerCache.js
      - name: Final exact-main freshness
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
      - name: Enforce full-world qualification
        if: always()
        env:
          STATIC_WORLD_CONTRACTS: ${{ steps.static_world_contracts.outcome }}
          BROWSER_RENDER_PARITY: ${{ steps.browser_render_parity.outcome }}
          RUNTIME_WORLD_SAFETY: ${{ steps.runtime_world_safety.outcome }}
          PWA_WORLD_SAFETY: ${{ steps.pwa_world_safety.outcome }}
        run: |
          set -euo pipefail
          echo "static_world_contracts=$STATIC_WORLD_CONTRACTS"
          echo "browser_render_parity=$BROWSER_RENDER_PARITY"
          echo "runtime_world_safety=$RUNTIME_WORLD_SAFETY"
          echo "pwa_world_safety=$PWA_WORLD_SAFETY"
          failures=0
          for outcome in \
            "$STATIC_WORLD_CONTRACTS" \
            "$BROWSER_RENDER_PARITY" \
            "$RUNTIME_WORLD_SAFETY" \
            "$PWA_WORLD_SAFETY"; do
            if [ "$outcome" != success ]; then
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
