name: Safak Kartali fauna threat response

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldFaunaThreatResponsePolicy.js'
      - 'scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs'
      - '.github/workflows/safak-kartali-fauna-threat-response.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Bounded scope
        run: |
          changed=$(git diff --numstat "$(git rev-parse origin/main)...HEAD" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/livingWorldFaunaThreatResponsePolicy.js
          node --check scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs
      - name: Runtime boundary
        run: |
          ! grep -nE 'EditorMaterialStudio|document\\.|window\\.|Math\\.random|new THREE\\.|BoxGeometry|SphereGeometry|CylinderGeometry' src/3d/gameplay/livingWorldFaunaThreatResponsePolicy.js
      - name: Deterministic wildlife proof
        run: node scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs
