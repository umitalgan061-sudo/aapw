name: Safak Kartali Fauna Threat Response

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaPopulationDirector.js'
      - 'src/3d/gameplay/livingWorldFaunaThreatResponsePolicy.js'
      - 'scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs'
      - '.github/workflows/safak-kartali-fauna-threat-response.yml'
  push:
    branches:
      - 'agent/safak-kartali-fauna-threat-response-20260916'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Exact-head ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD
      - name: Syntax
        run: |
          node --check src/3d/gameplay/livingWorldFaunaThreatResponsePolicy.js
          node --check scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs
      - name: Executable runtime proof
        run: node scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs
      - name: Shared runtime boundary
        run: |
          ! grep -R "EditorMaterialStudio" src/3d/gameplay/livingWorldFaunaThreatResponsePolicy.js scripts/checkSafakKartaliFaunaThreatResponsePolicy.mjs
          grep -q "MaterialAssignmentCore.js" src/3d/gameplay/livingWorldFaunaPopulationDirector.js
          grep -q "WorldAssetPlacementPipeline.js" src/3d/gameplay/livingWorldFaunaPopulationDirector.js
      - name: Changed-line budget
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --numstat "$(git rev-parse origin/main)..HEAD" -- . ':!package-lock.json' | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
