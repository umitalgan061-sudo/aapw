name: Wildlife Pack Alert Independence

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/animals.js'
      - 'scripts/checkWildlifePackAlertIndependence.mjs'
      - '.github/workflows/wildlife-pack-alert-independence.yml'
  push:
    branches:
      - 'agent/safak-kartali-pack-alert-independence-*'
    paths:
      - 'src/3d/gameplay/animals.js'
      - 'scripts/checkWildlifePackAlertIndependence.mjs'
      - '.github/workflows/wildlife-pack-alert-independence.yml'

jobs:
  pack-alert-independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main scope and budget
        shell: bash
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -le 3
          printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/animals\.js|scripts/checkWildlifePackAlertIndependence\.mjs|\.github/workflows/wildlife-pack-alert-independence\.yml)$' && exit 1 || true
          total="$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          echo "changed-lines=$total"
          test "$total" -le 1000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/animals.js
          node --check scripts/checkWildlifePackAlertIndependence.mjs
      - name: Pack alert runtime regression
        run: node scripts/checkWildlifePackAlertIndependence.mjs
      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.mjs
      - name: Final exact-main freshness
        shell: bash
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
