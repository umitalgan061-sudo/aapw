name: FBX Owner Approved Manifest Repair

on:
  push:
    branches:
      - fix/fbx-asset-manifest-owner-approved-20260814
    paths:
      - scripts/materializeOwnerApprovedModelManifest.js
      - .github/workflows/fbx-owner-approved-manifest-repair.yml

permissions:
  contents: write

concurrency:
  group: fbx-owner-approved-manifest-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main preflight
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
      - name: Syntax and materialize
        run: |
          set -euo pipefail
          node --check scripts/materializeOwnerApprovedModelManifest.js
          node scripts/materializeOwnerApprovedModelManifest.js
          node scripts/checkAssetsManifest.js
          git diff --check
          git diff > "$RUNNER_TEMP/first.patch"
          node scripts/materializeOwnerApprovedModelManifest.js
          git diff > "$RUNNER_TEMP/second.patch"
          cmp "$RUNNER_TEMP/first.patch" "$RUNNER_TEMP/second.patch"
      - name: Recheck main before publication
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
      - name: Commit repaired registry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets_manifest.json CREDITS.md
          git diff --cached --quiet && exit 0
          git commit -m "fix(assets): register owner-approved FBX and GLB models"
          git push origin HEAD:${GITHUB_REF_NAME}
