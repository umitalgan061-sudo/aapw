name: Terrain Surface Anti-Tiling Material

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainSurfaceAntiTiling.js'
      - 'src/3d/world/terrainSurfaceAntiTilingRuntime.js'
      - 'src/3d/world/terrainSurfaceAntiTilingMaterial.js'
      - 'scripts/checkTerrainSurfaceAntiTiling*.mjs'
      - '.github/workflows/terrain-surface-anti-tiling-material.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-surface-anti-tiling-material:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/3d/world/terrainSurfaceAntiTiling.js
          node --check src/3d/world/terrainSurfaceAntiTilingRuntime.js
          node --check src/3d/world/terrainSurfaceAntiTilingMaterial.js
          node --check scripts/checkTerrainSurfaceAntiTiling.mjs
          node --check scripts/checkTerrainSurfaceAntiTilingRuntime.mjs
          node --check scripts/checkTerrainSurfaceAntiTilingMaterial.mjs
      - name: Anti-tiling contracts
        run: |
          node scripts/checkTerrainSurfaceAntiTiling.mjs
          node scripts/checkTerrainSurfaceAntiTilingRuntime.mjs
          node scripts/checkTerrainSurfaceAntiTilingMaterial.mjs
