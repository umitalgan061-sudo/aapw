name: Run 189 Canonical Rock Placement Shadow

on:
  push:
    branches: [chatgpt/run189-canonical-rock-placement-shadow]
    paths:
      - 'scripts/checkCanonicalRockPlacementShadow.js'
      - 'scripts/recordRun189Governance.js'
      - '.github/workflows/run189-canonical-rock-placement-shadow.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: e108b1bb343988447d85bae4162915a4aa0539b6
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Snapshot and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F '## Run 188 — Canonical road/water owner-policy shadow comparison' 3D_GAME_PROGRESS.md
          grep -F '## ADR-0208 — Measure road/water policy consequences without selecting the owner decision (run 188)' DECISIONS.md
          grep -F '(run 188, ADR-0208) Canonical full-reference yol/su politikası hangisi olmalı' QUESTIONS_FOR_OWNER.md
          if grep -q '^## ADR-0209 ' DECISIONS.md; then echo 'ADR-0209 already occupied on main'; exit 1; fi
          if grep -q '^## Run 189 ' 3D_GAME_PROGRESS.md; then echo 'Run189 already occupied on main'; exit 1; fi
          git log -12 --oneline
          tail -n 100 3D_GAME_PROGRESS.md
          tail -n 80 DECISIONS.md
          tail -n 70 QUESTIONS_FOR_OWNER.md

      - name: Baseline full browser smoke on Run 188 main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run189-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run189-smoke-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run189-smoke-before.log")" -ge 34)
          git worktree remove "$BASELINE"

      - name: Syntax additive and rock qualification fixture
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkCanonicalRockPlacementShadow.js
          node --check scripts/recordRun189Governance.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check
          node scripts/checkCanonicalRockPlacementShadow.js --write-fixture | tee "$RUNNER_TEMP/run189-rock.log"
          node scripts/checkCanonicalRockPlacementShadow.js --verify-fixture
          SUMMARY="$(grep '^\[checkCanonicalRockPlacementShadow\] PASS:' "$RUNNER_TEMP/run189-rock.log" | tail -n1 | sed 's/^\[checkCanonicalRockPlacementShadow\] PASS: //')"
          CHECKSUM="$(grep '^\[checkCanonicalRockPlacementShadow\] CHECKSUM:' "$RUNNER_TEMP/run189-rock.log" | tail -n1 | awk '{print $3}')"
          test -n "$SUMMARY"
          test -n "$CHECKSUM"
          test -s artifacts/run189-rock-placement/qualification.json
          test -s scripts/fixtures/run189-rock-placement.json
          echo "RUN189_ROCK_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          echo "RUN189_ROCK_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Canonical map terrain chunk road and world visual gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkFullReferenceMigrationDryRun.js
          node scripts/checkWorldReferenceMigrationDryRun.js
          node scripts/checkCanonicalHydrologyTerrainShadow.js
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/checkCanonicalRockPlacementShadow.js --verify-fixture
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkTerrainVisualContract.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js
          node scripts/checkWindGrassContractRun180.js
          node scripts/checkWindGrassSceneIntegrationRun180.js

      - name: Determinism assets PWA governance a11y input physics gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkJumpArcContract.js
          node scripts/checkEventBusContract.js
          node scripts/checkHealthStateContract.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js

      - name: Mobile streaming LOD and real render budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run189-mobile-budget.log"
          SAMPLE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run189-mobile-budget.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$SAMPLE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$SAMPLE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$SAMPLE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000
          echo "RUN189_MOBILE_BUDGET_SUMMARY=live mobile F2 ${DRAW} draw calls / ${TRI} triangles, under <500 / <500K; Run189 shadow qualification adds zero live render cost." >> "$GITHUB_ENV"

      - name: Full browser smoke after change and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run189-smoke-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run189-smoke-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run189-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run189-smoke-after.log"; then exit 1; fi
          echo "RUN189_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"

      - name: Mobile near and F4 far visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js

      - name: Upload Run 189 evidence
        uses: actions/upload-artifact@v4
        with:
          name: run189-canonical-rock-placement-shadow-evidence
          path: |
            artifacts/run189-rock-placement/qualification.json
            scripts/fixtures/run189-rock-placement.json
            artifacts/run130-mobile/*.png
          if-no-files-found: error

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run189 | tee "$RUNNER_TEMP/run189-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run189-trend.log"
          PERF_ROW="$(grep '^\[collectPerfSnapshot\] sampled:' "$RUNNER_TEMP/run189-perf.log" | tail -n1 | sed 's/^\[collectPerfSnapshot\] sampled: //')"
          test -n "$PERF_ROW"
          test "$(printf '%s\n' "$PERF_ROW" | awk -F',' '{print NF}')" -eq 8
          echo "RUN189_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git checkout -- perf_log.csv

      - name: Senior self-review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkCanonicalRockPlacementShadow.js scripts/recordRun189Governance.js; then exit 1; fi
          git diff --quiet "$BASE_SHA" HEAD -- src/3d script.js service-worker.js index.html game3d.html manifest.json
          node scripts/checkCanonicalRockPlacementShadow.js --verify-fixture
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/checkServiceWorkerCache.js
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if grep -q '^## ADR-0209 ' DECISIONS.md; then echo 'ADR-0209 occupied before publish'; exit 1; fi
          if grep -q '^## Run 189 ' 3D_GAME_PROGRESS.md; then echo 'Run189 occupied before publish'; exit 1; fi

      - name: Prepare Run 189 governance values
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN189_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN189_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Record Run 189 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun189Governance.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js

      - name: Final publish concurrency gate and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git ls-remote --tags origin "refs/tags/$RUN189_STABLE_TAG" | grep -q .; then echo 'stable tag already exists'; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fixtures/run189-rock-placement.json WORLD_REFERENCE_MAP.md 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "test(world): record canonical rock placement shadow qualification"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:chatgpt/run189-canonical-rock-placement-shadow
          git tag "$RUN189_STABLE_TAG"
          git push origin "$RUN189_STABLE_TAG" || true
