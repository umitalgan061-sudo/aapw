name: Live Map Shallow Water Visual

on:
  push:
    branches: ['fix/live-map-shallow-water-visual-exact-*']
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/water.js'
      - 'scripts/checkWaterSurfVisualContract.mjs'
      - '.github/workflows/live-map-shallow-water-visual.yml'
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: live-map-shallow-water-visual-${{ github.ref }}
  cancel-in-progress: true

env: { TZ: Europe/Istanbul }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main three-file scope and quota
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/water.js|scripts/checkWaterSurfVisualContract.mjs|\.github/workflows/live-map-shallow-water-visual.yml)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 3
          A="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1}END{print s+0}')"
          D="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2}END{print s+0}')"
          echo "shallow-water visual quota additions=$A deletions=$D total=$((A+D))"
          test $((A+D)) -le 1000
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/terrain.js src/3d/world/waterDepthField.js src/3d/config.js
      - name: Static shader contract
        run: |
          set -euo pipefail
          node --check src/3d/world/water.js
          node --check scripts/checkWaterSurfVisualContract.mjs
          node scripts/checkWaterSurfVisualContract.mjs
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Real GPU water, mobile and browser safety
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWaterVisualContract.js
          node scripts/checkRun325WaterSwell.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-map-shallow-water-visual-proof
          if-no-files-found: warn
          path: artifacts/run325-water-swell/
