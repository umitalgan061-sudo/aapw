name: Live Map Shallow Water Visual

on:
  push:
    branches: ['fix/live-map-shallow-water-visual-exact-*']
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/water.js'
      - 'src/3d/world/waterDepthField.js'
      - 'src/3d/world/geographicReferencePalette.js'
      - 'src/3d/auroraNightAtmosphereV5.js'
      - 'scripts/checkWaterVisualContract.js'
      - 'scripts/checkWaterSurfVisualContract.mjs'
      - 'scripts/checkWorldWaterCoverageP0.mjs'
      - 'scripts/checkWaterCoverageRasterQuality.mjs'
      - 'scripts/checkWaterCoverageSamplingBudget.mjs'
      - 'scripts/checkWaterLayerTransition.mjs'
      - 'scripts/checkGeographicReferencePalette.mjs'
      - 'scripts/checkMarineSkyFloorContract.mjs'
      - 'scripts/checkFullWorldMarineRectangles.mjs'
      - 'scripts/captureLiveWorldWaterTopdown.mjs'
      - '.github/workflows/live-map-shallow-water-visual.yml'
      - '.github/workflows/water-layer-transition.yml'
      - '.github/workflows/full-world-3d-topdown.yml'
      - '.github/workflows/full-world-runtime-coverage.yml'
      - '.github/workflows/world-environment-acceptance.yml'
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: live-map-shallow-water-visual-${{ github.ref }}
  cancel-in-progress: true

env: { TZ: Europe/Istanbul }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main bounded water scope and quota
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/water\.js|src/3d/world/waterDepthField\.js|src/3d/world/geographicReferencePalette\.js|src/3d/auroraNightAtmosphereV5\.js|scripts/checkWaterVisualContract\.js|scripts/checkWaterSurfVisualContract\.mjs|scripts/checkWorldWaterCoverageP0\.mjs|scripts/checkWaterCoverageRasterQuality\.mjs|scripts/checkWaterCoverageSamplingBudget\.mjs|scripts/checkWaterLayerTransition\.mjs|scripts/checkGeographicReferencePalette\.mjs|scripts/checkMarineSkyFloorContract\.mjs|scripts/checkFullWorldMarineRectangles\.mjs|scripts/captureLiveWorldWaterTopdown\.mjs|\.github/workflows/live-map-shallow-water-visual\.yml|\.github/workflows/water-layer-transition\.yml|\.github/workflows/full-world-3d-topdown\.yml|\.github/workflows/full-world-runtime-coverage\.yml|\.github/workflows/world-environment-acceptance\.yml)$' | wc -l)" -eq 0
          echo "$CHANGED" | grep -Fx 'src/3d/world/water.js'
          echo "$CHANGED" | grep -Fx 'src/3d/world/waterDepthField.js'
          A="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1}END{print s+0}')"
          D="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2}END{print s+0}')"
          echo "shallow-water visual quota additions=$A deletions=$D total=$((A+D))"
          test $((A+D)) -le 1000
      - name: Install water contract runtime dependency
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0
      - name: Static shader and coverage contract
        run: |
          set -euo pipefail
          run_contract() {
            local label="$1"
            shift
            echo "::group::${label}"
            "$@"
            echo "::endgroup::"
          }
          run_contract 'syntax water.js' node --check src/3d/world/water.js
          run_contract 'syntax waterDepthField.js' node --check src/3d/world/waterDepthField.js
          run_contract 'syntax geographicReferencePalette.js' node --check src/3d/world/geographicReferencePalette.js
          run_contract 'syntax auroraNightAtmosphereV5.js' node --check src/3d/auroraNightAtmosphereV5.js
          run_contract 'syntax checkWaterVisualContract.js' node --check scripts/checkWaterVisualContract.js
          run_contract 'syntax checkWaterSurfVisualContract.mjs' node --check scripts/checkWaterSurfVisualContract.mjs
          run_contract 'syntax checkWorldWaterCoverageP0.mjs' node --check scripts/checkWorldWaterCoverageP0.mjs
          run_contract 'syntax checkWaterCoverageRasterQuality.mjs' node --check scripts/checkWaterCoverageRasterQuality.mjs
          run_contract 'syntax checkWaterCoverageSamplingBudget.mjs' node --check scripts/checkWaterCoverageSamplingBudget.mjs
          run_contract 'syntax checkWaterLayerTransition.mjs' node --check scripts/checkWaterLayerTransition.mjs
          run_contract 'syntax checkGeographicReferencePalette.mjs' node --check scripts/checkGeographicReferencePalette.mjs
          run_contract 'syntax checkMarineSkyFloorContract.mjs' node --check scripts/checkMarineSkyFloorContract.mjs
          run_contract 'syntax checkFullWorldMarineRectangles.mjs' node --check scripts/checkFullWorldMarineRectangles.mjs
          run_contract 'syntax captureLiveWorldWaterTopdown.mjs' node --check scripts/captureLiveWorldWaterTopdown.mjs
          run_contract 'world water coverage P0' node scripts/checkWorldWaterCoverageP0.mjs
          run_contract 'water coverage raster quality' node scripts/checkWaterCoverageRasterQuality.mjs
          run_contract 'water coverage sampling budget' node scripts/checkWaterCoverageSamplingBudget.mjs
          run_contract 'water surf visual contract' node scripts/checkWaterSurfVisualContract.mjs
          run_contract 'water layer transition' node scripts/checkWaterLayerTransition.mjs
          run_contract 'geographic reference palette' node scripts/checkGeographicReferencePalette.mjs
          run_contract 'marine sky floor contract' node scripts/checkMarineSkyFloorContract.mjs
      - name: Hydrate scoped smoke-test LFS assets
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**" --exclude=""
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Real GPU water, full-world live proof, mobile and browser safety
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          run_gpu_contract() {
            local label="$1"
            shift
            echo "::group::${label}"
            "$@"
            echo "::endgroup::"
          }
          run_gpu_contract 'real GPU water visual contract' node scripts/checkWaterVisualContract.js
          run_gpu_contract 'Run325 water swell proof' node scripts/checkRun325WaterSwell.js
          run_gpu_contract 'shipped createScene full-world water capture' node scripts/captureLiveWorldWaterTopdown.mjs
          run_gpu_contract 'mobile performance budget' node scripts/checkMobilePerfBudget.js
          run_gpu_contract '3D browser smoke safety' node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-map-shallow-water-visual-proof
          if-no-files-found: warn
          path: |
            artifacts/run325-water-swell/
            artifacts/live-map-shallow-water-visual/
