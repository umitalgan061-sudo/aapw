name: Living World Fauna Threat Policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaThreatPolicy.js'
      - 'scripts/checkLivingWorldFaunaThreatPolicy.mjs'
      - '.github/workflows/living-world-fauna-threat-policy.yml'
  push:
    branches:
      - 'agent/safak-kartali-fauna-threat-policy-20260908'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/livingWorldFaunaThreatPolicy.js && node --check scripts/checkLivingWorldFaunaThreatPolicy.mjs
      - name: Executable contract
        run: node scripts/checkLivingWorldFaunaThreatPolicy.mjs
