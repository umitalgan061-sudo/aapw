name: Run 146 World Event Diversity Guard

on:
  push:
    branches:
      - agent/run146-world-event-diversity-guard
    paths:
      - '.github/workflows/run146-world-event-diversity.yml'
      - 'scripts/checkWorldEventDiversity.js'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_SHA: c113daa7dc9cd9b2df5f56d760433b30e5fd93c5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: agent/run146-world-event-diversity-guard
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md
          test -f CREDITS.md
          test -f 3D_GAME_PROGRESS.md
          test -f DECISIONS.md
          test -f QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
          tail -n 160 3D_GAME_PROGRESS.md
          tail -n 120 DECISIONS.md
          tail -n 120 QUESTIONS_FOR_OWNER.md

      - name: Baseline validation
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkRun143WorldEvents.js
          node scripts/checkRun144WorldEvents.js
          node scripts/checkRun145WorldEvents.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Run new diversity guard
        run: |
          set -euo pipefail
          node --check scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkSmokeCheckRegistry.js
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkWorldEventDiversity.js; then exit 1; fi

      - name: Current mobile and world safety regressions
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run146-mobile-perf.log"
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Full browser and WebGL smoke
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run146-smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run146-smoke.log")"
          test "$PASS_COUNT" -ge 34
          echo "RUN146_SMOKE=$PASS_COUNT" >> "$GITHUB_ENV"

      - name: Performance snapshot and self-review
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run146 | tee "$RUNNER_TEMP/run146-perf.log"
          node scripts/analyzePerfTrend.js
          PERF_ROW="$(tail -n 1 perf_log.csv)"
          echo "RUN146_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git diff --check
          node scripts/checkWorldEventDiversity.js
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Finalize progress and checkpoint records
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          printf '\n\n## Run 146 — FAZ 8 world-event diversity regression guard (%s)\n' "$STAMP" >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Alt görev: büyüyen WORLD_EVENTS kataloğunda normalize edilmiş başlık ve açıklama tekrarlarını yakalayan kalıcı checkWorldEventDiversity.js guard'ı eklendi; runtime davranışı değiştirilmedi." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- DoD: node --check PASS; diversity/catalog/Run143-145/PWA/cache/assets/dialogue/mobile/terrain/road guard PASS; browser/WebGL smoke ${RUN146_SMOKE}/34+ PASS; additive-only PASS." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Performans: ${RUN146_PERF_ROW}. World Coverage: desktop %96.2, mobil resident ~%14.7 (81 chunk / 20.25 km²), değişmedi." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Görsel doğrulama: runtime/render/UI değişmedi; gerçek 2D/3D browser boot smoke ile mevcut görsel davranışın korunduğu doğrulandı." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Memory leak checklist: yeni runtime listener/timer/DOM/geometry/material yok. Teknik borç: 1 (game3d.js 545/600, owner kararı bekliyor). Risk LOW. Güven 5/5." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- ADR: runtime/mimari davranış değişmediği için yeni ADR gerekmiyor. World Evolution delta: oyun içeriği 0; test kapsamı +1 kalıcı katalog kalite guard'ı. Oyuncu fark eder mi: doğrudan hayır; gelecekte yinelenen event metninin oyuna girmesini engeller." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Sıradaki bağımsız adım: owner/asset blokları sürerken FAZ 8 düşük-risk içerik veya test-kalite ilerlemesi; catch-up ~run150." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- $TAG — run 146 world-event diversity guard; ${RUN146_SMOKE}/34+ browser smoke and full governance gates PASS." >> STABLE_TAGS.md
          echo "RUN146_TAG=$TAG" >> "$GITHUB_ENV"
          node scripts/checkCheckpointConsistency.js

      - name: Final concurrency gate, commit, tag and push
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Westeros Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/checkWorldEventDiversity.js .github/workflows/run146-world-event-diversity.yml 3D_GAME_PROGRESS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          git commit -m "test(3d): guard world-event copy diversity (run 146)"
          git tag "$RUN146_TAG"
          git push origin HEAD:agent/run146-world-event-diversity-guard
          git push origin "$RUN146_TAG"
