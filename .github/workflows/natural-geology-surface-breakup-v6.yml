name: natural-geology-surface-breakup-v6

on:
  pull_request:
    paths:
      - 'src/3d/world/naturalGeologySurfaceBreakup.js'
      - 'scripts/checkNaturalGeologySurfaceBreakup.mjs'
      - '.github/workflows/natural-geology-surface-breakup-v6.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-geology-breakup-v6-20260908'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Syntax
        run: node --check src/3d/world/naturalGeologySurfaceBreakup.js && node --check scripts/checkNaturalGeologySurfaceBreakup.mjs
      - name: Contract
        run: node scripts/checkNaturalGeologySurfaceBreakup.mjs
      - name: Diff budget
        run: |
          changed=$(git diff --shortstat origin/main...HEAD | awk '{print $4+$6}')
          test "${changed:-0}" -le 3000
