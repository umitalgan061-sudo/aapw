name: Temporary water v18 occlusion-safe production patch

on:
  push:
    paths:
      - '.github/workflows/_tmp-water-v18-occlusion-safe.yml'

permissions:
  contents: write

jobs:
  patch-water:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aapw-realism-20260831-ocean
          fetch-depth: 0

      - name: Patch production water composition and browser contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          water_path = Path('src/3d/world/water.js')
          water = water_path.read_text()

          replacements = [
              (
                  "id: 'water-world-surface-variation-2026-09-02-v17-deferred-optical-handoff',",
                  "id: 'water-world-surface-variation-2026-09-02-v18-occlusion-safe-organic-handoff',",
              ),
              (
                  "\tlayerHandoffNearFadeEndMeters: 2000,\n\tfarOpticalTransitionStartMeters: 1850,\n\tfarOpticalTransitionFullMeters: 3450,",
                  "\tlayerHandoffNearFadeEndMeters: 2000,\n"
                  "\tlayerHandoffFarRevealStartMeters: 1430,\n"
                  "\tlayerHandoffFarRevealFullMeters: 1710,\n"
                  "\tfarOpticalTransitionStartMeters: 2400,\n"
                  "\tfarOpticalTransitionFullMeters: 3600,",
              ),
              (
                  "\tsoftNearFarLayerHandoff: true,\n\textendedBackdropBeyondFullWorldFrame: true,",
                  "\tsoftNearFarLayerHandoff: true,\n"
                  "\tocclusionSafeNearFarOpacity: true,\n"
                  "\textendedBackdropBeyondFullWorldFrame: true,",
              ),
              (
                  "\t\tfloat farLayerBlend = smoothstep(${WATER_SURFACE_VARIATION_POLICY.layerHandoffFarStartMeters.toFixed(1)}, ${WATER_SURFACE_VARIATION_POLICY.layerHandoffFarFullMeters.toFixed(1)}, layerDistance);\n"
                  "\t\tfloat farOpticalBlend = smoothstep(${WATER_SURFACE_VARIATION_POLICY.farOpticalTransitionStartMeters.toFixed(1)}, ${WATER_SURFACE_VARIATION_POLICY.farOpticalTransitionFullMeters.toFixed(1)}, layerDistance);",
                  "\t\tfloat farLayerBlend = smoothstep(${WATER_SURFACE_VARIATION_POLICY.layerHandoffFarStartMeters.toFixed(1)}, ${WATER_SURFACE_VARIATION_POLICY.layerHandoffFarFullMeters.toFixed(1)}, layerDistance);\n"
                  "\t\tfloat farLayerVisibility = smoothstep(${WATER_SURFACE_VARIATION_POLICY.layerHandoffFarRevealStartMeters.toFixed(1)}, ${WATER_SURFACE_VARIATION_POLICY.layerHandoffFarRevealFullMeters.toFixed(1)}, layerDistance);\n"
                  "\t\tfloat farOpticalBlend = smoothstep(${WATER_SURFACE_VARIATION_POLICY.farOpticalTransitionStartMeters.toFixed(1)}, ${WATER_SURFACE_VARIATION_POLICY.farOpticalTransitionFullMeters.toFixed(1)}, layerDistance);",
              ),
              (
                  "\t\tfloat layerOpacity = mix(nearLayerBlend, farLayerBlend, uFarLayerMask);",
                  "\t\t// Keep the far layer fully present before the near layer starts fading. With two\n"
                  "\t\t// transparent surfaces, complementary 0.5/0.5 alpha still reveals the opaque\n"
                  "\t\t// backdrop and draws a visible LOD ring. This earlier far reveal makes the handoff\n"
                  "\t\t// occlusion-safe while the organic distance warp keeps the transition non-periodic.\n"
                  "\t\tfloat layerOpacity = mix(nearLayerBlend, farLayerVisibility, uFarLayerMask);",
              ),
              (
                  "\t\tsoftNearFarLayerHandoff: true,\n\t\torganicRadialLayerHandoff: true,\n\t\tdeferredFarOpticalHandoff: true,",
                  "\t\tsoftNearFarLayerHandoff: true,\n"
                  "\t\torganicRadialLayerHandoff: true,\n"
                  "\t\tocclusionSafeNearFarOpacity: true,\n"
                  "\t\tdeferredFarOpticalHandoff: true,",
              ),
          ]
          for old, new in replacements:
              count = water.count(old)
              if count != 1:
                  raise SystemExit(f'water.js expected one match, found {count}: {old[:100]!r}')
              water = water.replace(old, new, 1)
          water_path.write_text(water)

          test_path = Path('scripts/checkWaterVisualContract.js')
          test = test_path.read_text()
          test_replacements = [
              (
                  "\t\t\tfail(optical.organicRadialLayerHandoff === true && optical.ownerWorldBorderOpticalSeal === true,\n"
                  "\t\t\t\t'organic near/far or owner-world marine seam suppression metadata disappeared');",
                  "\t\t\tfail(optical.organicRadialLayerHandoff === true && optical.ownerWorldBorderOpticalSeal === true,\n"
                  "\t\t\t\t'organic near/far or owner-world marine seam suppression metadata disappeared');\n"
                  "\t\t\tfail(optical.occlusionSafeNearFarOpacity === true, 'occlusion-safe near/far opacity metadata disappeared');\n"
                  "\t\t\tfail(WATER_SURFACE_VARIATION_POLICY.layerHandoffFarRevealFullMeters <= WATER_SURFACE_VARIATION_POLICY.layerHandoffNearFadeStartMeters,\n"
                  "\t\t\t\t'far water must become fully visible before near water starts fading');\n"
                  "\t\t\tfail(WATER_SURFACE_VARIATION_POLICY.farOpticalTransitionStartMeters >= WATER_SURFACE_VARIATION_POLICY.layerHandoffNearFadeEndMeters + 300,\n"
                  "\t\t\t\t'far-only optical depth must stay outside the transparent near/far handoff band');",
              ),
              (
                  "\t\t\t\t'organicLayerDistance', 'farLayerBlend', 'nearLayerBlend', 'layerOpacity',",
                  "\t\t\t\t'organicLayerDistance', 'farLayerBlend', 'farLayerVisibility', 'nearLayerBlend', 'layerOpacity',",
              ),
              (
                  "organic near/far + owner-border marine seam suppression, ${result.vertexCount} near-water vertices.",
                  "occlusion-safe organic near/far + owner-border marine seam suppression, ${result.vertexCount} near-water vertices.",
              ),
          ]
          for old, new in test_replacements:
              count = test.count(old)
              if count != 1:
                  raise SystemExit(f'checkWaterVisualContract.js expected one match, found {count}: {old[:100]!r}')
              test = test.replace(old, new, 1)
          test_path.write_text(test)
          PY

          node --check src/3d/world/water.js
          node --check scripts/checkWaterVisualContract.js
          git diff --check

      - name: Commit production fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-water-v18-occlusion-safe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/water.js scripts/checkWaterVisualContract.js .github/workflows/_tmp-water-v18-occlusion-safe.yml
          git commit -m 'fix(world): make water LOD handoff occlusion-safe'
          git push origin HEAD:codex/aapw-realism-20260831-ocean
