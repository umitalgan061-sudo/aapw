name: Run216 Editor Clipboard

on:
  pull_request:
    paths:
      - 'editor.html'
      - 'src/3d/editor/EditorClipboardController.js'
      - 'scripts/checkRun216EditorClipboardController.mjs'
      - 'scripts/checkRun216EditorClipboardWiring.js'
      - '.github/workflows/run216-editor-clipboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-clipboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check src/3d/editor/EditorClipboardController.js
      - run: node --check scripts/checkRun216EditorClipboardController.mjs
      - run: node --check scripts/checkRun216EditorClipboardWiring.js
      - run: node --experimental-vm-modules scripts/checkRun216EditorClipboardController.mjs
      - run: node scripts/checkRun216EditorClipboardWiring.js
