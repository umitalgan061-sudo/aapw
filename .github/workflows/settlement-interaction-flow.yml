name: settlement interaction flow
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementInteractionFlow.js'
      - 'scripts/checkSettlementInteractionFlow.mjs'
      - '.github/workflows/settlement-interaction-flow.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementInteractionFlow.js'
      - 'scripts/checkSettlementInteractionFlow.mjs'
      - '.github/workflows/settlement-interaction-flow.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: syntax
        run: node --check src/3d/gameplay/settlementInteractionFlow.js && node --check scripts/checkSettlementInteractionFlow.mjs
      - name: focused regression
        run: node scripts/checkSettlementInteractionFlow.mjs
      - name: runtime/editor boundary
        run: '! grep -n "EditorMaterialStudio\\|document\\.\\|window\\." src/3d/gameplay/settlementInteractionFlow.js'
