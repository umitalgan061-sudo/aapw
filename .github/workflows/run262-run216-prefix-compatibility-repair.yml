name: Run 262 Run216 Prefix Compatibility Repair

on:
  push:
    branches:
      - agent/run262-editor-terrain-elevation-inline
    paths:
      - '.github/workflows/run262-run216-prefix-compatibility-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run262-run216-prefix-compatibility-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting remote-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Restore legacy complete-prefix compatibility additively
        run: |
          set -euo pipefail
          MARKER='// Run216 complete World Editor offline shell extension.'
          FIRST_LINE="$(head -n 1 service-worker.js)"
          if [ "$FIRST_LINE" != "$MARKER" ]; then
            TMP_FILE="$(mktemp)"
            printf '%s\n' "$MARKER" > "$TMP_FILE"
            cat service-worker.js >> "$TMP_FILE"
            mv "$TMP_FILE" service-worker.js
          fi
          node --check service-worker.js
          node scripts/materializeRun216ServiceWorkerCache.js --self-test
          node scripts/checkRun216ServiceWorkerMaterializer.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
      - name: Verify source delta remains additive-only
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Commit compatibility marker
        run: |
          set -euo pipefail
          if git diff --quiet -- service-worker.js; then
            echo 'Run216 complete-prefix compatibility marker already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js
          git diff --cached --check
          git commit -m 'fix(run262): restore Run216 cache-prefix compatibility'
          git push origin HEAD:agent/run262-editor-terrain-elevation-inline
