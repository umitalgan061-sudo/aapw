name: safak-kartali-fauna-ambient-life

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaAmbientLifePolicy.js'
      - 'scripts/checkSafakKartaliFaunaAmbientLifePolicy.mjs'
      - '.github/workflows/safak-kartali-fauna-ambient-life.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-main ancestry gate
        run: |
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Changed-line scope gate
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax gate
        run: node --check src/3d/gameplay/livingWorldFaunaAmbientLifePolicy.js && node --check scripts/checkSafakKartaliFaunaAmbientLifePolicy.mjs
      - name: Runtime proof
        run: node scripts/checkSafakKartaliFaunaAmbientLifePolicy.mjs
      - name: Runtime boundary guard
        run: |
          ! grep -R "EditorMaterialStudio" src/3d/gameplay/livingWorldFaunaAmbientLifePolicy.js scripts/checkSafakKartaliFaunaAmbientLifePolicy.mjs
          ! grep -R -E "(^|[^A-Za-z])(document|window)\." src/3d/gameplay/livingWorldFaunaAmbientLifePolicy.js scripts/checkSafakKartaliFaunaAmbientLifePolicy.mjs
