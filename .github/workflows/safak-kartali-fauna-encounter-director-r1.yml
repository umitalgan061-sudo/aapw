name: Safak Kartali fauna encounter director R1
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldFaunaEncounterDirector.js'
      - 'scripts/generateSafakKartaliFaunaEncounterMatrixR1.mjs'
      - 'scripts/checkSafakKartaliFaunaEncounterDirectorR1.mjs'
      - 'artifacts/safak-kartali-fauna-encounter-r1/**'
      - '.github/workflows/safak-kartali-fauna-encounter-director-r1.yml'
  push:
    branches: ['agent/safak-kartali-fauna-encounter-director-20260915']
    paths:
      - 'src/3d/gameplay/livingWorldFaunaEncounterDirector.js'
      - 'scripts/generateSafakKartaliFaunaEncounterMatrixR1.mjs'
      - 'scripts/checkSafakKartaliFaunaEncounterDirectorR1.mjs'
      - 'artifacts/safak-kartali-fauna-encounter-r1/**'
      - '.github/workflows/safak-kartali-fauna-encounter-director-r1.yml'
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/livingWorldFaunaEncounterDirector.js
          node --check scripts/generateSafakKartaliFaunaEncounterMatrixR1.mjs
          node --check scripts/checkSafakKartaliFaunaEncounterDirectorR1.mjs
      - name: Generate deterministic 4,096-case corpus
        run: node scripts/generateSafakKartaliFaunaEncounterMatrixR1.mjs
      - name: Validate corpus and runtime replay
        run: node scripts/checkSafakKartaliFaunaEncounterDirectorR1.mjs
      - name: Materialize corpus on push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/safak-kartali-fauna-encounter-r1/
          if git diff --cached --quiet; then
            echo 'corpus unchanged'
            exit 0
          fi
          target_branch="$GITHUB_REF_NAME"
          test "$target_branch" = 'agent/safak-kartali-fauna-encounter-director-20260915'
          git commit -m 'generated(fauna): materialize R1 encounter matrix'
          git push origin HEAD:"$target_branch"
      - name: Diff hygiene
        run: git diff --check
