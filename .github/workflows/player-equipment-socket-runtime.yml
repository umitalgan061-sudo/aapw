name: Player Equipment Socket Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/characters/**'
      - 'assets/models/fbx/Viking Sword Blend_Viking Sword.fbx'
      - 'src/3d/assetLoader.js'
      - 'src/3d/materials/MaterialAssignmentCore.js'
      - 'scripts/checkPlayerEquipmentAssetReadiness.mjs'
      - 'scripts/checkPlayerEquipmentSocketRuntime.mjs'
      - '.github/workflows/player-equipment-socket-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-equipment-socket-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  socket-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test "$((ADD + DEL))" -le 3000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Selective player and equipment hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/peasant_girl.fbx,assets/models/fbx/Viking Sword Blend_Viking Sword.fbx" --exclude=""
          for asset in \
            "assets/models/characters/peasant_girl.fbx" \
            "assets/models/fbx/Viking Sword Blend_Viking Sword.fbx"; do
            test -s "$asset"
            test "$(wc -c < "$asset")" -gt 512
            if head -c 128 "$asset" | grep -q 'git-lfs.github.com/spec'; then
              echo "LFS pointer remained after hydration: $asset" >&2
              exit 1
            fi
          done
      - name: Shared material and syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkPlayerEquipmentAssetReadiness.mjs
          node --check scripts/checkPlayerEquipmentSocketRuntime.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          ! grep -q 'EditorMaterialStudio' scripts/checkPlayerEquipmentAssetReadiness.mjs
          ! grep -q 'EditorMaterialStudio' scripts/checkPlayerEquipmentSocketRuntime.mjs
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Hydrated equipment surface and material readiness proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-equipment-readiness
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerEquipmentAssetReadiness.mjs --out-dir=artifacts/player-equipment-readiness | tee artifacts/player-equipment-readiness.log
          grep -q 'PLAYER_EQUIPMENT_ASSET_READINESS_OK' artifacts/player-equipment-readiness.log
          test -s artifacts/player-equipment-readiness/equipment-asset-readiness.json
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('artifacts/player-equipment-readiness/equipment-asset-readiness.json','utf8')); if (p.missingAssetCount !== 0 || p.browserErrors.length !== 0) throw new Error('equipment readiness errors'); if (!(p.equipment.surfaceCount > 0 && p.equipment.materialSlotCount > 0 && p.equipment.namedMaterialCount > 0)) throw new Error('missing named render/material surfaces'); if (p.materialContract.recommendedPalette !== 'steel' || p.materialContract.recommendedTextureSize !== 256) throw new Error('material recommendation drift'); if (p.materialContract.importedMaterialPreserved !== true) throw new Error('imported material was not preserved');"
      - name: Hydrated right-hand socket runtime proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-equipment-socket-runtime
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerEquipmentSocketRuntime.mjs --out-dir=artifacts/player-equipment-socket-runtime | tee artifacts/player-equipment-socket-runtime.log
          grep -q 'PLAYER_EQUIPMENT_SOCKET_RUNTIME_OK' artifacts/player-equipment-socket-runtime.log
          test -s artifacts/player-equipment-socket-runtime/equipment-socket-runtime.json
          grep -q '"missingAssetCount": 0' artifacts/player-equipment-socket-runtime/equipment-socket-runtime.json
          grep -q '"sharedMaterialCoreUsed": true' artifacts/player-equipment-socket-runtime/equipment-socket-runtime.json
          grep -q '"editorMaterialStudioImported": false' artifacts/player-equipment-socket-runtime/equipment-socket-runtime.json
          grep -q '"browserErrors": \[\]' artifacts/player-equipment-socket-runtime/equipment-socket-runtime.json
      - name: Final main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-equipment-socket-runtime-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/player-equipment-readiness/
            artifacts/player-equipment-readiness.log
            artifacts/player-equipment-socket-runtime/
            artifacts/player-equipment-socket-runtime.log
