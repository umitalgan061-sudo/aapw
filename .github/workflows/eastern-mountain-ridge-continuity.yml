name: Eastern Mountain Ridge Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/worldReferenceMountainRelief.js'
      - 'src/3d/world/worldReferenceMap.js'
      - 'src/3d/world/worldReferenceSurfacePindexes.js'
      - 'scripts/checkEasternMountainRidgeContinuity.mjs'
      - 'scripts/checkMountainNaturalizationProfile.mjs'
      - 'scripts/checkMountainNaturalizationDeterminism.mjs'
      - 'scripts/setupNodeThreeShim.mjs'
      - '.github/workflows/eastern-mountain-ridge-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ridge-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs

      - name: Syntax
        run: |
          node --check src/3d/world/worldReferenceMountainRelief.js
          node --check scripts/checkEasternMountainRidgeContinuity.mjs
          node --check scripts/checkMountainNaturalizationProfile.mjs
          node --check scripts/checkMountainNaturalizationDeterminism.mjs

      - name: Long ridge continuity
        run: node scripts/checkEasternMountainRidgeContinuity.mjs

      - name: Existing mountain naturalization safety
        run: |
          node scripts/checkMountainNaturalizationProfile.mjs
          node scripts/checkMountainNaturalizationDeterminism.mjs
