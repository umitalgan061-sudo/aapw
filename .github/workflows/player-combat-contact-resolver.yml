name: player-combat-contact-resolver

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatContactResolver.js'
      - 'scripts/checkPlayerCombatContactResolver.mjs'
      - '.github/workflows/player-combat-contact-resolver.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact-main ancestry and scope
        shell: bash
        run: |
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -le 3
          lines="$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$lines" -le 3000
          ! printf '%s\n' "$changed" | grep -E 'EditorMaterialStudio|src/3d/materials/MaterialAssignmentCore|src/3d/world/WorldAssetPlacementPipeline' || true
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatContactResolver.js
      - name: Executable contract
        run: node scripts/checkPlayerCombatContactResolver.mjs
