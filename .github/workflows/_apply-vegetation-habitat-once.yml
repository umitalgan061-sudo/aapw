name: Apply vegetation habitat patch once

on:
  push:
    branches:
      - codex/vegetation-habitat-distribution-20260901
    paths:
      - '.github/workflows/_apply-vegetation-habitat-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vegetation-habitat-distribution-20260901
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared forest-habitat production patch
        run: python scripts/_applyVegetationHabitatOnce.py
      - name: Validate patch
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/terrainBiomeShading.js
          node --check src/3d/world/vegetation.js
          node --check scripts/checkVegetationEcologicalGroves.mjs
          node scripts/checkVegetationEcologicalGroves.mjs
          node scripts/checkNorthernVegetationDeterminism.mjs
          git diff --check
      - name: Commit validated production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(world): align vegetation scatter with terrain habitat'
          git push origin HEAD:codex/vegetation-habitat-distribution-20260901
