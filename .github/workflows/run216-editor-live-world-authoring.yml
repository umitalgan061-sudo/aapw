name: Run216 Editor Live World Authoring

on:
  push:
    branches:
      - agent/run216-world-editor-transform-controls
    paths:
      - 'editor.html'
      - 'src/3d/editor/EditorLiveWorldAuthoring.js'
      - 'src/3d/editor/EditorLiveWorldBridge.js'
      - 'src/3d/editor/EditorRoadController.js'
      - 'src/3d/editor/EditorTerrainPaintController.js'
      - 'scripts/checkRun216EditorLiveWorldAuthoring.js'
      - 'scripts/checkRun216EditorLiveWorldAuthoringBrowser.js'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-live-world-authoring.yml'
  pull_request:
    paths:
      - 'editor.html'
      - 'src/3d/editor/EditorLiveWorldAuthoring.js'
      - 'src/3d/editor/EditorLiveWorldBridge.js'
      - 'src/3d/editor/EditorRoadController.js'
      - 'src/3d/editor/EditorTerrainPaintController.js'
      - 'scripts/checkRun216EditorLiveWorldAuthoring.js'
      - 'scripts/checkRun216EditorLiveWorldAuthoringBrowser.js'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-live-world-authoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-live-world-authoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Concurrency additive and syntax gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
          node --check src/3d/editor/EditorLiveWorldAuthoring.js
          node --check scripts/checkRun216EditorLiveWorldAuthoring.js
          node --check scripts/checkRun216EditorLiveWorldAuthoringBrowser.js
          node --check scripts/materializeRun216ServiceWorkerCache.js
          node --check scripts/checkRun216ServiceWorkerMaterializer.js

      - name: Source and PWA contracts
        run: |
          set -euo pipefail
          node scripts/checkRun216EditorLiveWorldAuthoring.js
          node scripts/materializeRun216ServiceWorkerCache.js --self-test
          node scripts/checkRun216ServiceWorkerMaterializer.js

      - name: Install temporary Chromium proof tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run216-live-authoring-tools"
          npm install --prefix "$RUNNER_TEMP/run216-live-authoring-tools" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/run216-live-authoring-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/run216-live-authoring-tools/node_modules" >> "$GITHUB_ENV"

      - name: Canonical terrain authoring browser proof
        run: node scripts/checkRun216EditorLiveWorldAuthoringBrowser.js

      - name: Final concurrency additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check

      - name: Upload live authoring evidence
        uses: actions/upload-artifact@v4
        with:
          name: run216-editor-live-authoring
          path: artifacts/run216-editor-live-authoring/*.png
          if-no-files-found: error
