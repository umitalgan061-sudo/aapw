name: Run 220 Editor History Shortcuts Mobile Finalize

on:
  push:
    branches:
      - agent/run220-editor-history-shortcuts-mobile
    paths:
      - '.github/workflows/run220-editor-history-shortcuts-mobile-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run220-editor-history-shortcuts-mobile-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)"
          node --check scripts/checkRun220EditorHistoryShortcutMobile.js
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
      - name: Append verified Run220 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          printf '\n%s\n' '## Run 220 — World Editor history keyboard/mobile regression' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Permanent additive-only Chromium regression verifies Ctrl/Cmd-style history keyboard contract through Ctrl+Z and Ctrl+Shift+Z round-trip, exact marker-tree restoration, redo-stack transitions, and zero desktop console/page errors.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Mobile 390x844 proof verifies Geri Al/Yinele controls are visible at clean boot, correctly disabled before history exists, and the editor has no global horizontal overflow.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- PWA cache/installability, mobile performance, deterministic world-reference/hydrology, terrain/road safety, technical-debt audit, full browser smoke, and final remote-main/additive-only gates PASS.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Next safe step: continue additive-only World Editor usability/regression coverage without crossing unresolved owner gates.' >> 3D_GAME_PROGRESS.md
          printf 'run220,%s,editor-history-shortcuts-mobile,,,,,,,"test-only keyboard/mobile browser regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          printf '%s — Run220 editor history shortcut/mobile regression; keyboard round-trip, mobile toolbar visibility/overflow, PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run220): record editor history shortcut/mobile checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run220-editor-history-shortcuts-mobile
          git push origin "$STABLE_TAG" || true
