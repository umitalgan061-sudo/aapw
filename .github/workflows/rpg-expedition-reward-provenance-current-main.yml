name: RPG Expedition Reward Provenance Current Main

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionRewardProvenance.mjs'
      - '.github/workflows/rpg-expedition-credit-ledger.yml'
      - '.github/workflows/rpg-expedition-reward-provenance-current-main.yml'
      - '.github/workflows/rpg-interaction-quest-loop.yml'
      - '.github/workflows/rpg-expedition-tavern-recovery.yml'
      - '.github/workflows/rpg-tavern-receipt-integrity.yml'
      - '.github/workflows/rpg-journey-history-current.yml'
  workflow_dispatch:

concurrency:
  group: rpg-expedition-reward-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reward-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" HEAD)
          for path in "${FILES[@]}"; do
            case "$path" in
              src/3d/gameplay/interaction.js|src/3d/gameplay/interactionEconomy.js|scripts/checkInteractionExpeditionBoard.mjs|scripts/checkInteractionExpeditionRewardProvenance.mjs|.github/workflows/rpg-expedition-credit-ledger.yml|.github/workflows/rpg-expedition-reward-provenance-current-main.yml|.github/workflows/rpg-interaction-quest-loop.yml|.github/workflows/rpg-expedition-tavern-recovery.yml|.github/workflows/rpg-tavern-receipt-integrity.yml|.github/workflows/rpg-journey-history-current.yml) ;;
              *) echo "unexpected reward-provenance scope path: $path" >&2; exit 1 ;;
            esac
          done
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 1000
          git diff --check "$BASE_SHA" HEAD
      - name: Reward provenance and economy atomicity
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/interaction.js
          node --check src/3d/gameplay/interactionEconomy.js
          node --check scripts/checkInteractionExpeditionRewardProvenance.mjs
          node scripts/checkInteractionExpeditionRewardProvenance.mjs
      - name: Shared deterministic and material contracts
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          git diff --check "$BASE_SHA" HEAD
