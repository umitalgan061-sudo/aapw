name: Kızıl Ufuk - Player Combat Presentation Envelope
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatPresentationEnvelope.js'
      - 'scripts/checkPlayerCombatPresentationEnvelope.mjs'
      - '.github/workflows/player-combat-presentation-envelope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatPresentationEnvelope.js
      - name: Regression
        run: node scripts/checkPlayerCombatPresentationEnvelope.mjs
      - name: Scope
        run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/playerCombatPresentationEnvelope.js scripts/checkPlayerCombatPresentationEnvelope.mjs .github/workflows/player-combat-presentation-envelope.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
