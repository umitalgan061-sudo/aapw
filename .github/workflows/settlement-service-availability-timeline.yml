name: settlement-service-availability-timeline
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceAvailabilityTimeline.js'
      - 'scripts/checkSettlementServiceAvailabilityTimeline.mjs'
      - '.github/workflows/settlement-service-availability-timeline.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/settlementServiceAvailabilityTimeline.js
      - run: node scripts/checkSettlementServiceAvailabilityTimeline.mjs
      - name: Diff budget and boundary guard
        shell: bash
        run: |
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/gameplay/settlementServiceAvailabilityTimeline.js|scripts/checkSettlementServiceAvailabilityTimeline.mjs|.github/workflows/settlement-service-availability-timeline.yml) ;;
              *) echo "unexpected file: $file"; exit 1 ;;
            esac
          done <<< "$files"
          added=$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$added" -le 3000
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
