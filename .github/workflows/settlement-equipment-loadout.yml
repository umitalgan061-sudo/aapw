name: settlement-equipment-loadout
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementEquipmentLoadout.js'
      - 'scripts/checkSettlementEquipmentLoadout.mjs'
      - '.github/workflows/settlement-equipment-loadout.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementEquipmentLoadout.js && node --check scripts/checkSettlementEquipmentLoadout.mjs
      - name: Executable regression
        run: node scripts/checkSettlementEquipmentLoadout.mjs
      - name: Focused scope
        run: |
          files=$(git diff --name-only origin/main...HEAD)
          for file in $files; do
            case "$file" in
              src/3d/gameplay/settlementEquipmentLoadout.js|scripts/checkSettlementEquipmentLoadout.mjs|.github/workflows/settlement-equipment-loadout.yml) ;;
              *) echo "Unexpected file: $file"; exit 1;;
            esac
          done
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Boundary guard
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/settlementEquipmentLoadout.js scripts/checkSettlementEquipmentLoadout.mjs
