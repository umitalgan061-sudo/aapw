name: Run 306 Editor FBX Pack Finalize

on:
  push:
    branches:
      - agent/run306-editor-fbx-pack-node-guard
    paths:
      - '.github/workflows/run306-editor-fbx-pack-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run306-editor-fbx-pack-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main additive preflight
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append checkpoint ledgers
        run: |
          set -euo pipefail
          if ! grep -Fq 'RUN306_FBX_PACK_CHECKPOINT_V1' 3D_GAME_PROGRESS.md; then
            printf '%s\n' '' '<!-- RUN306_FBX_PACK_CHECKPOINT_V1 -->' '## Run 306 — World Editor independent FBX pack transforms — 2026-08-12' '- Owner request: FBX/model packs that previously moved only as one root now expose independent static child packs in the World Editor pack panel.' '- Selected static packs use the existing Inspector and TransformControls for independent position, signed rotation and non-uniform scale while preserving the FBX root and sibling transforms; `0.007` scale precision is covered.' '- Rig/bone/skinned descendants remain root-owned and are intentionally excluded from independent movement to avoid breaking animation skeletons.' '- While a child pack is active, destructive root Delete/Duplicate actions are guarded. `Tüm FBX` restores normal root transform ownership.' '- Scene JSON remains schema-v1 compatible and adds only optional per-root `fbxPacks` transform overrides; path-based restore fails closed when a child path is absent.' '- Legacy Node import compatibility and Run216 service-worker materializer compatibility are explicitly covered after the Run303 cache-prefix fix.' '- Evidence before checkpoint: Run306 DoD `31568698645` PASS; World Event Determinism Guard `31568698502` PASS; Final Head Governance Gate `31568698549` PASS; focused Chromium, PWA/cache, mobile perf/world safety and full browser smoke all PASS.' '- Source delta before checkpoint: `src/3d/editor/EditorScaleInputController.js` +463 / -0; no source deletions.' '- Risk: LOW-MEDIUM. Gameplay/2D runtime is untouched. Remaining tech debt: dedicated pack-level Undo/Redo history coverage is not yet claimed and should be a separate editor atom.' '- ADR: not required; this extends established editor transform/persistence behavior without crossing an owner-gated architecture decision.' '- Next owner backlog item: distinct lake-versus-sea water appearance using the deterministic Run263 water-body classifier, without redistributing third-party raw texture files.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run306-editor-fbx-pack' perf_log.csv; then
            printf '%s\n' 'run306-editor-fbx-pack,2026-08-12,editor-fbx-pack,,,,,,,"editor-only transform/persistence layer; gameplay renderer metrics unchanged; mobile perf budget + full browser smoke PASS"' >> perf_log.csv
          fi
          if ! grep -Fq 'stable-2026-08-12-run306-fbx-pack' STABLE_TAGS.md; then
            printf '%s\n' '- `stable-2026-08-12-run306-fbx-pack` — Run306 node-safe independent FBX pack transforms: focused Chromium, legacy Node/materializer, PWA/cache, mobile perf/world-safety, determinism, governance and full smoke PASS; additive-only source delta +463/-0.' >> STABLE_TAGS.md
          fi
          git diff --check
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(run306): checkpoint FBX pack transforms'
          CURRENT_MAIN="$(git rev-parse origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git push origin HEAD:agent/run306-editor-fbx-pack-node-guard
