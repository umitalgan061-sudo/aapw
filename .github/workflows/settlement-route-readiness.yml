name: Settlement Route Readiness

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementRouteReadiness.js'
      - 'scripts/checkSettlementRouteReadiness.mjs'
      - '.github/workflows/settlement-route-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementRouteReadiness.js'
      - 'scripts/checkSettlementRouteReadiness.mjs'
      - '.github/workflows/settlement-route-readiness.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/3d/gameplay/settlementRouteReadiness.js
      - run: node --check scripts/checkSettlementRouteReadiness.mjs
      - run: node scripts/checkSettlementRouteReadiness.mjs
      - name: Runtime/editor boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|BoxGeometry|MeshBasicMaterial|MeshStandardMaterial' src/3d/gameplay/settlementRouteReadiness.js; then
            echo 'Route readiness must remain a projection over caller-owned RPG systems.'
            exit 1
          fi
      - name: Diff budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git rev-parse origin/main)"
          changed="$(git diff --numstat "$base" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 3000
