name: Run 302 Editor FBX Pack Finalize

on:
  push:
    branches:
      - agent/run302-editor-fbx-pack-clean-publish
    paths:
      - '.github/workflows/run302-editor-fbx-pack-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run302-editor-fbx-pack-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive preflight
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append checkpoint ledgers
        run: |
          set -euo pipefail
          if ! grep -Fq 'RUN302_FBX_PACK_CHECKPOINT_V1' 3D_GAME_PROGRESS.md; then
            printf '%s\n' '' '<!-- RUN302_FBX_PACK_CHECKPOINT_V1 -->' '## Run 302 — World Editor independent FBX pack transforms — 2026-08-12' '- Owner request: FBX/model packs that previously moved only as one root now expose independent static child packs in the World Editor pack panel.' '- A selected pack uses the existing Inspector and TransformControls for independent position / signed rotation / non-uniform scale while preserving the FBX root and sibling-pack transforms; scale precision down to `0.007` is covered.' '- Rig/bone/skinned descendants remain root-owned and are intentionally excluded from independent pack movement to avoid breaking animation skeletons.' '- While a child pack is active, destructive root Delete/Duplicate actions are guarded. `Tüm FBX` restores normal root selection/transform ownership.' '- Scene JSON remains schema-v1 compatible and gains only optional per-root `fbxPacks` transform overrides; load restoration is path-based and missing paths fail closed instead of moving unrelated nodes.' '- Evidence before checkpoint: Run302 clean-publish workflow `31566391042` PASS; World Event Determinism Guard `31566391001` PASS; Final Head Governance Gate `31566390939` PASS; focused Chromium visual evidence, PWA/cache, mobile perf/world-safety and full browser smoke all PASS.' '- Source delta: `src/3d/editor/EditorScaleInputController.js` +414 / -0. Run-level diff remains additive-only.' '- Risk: LOW-MEDIUM. Runtime gameplay/2D behavior is untouched. Remaining editor tech debt: pack-level transforms are persisted, but dedicated pack Undo/Redo history coverage should be added separately before claiming full history parity.' '- ADR: not required for this atom; it extends the established World Editor transform/persistence surface without crossing an owner-gated architecture decision.' '- Next safe owner backlog item: distinct lake-versus-sea water appearance using the deterministic Run263 water-body classifier, without redistributing third-party raw texture assets.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run302-editor-fbx-pack' perf_log.csv; then
            printf '%s\n' 'run302-editor-fbx-pack,2026-08-12,editor-fbx-pack,,,,,,,"editor-only transform/persistence layer; gameplay renderer metrics unchanged; mobile perf budget + full browser smoke PASS"' >> perf_log.csv
          fi
          if ! grep -Fq 'stable-2026-08-12-run302-fbx-pack' STABLE_TAGS.md; then
            printf '%s\n' '- `stable-2026-08-12-run302-fbx-pack` — Run302 independent FBX child/pack transforms: focused Chromium proof, PWA/cache, mobile perf/world-safety, determinism, governance and full browser smoke PASS; additive-only source delta +414/-0.' >> STABLE_TAGS.md
          fi
          git diff --check
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(run302): checkpoint FBX pack transforms'
          CURRENT_MAIN="$(git rev-parse origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git push origin HEAD:agent/run302-editor-fbx-pack-clean-publish
