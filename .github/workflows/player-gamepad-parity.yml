name: Player Gamepad Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/input.js'
      - 'src/3d/gameLoopHelpers.js'
      - 'src/3d/ui/touchJoystick.js'
      - 'scripts/checkPlayerGamepadInput.mjs'
      - 'scripts/checkPlayerGamepadHandoff.mjs'
      - 'scripts/checkPlayerGamepadRuntime.mjs'
      - 'scripts/checkPlayerLockOn.mjs'
      - 'scripts/checkPlayerLockOnRuntime.mjs'
      - 'scripts/checkPlayerMeleeCombo.mjs'
      - '.github/workflows/player-gamepad-parity.yml'
      - '.github/workflows/player-stamina-dodge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-gamepad-parity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$MAIN_SHA")" = "$MAIN_SHA"
          git diff --check "$MAIN_SHA"...HEAD
          CHANGED="$(git diff --name-only "$MAIN_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/input\.js|src/3d/gameLoopHelpers\.js|src/3d/ui/touchJoystick\.js|scripts/checkPlayerGamepadInput\.mjs|scripts/checkPlayerGamepadHandoff\.mjs|scripts/checkPlayerGamepadRuntime\.mjs|scripts/checkPlayerLockOn\.mjs|scripts/checkPlayerLockOnRuntime\.mjs|scripts/checkPlayerMeleeCombo\.mjs|\.github/workflows/player-gamepad-parity\.yml|\.github/workflows/player-stamina-dodge\.yml)$' | wc -l)" -eq 0
          read -r ADD DEL < <(git diff --numstat "$MAIN_SHA"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          TOTAL=$((ADD + DEL))
          echo "base=$MAIN_SHA additions=$ADD deletions=$DEL total=$TOTAL"
          test "$TOTAL" -le 1000
          echo "BASE_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
      - name: Asset-first targeted hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/animations/peasant_girl/**" --exclude=""
          test -s assets/models/characters/peasant_girl.fbx
          test -s assets/animations/peasant_girl/idle.fbx
          test -s assets/animations/peasant_girl/walking.fbx
          test -s assets/animations/peasant_girl/running.fbx
      - name: Standard gamepad movement combat lock-on and handoff contracts
        run: |
          set -euo pipefail
          node --check src/3d/input.js
          node --check src/3d/gameLoopHelpers.js
          node --check src/3d/ui/touchJoystick.js
          node --check scripts/checkPlayerGamepadInput.mjs
          node --check scripts/checkPlayerGamepadHandoff.mjs
          node --check scripts/checkPlayerGamepadRuntime.mjs
          node --check scripts/checkPlayerLockOn.mjs
          node --check scripts/checkPlayerLockOnRuntime.mjs
          node scripts/checkPlayerGamepadInput.mjs
          node scripts/checkPlayerGamepadHandoff.mjs
          node scripts/checkPlayerLockOn.mjs
          node --check scripts/checkPlayerMeleeCombo.mjs
          node scripts/checkPlayerMeleeCombo.mjs
      - name: Shared material PWA and cache contracts
        run: |
          set -euo pipefail
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          ! grep -q 'EditorMaterialStudio' src/3d/input.js
          ! grep -q 'EditorMaterialStudio' src/3d/gameLoopHelpers.js
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped scene gamepad parity and lock-on proof
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerGamepadRuntime.mjs --out-dir=artifacts/player-gamepad | tee artifacts-player-gamepad.log
          test -s artifacts/player-gamepad/gamepad-runtime.png
          test -s artifacts/player-gamepad/gamepad-runtime.json
          grep -q 'PLAYER_GAMEPAD_RUNTIME_OK' artifacts-player-gamepad.log
          grep -q '"browserErrors": \[\]' artifacts/player-gamepad/gamepad-runtime.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerLockOnRuntime.mjs --out-dir=artifacts/player-lock-on | tee artifacts-player-lock-on.log
          test -s artifacts/player-lock-on/lock-on-runtime.png
          test -s artifacts/player-lock-on/lock-on-runtime.json
          grep -q 'PLAYER_LOCK_ON_RUNTIME_OK' artifacts-player-lock-on.log
          grep -q '"browserErrors": \[\]' artifacts/player-lock-on/lock-on-runtime.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
      - name: Final main freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-gamepad-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/player-gamepad/
            artifacts/player-lock-on/
            artifacts-player-gamepad.log
            artifacts-player-lock-on.log
