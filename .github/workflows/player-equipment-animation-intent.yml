name: Player Equipment Animation Intent

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentAnimationIntent.ts'
      - 'scripts/checkPlayerEquipmentAnimationIntent.mjs'
      - '.github/workflows/player-equipment-animation-intent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: exact-main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - name: contract proof
        run: node scripts/checkPlayerEquipmentAnimationIntent.mjs
      - name: scope guard
        run: |
          files="$(git diff --name-only origin/main...HEAD)"
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/gameplay/playerEquipmentAnimationIntent.ts|scripts/checkPlayerEquipmentAnimationIntent.mjs|.github/workflows/player-equipment-animation-intent.yml) ;;
              *) echo "unexpected path: $file"; exit 1 ;;
            esac
          done <<< "$files"
