name: Inspect Surface Textures
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Collect candidate images
        run: |
          mkdir -p artifacts/surface-textures
          cp assets/textures/yüzey/0.jpg artifacts/surface-textures/
          cp assets/textures/yüzey/00.jpg artifacts/surface-textures/
          cp assets/textures/yüzey/000.jpg artifacts/surface-textures/
          cp assets/textures/yüzey/400.jpg artifacts/surface-textures/
          file artifacts/surface-textures/*
      - uses: actions/upload-artifact@v4
        with:
          name: surface-texture-candidates
          path: artifacts/surface-textures/
          retention-days: 1
