name: Player Ranged Aim Director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerRangedAimDirector.js'
      - 'scripts/checkPlayerRangedAimDirector.mjs'
      - '.github/workflows/player-ranged-aim-director.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerRangedAimDirector.js && node --check scripts/checkPlayerRangedAimDirector.mjs
      - name: Executable contract
        run: node scripts/checkPlayerRangedAimDirector.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Runtime boundary
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/playerRangedAimDirector.js scripts/checkPlayerRangedAimDirector.mjs
