name: Coastal Relief Realism Patch
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/coastal-relief-realism-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact guarded runtime patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          terrain_path = Path('src/3d/world/terrain.js')
          terrain = terrain_path.read_text()
          mountain_import = "import { sampleWorldReferenceMountainReliefMeters } from './worldReferenceMountainRelief.js';\n"
          coastal_import = "import { sampleWorldReferenceCoastalBaseMeters } from './worldReferenceCoastalRelief.js';\n"
          if coastal_import not in terrain:
              if terrain.count(mountain_import) != 1:
                  raise SystemExit('terrain mountain import drifted')
              terrain = terrain.replace(mountain_import, mountain_import + coastal_import, 1)

          old_height = "\t\tconst baseHeightMeters =\n\t\t\tfineDetailMeters +\n\t\t\tsampleMacroReliefMeters(worldX, worldZ) +\n\t\t\tsampleWorldReferenceMountainReliefMeters(worldX, worldZ);"
          new_height = "\t\tconst coastalBaseMeters = sampleWorldReferenceCoastalBaseMeters(\n\t\t\tworldX,\n\t\t\tworldZ,\n\t\t\tfineDetailMeters,\n\t\t\tmaxHeightMeters,\n\t\t);\n\t\tconst baseHeightMeters =\n\t\t\tcoastalBaseMeters +\n\t\t\tsampleMacroReliefMeters(worldX, worldZ) +\n\t\t\tsampleWorldReferenceMountainReliefMeters(worldX, worldZ);"
          if new_height not in terrain:
              if terrain.count(old_height) != 1:
                  raise SystemExit('terrain height block drifted')
              terrain = terrain.replace(old_height, new_height, 1)
          terrain_path.write_text(terrain)

          visual_path = Path('src/3d/world/worldReferenceSurfaceTerrainVisual.js')
          visual = visual_path.read_text()
          replacements = {
              "\tqualityBlend: 0.88,": "\tqualityBlend: 0.82,",
              "\tbiomeBlendMax: 0.62,": "\tbiomeBlendMax: 0.52,",
              "\treliefRockBlend: 0.38,": "\treliefRockBlend: 0.30,",
              "\televationRockBlend: 0.28,": "\televationRockBlend: 0.22,",
              "\troughnessBlend: 0.52,": "\troughnessBlend: 0.64,",
              "\tshaderColorMicroVariation: 0.055,": "\tshaderColorMicroVariation: 0.028,",
              "\tshaderRoughnessMicroVariation: 0.05,": "\tshaderRoughnessMicroVariation: 0.03,",
          }
          for old, new in replacements.items():
              if new in visual:
                  continue
              if visual.count(old) != 1:
                  raise SystemExit(f'visual policy drifted: {old}')
              visual = visual.replace(old, new, 1)

          old_attrs = "\tconst position = mesh.geometry.getAttribute('position');\n\tconst color = mesh.geometry.getAttribute('color');\n\tif (!position || !color) throw new TypeError('runtime terrain position+color attributes are required');"
          new_attrs = "\tconst position = mesh.geometry.getAttribute('position');\n\tconst color = mesh.geometry.getAttribute('color');\n\tconst normal = mesh.geometry.getAttribute('normal');\n\tif (!position || !color || !normal) throw new TypeError('runtime terrain position+color+normal attributes are required');"
          if new_attrs not in visual:
              if visual.count(old_attrs) != 1:
                  raise SystemExit('runtime polish attribute block drifted')
              visual = visual.replace(old_attrs, new_attrs, 1)

          old_lerp = "\t\tsourceColor.lerp(COLOR_BY_SURFACE[sample.surface], runtimeSemanticBlend(sample.surface, position.getY(index)));\n\t\tcolor.setXYZ(index, sourceColor.r, sourceColor.g, sourceColor.b);"
          new_lerp = "\t\tsourceColor.lerp(COLOR_BY_SURFACE[sample.surface], runtimeSemanticBlend(sample.surface, position.getY(index)));\n\t\tif (sample.surface !== 'sea' && sample.surface !== 'lake') {\n\t\t\tconst slope = 1 - Math.abs(normal.getY(index));\n\t\t\tconst slopeRockWeight = THREE.MathUtils.smoothstep(slope, 0.16, 0.58) * 0.58;\n\t\t\tsourceColor.lerp(COLOR_BY_SURFACE.rock, slopeRockWeight);\n\t\t}\n\t\tcolor.setXYZ(index, sourceColor.r, sourceColor.g, sourceColor.b);"
          if new_lerp not in visual:
              if visual.count(old_lerp) != 1:
                  raise SystemExit('runtime polish color block drifted')
              visual = visual.replace(old_lerp, new_lerp, 1)

          shader_replacements = {
              "smoothstep(22.0,82.0,vPindexQualityWorldPosition.y)": "smoothstep(70.0,190.0,vPindexQualityWorldPosition.y)",
              "smoothstep(16.0,58.0,vPindexQualityWorldPosition.y)": "smoothstep(105.0,235.0,vPindexQualityWorldPosition.y)",
              "mix(0.025,${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderColorMicroVariation.toFixed(3)}": "mix(0.012,${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderColorMicroVariation.toFixed(3)}",
          }
          for old, new in shader_replacements.items():
              if new in visual:
                  continue
              if visual.count(old) != 1:
                  raise SystemExit(f'quality shader drifted: {old}')
              visual = visual.replace(old, new, 1)
          visual_path.write_text(visual)

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text()
          mountain_cache = "    GAME3D_SHELL_FILES.push('./src/3d/world/worldReferenceMountainRelief.js');\n"
          coastal_cache = "    GAME3D_SHELL_FILES.push('./src/3d/world/worldReferenceCoastalRelief.js');\n"
          if coastal_cache not in sw:
              if sw.count(mountain_cache) != 1:
                  raise SystemExit('service worker mountain cache line drifted')
              sw = sw.replace(mountain_cache, mountain_cache + coastal_cache, 1)
          sw_path.write_text(sw)
          PY
      - name: Static gates
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceCoastalRelief.js
          node --check src/3d/world/terrain.js
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          node --check scripts/checkWorldReferenceCoastalRelief.mjs
          git diff --check
          node scripts/checkWorldReferenceCoastalRelief.mjs
          node scripts/checkServiceWorkerCache.js
      - name: Commit branch runtime patch
        run: |
          set -euo pipefail
          if git diff --quiet -- src/3d/world/terrain.js src/3d/world/worldReferenceSurfaceTerrainVisual.js service-worker.js; then
            echo 'No runtime patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/terrain.js src/3d/world/worldReferenceSurfaceTerrainVisual.js service-worker.js
          git commit -m 'terrain: apply canonical coast-to-inland realism'
          git push origin HEAD:chatgpt/coastal-relief-realism-20260815
