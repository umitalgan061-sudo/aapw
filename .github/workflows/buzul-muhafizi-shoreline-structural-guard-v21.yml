name: Buzul Muhafızı shoreline structural guard v21
on:
  pull_request:
    paths:
      - 'src/3d/world/shorelineStructuralGuard.js'
      - 'scripts/checkShorelineStructuralGuard.mjs'
      - '.github/workflows/buzul-muhafizi-shoreline-structural-guard-v21.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: exact-main ancestry and diff budget
        shell: bash
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = ".github/workflows/buzul-muhafizi-shoreline-structural-guard-v21.yml scripts/checkShorelineStructuralGuard.mjs src/3d/world/shorelineStructuralGuard.js "
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: syntax
        run: |
          node --check src/3d/world/shorelineStructuralGuard.js
          node --check scripts/checkShorelineStructuralGuard.mjs
      - name: executable contract
        run: node scripts/checkShorelineStructuralGuard.mjs
      - name: boundary guard
        shell: bash
        run: |
          ! git diff origin/main...HEAD -- '*.js' '*.yml' | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|terrain\.js|water\.js|sceneManager\.js|naturalGeology\.js|rivers\.js|roads\.js' >/dev/null
      - name: diff hygiene
        run: test -z "$(git diff --check origin/main...HEAD)"
