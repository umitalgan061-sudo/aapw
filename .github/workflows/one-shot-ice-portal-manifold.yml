# Existing-file trigger: this second connector commit lets GitHub register the push workflow before execution.
name: One Shot Ice Portal Manifold Repair

on:
  push:
    branches: [codex/foundation-grounding-20260821]
    paths:
      - '.github/workflows/one-shot-ice-portal-manifold.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebase latest branch and repair open arch contour
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin codex/foundation-grounding-20260821
          python - <<'PY'
          from pathlib import Path

          path = Path('src/3d/world/iceLandmarks.js')
          source = path.read_text()
          old = '''function makePortalShape(width, height, openingHalfWidth, sideHeight, archRise) {
\tconst halfWidth = width * 0.5;
\tconst shape = new THREE.Shape();
\tshape.moveTo(-halfWidth, 0);
\tshape.lineTo(halfWidth, 0);
\tshape.lineTo(halfWidth, height);
\tshape.lineTo(-halfWidth, height);
\tshape.closePath();

\tconst hole = new THREE.Path();
\thole.moveTo(-openingHalfWidth, 0);
\thole.lineTo(-openingHalfWidth, sideHeight);
\tfor (let step = 0; step <= 16; step += 1) {
\t\tconst angle = Math.PI - (step / 16) * Math.PI;
\t\thole.lineTo(
\t\t\tMath.cos(angle) * openingHalfWidth,
\t\t\tsideHeight + Math.sin(angle) * archRise,
\t\t);
\t}
\thole.lineTo(openingHalfWidth, 0);
\thole.closePath();
\tshape.holes.push(hole);
\treturn shape;
}'''
          new = '''function makePortalShape(width, height, openingHalfWidth, sideHeight, archRise) {
\tconst halfWidth = width * 0.5;
\tconst shape = new THREE.Shape();
\t// The cave opening reaches the ground, so it cannot be represented as a Shape hole: a hole
\t// touching the outer contour is degenerate for Earcut and can drop the entire portal cap. Trace
\t// one concave outer contour around the open arch instead. This keeps the passage walkable while
\t// preserving manifold front/back faces above and beside the entrance.
\tshape.moveTo(-halfWidth, 0);
\tshape.lineTo(-openingHalfWidth, 0);
\tshape.lineTo(-openingHalfWidth, sideHeight);
\tfor (let step = 0; step <= 16; step += 1) {
\t\tconst angle = Math.PI - (step / 16) * Math.PI;
\t\tshape.lineTo(
\t\t\tMath.cos(angle) * openingHalfWidth,
\t\t\tsideHeight + Math.sin(angle) * archRise,
\t\t);
\t}
\tshape.lineTo(openingHalfWidth, 0);
\tshape.lineTo(halfWidth, 0);
\tshape.lineTo(halfWidth, height);
\tshape.lineTo(-halfWidth, height);
\tshape.closePath();
\treturn shape;
}'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy portal shape block, found {count}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/one-shot-ice-portal-manifold.yml').unlink()
          PY

      - name: Validate production landmark contract
        run: |
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/iceLandmarks.js
          node scripts/checkIceLandmarks.mjs

      - name: Commit production repair and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "umitalgan061-sudo"
          git config user.email "umitalgan.061@gmail.com"
          git add -- src/3d/world/iceLandmarks.js .github/workflows/one-shot-ice-portal-manifold.yml
          git diff --cached --check
          git commit -m "fix(world): close ice cave portal frame"
          git push origin HEAD:codex/foundation-grounding-20260821
