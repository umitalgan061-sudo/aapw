name: Kizil Ufuk One-Shot Profile Repair
on:
  push:
    branches:
      - codex/kizil-ufuk-player-combat-loadout-runtime-20260908
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'github-actions[bot]' || github.event.head_commit.author.username == 'umitalgan061-sudo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Normalize profile lookups
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/3d/gameplay/playerEquipmentCombatProfile.js')
          s = p.read_text()
          old_weapon = "const profile = PLAYER_WEAPON_PROFILES[id] || PLAYER_WEAPON_PROFILES[explicitType] || PLAYER_WEAPON_PROFILES[DEFAULT_WEAPON_ID];"
          new_weapon = "const profile = PLAYER_WEAPON_PROFILES[id] || PLAYER_WEAPON_PROFILES[explicitType] || Object.values(PLAYER_WEAPON_PROFILES).find((candidate) => candidate.id === id) || PLAYER_WEAPON_PROFILES[DEFAULT_WEAPON_ID];"
          old_armor = "const profile = PLAYER_ARMOR_PROFILES[id] || PLAYER_ARMOR_PROFILES[explicitType] || PLAYER_ARMOR_PROFILES[DEFAULT_ARMOR_ID];"
          new_armor = "const profile = PLAYER_ARMOR_PROFILES[id] || PLAYER_ARMOR_PROFILES[explicitType] || Object.values(PLAYER_ARMOR_PROFILES).find((candidate) => candidate.id === id) || PLAYER_ARMOR_PROFILES[DEFAULT_ARMOR_ID];"
          if s.count(old_weapon) != 1 or s.count(old_armor) != 1:
              raise SystemExit('expected lookup contracts not found exactly once')
          p.write_text(s.replace(old_weapon, new_weapon).replace(old_armor, new_armor))
          PY
      - name: Remove one-shot workflow and commit fix
        run: |
          git config user.name 'umitalgan061-sudo'
          git config user.email 'umitalgan.061@gmail.com'
          rm -f .github/workflows/kizil-ufuk-profile-normalize-fix.yml
          git add src/3d/gameplay/playerEquipmentCombatProfile.js .github/workflows/kizil-ufuk-profile-normalize-fix.yml
          git commit -m 'fix(player): resolve normalized equipment profile ids' || exit 0
          git push origin HEAD