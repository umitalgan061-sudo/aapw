name: Kızıl Ufuk Player World Coverage Runtime Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerWorldCoverageRuntimeAdapter.js'
      - 'src/3d/gameplay/playerWorldCoverageRuntimeSafety.js'
      - 'scripts/checkPlayerWorldCoverageRuntimeSafety.mjs'
      - '.github/workflows/player-world-coverage-runtime-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check src/3d/gameplay/playerWorldCoverageRuntimeSafety.js
          node --check scripts/checkPlayerWorldCoverageRuntimeSafety.mjs
      - name: Enforce runtime boundary
        run: |
          ! grep -n "EditorMaterialStudio" src/3d/gameplay/playerWorldCoverageRuntimeSafety.js
          ! grep -n "from ['\"]three['\"]" src/3d/gameplay/playerWorldCoverageRuntimeSafety.js
      - name: Run safety regression twice
        run: |
          node scripts/checkPlayerWorldCoverageRuntimeSafety.mjs > /tmp/safety-a.json
          node scripts/checkPlayerWorldCoverageRuntimeSafety.mjs > /tmp/safety-b.json
          cmp /tmp/safety-a.json /tmp/safety-b.json
      - name: Enforce changed-line budget
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin "$base" --depth=1
          changed=$(git diff --numstat "$base" "$head" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
