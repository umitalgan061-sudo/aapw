name: modern-typescript-platform

on:
  pull_request:
    paths:
      - 'src/3d/modern/**'
      - 'scripts/checkModernPlatform.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/modern-typescript-platform.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/modern/**'
      - 'scripts/checkModernPlatform.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/modern-typescript-platform.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts
      - run: npm run verify:modern
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - run: npm run build:modern

  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: node scripts/checkModernPlatform.mjs
