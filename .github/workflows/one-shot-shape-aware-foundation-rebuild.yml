name: One-shot Shape-aware Foundation Rebuild

on:
  push:
    branches:
      - codex/foundation-grounding-20260821
    paths:
      - '.github/workflows/one-shot-shape-aware-foundation-rebuild.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded shape-aware rebuild patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          path = Path('src/3d/world/terrainFoundationConformer.js')
          text = path.read_text()
          text = replace_once(
              text,
              "Runtime structure foundations use an adaptive four-cell circle union over the AABB. Near-square\n * footprints use a 2x2 grid; long/narrow footprints rotate the same four-pad budget into 4x1 or 1x4.\n * Every circle encloses its rectangular cell, so the full base stays flat while narrow structures avoid\n * the side overreach a forced 2x2 grid still produced. Legacy authored seat/castle pads remain ordinary\n * circles and continue to work unchanged in `createHeightSampler`.",
              "Runtime structure foundations use an adaptive four-cell oriented-rectangle union. Near-square\n * footprints use a 2x2 grid; long/narrow footprints rotate the same four-pad budget into 4x1 or 1x4.\n * The same rectangle + feather shape now drives both height influence and resident-chunk rebuild selection,\n * avoiding the obsolete circumscribed-circle rebuild overreach. Legacy authored seat/castle pads remain\n * ordinary circles and continue to use circle-vs-chunk intersection unchanged.",
              'module contract',
          )
          text = replace_once(text,
              "id: 'runtime-structure-foundation-conform-2026-08-24-v11-oriented-rect-cells'",
              "id: 'runtime-structure-foundation-conform-2026-08-25-v12-shape-aware-rebuild'",
              'policy id')
          text = replace_once(text,
              "chunkRebuildMode: 'union-deduplicated'",
              "chunkRebuildMode: 'shape-aware-union-deduplicated'",
              'rebuild mode')

          old = """function circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\tconst half = chunkSizeMeters * 0.5;
\tconst centerX = chunkX * chunkSizeMeters;
\tconst centerZ = chunkZ * chunkSizeMeters;
\tconst closestX = Math.max(centerX - half, Math.min(pad.x, centerX + half));
\tconst closestZ = Math.max(centerZ - half, Math.min(pad.z, centerZ + half));
\treturn Math.hypot(pad.x - closestX, pad.z - closestZ) <= pad.outerRadiusMeters;
}
"""
          new = """function circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\tconst half = chunkSizeMeters * 0.5;
\tconst centerX = chunkX * chunkSizeMeters;
\tconst centerZ = chunkZ * chunkSizeMeters;
\tconst closestX = Math.max(centerX - half, Math.min(pad.x, centerX + half));
\tconst closestZ = Math.max(centerZ - half, Math.min(pad.z, centerZ + half));
\treturn Math.hypot(pad.x - closestX, pad.z - closestZ) <= pad.outerRadiusMeters;
}

function orientedRectangleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\tconst axisXX = finiteNumber(pad.axisX?.x);
\tconst axisXZ = finiteNumber(pad.axisX?.z);
\tconst axisZX = finiteNumber(pad.axisZ?.x);
\tconst axisZZ = finiteNumber(pad.axisZ?.z);
\tconst halfWidth = finiteNumber(pad.halfWidthMeters);
\tconst halfDepth = finiteNumber(pad.halfDepthMeters);
\tconst feather = Math.max(0, finiteNumber(pad.featherMeters) ?? 0);
\tif ([axisXX, axisXZ, axisZX, axisZZ, halfWidth, halfDepth].some((value) => value === null)) {
\t\treturn circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
\t}
\tconst xLength = Math.hypot(axisXX, axisXZ);
\tconst zLength = Math.hypot(axisZX, axisZZ);
\tif (xLength < 1e-6 || zLength < 1e-6 || halfWidth < 0 || halfDepth < 0) {
\t\treturn circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
\t}
\tconst ux = axisXX / xLength;
\tconst uz = axisXZ / xLength;
\tconst vx = axisZX / zLength;
\tconst vz = axisZZ / zLength;
\tif (Math.abs(ux * vx + uz * vz) > 0.08) return circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);

\t// SAT between the resident chunk AABB and the foundation rectangle expanded by its feather. The
\t// expansion is deliberately conservative at rounded feather corners: it may rebuild a boundary
\t// chunk that receives zero weight, but can never omit a chunk whose rendered height can change.
\tconst chunkHalf = chunkSizeMeters * 0.5;
\tconst dx = pad.x - chunkX * chunkSizeMeters;
\tconst dz = pad.z - chunkZ * chunkSizeMeters;
\tconst rectHalfX = halfWidth + feather;
\tconst rectHalfZ = halfDepth + feather;
\tif (Math.abs(dx) > chunkHalf + rectHalfX * Math.abs(ux) + rectHalfZ * Math.abs(vx)) return false;
\tif (Math.abs(dz) > chunkHalf + rectHalfX * Math.abs(uz) + rectHalfZ * Math.abs(vz)) return false;
\tif (Math.abs(dx * ux + dz * uz) > rectHalfX + chunkHalf * (Math.abs(ux) + Math.abs(uz))) return false;
\tif (Math.abs(dx * vx + dz * vz) > rectHalfZ + chunkHalf * (Math.abs(vx) + Math.abs(vz))) return false;
\treturn true;
}

function foundationIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters) {
\treturn pad?.shape === 'oriented-rectangle'
\t\t? orientedRectangleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters)
\t\t: circleIntersectsChunk(pad, chunkX, chunkZ, chunkSizeMeters);
}
"""
          text = replace_once(text, old, new, 'chunk intersection helper')
          text = replace_once(text,
              "validPads.some((pad) => circleIntersectsChunk(pad, chunk.x, chunk.z, size))",
              "validPads.some((pad) => foundationIntersectsChunk(pad, chunk.x, chunk.z, size))",
              'shape-aware rebuild selection')
          path.write_text(text)

          test_path = Path('scripts/checkTerrainFoundationConformer.mjs')
          test = test_path.read_text()
          test = replace_once(test,
              "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.chunkRebuildMode, 'union-deduplicated');",
              "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.chunkRebuildMode, 'shape-aware-union-deduplicated');",
              'policy assertion')
          anchor = """assert.deepEqual(events, ['unload:1,0', 'load:1,0'], 'union rebuild must not duplicate unload/load events for one chunk');
events.length = 0;
"""
          addition = anchor + """
// Runtime oriented rectangles must use their real footprint + feather for chunk invalidation instead
// of the much larger compatibility circle envelope. A 45-degree long hall crosses only the three
// diagonal resident chunks below; the old circle envelope also rebuilt the two off-axis chunks.
const shapeEvents = [];
const shapeManager = {
\tchunkSizeMeters: 100,
\tloaded: new Map([
\t\t['-1,1', {}], ['-1,-1', {}], ['0,0', {}], ['1,1', {}], ['1,-1', {}],
\t]),
\tunloadChunk(x, z) { shapeEvents.push(`unload:${x},${z}`); this.loaded.delete(`${x},${z}`); },
\tloadChunk(x, z) { shapeEvents.push(`load:${x},${z}`); this.loaded.set(`${x},${z}`, {}); },
};
const shapeAwareCount = rebuildChunksForFoundation(shapeManager, {
\tshape: 'oriented-rectangle',
\tx: 0, z: 0,
\thalfWidthMeters: 150,
\thalfDepthMeters: 5,
\taxisX: { x: diagonal, z: diagonal },
\taxisZ: { x: -diagonal, z: diagonal },
\tfeatherMeters: 2,
\touterRadiusMeters: Math.hypot(150, 5) + 2,
}, 100);
assert.equal(shapeAwareCount, 3, 'shape-aware rebuild must exclude off-axis chunks inside only the obsolete circle envelope');
assert.deepEqual(shapeEvents, [
\t'unload:-1,-1', 'unload:0,0', 'unload:1,1',
\t'load:-1,-1', 'load:0,0', 'load:1,1',
]);
"""
          test = replace_once(test, anchor, addition, 'shape-aware rebuild regression')
          test_path.write_text(test)
          PY

      - name: Validate exact production contracts before commit
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/terrainFoundationConformer.js
          node --check scripts/checkTerrainFoundationConformer.mjs
          node --check scripts/checkFoundationRenderPhysicsParity.mjs
          node scripts/checkStructureGroundingPolicy.mjs
          node scripts/checkStructureSurfacePolicy.mjs
          node scripts/checkSettlementFoundationAuthority.mjs
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkTerrainFoundationBatchRemoval.mjs
          node scripts/checkFoundationRenderPhysicsParity.mjs

      - name: Commit validated production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AAPW automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/3d/world/terrainFoundationConformer.js scripts/checkTerrainFoundationConformer.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'perf(world): rebuild only foundation-intersecting chunks'
          git push origin HEAD:codex/foundation-grounding-20260821
