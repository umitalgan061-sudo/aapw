name: Kızıl Ufuk Player Animation Command Stream

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatAnimationCommandStream.js'
      - 'scripts/checkPlayerCombatAnimationCommandStream.mjs'
      - '.github/workflows/kizil-ufuk-player-animation-command-stream.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-player-animation-command-stream-20260915-r5'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatAnimationCommandStream.js
          node --check scripts/checkPlayerCombatAnimationCommandStream.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatAnimationCommandStream.mjs
      - name: Diff ceiling
        run: |
          changed=$(git diff --numstat origin/main...HEAD | awk '{ add += $1; del += $2 } END { print add + del }')
          test "${changed:-0}" -le 3000
