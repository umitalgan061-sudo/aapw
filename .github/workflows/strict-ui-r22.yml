name: Kızıl Ufuk Strict UI R22

on:
  pull_request:
    paths:
      - 'src/3d/ui/controlsHelp.ts'
      - 'src/3d/ui/controlsHelp.js'
      - 'src/3d/ui/controlsHelpLegacy.ts'
      - 'src/3d/ui/healthBar.ts'
      - 'src/3d/ui/healthBar.js'
      - 'src/3d/ui/healthBarLegacy.ts'
      - 'src/3d/ui/interactionPrompt.ts'
      - 'src/3d/ui/interactionPrompt.js'
      - 'src/3d/ui/interactionPromptLegacy.ts'
      - 'src/3d/ui/settlementCompass.ts'
      - 'src/3d/ui/settlementCompass.js'
      - 'src/3d/ui/settlementCompassLegacy.ts'
      - 'src/3d/modern/migrationLedgerR22.ts'
      - 'scripts/checkStrictUiMigrationR22.mjs'
      - 'tests/modern/strictUiMigrationR22.test.ts'
  workflow_dispatch:

jobs:
  strict-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install
      - run: node scripts/checkStrictUiMigrationR22.mjs
      - run: npm run typecheck
      - run: npm test -- tests/modern/strictUiMigrationR22.test.ts
