name: Run 277 Pindex01 Detail Polish

on:
  push:
    branches: [agent/run277-pindex01-detail-polish]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run277-pindex01-detail-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 91246f186fd2cc84a85932d41b4d62d197a5df77
  OWNER_MAP_SHA: 20702972e8f45f0fbdc4da5fa68e890a82e4e822e1d58e2f369d8bc5b9c571a1
  TZ: Europe/Istanbul

jobs:
  validate:
    if: github.event.head_commit.message != 'run277 validated pindex01 detail checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Starting exact-main and additive-only gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          grep -F "$OWNER_MAP_SHA" src/3d/world/worldReferencePindex01Detail.js

      - name: Wire pindex01 detail and offline ownership additively
        shell: bash
        run: |
          set -euo pipefail
          TMP_SW="$(mktemp)"
          printf '%s\n' \
            '// Run277 pindex01 deterministic detail offline shell extension.' \
            "self.addEventListener('install', () => {" \
            "    GAME3D_SHELL_FILES.push('./src/3d/world/worldReferencePindex01Detail.js');" \
            '});' \
            '' > "$TMP_SW"
          cat service-worker.js >> "$TMP_SW"
          mv "$TMP_SW" service-worker.js
          printf '%s\n' \
            '' \
            '// Run277 deterministic pindex01 dry-surface micro-detail activation.' \
            "import { applyReferencePindex01DetailToTerrainGroup } from '../src/3d/world/worldReferencePindex01Detail.js';" \
            "if (selector.getActiveSource() === 'canonical' && selector.activation?.windowState?.terrainGroup) {" \
            '  const run277Detail = applyReferencePindex01DetailToTerrainGroup(selector.activation.windowState.terrainGroup);' \
            "  document.body.dataset.run277DetailReady = 'true';" \
            '  document.body.dataset.run277DetailCount = String(run277Detail.detailedVertexCount);' \
            '  document.body.dataset.run277DetailBySurface = JSON.stringify(run277Detail.detailedBySurface);' \
            "  status.textContent += ' | p01-detail=' + run277Detail.detailedVertexCount + 'v';" \
            '  state.renderer.render(state.scene, state.camera);' \
            '}' >> scripts/run201CanonicalDevBoot.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js scripts/run201CanonicalDevBoot.mjs
          git commit -m 'feat(run277): wire pindex01 deterministic detail'
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --numstat "$BASE_SHA" HEAD -- service-worker.js | awk '{print $2}')" = '0'

      - name: Syntax semantic PWA and detail regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferencePindex01Detail.js
          node --check scripts/checkRun277Pindex01Detail.js
          node --check scripts/run201CanonicalDevBoot.mjs
          node scripts/checkRun277Pindex01Detail.js
          node scripts/checkRun276MapSurfacePindexes.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Visual PWA perf determinism world-safety and full smoke DoD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun276CanonicalMapSurfaceBrowser.js
          test -s artifacts/run273-canonical-map-surface/proof.json
          test -s artifacts/run273-canonical-map-surface/canonical-map-surface-online.png
          test -s artifacts/run273-canonical-map-surface/canonical-map-surface-offline.png
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run277-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run277-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run277-smoke.log")" -ge 34

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: run277-pindex01-detail-proof
          path: artifacts/run273-canonical-map-surface/
          if-no-files-found: error
          retention-days: 14

      - name: Pre-publication exact-main concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

      - name: Record checkpoint and publish branch
        shell: bash
        run: |
          set -euo pipefail
          printf '\n%s\n' '## Run 277 — Pindex 01 deterministic dry-surface micro-detail' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Scope is exactly owner-map pindex 01. Run276 sea/lake/soil/rock/snow classification, geometry, heights, roads, bridges, settlements and 2D runtime remain unchanged.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Soil/rock/snow vertex colors receive bounded coordinate-hashed micro-variation; sea and lake are untouched. No Math.random, textures, materials, listeners, timers or new GPU ownership are introduced.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Full pindex regression, online/offline visual proof, PWA/cache/installability, mobile perf, determinism, terrain/road safety, technical debt and 34-check Chromium smoke/console DoD passed.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Next safe step: refresh main and consider pindex 02 only; do not broaden polish across multiple pindexes in one run.' >> 3D_GAME_PROGRESS.md
          printf '\n%s\n' '## ADR-RUN277 — Pindex 01 detail remains classification-preserving and deterministic' >> DECISIONS.md
          printf '%s\n' '- Decision: add bounded coordinate-hashed color micro-detail only to dry pindex-01 vertices after Run276 semantic coloring. Water, geometry and ownership boundaries remain unchanged.' >> DECISIONS.md
          printf '%s\n' '- Risk: LOW. Rollback is removal of the new detail activation/module; Run276 remains the complete fallback surface.' >> DECISIONS.md
          printf '%s\n' 'run277,2026-08-11,pindex01-detail-polish,,,,,,,"bounded deterministic color detail; geometry delta 0; mandatory DoD PASS"' >> perf_log.csv
          TAG="stable-$(date +%Y-%m-%d-%H%M)"
          printf '\n- `%s` — Run277 pindex01 deterministic detail; full mandatory validation PASS.\n' "$TAG" >> STABLE_TAGS.md
          git add 3D_GAME_PROGRESS.md DECISIONS.md perf_log.csv STABLE_TAGS.md
          git commit -m 'run277 validated pindex01 detail checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --numstat "$BASE_SHA" HEAD -- service-worker.js | awk '{print $2}')" = '0'
          git push origin "HEAD:${GITHUB_REF_NAME}"
