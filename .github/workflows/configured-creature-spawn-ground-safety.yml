name: Configured Creature Spawn Ground Safety

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/creatureBrain.js'
      - 'src/3d/gameplay/creatureSpawner.js'
      - 'src/3d/gameplay/livingWorldSpawner.js'
      - 'scripts/checkConfiguredCreatureSpawnGroundSafetyBrowser.mjs'
      - '.github/workflows/configured-creature-spawn-ground-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-creature-spawn-ground-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exact-main scope and budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              src/3d/gameplay/creatureBrain.js|src/3d/gameplay/creatureSpawner.js|src/3d/gameplay/livingWorldSpawner.js|scripts/checkConfiguredCreatureSpawnGroundSafetyBrowser.mjs|.github/workflows/configured-creature-spawn-ground-safety.yml) ;;
              *) echo "Unexpected file in creature spawn safety slice: $path" >&2; exit 1 ;;
            esac
          done
          read -r additions deletions < <(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          total=$((additions + deletions))
          echo "Scope: ${#changed[@]} files; +${additions}/-${deletions}; total=${total}/1000"
          test "$total" -le 1000
          git diff --check origin/main...HEAD

      - name: Syntax and standing contracts
        run: |
          node --check src/3d/gameplay/creatureBrain.js
          node --check src/3d/gameplay/creatureSpawner.js
          node --check src/3d/gameplay/livingWorldSpawner.js
          node --check scripts/checkConfiguredCreatureSpawnGroundSafetyBrowser.mjs
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkSharedMaterialPlacementContract.js

      - name: Install Chromium outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real shipped Three.js procedural creature spawn proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/game3d.html >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/checkConfiguredCreatureSpawnGroundSafetyBrowser.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
