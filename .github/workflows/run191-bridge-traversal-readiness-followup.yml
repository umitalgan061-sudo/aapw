name: Run 191 Bridge Traversal Readiness Follow-up

on:
  push:
    branches: [chatgpt/run191-bridge-traversal-readiness-followup]
    paths:
      - 'scripts/checkCanonicalStoneBridgeTraversalReadiness.js'
      - '.github/workflows/run191-bridge-traversal-readiness-followup.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 1ca5e26c691fe9585086dcc50fdf981a4e3eb1c9
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Start concurrency syntax additive and owner gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node --check scripts/checkCanonicalStoneBridgeTraversalReadiness.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture

      - name: Player ground-height bridge traversal readiness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCanonicalStoneBridgeTraversalReadiness.js | tee "$RUNNER_TEMP/traversal.log"
          grep -F '[checkCanonicalStoneBridgeTraversalReadiness] PASS:' "$RUNNER_TEMP/traversal.log"
          test -s artifacts/run191-bridge-traversal-readiness/proof.json
          cp artifacts/run191-bridge-traversal-readiness/proof.json "$RUNNER_TEMP/proof-a.json"
          node scripts/checkCanonicalStoneBridgeTraversalReadiness.js >/dev/null
          cmp "$RUNNER_TEMP/proof-a.json" artifacts/run191-bridge-traversal-readiness/proof.json

      - name: Determinism hydrology road PWA and mobile regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkCanonicalHydrologyTerrainShadow.js
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/mobile.log"
          SAMPLE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/mobile.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$SAMPLE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$SAMPLE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000

      - name: Full browser smoke and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/smoke.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/smoke.log"; then exit 1; fi

      - name: Upload traversal proof
        uses: actions/upload-artifact@v4
        with:
          name: run191-bridge-traversal-readiness
          path: artifacts/run191-bridge-traversal-readiness/proof.json
          if-no-files-found: error

      - name: Final concurrency and additive gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
