name: SE G77 Terrain3D Rock Snow
on:
  push: { branches: ['terrain/se-g77-terrain3d-rock-snow-exact-*'] }
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/se/g77_rock_snow.mjs'
      - 'godot/terrain-authoring/scripts/validate_g77_terrain3d_rock_snow.gd'
      - 'godot/terrain-authoring/scripts/validate_g77_terrain3d_rock_snow_reload.gd'
      - 'scripts/checkSEG77RockSnow.mjs'
      - 'scripts/checkSEG77RockSnowControlEnvelope.mjs'
      - 'scripts/checkSEG77RockSnowMapFidelity.mjs'
      - 'scripts/checkSEG77RockSnowTerrain3DEvidence.mjs'
      - 'scripts/checkSEG77RockSnowVisualEvidence.mjs'
      - 'scripts/checkSEG77RockSnowEvidenceManifest.mjs'
      - '.github/workflows/se-g77-terrain3d-rock-snow.yml'
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'se-g77-rock-snow-${{ github.head_ref || github.ref_name }}', cancel-in-progress: true }
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main ten-file scope quota and LFS
        run: |
          set -euo pipefail; git fetch origin main; git lfs fsck
          MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"; git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"; echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/se/g77_rock_snow\.mjs|godot/terrain-authoring/scripts/validate_g77_terrain3d_rock_snow(_reload)?\.gd|scripts/checkSEG77RockSnow(ControlEnvelope|MapFidelity|Terrain3DEvidence|VisualEvidence|EvidenceManifest)?\.mjs|\.github/workflows/se-g77-terrain3d-rock-snow\.yml)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 10
          LINES="$(git diff --numstat origin/main...HEAD | awk '{a+=$1;d+=$2}END{print a+d+0}')"; echo "changed-lines=$LINES"; test "$LINES" -le 1000
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py godot/terrain-authoring/addons/zylann.hterrain godot/terrain-authoring/geocells/se/g77_hydrology.mjs godot/terrain-authoring/geocells/se/g77_biome.mjs godot/terrain-authoring/geocells/se/g77_relief.mjs src/3d/world/terrain.js
      - name: Prior layers deterministic source dense seams and map fidelity
        run: |
          set -euo pipefail
          node scripts/checkSEG77Terrain3DHydrology.mjs; node scripts/checkSEG77Biome.mjs --write-probe; node scripts/checkSEG77Relief.mjs; node scripts/checkSEG77ReliefContinuity.mjs
          for f in godot/terrain-authoring/geocells/se/g77_rock_snow.mjs scripts/checkSEG77RockSnow.mjs scripts/checkSEG77RockSnowControlEnvelope.mjs scripts/checkSEG77RockSnowMapFidelity.mjs scripts/checkSEG77RockSnowTerrain3DEvidence.mjs scripts/checkSEG77RockSnowVisualEvidence.mjs scripts/checkSEG77RockSnowEvidenceManifest.mjs; do node --check "$f"; done
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          node scripts/checkSEG77RockSnow.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-probe.json | tee /tmp/source-a.log; cp godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-probe.json /tmp/source-a.json
          node scripts/checkSEG77RockSnow.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-probe.json | tee /tmp/source-b.log; cmp /tmp/source-a.log /tmp/source-b.log; cmp /tmp/source-a.json godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-probe.json
          node scripts/checkSEG77RockSnowControlEnvelope.mjs | tee /tmp/dense-a.log; node scripts/checkSEG77RockSnowControlEnvelope.mjs | tee /tmp/dense-b.log; cmp /tmp/dense-a.log /tmp/dense-b.log
          node scripts/checkSEG77RockSnowMapFidelity.mjs | tee /tmp/map-a.log; node scripts/checkSEG77RockSnowMapFidelity.mjs | tee /tmp/map-b.log; cmp /tmp/map-a.log /tmp/map-b.log
          grep -F SE_G77_ROCK_SNOW_VALIDATION_OK /tmp/source-a.log; grep -F SE_G77_ROCK_SNOW_CONTROL_ENVELOPE_OK /tmp/dense-a.log; grep -F SE_G77_ROCK_SNOW_MAP_FIDELITY_OK /tmp/map-a.log
      - name: Install pinned Terrain3D and Godot 4.6.3
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee /tmp/t3d-install.log; grep -F 'TERRAIN3D_INSTALL_OK version=1.0.2 tag=v1.0.2-stable sha256=a071850250ec5e596aa54da61c01d75768774eb379ee997584d426a45f4884a2' /tmp/t3d-install.log
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | grep -F 'TERRAIN3D_VERIFY_OK version=1.0.2 enabled=true'
          mkdir -p "$RUNNER_TEMP/g"; curl -fL --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/g.zip"; unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP/g"
          G="$(find "$RUNNER_TEMP/g" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$G"; chmod +x "$G"; "$G" --version | grep -F 4.6.3; echo "GODOT_BIN=$G" >> "$GITHUB_ENV"
      - name: Double native Terrain3D Height Control persist reload and LOD0
        run: |
          set -euo pipefail; timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          for suffix in a b; do
            G77_ROCK_SNOW_PROOF_SUFFIX="$suffix" timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g77_terrain3d_rock_snow.gd | tee "/tmp/t3d-$suffix.log"
            grep -F SE_G77_TERRAIN3D_ROCK_SNOW_VALIDATION_OK "/tmp/t3d-$suffix.log"; cp godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-imported-topdown.png "/tmp/imported-$suffix.png"
            G77_ROCK_SNOW_PROOF_SUFFIX="$suffix" timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g77_terrain3d_rock_snow_reload.gd | tee "/tmp/reload-$suffix.log"; grep -F SE_G77_TERRAIN3D_ROCK_SNOW_RELOAD_OK "/tmp/reload-$suffix.log"
          done
          cmp /tmp/imported-a.png /tmp/imported-b.png
          node scripts/checkSEG77RockSnowTerrain3DEvidence.mjs /tmp/t3d-a.log /tmp/t3d-b.log /tmp/reload-a.log /tmp/reload-b.log | tee /tmp/t3d-evidence.log; grep -F SE_G77_ROCK_SNOW_TERRAIN3D_EVIDENCE_OK /tmp/t3d-evidence.log
      - name: Real shipped 3D evidence HTerrain safety PWA mobile and browser regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"; npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0; "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium; export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSEG77RockSnowVisualEvidence.mjs --out-dir=artifacts/se-g77-rock-snow-visual | tee /tmp/visual.log; grep -F SE_G77_ROCK_SNOW_VISUAL_EVIDENCE_OK /tmp/visual.log
          node scripts/checkSEG77RockSnowEvidenceManifest.mjs --out-dir=artifacts/se-g77-rock-snow-visual | tee /tmp/manifest.log; grep -F SE_G77_ROCK_SNOW_EVIDENCE_MANIFEST_OK /tmp/manifest.log
          for f in g77-rock-snow-near.png g77-rock-snow-far.png g77-rock-snow-full-world.png g77-rock-snow-visual-metrics.json g77-rock-snow-evidence-manifest.json; do test -s "artifacts/se-g77-rock-snow-visual/$f"; done
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | grep -F HTERRAIN_AUTHORING_VALIDATION_OK
          node scripts/checkSeededRandomPolicy.js; node scripts/checkWorldReferenceMap.js; node scripts/terrainSeatSafetyCheck.js; node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js; node scripts/checkServiceWorkerCache.js; node scripts/checkMobilePerfBudget.js; node scripts/checkTechnicalDebt.js; node scripts/smokeTestGame3D.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail; git fetch origin main; MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"; git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g77-terrain3d-rock-snow-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-probe.json
            godot/terrain-authoring/.terrain3d-proof/g77-rock-snow-imported-topdown.png
            artifacts/se-g77-rock-snow-visual/
