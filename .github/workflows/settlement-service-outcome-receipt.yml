name: Settlement Service Outcome Receipt

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceOutcomeReceipt.ts'
      - 'scripts/checkSettlementServiceOutcomeReceipt.mjs'
      - '.github/workflows/settlement-service-outcome-receipt.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-head syntax check
        run: |
          node --check scripts/checkSettlementServiceOutcomeReceipt.mjs
          node --experimental-strip-types --check src/3d/gameplay/settlementServiceOutcomeReceipt.ts
      - name: Focused deterministic proof
        run: node --experimental-strip-types scripts/checkSettlementServiceOutcomeReceipt.mjs
