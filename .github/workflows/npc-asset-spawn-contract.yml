name: NPC Asset Spawn Contract

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'src/3d/gameplay/npcConfig.js'
      - 'src/3d/gameplay/livingWorldSpawner.js'
      - 'src/3d/materials/MaterialAssignmentCore.js'
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - 'service-worker.js'
      - 'scripts/checkNpcAssetSpawnContract.mjs'
      - 'scripts/checkNpcGuardPerception.mjs'
      - 'scripts/checkNpcGuardAttack.mjs'
      - 'scripts/checkNpcGuardLeash.mjs'
      - 'scripts/checkNpcGuardLeashBrowser.mjs'
      - 'scripts/game3dSmokeChecksNpcPerception.js'
      - 'scripts/checkNpcSimulationLod.mjs'
      - 'scripts/checkNpcSimulationLodFairness.mjs'
      - '.github/workflows/npc-asset-spawn-contract.yml'
      - '.github/workflows/npc-guard-leash.yml'
  workflow_dispatch:

concurrency:
  group: npc-asset-spawn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 3000
          git diff --check "$BASE_SHA" HEAD
      - name: NPC runtime syntax
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/npc.js
          node --check src/3d/gameplay/livingWorldSpawner.js
      - name: NPC asset spawn contract
        run: |
          set -euo pipefail
          node --check scripts/checkNpcAssetSpawnContract.mjs
          node scripts/checkNpcAssetSpawnContract.mjs
      - name: NPC guard perception contract
        run: |
          set -euo pipefail
          node --check scripts/checkNpcGuardPerception.mjs
          node scripts/checkNpcGuardPerception.mjs
      - name: NPC guard attack contract
        run: |
          set -euo pipefail
          node --check scripts/checkNpcGuardAttack.mjs
          node scripts/checkNpcGuardAttack.mjs
      - name: NPC guard leash contract
        run: |
          set -euo pipefail
          node --check scripts/checkNpcGuardLeash.mjs
          node scripts/checkNpcGuardLeash.mjs
      - name: NPC browser contract syntax
        run: |
          set -euo pipefail
          node --check scripts/checkNpcGuardLeashBrowser.mjs
          node --check scripts/game3dSmokeChecksNpcPerception.js
      - name: Deterministic NPC simulation LOD contract
        run: |
          set -euo pipefail
          node --check scripts/checkNpcSimulationLod.mjs
          node scripts/checkNpcSimulationLod.mjs
          node --check scripts/checkNpcSimulationLodFairness.mjs
          node scripts/checkNpcSimulationLodFairness.mjs
      - name: Shared material placement contract
        run: |
          set -euo pipefail
          node scripts/checkSharedMaterialPlacementContract.js
      - name: Service worker cache regression
        run: |
          set -uo pipefail
          set +e
          node scripts/checkServiceWorkerCache.js 2>&1 | tee "$RUNNER_TEMP/service-worker-cache.log"
          STATUS="${PIPESTATUS[0]}"
          set -e
          exit "$STATUS"
      - name: Upload service-worker cache diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-service-worker-cache-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/service-worker-cache.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Seeded random policy regression
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
