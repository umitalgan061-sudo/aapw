name: Run 281 Pindex03 Detail

on:
  push:
    branches: [run281-pindex03-detail]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run281-pindex03-detail-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 9351b215845d892082cac63c45467fcf01cda176
  TZ: Europe/Istanbul

jobs:
  validate:
    if: github.event.head_commit.message != 'run281 validated pindex03 detail checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
      - name: Wire Pindex03 detail into canonical-dev and offline shell
        shell: bash
        run: |
          set -euo pipefail
          TMP_SW="$(mktemp)"
          printf '%s\n' '// Run281 Pindex-03 detail offline shell extension.' "self.addEventListener('install', () => {" "    GAME3D_SHELL_FILES.push('./src/3d/world/worldReferencePindex03Detail.js');" '});' '' > "$TMP_SW"
          cat service-worker.js >> "$TMP_SW"
          mv "$TMP_SW" service-worker.js
          printf '%s\n' '' '// Run281 deterministic Pindex-03 micro-surface detail activation.' "if (selector.getActiveSource() === 'canonical' && selector.activation?.windowState?.terrainGroup) {" "  const { applyPindex03DetailToTerrainGroup } = await import('../src/3d/world/worldReferencePindex03Detail.js');" '  const run281Detail = applyPindex03DetailToTerrainGroup(selector.activation.windowState.terrainGroup);' "  document.body.dataset.run281Pindex03Ready = 'true';" '  document.body.dataset.run281Pindex03TouchedVertices = String(run281Detail.touchedVertices);' "  status.textContent += ' | pindex03-detail=' + run281Detail.touchedVertices + 'v';" '  state.renderer.render(state.scene, state.camera);' '}' >> scripts/run201CanonicalDevBoot.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js scripts/run201CanonicalDevBoot.mjs
          git commit -m 'feat(run281): activate pindex03 detail in canonical dev'
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --numstat "$BASE_SHA" HEAD -- service-worker.js | awk '{print $2}')" = '0'
      - name: Syntax and contract regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferencePindex03Detail.js
          node --check scripts/checkRun281Pindex03Detail.js
          node --check scripts/checkRun281Pindex03DetailBrowser.js
          node --check scripts/run201CanonicalDevBoot.mjs
          node scripts/checkRun281Pindex03Detail.js
          node scripts/checkRun280OwnerMapSemanticFingerprint.js
          node scripts/checkRun278Pindex02Detail.js
          node scripts/checkRun277Pindex01Detail.js
          node scripts/checkRun276MapSurfacePindexes.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Visual performance and full browser DoD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun281Pindex03DetailBrowser.js
          test -s artifacts/run281-pindex03-detail/proof.json
          test -s artifacts/run281-pindex03-detail/pindex03-detail-online.png
          test -s artifacts/run281-pindex03-detail/pindex03-detail-offline.png
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run281-mobile.log"
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run281-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run281-smoke.log")" -ge 34
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: run281-pindex03-detail-proof
          path: artifacts/run281-pindex03-detail/
          if-no-files-found: error
          retention-days: 14
      - name: Pre-publication exact-main concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
      - name: Record checkpoint and publish branch
        shell: bash
        run: |
          set -euo pipefail
          printf '\n%s\n' '## Run 281 — Pindex-03 deterministic micro-surface detail' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Canonical Pindex-03 received an independently tuned deterministic color micro-detail pass after Run280 fingerprint locking; Pindexes 01-02 remain preserved and 04-10 remain untouched.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Pindex-03 is sea-heavy with a modest soil/rock/snow mix, so its bounded amplitudes are intentionally conservative; geometry, heights, roads, hydrology, gameplay, editor and 2D runtime remain unchanged.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Online/offline Chromium proof requires visible Pindex-03-only color change with zero non-Pindex-03 vertex drift; full PWA/perf/determinism/world-safety/debt/browser DoD must pass before publication.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Next safe step: refresh main and select Pindex-04 only after concurrency/owner gates are rechecked.' >> 3D_GAME_PROGRESS.md
          printf '\n%s\n' '## ADR-RUN281 — Pindex-03 receives conservative deterministic micro-detail' >> DECISIONS.md
          printf '%s\n' '- Risk: LOW.' '- Decision: apply bounded deterministic post-semantic tonal variation only to canonical Pindex-03, with rock amplitude 0.06, soil 0.05, snow 0.025 and water 0.01.' '- Reason: Run280 locks canonical semantic geography; Pindex-03 can therefore gain visual breakup without changing owner-map semantics, geometry or deterministic topology.' '- Regression boundary: browser proof applies Pindex-01 and Pindex-02 first, snapshots colors, then requires every Run281-changed vertex to classify as Pindex-03.' '- Rollback: remove the Run281 activation/new module; Run280 remains the complete prior checkpoint.' >> DECISIONS.md
          printf '%s\n' 'run281,2026-08-11,pindex03-deterministic-detail,,,,,,,"Pindex-03 color micro-detail only; geometry delta 0; mandatory DoD PASS"' >> perf_log.csv
          printf '\n%s\n' '- `stable-2026-08-11-run281` — Pindex-03 deterministic micro-detail; geometry delta 0; mandatory DoD PASS.' >> STABLE_TAGS.md
          git add 3D_GAME_PROGRESS.md DECISIONS.md perf_log.csv STABLE_TAGS.md
          git commit -m 'run281 validated pindex03 detail checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
