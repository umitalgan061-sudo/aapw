name: player-combat-outcome-telemetry
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatOutcomeTelemetry.js'
      - 'scripts/checkPlayerCombatOutcomeTelemetry.mjs'
      - '.github/workflows/player-combat-outcome-telemetry.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatOutcomeTelemetry.js && node --check scripts/checkPlayerCombatOutcomeTelemetry.mjs
      - name: Contract
        run: node scripts/checkPlayerCombatOutcomeTelemetry.mjs
      - name: Shared runtime boundary
        shell: bash
        run: |
          if grep -R "EditorMaterialStudio" -n src/3d/gameplay/playerCombatOutcomeTelemetry.js; then exit 1; fi
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
      - name: Diff cap
        shell: bash
        run: |
          added=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$added" -le 3000