name: SE G65 Terrain3D Runtime Grid

on:
  push:
    branches:
      - agent/kizil-ufuk-g65-runtime-payload-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/runtime/g65Terrain3dRuntimeGrid.mjs'
      - 'scripts/checkSEG65Terrain3DRuntimeGrid.mjs'
      - '.github/workflows/se-g65-terrain3d-runtime-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g65-runtime-grid-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main bounded runtime-grid scope
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(scripts/runtime/g65Terrain3dRuntimeGrid.mjs|scripts/checkSEG65Terrain3DRuntimeGrid.mjs|\.github/workflows/se-g65-terrain3d-runtime-grid.yml)$' | wc -l)" -eq 0
          test "$(git diff --numstat "$BASE_SHA"...HEAD | awk '{a+=$1; d+=$2} END {print a+0}')" -le 500
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/worldReferenceTerrainAdapter.js
          git diff --quiet "$BASE_SHA"...HEAD -- service-worker.js

      - name: Syntax and deterministic G65 source
        run: |
          set -euo pipefail
          node --check scripts/runtime/g65Terrain3dRuntimeGrid.mjs
          node --check scripts/checkSEG65Terrain3DRuntimeGrid.mjs
          node scripts/checkSEG65Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source.log"
          grep -F 'SE_G65_RUNTIME_PARITY_SOURCE_OK' "$RUNNER_TEMP/source.log"

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.godot.before-terrain3d"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg

      - name: Download official Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"
          DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Re-bake Terrain3D and prove runtime grid
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/editor.log"
          G65_RUNTIME_PARITY_PROOF_SUFFIX=runtime-grid timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_runtime_parity.gd 2>&1 | tee "$RUNNER_TEMP/bake.log"
          grep -F 'SE_G65_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake.log"
          node scripts/checkSEG65Terrain3DRuntimeGrid.mjs | tee "$RUNNER_TEMP/grid.log"
          grep -F 'SE_G65_TERRAIN3D_RUNTIME_GRID_OK' "$RUNNER_TEMP/grid.log"
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - name: Restore authoring bootstrap
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/project.godot.before-terrain3d"; then cp "$RUNNER_TEMP/project.godot.before-terrain3d" godot/terrain-authoring/project.godot; fi
          rm -rf godot/terrain-authoring/addons/terrain_3d
          git restore --worktree -- godot/terrain-authoring/addons/zylann.hterrain
          git clean -fdx -- godot/terrain-authoring/terrain_data
          git diff --exit-code -- godot/terrain-authoring/project.godot
          git diff --exit-code -- godot/terrain-authoring/addons/zylann.hterrain
