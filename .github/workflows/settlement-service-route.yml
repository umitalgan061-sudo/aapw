name: settlement-service-route
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceRoute.ts'
      - 'scripts/checkSettlementServiceRoute.mjs'
      - '.github/workflows/settlement-service-route.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/checkSettlementServiceRoute.mjs
      - run: node --check scripts/checkSettlementServiceRoute.mjs
      - run: node --check --experimental-strip-types src/3d/gameplay/settlementServiceRoute.ts
