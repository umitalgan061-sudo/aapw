name: Buzul Muhafızı — environment atmosphere weather contract v50

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentAtmosphereWeatherContractV50.js'
      - 'scripts/checkEnvironmentAtmosphereWeatherContractV50.mjs'
      - '.github/workflows/buzul-muhafizi-environment-atmosphere-weather-v50.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          BASE_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - name: Scope and diff budget
        run: |
          FILES="$(git diff --name-only origin/main...HEAD)"
          test "$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$FILES" | grep -Fx 'src/3d/world/environmentAtmosphereWeatherContractV50.js'
          printf '%s\n' "$FILES" | grep -Fx 'scripts/checkEnvironmentAtmosphereWeatherContractV50.mjs'
          printf '%s\n' "$FILES" | grep -Fx '.github/workflows/buzul-muhafizi-environment-atmosphere-weather-v50.yml'
          CHANGED="$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 3000
      - name: Boundary guards
        run: |
          ! grep -RInE 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|terrain\.js|water\.js|sceneManager\.js|naturalGeology\.js|rivers\.js|roads\.js' src/3d/world/environmentAtmosphereWeatherContractV50.js scripts/checkEnvironmentAtmosphereWeatherContractV50.mjs
          ! grep -RInE 'THREE\.|new (Mesh|BoxGeometry|SphereGeometry|ConeGeometry|PlaneGeometry)' src/3d/world/environmentAtmosphereWeatherContractV50.js
      - name: Syntax
        run: |
          node --check src/3d/world/environmentAtmosphereWeatherContractV50.js
          node --check scripts/checkEnvironmentAtmosphereWeatherContractV50.mjs
      - name: Executable regression
        run: node scripts/checkEnvironmentAtmosphereWeatherContractV50.mjs
