name: Terrain Environment Runtime Adapter

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainEnvironmentRuntimeAdapter.js'
      - 'src/3d/world/terrainEnvironmentDistributionPlanner.js'
      - 'scripts/checkTerrainEnvironmentRuntimeAdapter.mjs'
      - '.github/workflows/terrain-environment-runtime-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact-main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Syntax check
        run: |
          node --check src/3d/world/terrainEnvironmentRuntimeAdapter.js
          node --check scripts/checkTerrainEnvironmentRuntimeAdapter.mjs
      - name: Execute contract
        run: node scripts/checkTerrainEnvironmentRuntimeAdapter.mjs
      - name: Diff budget and whitespace
        run: |
          git diff --check origin/main...HEAD
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
