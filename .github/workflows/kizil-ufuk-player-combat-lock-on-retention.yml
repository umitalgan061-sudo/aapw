name: Kızıl Ufuk Player Combat Lock-On Retention

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatLockOnRetention.js'
      - 'src/3d/gameplay/playerCombatTargetingDirector.js'
      - 'scripts/checkPlayerCombatLockOnRetention.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-lock-on-retention.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact module syntax
        run: node --check src/3d/gameplay/playerCombatLockOnRetention.js
      - name: Run deterministic contract test
        run: node scripts/checkPlayerCombatLockOnRetention.mjs
      - name: Verify bounded diff
        shell: bash
        run: |
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
