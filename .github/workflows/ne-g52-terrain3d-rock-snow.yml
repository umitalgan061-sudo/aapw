name: NE G52 Terrain3D Rock Snow

on:
  push:
    branches:
      - terrain/ne-g52-rock-snow-terrain3d-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'godot/terrain-authoring/geocells/ne/g52_rock_snow.mjs'
      - 'scripts/checkNEG52RockSnow.mjs'
      - 'godot/terrain-authoring/scripts/validate_g52_terrain3d_rock_snow.gd'
      - 'godot/terrain-authoring/corner_claims/NE.json'
      - '.github/workflows/ne-g52-terrain3d-rock-snow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ne-g52-terrain3d-rock-snow-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: f85795822fc9115a9aaafad94842d9c14e411bfe

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/ne/g52_rock_snow.mjs|scripts/checkNEG52RockSnow.mjs|godot/terrain-authoring/scripts/validate_g52_terrain3d_rock_snow.gd|godot/terrain-authoring/corner_claims/NE.json|\.github/workflows/ne-g52-terrain3d-rock-snow.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py

      - name: G52 rock snow determinism map fidelity and seam metrics
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/ne/g52_rock_snow.mjs
          node --check scripts/checkNEG52RockSnow.mjs
          node scripts/checkNEG52RockSnow.mjs | tee "$RUNNER_TEMP/g52-rock-snow-a.log"
          node scripts/checkNEG52RockSnow.mjs | tee "$RUNNER_TEMP/g52-rock-snow-b.log"
          cmp "$RUNNER_TEMP/g52-rock-snow-a.log" "$RUNNER_TEMP/g52-rock-snow-b.log"
          grep -F 'NE_G52_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/g52-rock-snow-a.log"
          node scripts/checkNEG52RockSnow.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g52-rock-snow-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g52-rock-snow-probe.json

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"
          DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Terrain3D control import save LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G52_ROCK_SNOW_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g52_terrain3d_rock_snow.gd | tee "$RUNNER_TEMP/g52-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g52-rock-snow-imported-topdown.png "$RUNNER_TEMP/g52-rock-snow-a.png"
          G52_ROCK_SNOW_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g52_terrain3d_rock_snow.gd | tee "$RUNNER_TEMP/g52-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g52-rock-snow-imported-topdown.png "$RUNNER_TEMP/g52-rock-snow-b.png"
          grep -F 'NE_G52_TERRAIN3D_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/g52-t3d-a.log"
          grep -F 'NE_G52_TERRAIN3D_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/g52-t3d-b.log"
          cmp "$RUNNER_TEMP/g52-rock-snow-a.png" "$RUNNER_TEMP/g52-rock-snow-b.png"
          python3 - "$RUNNER_TEMP/g52-t3d-a.log" "$RUNNER_TEMP/g52-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G52_TERRAIN3D_ROCK_SNOW_METRICS='):
                      return json.loads(line.split('=', 1)[1])
              raise SystemExit('metrics missing')
          a, b = metrics(sys.argv[1]), metrics(sys.argv[2])
          stable = ('terrain3dVersion','regionSize','regionCount','sampleCount','maxBlendError','outputChecksum','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert a['savedRegionFiles'] >= 1 and b['savedRegionFiles'] >= 1
          assert a['savedRegionBytes'] > 0 and b['savedRegionBytes'] > 0
          print('NE_G52_TERRAIN3D_ROCK_SNOW_STABLE_OK')
          PY

      - name: Install Playwright Chromium for world and browser safety
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: HTerrain and world safety regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js

      - name: Browser smoke and mobile performance
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ne-g52-terrain3d-rock-snow-proof
          path: |
            godot/terrain-authoring/.terrain3d-proof/g52-rock-snow-probe.json
            godot/terrain-authoring/.terrain3d-proof/g52-rock-snow-imported-topdown.png
          if-no-files-found: warn
