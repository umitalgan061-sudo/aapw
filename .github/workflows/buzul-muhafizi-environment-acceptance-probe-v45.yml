name: Buzul Muhafizi - Environment Acceptance Probe v45

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentAcceptanceProbeV45.js'
      - 'scripts/checkEnvironmentAcceptanceProbeV45.mjs'
      - '.github/workflows/buzul-muhafizi-environment-acceptance-probe-v45.yml'
  push:
    branches:
      - 'buzul-muhafizi/exact-main-environment-acceptance-probe-v45-20260910'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact scope and ancestry
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = ".github/workflows/buzul-muhafizi-environment-acceptance-probe-v45.yml scripts/checkEnvironmentAcceptanceProbeV45.mjs src/3d/world/environmentAcceptanceProbeV45.js "
          test "$(git rev-list --count origin/main..HEAD)" -le 3
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax
        run: node --check src/3d/world/environmentAcceptanceProbeV45.js && node --check scripts/checkEnvironmentAcceptanceProbeV45.mjs
      - name: Runtime regression
        run: node scripts/checkEnvironmentAcceptanceProbeV45.mjs
      - name: Boundary guard
        shell: bash
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline\|terrain.js\|water.js\|sceneManager.js\|naturalGeology.js\|rivers.js\|roads.js" -n src/3d/world/environmentAcceptanceProbeV45.js scripts/checkEnvironmentAcceptanceProbeV45.mjs
