name: Kızıl Ufuk Equipment Combat Strict

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.js'
      - 'src/3d/gameplay/playerEquipmentCombatProfile.ts'
      - 'src/3d/gameplay/playerEquipmentCombatProfile.js'
      - 'tests/modern/playerEquipmentCombatRulesStrict.test.ts'
      - 'tsconfig.player-equipment-strict.json'
      - 'package.json'
      - '.github/workflows/player-equipment-combat-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kizil-ufuk-equipment-combat-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head with LFS
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: true
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package.json
      - name: Install toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Strict equipment typecheck
        run: npm run typecheck:player-equipment-strict
      - name: Strict equipment regression
        run: npm run test:player-equipment-strict
      - name: Existing equipment runtime proof
        run: node scripts/checkPlayerEquipmentCombatRules.mjs
      - name: Existing material acceptance proof
        run: node scripts/checkPlayerEquipmentMaterialAcceptance.mjs
      - name: Diff hygiene
        run: git diff --check
