name: Apply Owner Map Live Geography

on:
  push:
    branches:
      - agent/buzul-map-reference-geography-db49125
    paths:
      - 'scripts/applyOwnerMapLiveGeographyPatch.mjs'
      - '.github/workflows/apply-owner-map-live-geography.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/buzul-map-reference-geography-db49125
          fetch-depth: 0
      - name: Patch only audited live geography anchors
        run: node scripts/applyOwnerMapLiveGeographyPatch.mjs
      - name: Static syntax checks
        run: |
          node --check src/3d/world/worldReferenceFeatureGuides.js
          node --check src/3d/world/worldReferenceMap.js
          node --check src/3d/world/worldReferenceMountainRelief.js
          node --check src/3d/world/roadPathfinder.js
          node --check src/3d/world/roads.js
          node --check src/3d/world/vegetation.js
      - name: Commit bounded production patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No production patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/worldReferenceMountainRelief.js src/3d/world/roadPathfinder.js src/3d/world/roads.js src/3d/world/vegetation.js
          git commit -m 'feat(world): apply owner-map roads forests and relief'
          git push origin HEAD:agent/buzul-map-reference-geography-db49125
