name: safak-kartali-fauna-runtime-bridge

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaRuntimeBridge.js'
      - 'scripts/checkLivingWorldFaunaRuntimeBridge.mjs'
      - '.github/workflows/safak-kartali-fauna-runtime-bridge.yml'
  push:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaRuntimeBridge.js'
      - 'scripts/checkLivingWorldFaunaRuntimeBridge.mjs'
      - '.github/workflows/safak-kartali-fauna-runtime-bridge.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax and focused regression
        run: |
          node --check src/3d/gameplay/livingWorldFaunaRuntimeBridge.js
          node --check scripts/checkLivingWorldFaunaRuntimeBridge.mjs
          node scripts/checkLivingWorldFaunaRuntimeBridge.mjs
      - name: Deterministic double run
        run: |
          node scripts/checkLivingWorldFaunaRuntimeBridge.mjs > /tmp/a.txt
          node scripts/checkLivingWorldFaunaRuntimeBridge.mjs > /tmp/b.txt
          cmp /tmp/a.txt /tmp/b.txt
      - name: Runtime/editor and shared placement boundaries
        run: |
          ! grep -nE "EditorMaterialStudio|from ['\"]three['\"]|EventBus|ActorRegistry" src/3d/gameplay/livingWorldFaunaRuntimeBridge.js
          grep -n "MaterialAssignmentCore" src/3d/gameplay/livingWorldFaunaRuntimeBridge.js
          grep -n "WorldAssetPlacementPipeline" src/3d/gameplay/livingWorldFaunaRuntimeBridge.js
      - name: Exact-main ancestry and change budget
        run: |
          base_sha=$(git rev-parse origin/main)
          echo "current-main=${base_sha}"
          git merge-base --is-ancestor "$base_sha" HEAD
          changed=$(git diff --numstat "$base_sha"...HEAD | awk '{a+=$1; d+=$2} END{print a+d+0}')
          echo "changed-line-budget=${changed}"
          test "$changed" -le 3000
