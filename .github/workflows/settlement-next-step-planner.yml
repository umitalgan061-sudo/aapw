name: settlement-next-step-planner
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementNextStepPlanner.js'
      - 'scripts/checkSettlementNextStepPlanner.mjs'
      - '.github/workflows/settlement-next-step-planner.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementNextStepPlanner.js'
      - 'scripts/checkSettlementNextStepPlanner.mjs'
      - '.github/workflows/settlement-next-step-planner.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate exact-main ancestry and focused scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          main_head="$(git rev-parse origin/main)"
          test "$base" = "$main_head"
          files="$(git diff --name-only "$main_head"...HEAD)"
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$files" | grep -Fx 'src/3d/gameplay/settlementNextStepPlanner.js'
          printf '%s\n' "$files" | grep -Fx 'scripts/checkSettlementNextStepPlanner.mjs'
          printf '%s\n' "$files" | grep -Fx '.github/workflows/settlement-next-step-planner.yml'
          test "$(git diff --numstat "$main_head"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Check runtime/editor boundaries
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/settlementNextStepPlanner.js scripts/checkSettlementNextStepPlanner.mjs
      - name: Syntax
        run: node --check src/3d/gameplay/settlementNextStepPlanner.js && node --check scripts/checkSettlementNextStepPlanner.mjs
      - name: Executable contract
        run: node scripts/checkSettlementNextStepPlanner.mjs
