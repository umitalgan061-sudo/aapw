name: One-shot Oriented Foundation Patch

on:
  push:
    branches: [codex/foundation-grounding-20260821]
    paths: ['.github/workflows/one-shot-oriented-foundation.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-grounding-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply oriented footprint patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pipeline_path = Path('src/3d/world/WorldAssetPlacementPipeline.js')
          pipeline = pipeline_path.read_text()
          old = "      bounds: footprintGeometry.bounds,\n      points: pointRecords.map((point) => ({ ...point })),"
          new = "      bounds: footprintGeometry.bounds,\n      orientedFootprint: footprintGeometry.orientedFootprint || null,\n      points: pointRecords.map((point) => ({ ...point })),"
          if pipeline.count(old) != 1:
              raise SystemExit(f'conform payload anchor count={pipeline.count(old)}')
          pipeline = pipeline.replace(old, new, 1)
          old = "    bounds: footprintGeometry.bounds,\n    samples: normalizedSamples.map(stripPlacementCoordinates),"
          new = "    bounds: footprintGeometry.bounds,\n    orientedFootprint: footprintGeometry.orientedFootprint || null,\n    samples: normalizedSamples.map(stripPlacementCoordinates),"
          if pipeline.count(old) != 1:
              raise SystemExit(f'footprint record anchor count={pipeline.count(old)}')
          pipeline = pipeline.replace(old, new, 1)

          start = pipeline.index('function worldFootprintFor(object) {')
          end = pipeline.index('\nfunction stripPlacementCoordinates', start)
          replacement = r'''function expandBoxWithGeometryCorners(targetBox, geometryBox, matrixWorld, inverseRoot, scratch) {
            for (const x of [geometryBox.min.x, geometryBox.max.x]) {
              for (const y of [geometryBox.min.y, geometryBox.max.y]) {
                for (const z of [geometryBox.min.z, geometryBox.max.z]) {
                  scratch.set(x, y, z).applyMatrix4(matrixWorld).applyMatrix4(inverseRoot);
                  targetBox.expandByPoint(scratch);
                }
              }
            }
          }

          function rootLocalGeometryBounds(object) {
            object.updateMatrixWorld?.(true);
            const inverseRoot = object.matrixWorld.clone().invert();
            const localBox = new THREE.Box3();
            const scratch = new THREE.Vector3();
            let foundGeometry = false;
            object.traverse?.((node) => {
              const geometry = node?.geometry;
              if (!geometry?.attributes?.position) return;
              if (!geometry.boundingBox) geometry.computeBoundingBox();
              if (!geometry.boundingBox || geometry.boundingBox.isEmpty()) return;
              expandBoxWithGeometryCorners(localBox, geometry.boundingBox, node.matrixWorld, inverseRoot, scratch);
              foundGeometry = true;
            });
            return foundGeometry && !localBox.isEmpty() ? localBox : null;
          }

          function worldFootprintFor(object) {
            if (!object?.isObject3D) return null;
            object.updateMatrixWorld?.(true);
            const localBox = rootLocalGeometryBounds(object);
            if (!localBox) {
              const box = new THREE.Box3().setFromObject(object);
              if (box.isEmpty()) return null;
              const minX = box.min.x;
              const maxX = box.max.x;
              const minZ = box.min.z;
              const maxZ = box.max.z;
              const centerX = (minX + maxX) * 0.5;
              const centerZ = (minZ + maxZ) * 0.5;
              return {
                baseOffsetY: box.min.y - object.position.y,
                orientedFootprint: null,
                bounds: Object.freeze({ minX, maxX, minZ, maxZ, width: maxX - minX, depth: maxZ - minZ }),
                points: [
                  { label: 'center', x: centerX, z: centerZ },
                  { label: 'north-west', x: minX, z: minZ },
                  { label: 'north-east', x: maxX, z: minZ },
                  { label: 'south-west', x: minX, z: maxZ },
                  { label: 'south-east', x: maxX, z: maxZ },
                  { label: 'north-mid', x: centerX, z: minZ },
                  { label: 'south-mid', x: centerX, z: maxZ },
                  { label: 'west-mid', x: minX, z: centerZ },
                  { label: 'east-mid', x: maxX, z: centerZ },
                ],
              };
            }

            const localCenterX = (localBox.min.x + localBox.max.x) * 0.5;
            const localCenterZ = (localBox.min.z + localBox.max.z) * 0.5;
            const halfWidth = (localBox.max.x - localBox.min.x) * 0.5;
            const halfDepth = (localBox.max.z - localBox.min.z) * 0.5;
            const localRecords = [
              ['center', localCenterX, localCenterZ],
              ['north-west', localBox.min.x, localBox.min.z],
              ['north-east', localBox.max.x, localBox.min.z],
              ['south-west', localBox.min.x, localBox.max.z],
              ['south-east', localBox.max.x, localBox.max.z],
              ['north-mid', localCenterX, localBox.min.z],
              ['south-mid', localCenterX, localBox.max.z],
              ['west-mid', localBox.min.x, localCenterZ],
              ['east-mid', localBox.max.x, localCenterZ],
            ];
            const points = localRecords.map(([label, localX, localZ]) => {
              const world = object.localToWorld(new THREE.Vector3(localX, localBox.min.y, localZ));
              return { label, x: world.x, z: world.z };
            });
            const centerWorld = object.localToWorld(new THREE.Vector3(localCenterX, localBox.min.y, localCenterZ));
            const xWorld = object.localToWorld(new THREE.Vector3(localCenterX + 1, localBox.min.y, localCenterZ));
            const zWorld = object.localToWorld(new THREE.Vector3(localCenterX, localBox.min.y, localCenterZ + 1));
            const axisXLength = Math.hypot(xWorld.x - centerWorld.x, xWorld.z - centerWorld.z) || 1;
            const axisZLength = Math.hypot(zWorld.x - centerWorld.x, zWorld.z - centerWorld.z) || 1;
            const orientedFootprint = Object.freeze({
              centerX: centerWorld.x,
              centerZ: centerWorld.z,
              axisX: Object.freeze({ x: (xWorld.x - centerWorld.x) / axisXLength, z: (xWorld.z - centerWorld.z) / axisXLength }),
              axisZ: Object.freeze({ x: (zWorld.x - centerWorld.x) / axisZLength, z: (zWorld.z - centerWorld.z) / axisZLength }),
              halfWidthMeters: halfWidth * axisXLength,
              halfDepthMeters: halfDepth * axisZLength,
            });
            const minX = Math.min(...points.map((point) => point.x));
            const maxX = Math.max(...points.map((point) => point.x));
            const minZ = Math.min(...points.map((point) => point.z));
            const maxZ = Math.max(...points.map((point) => point.z));
            const bottomWorldY = Math.min(...localRecords.slice(1, 5).map(([, localX, localZ]) => (
              object.localToWorld(new THREE.Vector3(localX, localBox.min.y, localZ)).y
            )));
            return {
              baseOffsetY: bottomWorldY - object.position.y,
              orientedFootprint,
              bounds: Object.freeze({ minX, maxX, minZ, maxZ, width: maxX - minX, depth: maxZ - minZ }),
              points,
            };
          }
          '''
          import textwrap
          replacement = textwrap.dedent(replacement).rstrip() + '\n'
          pipeline = pipeline[:start] + replacement + pipeline[end:]
          pipeline_path.write_text(pipeline)

          conformer_path = Path('src/3d/world/terrainFoundationConformer.js')
          conformer = conformer_path.read_text()
          conformer = conformer.replace("id: 'runtime-structure-foundation-conform-2026-08-24-v9-adaptive-cell-safety'", "id: 'runtime-structure-foundation-conform-2026-08-24-v10-oriented-footprint'")
          conformer = conformer.replace("footprintMode: 'aabb-adaptive-four-cell-circle-union'", "footprintMode: 'root-oriented-adaptive-four-cell-circle-union-with-aabb-fallback'")
          anchor = '''function chooseAdaptiveGrid(width, depth) {'''
          helper = r'''function normalizedOrientedFootprint(value) {
            if (!value || typeof value !== 'object') return null;
            const centerX = finiteNumber(value.centerX);
            const centerZ = finiteNumber(value.centerZ);
            const halfWidthMeters = finiteNumber(value.halfWidthMeters);
            const halfDepthMeters = finiteNumber(value.halfDepthMeters);
            let axisXX = finiteNumber(value.axisX?.x);
            let axisXZ = finiteNumber(value.axisX?.z);
            let axisZX = finiteNumber(value.axisZ?.x);
            let axisZZ = finiteNumber(value.axisZ?.z);
            if ([centerX, centerZ, halfWidthMeters, halfDepthMeters, axisXX, axisXZ, axisZX, axisZZ].some((entry) => entry === null)) return null;
            if (halfWidthMeters < 0 || halfDepthMeters < 0) return null;
            const xLength = Math.hypot(axisXX, axisXZ);
            const zLength = Math.hypot(axisZX, axisZZ);
            if (xLength < 1e-6 || zLength < 1e-6) return null;
            axisXX /= xLength; axisXZ /= xLength; axisZX /= zLength; axisZZ /= zLength;
            if (Math.abs(axisXX * axisZX + axisXZ * axisZZ) > 0.08) return null;
            return { centerX, centerZ, halfWidthMeters, halfDepthMeters, axisX: { x: axisXX, z: axisXZ }, axisZ: { x: axisZX, z: axisZZ } };
          }

          '''
          import textwrap
          helper = textwrap.dedent(helper)
          if conformer.count(anchor) != 1: raise SystemExit('choose grid anchor missing')
          conformer = conformer.replace(anchor, helper + anchor, 1)

          start = conformer.index('function createAdaptiveCellPads(')
          end = conformer.index('\n/**\n * Converts one structure footprint', start)
          cell_func = r'''function createAdaptiveCellPads(bounds, orientedFootprint, targetHeight, key, safeInnerMargin, safeFeather) {
            const oriented = normalizedOrientedFootprint(orientedFootprint);
            const width = oriented ? oriented.halfWidthMeters * 2 : bounds.maxX - bounds.minX;
            const depth = oriented ? oriented.halfDepthMeters * 2 : bounds.maxZ - bounds.minZ;
            const { columns, rows } = chooseAdaptiveGrid(width, depth);
            const cellWidth = width / columns;
            const cellDepth = depth / rows;
            const cellRadius = Math.max(
              TERRAIN_FOUNDATION_CONFORM_POLICY.minimumInnerRadiusMeters,
              Math.hypot(cellWidth * 0.5, cellDepth * 0.5) + safeInnerMargin,
            );
            const pads = [];
            for (let row = 0; row < rows; row += 1) {
              for (let column = 0; column < columns; column += 1) {
                const localX = -width * 0.5 + cellWidth * (column + 0.5);
                const localZ = -depth * 0.5 + cellDepth * (row + 0.5);
                const x = oriented
                  ? oriented.centerX + oriented.axisX.x * localX + oriented.axisZ.x * localZ
                  : (columns === 1 ? (bounds.minX + bounds.maxX) * 0.5 : bounds.minX + cellWidth * (column + 0.5));
                const z = oriented
                  ? oriented.centerZ + oriented.axisX.z * localX + oriented.axisZ.z * localZ
                  : (rows === 1 ? (bounds.minZ + bounds.maxZ) * 0.5 : bounds.minZ + cellDepth * (row + 0.5));
                pads.push({
                  x, z,
                  innerRadiusMeters: cellRadius,
                  outerRadiusMeters: cellRadius + safeFeather,
                  anchorHeightMeters: targetHeight,
                  source: TERRAIN_FOUNDATION_CONFORM_POLICY.id,
                  foundationKey: key,
                  foundationClusterIndex: pads.length,
                  foundationClusterSize: columns * rows,
                  footprintBounds: { ...bounds },
                  orientedFootprint: oriented ? { ...oriented, axisX: { ...oriented.axisX }, axisZ: { ...oriented.axisZ } } : null,
                });
              }
            }
            return pads;
          }
          '''
          cell_func = textwrap.dedent(cell_func).rstrip() + '\n'
          conformer = conformer[:start] + cell_func + conformer[end:]
          old = "\tconst key = structureKey(payload);\n\tconst pads = createAdaptiveCellPads(bounds, targetHeight, key, safeInnerMargin, safeFeather);"
          new = "\tconst key = structureKey(payload);\n\tconst orientedFootprint = normalizedOrientedFootprint(payload?.orientedFootprint);\n\tconst pads = createAdaptiveCellPads(bounds, orientedFootprint, targetHeight, key, safeInnerMargin, safeFeather);"
          if conformer.count(old) != 1: raise SystemExit('pad create anchor missing')
          conformer = conformer.replace(old, new, 1)
          old = "\t\t\tfootprintBounds: { ...bounds },\n\t\t},"
          new = "\t\t\tfootprintBounds: { ...bounds },\n\t\t\torientedFootprint: orientedFootprint ? { ...orientedFootprint, axisX: { ...orientedFootprint.axisX }, axisZ: { ...orientedFootprint.axisZ } } : null,\n\t\t},"
          if conformer.count(old) != 1: raise SystemExit('compat pad anchor missing')
          conformer = conformer.replace(old, new, 1)
          conformer_path.write_text(conformer)

          test_path = Path('scripts/checkTerrainFoundationConformer.mjs')
          test = test_path.read_text()
          test = test.replace("assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.footprintMode, 'aabb-adaptive-four-cell-circle-union');", "assert.equal(TERRAIN_FOUNDATION_CONFORM_POLICY.footprintMode, 'root-oriented-adaptive-four-cell-circle-union-with-aabb-fallback');")
          marker = "const tallBuilt = createFoundationFlattenPad({"
          oriented_test = r'''const diagonal = Math.SQRT1_2;
          const rotatedLongBuilt = createFoundationFlattenPad({
            metadata: { id: 'rotated-long-hall' },
            bounds: { minX: -38.891, maxX: 38.891, minZ: -38.891, maxZ: 38.891 },
            orientedFootprint: {
              centerX: 0, centerZ: 0,
              axisX: { x: diagonal, z: diagonal },
              axisZ: { x: -diagonal, z: diagonal },
              halfWidthMeters: 50,
              halfDepthMeters: 5,
            },
            targetHeight: 133,
          }, { innerMarginMeters: 0, featherMeters: 2 });
          assert.equal(rotatedLongBuilt.ok, true, rotatedLongBuilt.error);
          assert.equal(rotatedLongBuilt.pads.length, 4);
          assert(rotatedLongBuilt.pads.every((pad) => Math.abs(pad.x - pad.z) < 1e-9),
            'rotated 100x10m hall must place its four compact pads along the real diagonal long axis');
          assert(rotatedLongBuilt.pads.every((pad) => pad.innerRadiusMeters < 14),
            'oriented footprint must avoid sizing pads from the much wider world AABB');
          const rotatedSampler = createHeightSampler(123, undefined, rotatedLongBuilt.pads);
          for (const [localX, localZ] of [[-50, -5], [-50, 5], [50, -5], [50, 5], [0, 0]]) {
            const x = diagonal * localX - diagonal * localZ;
            const z = diagonal * localX + diagonal * localZ;
            assert.equal(rotatedSampler(x, z), 133, `rotated footprint point ${localX},${localZ} must be fully conformed`);
          }
          const rotatedSideProbe = { x: -diagonal * 25, z: diagonal * 25 };
          assert.equal(rotatedSampler(rotatedSideProbe.x, rotatedSideProbe.z), baseSampler(rotatedSideProbe.x, rotatedSideProbe.z),
            'oriented foundation must preserve terrain inside the world AABB but far outside the real narrow footprint');

          '''
          oriented_test = textwrap.dedent(oriented_test)
          if test.count(marker) != 1: raise SystemExit('test marker missing')
          test = test.replace(marker, oriented_test + marker, 1)
          test = test.replace('adaptive four-cell foundation clusters cover full AABBs, rotate along long footprints,', 'adaptive four-cell foundation clusters cover AABB fallbacks and root-oriented footprints, rotate along long footprints,')
          test_path.write_text(test)

          world_test_path = Path('scripts/checkWorldFootprintGrounding.mjs')
          world_test = world_test_path.read_text()
          anchor = "assert.equal(conformCall?.samples?.length, 9, 'terrain conformer receives the complete footprint');\n"
          addition = "assert(conformCall?.orientedFootprint, 'terrain conformer must receive the root-oriented footprint basis');\nassert(Math.abs(conformCall.orientedFootprint.halfWidthMeters - 4) < 1e-6, 'rotated 8m local width must remain 8m instead of inflating to its world AABB');\nassert(Math.abs(conformCall.orientedFootprint.halfDepthMeters - 6) < 1e-6, 'rotated 12m local depth must remain 12m instead of inflating to its world AABB');\nassert(conformCall.bounds.width * conformCall.bounds.depth > 96, 'world AABB remains a conservative compatibility envelope around the tighter oriented footprint');\n"
          if world_test.count(anchor) != 1: raise SystemExit('world test anchor missing')
          world_test = world_test.replace(anchor, anchor + addition, 1)
          world_test = world_test.replace('structures sample their whole footprint, never hover on the low side, expose a terrain-conform hook,', 'structures sample their root-oriented footprint, never hover on the low side, expose an oriented terrain-conform hook,')
          world_test_path.write_text(world_test)
          PY
      - name: Validate oriented foundation patch
        run: |
          set -euo pipefail
          node scripts/setupNodeThreeShim.mjs
          node --check src/3d/world/WorldAssetPlacementPipeline.js
          node --check src/3d/world/terrainFoundationConformer.js
          node --check scripts/checkTerrainFoundationConformer.mjs
          node --check scripts/checkWorldFootprintGrounding.mjs
          node scripts/checkTerrainFoundationConformer.mjs
          node scripts/checkWorldFootprintGrounding.mjs
          node scripts/checkStructureGroundingPolicy.mjs
      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/3d/world/WorldAssetPlacementPipeline.js src/3d/world/terrainFoundationConformer.js scripts/checkTerrainFoundationConformer.mjs scripts/checkWorldFootprintGrounding.mjs
          git diff --cached --check
          git commit -m 'feat(world): conform rotated structures by oriented footprint'
          git push origin HEAD:codex/foundation-grounding-20260821
