name: Buzul Muhafızı Water Shoreline Adoption v24

on:
  pull_request:
    paths:
      - 'src/3d/world/waterShorelineAdoption.js'
      - 'scripts/checkWaterShorelineAdoption.mjs'
      - '.github/workflows/buzul-muhafizi-water-shoreline-adoption-v24.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Verify exact-main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/world/waterShorelineAdoption.js|scripts/checkWaterShorelineAdoption.mjs|.github/workflows/buzul-muhafizi-water-shoreline-adoption-v24.yml) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done <<< "$files"
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          git diff --check origin/main...HEAD
      - name: Syntax
        run: |
          node --check src/3d/world/waterShorelineAdoption.js
          node --check scripts/checkWaterShorelineAdoption.mjs
      - name: Execute contract
        run: node scripts/checkWaterShorelineAdoption.mjs
      - name: Shared material and editor boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/world/waterShorelineAdoption.js scripts/checkWaterShorelineAdoption.mjs
          ! grep -R "three\|terrain.js\|water.js\|sceneManager.js" src/3d/world/waterShorelineAdoption.js
