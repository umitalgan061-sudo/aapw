name: settlement action availability
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementActionAvailability.js'
      - 'scripts/checkSettlementActionAvailability.mjs'
      - '.github/workflows/settlement-action-availability.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/checkSettlementActionAvailability.mjs
      - run: node --check src/3d/gameplay/settlementActionAvailability.js
      - run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/settlementActionAvailability.js scripts/checkSettlementActionAvailability.mjs .github/workflows/settlement-action-availability.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/settlementActionAvailability.js
