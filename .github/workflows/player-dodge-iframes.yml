name: Player Dodge I-Frames

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerDodgeIFrames.mjs'
      - '.github/workflows/player-dodge-iframes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-dodge-iframes-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test $((ADD + DEL)) -le 1000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Dodge i-frame contract
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/player.js
          node --check scripts/checkPlayerDodgeIFrames.mjs
          node scripts/checkPlayerDodgeIFrames.mjs
      - name: Shared runtime contracts
        run: |
          set -euo pipefail
          node scripts/checkPlayerStaminaDodge.mjs
          node scripts/checkPlayerMeleeCombo.mjs
          node scripts/checkPlayerLockOn.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkServiceWorkerCache.js
      - name: Final main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
