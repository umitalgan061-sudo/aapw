name: Run 218 Editor Authoring Regression Suite V2

on:
  push:
    branches:
      - agent/run218-editor-authoring-regression-suite-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run218-editor-authoring-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting main concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)"
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and additive-only gates
        run: |
          set -euo pipefail
          node --check scripts/checkRun218EditorAuthoringRegressionSuiteV2.js
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
          git diff --numstat origin/main...HEAD -- scripts/checkRun218EditorAuthoringRegressionSuiteV2.js .github/workflows/run218-editor-authoring-regression-suite-v2.yml | awk '$2 != 0 { exit 1 }'
      - name: Focused editor authoring regressions
        run: node scripts/checkRun218EditorAuthoringRegressionSuiteV2.js
      - name: PWA cache and installability
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
      - name: Mobile performance and deterministic world safety
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Full browser smoke
        run: node scripts/smokeTestGame3D.js
      - name: Final remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload editor visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run218-editor-authoring-regression-suite-v2
          path: artifacts/run216-editor-visible-aurora
          if-no-files-found: error
