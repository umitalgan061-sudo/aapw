name: Apply Owner Map Forest Paint

on:
  push:
    branches: [agent/buzul-map-reference-geography-db49125]
    paths:
      - 'scripts/applyOwnerMapForestPaintPatch.mjs'
      - '.github/workflows/apply-owner-map-forest-paint.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/buzul-map-reference-geography-db49125
      - run: node scripts/applyOwnerMapForestPaintPatch.mjs
      - run: node --check src/3d/world/terrain.js
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/terrain.js
          git commit -m 'feat(world): paint owner-map forests into live terrain'
          git push origin HEAD:agent/buzul-map-reference-geography-db49125
