name: Buzul Muhafızı Photorealism Director
on:
  pull_request:
    paths:
      - 'src/3d/world/photorealismDirector.ts'
      - 'src/3d/world/photorealismDirector.js'
      - 'src/3d/world/photorealismRuntimeAdapter.ts'
      - 'src/3d/world/photorealismRuntimeAdapter.js'
      - 'src/3d/world/photorealismSceneBridge.ts'
      - 'src/3d/world/photorealismSceneBridge.js'
      - 'scripts/checkPhotorealismDirector.mjs'
      - 'tests/modern/photorealismDirector.test.ts'
      - 'tests/modern/photorealismRuntimeAdapter.test.ts'
      - 'tests/modern/photorealismSceneBridge.test.ts'
      - '.github/workflows/buzul-photorealism-director.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/checkPhotorealismDirector.mjs
      - run: >-
          npx tsc --noEmit --target ES2024 --module ESNext
          --moduleResolution Bundler --skipLibCheck
          src/3d/world/photorealismDirector.ts
          src/3d/world/photorealismRuntimeAdapter.ts
          src/3d/world/photorealismSceneBridge.ts
      - run: npx vitest run tests/modern/photorealismDirector.test.ts tests/modern/photorealismRuntimeAdapter.test.ts tests/modern/photorealismSceneBridge.test.ts
