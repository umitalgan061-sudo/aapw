name: Natural geology surface patch runner

on:
  push:
    branches:
      - codex/aapw-realism-20260831-ocean

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aapw-realism-20260831-ocean
          fetch-depth: 0
      - name: Sync branch
        run: git pull --ff-only origin codex/aapw-realism-20260831-ocean
      - name: Apply patch
        run: python .github/apply-natural-geology-surface-fabric.py
      - name: Validate production source
        run: |
          node --check src/3d/world/naturalGeology.js
          git diff --check
      - name: Commit production and remove staging
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/3d/world/naturalGeology.js
          git rm .github/apply-natural-geology-surface-fabric.py
          git rm .github/workflows/_tmp-natural-geology-surface-fabric.yml
          git rm .github/workflows/_tmp-natural-geology-surface-fabric-v2.yml
          git rm .github/run-natural-geology-surface-fabric-trigger.txt
          test ! -e .github/run-natural-geology-surface-fabric-trigger-v2.txt || git rm .github/run-natural-geology-surface-fabric-trigger-v2.txt
          git commit -m "feat(world): weather natural geology surfaces in world space"
          git push origin HEAD:codex/aapw-realism-20260831-ocean