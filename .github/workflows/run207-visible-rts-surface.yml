name: Run 207 Visible RTS Surface

on:
  push:
    branches: [agent/run207-visible-rts-surface]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: 00b01010bbeb3ac3b120c2232d03955d4e27e3c7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Session snapshot and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'Run 206 — Developer/production service-worker ownership boundary proof' 3D_GAME_PROGRESS.md
          grep -F 'ADR-0225' DECISIONS.md
          grep -F 'run 145' QUESTIONS_FOR_OWNER.md
          grep -F 'run 149' QUESTIONS_FOR_OWNER.md
          node --check src/3d/rts/rtsArmy.js
          node --check src/3d/rts/rtsGame.js
          node --check service-worker.js
          node --check scripts/checkRun207RtsSurface.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
      - name: Visible RTS browser proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun207RtsSurface.js
          test -s artifacts/run207-rts-surface/proof.json
      - name: Baseline full browser smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run207-smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run207-smoke.log")"
          test "$PASS_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run207-smoke.log" | grep -F 'zero console/page errors'
      - name: Determinism and world regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Production PWA cache and installability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
      - name: Existing mobile streaming and performance budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobilePerfBudget.js
      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          cp perf_log.csv "$RUNNER_TEMP/perf_log.csv.before"
          node scripts/collectPerfSnapshot.js run207-rts
          node scripts/analyzePerfTrend.js
          mv "$RUNNER_TEMP/perf_log.csv.before" perf_log.csv
      - name: Senior review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' src/3d/rts/rtsArmy.js src/3d/rts/rtsGame.js scripts/checkRun207RtsSurface.js; then exit 1; fi
          node scripts/checkRun207RtsSurface.js >/dev/null
          node scripts/checkServiceWorkerCache.js >/dev/null
          node scripts/checkPwaInstallability.js >/dev/null
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
      - name: Upload RTS visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run207-rts-visual-proof
          path: artifacts/run207-rts-surface
          if-no-files-found: warn