name: Run 207 Visible RTS Surface

on:
  push:
    branches: [agent/run207-visible-rts-surface]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'run207 validated checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: 00b01010bbeb3ac3b120c2232d03955d4e27e3c7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Session snapshot and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'Run 206 — Developer/production service-worker ownership boundary proof' 3D_GAME_PROGRESS.md
          grep -F 'ADR-0225' DECISIONS.md
          grep -F 'run 145' QUESTIONS_FOR_OWNER.md
          grep -F 'run 149' QUESTIONS_FOR_OWNER.md
          node --check src/3d/rts/rtsArmy.js
          node --check src/3d/rts/rtsGame.js
          node --check service-worker.js
          node --check scripts/checkRun207RtsSurface.js
          node --check scripts/recordRun207VisibleRtsSurface.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
      - name: Visible RTS browser proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun207RtsSurface.js
          test -s artifacts/run207-rts-surface/proof.json
          PROOF="$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync('artifacts/run207-rts-surface/proof.json','utf8'))))")"
          echo "RUN207_PROOF_JSON=$PROOF" >> "$GITHUB_ENV"
      - name: Baseline full browser smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run207-smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run207-smoke.log")"
          test "$PASS_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run207-smoke.log" | grep -F 'zero console/page errors'
          echo "RUN207_SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"
      - name: Determinism and world regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Production PWA cache and installability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
      - name: Existing mobile streaming and performance budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run207-mobile.log"
          LIVE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run207-mobile.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$LIVE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.drawCalls))' "$LIVE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.triangles))' "$LIVE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000
          echo "RUN207_LIVE_MOBILE_JSON=$LIVE" >> "$GITHUB_ENV"
      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run207-rts | tee "$RUNNER_TEMP/run207-perf.log"
          ROW="$(tail -n1 perf_log.csv)"
          echo "$ROW" | grep -F ',run207-rts,'
          echo "RUN207_PERF_ROW=$ROW" >> "$GITHUB_ENV"
          node scripts/analyzePerfTrend.js
      - name: Senior review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' src/3d/rts/rtsArmy.js src/3d/rts/rtsGame.js scripts/checkRun207RtsSurface.js scripts/recordRun207VisibleRtsSurface.js; then exit 1; fi
          node scripts/checkRun207RtsSurface.js >/dev/null
          node scripts/checkServiceWorkerCache.js >/dev/null
          node scripts/checkPwaInstallability.js >/dev/null
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
      - name: Record validated checkpoint on branch
        shell: bash
        run: |
          set -euo pipefail
          export RUN207_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN207_STABLE_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          export RUN207_BASE_SHA="$BASE_SHA"
          export RUN207_SMOKE_PASS_COUNT RUN207_PROOF_JSON RUN207_LIVE_MOBILE_JSON RUN207_PERF_ROW
          node scripts/recordRun207VisibleRtsSurface.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git commit -m 'run207 validated checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "$RUN207_STABLE_TAG"
          git push origin "$RUN207_STABLE_TAG" || echo '[run207] stable tag push unavailable; STABLE_TAGS record retained.'
      - name: Upload RTS visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run207-rts-visual-proof
          path: artifacts/run207-rts-surface
          if-no-files-found: warn