name: Shared Material Placement Contract

on:
  pull_request:
    paths:
      - 'src/3d/materials/**'
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - 'src/3d/editor/EditorAutoTexture.js'
      - 'scripts/checkSharedMaterialPlacementContract.js'
      - 'scripts/checkWorldFootprintGrounding.mjs'
      - 'scripts/setupNodeThreeShim.mjs'
      - '.github/workflows/shared-material-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-material-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs
      - name: Syntax
        run: |
          node --check src/3d/materials/MaterialAssignmentCore.js
          node --check src/3d/world/WorldAssetPlacementPipeline.js
          node --check src/3d/editor/EditorAutoTexture.js
          node --check scripts/checkSharedMaterialPlacementContract.js
          node --check scripts/checkWorldFootprintGrounding.mjs
      - name: Shared editor-agent contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: World footprint grounding contract
        run: node scripts/checkWorldFootprintGrounding.mjs
