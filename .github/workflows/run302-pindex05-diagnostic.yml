name: Run 302 Pindex05 Canonical Diagnostic

on:
  push:
    branches: [run302-pindex05-canonical-activation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main diagnostic precondition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b31af68bbcc3f09289ccf0c08342837ccb96cf0e"
          node scripts/checkAdditiveOnlyDiff.js b31af68bbcc3f09289ccf0c08342837ccb96cf0e HEAD
          node --check scripts/diagnoseRun302CanonicalPindex05.js
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Measure canonical Pindex05 activation
        shell: bash
        run: node scripts/diagnoseRun302CanonicalPindex05.js
