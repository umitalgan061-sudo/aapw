name: World Asset Geographic Adaptation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - 'src/3d/world/WorldAssetPlacementPipelineCore.js'
      - 'src/3d/world/worldAssetGeographicProfile.js'
      - 'src/3d/world/worldAssetSurfaceWeathering.js'
      - 'src/3d/world/northReferenceCryosphere.js'
      - 'src/3d/materials/MaterialAssignmentCore.js'
      - 'scripts/checkSharedMaterialPlacementContract.js'
      - 'scripts/checkWorldAssetGeographicAdaptation.mjs'
      - 'scripts/checkWorldAssetGeographicVisualQa.mjs'
      - 'scripts/worldAssetGeographicHarness.html'
      - '.github/workflows/world-asset-geographic-adaptation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geographic-asset-adaptation:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve vendored Three.js for node contracts
        run: node scripts/setupNodeThreeShim.mjs

      - name: Syntax and shared placement contracts
        run: |
          set -euo pipefail
          node --check src/3d/world/WorldAssetPlacementPipeline.js
          node --check src/3d/world/WorldAssetPlacementPipelineCore.js
          node --check src/3d/world/worldAssetGeographicProfile.js
          node --check src/3d/world/worldAssetSurfaceWeathering.js
          node --check scripts/checkWorldAssetGeographicAdaptation.mjs
          node --check scripts/checkWorldAssetGeographicVisualQa.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkWorldAssetGeographicAdaptation.mjs

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          ln -sfn "$RUNNER_TEMP/pw/node_modules" "$GITHUB_WORKSPACE/node_modules"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Render canonical geographic asset material proof
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWorldAssetGeographicVisualQa.mjs

      - name: Upload geographic asset visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-asset-geographic-adaptation
          path: artifacts/world-asset-geographic-adaptation/
          if-no-files-found: error
          retention-days: 7
