name: settlement-service-readiness
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceReadiness.js'
      - 'scripts/checkSettlementServiceReadiness.mjs'
      - '.github/workflows/settlement-service-readiness.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementServiceReadiness.js
      - name: Executable regression
        run: node scripts/checkSettlementServiceReadiness.mjs
      - name: Shared runtime/editor boundary
        run: |
          ! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline" src/3d/gameplay/settlementServiceReadiness.js
      - name: Diff hygiene
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
