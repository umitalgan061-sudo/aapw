name: SW G17 Terrain3D Relief

on:
  push:
    branches:
      - agent/gunbatimi-ustasi-g17-relief-qualification-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/checkSWG17Relief.mjs'
      - 'godot/terrain-authoring/scripts/validate_g17_terrain3d_relief.gd'
      - '.github/workflows/sw-g17-terrain3d-relief.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-g17-terrain3d-relief-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.exact.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-main and bounded scope
        id: exact
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test -n "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(scripts/checkSWG17Relief.mjs|godot/terrain-authoring/scripts/validate_g17_terrain3d_relief.gd|\.github/workflows/sw-g17-terrain3d-relief.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/project.godot

  authoring:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve captured exact-main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ needs.base.outputs.base_sha }}"
          git merge-base --is-ancestor "${{ needs.base.outputs.base_sha }}" HEAD
      - name: Regress merged G17 Hydrology and Biome
        run: |
          set -euo pipefail
          node --check scripts/checkSWG17Hydrology.mjs
          node scripts/checkSWG17Hydrology.mjs --out="$RUNNER_TEMP/g17-hydrology-regression.json" | tee "$RUNNER_TEMP/g17-hydrology.log"
          grep -F 'SW_G17_HYDROLOGY_SOURCE_OK' "$RUNNER_TEMP/g17-hydrology.log"
          node --check godot/terrain-authoring/geocells/sw/g17_biome.mjs
          node --check scripts/checkSWG17Biome.mjs
          node scripts/checkSWG17Biome.mjs --out="$RUNNER_TEMP/g17-biome-regression.json" | tee "$RUNNER_TEMP/g17-biome.log"
          grep -F 'SW_G17_BIOME_SOURCE_OK' "$RUNNER_TEMP/g17-biome.log"
      - name: G17 relief determinism seam metrics and probe twice
        run: |
          set -euo pipefail
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          node --check godot/terrain-authoring/geocells/sw/g17_relief.mjs
          node --check scripts/checkSWG17Relief.mjs
          PROOF='godot/terrain-authoring/.terrain3d-proof/g17-relief-probe.json'
          node scripts/checkSWG17Relief.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/g17-relief-a.log"
          cp "$PROOF" "$RUNNER_TEMP/g17-relief-a.json"
          node scripts/checkSWG17Relief.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/g17-relief-b.log"
          cp "$PROOF" "$RUNNER_TEMP/g17-relief-b.json"
          cmp "$RUNNER_TEMP/g17-relief-a.log" "$RUNNER_TEMP/g17-relief-b.log"
          cmp "$RUNNER_TEMP/g17-relief-a.json" "$RUNNER_TEMP/g17-relief-b.json"
          grep -F 'SW_G17_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g17-relief-a.log"
      - name: Install pinned official Terrain3D
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/terrain3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/terrain3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/terrain3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK version=1.0.2 enabled=true' "$RUNNER_TEMP/terrain3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real 257x257 Terrain3D import four-region seam persistence and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 2>&1 | tee "$RUNNER_TEMP/g17-relief-editor.log"
          if grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/g17-relief-editor.log"; then
            echo 'Terrain3D emitted a load error.' >&2
            exit 1
          fi
          G17_RELIEF_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g17_terrain3d_relief.gd 2>&1 | tee "$RUNNER_TEMP/g17-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g17-relief-imported-topdown.png "$RUNNER_TEMP/g17-relief-a.png"
          G17_RELIEF_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g17_terrain3d_relief.gd 2>&1 | tee "$RUNNER_TEMP/g17-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g17-relief-imported-topdown.png "$RUNNER_TEMP/g17-relief-b.png"
          grep -F 'SW_G17_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g17-t3d-a.log"
          grep -F 'SW_G17_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g17-t3d-b.log"
          cmp "$RUNNER_TEMP/g17-relief-a.png" "$RUNNER_TEMP/g17-relief-b.png"
          python3 - "$RUNNER_TEMP/g17-t3d-a.log" "$RUNNER_TEMP/g17-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G17_TERRAIN3D_RELIEF_METRICS='):
                      return json.loads(line.split('=', 1)[1])
              raise SystemExit('G17 Terrain3D relief metrics missing')
          a, b = metrics(sys.argv[1]), metrics(sys.argv[2])
          stable = ('terrain3dVersion','regionSize','regionCount','alignedSamples','seamSamples','maxAlignedHeightError','maxSeamHeightError','minImportedHeight','maxImportedHeight','outputChecksum','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert a['regionCount'] >= 4 and a['savedRegionFiles'] >= 4
          assert a['bakedSurfaces'] >= 1 and a['bakedVertices'] > 0
          assert a['maxImportedHeight'] < -2.5
          assert a['maxAlignedHeightError'] <= 0.012 and a['maxSeamHeightError'] <= 0.02
          print('SW_G17_TERRAIN3D_RELIEF_STABLE_OK')
          PY
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd 2>&1 | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-g17-terrain3d-relief-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g17-relief-probe.json
            godot/terrain-authoring/.terrain3d-proof/g17-relief-imported-topdown.png
            ${{ runner.temp }}/g17-relief-a.png
            ${{ runner.temp }}/g17-relief-b.png
            ${{ runner.temp }}/g17-hydrology.log
            ${{ runner.temp }}/g17-biome.log
            ${{ runner.temp }}/g17-relief-a.log
            ${{ runner.temp }}/g17-relief-b.log
            ${{ runner.temp }}/g17-relief-editor.log
            ${{ runner.temp }}/g17-t3d-a.log
            ${{ runner.temp }}/g17-t3d-b.log
            ${{ runner.temp }}/hterrain.log

  world-safety:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve captured exact-main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ needs.base.outputs.base_sha }}"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Settlement and road safety regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js

  platform-safety:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve captured exact-main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ needs.base.outputs.base_sha }}"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Determinism PWA mobile and browser regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

  final-exact-main:
    needs: [base, authoring, world-safety, platform-safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Final exact-main gate after all evidence
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="${{ needs.base.outputs.base_sha }}"
          test -n "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"...HEAD
