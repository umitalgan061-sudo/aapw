name: Terrain Environment Scene Adapter

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/terrainEnvironmentSceneAdapter.js'
      - 'src/3d/world/terrainEnvironmentContract.js'
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - 'scripts/checkTerrainEnvironmentSceneAdapter.mjs'
      - '.github/workflows/terrain-environment-scene-adapter.yml'
  push:
    branches:
      - codex/buzul-muhafizi-terrain-environment-fabric-20260907

permissions:
  contents: read

jobs:
  scene-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact main ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD
      - name: Syntax
        run: |
          node --check src/3d/world/terrainEnvironmentSceneAdapter.js
          node --check src/3d/world/terrainEnvironmentContract.js
          node --check src/3d/world/WorldAssetPlacementPipeline.js
          node --check scripts/checkTerrainEnvironmentSceneAdapter.mjs
      - name: Shared scene adapter contract
        run: node scripts/checkTerrainEnvironmentSceneAdapter.mjs
      - name: Diff hygiene
        run: git diff --check
