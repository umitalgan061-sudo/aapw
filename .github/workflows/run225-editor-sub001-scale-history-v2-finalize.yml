name: Run 225 Editor Sub-0.01 Scale History V2 Finalize

on:
  push:
    branches:
      - agent/run225-editor-sub001-scale-history-v2
    paths:
      - '.github/workflows/run225-editor-sub001-scale-history-v2-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run225-editor-sub001-scale-history-v2-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun225EditorSub001ScaleHistoryV2.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run225 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 225 — World Editor sub-0.01 scale/history regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies Inspector scale precision below the historical 0.01 floor by applying `scale.x = 0.007` to a marker-tree.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Undo restores the exact original scene object identity and transform; Redo restores the exact `0.007` scene scale without precision loss and consumes redo history.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- RCA: first proof run `31424355194` correctly exposed that history restore clears selection, so Inspector values cannot be asserted until explicit user re-selection; this is not a runtime scale-history failure.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Corrected V2 explicitly verifies selection is cleared after restore, re-selects the restored hierarchy item, then confirms Inspector X=`0.007`, Y/Z=`1.000`; browser console/page errors remain zero.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Visual evidence contains three screenshots: original scale, redone/reselected sub-0.01 scale, and a second orbit camera angle.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, deterministic world-reference/hydrology, terrain/road safety, technical-debt audit, full browser smoke, final remote-main/additive-only gates, artifact upload and World Event Determinism Guard PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: corrected Run225 V2 workflow `31424690149` PASS and World Event Determinism Guard `31424689829` PASS. Next safe step: continue additive-only World Editor transform/history usability coverage without crossing unresolved owner gates.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run225,2026-08-10,editor-sub001-scale-history' perf_log.csv; then
            printf 'run225,%s,editor-sub001-scale-history,,,,,,,"test-only sub-0.01 scale/undo/redo/reselect regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run225 editor sub-0.01 scale/history regression' STABLE_TAGS.md; then
            printf '%s — Run225 editor sub-0.01 scale/history regression; `0.007` scene scale survives undo/redo and Inspector reflects it after explicit re-selection; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run225 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run225): record sub-0.01 scale-history checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run225-editor-sub001-scale-history-v2
          git push origin "$STABLE_TAG" || true
