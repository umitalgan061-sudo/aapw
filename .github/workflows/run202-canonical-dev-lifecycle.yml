name: Run 202 Canonical Dev Lifecycle

on:
  push:
    branches: [agent/run202-canonical-dev-lifecycle]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'run202 validated checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: 5ed575fb501ed00b55c96c47905ecd03f196417d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Session snapshot and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F 'Run199 platform-control superseding note' GOVERNANCE.md
          grep -F 'run 145' QUESTIONS_FOR_OWNER.md
          grep -F 'run 149' QUESTIONS_FOR_OWNER.md
          grep -F 'run 188' QUESTIONS_FOR_OWNER.md
          grep -F 'Run 201 — Opt-in canonical developer startup + real offline reload proof' 3D_GAME_PROGRESS.md
          grep -F 'ADR-0220' DECISIONS.md
          node --check scripts/checkRun202CanonicalDevLifecycle.js
          node --check scripts/recordRun202CanonicalDevLifecycle.js
          node --check scripts/run201CanonicalDevBoot.mjs
          node --check scripts/run200CanonicalStartupSelectorShadow.mjs
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git diff --quiet "$BASE_SHA" HEAD -- src canonical-dev.html game3d.html game3d.css service-worker.js index.html script.js style.css manifest.json assets_manifest.json
      - name: Baseline full browser smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run202-smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run202-smoke.log")"
          test "$PASS_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run202-smoke.log" | grep -F 'zero console/page errors'
          echo "RUN202_SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"
      - name: Run202 developer fallback and lifecycle proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun202CanonicalDevLifecycle.js
          test -s artifacts/run202-canonical-dev-lifecycle/proof.json
          PROOF="$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync('artifacts/run202-canonical-dev-lifecycle/proof.json','utf8'))))")"
          echo "RUN202_PROOF_JSON=$PROOF" >> "$GITHUB_ENV"
      - name: Canonical migration regression chain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun201CanonicalDevOffline.js
          node scripts/checkRun200CanonicalStartupSelector.js
          node scripts/checkOptInMigrationControllerShadow.js
          node scripts/checkCurrentRuntimeIntegrationShadow.js
          node scripts/checkCurrentTickOwnershipShadow.js
          node scripts/checkCurrentLifecycleReinitShadow.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
      - name: PWA cache and installability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
      - name: Mobile streaming and performance budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run202-mobile.log"
          LIVE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run202-mobile.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$LIVE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.drawCalls))' "$LIVE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.triangles))' "$LIVE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000
          echo "RUN202_LIVE_MOBILE_JSON=$LIVE" >> "$GITHUB_ENV"
      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run202 | tee "$RUNNER_TEMP/run202-perf.log"
          ROW="$(tail -n1 perf_log.csv)"
          echo "$ROW" | grep -F ',run202,'
          echo "RUN202_PERF_ROW=$ROW" >> "$GITHUB_ENV"
          node scripts/analyzePerfTrend.js
      - name: Senior review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkRun202CanonicalDevLifecycle.js scripts/recordRun202CanonicalDevLifecycle.js; then exit 1; fi
          node scripts/checkRun202CanonicalDevLifecycle.js >/dev/null
          node scripts/checkRun201CanonicalDevOffline.js >/dev/null
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git diff --quiet "$BASE_SHA" HEAD -- src canonical-dev.html game3d.html game3d.css service-worker.js index.html script.js style.css manifest.json assets_manifest.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
      - name: Record validated checkpoint on branch
        shell: bash
        run: |
          set -euo pipefail
          export RUN202_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN202_STABLE_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          export RUN202_BASE_SHA="$BASE_SHA"
          export RUN202_SMOKE_PASS_COUNT RUN202_PROOF_JSON RUN202_LIVE_MOBILE_JSON RUN202_PERF_ROW
          node scripts/recordRun202CanonicalDevLifecycle.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git commit -m 'run202 validated checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "$RUN202_STABLE_TAG"
          git push origin "$RUN202_STABLE_TAG" || echo '[run202] stable tag push unavailable; STABLE_TAGS record retained.'