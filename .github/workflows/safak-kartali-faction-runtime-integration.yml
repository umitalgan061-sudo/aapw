name: Safak Kartali faction runtime integration

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldReaction*.js'
      - 'scripts/checkLivingWorldFactionResponse*.mjs'
      - 'scripts/checkLivingWorldFactionRuntimeIntegration.mjs'
      - '.github/workflows/safak-kartali-faction-runtime-integration.yml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check runtime integration syntax
        run: node --check scripts/checkLivingWorldFactionRuntimeIntegration.mjs
      - name: Run shipped runtime integration proof
        run: node scripts/checkLivingWorldFactionRuntimeIntegration.mjs
