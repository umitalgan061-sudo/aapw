name: settlement-reward-ledger
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementRewardLedger.js'
      - 'scripts/checkSettlementRewardLedger.mjs'
      - '.github/workflows/settlement-reward-ledger.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/checkSettlementRewardLedger.mjs
      - run: node --check src/3d/gameplay/settlementRewardLedger.js
      - run: node --check scripts/checkSettlementRewardLedger.mjs
