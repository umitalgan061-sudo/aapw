name: Kızıl Ufuk Player Runtime Budget Strict

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerRuntimeBudgetPolicy.ts'
      - 'src/3d/gameplay/playerRuntimeBudgetPolicy.js'
      - 'src/3d/gameplay/playerRuntimeBudgetPolicy.legacy.js'
      - 'scripts/checkPlayerRuntimeBudgetPolicy.mjs'
      - 'tests/modern/playerRuntimeBudgetPolicyStrict.test.ts'
      - 'tsconfig.player-runtime-budget.json'
      - 'package.json'
      - '.github/workflows/kizil-ufuk-player-runtime-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kizil-ufuk-player-runtime-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package.json
      - name: Install toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Strict runtime budget typecheck
        run: npx tsc -p tsconfig.player-runtime-budget.json --noEmit
      - name: Runtime budget regression
        run: npx vitest run tests/modern/playerRuntimeBudgetPolicyStrict.test.ts
      - name: Production budget proof
        run: node --experimental-strip-types scripts/checkPlayerRuntimeBudgetPolicy.mjs
      - name: Diff hygiene
        run: git diff --check
