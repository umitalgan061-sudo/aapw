name: Run 179 Wind Grass V2

on:
  push:
    branches: [agent/run179-wind-grass]
    paths:
      - 'scripts/recordRun179GovernanceV2.js'
      - '.github/workflows/run179-wind-grass-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASE_SHA: 3bba9d3a9bb54eab0ac47c8c4585e1c11de7a4be
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Session snapshot and start concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git log -10 --oneline
          tail -n 220 GOVERNANCE.md
          tail -n 180 3D_GAME_PROGRESS.md
          tail -n 180 DECISIONS.md
          tail -n 120 QUESTIONS_FOR_OWNER.md
      - name: Baseline smoke on current main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run179v2-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run179v2-before.log" && test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run179v2-before.log")" -ge 34)
          git worktree remove "$BASELINE"
      - name: Apply exact additive grass payload
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/applyRun179Additions.js
          node --check scripts/checkWindGrassContract.js
          node --check scripts/recordRun179GovernanceV2.js
          node scripts/applyRun179Additions.js
          node --check src/3d/sceneManager.js
          node --check src/3d/world/vegetation.js
          git diff --check
          test "$(git diff --numstat -- src/3d/sceneManager.js src/3d/world/vegetation.js | awk '{s += $2} END {print s + 0}')" -eq 0
      - name: Live grass road map and world contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWindGrassContract.js | tee "$RUNNER_TEMP/run179v2-grass.log"
          SUMMARY="$(grep '^\[checkWindGrassContract\] PASS:' "$RUNNER_TEMP/run179v2-grass.log" | tail -n1 | sed 's/^\[checkWindGrassContract\] PASS: //')"
          test -n "$SUMMARY"
          echo "RUN179_GRASS_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          node scripts/checkWorldReferenceMap.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/checkTerrainVisualContract.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js
      - name: Determinism PWA assets governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
      - name: Accessibility input physics regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkJumpArcContract.js
          node scripts/checkEventBusContract.js
          node scripts/checkHealthStateContract.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js
      - name: Mobile streaming LOD and render budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js
      - name: Final smoke and console gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run179v2-after.log"
          AFTER_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run179v2-after.log")"
          test "$AFTER_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run179v2-after.log" | grep -F 'zero console/page errors'
          echo "RUN179_SMOKE_PASS_COUNT=$AFTER_COUNT" >> "$GITHUB_ENV"
      - name: Mobile near and F4 far evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run179-wind-grass-v2-visual-evidence
          path: artifacts/run130-mobile/*.png
          if-no-files-found: error
      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run179 | tee "$RUNNER_TEMP/run179v2-perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/run179v2-trend.log"
          PERF_ROW="$(grep '^\[collectPerfSnapshot\] sampled:' "$RUNNER_TEMP/run179v2-perf.log" | tail -n1 | sed 's/^\[collectPerfSnapshot\] sampled: //')"
          test -n "$PERF_ROW"
          echo "RUN179_PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git checkout -- perf_log.csv
      - name: Senior review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- src/3d/sceneManager.js src/3d/world/vegetation.js | awk '{s += $2} END {print s + 0}')" -eq 0
          node scripts/checkWorldReferenceMap.js
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          echo "RUN179_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN179_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"
      - name: Record parseable Run 179 governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun179GovernanceV2.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js
      - name: Final publish gate and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/3d/sceneManager.js src/3d/world/vegetation.js 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "feat(world): add deterministic wind grass"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:agent/run179-wind-grass
      - name: Push stable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RUN179_STABLE_TAG"
          git push origin "$RUN179_STABLE_TAG" || true
