name: Run 305 Run303 Source Branch Guard

on:
  push:
    branches: [run305-run303-source-branch-guard]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run305-run303-source-branch-guard-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  BASE_SHA: a5b9dcfc6da0b199db6faa040c87c735bdd2dc58
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact-main additive entry gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && github.sha || 'a5b9dcfc6da0b199db6faa040c87c735bdd2dc58' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then exit 0; fi
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- src/3d service-worker.js game3d.html canonical-dev.html godot/terrain-authoring)"

      - name: Run303 write-workflow source-branch safety
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkRun305Run303SourceBranchGuard.js
          node scripts/checkRun305Run303SourceBranchGuard.js
          node --check scripts/checkRun305LiveBaseSemantics.js
          node scripts/checkRun305LiveBaseSemantics.js
          node --check scripts/checkRun305PrScopeBypass.js
          node scripts/checkRun305PrScopeBypass.js
          test "$(head -n 1 service-worker.js)" = '// Run216 complete World Editor offline shell extension.'
          node scripts/materializeRun216ServiceWorkerCache.js --verify-only
          node scripts/checkRun216ServiceWorkerMaterializer.js
          node scripts/checkRun300LegacyPrScopeGate.js
          node scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkCheckpointConsistency.js

      - name: PWA determinism and world contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance world safety technical debt and full browser DoD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run305-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run305-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run305-smoke.log")" -ge 34

      - name: Final exact-main concurrency and additive-only gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && github.sha || 'a5b9dcfc6da0b199db6faa040c87c735bdd2dc58' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then exit 0; fi
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- src/3d service-worker.js game3d.html canonical-dev.html godot/terrain-authoring)"
