name: Run 303 Run216 Complete Marker Prefix

on:
  push:
    branches:
      - agent/run303-run216-complete-marker-prefix
    paths:
      - '.github/workflows/run303-run216-complete-marker-prefix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run303-run216-complete-marker-prefix-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail closed outside historical Run303 source branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/run303-run216-complete-marker-prefix"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main additive preflight
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Prepend compatible Run216 complete marker without changing existing bytes
        run: |
          set -euo pipefail
          MARKER='// Run216 complete World Editor offline shell extension.'
          if [ "$(head -n 1 service-worker.js)" != "$MARKER" ]; then
            TMP="$(mktemp)"
            printf '%s\n' "$MARKER" > "$TMP"
            cat service-worker.js >> "$TMP"
            mv "$TMP" service-worker.js
          fi
          node --check service-worker.js
          node scripts/materializeRun216ServiceWorkerCache.js --verify-only
          node scripts/checkRun216ServiceWorkerMaterializer.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          git diff --check
          git add service-worker.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(run303): restore Run216 complete cache marker prefix'
          fi
          CURRENT_MAIN="$(git rev-parse origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git push origin HEAD:agent/run303-run216-complete-marker-prefix
