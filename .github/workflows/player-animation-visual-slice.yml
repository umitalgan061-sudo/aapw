name: Player Animation Strict TypeScript Gate

on:
  push:
    branches-ignore: [main]
    paths:
      - 'src/3d/gameplay/playerAnimation*.ts'
      - 'src/3d/gameplay/playerEnvironmentalAnimationProfile.ts'
      - 'src/3d/gameplay/playerAnimationSurfaceEvidence.ts'
      - 'scripts/checkPlayerAnimation*.mjs'
      - 'scripts/checkPlayerStrictOwnershipR1.mjs'
      - 'tsconfig.player-animation-strict.json'
      - '.github/workflows/player-animation-visual-slice.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerAnimation*.ts'
      - 'src/3d/gameplay/playerEnvironmentalAnimationProfile.ts'
      - 'src/3d/gameplay/playerAnimationSurfaceEvidence.ts'
      - 'scripts/checkPlayerAnimation*.mjs'
      - 'scripts/checkPlayerStrictOwnershipR1.mjs'
      - 'tsconfig.player-animation-strict.json'
      - '.github/workflows/player-animation-visual-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-animation-ts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-player-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Establish current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$MAIN_SHA")" = "$MAIN_SHA"
          git diff --check "$MAIN_SHA" HEAD

      - name: Install deterministic Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies without lockfile assumptions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck player animation owner
        run: npx tsc -p tsconfig.player-animation-strict.json --noEmit

      - name: Run strict animation regression
        run: npx vitest run tests/modern/playerAnimationDirectorStrict.test.ts

      - name: Run player modernization regression
        run: npx vitest run tests/modern/playerModernizationR1.test.ts

      - name: Enforce shared material ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          ! grep -R "EditorMaterialStudio" -n \
            src/3d/gameplay/playerAnimationDirector.ts \
            src/3d/gameplay/playerAnimationAssetCatalog.ts \
            src/3d/gameplay/playerEnvironmentalAnimationProfile.ts \
            src/3d/gameplay/playerAnimationSurfaceEvidence.ts

      - name: Run animation contract guards
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/checkPlayerAnimationDirector.mjs
          node --experimental-strip-types scripts/checkPlayerAnimationVisualSlice.mjs
          node --experimental-strip-types scripts/checkPlayerStrictOwnershipR1.mjs

      - name: Emit exact-head proof
        if: always()
        run: |
          set -euo pipefail
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "MAIN_SHA=$(git rev-parse origin/main)"
