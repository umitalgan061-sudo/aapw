name: Kizil Ufuk Player Combat Presentation Director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatPresentationDirector.js'
      - 'scripts/checkKizilUfukPlayerCombatPresentationDirector.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-presentation-director.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-head ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --numstat origin/main...HEAD
          additions=$(git diff --numstat origin/main...HEAD | awk '{a+=$1} END {print a+0}')
          deletions=$(git diff --numstat origin/main...HEAD | awk '{d+=$2} END {print d+0}')
          test $((additions + deletions)) -le 3000
          test "$(grep -R -n 'EditorMaterialStudio' src/3d/gameplay/playerCombatPresentationDirector.js | wc -l)" -eq 0
          test "$(grep -R -n 'Math.random' src/3d/gameplay/playerCombatPresentationDirector.js | wc -l)" -eq 0
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatPresentationDirector.js && node --check scripts/checkKizilUfukPlayerCombatPresentationDirector.mjs
      - name: Deterministic contract
        run: node scripts/checkKizilUfukPlayerCombatPresentationDirector.mjs
