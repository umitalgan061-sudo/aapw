name: Settlement Asset Assignment Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/checkSettlementAssetAssignmentContract.mjs'
      - 'src/3d/world/settlements.js'
      - 'src/3d/materials/MaterialAssignmentCore.js'
      - 'src/3d/world/WorldAssetPlacementPipeline.js'
      - '.github/workflows/settlement-asset-assignment-contract.yml'

permissions:
  contents: read

jobs:
  settlement-asset-assignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Hydrate assigned settlement assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/models/settlements/castles/icebound_citadel_decimated.glb,assets/models/settlements/castles/walled_city_fortress_decimated.glb,assets/models/settlements/castles/fortress_of_the_crown_decimated.glb,assets/models/settlements/castles/castle_on_a_rock_decimated.glb,assets/models/settlements/castles/emerald_citadel_decimated.glb,assets/models/settlements/castles/greystone_castle_decimated.glb,assets/models/settlements/castles/brickstone_citadel_decimated.glb,assets/models/settlements/castles/gatehouse_reference_decimated.glb"
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          const source = await readFile('src/3d/world/settlements.js', 'utf8');
          const files = [...source.matchAll(/file:\s*'([^']+)'/gu)].map(([, file]) => file);
          const unique = [...new Set(files.filter((file) => file.startsWith('assets/models/settlements/castles/')))];
          for (const file of unique) {
            const metadata = await stat(file);
            if (!metadata.isFile() || metadata.size < 1024) throw new Error(`SETTLEMENT_ASSET_HYDRATION_FAIL ${file}`);
          }
          console.log(`SETTLEMENT_ASSET_HYDRATION_OK files=${unique.length}`);
          NODE

      - name: Verify exact-main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          lines="$(git diff --numstat "$BASE_SHA"...HEAD -- . ':!package-lock.json' | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$lines" -le 3000
          git diff --check "$BASE_SHA"...HEAD
          printf 'SETTLEMENT_ASSET_SCOPE_OK base=%s head=%s lines=%s\n' "$BASE_SHA" "$(git rev-parse HEAD)" "$lines"

      - name: Check settlement asset contract syntax
        run: node --check scripts/checkSettlementAssetAssignmentContract.mjs

      - name: Run settlement asset assignment contract
        run: node scripts/checkSettlementAssetAssignmentContract.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          printf 'SETTLEMENT_ASSET_FRESHNESS_OK base=%s head=%s\n' "$BASE_SHA" "$(git rev-parse HEAD)"
