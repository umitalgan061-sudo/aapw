name: Run 152 Checkpoint Uniqueness

on:
  push:
    branches:
      - agent/run152-checkpoint-uniqueness

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 6e7a188cda856db9f0f22b561eb21f291473a961
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and initial concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -f GOVERNANCE.md
          test -f 3D_GAME_PROGRESS.md
          test -f DECISIONS.md
          test -f QUESTIONS_FOR_OWNER.md
          grep -q 'Run 151' 3D_GAME_PROGRESS.md
          grep -q 'ADR-0173' DECISIONS.md

      - name: Baseline validation on clean main worktree
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run152-baseline"
          git worktree add --detach "$BASELINE" origin/main
          (
            cd "$BASELINE"
            node scripts/checkCheckpointConsistency.js
            node scripts/checkPwaInstallability.js
            node scripts/checkServiceWorkerCache.js
            node scripts/checkWorldEventCatalog.js
            node scripts/checkWorldEventDiversity.js
            node scripts/checkWorldEventDeterminism.js
            node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run152-smoke-before.log"
            test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run152-smoke-before.log")" -ge 34
          )
          git worktree remove "$BASELINE"

      - name: Syntax and additive-only gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/checkLatestRunUniqueness.js
          node scripts/checkLatestRunUniqueness.js
          git diff --check origin/main...HEAD
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Repository invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCheckpointConsistency.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkWorldEventDiversity.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkAssetsManifest.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Mobile and world safety regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileSpawnVegetation.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobileVegetationCullingRun141.js
          node scripts/checkMobilePerfBudget.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js

      - name: Full browser and WebGL smoke after change
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run152-smoke-after.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run152-smoke-after.log")"
          test "$PASS_COUNT" -ge 34
          echo "RUN152_SMOKE=$PASS_COUNT" >> "$GITHUB_ENV"

      - name: Performance snapshot and self-review gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run152
          node scripts/analyzePerfTrend.js
          node scripts/checkLatestRunUniqueness.js || true
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Finalize governance records
        shell: bash
        run: |
          set -euo pipefail
          RUN152_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          RUN152_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          echo "RUN152_TAG=$RUN152_TAG" >> "$GITHUB_ENV"
          cat >> 3D_GAME_PROGRESS.md <<EOF


## Run 152 — Latest-run checkpoint uniqueness guard ($RUN152_STAMP)
- Alt görev: çok-agent eşzamanlılığında aynı son run kimliğinin progress/stable/perf defterlerine birden fazla kez yazılmasını yakalayan `scripts/checkLatestRunUniqueness.js` eklendi. Guard runtime/PWA/gameplay koduna dokunmaz.
- DoD: temiz run151 baseline + post-change browser/WebGL smoke ${RUN152_SMOKE:-34}/34+ PASS; syntax, checkpoint consistency, world-event, PWA/cache, mobile/world safety ve additive-only kapıları PASS; console/page error yok.
- World Coverage: desktop %96.2; mobil resident ~%14.7 (81 chunk / 20.25 km²), değişmedi. Performans ölçümü `perf_log.csv` run152 satırında kayıtlı; runtime değişmediği için draw/triangle baseline değişimi beklenmez.
- Memory leak checklist: N/A — yeni runtime listener/timer/DOM/geometry/material yok. Teknik borç: 1 (`game3d.js` 545/600 owner kararı bekliyor). Risk LOW. Güven 5/5.
- World Evolution Report delta: yol 0 km; orman 0 km²; kale/NPC/event/hayvan 0; coverage 0; asset/diyalog 0; ADR +1. Oyuncu fark eder mi: hayır; ajanların aynı run kimliğini çift kaydetmesi artık yayın öncesinde otomatik yakalanır.
- Sıradaki güvenli adım: owner bloklarına dokunmadan bağımsız UI/erişilebilirlik/test-kalite işi; ~run156 kural konsolidasyonu yaklaşırken concurrency gate zorunlu.
EOF
          cat >> DECISIONS.md <<EOF


## ADR-0174 — Son run checkpoint kayıtlarında benzersizlik kapısı (run 152)

**Risk Seviyesi:** LOW

**Karar:** `checkCheckpointConsistency.js` korunur ve yanına bağımsız `checkLatestRunUniqueness.js` eklenir. Yeni guard en yüksek run numarasının `3D_GAME_PROGRESS.md`, `STABLE_TAGS.md` ve `perf_log.csv` içinde ayrı ayrı tam bir kez bulunmasını zorunlu kılar.

**Neden:** Eşzamanlı ajanlar aynı run numarasını bağımsız şekilde yazarsa üç defter aynı maksimum run üzerinde anlaşabilir; bu durumda mevcut consistency kontrolü tek başına duplicate kaydı ayırt edemez. Benzersizlik kontrolü bu boşluğu runtime davranışına dokunmadan kapatır.

**Alternatifler:** Mevcut consistency scriptini değiştirmek additive-only kuralını ihlal edeceği için reddedildi. Run numarasını yalnız commit mesajından çıkarmak güvenilir authoritative-ledger kontrolü sağlamadığı için reddedildi.

**Sonuç:** Çift son-run kayıtları CI'da erken FAIL olur; eski tarihsel kayıtların biçimi veya runtime kodu değişmez.

**Etkilenen sistemler:** yalnız repository test/CI kalite katmanı ve üç checkpoint ledger'ı; gameplay, renderer, PWA cache, mobil dünya ve deterministik üreticiler etkilenmez.

**Geri alma planı:** Yeni script/workflow devre dışı bırakılabilir; mevcut checkpoint consistency guard ve runtime bit-eşit kalır. Additive-only politikası nedeniyle mevcut satırlar silinmeden ileride daha yeni bir guard tarafından gölgelenebilir.
EOF
          echo "- $RUN152_TAG — run 152 latest-run checkpoint uniqueness guard; ${RUN152_SMOKE:-34}/34+ browser smoke and governance/mobile/PWA gates PASS." >> STABLE_TAGS.md
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          git diff --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Final concurrency gate, commit, tag and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Westeros Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/checkLatestRunUniqueness.js .github/workflows/run152-checkpoint-uniqueness.yml 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          git commit -m "docs(3d): record run152 stable checkpoint"
          node scripts/checkCheckpointConsistency.js
          node scripts/checkLatestRunUniqueness.js
          git tag "$RUN152_TAG"
          git push origin HEAD:agent/run152-checkpoint-uniqueness
          git push origin "$RUN152_TAG" || echo "[run152] tag push blocked; STABLE_TAGS.md remains authoritative per GOVERNANCE.md §8.11"
