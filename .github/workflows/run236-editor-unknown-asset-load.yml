name: Run 236 Editor Unknown Asset Load

on:
  push:
    branches:
      - agent/run236-editor-unknown-asset-load
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run236-editor-unknown-asset-load-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and unknown asset scene-load regression
        run: |
          set -euo pipefail
          node --check scripts/checkRun236EditorUnknownAssetLoad.js
          node scripts/checkRun236EditorUnknownAssetLoad.js
      - name: PWA cache and installability
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
      - name: Performance, determinism, world and debt safety
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Full browser smoke
        run: node scripts/smokeTestGame3D.js
      - name: Final remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run236 records
        run: |
          set -euo pipefail
          MARKER='## Run 236 — World Editor unknown asset scene-load regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Added a permanent Chromium regression for valid scene JSON containing one known editor asset and one unknown/missing asset id.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The existing loader contract is locked: unknown asset records are skipped without blocking valid records; the known object id/name/position/rotation/non-uniform scale, hierarchy, selection-clear behavior and editor grid/snap settings are verified after load.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The proof includes sub-0.01 scale `0.007`, signed rotation values, two screenshots and zero browser console/page errors.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines. Test/workflow only; additive-only. PWA/cache, mobile performance, deterministic world safety, technical-debt and full browser smoke gates run before publication.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Technical debt introduced: 0. Risk: LOW. ADR not required because this only preserves existing loader behavior.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: add complementary malformed-JSON/non-object validation atomicity coverage without changing loader semantics or crossing owner gates.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'editor-unknown-asset-load' perf_log.csv; then
            printf 'run236,%s,editor-unknown-asset-load,,,,,,,"test-only unknown asset scene-load regression; runtime unchanged; full PWA/perf/determinism/world/smoke gates PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          if ! grep -Fq 'Run236 editor unknown asset scene-load regression' STABLE_TAGS.md; then
            printf '%s — Run236 editor unknown asset scene-load regression; missing asset record skipped while known scene data and editor settings restore correctly; full safety gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit and publish checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run236 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run236): record unknown asset load checkpoint'
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check "$CURRENT_MAIN" HEAD
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run236-editor-unknown-asset-load
          git push origin "$STABLE_TAG" || true
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run236-editor-unknown-asset-load
          path: artifacts/run236-editor-unknown-asset-load
          if-no-files-found: error
