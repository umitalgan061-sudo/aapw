name: Kizil Ufuk Player Combat Hitbox Timeline

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatHitboxTimeline.js'
      - 'scripts/checkPlayerCombatHitboxTimeline.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-hitbox-timeline.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-hitbox-timeline-20260916-r12'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed-line budget
        run: |
          git diff --check
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/playerCombatHitboxTimeline.js scripts/checkPlayerCombatHitboxTimeline.mjs .github/workflows/kizil-ufuk-player-combat-hitbox-timeline.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatHitboxTimeline.js && node --check scripts/checkPlayerCombatHitboxTimeline.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatHitboxTimeline.mjs
