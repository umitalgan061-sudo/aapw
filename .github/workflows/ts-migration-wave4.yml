name: Kızıl Ufuk TypeScript Migration Wave 4
on:
  push:
    branches: ['main','agent/kizil-ufuk-ts-gameplay-wave4-20260921-r1']
  pull_request:
    branches: ['main']
    paths:
      - 'src/3d/auroraRealism.*'
      - 'src/3d/gameplay/animalConfig.*'
      - 'src/3d/gameplay/interactionFieldReadiness.*'
      - 'scripts/checkTsMigrationWave4.mjs'
      - 'tests/modern/tsMigrationWave4.test.ts'
      - '.github/workflows/ts-migration-wave4.yml'
permissions:
  contents: read
concurrency:
  group: ts-migration-wave4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 24.21.0}
      - run: npm install --no-audit --no-fund
      - run: git fetch origin main --no-tags && git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - run: node scripts/checkTsMigrationWave4.mjs
      - run: npx tsc --noEmit --pretty false
      - run: npx vitest run tests/modern/tsMigrationWave4.test.ts
