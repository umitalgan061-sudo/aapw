name: Player Equipment Combat Runtime
on:
  push:
    branches:
      - codex/kizil-ufuk-player-combat-loadout-runtime-20260908
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentCombatProfile.js'
      - 'src/3d/gameplay/playerEquipmentCombatRuntime.js'
      - 'scripts/checkPlayerEquipmentCombatRuntime.mjs'
      - 'scripts/checkPlayerEquipmentCombatSceneContract.mjs'
      - 'scripts/checkPlayerEquipmentMaterialAcceptance.mjs'
      - '.github/workflows/player-equipment-combat-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save three@0.160.0
      - name: Exact main ancestry and diff cap
        shell: bash
        run: |
          git fetch origin main --depth=1
          BASE="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          git diff --check "$BASE"...HEAD
      - name: Runtime boundary
        shell: bash
        run: |
          BASE="$(git rev-parse origin/main)"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          ALLOW='^(src/3d/gameplay/playerEquipmentCombatProfile\.js|src/3d/gameplay/playerEquipmentCombatRules\.js|src/3d/gameplay/playerEquipmentCombatRuntime\.js|src/3d/gameplay/playerEquipmentSocketAttachment\.js|src/3d/gameplay/playerEquipmentEvidenceManifest\.js|scripts/checkPlayerEquipmentCombatRules\.mjs|scripts/checkPlayerEquipmentCombatRuntime\.mjs|scripts/checkPlayerEquipmentCombatSceneContract\.mjs|scripts/checkPlayerEquipmentMaterialAcceptance\.mjs|scripts/checkPlayerEquipmentSocketAttachment\.mjs|scripts/checkPlayerEquipmentEvidenceManifest\.mjs|\.github/workflows/player-equipment-combat-rules\.yml|\.github/workflows/player-equipment-combat-runtime\.yml|\.github/workflows/player-equipment-evidence-manifest\.yml|\.github/workflows/player-equipment-socket-attachment\.yml)$'
          if printf '%s\n' "$CHANGED" | grep -Ev "$ALLOW" | grep -q .; then
            echo "Unexpected out-of-scope files changed"
            exit 1
          fi
          test "$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 15
      - name: Shared material boundary
        shell: bash
        run: |
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          if grep -R "EditorMaterialStudio" -n src/3d/gameplay/playerEquipment*.js; then
            echo "Runtime must not import EditorMaterialStudio"
            exit 1
          fi
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerEquipmentCombatProfile.js
          node --check src/3d/gameplay/playerEquipmentCombatRuntime.js
          node --check scripts/checkPlayerEquipmentCombatRuntime.mjs
          node --check scripts/checkPlayerEquipmentCombatSceneContract.mjs
          node --check scripts/checkPlayerEquipmentMaterialAcceptance.mjs
      - name: Equipment runtime contract
        run: node scripts/checkPlayerEquipmentCombatRuntime.mjs
      - name: Scene and asset contract
        run: node scripts/checkPlayerEquipmentCombatSceneContract.mjs
      - name: Shared material acceptance
        run: node scripts/checkPlayerEquipmentMaterialAcceptance.mjs
      - name: Existing player vertical slice
        run: node scripts/checkPlayerCombatVerticalSlice.mjs
