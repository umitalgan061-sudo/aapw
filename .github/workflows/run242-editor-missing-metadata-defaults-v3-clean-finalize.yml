name: Run 242 Editor Missing Metadata Defaults V3 Clean Finalize

on:
  push:
    branches:
      - agent/run242-editor-missing-metadata-defaults-v3-clean
    paths:
      - '.github/workflows/run242-editor-missing-metadata-defaults-v3-clean-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run242-editor-missing-metadata-defaults-v3-clean-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main, syntax and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun242EditorMissingMetadataDefaultsV3.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run242 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 242 — World Editor missing editor-metadata composed defaults regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies a valid schema-v1 scene without optional `editor` metadata loads exact object identity/name/asset, signed rotation and non-uniform scale including `0.007`.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Snap resolves to the loader defaults (`enabled=true`, size `1`), selection clears, the success toast completes, and browser console/page errors remain zero.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- RCA: V1/V2 incorrectly asserted the base loader Grid fallback. The composed product has a newer additive owner-usability layer in `editor.html` that intentionally keeps the live moving Grid unchecked, disabled and hidden; the RCA is recorded in `docs/run242-editor-missing-metadata-defaults-rca.md` and V3 locks the final composed contract.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The first corrected V3 passed all functional gates but its final concurrency gate correctly stopped publication when Run241 merged. This clean publication was rebuilt on Run241 main and revalidated from scratch.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, seeded determinism, world-reference/hydrology, terrain/road safety, performance trend, technical-debt audit, full browser smoke, final remote-main concurrency/additive gates, visual artifact upload and World Event Determinism Guard PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/docs/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: Run242 clean workflow `31446510611` PASS and World Event Determinism Guard `31446510555` PASS. Next safe step: re-read current main and continue owner-gate-free scene-load compatibility coverage while avoiding concurrent Run243 explicit-snap-disabled scope.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run242,' perf_log.csv; then
            printf 'run242,%s,editor-missing-metadata-defaults,,,,,,,"test-only valid scene missing editor metadata/composed owner-grid defaults regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run242 editor missing-metadata composed defaults regression' STABLE_TAGS.md; then
            printf '%s — Run242 editor missing-metadata composed defaults regression; valid scene preserves exact object data and snap defaults while owner live-grid policy remains hidden/disabled; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run242 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run242): record missing-metadata checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run242-editor-missing-metadata-defaults-v3-clean
          git push origin "$STABLE_TAG" || true
