name: RPG Route Policy Drift Guard

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interactionFieldReadiness.js'
      - 'scripts/checkInteractionRoutePolicyDrift.mjs'
      - '.github/workflows/rpg-route-policy-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-policy-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact-main bounded scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${files[@]}"
          allowed='^(\.github/workflows/rpg-route-policy-drift\.yml|scripts/checkInteractionRoutePolicyDrift\.mjs|src/3d/gameplay/interactionFieldReadiness\.js)$'
          for file in "${files[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected path: $file" >&2; exit 1; }
          done
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "changed_lines=$changed"
          test "$changed" -le 1000

      - name: Route policy boundary semantics
        run: node scripts/checkInteractionRoutePolicyDrift.mjs

      - name: Syntax
        run: |
          node --check src/3d/gameplay/interactionFieldReadiness.js
          node --check scripts/checkInteractionRoutePolicyDrift.mjs
