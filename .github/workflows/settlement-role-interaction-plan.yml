name: settlement-role-interaction-plan
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementRoleInteractionPlan.js'
      - 'scripts/checkSettlementRoleInteractionPlan.mjs'
      - '.github/workflows/settlement-role-interaction-plan.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/checkSettlementRoleInteractionPlan.mjs
      - run: node --check src/3d/gameplay/settlementRoleInteractionPlan.js
      - run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/settlementRoleInteractionPlan.js scripts/checkSettlementRoleInteractionPlan.mjs .github/workflows/settlement-role-interaction-plan.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - run: |
          ! git diff --name-only origin/main...HEAD | grep -E '(^|/)(EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline)\.js$'
