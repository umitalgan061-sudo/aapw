name: SE G75 Terrain3D Rock Snow Current Main

on:
  push:
    branches:
      - agent/kizil-ufuk-g75-rock-snow-curr-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'godot/terrain-authoring/geocells/se/g75_rock_snow.mjs'
      - 'scripts/checkSEG75RockSnow.mjs'
      - 'godot/terrain-authoring/scripts/validate_g75_terrain3d_rock_snow.gd'
      - '.github/workflows/se-g75-terrain3d-rock-snow-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g75-rock-snow-current-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 3262053ed1881c95a03d3436a024de1eaedb4271

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/se/g75_rock_snow.mjs|scripts/checkSEG75RockSnow.mjs|godot/terrain-authoring/scripts/validate_g75_terrain3d_rock_snow.gd|\.github/workflows/se-g75-terrain3d-rock-snow-current.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py

      - name: G75 rock snow determinism map fidelity and seams
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g75_rock_snow.mjs
          node --check scripts/checkSEG75RockSnow.mjs
          node scripts/checkSEG75RockSnow.mjs | tee "$RUNNER_TEMP/a.log"
          node scripts/checkSEG75RockSnow.mjs | tee "$RUNNER_TEMP/b.log"
          cmp "$RUNNER_TEMP/a.log" "$RUNNER_TEMP/b.log"
          grep -F 'SE_G75_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/a.log"
          node scripts/checkSEG75RockSnow.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g75-rock-snow-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g75-rock-snow-probe.json

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"
          DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Terrain3D height-control import save and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G75_ROCK_SNOW_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g75_terrain3d_rock_snow.gd | tee "$RUNNER_TEMP/t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-rock-snow-imported-topdown.png "$RUNNER_TEMP/a.png"
          G75_ROCK_SNOW_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g75_terrain3d_rock_snow.gd | tee "$RUNNER_TEMP/t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-rock-snow-imported-topdown.png "$RUNNER_TEMP/b.png"
          grep -F 'SE_G75_TERRAIN3D_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/t3d-a.log"
          grep -F 'SE_G75_TERRAIN3D_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/t3d-b.log"
          cmp "$RUNNER_TEMP/a.png" "$RUNNER_TEMP/b.png"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: HTerrain world PWA and safety regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g75-terrain3d-rock-snow-current-proof
          path: |
            godot/terrain-authoring/.terrain3d-proof/g75-rock-snow-probe.json
            godot/terrain-authoring/.terrain3d-proof/g75-rock-snow-imported-topdown.png
          if-no-files-found: warn
