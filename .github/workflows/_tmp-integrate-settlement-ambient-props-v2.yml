name: Temporary rebase-safe settlement ambient prop integration

on:
  push:
    paths:
      - '.github/workflows/_tmp-integrate-settlement-ambient-props-v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aapw-realism-20260831-ocean
          fetch-depth: 0

      - name: Apply runtime integration on live branch
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply-settlement-ambient-integration.py
          node --check src/3d/world/settlementAmbientProps.js
          node --check src/3d/sceneManager.js
          node --check src/3d/game3d.js
          git diff --check

      - name: Commit, rebase and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/apply-settlement-ambient-integration.py \
            .github/workflows/_tmp-integrate-settlement-ambient-props.yml \
            .github/workflows/_tmp-integrate-settlement-ambient-props-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/sceneManager.js src/3d/game3d.js .github
          git commit -m 'feat(world): integrate settlement ambient prop lifecycle'
          for attempt in 1 2 3; do
            git fetch origin codex/aapw-realism-20260831-ocean
            if ! git rebase origin/codex/aapw-realism-20260831-ocean; then
              git rebase --abort || true
              echo 'Rebase conflict while integrating current scene lifecycle.' >&2
              exit 1
            fi
            if git push origin HEAD:codex/aapw-realism-20260831-ocean; then
              exit 0
            fi
            echo "Remote advanced during push attempt ${attempt}; retrying from latest head." >&2
          done
          exit 1
