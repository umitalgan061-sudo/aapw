name: Wildlife Long-Frame Budget

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/animals.js'
      - 'scripts/checkWildlifeLongFrameBudget.mjs'
      - '.github/workflows/wildlife-long-frame-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wildlife-long-frame-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/animals\.js|scripts/checkWildlifeLongFrameBudget\.mjs|\.github/workflows/wildlife-long-frame-budget\.yml)$' && exit 1 || true
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END {print s+0}')"
          test $((additions + deletions)) -le 1000
          git diff --check origin/main...HEAD

      - name: Wildlife long-frame deterministic budget
        run: node scripts/checkWildlifeLongFrameBudget.mjs

      - name: Wildlife syntax guard
        run: node --check src/3d/gameplay/animals.js

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
