name: Wildlife Long-Frame Budget

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/animals.js'
      - 'src/3d/gameplay/faunaWorldPlacement.js'
      - 'src/3d/materials/MaterialAssignmentCore.js'
      - 'scripts/checkConfiguredAnimalSpawnGroundSafetyBrowser.mjs'
      - 'scripts/checkConfiguredFaunaGeographicMaterialBrowser.mjs'
      - 'scripts/checkWildlifeLongFrameBudget.mjs'
      - 'scripts/checkWildlifeLongFrameBrowser.mjs'
      - 'scripts/checkWildlifePackAlertIndependence.mjs'
      - 'scripts/checkWildlifePackIteratorCleanup.mjs'
      - 'scripts/checkWildlifePackLongFrameBrowser.mjs'
      - 'scripts/checkWildlifePackAdapterBrowser.mjs'
      - '.github/workflows/configured-animal-spawn-ground-safety.yml'
      - '.github/workflows/wildlife-long-frame-budget.yml'
      - '.github/workflows/wildlife-pack-alert-independence.yml'
      - '.github/workflows/wildlife-pack-adapter-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wildlife-long-frame-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main scope and budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/animals\.js|src/3d/gameplay/faunaWorldPlacement\.js|src/3d/materials/MaterialAssignmentCore\.js|scripts/checkConfiguredAnimalSpawnGroundSafetyBrowser\.mjs|scripts/checkConfiguredFaunaGeographicMaterialBrowser\.mjs|scripts/checkWildlifeLongFrameBudget\.mjs|scripts/checkWildlifeLongFrameBrowser\.mjs|scripts/checkWildlifePackAlertIndependence\.mjs|scripts/checkWildlifePackIteratorCleanup\.mjs|scripts/checkWildlifePackLongFrameBrowser\.mjs|scripts/checkWildlifePackAdapterBrowser\.mjs|scripts/game3dSmokeChecksMovement\.js|\.github/workflows/configured-animal-spawn-ground-safety\.yml|\.github/workflows/wildlife-long-frame-budget\.yml|\.github/workflows/wildlife-pack-alert-independence\.yml|\.github/workflows/wildlife-pack-adapter-browser\.yml)$' && exit 1 || true
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END {print s+0}')"
          test $((additions + deletions)) -le 1000
          git diff --check origin/main...HEAD

      - name: Wildlife long-frame deterministic budget
        run: node scripts/checkWildlifeLongFrameBudget.mjs

      - name: Pack alert independence regression
        run: node scripts/checkWildlifePackAlertIndependence.mjs

      - name: Wildlife syntax guard
        run: |
          node --check src/3d/gameplay/animals.js
          node --check src/3d/gameplay/faunaWorldPlacement.js
          node --check src/3d/materials/MaterialAssignmentCore.js
          node --check scripts/checkConfiguredAnimalSpawnGroundSafetyBrowser.mjs
          node --check scripts/checkConfiguredFaunaGeographicMaterialBrowser.mjs
          node --check scripts/checkWildlifeLongFrameBrowser.mjs
          node --check scripts/checkWildlifePackAlertIndependence.mjs
          node --check scripts/checkWildlifePackIteratorCleanup.mjs
          node --check scripts/checkWildlifePackLongFrameBrowser.mjs
          node --check scripts/checkWildlifePackAdapterBrowser.mjs

      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Hydrate real configured wolf asset
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          asset_ref="$(git rev-parse HEAD)"
          family='assets/models/animals/wolf/'
          if ! git lfs pull --include="${family}**" --exclude=""; then
            echo 'LFS transfer unavailable; hydrating exact wolf pointers through GitHub media.'
          fi
          mapfile -t lfs_paths < <(git lfs ls-files -n | grep "^${family}" || true)
          test "${#lfs_paths[@]}" -gt 0
          for asset_path in "${lfs_paths[@]}"; do
            if test -s "$asset_path" && ! head -c 200 "$asset_path" | grep -aq 'version https://git-lfs.github.com/spec/v1'; then
              continue
            fi
            tmp_asset="${RUNNER_TEMP}/wolf-$(basename "$asset_path").download"
            media_url="https://media.githubusercontent.com/media/${GITHUB_REPOSITORY}/${asset_ref}/${asset_path}"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 "$media_url" --output "$tmp_asset"
            test -s "$tmp_asset"
            ! head -c 200 "$tmp_asset" | grep -aq 'version https://git-lfs.github.com/spec/v1'
            mv "$tmp_asset" "$asset_path"
          done

      - name: Install Chromium proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real wolf pack, geography, material and long-frame browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/game3d.html >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/checkWildlifePackLongFrameBrowser.mjs
          BASE_URL=http://127.0.0.1:4173 node scripts/checkWildlifePackAdapterBrowser.mjs
          BASE_URL=http://127.0.0.1:4173 node scripts/checkConfiguredFaunaGeographicMaterialBrowser.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"