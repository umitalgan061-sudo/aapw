name: SW G17 Terrain3D Biome

on:
  push:
    branches:
      - terrain/sw-g17-macro-biome-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'godot/terrain-authoring/geocells/sw/g17_biome.mjs'
      - 'scripts/checkSWG17Biome.mjs'
      - 'scripts/checkSWG17BiomeVisualEvidence.mjs'
      - 'godot/terrain-authoring/scripts/validate_g17_terrain3d_biome.gd'
      - 'godot/terrain-authoring/corner_claims/SW.json'
      - '.github/workflows/sw-g17-terrain3d-biome.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-g17-terrain3d-biome-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.exact.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-main and bounded scope
        id: exact
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test -n "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/sw/g17_biome.mjs|scripts/checkSWG17Biome.mjs|scripts/checkSWG17BiomeVisualEvidence.mjs|godot/terrain-authoring/scripts/validate_g17_terrain3d_biome.gd|godot/terrain-authoring/corner_claims/SW.json|\.github/workflows/sw-g17-terrain3d-biome.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/project.godot

  authoring:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve captured exact-main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ needs.base.outputs.base_sha }}"
          git merge-base --is-ancestor "${{ needs.base.outputs.base_sha }}" HEAD
      - name: Regress merged G17 hydrology and capture biome source twice
        run: |
          set -euo pipefail
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          node --check godot/terrain-authoring/geocells/sw/g17_biome.mjs
          node --check scripts/checkSWG17Biome.mjs
          node --check scripts/checkSWG17BiomeVisualEvidence.mjs
          node scripts/checkSWG17Hydrology.mjs --out="$RUNNER_TEMP/g17-hydrology-regression.json" | tee "$RUNNER_TEMP/g17-hydrology.log"
          grep -F 'SW_G17_HYDROLOGY_SOURCE_OK' "$RUNNER_TEMP/g17-hydrology.log"
          PROOF='godot/terrain-authoring/.terrain3d-proof/g17-biome-source.json'
          node scripts/checkSWG17Biome.mjs --out="$PROOF" | tee "$RUNNER_TEMP/g17-biome-source-a.log"
          cp "$PROOF" "$RUNNER_TEMP/g17-biome-source-a.json"
          node scripts/checkSWG17Biome.mjs --out="$PROOF" | tee "$RUNNER_TEMP/g17-biome-source-b.log"
          cp "$PROOF" "$RUNNER_TEMP/g17-biome-source-b.json"
          cmp "$RUNNER_TEMP/g17-biome-source-a.log" "$RUNNER_TEMP/g17-biome-source-b.log"
          cmp "$RUNNER_TEMP/g17-biome-source-a.json" "$RUNNER_TEMP/g17-biome-source-b.json"
          grep -F 'SW_G17_BIOME_SOURCE_OK' "$RUNNER_TEMP/g17-biome-source-a.log"
      - name: Install pinned official Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/terrain3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/terrain3d-verify.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/terrain3d-install.log"
          grep -F 'TERRAIN3D_VERIFY_OK version=1.0.2 enabled=true' "$RUNNER_TEMP/terrain3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real Terrain3D G17 Height Color Roughness proof twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 2>&1 | tee "$RUNNER_TEMP/g17-biome-editor.log"
          if grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/g17-biome-editor.log"; then
            echo 'Terrain3D emitted a load error.' >&2
            exit 1
          fi
          G17_BIOME_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g17_terrain3d_biome.gd 2>&1 | tee "$RUNNER_TEMP/g17-biome-a.log"
          G17_BIOME_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g17_terrain3d_biome.gd 2>&1 | tee "$RUNNER_TEMP/g17-biome-b.log"
          grep -F 'SW_G17_TERRAIN3D_BIOME_OK' "$RUNNER_TEMP/g17-biome-a.log"
          grep -F 'SW_G17_TERRAIN3D_BIOME_OK' "$RUNNER_TEMP/g17-biome-b.log"
          grep -F 'G17_TERRAIN3D_BIOME_METRICS=' "$RUNNER_TEMP/g17-biome-a.log" | tail -1 > "$RUNNER_TEMP/g17-biome-metrics-a.txt"
          grep -F 'G17_TERRAIN3D_BIOME_METRICS=' "$RUNNER_TEMP/g17-biome-b.log" | tail -1 > "$RUNNER_TEMP/g17-biome-metrics-b.txt"
          cmp "$RUNNER_TEMP/g17-biome-metrics-a.txt" "$RUNNER_TEMP/g17-biome-metrics-b.txt"
          cmp godot/terrain-authoring/.terrain3d-proof/g17-biome-imported-topdown-a.png godot/terrain-authoring/.terrain3d-proof/g17-biome-imported-topdown-b.png
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd 2>&1 | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Near far and seamless full-world biome evidence
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSWG17BiomeVisualEvidence.mjs --out-dir=artifacts/sw-g17-biome-visual | tee "$RUNNER_TEMP/g17-biome-visual.log"
          grep -F 'SW_G17_BIOME_VISUAL_OK' "$RUNNER_TEMP/g17-biome-visual.log"
          test -s artifacts/sw-g17-biome-visual/g17-biome-near.png
          test -s artifacts/sw-g17-biome-visual/g17-biome-far.png
          test -s artifacts/sw-g17-biome-visual/g17-biome-full-world-topdown.png
          test -s artifacts/sw-g17-biome-visual/g17-biome-visual-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-g17-terrain3d-biome-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g17-biome-source.json
            godot/terrain-authoring/.terrain3d-proof/g17-biome-imported-topdown-a.png
            godot/terrain-authoring/.terrain3d-proof/g17-biome-imported-topdown-b.png
            artifacts/sw-g17-biome-visual/
            ${{ runner.temp }}/g17-hydrology.log
            ${{ runner.temp }}/g17-biome-source-a.log
            ${{ runner.temp }}/g17-biome-source-b.log
            ${{ runner.temp }}/terrain3d-install.log
            ${{ runner.temp }}/terrain3d-verify.log
            ${{ runner.temp }}/g17-biome-editor.log
            ${{ runner.temp }}/g17-biome-a.log
            ${{ runner.temp }}/g17-biome-b.log
            ${{ runner.temp }}/g17-biome-metrics-a.txt
            ${{ runner.temp }}/g17-biome-metrics-b.txt
            ${{ runner.temp }}/g17-biome-visual.log
            ${{ runner.temp }}/hterrain.log

  world-safety:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve captured exact-main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ needs.base.outputs.base_sha }}"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Settlement and road safety regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js

  platform-safety:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve captured exact-main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ needs.base.outputs.base_sha }}"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Determinism PWA mobile and browser regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

  final-exact-main:
    needs: [base, authoring, world-safety, platform-safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Final exact-main gate after all parallel evidence
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="${{ needs.base.outputs.base_sha }}"
          test -n "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"...HEAD
