name: Player Recovery Attack Buffer Drop

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerRecoveryAttackBufferDrop.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferRuntime.mjs'
      - 'scripts/checkPlayerCombatRecoveryInputIsolation.mjs'
      - 'scripts/checkPlayerParryRecovery.mjs'
      - 'scripts/checkSharedMaterialPlacementContract.js'
      - '.github/workflows/player-recovery-attack-buffer-drop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-recovery-attack-buffer-drop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+=$2}')