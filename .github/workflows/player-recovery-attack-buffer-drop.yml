name: Player Recovery Attack Buffer Drop

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerRecoveryAttackBufferDrop.mjs'
      - 'scripts/checkPlayerRecoveryAttackBufferRuntime.mjs'
      - 'scripts/checkPlayerCombatRecoveryInputIsolation.mjs'
      - 'scripts/checkPlayerParryRecovery.mjs'
      - 'scripts/checkPlayerHitStaggerRuntime.mjs'
      - 'scripts/checkSharedMaterialPlacementContract.js'
      - '.github/workflows/player-recovery-attack-buffer-drop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-recovery-attack-buffer-drop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          read -r ADD DEL < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          changed=$((ADD + DEL))
          echo "scope additions=${ADD} deletions=${DEL} changed=${changed}"
          test "$changed" -le 1000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Syntax combat and shared material contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/player.js
          node --check scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node --check scripts/checkPlayerRecoveryAttackBufferRuntime.mjs
          node --check scripts/checkPlayerHitStaggerRuntime.mjs
          node scripts/checkPlayerRecoveryAttackBufferDrop.mjs
          node scripts/checkPlayerCombatRecoveryInputIsolation.mjs
          node scripts/checkPlayerParryRecovery.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          ! grep -q 'EditorMaterialStudio' src/3d/gameplay/player.js
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
      - name: Shared PWA and cache contracts
        id: shared-pwa
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
      - name: Asset-first shipped-scene hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/animations/peasant_girl/**,assets/models/vegetation/pine_Zt62gceKXZ.glb,assets/models/vegetation/winter_tree.glb,assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb,assets/models/Ay/Moon 2K.fbx" --exclude=""
          test -s assets/models/characters/peasant_girl.fbx
          test -s assets/animations/peasant_girl/idle.fbx
          test -s assets/animations/peasant_girl/walking.fbx
          test -s assets/animations/peasant_girl/running.fbx
          test "$(wc -c < assets/models/vegetation/pine_Zt62gceKXZ.glb)" -gt 512
          test "$(wc -c < assets/models/vegetation/winter_tree.glb)" -gt 512
          test "$(wc -c < assets/models/vegetation/dead_trees_with_snow_iEuwXWner0.glb)" -gt 512
          test "$(wc -c < 'assets/models/Ay/Moon 2K.fbx')" -gt 512
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped scene browser and performance proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/player-recovery-attack-buffer-drop
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerRecoveryAttackBufferRuntime.mjs --out-dir=artifacts/player-recovery-attack-buffer-drop/recovery-buffer | tee artifacts/player-recovery-attack-buffer-drop/recovery-buffer.log
          grep -q 'PLAYER_RECOVERY_ATTACK_BUFFER_RUNTIME_OK' artifacts/player-recovery-attack-buffer-drop/recovery-buffer.log
          grep -q '"browserErrors": \[\]' artifacts/player-recovery-attack-buffer-drop/recovery-buffer/recovery-attack-buffer-runtime.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkPlayerHitStaggerRuntime.mjs --out-dir=artifacts/player-recovery-attack-buffer-drop/hit-stagger | tee artifacts/player-recovery-attack-buffer-drop/hit-stagger.log
          grep -q 'PLAYER_HIT_STAGGER_RUNTIME_OK' artifacts/player-recovery-attack-buffer-drop/hit-stagger.log
          grep -q '"browserErrors": \[\]' artifacts/player-recovery-attack-buffer-drop/hit-stagger/hit-stagger-runtime.json
          node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
      - name: Exact main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - name: Require shared PWA and cache contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.shared-pwa.outcome }}" = "success"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-recovery-attack-buffer-drop-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/player-recovery-attack-buffer-drop/
