name: settlement-journey-contract

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementJourneyContract.js'
      - 'scripts/checkSettlementJourneyContract.mjs'
      - '.github/workflows/settlement-journey-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate focused scope
        shell: bash
        run: |
          test -f src/3d/gameplay/settlementJourneyContract.js
          test -f scripts/checkSettlementJourneyContract.mjs
          test -f .github/workflows/settlement-journey-contract.yml
          ! grep -R "EditorMaterialStudio" -n src/3d/gameplay/settlementJourneyContract.js scripts/checkSettlementJourneyContract.mjs
          ! grep -R "MaterialAssignmentCore\|WorldAssetPlacementPipeline" -n src/3d/gameplay/settlementJourneyContract.js scripts/checkSettlementJourneyContract.mjs
      - name: Syntax
        run: |
          node --check src/3d/gameplay/settlementJourneyContract.js
          node --check scripts/checkSettlementJourneyContract.mjs
      - name: Regression
        run: node scripts/checkSettlementJourneyContract.mjs
