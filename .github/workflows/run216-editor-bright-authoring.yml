name: Run216 Editor Bright Authoring

on:
  push:
    branches:
      - agent/run216-owner-editor-usability-fixes
    paths:
      - 'src/3d/editor/EditorLiveWorldVisualSync.js'
      - 'scripts/checkRun216EditorBrightAuthoring.js'
      - 'scripts/checkRun216EditorBrightAuthoringBrowser.js'
      - '.github/workflows/run216-editor-bright-authoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-bright-authoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Syntax and bright authoring source contract
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorLiveWorldVisualSync.js
          node --check scripts/checkRun216EditorBrightAuthoring.js
          node --check scripts/checkRun216EditorBrightAuthoringBrowser.js
          node scripts/checkRun216EditorBrightAuthoring.js
      - name: Install isolated Chromium proof tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run216-editor-bright-tools"
          npm install --prefix "$RUNNER_TEMP/run216-editor-bright-tools" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/run216-editor-bright-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/run216-editor-bright-tools/node_modules" >> "$GITHUB_ENV"
      - name: Bright authoring two-angle visual proof
        run: node scripts/checkRun216EditorBrightAuthoringBrowser.js
      - name: Full editor desktop/mobile regression proof
        run: node scripts/checkRun216EditorUsabilityBrowser.js
      - name: Game PWA performance and deterministic safety
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run216-bright-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run216-bright-smoke.log")" -ge 34
          grep -F 'zero console/page errors' "$RUNNER_TEMP/run216-bright-smoke.log"
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Final concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload bright authoring visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run216-editor-bright-authoring
          path: |
            artifacts/run216-editor-bright-authoring/*.png
            artifacts/run216-editor-usability/*.png
          if-no-files-found: error

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
