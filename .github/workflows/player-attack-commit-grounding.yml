name: Player Attack Commit Grounding

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerAttackCommitGroundingContract.mjs'
      - '.github/workflows/player-attack-commit-grounding.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-attack-commit-grounding-*'

permissions:
  contents: read

jobs:
  attack-commit-grounding:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact-main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          mapfile -t files < <(git diff --name-only "$BASE"...HEAD)
          test "${#files[@]}" -le 3
          for file in "${files[@]}"; do
            case "$file" in
              src/3d/gameplay/player.js|scripts/checkPlayerAttackCommitGroundingContract.mjs|.github/workflows/player-attack-commit-grounding.yml) ;;
              *) echo "unexpected scope: $file" >&2; exit 1 ;;
            esac
          done
          read -r additions deletions < <(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          test $((additions + deletions)) -le 1000
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Player combat grounding contracts
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/player.js
          node --check scripts/checkPlayerAttackCommitGroundingContract.mjs
          node scripts/checkPlayerAttackCommitGroundingContract.mjs
          node --check scripts/checkPlayerGroundingCombatContract.mjs
          node scripts/checkPlayerGroundingCombatContract.mjs
          node scripts/checkPlayerCombatVerticalSlice.mjs
          node scripts/checkSharedMaterialPlacementContract.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkServiceWorkerCache.js

      - name: Deterministic replay
        run: |
          set -euo pipefail
          first="$(node scripts/checkPlayerAttackCommitGroundingContract.mjs)"
          second="$(node scripts/checkPlayerAttackCommitGroundingContract.mjs)"
          test "$first" = "$second"
          grep -q 'PLAYER_ATTACK_COMMIT_GROUNDING_CONTRACT_OK' <<< "$first"

      - name: Asset-first targeted hydration
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs pull --include="assets/models/characters/**,assets/models/animals/**,assets/models/creatures/dragon/**,assets/models/props/**,assets/models/settlements/castles/**,assets/animations/peasant_girl/**" --exclude=""
          assert_hydrated() {
            local path="$1"
            test -s "$path"
            if head -n 1 "$path" | grep -qx 'version https://git-lfs.github.com/spec/v1'; then
              echo "LFS pointer remained after hydration: $path" >&2
              exit 1
            fi
          }
          assert_hydrated assets/models/characters/peasant_girl.fbx
          assert_hydrated assets/animations/peasant_girl/idle.fbx
          assert_hydrated assets/animations/peasant_girl/walking.fbx
          assert_hydrated assets/animations/peasant_girl/running.fbx

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Shipped scene browser PWA perf proof
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
