name: Run 249 Editor Snap Enabled Offgrid Load Finalize

on:
  push:
    branches:
      - agent/run249-editor-snap-enabled-offgrid-load
    paths:
      - '.github/workflows/run249-editor-snap-enabled-offgrid-load-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run249-editor-snap-enabled-offgrid-load-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun249EditorSnapEnabledOffgridLoad.js
          node --check src/3d/editor/EditorLocalSession.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run249 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 249 — World Editor snap-enabled off-grid scene import regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies that a valid scene JSON with `snapEnabled: true`, `snapSize: 2.5`, and deliberately off-grid serialized coordinates loads those coordinates exactly instead of quantizing them.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The pre-load live editor state is independently prepared with snap enabled at size `4.25`; loading then restores the serialized snap metadata (`true` / `2.5`) while preserving object ID/name/asset, signed rotation, non-uniform scale including `0.007`, and the exact off-grid position `[-17.375, 0.125, 24.625]`.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Scene load clears selection, leaves history observers stable/not restoring, preserves the owner grid-hidden/disabled policy, reports the canonical success toast, and records zero browser console/page errors.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Validation workflow `31461470921` PASS: syntax, Chromium regression, PWA cache/installability, mobile performance, deterministic/world-reference/hydrology, terrain/road safety, perf trend, technical-debt audit, full browser smoke, final remote-main/additive-only gates, and two-screenshot artifact all PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- World Event Determinism Guard `31461470884` PASS on the same Run249 head.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed in Run249. Test/workflow/checkpoint-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required; this run locks the Run248 scene-load snap-isolation behavior with the complementary snap-enabled off-grid case.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: continue additive-only World Editor scene-load compatibility/regression coverage without crossing unresolved owner gates, after refreshing remote main and checking concurrent branches.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run249,2026-08-11,editor-snap-enabled-offgrid-load' perf_log.csv; then
            printf 'run249,%s,editor-snap-enabled-offgrid-load,,,,,,,"test-only snap-enabled off-grid scene import regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run249 editor snap-enabled off-grid scene import regression' STABLE_TAGS.md; then
            printf '%s — Run249 editor snap-enabled off-grid scene import regression; off-grid serialized transforms survive load while snap metadata restores to true/2.5; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run249 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run249): record snap-enabled off-grid load checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run249-editor-snap-enabled-offgrid-load
          git push origin "$STABLE_TAG" || true
