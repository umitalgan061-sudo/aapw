name: Safak Kartali fauna ecology determinism

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldFaunaEcologyDirector.js'
      - 'scripts/checkSafakKartaliFaunaEcologyDeterminism.mjs'
      - '.github/workflows/safak-kartali-fauna-ecology-determinism.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safak-kartali-fauna-determinism-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        run: |
          node --check src/3d/gameplay/livingWorldFaunaEcologyDirector.js
          node --check scripts/checkSafakKartaliFaunaEcologyDeterminism.mjs
      - name: Determinism hazard guard
        run: node scripts/checkSafakKartaliFaunaEcologyDeterminism.mjs
