name: Kızıl Ufuk Core Runtime TypeScript Migration

on:
  push:
    branches: ['main', 'agent/kizil-ufuk-core-runtime-ts-migration-20260918-r1']
  pull_request:
    branches: ['main']
    paths:
      - 'src/3d/config.ts'
      - 'src/3d/config.js'
      - 'src/3d/eventBus.ts'
      - 'src/3d/eventBus.js'
      - 'tests/modern/coreRuntimeEventBus.test.ts'
      - 'scripts/checkKizilUfukCoreRuntime.mjs'
      - '.github/workflows/kizil-ufuk-core-runtime-ts-migration.yml'

permissions:
  contents: read

concurrency:
  group: kizil-ufuk-core-runtime-ts-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Exact main ancestry
        run: git fetch origin main --no-tags && git merge-base --is-ancestor origin/main "$GITHUB_SHA"

      - name: Changed-line cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Runtime executable proof
        run: node --experimental-strip-types scripts/checkKizilUfukCoreRuntime.mjs

      - name: Runtime Vitest
        run: npx vitest run tests/modern/coreRuntimeEventBus.test.ts
