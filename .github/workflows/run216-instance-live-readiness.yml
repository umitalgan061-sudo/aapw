name: Run216 Instance Live Readiness

on:
  push:
    branches:
      - agent/run216-world-editor-transform-controls
    paths:
      - 'src/3d/editor/worldEditor.js'
      - 'src/3d/editor/EditorInstancePointerOwnership.js'
      - 'src/3d/editor/EditorInstanceInteractionBootstrap.js'
      - 'scripts/checkRun216InstanceLiveReadiness.mjs'
      - '.github/workflows/run216-instance-live-readiness.yml'
  pull_request:
    paths:
      - 'src/3d/editor/worldEditor.js'
      - 'src/3d/editor/EditorInstancePointerOwnership.js'
      - 'src/3d/editor/EditorInstanceInteractionBootstrap.js'
      - 'scripts/checkRun216InstanceLiveReadiness.mjs'
      - '.github/workflows/run216-instance-live-readiness.yml'

permissions:
  contents: read

jobs:
  instance-live-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and self-test
        run: |
          node --check scripts/checkRun216InstanceLiveReadiness.mjs
          node scripts/checkRun216InstanceLiveReadiness.mjs --self-test
      - name: Current branch readiness contract
        run: node scripts/checkRun216InstanceLiveReadiness.mjs
