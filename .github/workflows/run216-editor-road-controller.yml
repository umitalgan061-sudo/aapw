name: Run216 Editor Road Controller

on:
  pull_request:
    paths:
      - 'editor.html'
      - 'src/3d/editor/editorAssetLibrary.js'
      - 'src/3d/editor/EditorAssetManager.js'
      - 'src/3d/editor/EditorRoadModel.js'
      - 'src/3d/editor/EditorRoadController.js'
      - 'scripts/checkRun216EditorRoadModel.mjs'
      - 'scripts/checkRun216EditorRoadController.js'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-road-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-road-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check src/3d/editor/editorAssetLibrary.js
      - run: node --check src/3d/editor/EditorAssetManager.js
      - run: node --check src/3d/editor/EditorRoadModel.js
      - run: node --check src/3d/editor/EditorRoadController.js
      - run: node --check scripts/checkRun216EditorRoadModel.mjs
      - run: node --check scripts/checkRun216EditorRoadController.js
      - run: node scripts/checkRun216EditorRoadModel.mjs
      - run: node scripts/checkRun216EditorRoadController.js
      - run: node scripts/materializeRun216ServiceWorkerCache.js --self-test
      - run: node scripts/checkRun216ServiceWorkerMaterializer.js
