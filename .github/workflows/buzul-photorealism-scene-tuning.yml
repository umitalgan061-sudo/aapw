name: Buzul Photorealism Scene Tuning

on:
  pull_request:
    paths:
      - 'package.json'
      - 'src/3d/sceneManager.js'
      - 'src/3d/world/photorealismSceneTuning.ts'
      - 'scripts/checkPhotorealismSceneTuning.mjs'
      - '.github/workflows/buzul-photorealism-scene-tuning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzul-photorealism-scene-tuning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install proof dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/checkPhotorealismSceneTuning.mjs
      - run: node --experimental-strip-types --check src/3d/world/photorealismSceneTuning.ts
      - run: node --check src/3d/sceneManager.js
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
