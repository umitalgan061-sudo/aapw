name: Living World Reaction Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldReactionRuntime.js'
      - 'src/3d/gameplay/livingWorldReactionEvidence.js'
      - 'src/3d/gameplay/livingWorldReactionIntegrationAdapter.js'
      - 'scripts/checkLivingWorldReactionRuntime.mjs'
      - 'scripts/checkLivingWorldReactionBrowser.mjs'
      - 'scripts/checkLivingWorldReactionArchitecture.mjs'
      - 'scripts/checkLivingWorldReactionBudget.mjs'
      - 'scripts/checkLivingWorldReactionScenarioMatrix.mjs'
      - 'scripts/checkLivingWorldReactionIntegration.mjs'
      - 'scripts/checkLivingWorldReactionIntegrationBrowser.mjs'
      - 'scripts/checkLivingWorldReactionTelemetryContract.mjs'
      - 'scripts/checkLivingWorldReactionAssetContract.mjs'
      - '.github/workflows/living-world-reaction-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaction-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-main freshness and <=3000 diff contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          additions="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2} END {print s+0}')"
          total=$((additions + deletions))
          echo "BASE_SHA=$BASE_SHA additions=$additions deletions=$deletions total=$total"
          test "$total" -le 3000
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/3d/gameplay/livingWorldReaction(Runtime|Evidence|IntegrationAdapter)\.js|scripts/checkLivingWorldReaction(Runtime|Browser|Architecture|Budget|ScenarioMatrix|Integration|IntegrationBrowser|TelemetryContract|AssetContract)\.mjs|\.github/workflows/living-world-reaction-runtime\.yml)$' || true)"
          test -z "$unexpected"
          git diff --check "$BASE_SHA"...HEAD

      - name: Syntax contracts
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/livingWorldReactionRuntime.js
          node --check src/3d/gameplay/livingWorldReactionEvidence.js
          node --check src/3d/gameplay/livingWorldReactionIntegrationAdapter.js
          node --check scripts/checkLivingWorldReactionRuntime.mjs
          node --check scripts/checkLivingWorldReactionBrowser.mjs
          node --check scripts/checkLivingWorldReactionArchitecture.mjs
          node --check scripts/checkLivingWorldReactionBudget.mjs
          node --check scripts/checkLivingWorldReactionScenarioMatrix.mjs
          node --check scripts/checkLivingWorldReactionIntegration.mjs
          node --check scripts/checkLivingWorldReactionIntegrationBrowser.mjs
          node --check scripts/checkLivingWorldReactionTelemetryContract.mjs
          node --check scripts/checkLivingWorldReactionAssetContract.mjs

      - name: Runtime vertical slice
        run: node scripts/checkLivingWorldReactionRuntime.mjs

      - name: Scenario matrix
        run: node scripts/checkLivingWorldReactionScenarioMatrix.mjs

      - name: Runtime telemetry contract
        run: node scripts/checkLivingWorldReactionTelemetryContract.mjs

      - name: Existing-director composition contract
        run: node scripts/checkLivingWorldReactionIntegration.mjs

      - name: Ownership and architecture
        run: node scripts/checkLivingWorldReactionArchitecture.mjs

      - name: Asset-first and shared placement boundary
        run: node scripts/checkLivingWorldReactionAssetContract.mjs

      - name: Deterministic population and sensing budget
        run: node scripts/checkLivingWorldReactionBudget.mjs

      - name: Shared material / placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js

      - name: Install Chromium proof tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real shipped Three.js reaction browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/living-world-reaction-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/game3d.html >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 node scripts/checkLivingWorldReactionBrowser.mjs
          BASE_URL=http://127.0.0.1:4173 node scripts/checkLivingWorldReactionIntegrationBrowser.mjs

      - name: Final exact-main freshness recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END {print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END {print s+0}')"
          test $((additions + deletions)) -le 3000
          git diff --check origin/main...HEAD
