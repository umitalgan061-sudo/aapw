name: Player Damage Source Provenance

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/health.js'
      - 'scripts/checkPlayerDamageSourceProvenance.mjs'
      - '.github/workflows/player-damage-source-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  damage-source-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          BASE="$(git merge-base HEAD origin/main)"
          test "$BASE" = "$(git rev-parse origin/main)"
          mapfile -t files < <(git diff --name-only "$BASE"...HEAD)
          for file in "${files[@]}"; do
            case "$file" in
              src/3d/gameplay/health.js|scripts/checkPlayerDamageSourceProvenance.mjs|.github/workflows/player-damage-source-provenance.yml) ;;
              *) echo "Unexpected path: $file" >&2; exit 1 ;;
            esac
          done
          changed="$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 1000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/health.js
          node --check scripts/checkPlayerDamageSourceProvenance.mjs
      - name: Damage source provenance regression
        run: node scripts/checkPlayerDamageSourceProvenance.mjs
      - name: Standing combat health contracts
        run: |
          node scripts/checkPlayerCombatHealthReceipt.mjs
          node scripts/checkPlayerImmutableDefenseDamage.mjs
          node scripts/checkPlayerCombatVerticalSlice.mjs
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
