name: Safak Kartali living world scenario contract R4
on:
  push:
    branches:
      - agent/safak-kartali-living-world-20260915-r4
    paths:
      - 'src/3d/gameplay/livingWorldDirectorScenarioContract.js'
      - 'scripts/generateSafakKartaliLivingWorldDirectorScenarioR4.mjs'
      - 'scripts/checkSafakKartaliLivingWorldDirectorScenarioContractR4.mjs'
      - '.github/workflows/safak-kartali-living-world-scenario-contract-r4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/livingWorldDirectorScenarioContract.js'
      - 'scripts/generateSafakKartaliLivingWorldDirectorScenarioR4.mjs'
      - 'scripts/checkSafakKartaliLivingWorldDirectorScenarioContractR4.mjs'
      - '.github/workflows/safak-kartali-living-world-scenario-contract-r4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/livingWorldDirectorScenarioContract.js
          node --check scripts/generateSafakKartaliLivingWorldDirectorScenarioR4.mjs
          node --check scripts/checkSafakKartaliLivingWorldDirectorScenarioContractR4.mjs
      - name: Generate 4,096 deterministic runtime cases
        run: node scripts/generateSafakKartaliLivingWorldDirectorScenarioR4.mjs
      - name: Validate runtime case matrix
        run: node scripts/checkSafakKartaliLivingWorldDirectorScenarioContractR4.mjs
      - name: Verify generated corpus is reproducible
        run: |
          set -euo pipefail
          expected_sha=$(sha256sum artifacts/safak-kartali-living-world-director-scenario-r4-cases.jsonl | cut -d' ' -f1)
          node scripts/generateSafakKartaliLivingWorldDirectorScenarioR4.mjs
          actual_sha=$(sha256sum artifacts/safak-kartali-living-world-director-scenario-r4-cases.jsonl | cut -d' ' -f1)
          test "$expected_sha" = "$actual_sha"
          git diff --exit-code -- artifacts/safak-kartali-living-world-director-scenario-r4-cases.jsonl
      - name: Diff hygiene
        run: git diff --check
