name: Player Combat Presentation Snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerCombatPresentationSnapshot.js'
      - 'scripts/checkPlayerCombatPresentationSnapshot.mjs'
      - '.github/workflows/player-combat-presentation-snapshot.yml'
  push:
    branches: [codex/kizil-ufuk-player-combat-snapshot-20260908]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          TOTAL="$(git diff --numstat "$BASE...HEAD" | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$TOTAL" -le 3000
          git diff --check "$BASE...HEAD"
          test "$(git diff --name-only "$BASE...HEAD" | sort | tr '\n' ' ')" = ".github/workflows/player-combat-presentation-snapshot.yml scripts/checkPlayerCombatPresentationSnapshot.mjs src/3d/gameplay/playerCombatPresentationSnapshot.js "
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatPresentationSnapshot.js
          node --check scripts/checkPlayerCombatPresentationSnapshot.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatPresentationSnapshot.mjs
      - name: Editor UI import guard
        run: |
          ! grep -n "EditorMaterialStudio" src/3d/gameplay/playerCombatPresentationSnapshot.js
      - name: Final freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --numstat "$BASE...HEAD" | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
