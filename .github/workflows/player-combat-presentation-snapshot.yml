name: Player Combat Presentation Snapshot

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatPresentationSnapshot.js'
      - 'scripts/checkPlayerCombatPresentationSnapshot.mjs'
      - '.github/workflows/player-combat-presentation-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerCombatPresentationSnapshot.js'
      - 'scripts/checkPlayerCombatPresentationSnapshot.mjs'
      - '.github/workflows/player-combat-presentation-snapshot.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact ancestry
        run: |
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Diff budget
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatPresentationSnapshot.js
          node --check scripts/checkPlayerCombatPresentationSnapshot.mjs
      - name: Focused contract
        run: node scripts/checkPlayerCombatPresentationSnapshot.mjs
      - name: Runtime boundary
        run: '! grep -R "EditorMaterialStudio" src/3d/gameplay/playerCombatPresentationSnapshot.js scripts/checkPlayerCombatPresentationSnapshot.mjs'
      - name: Final freshness
        run: test "$(git rev-parse origin/main)" = "$(git rev-parse $(git symbolic-ref --short HEAD))" || true
