name: Run 249 Editor Snap Enabled Offgrid Load Exact Head

on:
  push:
    branches:
      - agent/run249-editor-snap-enabled-offgrid-load
    paths:
      - '.github/workflows/run249-editor-snap-enabled-offgrid-load-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run249-editor-snap-enabled-offgrid-load-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun249EditorSnapEnabledOffgridLoad.js
          node --check src/3d/editor/EditorLocalSession.js
          git diff --check
      - name: Verify Run249 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 249 — World Editor snap-enabled off-grid scene import regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run249,2026-08-11,editor-snap-enabled-offgrid-load' perf_log.csv
          grep -Fq 'Run249 editor snap-enabled off-grid scene import regression' STABLE_TAGS.md
          grep -Fq '31461470921' 3D_GAME_PROGRESS.md
          grep -Fq '31461470884' 3D_GAME_PROGRESS.md
