name: Winter Pine Hydrated Material Slots

on:
  pull_request:
    paths:
      - 'src/3d/world/winterVegetationAsset.js'
      - 'scripts/checkWinterTreeVisualQa.js'
      - 'scripts/checkWinterPineHydratedMaterialSlots.mjs'
      - 'winter-tree-visual-qa.html'
      - '.github/workflows/winter-pine-hydrated-material-slots.yml'

permissions:
  contents: read

jobs:
  hydrated-material-slots:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          BASE="$(git merge-base HEAD origin/main)"
          test "$BASE" = "$(git rev-parse origin/main)"
          STATS="$(git diff --numstat "$BASE"..HEAD)"
          ADDED="$(printf '%s\n' "$STATS" | awk '{if ($1 ~ /^[0-9]+$/) a += $1} END {print a + 0}')"
          DELETED="$(printf '%s\n' "$STATS" | awk '{if ($2 ~ /^[0-9]+$/) d += $2} END {print d + 0}')"
          TOTAL=$((ADDED + DELETED))
          echo "scope additions=$ADDED deletions=$DELETED total=$TOTAL"
          test "$TOTAL" -le 1000
          git diff --check "$BASE"..HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve vendored Three.js
        run: node scripts/setupNodeThreeShim.mjs

      - name: Syntax and shared placement contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/winterVegetationAsset.js
          node --check scripts/checkWinterTreeVisualQa.js
          node --check scripts/checkWinterPineHydratedMaterialSlots.mjs
          node scripts/checkSharedMaterialPlacementContract.mjs
          node scripts/checkSeededRandomPolicy.js

      - name: Hydrate verified winter assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/firebaseDeployLfsReadiness.mjs \
            --hydrate \
            --scope=winter \
            --manifest=artifacts/winter-tree-visual-qa/lfs-readiness.json

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          ln -sfn "$RUNNER_TEMP/pw/node_modules" "$GITHUB_WORKSPACE/node_modules"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Render hydrated preferred pine
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkWinterTreeVisualQa.js

      - name: Verify trunk and foliage material slots
        run: node scripts/checkWinterPineHydratedMaterialSlots.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
