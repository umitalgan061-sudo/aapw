name: Buzul Muhafizi - Environment Material Application V57
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/world/environmentMaterialApplicationV57.js'
      - 'scripts/checkEnvironmentMaterialApplicationV57.mjs'
      - '.github/workflows/buzul-muhafizi-environment-material-application-v57.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry
        run: git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - name: Syntax
        run: |
          node --check src/3d/world/environmentMaterialApplicationV57.js
          node --check scripts/checkEnvironmentMaterialApplicationV57.mjs
      - name: Regression
        run: node scripts/checkEnvironmentMaterialApplicationV57.mjs
      - name: Boundary and diff budget
        run: |
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 3
          git diff --check origin/main...HEAD
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          ! git diff origin/main...HEAD -- 'src/3d/terrain.js' 'src/3d/water.js' 'src/3d/sceneManager.js' 'src/3d/naturalGeology.js' 'src/3d/rivers.js' 'src/3d/roads.js'
          ! git diff origin/main...HEAD -- '**/EditorMaterialStudio.js' '**/editor/**'
