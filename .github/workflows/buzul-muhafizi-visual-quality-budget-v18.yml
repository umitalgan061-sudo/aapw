name: buzul-muhafizi-visual-quality-budget-v18

on:
  pull_request:
    paths:
      - src/3d/world/visualQualityBudgetAdapter.js
      - scripts/checkVisualQualityBudgetAdapter.mjs
      - .github/workflows/buzul-muhafizi-visual-quality-budget-v18.yml
  push:
    branches: [main]
    paths:
      - src/3d/world/visualQualityBudgetAdapter.js
      - scripts/checkVisualQualityBudgetAdapter.mjs
      - .github/workflows/buzul-muhafizi-visual-quality-budget-v18.yml

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact ancestry and focused scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin main --depth=1
            git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD
            changed=$(git diff --name-only "$(git rev-parse origin/main)" HEAD)
            expected=$'\.github/workflows/buzul-muhafizi-visual-quality-budget-v18.yml\nscripts/checkVisualQualityBudgetAdapter.mjs\nsrc/3d/world/visualQualityBudgetAdapter.js'
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$changed")
            lines=$(git diff --numstat "$(git rev-parse origin/main)" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
            test "$lines" -le 3000
          fi
      - name: Syntax
        run: |
          node --check src/3d/world/visualQualityBudgetAdapter.js
          node --check scripts/checkVisualQualityBudgetAdapter.mjs
      - name: Executable contract
        run: node scripts/checkVisualQualityBudgetAdapter.mjs
      - name: Shared material/editor boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" -n src/3d/world/visualQualityBudgetAdapter.js scripts/checkVisualQualityBudgetAdapter.mjs
