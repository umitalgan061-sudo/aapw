name: Pindex Quality V2 Docs Bootstrap

on:
  push:
    branches:
      - terrain/pindex-quality-v2-20260812

permissions:
  contents: write

jobs:
  append-records:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append durable Pindex Quality V2 records
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'ADR-PINDEX-QUALITY-V2-2026-08-12' DECISIONS.md; then
            echo '' | base64 -d >> DECISIONS.md
          fi
          if ! grep -q 'PINDEX-QUALITY-V2-2026-08-12' 3D_GAME_PROGRESS.md; then
            echo '' | base64 -d >> 3D_GAME_PROGRESS.md
          fi
          git diff --check
      - name: Commit records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DECISIONS.md 3D_GAME_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record pindex quality v2 architecture and RCA"
          git push origin HEAD:terrain/pindex-quality-v2-20260812
