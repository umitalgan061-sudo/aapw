name: Pindex Quality V2 Docs Bootstrap

on:
  push:
    branches:
      - terrain/pindex-quality-v2-20260812

permissions:
  contents: write

jobs:
  append-records:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append durable Pindex Quality V2 records
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'ADR-PINDEX-QUALITY-V2-2026-08-12' DECISIONS.md; then
            printf '%s\n' '' '## ADR-PINDEX-QUALITY-V2-2026-08-12 — Canonical Pindex semantic quality atlas on shipped terrain' '' '**Risk Seviyesi:** MEDIUM' '' '**Karar:** Değişmez 96×64 owner-map semantic mask yeniden çizilmiyor. P01..P10 sürekli sub-cell surface weights ve strip-seam-free profile interpolation ile örnekleniyor; worldReferenceMap.js içindeki denetlenmiş 17 biome zone ve 4 relief chain bu alana katılıyor. Runtime yorum 192×128 color/data atlasına bir kez bake edilip fragment shader tarafından lineer örnekleniyor. Yakın yüzey için ayrıca 64×64 deterministik repeat-noise atlası kullanılıyor. Terrain position/height/physics değişmiyor.' '' '**Neden:** Iteration #08 semantic veriyi shipped terrain üzerine taşıdı fakat 96×64 nearest-cell görünümü köşeli geçişler üretiyordu ve P10 ayrı mikro katmana sahip değildi. Yeni coğrafya uydurmak yerine repodaki denetlenmiş biome/relief verisi source-of-truth olarak yeniden kullanıldı.' '' '**Reddedilen ilk yaklaşım / RCA:** İlk V2 prototipi biome+relief+detail sampling'i her terrain vertex için ikinci CPU pass yaptı. İzole WebGL kanıtı doğruydu fakat yüzlerce preview chunk ve tekrarlı smoke boot mevcut 10s page.goto sınırını aştı. Timeout artırılmadı; zengin örnekleme atlaslara taşındı ve V2 ek CPU vertex pass sayısı 0 yapıldı.' '' '**Görsel karar:** İlk shader-atlas kanıtındaki yönlü sinüs grain diyagonal bant ürettiği için testler yeşil olmasına rağmen kabul edilmedi. Sinüs grain kaldırıldı; farklı yön ve ölçeklerde örneklenen deterministik repeat-noise atlası color ve roughness mikro varyasyonu için kullanıldı.' '' '**Alternatifler:** nearest-cell görünümü bırakmak kalite nedeniyle; kaynakta olmayan yüksek çözünürlük pikselleri tahmin etmek source-of-truth nedeniyle; ikinci CPU vertex pass performans nedeniyle reddedildi. Ağır dış PBR asset paketi bu iterasyonda lisans/cache bütçesi nedeniyle ertelendi.' '' '**Sonuç:** P01..P10 tek sürekli yüzey alanı gibi davranıyor; semantic sınırlar yumuşuyor, biome/relief/PBR roughness katılıyor, P10 kalite profilinde kapsanıyor. Iteration #08 CPU color array ve terrain height array birebir korunuyor; V2 farkı GPU shading katmanında.' '' '**Etkilenen sistemler:** worldReferenceSurfacePindexes.js, worldReferenceSurfaceTerrainVisual.js, ChunkManager runtime installer ve terrain visual regression workflow. Geometry, collider, road, seat, water, 2D mode ve authored HTerrain zinciri değişmiyor.' '' '**Geri alma planı:** V2 sampler ve terrain-pindex-quality-v2-runtime-2026-08-12-v2 shader/installer katmanını kaldır; Iteration #08 görünümüne dön. Height/physics migration gerekmez.' >> DECISIONS.md
          fi
          if ! grep -q 'PINDEX-QUALITY-V2-2026-08-12' 3D_GAME_PROGRESS.md; then
            printf '%s\n' '' '### PINDEX-QUALITY-V2-2026-08-12 — Canonical base-map quality pass' '' '- Canonical 96×64 mask SHA afe62a77fcc9b15887540b49b3b60b199e416f5e033aefb987a192411c25ae44 ve cell counts (sea=4046, lake=6, soil=1638, rock=323, snow=131) değişmedi.' '- P01..P10 continuous sub-cell sampling + seam-free profile interpolation eklendi; P10 kalite profilinde açıkça kapsanıyor.' '- Repodaki 17 audited biome zone + 4 relief chain kullanılıyor; yeni coğrafi source-of-truth uydurulmuyor.' '- Runtime 192×128 color/data GPU atlas + 64×64 deterministik repeat-noise atlas kullanıyor; V2 cpuVertexPassesAdded=0, terrain height ve Iteration #08 CPU color arrays birebir korunuyor.' '- İlk CPU-heavy V2 smoke timeout nedeniyle reddedildi; timeout artırılmadan shader-atlas mimarisine geçildi.' '- İlk sinüs mikro-grain görsel incelemede diyagonal bant nedeniyle reddedildi ve organic repeat-noise color+roughness grain ile değiştirildi.' '- Kanıt: P01..P10 coverage, normalized weights, seam continuity, biome anchors, Bone Mountains relief, exact height preservation, deterministic/idempotent WebGL, real pixel delta, Iteration #08 regression, full 3D smoke, mobile perf, seat/road safety, PWA ve clean console.' '- Rollback yalnız V2 sampler/shader katmanını kaldırarak Iteration #08 shipped terrain polish durumuna döner.' >> 3D_GAME_PROGRESS.md
          fi
          git diff --check
      - name: Commit records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DECISIONS.md 3D_GAME_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record pindex quality v2 architecture and RCA"
          git push origin HEAD:terrain/pindex-quality-v2-20260812
