name: settlement-action-intent-projection

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementActionIntentProjection.js'
      - 'scripts/checkSettlementActionIntentProjection.mjs'
      - '.github/workflows/settlement-action-intent-projection.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementActionIntentProjection.js
      - name: Regression
        run: node scripts/checkSettlementActionIntentProjection.mjs
      - name: Runtime/editor boundary
        run: |
          ! grep -nE "EditorMaterialStudio|document\\.|window\\.|THREE" src/3d/gameplay/settlementActionIntentProjection.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
