name: Run265 Editor Micro Scale V2

on:
  push:
    branches:
      - agent/run265-editor-micro-scale-current-main-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run265-editor-micro-scale-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting concurrency and additive-only gate
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$MAIN_SHA" HEAD
          git diff --check
      - name: Syntax and focused micro-scale contracts
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorScaleInputController.js
          node --check scripts/checkRun265EditorMicroScale.mjs
          node --check scripts/checkRun265EditorMicroScaleBrowser.js
          node scripts/checkRun216ScaleInputController.mjs
          node scripts/checkRun265EditorMicroScale.mjs
      - name: Lightweight PWA determinism and debt gates
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkTechnicalDebt.js
          node scripts/analyzePerfTrend.js
      - name: Install isolated Chromium tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Terrain and road safety after Chromium install
        run: |
          set -euo pipefail
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Real World Editor micro-scale browser proof
        run: node scripts/checkRun265EditorMicroScaleBrowser.js
      - name: Mobile performance full browser smoke and console gate
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js
      - name: Final remote-main concurrency and additive-only gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload micro-scale browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run265-editor-micro-scale-v2
          path: artifacts/run265-editor-micro-scale
          if-no-files-found: ignore
          retention-days: 14
