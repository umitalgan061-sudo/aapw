name: Geographic Fauna Texture Proof

on:
  pull_request:
    paths:
      - 'src/3d/world/geographicFaunaHabitatContract.js'
      - 'src/3d/world/geographicAssetDistributionContract.js'
      - 'scripts/checkGeographicFaunaTextureBrowser.mjs'
      - '.github/workflows/geographic-fauna-texture-proof.yml'
  push:
    branches:
      - 'agent/safak-kartali-geographic-ambient-assets-**'
    paths:
      - 'src/3d/world/geographicFaunaHabitatContract.js'
      - 'src/3d/world/geographicAssetDistributionContract.js'
      - 'scripts/checkGeographicFaunaTextureBrowser.mjs'
      - '.github/workflows/geographic-fauna-texture-proof.yml'

permissions:
  contents: read

jobs:
  geographic-fauna-texture-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Establish exact main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          BASE_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          echo "Exact base: $BASE_SHA"
          echo "Exact head: $HEAD_SHA"

      - name: Selectively hydrate horse wolf dragon assets
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/models/animals/white_horse_bEdE4rmZy9.glb,assets/models/animals/wolf/Wolf-Blender-2.82a.glb,assets/models/creatures/dragon/Dragon_Baked_Actions_fbx_7.4_binary.fbx,assets/models/creatures/dragon/textures/**" --exclude=""
          for file in \
            assets/models/animals/white_horse_bEdE4rmZy9.glb \
            assets/models/animals/wolf/Wolf-Blender-2.82a.glb \
            assets/models/creatures/dragon/Dragon_Baked_Actions_fbx_7.4_binary.fbx; do
            test -s "$file"
            ! head -c 96 "$file" | grep -q 'version https://git-lfs.github.com/spec'
          done

      - name: Install browser dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0 three
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run fauna texture proof
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkGeographicFaunaTextureBrowser.mjs

      - name: Upload fauna texture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geographic-fauna-texture-proof
          path: artifacts/geographic-fauna-texture/
          if-no-files-found: ignore
