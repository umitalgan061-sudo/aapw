name: R15 Strict TypeScript Core

on:
  pull_request:
    paths:
      - 'src/3d/config.ts'
      - 'src/3d/eventBus.ts'
      - 'src/3d/state.ts'
      - 'src/3d/gameplay/gameplayConfig.ts'
      - 'tests/modern/strictCoreR15.test.ts'
      - 'scripts/checkStrictCoreR15.mjs'
      - 'tsconfig.strict-core.json'
      - 'package.json'
      - '.github/workflows/r15-strict-core.yml'
  push:
    branches:
      - main
    paths:
      - 'src/3d/config.ts'
      - 'src/3d/eventBus.ts'
      - 'src/3d/state.ts'
      - 'src/3d/gameplay/gameplayConfig.ts'
      - 'tests/modern/strictCoreR15.test.ts'
      - 'scripts/checkStrictCoreR15.mjs'
      - 'tsconfig.strict-core.json'
      - 'package.json'
      - '.github/workflows/r15-strict-core.yml'

permissions:
  contents: read

concurrency:
  group: r15-strict-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify:strict-core
      - run: npm run typecheck:strict-core
      - run: npm run test:strict-core
