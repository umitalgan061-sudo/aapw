name: Village Footprint Grounding

on:
  pull_request:
    paths:
      - 'src/3d/world/villages.js'
      - 'src/3d/world/vegetation.js'
      - 'src/3d/world/terrain.js'
      - 'scripts/checkVillageFootprintGrounding.mjs'
      - 'scripts/setupNodeThreeShim.mjs'
      - '.github/workflows/village-footprint-grounding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  village-footprint-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs
      - name: Syntax
        run: |
          node --check src/3d/world/villages.js
          node --check scripts/checkVillageFootprintGrounding.mjs
      - name: Village footprint grounding contract
        run: node scripts/checkVillageFootprintGrounding.mjs
