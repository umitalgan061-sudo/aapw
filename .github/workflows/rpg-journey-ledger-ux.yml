name: RPG Journey Ledger UX

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionFieldReadiness.js'
      - 'src/3d/ui/dialogueBox.js'
      - 'scripts/checkInteractionJourneyLedgerUx.mjs'
      - 'scripts/checkInteractionTavernReceiptIntegrity.mjs'
      - 'scripts/checkInteractionExpeditionTavernRecovery.mjs'
      - 'scripts/checkInteractionMasteryTravelContinuityBrowser.mjs'
      - '.github/workflows/rpg-journey-history-current.yml'
      - '.github/workflows/rpg-journey-ledger-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-ledger-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD)
          allowed='^(\.github/workflows/(rpg-expedition-(credit-ledger|reward-provenance|tavern-recovery)|rpg-interaction-quest-loop|rpg-journey-(history-current|ledger-ux)|rpg-mastery-armorer-service|rpg-mastery-economy-continuity|rpg-mastery-journal-continuity|rpg-mastery-to-smithing|rpg-mastery-travel-continuity|rpg-smithing-service-persistence|rpg-tavern-receipt-integrity|run167-determinism-policy|run283-final-head-governance)\.yml|scripts/checkInteraction(ArmorerServiceBrowser|CreditSourceLedgerRestore|Expedition(Board|BoardBrowser|CreditLedger|Kit(Browser|Craft)|RewardProvenance|RewardTradeContinuity|TradeQuoteAtomicity)|MasteryEconomyContinuity|MasteryToSmithingBrowser|ProvisioningCraft|QuartermasterTrade|SettlementService(Browser|Contract)|SmithingServicePersistence|TradeLedger(Atomicity|Browser))\.mjs|service-worker\.js|src/3d/gameplay/(interaction|interactionConfig|interactionEconomy)\.js)$'
          if (( ${#paths[@]} )); then
            printf '%s\n' "${paths[@]}" | grep -Ev "$allowed" && exit 1 || true
          fi
          changed="$(git diff --numstat "$base"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 1000
      - name: Syntax and authoritative ledger regressions
        run: |
          set -euo pipefail
          node --check scripts/checkInteractionJourneyLedgerUx.mjs
          node --check scripts/checkInteractionExpeditionTavernRecovery.mjs
          node scripts/checkInteractionTavernReceiptIntegrity.mjs
          node scripts/checkInteractionJourneyLedgerUx.mjs
          node scripts/checkInteractionJourneyPlanning.mjs
          node scripts/checkInteractionExpeditionTavernRecovery.mjs
      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped-page Chromium travel continuity
        run: NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryTravelContinuityBrowser.mjs
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
