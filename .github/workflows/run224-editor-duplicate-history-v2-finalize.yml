name: Run 224 Editor Duplicate History V2 Finalize

on:
  push:
    branches:
      - agent/run224-editor-duplicate-history-v2
    paths:
      - '.github/workflows/run224-editor-duplicate-history-v2-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run224-editor-duplicate-history-v2-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun224EditorDuplicateHistoryV2.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run224 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 224 — World Editor duplicate/history regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies toolbar Çoğalt creates a deterministic marker-tree duplicate with preserved asset identity, generated `-duplicate-####` editor id and positive X offset.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- After Undo, explicit user re-selection plus Ctrl+D reproduces the exact same duplicate state; subsequent Undo creates one redo entry and Redo restores the duplicate exactly.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Duplicate operations remain isolated from Copy/Paste clipboard state; paste stays unavailable until a copy action and duplicate/history flow leaves clipboard null.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, deterministic world-reference/hydrology, terrain/road safety, technical-debt audit, full browser smoke, and final remote-main/additive-only gates PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: Run224 corrected workflow `31422849938` PASS. Earlier V1 proof assumptions were rejected without runtime changes; V2 is rebased on Run223 main. Next safe step: continue additive-only World Editor usability/regression coverage without crossing unresolved owner gates.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run224,2026-08-10,editor-duplicate-history' perf_log.csv; then
            printf 'run224,%s,editor-duplicate-history,,,,,,,"test-only duplicate/Ctrl+D/undo/redo regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run224 editor duplicate/history regression' STABLE_TAGS.md; then
            printf '%s — Run224 editor duplicate/history regression; toolbar/Ctrl+D deterministic duplicate parity, undo/redo and clipboard isolation verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run224 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run224): record editor duplicate-history checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run224-editor-duplicate-history-v2
          git push origin "$STABLE_TAG" || true
