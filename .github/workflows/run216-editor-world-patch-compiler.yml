name: Run216 Editor World Patch Compiler

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorWorldPatchCompiler.js'
      - 'scripts/checkRun216EditorWorldPatchCompiler.mjs'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-world-patch-compiler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-world-patch-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
      - name: Compiler syntax and behavior
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorWorldPatchCompiler.js
          node --check scripts/checkRun216EditorWorldPatchCompiler.mjs
          node scripts/checkRun216EditorWorldPatchCompiler.mjs
      - name: PWA materializer proof
        run: |
          set -euo pipefail
          node --check scripts/materializeRun216ServiceWorkerCache.js
          node --check scripts/checkRun216ServiceWorkerMaterializer.js
          node scripts/materializeRun216ServiceWorkerCache.js --self-test
          node scripts/checkRun216ServiceWorkerMaterializer.js
      - name: Final concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
