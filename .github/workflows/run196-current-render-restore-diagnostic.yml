name: Run 196 Current Render Restore Diagnostic

on:
  push:
    branches: [chatgpt/run196-current-runtime-integration-preflight]
    paths:
      - 'scripts/checkCurrentRuntimeRenderRestoreDiagnostics.js'
      - 'src/3d/world/worldReferenceCurrentRuntimeIntegrationShadow.js'
      - '.github/workflows/run196-current-render-restore-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 81434839250d72950d7fed70a5e6024d0411c6d3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Concurrency syntax and source-freeze gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node --check scripts/checkCurrentRuntimeRenderRestoreDiagnostics.js
          node --check src/3d/world/worldReferenceCurrentRuntimeIntegrationShadow.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git diff --quiet "$BASE_SHA" HEAD -- src/3d/game3d.js src/3d/sceneManager.js src/3d/world/chunkManager.js src/3d/input.js src/3d/physics.js src/3d/gameLoopHelpers.js src/3d/world/worldReferenceOptInMigrationControllerShadow.js

      - name: Focused real-current render restore diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCurrentRuntimeRenderRestoreDiagnostics.js

      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run196-current-render-restore-diagnostic
          path: artifacts/run196-current-runtime-render-restore/diagnostic.json
          if-no-files-found: warn
