name: Environment Runtime V68 Generator
on:
  push:
    branches:
      - buzul-muhafizi/next-settlement-environment-v68-20260915
    paths-ignore:
      - 'src/3d/world/environmentRuntimeSettlementV68Generated.js'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic settlement evidence runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/3d/world
          {
            echo "/** V68 generated deterministic settlement evidence catalog. */"
            echo "export const V68_GENERATED_POLICY=Object.freeze({version:68,deterministic:true,noWorldMutation:true});"
            echo "const clamp=v=>Math.max(0,Math.min(1,Number(v)||0));"
            echo "const domains=['signals','lighting','weather','safety','traffic','services','resources','navigation','shelter','activity','visibility','ground','ecology','exposure','culture','commerce','travel','incidents','comfort','maintenance'];"
            echo "export const V68_GENERATED_DOMAINS=Object.freeze(domains);"
            echo "export const V68_GENERATED_CATALOG=Object.freeze(["
            for domain in signals lighting weather safety traffic services resources navigation shelter activity visibility ground ecology exposure culture commerce travel incidents comfort maintenance; do
              for i in $(seq 1 205); do
                slot=$(( (i-1) % 24 ))
                value=$(awk -v i="$i" 'BEGIN{printf "%.2f", ((i*7)%101)/100}')
                pressure=$(awk -v i="$i" 'BEGIN{printf "%.2f", ((i*11)%101)/100}')
                risk=$(awk -v i="$i" 'BEGIN{printf "%.2f", ((i*13)%101)/100}')
                echo "  Object.freeze({id:'${domain}-${i}',domain:'${domain}',slot:${slot},value:${value},pressure:${pressure},risk:${risk}}),"
              done
            done
            echo "] );"
            echo "export function resolveGeneratedV68(index){const row=V68_GENERATED_CATALOG[Math.max(0,Math.min(V68_GENERATED_CATALOG.length-1,Number(index)||0))];return Object.freeze({...row,score:clamp(row.value*.55+(1-row.risk)*.3+(1-row.pressure)*.15)});}"
            echo "export function validateGeneratedV68(){const errors=[];if(V68_GENERATED_CATALOG.length!==4100)errors.push('count');for(const row of V68_GENERATED_CATALOG){if(row.value<0||row.value>1)errors.push('value');if(row.risk<0||row.risk>1)errors.push('risk');if(row.pressure<0||row.pressure>1)errors.push('pressure');}return Object.freeze({ok:errors.length===0,count:V68_GENERATED_CATALOG.length,errors});}"
            echo "export function summarizeGeneratedV68(){const sum=V68_GENERATED_CATALOG.reduce((a,x)=>a+x.value,0);const risk=V68_GENERATED_CATALOG.reduce((a,x)=>a+x.risk,0);return Object.freeze({count:V68_GENERATED_CATALOG.length,meanValue:sum/V68_GENERATED_CATALOG.length,meanRisk:risk/V68_GENERATED_CATALOG.length});}"
          } > src/3d/world/environmentRuntimeSettlementV68Generated.js
          node --check src/3d/world/environmentRuntimeSettlementV68Generated.js
          node --input-type=module <<'NODE'
          import {validateGeneratedV68} from './src/3d/world/environmentRuntimeSettlementV68Generated.js';
          const result=validateGeneratedV68();
          if(!result.ok||result.count!==4100) process.exit(1);
          console.log(JSON.stringify(result));
          NODE
      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/environmentRuntimeSettlementV68Generated.js
          if git diff --cached --quiet; then echo 'no generation change'; exit 0; fi
          git commit -m 'feat(world): generate v68 settlement evidence runtime'
          git push
