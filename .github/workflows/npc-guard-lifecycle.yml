name: NPC Guard Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardLifecycleContract.mjs'
      - 'scripts/checkNpcGuardLifecycleBrowser.js'
      - 'scripts/checkNpcGuardGroupLifecycleBrowser.js'
      - 'scripts/checkNpcGuardLifecycleFrameRateBrowser.js'
      - 'scripts/checkNpcGuardOcclusionLifecycleBrowser.js'
      - 'scripts/checkNpcGuardHearingLifecycleBrowser.js'
      - '.github/workflows/npc-guard-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 3000
          git diff --check "$BASE_SHA" HEAD
      - name: Guard lifecycle and regression contracts
        run: |
          set -euo pipefail
          node --check scripts/checkNpcGuardLifecycleContract.mjs
          node --check scripts/checkNpcGuardLifecycleBrowser.js
          node --check scripts/checkNpcGuardGroupLifecycleBrowser.js
          node --check scripts/checkNpcGuardLifecycleFrameRateBrowser.js
          node --check scripts/checkNpcGuardOcclusionLifecycleBrowser.js
          node --check scripts/checkNpcGuardHearingLifecycleBrowser.js
          node scripts/checkNpcGuardLifecycleContract.mjs
          node scripts/checkNpcGuardPerception.mjs
          node scripts/checkNpcGuardAttack.mjs
          node scripts/checkNpcGuardLeash.mjs
          node scripts/checkNpcGuardAssistLifecycle.mjs
          node scripts/checkNpcGuardAssistIsolation.mjs
          node scripts/checkNpcGuardAssistLodWake.mjs
          node scripts/checkNpcGuardAssistLodWakeStress.mjs
          node scripts/checkNpcSimulationLod.mjs
          node scripts/checkSeededRandomPolicy.js
      - name: Shared PWA regression gate
        id: shared_pwa
        continue-on-error: true
        run: node scripts/checkServiceWorkerCache.js
      - name: Shared material placement regression gate
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Install Chromium outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Prepare focused NPC browser docroot
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/npc-browser-root"
          rm -rf "$root"
          mkdir -p "$root"
          ln -s "$GITHUB_WORKSPACE/src" "$root/src"
          cat > "$root/game3d.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <script type="importmap">
          {"imports":{"three":"./src/3d/vendor/three/three.module.js","three/addons/":"./src/3d/vendor/three/addons/"}}
          </script>
          HTML
          echo "NPC_BROWSER_ROOT=$root" >> "$GITHUB_ENV"
      - name: Real shipped Three.js guard lifecycle proof
        id: lifecycle_browser
        continue-on-error: true
        run: cd "$NPC_BROWSER_ROOT" && node "$GITHUB_WORKSPACE/scripts/checkNpcGuardLifecycleBrowser.js"
      - name: Real shipped Three.js guard group proof
        run: cd "$NPC_BROWSER_ROOT" && node "$GITHUB_WORKSPACE/scripts/checkNpcGuardGroupLifecycleBrowser.js"
      - name: Real shipped Three.js guard frame-rate proof
        run: cd "$NPC_BROWSER_ROOT" && node "$GITHUB_WORKSPACE/scripts/checkNpcGuardLifecycleFrameRateBrowser.js"
      - name: Real shipped Three.js guard occlusion proof
        run: cd "$NPC_BROWSER_ROOT" && node "$GITHUB_WORKSPACE/scripts/checkNpcGuardOcclusionLifecycleBrowser.js"
      - name: Real shipped Three.js guard hearing proof
        run: cd "$NPC_BROWSER_ROOT" && node "$GITHUB_WORKSPACE/scripts/checkNpcGuardHearingLifecycleBrowser.js"
      - name: Final exact-main freshness
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Enforce diagnostic gates
        if: ${{ always() }}
        shell: bash
        run: |
          test "${{ steps.shared_pwa.outcome }}" = "success"
          test "${{ steps.lifecycle_browser.outcome }}" = "success"
