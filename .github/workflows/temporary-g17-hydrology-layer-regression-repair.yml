name: Temporary G17 Hydrology Layer Trigger Repair

on:
  push:
    branches:
      - ci/sw-g17-hydrology-layer-regression-20260813

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ci/sw-g17-hydrology-layer-regression-20260813
      - name: Remove generic SW claim from Hydrology path trigger and retire workflow
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('.github/workflows/sw-g17-terrain3d-hydrology.yml'); t=p.read_text(); old=\"      - 'godot/terrain-authoring/corner_claims/SW.json'\\n\"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old, ''))"
          git rm .github/workflows/temporary-g17-hydrology-layer-regression-repair.yml
          git diff --check
          test "$(grep -cF \"godot/terrain-authoring/corner_claims/SW.json\" .github/workflows/sw-g17-terrain3d-hydrology.yml)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sw-g17-terrain3d-hydrology.yml
          git commit -m 'ci: stop G17 hydrology from claiming later-layer PRs'
          git push origin HEAD:ci/sw-g17-hydrology-layer-regression-20260813
