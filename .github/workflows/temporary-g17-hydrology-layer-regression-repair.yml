name: Temporary G17 Hydrology Layer Trigger Repair

on:
  push:
    branches:
      - ci/sw-g17-hydrology-layer-regression-20260813

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ci/sw-g17-hydrology-layer-regression-20260813
      - name: Remove generic SW claim trigger and retire workflow
        run: |
          set -euo pipefail
          BEFORE="$(grep -cF \"godot/terrain-authoring/corner_claims/SW.json\" .github/workflows/sw-g17-terrain3d-hydrology.yml)"
          test "$BEFORE" -eq 2
          sed -i "/^      - 'godot\/terrain-authoring\/corner_claims\/SW.json'$/d" .github/workflows/sw-g17-terrain3d-hydrology.yml
          AFTER="$(grep -cF \"godot/terrain-authoring/corner_claims/SW.json\" .github/workflows/sw-g17-terrain3d-hydrology.yml)"
          test "$AFTER" -eq 1
          git rm .github/workflows/temporary-g17-hydrology-layer-regression-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sw-g17-terrain3d-hydrology.yml
          git commit -m 'ci: stop G17 hydrology from claiming later-layer PRs'
          git push origin HEAD:ci/sw-g17-hydrology-layer-regression-20260813
