name: nextgen-runtime-v3

on:
  pull_request:
    paths:
      - 'src/3d/nextgen/**'
      - 'tests/nextgen/**'
      - 'scripts/checkNextGenRuntimeV3.mjs'
      - 'package.json'
      - 'tsconfig.nextgen.json'
      - '.github/workflows/nextgen-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/nextgen/**'
      - 'tests/nextgen/**'
      - 'scripts/checkNextGenRuntimeV3.mjs'
      - 'package.json'
      - 'tsconfig.nextgen.json'
      - '.github/workflows/nextgen-runtime.yml'

permissions:
  contents: read

concurrency:
  group: nextgen-runtime-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify:nextgen:v3
      - run: npm run typecheck:nextgen
      - run: npm test -- tests/nextgen --passWithNoTests

  deterministic-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reject unsafe or ambient nondeterminism in nextgen
        run: |
          set -eu
          if grep -R -nE '\beval\s*\(|\bnew Function\s*\(|\bDate\.now\s*\(' src/3d/nextgen; then
            echo 'Unsafe or wall-clock primitive detected in nextgen runtime.'
            exit 1
          fi
          if grep -R -nE 'Math\.random\s*\(' src/3d/nextgen; then
            echo 'Ambient randomness detected in nextgen runtime.'
            exit 1
          fi
