name: RPG Mastery To Smithing

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'scripts/checkInteractionArmorerServiceBrowser.mjs'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionBoardBrowser.mjs'
      - 'scripts/checkInteractionExpeditionMasterySmithingReward.mjs'
      - 'scripts/checkInteractionExpeditionKitCraft.mjs'
      - 'scripts/checkInteractionExpeditionTavernRecovery.mjs'
      - 'scripts/checkInteractionExpeditionRewardProvenance.mjs'
      - 'scripts/checkInteractionExpeditionRewardTradeContinuity.mjs'
      - 'scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs'
      - 'scripts/checkInteractionMasteryToSmithingBrowser.mjs'
      - 'scripts/checkInteractionProvisioningCraft.mjs'
      - 'scripts/checkInteractionQuartermasterTrade.mjs'
      - 'scripts/checkInteractionSettlementServiceBrowser.mjs'
      - 'scripts/checkInteractionSettlementServiceContract.mjs'
      - 'scripts/checkInteractionTradeLedgerAtomicity.mjs'
      - '.github/workflows/rpg-expedition-credit-ledger.yml'
      - '.github/workflows/rpg-expedition-reward-provenance.yml'
      - '.github/workflows/rpg-mastery-economy-continuity.yml'
      - '.github/workflows/rpg-mastery-to-smithing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mastery-to-smithing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main ancestry, bounded scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base=$(git merge-base HEAD origin/main)
          test "$base" = "$(git rev-parse origin/main)"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD)
          allowed='^(scripts/checkInteractionExpedition(Board(Browser)?|Kit(Browser|Craft)|TavernRecovery|RewardProvenance|RewardTradeContinuity|TradeQuoteAtomicity)\.mjs|scripts/checkInteractionMastery(ToSmithingBrowser|EconomyContinuity|ArmorerServiceBrowser)\.mjs|scripts/checkInteractionSmithingServicePersistence\.mjs|scripts/checkInteraction(ArmorerServiceBrowser|ProvisioningCraft|QuartermasterTrade|SettlementService(Browser|Contract)|TradeLedger(Atomicity|Browser))\.mjs|scripts/checkInteractionTavernReceiptIntegrity\.mjs|\.github/workflows/(rpg-expedition-credit-ledger|rpg-expedition-reward-provenance|rpg-expedition-tavern-recovery|rpg-interaction-quest-loop|rpg-journey-ledger-ux|rpg-mastery-armorer-service|rpg-mastery-economy-continuity|rpg-mastery-journal-continuity|rpg-mastery-to-smithing|rpg-mastery-travel-continuity|rpg-smithing-service-persistence|rpg-tavern-receipt-integrity|run283-final-head-governance)\.yml|src/3d/gameplay/(interaction|interactionConfig|interactionEconomy)\.js)$'
          for path in "${paths[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected path: $path"; exit 1; }
          done
          changed=$(git diff --numstat "$base"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 1000
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check scripts/checkInteractionExpeditionBoard.mjs
          node --check scripts/checkInteractionExpeditionBoardBrowser.mjs
          node --check scripts/checkInteractionExpeditionKitCraft.mjs
          node --check scripts/checkInteractionExpeditionTavernRecovery.mjs
          node --check scripts/checkInteractionMasteryToSmithingBrowser.mjs
          node --check scripts/checkInteractionProvisioningCraft.mjs
          node --check scripts/checkInteractionQuartermasterTrade.mjs
          node --check scripts/checkInteractionSettlementServiceBrowser.mjs
          node --check scripts/checkInteractionSettlementServiceContract.mjs
          node --check scripts/checkInteractionTradeLedgerAtomicity.mjs
      - name: Expedition mastery smithing reward contract
        run: node scripts/checkInteractionExpeditionMasterySmithingReward.mjs
      - name: Expedition kit craft contract
        run: node scripts/checkInteractionExpeditionKitCraft.mjs
      - name: Provisioning craft contract
        run: node scripts/checkInteractionProvisioningCraft.mjs
      - name: Quartermaster trade contract
        run: node scripts/checkInteractionQuartermasterTrade.mjs
      - name: Settlement service contract
        run: node scripts/checkInteractionSettlementServiceContract.mjs
      - name: Trade ledger atomicity contract
        run: node scripts/checkInteractionTradeLedgerAtomicity.mjs
      - name: Expedition tavern recovery contract
        run: node scripts/checkInteractionExpeditionTavernRecovery.mjs
      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped-page mastery to smithing and settlement service proof
        run: |
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionSettlementServiceBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryToSmithingBrowser.mjs
      - name: Shared material placement boundary
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
