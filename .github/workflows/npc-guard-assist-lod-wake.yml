name: NPC Guard Assist LOD Wake

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardAssistLodWake.mjs'
      - 'scripts/checkNpcGuardAssistLodWakeStress.mjs'
      - 'scripts/checkNpcGuardAssistLodWakeBrowser.js'
      - 'scripts/checkNpcGuardAssistLifecycle.mjs'
      - 'scripts/checkNpcGuardAssistIsolation.mjs'
      - 'scripts/checkNpcSimulationLod.mjs'
      - '.github/workflows/npc-guard-assist-lod-wake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 1000
          git diff --check "$BASE_SHA" HEAD
      - name: Guard assist and population LOD regressions
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/npc.js
          node --check scripts/checkNpcGuardAssistLodWake.mjs
          node --check scripts/checkNpcGuardAssistLodWakeStress.mjs
          node --check scripts/checkNpcGuardAssistLodWakeBrowser.js
          node scripts/checkNpcGuardAssistLodWake.mjs
          node scripts/checkNpcGuardAssistLodWakeStress.mjs
          node scripts/checkNpcGuardAssistLifecycle.mjs
          node scripts/checkNpcGuardAssistIsolation.mjs
          node scripts/checkNpcSimulationLod.mjs
          node scripts/checkNpcGuardPerception.mjs
          node scripts/checkNpcGuardAttack.mjs
          node scripts/checkNpcGuardLeash.mjs
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSharedMaterialPlacementContract.js
      - name: Install Chromium outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Real shipped Three.js assist-aware LOD proof
        run: node scripts/checkNpcGuardAssistLodWakeBrowser.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
