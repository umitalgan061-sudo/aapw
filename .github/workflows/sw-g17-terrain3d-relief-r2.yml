name: SW G17 Terrain3D Relief R2
on:
  push:
    branches: [agent/gunbatimi-ustasi-g17-relief-r2-20260813]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/checkSWG17ReliefTerrain3DProbe.mjs'
      - 'godot/terrain-authoring/scripts/validate_g17_terrain3d_relief.gd'
      - '.github/workflows/sw-g17-terrain3d-relief-r2.yml'
permissions: { contents: read }
concurrency:
  group: sw-g17-relief-r2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(scripts/checkSWG17ReliefTerrain3DProbe.mjs|godot/terrain-authoring/scripts/validate_g17_terrain3d_relief.gd|\.github/workflows/sw-g17-terrain3d-relief-r2.yml)$' | wc -l)" -eq 0
          ADDS="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1} END{print s+0}')"
          test "$ADDS" -le 500
      - name: Prior layers and deterministic relief probe
        run: |
          set -euo pipefail
          node scripts/checkSWG17Hydrology.mjs
          node scripts/checkSWG17Biome.mjs
          node scripts/checkSWG17Relief.mjs
          node --check scripts/checkSWG17ReliefTerrain3DProbe.mjs
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          node scripts/checkSWG17ReliefTerrain3DProbe.mjs --out=godot/terrain-authoring/.terrain3d-proof/g17-relief-probe.json | tee /tmp/g17-a.log
          cp godot/terrain-authoring/.terrain3d-proof/g17-relief-probe.json /tmp/g17-a.json
          node scripts/checkSWG17ReliefTerrain3DProbe.mjs --out=godot/terrain-authoring/.terrain3d-proof/g17-relief-probe.json | tee /tmp/g17-b.log
          cmp /tmp/g17-a.log /tmp/g17-b.log
          cmp /tmp/g17-a.json godot/terrain-authoring/.terrain3d-proof/g17-relief-probe.json
      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          ok=0
          for n in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee /tmp/t3d-install.log; then ok=1; break; fi
            sleep $((n*3))
          done
          test "$ok" -eq 1
          grep -F 'TERRAIN3D_INSTALL_OK' /tmp/t3d-install.log
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee /tmp/t3d-verify.log
          grep -F 'TERRAIN3D_VERIFY_OK version=1.0.2 enabled=true' /tmp/t3d-verify.log
      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o /tmp/godot.zip
          mkdir -p /tmp/godot && unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Real Terrain3D import seam persist and LOD0 twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 | tee /tmp/editor.log
          ! grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' /tmp/editor.log
          G17_RELIEF_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g17_terrain3d_relief.gd | tee /tmp/t3d-a.log
          cp godot/terrain-authoring/.terrain3d-proof/g17-relief-imported-topdown.png /tmp/g17-a.png
          G17_RELIEF_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g17_terrain3d_relief.gd | tee /tmp/t3d-b.log
          cp godot/terrain-authoring/.terrain3d-proof/g17-relief-imported-topdown.png /tmp/g17-b.png
          grep -F 'SW_G17_TERRAIN3D_RELIEF_VALIDATION_OK' /tmp/t3d-a.log
          grep -F 'SW_G17_TERRAIN3D_RELIEF_VALIDATION_OK' /tmp/t3d-b.log
          cmp /tmp/g17-a.png /tmp/g17-b.png
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee /tmp/hterrain.log
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' /tmp/hterrain.log
      - name: Safety and browser regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-save --no-package-lock playwright@1.55.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          export NODE_PATH=/tmp/pw/node_modules
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js
          node scripts/checkSWG17HydrologyVisualEvidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-g17-relief-r2-proof
          include-hidden-files: true
          path: |
            godot/terrain-authoring/.terrain3d-proof/
            /tmp/g17-a.png
            /tmp/g17-b.png
            /tmp/t3d-a.log
            /tmp/t3d-b.log
      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
