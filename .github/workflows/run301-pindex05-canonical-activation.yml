name: Run 301 Pindex05 Canonical Activation

on:
  push:
    branches: [run301-pindex05-canonical-activation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run301-pindex05-canonical-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  BASE_SHA: 419105a1db381e7bf95bbc33deaeb5234ed339e8
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact-main additive entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- src/3d service-worker.js game3d.html godot/terrain-authoring)"

      - name: Pindex05 activation and governance contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run201CanonicalDevBoot.mjs
          node --check scripts/checkRun301Pindex05CanonicalActivation.js
          node --check scripts/checkRun301Pindex05CanonicalBrowser.js
          node scripts/checkRun301Pindex05CanonicalActivation.js
          node scripts/checkRun290Pindex05Detail.js
          node scripts/checkRun284PindexDetailChain.js
          node scripts/checkRun300LegacyPrScopeGate.js
          node scripts/checkRun283FinalHeadGovernance.js
          node scripts/checkCheckpointConsistency.js
          node scripts/checkRun280OwnerMapSemanticFingerprint.js
          node scripts/checkRun276MapSurfacePindexes.js

      - name: PWA world-reference determinism contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Canonical online offline performance and full browser DoD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkRun301Pindex05CanonicalBrowser.js
          test -s artifacts/run301-pindex05-canonical/proof.json
          test -s artifacts/run301-pindex05-canonical/pindex05-canonical-online.png
          test -s artifacts/run301-pindex05-canonical/pindex05-canonical-offline.png
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run301-mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run301-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run301-smoke.log")" -ge 34

      - name: Upload canonical proof
        uses: actions/upload-artifact@v4
        with:
          name: run301-pindex05-canonical-proof
          path: artifacts/run301-pindex05-canonical/
          if-no-files-found: error
          retention-days: 14

      - name: Final exact-main concurrency and additive-only gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- src/3d service-worker.js game3d.html godot/terrain-authoring)"
