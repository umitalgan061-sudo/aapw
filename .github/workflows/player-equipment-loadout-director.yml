name: player-equipment-loadout-director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentLoadoutDirector.js'
      - 'scripts/checkPlayerEquipmentLoadoutDirector.mjs'
      - '.github/workflows/player-equipment-loadout-director.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Fx 'src/3d/gameplay/playerEquipmentLoadoutDirector.js'
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Fx 'scripts/checkPlayerEquipmentLoadoutDirector.mjs'
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Fx '.github/workflows/player-equipment-loadout-director.yml'
          test "$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | wc -l)" -eq 3
          test "$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerEquipmentLoadoutDirector.js && node --check scripts/checkPlayerEquipmentLoadoutDirector.mjs
      - name: Execute regression
        run: node scripts/checkPlayerEquipmentLoadoutDirector.mjs
      - name: Runtime/editor boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" -n src/3d/gameplay/playerEquipmentLoadoutDirector.js scripts/checkPlayerEquipmentLoadoutDirector.mjs
