name: Full World Coverage Director
on:
  pull_request:
    branches: [main]
    paths:
      - src/3d/world/fullWorldCoverageDirector.js
      - scripts/checkFullWorldCoverageDirector.mjs
      - scripts/checkFullWorldCoverageDirectorScenarios.mjs
      - scripts/checkFullWorldRuntimeCoverage.mjs
      - scripts/checkFullWorldCoverageDirectorOwnership.mjs
      - .github/workflows/full-world-coverage-director.yml
  push:
    branches: [codex/world-coverage-complete-v1-20260910]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-world-coverage-director-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact main, scope, syntax and ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          for path in "${CHANGED[@]}"; do case "$path" in src/3d/world/fullWorldCoverageDirector.js|scripts/checkFullWorldCoverageDirector.mjs|scripts/checkFullWorldCoverageDirectorScenarios.mjs|scripts/checkFullWorldRuntimeCoverage.mjs|scripts/checkFullWorldCoverageDirectorOwnership.mjs|.github/workflows/full-world-coverage-director.yml) ;; *) echo "UNAUTHORIZED_CHANGED_PATH=$path"; exit 1 ;; esac; done
          additions="$(git diff --numstat origin/main...HEAD | awk '{s+=$1} END{print s+0}')"
          deletions="$(git diff --numstat origin/main...HEAD | awk '{s+=$2} END{print s+0}')"
          test $((additions + deletions)) -le 3000
          node --check src/3d/world/fullWorldCoverageDirector.js
          node --check scripts/checkFullWorldCoverageDirector.mjs
          node --check scripts/checkFullWorldCoverageDirectorScenarios.mjs
          node --check scripts/checkFullWorldRuntimeCoverage.mjs
          node --check scripts/checkFullWorldCoverageDirectorOwnership.mjs
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          grep -F "Shared, DOM-free material pipeline" src/3d/materials/MaterialAssignmentCore.js
          grep -F "autoAssignMaterials" src/3d/world/WorldAssetPlacementPipeline.js
          if grep -n "EditorMaterialStudio" src/3d/world/fullWorldCoverageDirector.js scripts/checkFullWorldCoverageDirector.mjs scripts/checkFullWorldCoverageDirectorScenarios.mjs scripts/checkFullWorldRuntimeCoverage.mjs scripts/checkFullWorldCoverageDirectorOwnership.mjs; then exit 1; fi
          ! grep -nE "new (THREE\.)?(BoxGeometry|SphereGeometry|CylinderGeometry|CapsuleGeometry)|MeshBasicMaterial|PlaneGeometry" src/3d/world/fullWorldCoverageDirector.js scripts/checkFullWorldCoverageDirector.mjs scripts/checkFullWorldCoverageDirectorScenarios.mjs scripts/checkFullWorldCoverageDirectorOwnership.mjs
          grep -F "mutatesCanonicalGeography: false" src/3d/world/fullWorldCoverageDirector.js
  executable-contracts:
    needs: exact-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Coverage director regression
        run: node scripts/checkFullWorldCoverageDirector.mjs
      - name: Scenario matrix regression
        run: node scripts/checkFullWorldCoverageDirectorScenarios.mjs
      - name: Existing runtime coverage regression
        run: node scripts/checkFullWorldRuntimeCoverage.mjs
      - name: Ownership and shared contract regression
        run: node scripts/checkFullWorldCoverageDirectorOwnership.mjs
      - name: Run283 governance contract regression
        run: node scripts/checkRun283FinalHeadGovernance.js
      - name: Deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          a="$(node scripts/checkFullWorldCoverageDirector.mjs)"; b="$(node scripts/checkFullWorldCoverageDirector.mjs)"; test "$a" = "$b"; echo "$a"
          a="$(node scripts/checkFullWorldCoverageDirectorScenarios.mjs)"; b="$(node scripts/checkFullWorldCoverageDirectorScenarios.mjs)"; test "$a" = "$b"; echo "$a"
          a="$(node scripts/checkFullWorldCoverageDirectorOwnership.mjs)"; b="$(node scripts/checkFullWorldCoverageDirectorOwnership.mjs)"; test "$a" = "$b"; echo "$a"
  browser-and-assets:
    needs: executable-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install runtime and Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts three@0.180.0
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Selective model-family LFS hydration
        shell: bash
        run: git lfs pull --include="assets/models/settlements/castles/**,assets/models/characters/**,assets/animations/peasant_girl/**,assets/models/animals/**,assets/models/creatures/dragon/**" --exclude=""
      - name: Shipped createScene browser parity
        run: NODE_PATH="$NODE_PATH" node scripts/checkFullWorldRuntimeBrowser.mjs
  governance:
    needs: [exact-scope, executable-contracts, browser-and-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: false }
      - name: Run283 contract is present
        run: node scripts/checkRun283FinalHeadGovernance.js
      - name: Singular shared material authority
        shell: bash
        run: |
          set -euo pipefail
          test -f src/3d/materials/MaterialAssignmentCore.js
          test -f src/3d/world/WorldAssetPlacementPipeline.js
          grep -F "Shared, DOM-free material pipeline" src/3d/materials/MaterialAssignmentCore.js
          grep -F "autoAssignMaterials" src/3d/world/WorldAssetPlacementPipeline.js
          test "$(git grep -l "EditorMaterialStudio" -- src/3d/world/fullWorldCoverageDirector.js scripts/checkFullWorldCoverageDirector.mjs scripts/checkFullWorldCoverageDirectorScenarios.mjs scripts/checkFullWorldRuntimeCoverage.mjs scripts/checkFullWorldCoverageDirectorOwnership.mjs | wc -l)" -eq 0
      - name: Manifest policy
        run: node --input-type=module -e "import {createSyntheticCoveragePlan,createFullWorldCoverageManifest} from './src/3d/world/fullWorldCoverageDirector.js'; const m=createFullWorldCoverageManifest(createSyntheticCoveragePlan()); if(m.cellCount!==1008||m.unassessedRatio!==0||m.validation.errors.length) throw new Error(JSON.stringify(m.validation.errors)); console.log(JSON.stringify({cells:m.cellCount,probes:m.probeCount,digest:m.deterministicDigest}));"
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          MAIN="$(git rev-parse origin/main)"
          HEAD="$(git rev-parse HEAD)"
          test "$(git merge-base HEAD origin/main)" = "$MAIN"
          git diff --check origin/main...HEAD
          echo "FULL_WORLD_COVERAGE_FRESH main=$MAIN head=$HEAD"
