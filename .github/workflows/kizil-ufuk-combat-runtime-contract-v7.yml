name: Kızıl Ufuk Combat Runtime Contract v7

on:
  push:
    branches: ['main', 'agent/kizil-ufuk-combat-runtime-contract-v7-20260917-r1']
  pull_request:
    branches: ['main']
    paths:
      - 'src/3d/gameplay/playerCombatDecisionV6.ts'
      - 'src/3d/gameplay/playerCombatRuntimeContractV7.ts'
      - 'scripts/checkPlayerCombatRuntimeContractV7.mjs'
      - '.github/tsconfig.kizil-ufuk-combat-runtime-v7.json'
      - '.github/workflows/kizil-ufuk-combat-runtime-contract-v7.yml'

permissions:
  contents: read

concurrency:
  group: kizil-ufuk-combat-runtime-contract-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install --no-audit --no-fund
      - name: Exact main ancestry
        run: git fetch origin main --no-tags && git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - name: Changed-line cap
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: Authored-slice TypeScript
        run: npx tsc -p .github/tsconfig.kizil-ufuk-combat-runtime-v7.json --noEmit --pretty false
      - name: Runtime contract proof
        run: node --experimental-strip-types scripts/checkPlayerCombatRuntimeContractV7.mjs
