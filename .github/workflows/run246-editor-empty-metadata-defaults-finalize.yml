name: Run 246 Editor Empty Metadata Defaults Finalize

on:
  push:
    branches:
      - agent/run246-editor-empty-metadata-defaults
    paths:
      - '.github/workflows/run246-editor-empty-metadata-defaults-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run246-editor-empty-metadata-defaults-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main, syntax and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun246EditorEmptyMetadataDefaults.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run246 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 246 — World Editor empty editor-metadata composed defaults regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies a valid schema-v1 scene with explicit empty `editor: {}` metadata loads exact object identity/name/asset and transform data without changing runtime/product source.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Empty optional editor metadata composes to snap defaults (`enabled=true`, size `1`), selection clears, history remains stable, success toast completes, and browser console/page errors remain zero.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Owner live-grid policy remains authoritative after load: Grid stays unchecked, disabled and hidden in the composed editor surface.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, seeded determinism, world-reference/hydrology, terrain/road safety, performance trend, technical-debt audit, full browser smoke, final remote-main concurrency/additive gates, visual artifact upload and World Event Determinism Guard PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/docs/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: Run246 workflow `31452233990` PASS and World Event Determinism Guard `31452233955` PASS. Next safe step: re-read current main and active branches; continue only a distinct, unclaimed World Editor compatibility edge case.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run246,' perf_log.csv; then
            printf 'run246,%s,editor-empty-metadata-defaults,,,,,,,"test-only valid scene editor:{} composed defaults regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run246 editor empty-metadata composed defaults regression' STABLE_TAGS.md; then
            printf '%s — Run246 editor empty-metadata composed defaults regression; valid scene preserves exact object data and default snap state while owner live-grid policy remains hidden/disabled; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run246 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run246): record empty-metadata checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run246-editor-empty-metadata-defaults
          git push origin "$STABLE_TAG" || true
