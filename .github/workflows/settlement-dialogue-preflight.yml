name: settlement-dialogue-preflight
on:
  push:
    branches: ["agent/gunbatimi-settlement-dialogue-preflight-20260909"]
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementDialoguePreflight.js'
      - 'scripts/checkSettlementDialoguePreflight.mjs'
      - '.github/workflows/settlement-dialogue-preflight.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/3d/gameplay/settlementDialoguePreflight.js
      - run: node --check scripts/checkSettlementDialoguePreflight.mjs
      - run: node scripts/checkSettlementDialoguePreflight.mjs
      - name: Scope guard
        run: |
          test "$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')" -eq 3
          git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END { if (a+d > 3000) exit 1; if (d != 0) exit 1 }'
          ! git diff origin/main...HEAD -- . ':!src/3d/gameplay/settlementDialoguePreflight.js' ':!scripts/checkSettlementDialoguePreflight.mjs' ':!.github/workflows/settlement-dialogue-preflight.yml' | grep -E 'EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline|terrain.js|water.js|sceneManager.js'