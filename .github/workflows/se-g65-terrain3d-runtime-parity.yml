name: SE G65 Terrain3D Runtime Parity

on:
  push:
    branches:
      - agent/kizil-ufuk-g65-runtime-parity-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'src/3d/world/worldReferenceTerrainAdapter.js'
      - 'scripts/checkSEG65Terrain3DRuntimeParity.mjs'
      - 'godot/terrain-authoring/scripts/validate_g65_terrain3d_runtime_parity.gd'
      - '.github/workflows/se-g65-terrain3d-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g65-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test -n "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/worldReferenceTerrainAdapter.js|scripts/checkSEG65Terrain3DRuntimeParity.mjs|godot/terrain-authoring/scripts/validate_g65_terrain3d_runtime_parity.gd|\.github/workflows/se-g65-terrain3d-runtime-parity.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_near_detail.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_road_path.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/terrain.js
          git diff --quiet "$BASE_SHA"...HEAD -- service-worker.js

      - name: Capture deterministic G65 authored source twice
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceTerrainAdapter.js
          node --check scripts/checkSEG65Terrain3DRuntimeParity.mjs
          node scripts/checkSEG65NearDetail.mjs | tee "$RUNNER_TEMP/near-detail.log"
          grep -F 'SE_G65_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/near-detail.log"
          node scripts/checkSEG65Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-runtime-source.json "$RUNNER_TEMP/source-a.json"
          node scripts/checkSEG65Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-runtime-source.json "$RUNNER_TEMP/source-b.json"
          cmp "$RUNNER_TEMP/source-a.log" "$RUNNER_TEMP/source-b.log"
          cmp "$RUNNER_TEMP/source-a.json" "$RUNNER_TEMP/source-b.json"
          grep -F 'SE_G65_RUNTIME_PARITY_SOURCE_OK' "$RUNNER_TEMP/source-a.log"

      - name: Install pinned Terrain3D and preserve HTerrain
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.godot.before-terrain3d"
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          grep -F 'res://addons/zylann.hterrain/plugin.cfg' godot/terrain-authoring/project.godot

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real 257 guard Terrain3D bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/t3d-editor.log"
          if grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/t3d-editor.log"; then exit 1; fi
          G65_RUNTIME_PARITY_PROOF_SUFFIX=a timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_runtime_parity.gd 2>&1 | tee "$RUNNER_TEMP/bake-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-runtime-bake.json "$RUNNER_TEMP/bake-a.json"
          cp godot/terrain-authoring/.terrain3d-proof/g65-runtime-bake-topdown.png "$RUNNER_TEMP/bake-a.png"
          G65_RUNTIME_PARITY_PROOF_SUFFIX=b timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_runtime_parity.gd 2>&1 | tee "$RUNNER_TEMP/bake-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-runtime-bake.json "$RUNNER_TEMP/bake-b.json"
          cp godot/terrain-authoring/.terrain3d-proof/g65-runtime-bake-topdown.png "$RUNNER_TEMP/bake-b.png"
          grep -F 'SE_G65_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake-a.log"
          grep -F 'SE_G65_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake-b.log"
          jq -S 'del(.savedRegionBytes)' "$RUNNER_TEMP/bake-a.json" > "$RUNNER_TEMP/bake-a-canonical.json"
          jq -S 'del(.savedRegionBytes)' "$RUNNER_TEMP/bake-b.json" > "$RUNNER_TEMP/bake-b-canonical.json"
          cmp "$RUNNER_TEMP/bake-a-canonical.json" "$RUNNER_TEMP/bake-b-canonical.json"
          cmp "$RUNNER_TEMP/bake-a.png" "$RUNNER_TEMP/bake-b.png"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Verify Terrain3D bake in real Three.js world coordinates
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65Terrain3DRuntimeParity.mjs --verify | tee "$RUNNER_TEMP/runtime.log"
          grep -F 'SE_G65_TERRAIN3D_RUNTIME_PARITY_OK' "$RUNNER_TEMP/runtime.log"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65NearDetailVisual.mjs --out-dir=artifacts/se-g65-runtime-parity-visual | tee "$RUNNER_TEMP/visual.log"
          grep -F 'SE_G65_NEAR_DETAIL_VISUAL_OK' "$RUNNER_TEMP/visual.log"

      - name: HTerrain regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"

      - name: World road and deterministic regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js

      - name: PWA installability regression
        run: |
          set -euo pipefail
          node scripts/checkPwaInstallability.js

      - name: Service-worker cache regression
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js

      - name: Technical-debt regression
        run: |
          set -euo pipefail
          node scripts/checkTechnicalDebt.js

      - name: Mobile performance regression
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkMobilePerfBudget.js

      - name: Browser smoke regression
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/smokeTestGame3D.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - name: Restore authoring bootstrap mutations
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/project.godot.before-terrain3d"; then cp "$RUNNER_TEMP/project.godot.before-terrain3d" godot/terrain-authoring/project.godot; fi
          rm -rf godot/terrain-authoring/addons/terrain_3d
          git restore --worktree -- godot/terrain-authoring/addons/zylann.hterrain
          git clean -fdx -- godot/terrain-authoring/terrain_data
          git diff --exit-code -- godot/terrain-authoring/project.godot
          git diff --exit-code -- godot/terrain-authoring/addons/zylann.hterrain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g65-terrain3d-runtime-parity-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g65-runtime-source.json
            godot/terrain-authoring/.terrain3d-proof/g65-runtime-bake.json
            godot/terrain-authoring/.terrain3d-proof/g65-runtime-bake-topdown.png
            artifacts/se-g65-runtime-parity-visual/g65-near.png
            artifacts/se-g65-runtime-parity-visual/g65-far.png
            artifacts/se-g65-runtime-parity-visual/g65-full-world-topdown.png
            ${{ runner.temp }}/runtime.log
            ${{ runner.temp }}/bake-a.log
            ${{ runner.temp }}/bake-b.log
            ${{ runner.temp }}/hterrain.log
