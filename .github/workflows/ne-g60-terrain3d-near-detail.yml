name: NE G60 Terrain3D Near Detail
on:
  push: { branches: ['terrain/ne-g60-terrain3d-near-detail-r*-exact-*-20260815'] }
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ne-g60-terrain3d-near-detail.yml
      - godot/terrain-authoring/geocells/ne/g60_near_detail.mjs
      - godot/terrain-authoring/scripts/validate_g60_terrain3d_near_detail.gd
      - scripts/checkNEG60NearDetail.mjs
      - scripts/checkNEG60NearDetailEnvelope.mjs
      - scripts/checkNEG60NearDetailPreflight.mjs
      - scripts/checkNEG60NearDetailLod.mjs
      - scripts/checkNEG60NearDetailVisualEvidence.mjs
      - scripts/checkNEG60NearDetailEvidenceBundle.mjs
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'ne-g60-near-detail-${{ github.head_ref || github.ref_name }}', cancel-in-progress: true }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true, ref: '${{ github.event.pull_request.head.sha || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact-main nine-file scope quota and prior layers
        run: |
          set -euo pipefail
          git lfs fsck
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"; echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"; echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(\.github/workflows/ne-g60-terrain3d-near-detail.yml|godot/terrain-authoring/geocells/ne/g60_near_detail.mjs|godot/terrain-authoring/scripts/validate_g60_terrain3d_near_detail.gd|scripts/checkNEG60NearDetail.mjs|scripts/checkNEG60NearDetailEnvelope.mjs|scripts/checkNEG60NearDetailPreflight.mjs|scripts/checkNEG60NearDetailLod.mjs|scripts/checkNEG60NearDetailVisualEvidence.mjs|scripts/checkNEG60NearDetailEvidenceBundle.mjs)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 9
          A="$(git diff --numstat "$BASE_SHA"...HEAD|awk '{s+=$1}END{print s+0}')"; D="$(git diff --numstat "$BASE_SHA"...HEAD|awk '{s+=$2}END{print s+0}')"
          echo "G60_NEAR_DETAIL_CHANGED_LINES=$((A+D))"; test $((A+D)) -le 1000
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py addons/zylann.hterrain src/3d/world/terrain.js src/3d/world/roads.js src/3d/world/vegetation.js godot/terrain-authoring/corner_claims/NE.json
          node scripts/checkNEG60Hydrology.mjs
          node scripts/checkNEG60Terrain3DBiome.mjs
          node scripts/checkNEG60Relief.mjs
          node scripts/checkNEG60RockSnow.mjs
          for f in godot/terrain-authoring/geocells/ne/g60_near_detail.mjs scripts/checkNEG60NearDetail.mjs scripts/checkNEG60NearDetailEnvelope.mjs scripts/checkNEG60NearDetailPreflight.mjs scripts/checkNEG60NearDetailLod.mjs scripts/checkNEG60NearDetailVisualEvidence.mjs scripts/checkNEG60NearDetailEvidenceBundle.mjs; do node --check "$f"; done

      - name: Chromium prior Road Path and deterministic Near Detail
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"; npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNEG60RoadPath.mjs | tee /tmp/road.log
          grep -F NE_G60_ROAD_PATH_VALIDATION_OK /tmp/road.log
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          PROOF=godot/terrain-authoring/.terrain3d-proof/g60-near-detail-probe.json
          node scripts/checkNEG60NearDetail.mjs --emit-probe="$PROOF" | tee /tmp/near-a.log; cp "$PROOF" /tmp/near-a.json
          node scripts/checkNEG60NearDetail.mjs --emit-probe="$PROOF" | tee /tmp/near-b.log
          cmp /tmp/near-a.log /tmp/near-b.log; cmp /tmp/near-a.json "$PROOF"
          grep -F NE_G60_NEAR_DETAIL_VALIDATION_OK /tmp/near-a.log
          node scripts/checkNEG60NearDetailEnvelope.mjs | tee /tmp/envelope.log; grep -F NE_G60_NEAR_DETAIL_ENVELOPE_OK /tmp/envelope.log
          node scripts/checkNEG60NearDetailPreflight.mjs | tee /tmp/preflight.log; grep -F NE_G60_NEAR_DETAIL_PREFLIGHT_OK /tmp/preflight.log
          node scripts/checkNEG60NearDetailLod.mjs | tee /tmp/lod.log; grep -F NE_G60_NEAR_DETAIL_LOD_OK /tmp/lod.log

      - name: Pinned Terrain3D Godot and double native proof
        run: |
          set -euo pipefail
          ok=0; for n in 1 2 3; do if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee /tmp/t3d-$n.log; then grep -F TERRAIN3D_INSTALL_OK /tmp/t3d-$n.log; ok=1; break; fi; sleep $((n*3)); done; test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | grep -F TERRAIN3D_VERIFY_OK
          mkdir -p "$RUNNER_TEMP/g"; curl -fL --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/g.zip"; unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP/g"
          G="$(find "$RUNNER_TEMP/g" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$G"; chmod +x "$G"; "$G" --version | grep -F 4.6.3; echo "GODOT_BIN=$G" >> "$GITHUB_ENV"
          timeout 180s "$G" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee /tmp/editor.log
          ! grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' /tmp/editor.log
          G60_NEAR_DETAIL_PROOF_SUFFIX=a timeout 300s "$G" --headless --path godot/terrain-authoring --script res://scripts/validate_g60_terrain3d_near_detail.gd 2>&1 | tee /tmp/native-a.log
          cp godot/terrain-authoring/.terrain3d-proof/g60-near-detail-bake.json /tmp/native-a.json; cp godot/terrain-authoring/.terrain3d-proof/g60-near-detail-imported-topdown.png /tmp/import-a.png
          G60_NEAR_DETAIL_PROOF_SUFFIX=b timeout 300s "$G" --headless --path godot/terrain-authoring --script res://scripts/validate_g60_terrain3d_near_detail.gd 2>&1 | tee /tmp/native-b.log
          grep -F NE_G60_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK /tmp/native-a.log; grep -F NE_G60_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK /tmp/native-b.log
          jq -S 'del(.savedRegionBytes)' /tmp/native-a.json >/tmp/native-a-sem.json
          jq -S 'del(.savedRegionBytes)' godot/terrain-authoring/.terrain3d-proof/g60-near-detail-bake.json >/tmp/native-b-sem.json
          cmp /tmp/native-a-sem.json /tmp/native-b-sem.json; cmp /tmp/import-a.png godot/terrain-authoring/.terrain3d-proof/g60-near-detail-imported-topdown.png
          jq -e '.regionCount>=4 and .alignedSamples==4225 and .seamSamples>=24 and .savedRegionFiles>=4 and .bakedVertices>0' godot/terrain-authoring/.terrain3d-proof/g60-near-detail-bake.json

      - name: Visual evidence foliage regressions and repository gates
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkNEG60NearDetailVisualEvidence.mjs --out-dir=artifacts/ne-g60-near-detail-visual | tee /tmp/visual.log
          grep -F NE_G60_NEAR_DETAIL_VISUAL_EVIDENCE_OK /tmp/visual.log
          node scripts/checkNEG60NearDetailEvidenceBundle.mjs | tee /tmp/bundle.log; grep -F NE_G60_NEAR_DETAIL_EVIDENCE_BUNDLE_OK /tmp/bundle.log
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee /tmp/ht.log
          grep -F HTERRAIN_AUTHORING_VALIDATION_OK /tmp/ht.log
          node scripts/checkSeededRandomPolicy.js; node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js; node scripts/roadNetworkSafetyCheck.js
          node scripts/checkVegetationVisualContract.js; node scripts/checkMobileSpawnVegetation.js
          node scripts/checkRoadVisualContract.js; node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js; node scripts/checkServiceWorkerCache.js; node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js; node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ne-g60-terrain3d-near-detail-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g60-near-detail-probe.json
            godot/terrain-authoring/.terrain3d-proof/g60-near-detail-bake.json
            godot/terrain-authoring/.terrain3d-proof/g60-near-detail-imported-topdown.png
            artifacts/ne-g60-near-detail-visual/
            /tmp/native-a.log
            /tmp/native-b.log
