name: Player Ranged Charge Director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerRangedChargeDirector.js'
      - 'scripts/checkPlayerRangedChargeDirector.mjs'
      - '.github/workflows/player-ranged-charge-director.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact-main ancestry
        run: |
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
      - name: Diff budget and boundary guard
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          ! git grep -n "EditorMaterialStudio" -- src/3d/gameplay/playerRangedChargeDirector.js scripts/checkPlayerRangedChargeDirector.mjs
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerRangedChargeDirector.js
          node --check scripts/checkPlayerRangedChargeDirector.mjs
      - name: Executable contract
        run: node scripts/checkPlayerRangedChargeDirector.mjs
