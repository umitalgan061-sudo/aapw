name: Run 224 Editor Scale History Finalize

on:
  push:
    branches:
      - agent/run224-editor-scale-history
    paths:
      - '.github/workflows/run224-editor-scale-history-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run224-editor-scale-history-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun224EditorScaleHistory.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run224 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 224 — World Editor precise scale/history regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies Inspector scale precision below the legacy 0.01 floor by applying `scale.x = 0.007` to a marker-tree.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Undo restores the exact original object identity and transform; Redo restores the exact `0.007` scale without precision loss and consumes redo history.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Browser console/page errors remain zero; editor id, asset id, position and rotation stay stable across the scale-history round trip.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- PWA cache/installability, mobile performance, deterministic world-reference/hydrology, terrain/road safety, technical-debt audit, full browser smoke, and final remote-main/additive-only gates PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed. Test/workflow-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Evidence: Run224 workflow `31422841705` PASS. Next safe step: continue additive-only World Editor usability/regression coverage without crossing unresolved owner gates.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run224,2026-08-10,editor-scale-history' perf_log.csv; then
            printf 'run224,%s,editor-scale-history,,,,,,,"test-only precise scale/undo/redo regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run224 editor precise scale/history regression' STABLE_TAGS.md; then
            printf '%s — Run224 editor precise scale/history regression; sub-0.01 scale precision survives undo/redo, PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run224 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run224): record editor scale-history checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run224-editor-scale-history
          git push origin "$STABLE_TAG" || true
