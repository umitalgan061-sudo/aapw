name: Pindex Quality V2 Perf Bootstrap

on:
  push:
    branches:
      - terrain/pindex-quality-v2-20260812

permissions:
  contents: write

jobs:
  rewrite-v2-section:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace only branch-added V2 section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('src/3d/world/worldReferenceSurfaceTerrainVisual.js')
          fragment = Path('.github/pindex-quality-v2/perf-visual.append').read_text()
          text = source.read_text()
          marker = '// Pindex Quality V2 — high-fidelity shipped terrain finish layered after Iteration #08.'
          if marker not in text:
              raise SystemExit('V2 marker not found')
          prefix = text.split(marker, 1)[0].rstrip('\n') + '\n'
          source.write_text(prefix + fragment.lstrip('\n'))
          PY
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          node scripts/checkAdditiveOnlyDiff.js fd11b1024570cc3b725a4ad9d4ec8bf98f95f855 HEAD || true
          git diff --check
          test "$(git diff --numstat fd11b1024570cc3b725a4ad9d4ec8bf98f95f855 -- src/3d/world/worldReferenceSurfaceTerrainVisual.js | awk '{print $2+0}')" = "0"
      - name: Commit shader-first runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/3d/world/worldReferenceSurfaceTerrainVisual.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "terrain: move pindex quality v2 shading to GPU"
          git push origin HEAD:terrain/pindex-quality-v2-20260812
