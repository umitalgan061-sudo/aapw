name: Next-gen rendering R2
on:
  pull_request:
    paths:
      - 'src/3d/rendering/**'
      - 'scripts/checkNextGenRenderingStackR1.mjs'
      - 'scripts/generateNextGenRenderingMatrixR1.mjs'
      - 'artifacts/next-gen-rendering-r1/**'
      - 'docs/NEXT_GEN_RENDERING_STACK.md'
      - '.github/workflows/next-gen-rendering-r2.yml'
  push:
    branches:
      - agent/next-gen-rendering-stack-r2-20260916
    paths:
      - 'src/3d/rendering/**'
      - 'scripts/checkNextGenRenderingStackR1.mjs'
      - 'scripts/generateNextGenRenderingMatrixR1.mjs'
      - 'artifacts/next-gen-rendering-r1/**'
      - 'docs/NEXT_GEN_RENDERING_STACK.md'
      - '.github/workflows/next-gen-rendering-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer dependency
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.180.0
      - name: Syntax
        run: |
          node --check src/3d/rendering/nextGenRendererAdapter.js
          node --check src/3d/rendering/renderPipelinePolicy.js
          node --check src/3d/rendering/instanceBudgetPlanner.js
          node --check src/3d/rendering/textureResidencyPolicy.js
          node --check src/3d/rendering/visibilityLodPlanner.js
          node --check src/3d/rendering/gpuPassBudget.js
          node --check src/3d/rendering/gpuResourceArbiterR2.js
          node --check scripts/checkNextGenRenderingStackR1.mjs
      - name: Acceptance
        run: node scripts/checkNextGenRenderingStackR1.mjs
      - name: Matrix cardinality
        shell: bash
        run: |
          set -euo pipefail
          f=artifacts/next-gen-rendering-r1/rendering-policy.matrix
          rows=$(tail -n +3 "$f" | awk 'NF' | wc -l | tr -d ' ')
          ids=$(tail -n +3 "$f" | awk -F'|' 'NF {print $NF}' | sort -u | wc -l | tr -d ' ')
          test "$rows" = 4096
          test "$ids" = 4096
      - name: GPU resource arbitration smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { planGpuResources, validateGpuResourcePlan, gpuResourcePlanDigest } from './src/3d/rendering/gpuResourceArbiterR2.js';
          const resources = Array.from({length:300},(_,i)=>({id:`r-${i}`,textureBytes:1000000+(i%7)*50000,bufferBytes:200000+(i%5)*10000,transientBytes:50000,batches:1+(i%3),drawCalls:2+(i%4),triangles:10000+(i%9)*1000,visibility:(i%10)/10,critical:i===0?1:0,pinned:i===1}));
          const a=planGpuResources(resources,{tier:'high'});
          const b=planGpuResources([...resources].reverse(),{tier:'high'});
          assert.equal(validateGpuResourcePlan(a).valid,true);
          assert.equal(gpuResourcePlanDigest(a),gpuResourcePlanDigest(b));
          assert.ok(a.accepted.length>0 && a.deferred.length>0);
          console.log(JSON.stringify({pass:true,accepted:a.accepted.length,deferred:a.deferred.length,digest:gpuResourcePlanDigest(a)}));
          NODE
      - name: Diff hygiene
        run: git diff --check
