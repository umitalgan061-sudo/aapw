name: settlement-trade-preview-projection
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementTradePreviewProjection.js'
      - 'scripts/checkSettlementTradePreviewProjection.mjs'
      - '.github/workflows/settlement-trade-preview-projection.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/3d/gameplay/settlementTradePreviewProjection.js
      - run: node scripts/checkSettlementTradePreviewProjection.mjs
      - run: node scripts/checkSettlementTradePreviewProjection.mjs > /tmp/trade-preview-a.txt
      - run: node scripts/checkSettlementTradePreviewProjection.mjs > /tmp/trade-preview-b.txt
      - run: cmp /tmp/trade-preview-a.txt /tmp/trade-preview-b.txt
      - name: ownership boundary
        run: |
          ! grep -R "EditorMaterialStudio\|new THREE\|createScene" -n src/3d/gameplay/settlementTradePreviewProjection.js
      - name: diff budget
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
