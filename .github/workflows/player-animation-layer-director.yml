name: player-animation-layer-director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAnimationLayerDirector.js'
      - 'scripts/checkPlayerAnimationLayerDirector.mjs'
      - '.github/workflows/player-animation-layer-director.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check exact scope and additive budget
        shell: bash
        run: |
          test "$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')" -eq 3
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
          ! git diff --name-only origin/main...HEAD | grep -E '\.(glb|gltf|fbx|blend|png|jpg|jpeg|webp|wav|mp3|ogg)$'
      - name: Syntax
        run: node --check src/3d/gameplay/playerAnimationLayerDirector.js && node --check scripts/checkPlayerAnimationLayerDirector.mjs
      - name: Executable contract
        run: node scripts/checkPlayerAnimationLayerDirector.mjs
      - name: Boundary guard
        shell: bash
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" -n src/3d/gameplay/playerAnimationLayerDirector.js scripts/checkPlayerAnimationLayerDirector.mjs
      - name: Diff check
        run: git diff --check origin/main...HEAD
