name: Run 130 Mobile Coverage Streaming

on:
  push:
    branches:
      - agent/run130-mobile-coverage-streaming
    paths:
      - '.github/workflows/run130-mobile-coverage.yml'

permissions:
  contents: write

concurrency:
  group: run130-mobile-coverage-streaming
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "13ed64eaf8ffa1016f369910594d7f52ca155d2e"
          test -f GOVERNANCE.md
          test -f 3D_GAME_PROGRESS.md
          test -f DECISIONS.md
          test -f QUESTIONS_FOR_OWNER.md
          git log -10 --oneline
          tail -n 180 3D_GAME_PROGRESS.md
          tail -n 120 DECISIONS.md

      - name: Apply additive implementation locally
        shell: bash
        run: |
          set -euo pipefail
          python scripts/applyRun130MobileCoverage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/3d/world/chunkManager.js GOVERNANCE.md DECISIONS.md scripts/checkMobileChunkStreaming.js scripts/captureRun130MobileEvidence.js
          git diff --cached --check
          git commit -m "perf(3d): begin bounded mobile coverage expansion (ADR-0153)"
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Syntax and integrity gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/chunkManager.js
          node --check scripts/checkMobileChunkStreaming.js
          node --check scripts/captureRun130MobileEvidence.js
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkCheckpointConsistency.js
          node scripts/checkWorldEventCatalog.js
          node scripts/checkAssetsManifest.js
          node scripts/checkCreatureSpeciesConfig.js
          node scripts/checkDialogueChoicesShape.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Full browser smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")"
          echo "SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"
          test "$PASS_COUNT" -ge 34

      - name: Mobile visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/captureRun130MobileEvidence.js

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run130-mobile-coverage-evidence
          path: artifacts/run130-mobile/*.png
          retention-days: 30

      - name: Performance snapshot and self-review
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run130 | tee "$RUNNER_TEMP/perf.log"
          node scripts/analyzePerfTrend.js | tee "$RUNNER_TEMP/perf-trend.log"
          PERF_ROW="$(tail -n 1 perf_log.csv)"
          echo "PERF_ROW=$PERF_ROW" >> "$GITHUB_ENV"
          git diff --check
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' src/3d/world/chunkManager.js scripts/checkMobileChunkStreaming.js scripts/captureRun130MobileEvidence.js; then exit 1; fi
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD

      - name: Append run records and publish
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          printf '\n## Run 130 — mobil bounded streaming + coverage radius 3 (%s)\n' "$STAMP" >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Alt görev: mobil World Coverage büyütme programının ilk runtime adımı; coarse-pointer streaming radius 2→3 ve radius-dışı terrain eviction (ADR-0153).' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Coverage: mobil resident footprint 25→49 chunk, 6.25→12.25 km²; 137.5 km² hedef bazında yaklaşık %4.5→%8.9. Kümülatif everGenerated keşifle büyürken resident terrain 49 chunkta bounded kalır.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- DoD: node --check PASS; mobile runtime streaming test PASS; checkpoint/world-event/PWA/cache/asset/smoke-registry/terrain/road guard PASS; browser smoke ${SMOKE_PASS_COUNT}/34+ PASS; additive-only PASS; iki mobil görsel kanıt artifact olarak saklandı." >> 3D_GAME_PROGRESS.md
          printf '%s\n' "- Performans: ${PERF_ROW}. Headless desktop snapshot mobil FPS iddiası değildir; sıradaki adım gerçek mobil LOD/culling ölçümüdür." >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Memory-leak: eviction unloadChunk→disposeTerrainChunk yolunu kullanır; runtime testi hareket sonrası resident=49 ve disposeAll sonrası 0 doğruladı. Teknik borç: 0 yeni borç.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- World Evolution Report: yol/orman/kale/NPC/event/hayvan/asset/diyalog sayıları delta 0; yalnız mobil resident terrain footprint +6.00 km². Oyuncu fark eder: evet, mobilde aynı anda daha geniş terrain çevresi görünür.' >> 3D_GAME_PROGRESS.md
          printf '%s\n' '- Oturum kalite kapısı: güven 5/5. Risk MEDIUM. Sonraki adım: mobil vegetation/terrain distance LOD + culling, ardından ölçüm uygunsa radius 4 değerlendirmesi.' >> 3D_GAME_PROGRESS.md
          printf '\n## Run 130 — Mobil dünya genişliyor\n' >> CATCH_UP.md
          printf '%s\n' 'Mobil 3D dünyada aynı anda görülebilen terrain alanını yaklaşık iki katına çıkaran ilk adım atıldı.' >> CATCH_UP.md
          printf '%s\n' 'Telefon artık oyuncunun çevresinde 25 yerine 49 terrain chunk tutabiliyor.' >> CATCH_UP.md
          printf '%s\n' 'Geride kalan terrain parçaları bellekten temizleniyor; uzun gezilerde RAM/GPU kullanımı sınırsız büyümüyor.' >> CATCH_UP.md
          printf '%s\n' 'Bu değişiklik masaüstü davranışına dokunmuyor.' >> CATCH_UP.md
          printf '%s\n' 'Mobil resident terrain footprint yaklaşık %4.5 seviyesinden %8.9 seviyesine çıktı.' >> CATCH_UP.md
          printf '%s\n' 'Sonraki hedef ağaçlar, uzak terrain ve kale modelleri için LOD/culling optimizasyonu; ardından daha geniş streaming radius değerlendirilecek.' >> CATCH_UP.md
          printf '%s\n' "- $TAG — run 130 mobile bounded streaming; 49-chunk / 12.25 km² mobile footprint (~8.9%%), browser smoke ${SMOKE_PASS_COUNT}/34+ PASS, mobile runtime eviction PASS." >> STABLE_TAGS.md
          git add 3D_GAME_PROGRESS.md CATCH_UP.md STABLE_TAGS.md perf_log.csv
          git diff --cached --check
          git commit -m "docs: record run 130 mobile coverage checkpoint"
          node scripts/checkCheckpointConsistency.js
          node scripts/checkAdditiveOnlyDiff.js origin/main HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "13ed64eaf8ffa1016f369910594d7f52ca155d2e"
          git push origin HEAD:${GITHUB_REF_NAME}
          git tag "$TAG"
          git push origin "$TAG"
