name: Apply semantic terrain retention once

on:
  push:
    branches:
      - codex/vegetation-habitat-distribution-20260901
    paths:
      - '.github/workflows/_apply-semantic-terrain-retention-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vegetation-habitat-distribution-20260901
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply render-only semantic retention and semantic contract repairs
        run: python scripts/_applySemanticTerrainRetentionOnce.py
      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs
      - name: Validate scalar production contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/3d/world/terrainMicroSurface.js
          node --check scripts/checkTerrainMicroSurface.mjs
          node --check scripts/checkVegetationVisualContract.js
          node --check scripts/checkWaterVisualContract.js
          node scripts/checkTerrainMicroSurface.mjs
          node scripts/checkVegetationEcologicalGroves.mjs
          node scripts/checkNorthernVegetationDeterminism.mjs
          git diff --check
      - name: Install exact Chromium contract tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright" "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright-core" "$GITHUB_WORKSPACE/node_modules/playwright-core"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Validate browser material and vegetation contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
      - name: Commit validated production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(world): retain semantic terrain palette through weathering'
          git push origin HEAD:codex/vegetation-habitat-distribution-20260901
