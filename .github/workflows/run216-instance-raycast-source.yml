name: Run216 Instance Raycast Source

on:
  pull_request:
    paths:
      - 'src/3d/editor/EditorInstanceRaycastSource.js'
      - 'scripts/checkRun216InstanceRaycastSource.mjs'
      - '.github/workflows/run216-instance-raycast-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instance-raycast-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/3d/editor/EditorInstanceRaycastSource.js
          node --check scripts/checkRun216InstanceRaycastSource.mjs
      - name: Raycast source regression
        run: node scripts/checkRun216InstanceRaycastSource.mjs src/3d/editor/EditorInstanceRaycastSource.js
