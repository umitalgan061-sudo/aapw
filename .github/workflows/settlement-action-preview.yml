name: Settlement Action Preview

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementActionPreview.js'
      - 'src/3d/gameplay/settlementCampaignContent.js'
      - 'scripts/checkSettlementActionPreview.mjs'
      - '.github/workflows/settlement-action-preview.yml'
  push:
    branches:
      - 'agent/gunbatimi-settlement-action-preview-*'
    paths:
      - 'src/3d/gameplay/settlementActionPreview.js'
      - 'src/3d/gameplay/settlementCampaignContent.js'
      - 'scripts/checkSettlementActionPreview.mjs'
      - '.github/workflows/settlement-action-preview.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/3d/gameplay/settlementActionPreview.js
          node --check scripts/checkSettlementActionPreview.mjs
      - name: Execute contract
        run: node scripts/checkSettlementActionPreview.mjs
      - name: Runtime editor boundary
        run: |
          ! grep -n "EditorMaterialStudio" src/3d/gameplay/settlementActionPreview.js
          ! grep -n "document\\|window\\|HTMLElement" src/3d/gameplay/settlementActionPreview.js
      - name: Diff cap
        run: |
          changed=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD -- \
            src/3d/gameplay/settlementActionPreview.js \
            scripts/checkSettlementActionPreview.mjs \
            .github/workflows/settlement-action-preview.yml | awk '{a+=$1+$2} END {print a+0}')
          test "$changed" -le 3000
