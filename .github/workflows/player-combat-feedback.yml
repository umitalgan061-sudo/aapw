name: Player Combat Feedback Contract

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerCombatFeedback.mjs'
      - '.github/workflows/player-combat-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/3d/gameplay/player.js
          node --check scripts/checkPlayerCombatFeedback.mjs
      - name: Authoritative feedback contract
        run: node scripts/checkPlayerCombatFeedback.mjs
      - name: Existing melee contract
        run: node scripts/checkPlayerMeleeCombo.mjs
