name: Kizil Ufuk Player Vertical Slice Receipt

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerVerticalSliceReceipt.js'
      - 'scripts/checkKizilUfukPlayerVerticalSliceReceipt.mjs'
      - '.github/workflows/kizil-ufuk-player-vertical-slice-receipt.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-player-vertical-slice-receipt-*'
    paths:
      - 'src/3d/gameplay/playerVerticalSliceReceipt.js'
      - 'scripts/checkKizilUfukPlayerVerticalSliceReceipt.mjs'
      - '.github/workflows/kizil-ufuk-player-vertical-slice-receipt.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact main ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          while IFS= read -r path; do
            case "$path" in
              src/3d/gameplay/playerVerticalSliceReceipt.js|scripts/checkKizilUfukPlayerVerticalSliceReceipt.mjs|.github/workflows/kizil-ufuk-player-vertical-slice-receipt.yml) ;;
              *) echo "unexpected path: $path"; exit 1 ;;
            esac
          done <<< "$files"
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerVerticalSliceReceipt.js
          node --check scripts/checkKizilUfukPlayerVerticalSliceReceipt.mjs
      - name: Runtime proof
        run: node scripts/checkKizilUfukPlayerVerticalSliceReceipt.mjs
      - name: Runtime boundary
        shell: bash
        run: |
          ! grep -R "EditorMaterialStudio\\|Math\\.random\\|CapsuleGeometry" src/3d/gameplay/playerVerticalSliceReceipt.js scripts/checkKizilUfukPlayerVerticalSliceReceipt.mjs
