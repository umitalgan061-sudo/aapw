name: Settlement Service Rest Plan

on:
  pull_request:
    paths:
      - 'src/3d/modern/settlementServiceRestPlan.ts'
      - 'scripts/checkSettlementServiceRestPlan.mjs'
      - '.github/workflows/settlement-service-rest-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-service-rest-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TypeScript syntax
        run: node --experimental-strip-types --check src/3d/modern/settlementServiceRestPlan.ts
      - name: Focused contract proof
        run: node --experimental-strip-types scripts/checkSettlementServiceRestPlan.mjs
