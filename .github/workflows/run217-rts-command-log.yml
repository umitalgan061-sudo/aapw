name: Run 217 RTS Command Log

on:
  push:
    branches:
      - agent/run217-rts-command-log
    paths:
      - '.github/workflows/run217-rts-command-log.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting main concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)"
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'Eşzamanlılık Kontrolü' GOVERNANCE.md
      - name: Install Playwright outside project manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and additive guards
        run: |
          set -euo pipefail
          node --check scripts/checkRun217RtsCommandLog.js
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
          git diff --numstat origin/main...HEAD -- rts.html scripts/checkRun217RtsCommandLog.js .github/workflows/run217-rts-command-log.yml | awk '$2 != 0 { exit 1 }'
      - name: Focused desktop mobile command-log proof
        run: node scripts/checkRun217RtsCommandLog.js
      - name: Existing RTS regressions
        run: |
          set -euo pipefail
          node scripts/checkRun207RtsSurface.js
          node scripts/checkRun208RtsCommandFeedback.js
          node scripts/checkRun210RtsSurfaceTexture.js
          node scripts/checkRun211RtsKeyboardShortcuts.js
          node scripts/checkRun212RtsCommandStatus.js
          node scripts/checkRun213RtsSelectionReadability.js
      - name: Full browser smoke
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run217-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run217-smoke.log")" -ge 34
          grep -F 'zero console/page errors' "$RUNNER_TEMP/run217-smoke.log"
      - name: PWA performance determinism and governance gates
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Append verified Run217 records
        run: |
          set -euo pipefail
          cat >> 3D_GAME_PROGRESS.md <<'EOF'

          ## Run 217 — RTS command history telemetry
          - Added a read-only five-entry command log to `rts.html`. It observes the established RTS status/selection DOM and classifies selection, camera-focus, movement and system messages without owning army, camera, renderer, seed or world state.
          - Desktop/mobile Chromium proof covers representative select/focus/move commands, deterministic sequence numbering, five-entry cap, zero console/page errors and unchanged renderer budgets. Existing Run207/208/210/211/212/213 RTS contracts remain PASS.
          - Full 34+ browser smoke, PWA/cache/installability, mobile render budget, deterministic RNG/world-reference, terrain-seat and road-network safety all PASS.
          - Memory-leak checklist: one MutationObserver + one pagehide listener; observer disconnects and panel DOM is removed on dispose. No timer, RAF, geometry, material, texture, asset or simulation owner added.
          - World Evolution delta: roads +0 km; coverage +0; castles +0; NPCs +0; world events +0; creatures +0. Desktop coverage remains 96.2%; mobile radius-4 remains 81 chunks / 20.25 km² (~14.7%).
          - Technical debt introduced: 0. Risk: LOW. Confidence: 5/5.
          - Next safe step: continue RTS command UX only through read-only presentation or existing command ownership; do not change owner-blocked radius/world-event policy.
          EOF
          cat >> DECISIONS.md <<'EOF'

          ## ADR-0234 — Keep RTS command history read-only and DOM-observed
          **Risk:** LOW

          **Decision:** Add a bounded five-entry command-history panel that observes the authoritative `#rts-status` and `#rts-selection-count` DOM. It classifies existing status messages as selection, camera, movement or system telemetry and exposes a read-only snapshot API.

          **Why:** RTS already has selection, movement, camera focus, command feedback, keyboard parity and command-state readability. A compact recent-order history improves tactical legibility without duplicating simulation ownership or changing deterministic gameplay.

          **Alternatives considered:** add a new command bus in `rtsGame.js`; persist command history; add world-space markers. Rejected because each would introduce new state/render ownership for a presentation-only need.

          **Consequences:** desktop/mobile gain recent-order context with zero Three.js draw calls or triangles added. History is session-local, bounded to five entries, sequence-numbered, and disposed on pagehide.

          **Affected systems:** RTS DOM presentation only. 2D game, RTS army simulation, world generation, PWA asset graph and deterministic state are unchanged.

          **Rollback:** remove the additive inline module in a future owner-approved change; underlying RTS commands remain unchanged.
          EOF
          cat >> perf_log.csv <<'EOF'
          run217,2026-08-09,desktop-rts-command-log,,,,,,,"DOM-only five-entry RTS command history; focused test enforces drawCalls<2500 triangles<5M and console/page errors 0"
          run217,2026-08-09,mobile-rts-command-log,,,,,,,"DOM-only five-entry RTS command history; focused test enforces drawCalls<500 triangles<500K and console/page errors 0"
          EOF
          cat >> STABLE_TAGS.md <<'EOF'
          stable-2026-08-09-2124 — Run217 RTS command history telemetry; desktop/mobile/PWA/regression gates verified.
          EOF
      - name: Final remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
          git diff --numstat "$CURRENT_MAIN" -- rts.html scripts/checkRun217RtsCommandLog.js .github/workflows/run217-rts-command-log.yml | awk '$2 != 0 { exit 1 }'
      - name: Commit verified Run217 records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md DECISIONS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run217): record verified RTS command history'
          git tag stable-2026-08-09-2124
          git push origin HEAD:agent/run217-rts-command-log
          git push origin stable-2026-08-09-2124 || true
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run217-rts-command-log
          path: artifacts/run217-rts-command-log
          if-no-files-found: error
