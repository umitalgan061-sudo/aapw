name: Current Terrain Single Source

on:
  push:
    branches:
      - feature/current-terrain-single-source-r4-20260814
  pull_request:
    branches:
      - main
    paths:
      - 'game3d.html'
      - 'editor.html'
      - 'service-worker.js'
      - 'src/3d/config.js'
      - 'src/3d/world/currentTerrainRuntime.js'
      - 'src/3d/world/currentTerrainAdapter.js'
      - 'scripts/checkCurrentTerrainSingleSource.mjs'
      - 'scripts/checkCurrentTerrainBrowser.mjs'
      - 'scripts/checkWorldReferenceHydrologyExtent.js'
      - 'scripts/terrainSeatSafetyCheck.js'
      - 'scripts/roadNetworkSafetyCheck.js'
      - 'scripts/materializeCurrentTerrainSingleSource.mjs'
      - '.github/workflows/current-terrain-single-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-terrain-single-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize game editor full-map extent and browser-safe terrain
        id: materialize
        run: |
          set -euo pipefail
          node scripts/materializeCurrentTerrainSingleSource.mjs
          MATERIALIZED_FILES='game3d.html editor.html service-worker.js src/3d/config.js scripts/terrainSeatSafetyCheck.js scripts/roadNetworkSafetyCheck.js'
          if git diff --quiet -- $MATERIALIZED_FILES; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $MATERIALIZED_FILES
          git commit -m 'terrain: materialize full-map live terrain runtime'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test -n "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Stop after materialization push
        if: steps.materialize.outputs.changed == 'true'
        run: echo 'CURRENT_TERRAIN_MATERIALIZATION_PUSHED'

      - name: Exact current main and bounded scope
        if: steps.materialize.outputs.changed != 'true'
        id: base
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(game3d\.html|editor\.html|service-worker\.js|src/3d/config\.js|src/3d/world/currentTerrainRuntime\.js|src/3d/world/currentTerrainAdapter\.js|scripts/checkCurrentTerrainSingleSource\.mjs|scripts/checkCurrentTerrainBrowser\.mjs|scripts/checkWorldReferenceHydrologyExtent\.js|scripts/terrainSeatSafetyCheck\.js|scripts/roadNetworkSafetyCheck\.js|scripts/materializeCurrentTerrainSingleSource\.mjs|\.github/workflows/current-terrain-single-source\.yml)$' | wc -l)" -eq 0
          LINES="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          echo "CURRENT_TERRAIN_CHANGED_LINES=$LINES"
          test "$LINES" -le 1000
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Syntax and full-map source contract
        if: steps.materialize.outputs.changed != 'true'
        run: |
          set -euo pipefail
          node --check src/3d/world/currentTerrainRuntime.js
          node --check src/3d/world/currentTerrainAdapter.js
          node --check scripts/checkCurrentTerrainSingleSource.mjs
          node --check scripts/checkCurrentTerrainBrowser.mjs
          node --check scripts/checkWorldReferenceHydrologyExtent.js
          node --check scripts/terrainSeatSafetyCheck.js
          node --check scripts/roadNetworkSafetyCheck.js
          node --check scripts/materializeCurrentTerrainSingleSource.mjs
          node scripts/checkCurrentTerrainSingleSource.mjs | tee "$RUNNER_TEMP/current-terrain-source.log"
          grep -F 'CURRENT_TERRAIN_SINGLE_SOURCE_OK' "$RUNNER_TEMP/current-terrain-source.log"
          node scripts/checkWorldReferenceHydrologyExtent.js
          grep -F 'legacyProceduralFallback: false' src/3d/world/currentTerrainRuntime.js
          grep -F 'renderAndPhysicsSingleSource: true' src/3d/world/currentTerrainAdapter.js
          grep -F 'MAP_BOUNDS: Object.freeze({ minX: 0, maxX: 9000, minY: 0, maxY: 7000 })' src/3d/config.js
          grep -F 'GRID_COLUMNS: 27' src/3d/config.js
          grep -F 'GRID_ROWS: 21' src/3d/config.js
          grep -F "'.mjs': 'text/javascript; charset=utf-8'" scripts/terrainSeatSafetyCheck.js
          grep -F "'.mjs': 'text/javascript; charset=utf-8'" scripts/roadNetworkSafetyCheck.js

      - name: Install Playwright Chromium
        if: steps.materialize.outputs.changed != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real game render and physics single-source proof
        if: steps.materialize.outputs.changed != 'true'
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkCurrentTerrainBrowser.mjs | tee "$RUNNER_TEMP/current-terrain-browser.log"
          grep -F 'CURRENT_TERRAIN_BROWSER_OK' "$RUNNER_TEMP/current-terrain-browser.log"

      - name: Existing world PWA mobile and full-browser regressions
        if: steps.materialize.outputs.changed != 'true'
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        if: steps.materialize.outputs.changed != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.base.outputs.base_sha }}"
          test "$(git merge-base HEAD origin/main)" = "${{ steps.base.outputs.base_sha }}"
