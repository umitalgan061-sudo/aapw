name: Current Map Screenshot Capture
on:
  push:
    branches: [chatgpt/current-map-capture-20260815]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hydrate real castle assets used in the map view
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/models/settlements/castles/**" --exclude=""
      - name: Install Chromium capture dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Render current main-derived map views
        run: node scripts/captureCurrentMapViews.js
      - name: Upload map screenshots
        uses: actions/upload-artifact@v4
        with:
          name: current-map-screenshots
          path: artifacts/current-map-capture/
          if-no-files-found: error
          retention-days: 3
