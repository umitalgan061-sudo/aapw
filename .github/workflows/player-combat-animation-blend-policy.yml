name: Player Combat Animation Blend Policy
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatAnimationBlendPolicy.js'
      - 'scripts/checkPlayerCombatAnimationBlendPolicy.mjs'
      - '.github/workflows/player-combat-animation-blend-policy.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatAnimationBlendPolicy.js
          node --check scripts/checkPlayerCombatAnimationBlendPolicy.mjs
      - name: Focused contract
        run: node scripts/checkPlayerCombatAnimationBlendPolicy.mjs
