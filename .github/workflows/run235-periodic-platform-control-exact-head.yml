name: Run 235 Periodic Platform Control Exact Head

on:
  push:
    branches:
      - agent/run235-periodic-platform-control
    paths:
      - '.github/workflows/run235-periodic-platform-control-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run235-periodic-platform-control-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head and checkpoint records
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check "$CURRENT_MAIN" HEAD
          grep -Fq '### Run235 platform-control superseding note' GOVERNANCE.md
          grep -Fq '**Run 235 (2026-08-11, periodic platform control refresh):**' RULES_CHANGELOG.md
          grep -Fq '## Run 235 — Periodic platform control refresh' 3D_GAME_PROGRESS.md
          grep -Fq 'run235,2026-08-11,periodic-platform-control' perf_log.csv
          grep -Fq 'Run235 periodic platform control' STABLE_TAGS.md
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Verify final platform state
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js
      - name: Final publication concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check "$CURRENT_MAIN" HEAD
