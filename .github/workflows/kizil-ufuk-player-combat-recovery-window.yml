name: Kizil Ufuk Player Combat Recovery Window

on:
  push:
    branches:
      - agent/kizil-ufuk-combat-recovery-window-20260916-r11
  pull_request:
    paths:
      - src/3d/gameplay/playerCombatRecoveryWindow.js
      - scripts/checkPlayerCombatRecoveryWindow.mjs
      - .github/workflows/kizil-ufuk-player-combat-recovery-window.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact main and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          BASE="$(git rev-parse origin/main)"
          git diff --check "$BASE"...HEAD
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          ALLOW='^(src/3d/gameplay/playerCombatRecoveryWindow\.js|scripts/checkPlayerCombatRecoveryWindow\.mjs|\.github/workflows/kizil-ufuk-player-combat-recovery-window\.yml)$'
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            [[ "$file" =~ $ALLOW ]] || { echo "unexpected changed path: $file"; exit 1; }
          done <<< "$CHANGED"
          LINES="$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$LINES" -le 3000
          echo "base=$BASE head=$(git rev-parse HEAD) changed_lines=$LINES"
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatRecoveryWindow.js && node --check scripts/checkPlayerCombatRecoveryWindow.mjs
      - name: Executable contract
        run: node scripts/checkPlayerCombatRecoveryWindow.mjs
