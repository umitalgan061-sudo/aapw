name: Terrain Polish Iteration 011 Canonical Colormap

on:
  push:
    branches:
      - 'terrain/polish-iteration-011-canonical-colormap-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-polish-iteration-011-canonical-colormap-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul
  BASE_SHA: 0bd96b66c92db2e1543694b1e40520ed7795e9d2

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main concurrency and protected-scope entry gates
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          node --check godot/terrain-authoring/tools/export_canonical_surface_colormap.mjs
          test -f godot/terrain-authoring/addons/zylann.hterrain/plugin.cfg
          test -f godot/terrain-authoring/TERRAIN_AUTOMATION_RULES.md
          test -f godot/terrain-authoring/terrain3d.lock.json
          grep -F '20702972e8f45f0fbdc4da5fa68e890a82e4e822e1d58e2f369d8bc5b9c571a1' src/3d/world/worldReferenceSurfacePindexes.js
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data

      - name: Export canonical map-derived colormap twice
        run: |
          set -euo pipefail
          OUT='godot/terrain-authoring/.generated/iteration_011'
          rm -rf "$OUT"
          node godot/terrain-authoring/tools/export_canonical_surface_colormap.mjs | tee "$RUNNER_TEMP/export-a.log"
          grep -F 'CANONICAL_SURFACE_COLORMAP_EXPORT_OK' "$RUNNER_TEMP/export-a.log"
          cp "$OUT/canonical_surface_colormap.tga" "$RUNNER_TEMP/canonical-a.tga"
          cp "$OUT/canonical_surface_colormap.json" "$RUNNER_TEMP/canonical-a.json"
          rm -rf "$OUT"
          node godot/terrain-authoring/tools/export_canonical_surface_colormap.mjs | tee "$RUNNER_TEMP/export-b.log"
          cmp "$RUNNER_TEMP/canonical-a.tga" "$OUT/canonical_surface_colormap.tga"
          cmp "$RUNNER_TEMP/canonical-a.json" "$OUT/canonical_surface_colormap.json"
          cmp "$RUNNER_TEMP/export-a.log" "$RUNNER_TEMP/export-b.log"
          sha256sum "$OUT/canonical_surface_colormap.tga" | tee "$RUNNER_TEMP/canonical-sha256.log"

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' \
            --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project and validate unchanged HTerrain authoring
        run: |
          set -euo pipefail
          PROJECT_FILE='godot/terrain-authoring/project.godot'
          BACKUP_FILE="$RUNNER_TEMP/project.godot"
          cp "$PROJECT_FILE" "$BACKUP_FILE"
          restore_project() { cp "$BACKUP_FILE" "$PROJECT_FILE"; }
          trap restore_project EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('godot/terrain-authoring/project.godot')
          text = path.read_text(encoding='utf-8')
          expected = 'enabled=PackedStringArray("res://addons/zylann.hterrain/plugin.cfg")'
          assert expected in text
          path.write_text(text.replace(expected, 'enabled=PackedStringArray()'), encoding='utf-8')
          PY
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          restore_project
          trap - EXIT
          git diff --exit-code -- "$PROJECT_FILE"
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60 2>&1 | tee "$RUNNER_TEMP/editor.log"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd 2>&1 | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"

      - name: Validate canonical colormap through Godot Image
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_canonical_surface_colormap_probe.gd 2>&1 | tee "$RUNNER_TEMP/canonical-godot.log"
          grep -F 'TERRAIN_POLISH_ITERATION_11_OK' "$RUNNER_TEMP/canonical-godot.log"
          test -f godot/terrain-authoring/.generated/iteration_011/canonical_surface_colormap.png

      - name: Upload canonical colormap visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: terrain-polish-011-canonical-colormap-${{ github.sha }}
          path: |
            godot/terrain-authoring/.generated/iteration_011/canonical_surface_colormap.tga
            godot/terrain-authoring/.generated/iteration_011/canonical_surface_colormap.png
            godot/terrain-authoring/.generated/iteration_011/canonical_surface_colormap.json
          if-no-files-found: error
          retention-days: 14

      - name: PWA cache and installability regression
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js

      - name: Install Chromium smoke and performance dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Performance determinism world safety governance
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/mobile.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkRun280OwnerMapSemanticFingerprint.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js

      - name: Full browser smoke and console regression
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/smoke.log")" -ge 34

      - name: Cleanup generated evidence and final exact-main gate
        run: |
          set -euo pipefail
          rm -rf godot/terrain-authoring/.generated/iteration_011
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          test ! -e godot/terrain-authoring/.generated/iteration_011
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scenes
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/scripts/terrain_authoring_bootstrap.gd
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain_data
