name: settlement-command-palette
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementCommandPalette.js'
      - 'scripts/checkSettlementCommandPalette.mjs'
      - '.github/workflows/settlement-command-palette.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementCommandPalette.js'
      - 'scripts/checkSettlementCommandPalette.mjs'
      - '.github/workflows/settlement-command-palette.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementCommandPalette.js && node --check scripts/checkSettlementCommandPalette.mjs
      - name: Executable contract
        run: node scripts/checkSettlementCommandPalette.mjs
      - name: Runtime boundary
        run: |
          ! grep -n "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline\|document\.\|window\." src/3d/gameplay/settlementCommandPalette.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD -- src/3d/gameplay/settlementCommandPalette.js scripts/checkSettlementCommandPalette.mjs .github/workflows/settlement-command-palette.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
