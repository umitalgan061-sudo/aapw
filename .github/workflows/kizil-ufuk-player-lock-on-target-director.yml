name: Kizil Ufuk - Player Lock-On Target Director

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerLockOnTargetDirector.js'
      - 'src/3d/gameplay/playerEquipmentCombatRules.js'
      - 'scripts/checkKizilUfukPlayerLockOnTargetDirector.mjs'
      - '.github/workflows/kizil-ufuk-player-lock-on-target-director.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-lock-on-target-director-20260916-r11'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic lock-on checks
        run: node scripts/checkKizilUfukPlayerLockOnTargetDirector.mjs
