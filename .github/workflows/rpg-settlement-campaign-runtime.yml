name: RPG Settlement Campaign Runtime

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementCampaign*.js'
      - 'src/3d/gameplay/settlementVerticalSlice.js'
      - 'scripts/checkSettlementCampaign*.mjs'
      - 'scripts/checkSharedMaterialPlacementContract.js'
      - '.github/workflows/rpg-settlement-campaign-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementCampaign*.js'
      - 'scripts/checkSettlementCampaign*.mjs'
      - 'src/3d/gameplay/settlementVerticalSlice.js'
      - 'scripts/checkSharedMaterialPlacementContract.js'

permissions:
  contents: read

jobs:
  settlement-campaign-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate without implicit global LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Exact main ancestry and 3000-line hard cap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD \"$BASE\")" = "$BASE"
          ADDS="$(git diff --numstat \"$BASE...HEAD\" | awk '{a+=$1} END {print a+0}')"
          DELS="$(git diff --numstat \"$BASE...HEAD\" | awk '{d+=$2} END {print d+0}')"
          TOTAL=$((ADDS+DELS))
          test "$TOTAL" -le 3000
          git diff --check "$BASE...HEAD"
          echo "BASE=$BASE HEAD=$(git rev-parse HEAD) CHANGED_LINES=$TOTAL"

      - name: Node and runtime syntax
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/settlementCampaignContent.js
          node --check src/3d/gameplay/settlementCampaignRuntime.js
          node --check src/3d/gameplay/settlementCampaignEventBridge.js
          node --check src/3d/gameplay/settlementCampaignSaveAdapter.js
          node --check src/3d/gameplay/settlementCampaignUiModel.js
          node --check scripts/checkSettlementCampaignRuntime.mjs
          node --check scripts/checkSettlementCampaignBrowser.mjs
          node --check scripts/checkSettlementCampaignEventBridge.mjs

      - name: Content and runtime executable regression
        run: node scripts/checkSettlementCampaignRuntime.mjs

      - name: EventBus lifecycle regression
        run: node scripts/checkSettlementCampaignEventBridge.mjs

      - name: Shared material placement boundary
        run: |
          set -euo pipefail
          node scripts/checkSharedMaterialPlacementContract.js
          ! grep -R "EditorMaterialStudio" src/3d/gameplay/settlementCampaign*.js

      - name: Persistence boundary regression
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createSettlementCampaignRuntime } from './src/3d/gameplay/settlementCampaignRuntime.js';
          import { createSettlementCampaignSavePayload, validateSettlementCampaignSavePayload, restoreSettlementCampaignSavePayload, migrateSettlementCampaignSave } from './src/3d/gameplay/settlementCampaignSaveAdapter.js';
          const runtime = createSettlementCampaignRuntime({ initialState: { copper: 40 }, handlers: { save: async () => ({ ok:true, action:'save' }) } });
          runtime.open('house');
          const saved = createSettlementCampaignSavePayload(runtime, { slot:'ci', savedAt:'deterministic' });
          assert.equal(saved.ok, true); assert.equal(validateSettlementCampaignSavePayload(saved.payload).ok, true);
          assert.equal(restoreSettlementCampaignSavePayload(runtime, saved.payload).ok, true);
          assert.equal(migrateSettlementCampaignSave({ schema:0, panel:'quests' }).migrated, true);
          console.log('SETTLEMENT_CAMPAIGN_SAVE_OK');
          NODE

      - name: Deterministic manifest
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createSettlementCampaignRuntime } from './src/3d/gameplay/settlementCampaignRuntime.js';
          const options = { initialState:{ copper:90, perks:['roadwise'] } };
          const a = createSettlementCampaignRuntime(options).manifest();
          const b = createSettlementCampaignRuntime(options).manifest();
          assert.equal(a.digest, b.digest);
          console.log(`SETTLEMENT_MANIFEST_DETERMINISM_OK digest=${a.digest}`);
          NODE

      - name: PWA shell and asset checks (hard failure, never bypass)
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js

      - name: Shipped-page Chromium settlement proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSettlementCampaignBrowser.mjs

      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          BASE="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD \"$BASE\")" = "$BASE"
          echo "FINAL_BASE=$BASE FINAL_HEAD=$(git rev-parse HEAD)"

      - name: Final exact diff budget
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse origin/main)"
          ADDS="$(git diff --numstat \"$BASE...HEAD\" | awk '{a+=$1} END {print a+0}')"
          DELS="$(git diff --numstat \"$BASE...HEAD\" | awk '{d+=$2} END {print d+0}')"
          TOTAL=$((ADDS+DELS))
          test "$TOTAL" -le 3000
          echo "FINAL_CHANGED_LINES=$TOTAL"
