name: Player Equipment Socket Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerEquipmentSocketPlan.js'
      - 'scripts/checkPlayerEquipmentSocketPlan.mjs'
      - '.github/workflows/player-equipment-socket-plan.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerEquipmentSocketPlan.js'
      - 'scripts/checkPlayerEquipmentSocketPlan.mjs'
      - '.github/workflows/player-equipment-socket-plan.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exact main ancestry and scope
        shell: bash
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
          changed=$(git diff --name-only origin/main...HEAD)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -le 3
          ! printf '%s\n' "$changed" | grep -E 'EditorMaterialStudio|src/3d/materials/MaterialAssignmentCore|src/3d/world/WorldAssetPlacementPipeline'
          additions=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$additions" -le 3000
      - name: Syntax
        run: node --check src/3d/gameplay/playerEquipmentSocketPlan.js && node --check scripts/checkPlayerEquipmentSocketPlan.mjs
      - name: Executable contract
        run: node scripts/checkPlayerEquipmentSocketPlan.mjs
      - name: No whitespace errors
        run: test -z "$(git diff --check origin/main...HEAD)"
