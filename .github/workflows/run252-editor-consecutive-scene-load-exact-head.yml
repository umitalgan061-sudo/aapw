name: Run 252 Editor Consecutive Scene Load Exact Head

on:
  push:
    branches:
      - agent/run252-editor-consecutive-scene-load
    paths:
      - '.github/workflows/run252-editor-consecutive-scene-load-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run252-editor-consecutive-scene-load-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun252EditorConsecutiveSceneLoad.js
          node --check src/3d/editor/worldEditor.js
          node --check src/3d/editor/EditorLocalSession.js
          git diff --check
      - name: Verify Run252 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 252 — World Editor consecutive scene replacement regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run252,2026-08-11,editor-consecutive-scene-load' perf_log.csv
          grep -Fq 'Run252 editor consecutive scene replacement regression' STABLE_TAGS.md
          grep -Fq '31463882079' 3D_GAME_PROGRESS.md
          grep -Fq '31463882028' 3D_GAME_PROGRESS.md
