name: Run 253 Editor Unknown Only Scene Load Exact Head V2

on:
  push:
    branches:
      - agent/run253-editor-unknown-only-scene-load
    paths:
      - '.github/workflows/run253-editor-unknown-only-scene-load-exact-head-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run253-editor-unknown-only-scene-load-exact-head-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun253EditorUnknownOnlySceneLoad.js
          node --check src/3d/editor/EditorLocalSession.js
          git diff --check
      - name: Verify Run253 checkpoint and RCA records
        run: |
          set -euo pipefail
          grep -Fq '## Run 253 — World Editor unknown-only scene load regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run253,2026-08-11,editor-unknown-only-scene-load' perf_log.csv
          grep -Fq 'Run253 editor unknown-only scene load regression' STABLE_TAGS.md
          grep -Fq '31463937137' 3D_GAME_PROGRESS.md
          grep -Fq '31463937094' 3D_GAME_PROGRESS.md
          grep -Fq '31464226565' 3D_GAME_PROGRESS.md
