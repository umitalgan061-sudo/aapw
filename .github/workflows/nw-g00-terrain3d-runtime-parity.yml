name: NW G00 Terrain3D Runtime Parity

on:
  push:
    branches:
      - agent/buzul-muhafizi-g00-runtime-parity-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'src/3d/world/g00Terrain3dRuntimeParity.js'
      - 'scripts/checkNWG00Terrain3DRuntimeParity.mjs'
      - 'scripts/checkNWG00RuntimeVisualParity.mjs'
      - 'godot/terrain-authoring/scripts/validate_g00_terrain3d_runtime_parity.gd'
      - 'godot/terrain-authoring/corner_claims/NW.json'
      - '.github/workflows/nw-g00-terrain3d-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nw-g00-terrain3d-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/g00Terrain3dRuntimeParity.js|scripts/checkNWG00Terrain3DRuntimeParity.mjs|scripts/checkNWG00RuntimeVisualParity.mjs|godot/terrain-authoring/scripts/validate_g00_terrain3d_runtime_parity.gd|godot/terrain-authoring/corner_claims/NW.json|\.github/workflows/nw-g00-terrain3d-runtime-parity.yml)$' | wc -l)" -eq 0
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g00_hydrology.mjs
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g00_biome.mjs
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g00_relief.mjs
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g00_rock_snow.mjs
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g00_road_path.mjs
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/geocells/nw/g00_near_detail.mjs
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          node --check src/3d/world/g00Terrain3dRuntimeParity.js
          node --check scripts/checkNWG00Terrain3DRuntimeParity.mjs
          node --check scripts/checkNWG00RuntimeVisualParity.mjs

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Reprove merged G00 Near Detail and emit live runtime probe
        run: |
          set -euo pipefail
          PROOF='godot/terrain-authoring/.terrain3d-proof/g00-near-detail-probe.json'
          mkdir -p "$(dirname "$PROOF")"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG00NearDetail.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/g00-near-detail.log"
          grep -F 'NW_G00_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g00-near-detail.log"
          test -s "$PROOF"

      - name: Build deterministic G00 parity source twice
        run: |
          set -euo pipefail
          node scripts/checkNWG00Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/g00-source-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g00-runtime-source.json "$RUNNER_TEMP/g00-runtime-source-a.json"
          node scripts/checkNWG00Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/g00-source-b.log"
          cmp "$RUNNER_TEMP/g00-source-a.log" "$RUNNER_TEMP/g00-source-b.log"
          cmp "$RUNNER_TEMP/g00-runtime-source-a.json" godot/terrain-authoring/.terrain3d-proof/g00-runtime-source.json
          grep -F 'NW_G00_RUNTIME_PARITY_SOURCE_OK' "$RUNNER_TEMP/g00-source-a.log"

      - name: Install pinned Terrain3D and preserve HTerrain
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.godot.before-terrain3d"
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          grep -F 'res://addons/zylann.hterrain/plugin.cfg' godot/terrain-authoring/project.godot
          grep -F 'res://addons/terrain_3d/plugin.cfg' godot/terrain-authoring/project.godot

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Terrain3D Height Control Color bake and persistence twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/t3d-editor.log"
          if grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/t3d-editor.log"; then
            echo 'Terrain3D emitted a load error.' >&2
            exit 1
          fi
          G00_RUNTIME_PARITY_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g00_terrain3d_runtime_parity.gd 2>&1 | tee "$RUNNER_TEMP/g00-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g00-runtime-bake.json "$RUNNER_TEMP/g00-runtime-bake-a.json"
          cp godot/terrain-authoring/.terrain3d-proof/g00-runtime-bake-topdown.png "$RUNNER_TEMP/g00-runtime-topdown-a.png"
          G00_RUNTIME_PARITY_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g00_terrain3d_runtime_parity.gd 2>&1 | tee "$RUNNER_TEMP/g00-t3d-b.log"
          grep -F 'NW_G00_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/g00-t3d-a.log"
          grep -F 'NW_G00_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/g00-t3d-b.log"
          cmp "$RUNNER_TEMP/g00-runtime-bake-a.json" godot/terrain-authoring/.terrain3d-proof/g00-runtime-bake.json
          cmp "$RUNNER_TEMP/g00-runtime-topdown-a.png" godot/terrain-authoring/.terrain3d-proof/g00-runtime-bake-topdown.png

      - name: Three.js bake adapter parity
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG00Terrain3DRuntimeParity.mjs --verify | tee "$RUNNER_TEMP/g00-runtime-parity.log"
          grep -F 'NW_G00_TERRAIN3D_RUNTIME_PARITY_OK' "$RUNNER_TEMP/g00-runtime-parity.log"

      - name: Near far and full-world top-down visual proof
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkNWG00RuntimeVisualParity.mjs --out-dir=artifacts/nw-g00-runtime-visual | tee "$RUNNER_TEMP/g00-runtime-visual.log"
          grep -F 'NW_G00_RUNTIME_VISUAL_PARITY_OK' "$RUNNER_TEMP/g00-runtime-visual.log"
          test -s artifacts/nw-g00-runtime-visual/g00-runtime-near.png
          test -s artifacts/nw-g00-runtime-visual/g00-runtime-far.png
          test -s artifacts/nw-g00-runtime-visual/g00-runtime-full-world-topdown.png

      - name: HTerrain world settlement road PWA mobile and browser regressions
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD

      - name: Restore authoring bootstrap mutations
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/project.godot.before-terrain3d"; then cp "$RUNNER_TEMP/project.godot.before-terrain3d" godot/terrain-authoring/project.godot; fi
          rm -rf godot/terrain-authoring/addons/terrain_3d
          git restore --worktree -- godot/terrain-authoring/addons/zylann.hterrain
          git clean -fdx -- godot/terrain-authoring/terrain_data
          git diff --exit-code -- godot/terrain-authoring/project.godot
          git diff --exit-code -- godot/terrain-authoring/addons/zylann.hterrain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nw-g00-terrain3d-runtime-parity-proof
          include-hidden-files: true
          path: |
            godot/terrain-authoring/.terrain3d-proof/g00-near-detail-probe.json
            godot/terrain-authoring/.terrain3d-proof/g00-runtime-source.json
            godot/terrain-authoring/.terrain3d-proof/g00-runtime-bake.json
            godot/terrain-authoring/.terrain3d-proof/g00-runtime-bake-topdown.png
            artifacts/nw-g00-runtime-visual/g00-runtime-near.png
            artifacts/nw-g00-runtime-visual/g00-runtime-far.png
            artifacts/nw-g00-runtime-visual/g00-runtime-full-world-topdown.png
          if-no-files-found: warn
