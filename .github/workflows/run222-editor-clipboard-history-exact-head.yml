name: Run 222 Editor Clipboard History Exact Head

on:
  push:
    branches:
      - agent/run222-editor-clipboard-history-main-sync
    paths:
      - '.github/workflows/run222-editor-clipboard-history-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run222-editor-clipboard-history-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun222EditorClipboardHistory.js
          git diff --check
      - name: Verify Run222 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 222 — World Editor clipboard/history regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run222,2026-08-10,editor-clipboard-history' perf_log.csv
          grep -Fq 'Run222 editor clipboard/history regression' STABLE_TAGS.md
          grep -Fq '31420348658' 3D_GAME_PROGRESS.md
