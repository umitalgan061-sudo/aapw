name: Kizil Ufuk Combat Intent Policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatIntentPolicy.js'
      - 'src/3d/gameplay/playerCombatActionRouter.js'
      - 'scripts/checkKizilUfukCombatIntentPolicy.mjs'
      - '.github/workflows/kizil-ufuk-combat-intent-policy.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Exact head ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Syntax
        run: |
          node --check src/3d/gameplay/playerCombatIntentPolicy.js
          node --check src/3d/gameplay/playerCombatActionRouter.js
          node --check scripts/checkKizilUfukCombatIntentPolicy.mjs
      - name: Executable contract
        run: node scripts/checkKizilUfukCombatIntentPolicy.mjs
      - name: Additive bounded scope
        run: |
          git diff --numstat "${{ github.event.pull_request.base.sha }}...HEAD" > /tmp/numstat
          awk '{a+=$1; d+=$2} END { if (d != 0 || a+d > 3000) exit 1; print "additions=" a, "deletions=" d }' /tmp/numstat
      - name: Runtime/editor boundary
        run: |
          ! grep -R "EditorMaterialStudio" src/3d/gameplay/playerCombatIntentPolicy.js src/3d/gameplay/playerCombatActionRouter.js
