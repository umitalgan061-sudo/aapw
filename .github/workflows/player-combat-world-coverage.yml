name: Player Combat World Coverage
on:
  pull_request:
    paths: ['src/3d/gameplay/playerCombatWorldCoverage.js', 'scripts/checkPlayerCombatWorldCoverage.mjs']
  push:
    branches: [main, 'codex/kizil-ufuk-world-coverage-*']
    paths: ['src/3d/gameplay/playerCombatWorldCoverage.js', 'scripts/checkPlayerCombatWorldCoverage.mjs']
permissions: { contents: read }
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check src/3d/gameplay/playerCombatWorldCoverage.js && node scripts/checkPlayerCombatWorldCoverage.mjs
