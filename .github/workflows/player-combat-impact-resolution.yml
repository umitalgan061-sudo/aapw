name: Player Combat Impact Resolution
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatImpactResolution.ts'
      - 'scripts/checkPlayerCombatImpactResolution.mjs'
      - '.github/workflows/player-combat-impact-resolution.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check scripts/checkPlayerCombatImpactResolution.mjs
      - run: node --experimental-strip-types scripts/checkPlayerCombatImpactResolution.mjs
