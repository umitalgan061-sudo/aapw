name: Buzul Muhafizi environment runtime contract v30

on:
  pull_request:
    paths:
      - 'src/3d/world/environmentRuntimeContract.js'
      - 'scripts/checkEnvironmentRuntimeContract.mjs'
      - '.github/workflows/buzul-muhafizi-environment-runtime-contract-v30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor origin/main HEAD
      - name: Scope and diff budget
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only origin/main...HEAD)
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              src/3d/world/environmentRuntimeContract.js|scripts/checkEnvironmentRuntimeContract.mjs|.github/workflows/buzul-muhafizi-environment-runtime-contract-v30.yml) ;;
              *) echo "out-of-scope file: $file"; exit 1 ;;
            esac
          done <<< "$files"
          changed=$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Syntax
        run: |
          node --check src/3d/world/environmentRuntimeContract.js
          node --check scripts/checkEnvironmentRuntimeContract.mjs
      - name: Runtime contract
        run: node scripts/checkEnvironmentRuntimeContract.mjs
      - name: Boundary guards
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio" src/3d/world/environmentRuntimeContract.js scripts/checkEnvironmentRuntimeContract.mjs
          ! grep -R "createBoxGeometry\|createSphereGeometry\|createConeGeometry" src/3d/world/environmentRuntimeContract.js
          grep -q "MaterialAssignmentCore+WorldAssetPlacementPipeline" src/3d/world/environmentRuntimeContract.js
          grep -q "caller-owned" src/3d/world/environmentRuntimeContract.js
          ! grep -R "terrain.js\|water.js\|sceneManager.js\|naturalGeology.js\|rivers.js\|roads.js" src/3d/world/environmentRuntimeContract.js
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
