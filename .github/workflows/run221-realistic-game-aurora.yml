name: Run 221 Realistic Game Aurora

on:
  push:
    branches:
      - agent/run221-realistic-game-aurora
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run221-realistic-game-aurora-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting remote-main concurrency gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
          git diff --check
      - name: Syntax
        run: |
          set -euo pipefail
          node --check src/3d/auroraRealism.js
          node --check src/3d/sky.js
          node --check src/3d/nightVisualEnhancement.js
          node --check src/3d/lighting.js
          node --check scripts/checkRun221RealisticGameAuroraBrowser.js
          node --check scripts/checkLightingVisualContract.js
          node --check scripts/applyRun221AuroraPwaPrecacheAddition.js
      - name: Install isolated Chromium proof tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run221-realistic-aurora-tools"
          npm install --prefix "$RUNNER_TEMP/run221-realistic-aurora-tools" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/run221-realistic-aurora-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/run221-realistic-aurora-tools/node_modules" >> "$GITHUB_ENV"
      - name: Realistic gameplay aurora WebGL proof
        run: node scripts/checkRun221RealisticGameAuroraBrowser.js
      - name: Canonical lighting regression
        run: node scripts/checkLightingVisualContract.js
      - name: PWA cache and installability
        run: |
          set -euo pipefail
          node scripts/applyRun221AuroraPwaPrecacheAddition.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          git diff --check
      - name: Mobile performance and deterministic world safety
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Full browser smoke
        run: node scripts/smokeTestGame3D.js
      - name: Final remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD origin/main)"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload gameplay aurora evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run221-realistic-game-aurora
          path: artifacts/run221-realistic-game-aurora/*.png
          if-no-files-found: warn
