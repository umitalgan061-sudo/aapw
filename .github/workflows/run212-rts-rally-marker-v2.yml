name: Run 212 RTS Rally Marker V2

on:
  push:
    branches:
      - agent/run212-rts-rally-marker-v2
    paths:
      - '.github/workflows/run212-rts-rally-marker-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Current-main and governance gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "897001280c891095819a5129b545eec4e43afe1e"
          test "$(git merge-base HEAD origin/main)" = "$CURRENT_MAIN"
          grep -F 'Additive-only diff guard' GOVERNANCE.md
          grep -F 'Eşzamanlılık Kontrolü' GOVERNANCE.md
          grep -F 'Run 211 — RTS keyboard command parity' 3D_GAME_PROGRESS.md
          grep -F 'ADR-0229' DECISIONS.md
          grep -F 'radius-5' QUESTIONS_FOR_OWNER.md
      - name: Install Playwright outside project manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Baseline smoke and Run211 focused proof
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/pre-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/pre-smoke.log")" -ge 34
          node scripts/checkRun211RtsKeyboardShortcuts.js
      - name: Wire marker by insertion only and commit locally
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/3d/rts/rtsGame.js')
          text = path.read_text()
          pairs = [
            ("import { createRtsArmy } from './rtsArmy.js';\n", "import { createRtsArmy } from './rtsArmy.js';\nimport { createRtsRallyMarker } from './rtsRallyMarker.js';\n"),
            ("\tconst state = createScene(canvas);\n", "\tconst state = createScene(canvas);\n\tconst rallyMarker = createRtsRallyMarker(state.scene);\n"),
            ("\t\tconst commanded = army.commandMove(target);\n", "\t\tconst commanded = army.commandMove(target);\n\t\trallyMarker.show(target.x, sampleClampedGroundY(target.x, target.z), target.z, commanded);\n"),
            ("\t\tarmy.update(delta);\n", "\t\tarmy.update(delta);\n\t\trallyMarker.update(delta);\n"),
            ("\t\tarmy.dispose();\n", "\t\tarmy.dispose();\n\t\trallyMarker.dispose();\n"),
            ("\tframeId = requestAnimationFrame(tick);\n}\n", "\twindow.__WESTEROS_RTS_RALLY__ = { getSnapshot: rallyMarker.getSnapshot };\n\tframeId = requestAnimationFrame(tick);\n}\n"),
          ]
          for old, new in pairs:
            if text.count(old) != 1:
              raise SystemExit(f'unique rtsGame insertion anchor missing: {old!r}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          anchor = "// Run211 RTS keyboard-command parity: module-only shell entry; no new asset/cache role.\n"
          addition = "// Run212 RTS rally marker: module-only shell entry; procedural geometry adds no asset fetch.\nGAME3D_SHELL_FILES.push('./src/3d/rts/rtsRallyMarker.js');\n\n"
          if anchor not in text:
            raise SystemExit('Run211 service-worker anchor missing')
          text = text.replace(anchor, addition + anchor, 1)
          sw.write_text(text)
          PY
          node --check src/3d/rts/rtsRallyMarker.js
          node --check src/3d/rts/rtsGame.js
          node --check scripts/checkRun212RtsRallyMarker.js
          node --check service-worker.js
          git diff --check
          test "$(git diff --numstat origin/main -- src/3d/rts/rtsGame.js service-worker.js | awk '{s+=$2} END{print s+0}')" -eq 0
          node scripts/checkServiceWorkerCache.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/rts/rtsGame.js service-worker.js
          git diff --cached --check
          git commit -m 'feat(run212): wire RTS world-space rally marker'
          node scripts/checkAdditiveOnlyDiff.js "$(git rev-parse origin/main)" HEAD
      - name: Focused desktop mobile visual console and budget proof
        run: node scripts/checkRun212RtsRallyMarker.js
      - name: Full regression and PWA gates
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/post-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/post-smoke.log")" -ge 34
          node scripts/checkRun210RtsSurfaceTexture.js
          node scripts/checkRun210RtsSurfaceOffline.js
          node scripts/checkRun211RtsKeyboardShortcuts.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
      - name: Record verified evidence and checkpoint
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('artifacts/run212/proof.json', 'utf8'));
          const d = p.desktop.active.rts;
          const m = p.mobile.active.rts;
          fs.appendFileSync('perf_log.csv', `run212,2026-08-09,desktop-rts-rally,,${d.drawCalls},${d.triangles},,,,"one reusable world-space rally ring active; zero console/page errors"\n`);
          fs.appendFileSync('perf_log.csv', `run212,2026-08-09,mobile-rts-rally,,${m.drawCalls},${m.triangles},,,,"one reusable world-space rally ring active; mobile budget preserved; zero console/page errors"\n`);
          NODE
          cat >> 3D_GAME_PROGRESS.md <<'EOF'

          ## Run 212 — RTS world-space rally destination marker
          - Started from `main` `897001280c891095819a5129b545eec4e43afe1e` after re-reading governance, Run211 progress, ADR-0229 and owner-gated questions. Radius-5, `game3d.js` split and world-event checksum remain untouched.
          - Added isolated `rtsRallyMarker.js`: only successful existing Move commands show one short-lived procedural gold ring at the existing clamped terrain height. `issueMoveAt()` and `army.commandMove()` remain the sole command owners; formation, selection, camera, seeded world and terrain behavior are unchanged.
          - Memory/render discipline: one reusable `RingGeometry` and one `MeshBasicMaterial`, allocated once, hidden after 1.6 seconds, reused on later commands and explicitly disposed. No texture, asset, timer, extra RAF or network fetch.
          - Focused Chromium proof covers desktop plus true mobile/touch context, successful movement status, 48/48 selection preservation, marker expiry, render budgets, two visual screenshots and zero console/page errors.
          - Full gates: pre/post 34+ browser smoke, Run210 online/offline surface, Run211 keyboard parity, mobile perf, PWA installability/cache, seeded RNG, world-reference map/water/alignment/hydrology, 14-seat terrain safety and road connectivity all PASS.
          - Coverage unchanged: desktop 96.2%; mobile radius-4 81 chunks / 20.25 km² (~14.7%). Technical debt: 0 new live-runtime architectural items. Risk LOW; confidence 5/5.
          - Next safe step: continue isolated RTS selection/unit readability using existing instancing/material ownership; do not enter owner-gated radius-5, `game3d.js` split or world-event checksum work.
          EOF
          cat >> DECISIONS.md <<'EOF'

          ## ADR-0230 — Show successful RTS move destinations with one bounded procedural world-space marker
          **Risk:** LOW

          **Decision:** Instantiate one reusable ring mesh through `src/3d/rts/rtsRallyMarker.js`. The established `issueMoveAt()` path keeps ray projection and `army.commandMove()` ownership; only a positive commanded count triggers the marker at the target X/Z and existing clamped terrain sampler Y. The marker fades after 1.6 seconds and is reused.

          **Why:** Run208's screen-space click cross confirms input receipt but does not stay attached to the world when the camera moves. A bounded world-space ring adds destination readability without creating a second command-coordinate authority.

          **Alternatives:** Persistent rally flags add state/cleanup semantics; textured decals add cache/provenance/texture memory; duplicate raycasting outside `rtsGame.js` creates competing command ownership. All were rejected.

          **Consequences:** One extra draw call only while visible; one geometry/material pair is allocated once and disposed. Desktop/mobile budgets, 2D, character mode, terrain, roads, castles, water, deterministic movement and PWA behavior remain unchanged except for precaching the new JS module.

          **Rollback:** An owner-approved future additive override can stop instantiating/showing this marker; the pre-existing move command path remains independent.
          EOF
          TAG="stable-$(TZ=Europe/Istanbul date +%Y-%m-%d-%H%M)"
          echo "$TAG — Run212 RTS world-space rally marker; focused desktop/mobile proof plus full smoke/PWA/determinism gates passed." >> STABLE_TAGS.md
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          git add 3D_GAME_PROGRESS.md DECISIONS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run212): record rally marker evidence and checkpoint'
      - name: Final remote-main concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "897001280c891095819a5129b545eec4e43afe1e"
          test "$(git merge-base HEAD origin/main)" = "$CURRENT_MAIN"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
          test "$(git diff --numstat "$CURRENT_MAIN"...HEAD | awk '{s+=$2} END{print s+0}')" -eq 0
      - name: Push verified branch and stable tag
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "897001280c891095819a5129b545eec4e43afe1e"
          git push origin HEAD:agent/run212-rts-rally-marker-v2
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run212-rts-rally-proof-v2
          path: artifacts/run212
          if-no-files-found: ignore
