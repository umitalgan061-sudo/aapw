name: settlement-service-handoff-checklist

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceHandoffChecklist.js'
      - 'scripts/checkSettlementServiceHandoffChecklist.mjs'
      - '.github/workflows/settlement-service-handoff-checklist.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/settlementServiceHandoffChecklist.js'
      - 'scripts/checkSettlementServiceHandoffChecklist.mjs'
      - '.github/workflows/settlement-service-handoff-checklist.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact main ancestry and focused scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)
            test "$count" -eq 3
            printf '%s\n' "$files" | grep -Fx 'src/3d/gameplay/settlementServiceHandoffChecklist.js'
            printf '%s\n' "$files" | grep -Fx 'scripts/checkSettlementServiceHandoffChecklist.mjs'
            printf '%s\n' "$files" | grep -Fx '.github/workflows/settlement-service-handoff-checklist.yml'
            changed=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk '{a+=$1; d+=$2} END {print a+d+0}')
            test "$changed" -le 3000
          fi
      - name: Syntax
        run: |
          node --check src/3d/gameplay/settlementServiceHandoffChecklist.js
          node --check scripts/checkSettlementServiceHandoffChecklist.mjs
      - name: Executable contract
        run: node scripts/checkSettlementServiceHandoffChecklist.mjs
      - name: Runtime/editor boundary
        run: |
          ! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline" src/3d/gameplay/settlementServiceHandoffChecklist.js
