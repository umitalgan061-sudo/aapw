name: Buzul Muhafızı Terrain PBR Signal v9

on:
  push:
    branches:
      - buzul-muhafizi/exact-main-terrain-pbr-signal-v9-20260908
  pull_request:
    paths:
      - src/3d/world/terrainPbrSignalRouter.js
      - scripts/checkTerrainPbrSignalRouter.mjs
      - .github/workflows/buzul-muhafizi-terrain-pbr-signal-v9.yml

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Exact main ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          base="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --numstat "$base"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$changed" -le 3000
          test "$(git diff --name-only "$base"...HEAD | wc -l)" -eq 3
      - name: Syntax
        run: node --check src/3d/world/terrainPbrSignalRouter.js && node --check scripts/checkTerrainPbrSignalRouter.mjs
      - name: Deterministic terrain PBR contract
        run: node scripts/checkTerrainPbrSignalRouter.mjs
      - name: Runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/world/terrainPbrSignalRouter.js scripts/checkTerrainPbrSignalRouter.mjs
      - name: Diff hygiene
        run: git diff --check
