name: player third-person camera director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerThirdPersonCameraDirector.js'
      - 'scripts/checkPlayerThirdPersonCameraDirector.mjs'
      - '.github/workflows/player-third-person-camera-director.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: exact main ancestry
        run: git merge-base --is-ancestor origin/main HEAD
      - name: focused scope and diff budget
        run: |
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = ".github/workflows/player-third-person-camera-director.yml scripts/checkPlayerThirdPersonCameraDirector.mjs src/3d/gameplay/playerThirdPersonCameraDirector.js "
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
      - name: syntax
        run: node --check src/3d/gameplay/playerThirdPersonCameraDirector.js && node --check scripts/checkPlayerThirdPersonCameraDirector.mjs
      - name: executable contract
        run: node scripts/checkPlayerThirdPersonCameraDirector.mjs
      - name: editor/runtime boundary
        run: '! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline" src/3d/gameplay/playerThirdPersonCameraDirector.js'
      - name: diff hygiene
        run: git diff --check origin/main...HEAD
