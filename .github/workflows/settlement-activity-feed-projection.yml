name: Settlement Activity Feed Projection
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementActivityFeedProjection.js'
      - 'scripts/checkSettlementActivityFeedProjection.mjs'
      - '.github/workflows/settlement-activity-feed-projection.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/settlementActivityFeedProjection.js && node --check scripts/checkSettlementActivityFeedProjection.mjs
      - name: Regression
        run: node scripts/checkSettlementActivityFeedProjection.mjs
      - name: Determinism
        run: |
          node scripts/checkSettlementActivityFeedProjection.mjs > /tmp/feed-a.json
          node scripts/checkSettlementActivityFeedProjection.mjs > /tmp/feed-b.json
          diff -u /tmp/feed-a.json /tmp/feed-b.json
      - name: Runtime editor boundary
        run: |
          ! grep -nE "EditorMaterialStudio|document\\.|window\\.|three" src/3d/gameplay/settlementActivityFeedProjection.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
