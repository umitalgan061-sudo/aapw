name: NPC Guard Assist Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardAssistLifecycle.mjs'
      - 'scripts/checkNpcGuardPerception.mjs'
      - 'scripts/checkNpcGuardAttack.mjs'
      - 'scripts/checkNpcGuardLeash.mjs'
      - '.github/workflows/npc-guard-assist-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 1000
          git diff --check "$BASE_SHA" HEAD
      - name: Guard group-AI lifecycle regressions
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/npc.js
          node --check scripts/checkNpcGuardAssistLifecycle.mjs
          node scripts/checkNpcGuardAssistLifecycle.mjs
          node scripts/checkNpcGuardPerception.mjs
          node scripts/checkNpcGuardAttack.mjs
          node scripts/checkNpcGuardLeash.mjs
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
