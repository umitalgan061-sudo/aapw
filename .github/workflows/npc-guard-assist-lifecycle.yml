name: NPC Guard Assist Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/3d/gameplay/npc.js'
      - 'scripts/checkNpcGuardAssistLifecycle.mjs'
      - 'scripts/checkNpcGuardAssistIsolation.mjs'
      - 'scripts/checkNpcGuardAssistLifecycleBrowser.js'
      - 'scripts/checkNpcGuardPerception.mjs'
      - 'scripts/checkNpcGuardAttack.mjs'
      - 'scripts/checkNpcGuardLeash.mjs'
      - '.github/workflows/npc-guard-assist-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --numstat "$BASE_SHA" HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          test "$CHANGED" -le 3000
          git diff --check "$BASE_SHA" HEAD
      - name: NPC runtime syntax
        run: |
          set -euo pipefail
          node --check src/3d/gameplay/npc.js
          node --check scripts/checkNpcGuardAssistLifecycle.mjs
          node --check scripts/checkNpcGuardAssistIsolation.mjs
          node --check scripts/checkNpcGuardAssistLifecycleBrowser.js
      - name: Guard assist lifecycle regression
        run: node scripts/checkNpcGuardAssistLifecycle.mjs
      - name: Guard assist isolation regression
        run: node scripts/checkNpcGuardAssistIsolation.mjs
      - name: Guard perception regression
        run: node scripts/checkNpcGuardPerception.mjs
      - name: Guard attack regression
        run: node scripts/checkNpcGuardAttack.mjs
      - name: Guard leash regression
        run: node scripts/checkNpcGuardLeash.mjs
      - name: Seeded randomness contract
        run: node scripts/checkSeededRandomPolicy.js
      - name: Shared service-worker contract
        id: shared_pwa
        continue-on-error: true
        run: node scripts/checkServiceWorkerCache.js
      - name: Shared material placement contract
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Install Chromium outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Prepare focused NPC browser docroot
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/npc-browser-root"
          rm -rf "$root"
          mkdir -p "$root"
          ln -s "$GITHUB_WORKSPACE/src" "$root/src"
          cat > "$root/game3d.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <script type="importmap">
          {"imports":{"three":"./src/3d/vendor/three/three.module.js","three/addons/":"./src/3d/vendor/three/addons/"}}
          </script>
          HTML
          echo "NPC_BROWSER_ROOT=$root" >> "$GITHUB_ENV"
      - name: Real shipped Three.js guard assist proof
        run: cd "$NPC_BROWSER_ROOT" && node "$GITHUB_WORKSPACE/scripts/checkNpcGuardAssistLifecycleBrowser.js"
      - name: Final exact-main freshness
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Enforce shared PWA gate
        if: ${{ always() }}
        shell: bash
        env:
          SHARED_PWA_OUTCOME: ${{ steps.shared_pwa.outcome }}
        run: |
          set -euo pipefail
          test "$SHARED_PWA_OUTCOME" = "success"
