name: Run 198 Lifecycle Reinit Preflight

on:
  push:
    branches: [chatgpt/run198-lifecycle-reinit-final]
    paths:
      - 'scripts/checkCurrentLifecycleReinitShadow.js'
      - 'scripts/recordRun198CurrentLifecycleReinitShadow.js'
      - '.github/workflows/run198-lifecycle-reinit-preflight.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: 0128166a5c92caf49377159be2b1d393ef33b0d0
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Session snapshot additive freeze and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -F '## Run 197 — Real game-tick simulation freeze/resume transaction preflight' 3D_GAME_PROGRESS.md
          grep -F '## ADR-0217 — Canonical transaction may freeze the unchanged real game tick only through reversible instance method gates' DECISIONS.md
          if grep -q '^## Run 198 ' 3D_GAME_PROGRESS.md; then echo 'Run198 already occupied on main'; exit 1; fi
          if grep -q '^## ADR-0218 ' DECISIONS.md; then echo 'ADR-0218 already occupied on main'; exit 1; fi
          node --check scripts/checkCurrentLifecycleReinitShadow.js
          node --check scripts/recordRun198CurrentLifecycleReinitShadow.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git diff --quiet "$BASE_SHA" HEAD -- src game3d.html game3d.css service-worker.js index.html script.js style.css manifest.json assets_manifest.json
          if grep -q '__RUN198_LIVE_STATES__' src/3d/game3d.js; then echo 'Run198 hook leaked into live source'; exit 1; fi
          test "$(wc -l < scripts/checkCurrentLifecycleReinitShadow.js)" -lt 600

      - name: Baseline full browser smoke on current main
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/run198-baseline"
          git worktree add --detach "$BASELINE" "$BASE_SHA"
          (cd "$BASELINE" && node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run198-smoke-before.log")
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run198-smoke-before.log")" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run198-smoke-before.log" | grep -F 'zero console/page errors'
          git worktree remove "$BASELINE"

      - name: Prior canonical transaction invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCanonicalStoneBridgeTraversalReadiness.js
          node scripts/checkCanonicalRoadBridgeSceneShadow.js
          node scripts/checkCanonicalSceneShadowAdapter.js
          node scripts/checkClippedCanonicalWindowOwnershipShadow.js
          node scripts/checkOptInMigrationControllerShadow.js
          node scripts/checkCurrentRuntimeIntegrationShadow.js
          node scripts/checkCurrentTickOwnershipShadow.js

      - name: Run198 ordered pagehide and clean reinit proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCurrentLifecycleReinitShadow.js | tee "$RUNNER_TEMP/run198-lifecycle.log"
          SUMMARY="$(grep '^\[checkCurrentLifecycleReinitShadow\] PASS:' "$RUNNER_TEMP/run198-lifecycle.log" | tail -n1 | sed 's/^\[checkCurrentLifecycleReinitShadow\] PASS: //')"
          LIFECYCLE="$(grep '^\[checkCurrentLifecycleReinitShadow\] LIFECYCLE:' "$RUNNER_TEMP/run198-lifecycle.log" | tail -n1 | sed 's/^\[checkCurrentLifecycleReinitShadow\] LIFECYCLE: //')"
          test -n "$SUMMARY"; test -n "$LIFECYCLE"
          echo "RUN198_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          echo "RUN198_LIFECYCLE_JSON=$LIFECYCLE" >> "$GITHUB_ENV"
          test -s artifacts/run198-current-lifecycle-reinit-shadow/proof.json
          test -s artifacts/run198-current-lifecycle-reinit-shadow/first-canonical-active.png
          test -s artifacts/run198-current-lifecycle-reinit-shadow/second-reinit-canonical-active.png

      - name: Canonical world determinism and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/checkFullReferenceMigrationDryRun.js
          node scripts/checkWorldReferenceMigrationDryRun.js
          node scripts/checkCanonicalHydrologyTerrainShadow.js
          node scripts/checkCanonicalChunkIntegrationShadow.js
          node scripts/checkCanonicalRockPlacementShadow.js --verify-fixture
          node scripts/checkCanonicalRockGeometryShadow.js --verify-fixture
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkTerrainVisualContract.js
          node scripts/checkVegetationVisualContract.js
          node scripts/checkWaterVisualContract.js
          node scripts/checkSkyVisualContract.js
          node scripts/checkFogVisualContract.js
          node scripts/checkLightingVisualContract.js
          node scripts/checkStarfieldVisualContract.js
          node scripts/checkCameraContract.js
          node scripts/checkWindGrassContractRun180.js
          node scripts/checkWindGrassSceneIntegrationRun180.js
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkSeededRandomPolicy.js

      - name: PWA accessibility input and physics gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkAssetsManifest.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkControlsHelpAccessibility.js
          node scripts/checkDayNightClockAccessibility.js
          node scripts/checkDialogueBoxAccessibility.js
          node scripts/checkHealthBarAccessibility.js
          node scripts/checkInteractionPromptAccessibility.js
          node scripts/checkSettlementCompassAccessibility.js
          node scripts/checkSettlementDiscoveryAccessibility.js
          node scripts/checkWorldEventToastAccessibility.js
          node scripts/checkKeyboardInputContract.js
          node scripts/checkTouchJoystickInputContract.js
          node scripts/checkMobileJumpControl.js
          node scripts/checkJumpArcContract.js
          node scripts/checkSmokeCheckRegistry.js

      - name: Mobile streaming LOD and live budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkMobileChunkStreaming.js
          node scripts/checkMobileRadius4LiveWorld.js
          node scripts/checkMobileTerrainLod.js
          node scripts/checkMobileVegetationLod.js
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run198-mobile.log"
          LIVE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run198-mobile.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          test -n "$LIVE"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$LIVE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$LIVE")"
          test "$DRAW" -lt 500; test "$TRI" -lt 500000
          echo "RUN198_LIVE_MOBILE_JSON=$LIVE" >> "$GITHUB_ENV"

      - name: Full browser smoke and console gate after Run198
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run198-smoke-after.log"
          PASS_COUNT="$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run198-smoke-after.log")"
          test "$PASS_COUNT" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run198-smoke-after.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run198-smoke-after.log"; then exit 1; fi
          echo "RUN198_SMOKE_PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"

      - name: Performance snapshot and trend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collectPerfSnapshot.js run198 | tee "$RUNNER_TEMP/run198-perf.log"
          ROW="$(tail -n1 perf_log.csv)"
          echo "$ROW" | grep -F ',run198,'
          echo "RUN198_PERF_ROW=$ROW" >> "$GITHUB_ENV"
          node scripts/analyzePerfTrend.js

      - name: Senior self review and final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(TEMP|HACK|FIXME|WORKAROUND)\b' scripts/checkCurrentLifecycleReinitShadow.js scripts/recordRun198CurrentLifecycleReinitShadow.js; then exit 1; fi
          node scripts/checkCurrentLifecycleReinitShadow.js > "$RUNNER_TEMP/run198-final.log"
          grep -F '[checkCurrentLifecycleReinitShadow] PASS:' "$RUNNER_TEMP/run198-final.log"
          node scripts/checkCurrentTickOwnershipShadow.js >/dev/null
          node scripts/checkCurrentRuntimeIntegrationShadow.js >/dev/null
          node scripts/checkServiceWorkerCache.js
          node scripts/checkSmokeCheckRegistry.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git diff --quiet "$BASE_SHA" HEAD -- src game3d.html game3d.css service-worker.js index.html script.js style.css manifest.json assets_manifest.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git show origin/main:3D_GAME_PROGRESS.md | grep -q '^## Run 198 '; then echo 'Run198 occupied before publish'; exit 1; fi
          if git show origin/main:DECISIONS.md | grep -q '^## ADR-0218 '; then echo 'ADR-0218 occupied before publish'; exit 1; fi

      - name: Upload Run198 evidence
        uses: actions/upload-artifact@v4
        with:
          name: run198-current-lifecycle-reinit-shadow
          path: |
            artifacts/run198-current-lifecycle-reinit-shadow/proof.json
            artifacts/run198-current-lifecycle-reinit-shadow/first-canonical-active.png
            artifacts/run198-current-lifecycle-reinit-shadow/second-reinit-canonical-active.png
          if-no-files-found: error

      - name: Record validated Run198 checkpoint on branch
        shell: bash
        run: |
          set -euo pipefail
          export RUN198_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          export RUN198_STABLE_TAG="stable-$(date -u +'%Y-%m-%d-%H%M')"
          export RUN198_SUMMARY RUN198_LIFECYCLE_JSON RUN198_LIVE_MOBILE_JSON RUN198_SMOKE_PASS_COUNT RUN198_PERF_ROW
          node scripts/recordRun198CurrentLifecycleReinitShadow.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md DECISIONS.md STABLE_TAGS.md perf_log.csv
          git commit -m 'docs(run198): record validated lifecycle reinit checkpoint'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git show origin/main:3D_GAME_PROGRESS.md | grep -q '^## Run 198 '; then echo 'Run198 occupied immediately before branch publish'; exit 1; fi
          if git show origin/main:DECISIONS.md | grep -q '^## ADR-0218 '; then echo 'ADR-0218 occupied immediately before branch publish'; exit 1; fi
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "$RUN198_STABLE_TAG"
          git push origin "$RUN198_STABLE_TAG" || echo '[run198] stable tag push unavailable; STABLE_TAGS record retained per governance known limitation.'
