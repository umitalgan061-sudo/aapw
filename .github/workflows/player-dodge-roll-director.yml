name: player-dodge-roll-director
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerDodgeRollDirector.js'
      - 'scripts/checkPlayerDodgeRollDirector.mjs'
      - '.github/workflows/player-dodge-roll-director.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerDodgeRollDirector.js && node --check scripts/checkPlayerDodgeRollDirector.mjs
      - name: Executable regression
        run: node scripts/checkPlayerDodgeRollDirector.mjs
      - name: Ownership boundary
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" src/3d/gameplay/playerDodgeRollDirector.js scripts/checkPlayerDodgeRollDirector.mjs
      - name: Diff hygiene
        run: git diff --check
