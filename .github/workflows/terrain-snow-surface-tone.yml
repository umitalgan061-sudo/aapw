name: Terrain Snow Surface Tone

on:
  pull_request:
    paths:
      - 'src/3d/world/terrainSnowSurfaceTone.js'
      - 'src/3d/world/terrainBiomeShading.js'
      - 'scripts/checkTerrainSnowSurfaceTone.mjs'
      - 'scripts/checkGlacialSnowPaletteHarmony.mjs'
      - 'scripts/checkShelteredGlacialPackedFloor.mjs'
      - 'scripts/checkGlacialSnowPaletteFloor.mjs'
      - 'scripts/checkTransitionSnowPaletteHarmony.mjs'
      - 'scripts/checkGlacialAccumulatedPaletteRetention.mjs'
      - '.github/workflows/terrain-snow-surface-tone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-snow-surface-tone:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          node --check src/3d/world/terrainSnowSurfaceTone.js
          node --check src/3d/world/terrainBiomeShading.js
          node --check scripts/checkTerrainSnowSurfaceTone.mjs
          node --check scripts/checkGlacialSnowPaletteHarmony.mjs
          node --check scripts/checkShelteredGlacialPackedFloor.mjs
          node --check scripts/checkGlacialSnowPaletteFloor.mjs
          node --check scripts/checkTransitionSnowPaletteHarmony.mjs
          node --check scripts/checkGlacialAccumulatedPaletteRetention.mjs

      - name: Snow surface tone contract
        run: node scripts/checkTerrainSnowSurfaceTone.mjs

      - name: Glacial snow palette harmony contract
        run: node scripts/checkGlacialSnowPaletteHarmony.mjs

      - name: Sheltered glacial packed-floor contract
        run: node scripts/checkShelteredGlacialPackedFloor.mjs

      - name: Glacial snow palette floor contract
        run: node scripts/checkGlacialSnowPaletteFloor.mjs

      - name: Transition snow palette harmony contract
        run: node scripts/checkTransitionSnowPaletteHarmony.mjs

      - name: Glacial accumulated palette retention contract
        run: node scripts/checkGlacialAccumulatedPaletteRetention.mjs
