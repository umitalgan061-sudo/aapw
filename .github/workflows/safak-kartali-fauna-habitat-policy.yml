name: safak-kartali-fauna-habitat-policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaHabitatPolicy.js'
      - 'scripts/checkSafakKartaliFaunaHabitatPolicy.mjs'
      - '.github/workflows/safak-kartali-fauna-habitat-policy.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax gate
        run: node --check src/3d/gameplay/livingWorldFaunaHabitatPolicy.js && node --check scripts/checkSafakKartaliFaunaHabitatPolicy.mjs
      - name: Runtime proof
        run: node scripts/checkSafakKartaliFaunaHabitatPolicy.mjs
      - name: Runtime boundary guard
        run: '! grep -R "EditorMaterialStudio" src/3d/gameplay/livingWorldFaunaHabitatPolicy.js scripts/checkSafakKartaliFaunaHabitatPolicy.mjs'
      - name: Scope guard
        run: test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
