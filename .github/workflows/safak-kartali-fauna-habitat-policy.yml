name: safak-kartali-fauna-habitat-policy

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/livingWorldFaunaHabitatPolicy.js'
      - 'scripts/checkSafakKartaliFaunaHabitatPolicy.mjs'
      - '.github/workflows/safak-kartali-fauna-habitat-policy.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-main ancestry gate
        run: |
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Syntax gate
        run: node --check src/3d/gameplay/livingWorldFaunaHabitatPolicy.js && node --check scripts/checkSafakKartaliFaunaHabitatPolicy.mjs
      - name: Runtime proof
        run: node scripts/checkSafakKartaliFaunaHabitatPolicy.mjs
      - name: Runtime boundary and determinism guard
        run: |
          ! grep -R "EditorMaterialStudio" src/3d/gameplay/livingWorldFaunaHabitatPolicy.js scripts/checkSafakKartaliFaunaHabitatPolicy.mjs
          ! grep -R "Math\.random(" src/3d/gameplay/livingWorldFaunaHabitatPolicy.js
      - name: Scope guard
        run: |
          changed=$(git diff --numstat origin/main...HEAD -- \
            src/3d/gameplay/livingWorldFaunaHabitatPolicy.js \
            scripts/checkSafakKartaliFaunaHabitatPolicy.mjs \
            .github/workflows/safak-kartali-fauna-habitat-policy.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
