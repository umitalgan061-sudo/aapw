name: Settlement Reward Claim Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementRewardClaimPlan.ts'
      - 'scripts/checkSettlementRewardClaimPlan.mjs'
      - '.github/workflows/settlement-reward-claim-plan.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/checkSettlementRewardClaimPlan.mjs
      - run: node --check scripts/checkSettlementRewardClaimPlan.mjs
      - run: node --check src/3d/gameplay/settlementRewardClaimPlan.ts
