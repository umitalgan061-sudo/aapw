name: Kizil Ufuk player animation blend plan
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerAnimationBlendPlan.js'
      - 'scripts/checkPlayerAnimationBlendPlan.mjs'
      - '.github/workflows/player-animation-blend-plan.yml'
  push:
    branches: [main]
    paths:
      - 'src/3d/gameplay/playerAnimationBlendPlan.js'
      - 'scripts/checkPlayerAnimationBlendPlan.mjs'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: exact ancestry and scope
        run: |
          git diff --check
          test "$(git rev-parse --is-shallow-repository)" = false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
            count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)
            test "$count" -le 3
            lines=$(git diff --numstat "${{ github.event.pull_request.base.sha }}"...HEAD | awk '{a+=$1;d+=$2} END{print a+d+0}')
            test "$lines" -le 3000
          fi
      - name: syntax
        run: node --check src/3d/gameplay/playerAnimationBlendPlan.js
      - name: focused contract
        run: node scripts/checkPlayerAnimationBlendPlan.mjs
      - name: runtime editor boundary
        run: '! grep -R "EditorMaterialStudio" -n src/3d/gameplay/playerAnimationBlendPlan.js'
