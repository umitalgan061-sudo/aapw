name: Player Attack Windup Steering

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/player.js'
      - 'scripts/checkPlayerAttackWindupSteering.mjs'
      - '.github/workflows/player-attack-windup-steering.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-main bounded scope
        shell: bash
        run: |
          git fetch origin main
          BASE=$(git merge-base HEAD origin/main)
          test "$BASE" = "$(git rev-parse origin/main)"
          CHANGED=$(git diff --name-only "$BASE"..HEAD)
          printf '%s\n' "$CHANGED"
          printf '%s\n' "$CHANGED" | grep -Ev '^(src/3d/gameplay/player\.js|scripts/checkPlayerAttackWindupSteering\.mjs|\.github/workflows/player-attack-windup-steering\.yml)$' && exit 1 || true
          TOTAL=$(git diff --numstat "$BASE"..HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$TOTAL" -le 1000
      - name: Syntax
        run: node --check src/3d/gameplay/player.js && node --check scripts/checkPlayerAttackWindupSteering.mjs
      - name: Windup steering contract
        run: node scripts/checkPlayerAttackWindupSteering.mjs
      - name: Shared Material Placement Contract
        run: node scripts/checkSharedMaterialPlacementContract.mjs
      - name: Final main freshness
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
