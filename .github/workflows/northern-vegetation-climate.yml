name: Northern Vegetation Climate

on:
  pull_request:
    paths:
      - 'src/3d/world/vegetation.js'
      - 'src/3d/world/terrainBiomeShading.js'
      - 'scripts/checkNorthernVegetationClimate.mjs'
      - 'scripts/checkNorthernVegetationRuntime.mjs'
      - 'scripts/checkNorthernVegetationDeterminism.mjs'
      - 'scripts/checkTerrainGeographicPalette.mjs'
      - 'scripts/checkNorthClimateContinuity.mjs'
      - '.github/workflows/northern-vegetation-climate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  northern-vegetation-climate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve vendored Three.js for Node contracts
        run: node scripts/setupNodeThreeShim.mjs
      - name: Syntax
        run: |
          node --check src/3d/world/vegetation.js
          node --check scripts/checkNorthernVegetationClimate.mjs
          node --check scripts/checkNorthernVegetationRuntime.mjs
          node --check scripts/checkNorthernVegetationDeterminism.mjs
          node --check scripts/checkTerrainGeographicPalette.mjs
          node --check scripts/checkNorthClimateContinuity.mjs
      - name: Northern vegetation climate contract
        run: node scripts/checkNorthernVegetationClimate.mjs
      - name: Northern vegetation runtime scatter
        run: node scripts/checkNorthernVegetationRuntime.mjs
      - name: Northern vegetation determinism
        run: node scripts/checkNorthernVegetationDeterminism.mjs
      - name: Geographic terrain palette
        run: node scripts/checkTerrainGeographicPalette.mjs
      - name: North climate continuity
        run: node scripts/checkNorthClimateContinuity.mjs
