name: SE G65 Terrain3D Near Detail R3

on:
  push:
    branches:
      - agent/kizil-ufuk-g65-near-detail-r3-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'godot/terrain-authoring/geocells/se/g65_near_detail.mjs'
      - 'godot/terrain-authoring/scripts/validate_g65_terrain3d_near_detail.gd'
      - 'scripts/checkSEG65NearDetail.mjs'
      - 'scripts/checkSEG65NearDetailVisual.mjs'
      - '.github/workflows/se-g65-terrain3d-near-detail-r3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g65-terrain3d-near-detail-r3-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test -n "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/se/g65_near_detail.mjs|godot/terrain-authoring/scripts/validate_g65_terrain3d_near_detail.gd|scripts/checkSEG65NearDetail.mjs|scripts/checkSEG65NearDetailVisual.mjs|\.github/workflows/se-g65-terrain3d-near-detail-r3.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_hydrology.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_biome.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_relief.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_rock_snow.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/geocells/se/g65_road_path.mjs
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- service-worker.js

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Reprove merged G65 layers and deterministic Near Detail
        run: |
          set -euo pipefail
          node scripts/checkSEG65Hydrology.mjs | tee "$RUNNER_TEMP/g65-hydrology.log"
          grep -F 'SE_G65_HYDROLOGY_SOURCE_OK' "$RUNNER_TEMP/g65-hydrology.log"
          node scripts/checkSEG65Biome.mjs | tee "$RUNNER_TEMP/g65-biome.log"
          grep -F 'SE_G65_BIOME_OK' "$RUNNER_TEMP/g65-biome.log"
          node scripts/checkSEG65Relief.mjs | tee "$RUNNER_TEMP/g65-relief.log"
          grep -F 'SE_G65_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/g65-relief.log"
          node scripts/checkSEG65RockSnow.mjs | tee "$RUNNER_TEMP/g65-rock-snow.log"
          grep -F 'SE_G65_ROCK_SNOW_VALIDATION_OK' "$RUNNER_TEMP/g65-rock-snow.log"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65RoadPath.mjs | tee "$RUNNER_TEMP/g65-road-path.log"
          grep -F 'SE_G65_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/g65-road-path.log"
          node --check godot/terrain-authoring/geocells/se/g65_near_detail.mjs
          node --check scripts/checkSEG65NearDetail.mjs
          node --check scripts/checkSEG65NearDetailVisual.mjs
          node scripts/checkSEG65NearDetail.mjs | tee "$RUNNER_TEMP/g65-near-a.log"
          node scripts/checkSEG65NearDetail.mjs | tee "$RUNNER_TEMP/g65-near-b.log"
          cmp "$RUNNER_TEMP/g65-near-a.log" "$RUNNER_TEMP/g65-near-b.log"
          grep -F 'SE_G65_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g65-near-a.log"
          node scripts/checkSEG65NearDetail.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g65-near-detail-probe.json
          test -s godot/terrain-authoring/.terrain3d-proof/g65-near-detail-probe.json

      - name: Three.js near far and full-world visual evidence
        run: |
          set -euo pipefail
          OUT='artifacts/se-g65-near-detail-visual'
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkSEG65NearDetailVisual.mjs --out-dir="$OUT" | tee "$RUNNER_TEMP/g65-visual.log"
          grep -F 'SE_G65_NEAR_DETAIL_VISUAL_OK' "$RUNNER_TEMP/g65-visual.log"
          test -s "$OUT/g65-near.png"
          test -s "$OUT/g65-far.png"
          test -s "$OUT/g65-full-world-topdown.png"

      - name: Install pinned Terrain3D and preserve HTerrain
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.godot.before-terrain3d"
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          grep -F 'res://addons/zylann.hterrain/plugin.cfg' godot/terrain-authoring/project.godot
          grep -F 'res://addons/terrain_3d/plugin.cfg' godot/terrain-authoring/project.godot

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real 257x257 Height Control Color four-region seam persistence and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/t3d-editor.log"
          if grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/t3d-editor.log"; then exit 1; fi
          G65_NEAR_DETAIL_PROOF_SUFFIX=a timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_near_detail.gd 2>&1 | tee "$RUNNER_TEMP/g65-near-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-near-detail-imported-topdown.png "$RUNNER_TEMP/g65-near-a.png"
          G65_NEAR_DETAIL_PROOF_SUFFIX=b timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_near_detail.gd 2>&1 | tee "$RUNNER_TEMP/g65-near-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g65-near-detail-imported-topdown.png "$RUNNER_TEMP/g65-near-b.png"
          grep -F 'SE_G65_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g65-near-t3d-a.log"
          grep -F 'SE_G65_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g65-near-t3d-b.log"
          cmp "$RUNNER_TEMP/g65-near-a.png" "$RUNNER_TEMP/g65-near-b.png"
          python3 - "$RUNNER_TEMP/g65-near-t3d-a.log" "$RUNNER_TEMP/g65-near-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G65_TERRAIN3D_NEAR_DETAIL_METRICS='):
                      return json.loads(line.split('=', 1)[1])
              raise SystemExit('G65 Near Detail Terrain3D metrics missing')
          a, b = metrics(sys.argv[1]), metrics(sys.argv[2])
          stable = ('terrain3dVersion','regionSize','regionCount','alignedSamples','seamSamples','materialSeamSamples','maxHeightError','maxBlendError','maxColorError','maxRoughnessError','maxSeamHeightError','maxSeamBlendError','maxSeamColorError','maxSeamRoughnessError','outputChecksum','phantomRoadSamples','phantomPathSamples','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert str(a['terrain3dVersion']).startswith('1.0.2')
          assert a['regionCount'] >= 4 and a['savedRegionFiles'] >= 4
          assert a['alignedSamples'] == 4225 and a['seamSamples'] == 48 and a['materialSeamSamples'] == 20
          assert a['maxHeightError'] <= 0.012 and a['maxBlendError'] <= 0.006
          assert a['maxColorError'] <= 0.006 and a['maxRoughnessError'] <= 0.006
          assert a['maxSeamHeightError'] <= 0.02 and a['maxSeamBlendError'] <= 0.006
          assert a['maxSeamColorError'] <= 0.006 and a['maxSeamRoughnessError'] <= 0.006
          assert a['phantomRoadSamples'] == 0 and a['phantomPathSamples'] == 0
          assert a['bakedSurfaces'] >= 1 and a['bakedVertices'] > 0
          print('SE_G65_TERRAIN3D_NEAR_DETAIL_STABLE_OK')
          PY

      - name: HTerrain world platform mobile PWA and browser regressions
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - name: Restore authoring bootstrap mutations
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/project.godot.before-terrain3d"; then cp "$RUNNER_TEMP/project.godot.before-terrain3d" godot/terrain-authoring/project.godot; fi
          rm -rf godot/terrain-authoring/addons/terrain_3d
          git restore --worktree -- godot/terrain-authoring/addons/zylann.hterrain
          git clean -fdx -- godot/terrain-authoring/terrain_data
          git diff --exit-code -- godot/terrain-authoring/project.godot
          git diff --exit-code -- godot/terrain-authoring/addons/zylann.hterrain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g65-terrain3d-near-detail-r3-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g65-near-detail-probe.json
            godot/terrain-authoring/.terrain3d-proof/g65-near-detail-imported-topdown.png
            artifacts/se-g65-near-detail-visual/g65-near.png
            artifacts/se-g65-near-detail-visual/g65-far.png
            artifacts/se-g65-near-detail-visual/g65-full-world-topdown.png
            ${{ runner.temp }}/g65-visual.log
            ${{ runner.temp }}/g65-near-t3d-a.log
            ${{ runner.temp }}/g65-near-t3d-b.log
