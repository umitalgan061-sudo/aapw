name: Platform Runtime V4
on:
  pull_request:
    paths: [src/3d/modern/platformRuntimeV4.ts, tests/nextgen/platformRuntimeV4.test.ts, scripts/checkPlatformRuntimeV4.mjs, package.json, .github/workflows/platform-runtime-v4.yml]
  push:
    branches: [main]
    paths: [src/3d/modern/platformRuntimeV4.ts, tests/nextgen/platformRuntimeV4.test.ts, scripts/checkPlatformRuntimeV4.mjs, package.json, .github/workflows/platform-runtime-v4.yml]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify:platform-v4
      - run: npx tsc --noEmit
      - run: npx vitest run tests/nextgen/platformRuntimeV4.test.ts
