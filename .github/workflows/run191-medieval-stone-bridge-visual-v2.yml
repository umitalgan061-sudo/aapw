name: Run 191 Medieval Stone Bridge Visual V2

on:
  push:
    branches: [chatgpt/run191-medieval-stone-bridge-shadow]
    paths:
      - 'scripts/checkCanonicalStoneBridgeVisualEvidenceV2.js'
      - 'scripts/recordRun191VisualEvidenceV2.js'
      - '.github/workflows/run191-medieval-stone-bridge-visual-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 79e8a88695c0a57aacd471e9d2f71ccde38b4c12
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Concurrency syntax additive and core fixture gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node --check scripts/checkCanonicalStoneBridgeVisualEvidenceV2.js
          node --check scripts/recordRun191VisualEvidenceV2.js
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git diff --check
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture
          node scripts/checkRoadWaterPolicyComparison.js
          node scripts/checkServiceWorkerCache.js

      - name: Capture readable medieval bridge evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkCanonicalStoneBridgeVisualEvidenceV2.js | tee "$RUNNER_TEMP/run191-v2.log"
          SUMMARY="$(grep '^\[checkCanonicalStoneBridgeVisualEvidenceV2\] PASS:' "$RUNNER_TEMP/run191-v2.log" | tail -n1 | sed 's/^\[checkCanonicalStoneBridgeVisualEvidenceV2\] PASS: //')"
          test -n "$SUMMARY"
          test -s artifacts/run191-stone-bridges-v2/bridge-masonry-detail.png
          test -s artifacts/run191-stone-bridges-v2/bridge-long-perspective.png
          test -s artifacts/run191-stone-bridges-v2/visual-proof.json
          echo "RUN191_V2_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      - name: Upload readable Run 191 bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: run191-medieval-stone-bridge-readable-v2
          path: |
            artifacts/run191-stone-bridges-v2/bridge-masonry-detail.png
            artifacts/run191-stone-bridges-v2/bridge-long-perspective.png
            artifacts/run191-stone-bridges-v2/visual-proof.json
          if-no-files-found: error

      - name: Regression smoke determinism cache and mobile budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checkWorldEventDeterminism.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture
          node scripts/checkMobilePerfBudget.js | tee "$RUNNER_TEMP/run191-v2-mobile.log"
          SAMPLE="$(grep '^\[checkMobilePerfBudget\] sample ' "$RUNNER_TEMP/run191-v2-mobile.log" | tail -n1 | sed 's/^\[checkMobilePerfBudget\] sample //')"
          DRAW="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.drawCalls))' "$SAMPLE")"
          TRI="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.triangles))' "$SAMPLE")"
          test "$DRAW" -lt 500
          test "$TRI" -lt 500000
          node scripts/smokeTestGame3D.js | tee "$RUNNER_TEMP/run191-v2-smoke.log"
          test "$(grep -c '\[smokeTestGame3D\] PASS:' "$RUNNER_TEMP/run191-v2-smoke.log")" -ge 34
          grep -F '[smokeTestGame3D] PASS: 3D mode (game3d.html)' "$RUNNER_TEMP/run191-v2-smoke.log" | grep -F 'zero console/page errors'
          if grep -E '^\[smokeTestGame3D\] (FAIL|ERROR):' "$RUNNER_TEMP/run191-v2-smoke.log"; then exit 1; fi

      - name: Final concurrency and governance checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          node scripts/checkCanonicalStoneBridgeShadow.js --verify-fixture
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          echo "RUN191_V2_STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "RUN191_V2_STABLE_TAG=stable-$(date -u +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Record readable evidence and publish checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recordRun191VisualEvidenceV2.js
          node scripts/checkLatestRunUniqueness.js
          node scripts/checkCheckpointConsistency.js
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3D_GAME_PROGRESS.md STABLE_TAGS.md
          git diff --cached --check
          git commit -m "test(world): record readable medieval bridge visual proof"
          node scripts/checkAdditiveOnlyDiff.js "$BASE_SHA" HEAD
          git push origin HEAD:chatgpt/run191-medieval-stone-bridge-shadow
          if ! git ls-remote --tags origin "refs/tags/$RUN191_V2_STABLE_TAG" | grep -q .; then
            git tag "$RUN191_V2_STABLE_TAG"
            git push origin "$RUN191_V2_STABLE_TAG" || true
          fi
