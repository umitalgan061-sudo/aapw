name: Run 259 Expanded Palette Exact Head

on:
  push:
    branches:
      - agent/run259-editor-fbx-fallback-palette
    paths:
      - '.github/workflows/run259-expanded-palette-exact-head.yml'
      - 'src/3d/editor/EditorFallbackMaterialPalette.js'
      - 'src/3d/editor/EditorAssetManager.js'
      - 'scripts/checkRun259EditorFallbackMaterialPalette.mjs'
      - 'scripts/checkRun259EditorFallbackMaterialPaletteBreadth.mjs'
      - 'scripts/checkRun259EditorFallbackMaterialIntegration.mjs'
      - 'scripts/checkRun259EditorFallbackMaterialVisual.js'
      - 'service-worker.js'
      - '3D_GAME_PROGRESS.md'
      - 'perf_log.csv'
      - 'STABLE_TAGS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run259-expanded-palette-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Install Chromium validation dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Syntax and 288-color fallback palette regression
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorFallbackMaterialPalette.js
          node --check src/3d/editor/EditorAssetManager.js
          node --check scripts/checkRun259EditorFallbackMaterialPalette.mjs
          node --check scripts/checkRun259EditorFallbackMaterialPaletteBreadth.mjs
          node --check scripts/checkRun259EditorFallbackMaterialIntegration.mjs
          node --check scripts/checkRun259EditorFallbackMaterialVisual.js
          node scripts/checkRun259EditorFallbackMaterialPalette.mjs
          node scripts/checkRun259EditorFallbackMaterialPaletteBreadth.mjs
          node scripts/checkRun259EditorFallbackMaterialIntegration.mjs
      - name: Two-angle visual evidence and console cleanliness
        run: node scripts/checkRun259EditorFallbackMaterialVisual.js
      - name: PWA cache and installability
        run: |
          set -euo pipefail
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
      - name: Performance determinism and world safety
        run: |
          set -euo pipefail
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
      - name: Full browser smoke
        run: node scripts/smokeTestGame3D.js
      - name: Final exact-main concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Upload expanded palette visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: run259-expanded-fallback-palette-visual-evidence
          path: artifacts/run259-editor-fallback-palette/*.png
          if-no-files-found: error
          retention-days: 14

# Run259 final governance-head revalidation trigger.
