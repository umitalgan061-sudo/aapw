name: settlement quest handoff

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementQuestHandoff.js'
      - 'scripts/checkSettlementQuestHandoff.mjs'
      - '.github/workflows/settlement-quest-handoff.yml'
  push:
    paths:
      - 'src/3d/gameplay/settlementQuestHandoff.js'
      - 'scripts/checkSettlementQuestHandoff.mjs'
      - '.github/workflows/settlement-quest-handoff.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check src/3d/gameplay/settlementQuestHandoff.js
      - name: Executable contract
        run: node scripts/checkSettlementQuestHandoff.mjs
      - name: Scope budget
        shell: bash
        run: |
          changed=$(git diff --numstat "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" -- \
            src/3d/gameplay/settlementQuestHandoff.js \
            scripts/checkSettlementQuestHandoff.mjs \
            .github/workflows/settlement-quest-handoff.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 3000
      - name: Runtime/editor boundary
        shell: bash
        run: |
          ! grep -R "EditorMaterialStudio\|MaterialAssignmentCore\|WorldAssetPlacementPipeline" \
            src/3d/gameplay/settlementQuestHandoff.js scripts/checkSettlementQuestHandoff.mjs
