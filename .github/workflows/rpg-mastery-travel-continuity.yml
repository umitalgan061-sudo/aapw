name: RPG Mastery Travel Continuity

on:
  pull_request:
    paths:
      - 'scripts/checkInteractionMasteryTravelContinuityBrowser.mjs'
      - 'scripts/checkInteractionExpeditionTavernRecovery.mjs'
      - 'scripts/checkInteractionExpeditionBoard.mjs'
      - 'scripts/checkInteractionExpeditionBoardBrowser.mjs'
      - 'scripts/checkInteractionExpeditionRewardProvenance.mjs'
      - 'scripts/checkInteractionExpeditionRewardTradeContinuity.mjs'
      - 'scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs'
      - 'scripts/checkInteractionProvisioningCraft.mjs'
      - 'scripts/checkInteractionQuartermasterTrade.mjs'
      - 'scripts/checkInteractionSettlementServiceBrowser.mjs'
      - 'scripts/checkInteractionSettlementServiceContract.mjs'
      - '.github/workflows/rpg-expedition-credit-ledger.yml'
      - '.github/workflows/rpg-expedition-reward-provenance.yml'
      - '.github/workflows/rpg-mastery-to-smithing.yml'
      - '.github/workflows/rpg-mastery-travel-continuity.yml'
      - 'src/3d/gameplay/interaction.js'
      - 'src/3d/gameplay/interactionConfig.js'
      - 'src/3d/gameplay/interactionEconomy.js'
      - 'src/3d/gameplay/interactionFieldReadiness.js'
      - 'src/3d/ui/dialogueBox.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mastery-travel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main bounded scope and quota
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base=$(git merge-base HEAD origin/main)
          test "$base" = "$(git rev-parse origin/main)"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD)
          allowed='^(\.github/workflows/(rpg-expedition-credit-ledger|rpg-expedition-reward-provenance|rpg-expedition-tavern-recovery|rpg-interaction-quest-loop|rpg-journey-ledger-ux|rpg-mastery-armorer-service|rpg-mastery-economy-continuity|rpg-mastery-journal-continuity|rpg-mastery-to-smithing|rpg-mastery-travel-continuity|rpg-smithing-service-persistence|rpg-tavern-receipt-integrity|run283-final-head-governance)\.yml|scripts/checkInteraction(ArmorerServiceBrowser|Expedition(Board(Browser)?|Kit(Browser|Craft)|RewardProvenance|RewardTradeContinuity|TradeQuoteAtomicity)|MasteryEconomyContinuity|MasteryToSmithingBrowser|ProvisioningCraft|QuartermasterTrade|SettlementService(Browser|Contract)|SmithingServicePersistence|TradeLedger(Atomicity|Browser))\.mjs|src/3d/gameplay/(interaction|interactionEconomy|interactionConfig)\.js)$'
          printf '%s\n' "${paths[@]}" | grep -Ev "$allowed" && exit 1 || true
          changed=$(git diff --numstat "$base"...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$changed" -le 1000
      - name: Syntax and RPG lifecycle regressions
        run: |
          set -euo pipefail
          node --check scripts/checkInteractionMasteryTravelContinuityBrowser.mjs
          node --check scripts/checkInteractionExpeditionTavernRecovery.mjs
          node --check scripts/checkInteractionExpeditionBoard.mjs
          node --check scripts/checkInteractionExpeditionBoardBrowser.mjs
          node --check scripts/checkInteractionExpeditionRewardProvenance.mjs
          node --check scripts/checkInteractionExpeditionRewardTradeContinuity.mjs
          node --check scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs
          node --check scripts/checkInteractionProvisioningCraft.mjs
          node --check scripts/checkInteractionQuartermasterTrade.mjs
          node --check scripts/checkInteractionSettlementServiceBrowser.mjs
          node --check scripts/checkInteractionSettlementServiceContract.mjs
          node scripts/checkInteractionExpeditionBoard.mjs
          node scripts/checkInteractionExpeditionRewardProvenance.mjs
          node scripts/checkInteractionExpeditionRewardTradeContinuity.mjs
          node scripts/checkInteractionExpeditionTradeQuoteAtomicity.mjs
          node scripts/checkInteractionExpeditionMasterySmithingReward.mjs
          node scripts/checkInteractionMasteryEconomyContinuity.mjs
          node scripts/checkInteractionExpeditionKitCraft.mjs
          node scripts/checkInteractionProvisioningCraft.mjs
          node scripts/checkInteractionQuartermasterTrade.mjs
          node scripts/checkInteractionSettlementServiceContract.mjs
          node scripts/checkInteractionJourneyPlanning.mjs
          node scripts/checkInteractionExpeditionTavernRecovery.mjs
      - name: Install Chromium acceptance harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Shipped-page Chromium mastery travel and settlement service proof
        run: |
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionSettlementServiceBrowser.mjs
          NODE_PATH="$NODE_PATH" node scripts/checkInteractionMasteryTravelContinuityBrowser.mjs
      - name: Shared material placement boundary
        run: node scripts/checkSharedMaterialPlacementContract.js
      - name: Final exact-main freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
