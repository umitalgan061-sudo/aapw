name: Migrate Settlement Geography Lane

on:
  push:
    branches:
      - agent/gunbatimi-settlement-geography-material-realism-20260907-main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current-main settlement lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true

      - name: Validate and integrate settlement geography lane
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrateSettlementGeographyCurrentMain.mjs
          node scripts/integrateSettlementHouseTypeMix.mjs
          node --check src/3d/world/villages.js
          node --check src/3d/world/settlementGeographyPolicy.js
          node --check src/3d/world/settlementHouseTypeMix.js
          node scripts/checkSettlementGeographyPolicy.mjs
          git diff --check

      - name: Commit production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/villages.js src/3d/world/settlementGeographyPolicy.js src/3d/world/settlementHouseTypeMix.js scripts/checkSettlementGeographyPolicy.mjs scripts/migrateSettlementGeographyCurrentMain.mjs scripts/integrateSettlementHouseTypeMix.mjs .github/workflows/settlement-geography-asset-realism.yml
          git diff --cached --check
          git commit -m 'feat(world): route settlement assets by geography'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove one-shot migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_migrate-settlement-geography.yml
          git commit -m 'ci(world): remove one-shot settlement migration'
          git push origin HEAD:${GITHUB_REF_NAME}