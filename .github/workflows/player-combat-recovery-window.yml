name: Player Combat Recovery Window

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatRecoveryWindow.js'
      - 'scripts/checkPlayerCombatRecoveryWindow.mjs'
      - '.github/workflows/player-combat-recovery-window.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check src/3d/gameplay/playerCombatRecoveryWindow.js && node --check scripts/checkPlayerCombatRecoveryWindow.mjs
      - name: Regression
        run: node scripts/checkPlayerCombatRecoveryWindow.mjs
      - name: Determinism
        run: |
          node scripts/checkPlayerCombatRecoveryWindow.mjs > /tmp/recovery-a.txt
          node scripts/checkPlayerCombatRecoveryWindow.mjs > /tmp/recovery-b.txt
          cmp /tmp/recovery-a.txt /tmp/recovery-b.txt
      - name: Ownership boundary
        run: |
          ! grep -R "EditorMaterialStudio\|from 'three'\|from \"three\"" src/3d/gameplay/playerCombatRecoveryWindow.js scripts/checkPlayerCombatRecoveryWindow.mjs
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 3000
