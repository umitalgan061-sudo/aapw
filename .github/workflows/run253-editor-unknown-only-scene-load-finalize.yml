name: Run 253 Editor Unknown Only Scene Load Finalize

on:
  push:
    branches:
      - agent/run253-editor-unknown-only-scene-load
    paths:
      - '.github/workflows/run253-editor-unknown-only-scene-load-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run253-editor-unknown-only-scene-load-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun253EditorUnknownOnlySceneLoad.js
          node --check src/3d/editor/EditorLocalSession.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run253 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 253 — World Editor unknown-only scene load regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression verifies a valid schema-v1 scene containing only an unknown asset remains a successful empty-scene load rather than leaking a placeholder/editor object.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The unknown identity is absent from editable objects and hierarchy; selection remains empty and history observers stay stable/not restoring.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Serialized editor metadata still restores to snap enabled / 3.75 while the owner grid-hidden/disabled policy remains intact; browser console/page errors remain zero.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Validation workflow `31463937137` PASS: syntax, Chromium regression, PWA cache/installability, mobile performance, deterministic/world-reference/hydrology, terrain/road safety, perf trend, technical-debt audit, full browser smoke, final remote-main/additive-only gates and two-screenshot artifact all PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- World Event Determinism Guard `31463937094` PASS on the same Run253 head.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed in Run253. Test/workflow/checkpoint-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: refresh remote main and concurrent branches, then continue only a distinct additive-only World Editor compatibility regression without crossing Run252 consecutive-load ownership.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run253,2026-08-11,editor-unknown-only-scene-load' perf_log.csv; then
            printf 'run253,%s,editor-unknown-only-scene-load,,,,,,,"test-only unknown-only scene load regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run253 editor unknown-only scene load regression' STABLE_TAGS.md; then
            printf '%s — Run253 editor unknown-only scene load regression; unknown-only valid scene stays empty while serialized metadata restores safely; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run253 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run253): record unknown-only scene load checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run253-editor-unknown-only-scene-load
          git push origin "$STABLE_TAG" || true
