name: Run216 Editor Usability Contract

on:
  push:
    branches:
      - agent/run216-world-editor-transform-controls
    paths:
      - 'editor.html'
      - 'src/3d/editor/EditorLiveWorldAuthoring.js'
      - 'src/3d/editor/EditorLiveWorldVisualSync.js'
      - 'src/3d/editor/EditorPlacementControllerSafe.js'
      - 'scripts/checkRun216EditorUsabilityContract.js'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-usability-contract.yml'
  pull_request:
    paths:
      - 'editor.html'
      - 'src/3d/editor/EditorLiveWorldAuthoring.js'
      - 'src/3d/editor/EditorLiveWorldVisualSync.js'
      - 'src/3d/editor/EditorPlacementControllerSafe.js'
      - 'scripts/checkRun216EditorUsabilityContract.js'
      - 'scripts/materializeRun216ServiceWorkerCache.js'
      - 'scripts/checkRun216ServiceWorkerMaterializer.js'
      - '.github/workflows/run216-editor-usability-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-usability-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Syntax and usability contract
        run: |
          set -euo pipefail
          node --check src/3d/editor/EditorLiveWorldAuthoring.js
          node --check src/3d/editor/EditorLiveWorldVisualSync.js
          node --check src/3d/editor/EditorPlacementControllerSafe.js
          node --check scripts/checkRun216EditorUsabilityContract.js
          node --check scripts/materializeRun216ServiceWorkerCache.js
          node --check scripts/checkRun216ServiceWorkerMaterializer.js
          node scripts/checkRun216EditorUsabilityContract.js
      - name: PWA materializer proof
        run: |
          set -euo pipefail
          node scripts/materializeRun216ServiceWorkerCache.js --self-test
          node scripts/checkRun216ServiceWorkerMaterializer.js
      - name: Final concurrency and additive gate
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
