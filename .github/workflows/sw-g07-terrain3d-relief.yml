name: SW G07 Terrain3D Relief

on:
  push:
    branches: [terrain/sw-g07-terrain3d-relief-20260812]
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/sw/g07_relief.mjs'
      - 'scripts/checkSWG07Relief.mjs'
      - 'godot/terrain-authoring/scripts/validate_g07_terrain3d_relief.gd'
      - 'godot/terrain-authoring/scripts/render_g07_terrain3d_relief.gd'
      - 'godot/terrain-authoring/corner_claims/SW.json'
      - '.github/workflows/sw-g07-terrain3d-relief.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-g07-terrain3d-relief-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 405b8faa5bbfbdcfd9c73ddafa8a05b855cd32ec
  GODOT_VERSION: 4.6.3

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/sw/g07_relief.mjs|scripts/checkSWG07Relief.mjs|godot/terrain-authoring/scripts/validate_g07_terrain3d_relief.gd|godot/terrain-authoring/scripts/render_g07_terrain3d_relief.gd|godot/terrain-authoring/corner_claims/SW.json|\.github/workflows/sw-g07-terrain3d-relief.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py

      - name: Deterministic G07 relief and seam metrics
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/sw/g07_relief.mjs
          node --check scripts/checkSWG07Relief.mjs
          node scripts/checkSWG07Relief.mjs | tee "$RUNNER_TEMP/a.log"
          node scripts/checkSWG07Relief.mjs | tee "$RUNNER_TEMP/b.log"
          cmp "$RUNNER_TEMP/a.log" "$RUNNER_TEMP/b.log"
          grep -F 'SW_G07_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/a.log"
          node scripts/checkSWG07Relief.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g07-relief-probe.json

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"

      - name: Download official Godot
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=$GODOT_VERSION" --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Terrain3D height import save and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G07_RELIEF_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g07_terrain3d_relief.gd | tee "$RUNNER_TEMP/t3d-a.log"
          G07_RELIEF_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g07_terrain3d_relief.gd | tee "$RUNNER_TEMP/t3d-b.log"
          grep -F 'SW_G07_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/t3d-a.log"
          grep -F 'SW_G07_TERRAIN3D_RELIEF_VALIDATION_OK' "$RUNNER_TEMP/t3d-b.log"
          python3 - "$RUNNER_TEMP/t3d-a.log" "$RUNNER_TEMP/t3d-b.log" <<'PY'
          import json,sys
          from pathlib import Path
          def m(p):
              for line in Path(p).read_text().splitlines():
                  if line.startswith('G07_TERRAIN3D_RELIEF_METRICS='): return json.loads(line.split('=',1)[1])
              raise SystemExit('metrics missing')
          a,b=m(sys.argv[1]),m(sys.argv[2])
          stable=('terrain3dVersion','regionSize','regionCount','sampleCount','maxHeightError','sourceHeightSpan','outputChecksum','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert a['savedRegionBytes'] > 0 and b['savedRegionBytes'] > 0
          print('SW_G07_TERRAIN3D_RELIEF_STABLE_OK')
          PY

      - name: Render real Terrain3D near and top-down proof
        env: { LIBGL_ALWAYS_SOFTWARE: '1' }
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path godot/terrain-authoring --display-driver x11 --rendering-method gl_compatibility --rendering-driver opengl3 --script res://scripts/render_g07_terrain3d_relief.gd
          test -f artifacts/sw-g07-terrain3d-relief/g07-relief-near.png
          test -f artifacts/sw-g07-terrain3d-relief/g07-relief-topdown.png

      - name: Install Playwright and run safety regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-g07-terrain3d-relief
          path: artifacts/sw-g07-terrain3d-relief/
          if-no-files-found: warn
