name: SE G77 Terrain3D Near Detail
on:
  push: { branches: ['terrain/se-g77-terrain3d-near-detail-exact-*'] }
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/se-g77-terrain3d-near-detail.yml'
      - 'godot/terrain-authoring/geocells/se/g77_near_detail.mjs'
      - 'godot/terrain-authoring/scripts/validate_g77_terrain3d_near_detail.gd'
      - 'scripts/runtime/g77NearDetailLiveContext.mjs'
      - 'scripts/checkSEG77NearDetail.mjs'
      - 'scripts/checkSEG77NearDetailControlPreflight.mjs'
      - 'scripts/checkSEG77NearDetailMapFidelity.mjs'
      - 'scripts/checkSEG77NearDetailContinuity.mjs'
      - 'scripts/checkSEG77NearDetailShorelineEnvelope.mjs'
      - 'scripts/checkSEG77NearDetailVisualEvidence.mjs'
      - 'scripts/checkSEG77NearDetailEvidenceBundle.mjs'
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'se-g77-near-detail-${{ github.head_ref || github.ref_name }}', cancel-in-progress: true }
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exact-main eleven-file scope quota and protected predecessors
        run: |
          set -euo pipefail; git fetch origin main; git lfs fsck
          MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"; git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"; echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(\.github/workflows/se-g77-terrain3d-near-detail\.yml|godot/terrain-authoring/geocells/se/g77_near_detail\.mjs|godot/terrain-authoring/scripts/validate_g77_terrain3d_near_detail\.gd|scripts/runtime/g77NearDetailLiveContext\.mjs|scripts/checkSEG77NearDetail(ControlPreflight|MapFidelity|Continuity|ShorelineEnvelope|VisualEvidence|EvidenceBundle)?\.mjs)$' | wc -l)" -eq 0
          test "$(echo "$CHANGED" | sed '/^$/d' | wc -l)" -eq 11
          LINES="$(git diff --numstat origin/main...HEAD | awk '{a+=$1;d+=$2}END{print a+d+0}')"; echo "G77_NEAR_DETAIL_CHANGED_LINES=$LINES"; test "$LINES" -le 1000
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/terrain3d.lock.json godot/terrain-authoring/tools/install_terrain3d.py godot/terrain-authoring/addons/zylann.hterrain godot/terrain-authoring/geocells/se/g77_hydrology.mjs godot/terrain-authoring/geocells/se/g77_biome.mjs godot/terrain-authoring/geocells/se/g77_relief.mjs godot/terrain-authoring/geocells/se/g77_rock_snow.mjs godot/terrain-authoring/geocells/se/g77_road_path.mjs src/3d/world/terrain.js src/3d/world/roads.js godot/terrain-authoring/corner_claims/SE.json service-worker.js
          node scripts/checkSEG77Terrain3DHydrology.mjs; node scripts/checkSEG77Biome.mjs --write-probe; node scripts/checkSEG77Relief.mjs; node scripts/checkSEG77ReliefContinuity.mjs; node scripts/checkSEG77RockSnow.mjs
          for f in godot/terrain-authoring/geocells/se/g77_near_detail.mjs scripts/runtime/g77NearDetailLiveContext.mjs scripts/checkSEG77NearDetail.mjs scripts/checkSEG77NearDetailControlPreflight.mjs scripts/checkSEG77NearDetailMapFidelity.mjs scripts/checkSEG77NearDetailContinuity.mjs scripts/checkSEG77NearDetailShorelineEnvelope.mjs scripts/checkSEG77NearDetailVisualEvidence.mjs scripts/checkSEG77NearDetailEvidenceBundle.mjs; do node --check "$f"; done
      - name: Chromium predecessor Road Path and deterministic 257 Near Detail proof
        run: |
          set -euo pipefail; mkdir -p "$RUNNER_TEMP/pw"; npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0; "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium; echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSEG77RoadPath.mjs | tee /tmp/road.log; grep -F SE_G77_ROAD_PATH_VALIDATION_OK /tmp/road.log
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSEG77NearDetail.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g77-near-detail-probe.json | tee /tmp/near-a.log; cp godot/terrain-authoring/.terrain3d-proof/g77-near-detail-probe.json /tmp/near-a.json
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSEG77NearDetail.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g77-near-detail-probe.json | tee /tmp/near-b.log
          grep -F SE_G77_NEAR_DETAIL_VALIDATION_OK /tmp/near-a.log; cmp /tmp/near-a.log /tmp/near-b.log; cmp /tmp/near-a.json godot/terrain-authoring/.terrain3d-proof/g77-near-detail-probe.json
          node scripts/checkSEG77NearDetailControlPreflight.mjs | tee /tmp/control.log; grep -F SE_G77_NEAR_DETAIL_CONTROL_PREFLIGHT_OK /tmp/control.log
          node scripts/checkSEG77NearDetailMapFidelity.mjs | tee /tmp/map.log; grep -F SE_G77_NEAR_DETAIL_MAP_FIDELITY_OK /tmp/map.log
          node scripts/checkSEG77NearDetailContinuity.mjs | tee /tmp/continuity.log; grep -F SE_G77_NEAR_DETAIL_CONTINUITY_OK /tmp/continuity.log
          node scripts/checkSEG77NearDetailShorelineEnvelope.mjs | tee /tmp/shoreline.log; grep -F SE_G77_NEAR_DETAIL_SHORELINE_ENVELOPE_OK /tmp/shoreline.log
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSEG77NearDetailVisualEvidence.mjs --out-dir=artifacts/se-g77-near-detail-visual | tee /tmp/visual.log; grep -F SE_G77_NEAR_DETAIL_VISUAL_EVIDENCE_OK /tmp/visual.log
      - name: Pinned Terrain3D Godot 4.6.3 double native Height Control Color persist reload LOD0
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee /tmp/t3d.log; grep -F 'TERRAIN3D_INSTALL_OK version=1.0.2 tag=v1.0.2-stable sha256=a071850250ec5e596aa54da61c01d75768774eb379ee997584d426a45f4884a2' /tmp/t3d.log
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | grep -F 'TERRAIN3D_VERIFY_OK version=1.0.2 enabled=true'
          mkdir -p "$RUNNER_TEMP/g"; curl -fL --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' -o "$RUNNER_TEMP/g.zip"; unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP/g"; G="$(find "$RUNNER_TEMP/g" -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"; test -n "$G"; chmod +x "$G"; "$G" --version | grep -F 4.6.3; echo "GODOT_BIN=$G" >> "$GITHUB_ENV"
          timeout 180s "$G" --headless --editor --path godot/terrain-authoring --quit-after 45
          for suffix in a b; do G77_NEAR_DETAIL_PROOF_SUFFIX="$suffix" timeout 300s "$G" --headless --path godot/terrain-authoring --script res://scripts/validate_g77_terrain3d_near_detail.gd | tee "/tmp/near-native-$suffix.log"; grep -F SE_G77_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK "/tmp/near-native-$suffix.log"; cp godot/terrain-authoring/.terrain3d-proof/g77-near-detail-native-metrics.json "/tmp/near-native-$suffix.json"; cp godot/terrain-authoring/.terrain3d-proof/g77-near-detail-imported-topdown.png "/tmp/near-native-$suffix.png"; done
          jq -S 'del(.savedRegionBytes)' /tmp/near-native-a.json >/tmp/near-native-as.json; jq -S 'del(.savedRegionBytes)' /tmp/near-native-b.json >/tmp/near-native-bs.json; cmp /tmp/near-native-as.json /tmp/near-native-bs.json; cmp /tmp/near-native-a.png /tmp/near-native-b.png
          jq -e '.regionCount>=4 and .gridSamples==66049 and .waterSamples>15000 and .savedRegionFiles>=4 and .bakedVertices>0 and .fractionalSeamSamples==48 and .controlSeamSamples==24 and .maxSeamHeightError<=0.02 and .maxSeamBlendError<=0.006 and .maxSeamColorError<=0.008 and .maxSeamRoughnessError<=0.008 and .maxHeightError<=0.00002 and .maxBlendError<=0.006 and .maxColorError<=0.006 and .maxRoughnessError<=0.006 and .reloadRegionCount>=4 and .reloadGridSamples==66049 and .reloadChecksum==.outputChecksum and .reloadFractionalSeamSamples==48 and .reloadControlSeamSamples==24 and .reloadMaxSeamHeightError<=0.02 and .reloadMaxSeamBlendError<=0.006 and .reloadMaxSeamColorError<=0.008 and .reloadMaxSeamRoughnessError<=0.008 and .reloadBakedVertices>0' /tmp/near-native-b.json
      - name: Evidence HTerrain platform regressions and final exact-main freshness
        run: |
          set -euo pipefail
          node scripts/checkSEG77NearDetailEvidenceBundle.mjs | tee /tmp/evidence.log; grep -F SE_G77_NEAR_DETAIL_EVIDENCE_BUNDLE_OK /tmp/evidence.log
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | grep -F HTERRAIN_AUTHORING_VALIDATION_OK
          node scripts/checkSeededRandomPolicy.js; node scripts/checkWorldReferenceMap.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js; node scripts/checkPwaInstallability.js; node scripts/checkServiceWorkerCache.js; node scripts/checkTechnicalDebt.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js; NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js
          git fetch origin main; MAIN="$(git rev-parse origin/main)"; test "$(git merge-base HEAD origin/main)" = "$MAIN"; git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g77-terrain3d-near-detail-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g77-near-detail-*.json
            godot/terrain-authoring/.terrain3d-proof/g77-near-detail-*.png
            artifacts/se-g77-near-detail-visual/
