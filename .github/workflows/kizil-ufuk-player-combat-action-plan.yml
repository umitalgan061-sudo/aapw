name: Kızıl Ufuk Player Combat Action Execution Plan
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatActionExecutionPlan.js'
      - 'src/3d/gameplay/playerEquipmentCombatRules.js'
      - 'scripts/checkPlayerCombatActionExecutionPlan.mjs'
      - '.github/workflows/kizil-ufuk-player-combat-action-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/3d/gameplay/playerCombatActionExecutionPlan.js
      - run: node scripts/checkPlayerCombatActionExecutionPlan.mjs
      - run: git diff --check
      - name: Changed-line guard
        run: |
          lines=$(git diff --numstat "${{ github.event.pull_request.base.sha }}" HEAD -- src/3d/gameplay/playerCombatActionExecutionPlan.js scripts/checkPlayerCombatActionExecutionPlan.mjs .github/workflows/kizil-ufuk-player-combat-action-plan.yml | awk '{a+=$1; d+=$2} END {print a+d+0}')
          test "$lines" -le 3000
