name: Player Combat Feedback Dispatch Plan

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerCombatFeedbackDispatchPlan.ts'
      - 'src/3d/gameplay/playerEquipmentCombatRules.ts'
      - 'scripts/checkPlayerCombatFeedbackDispatchPlan.mjs'
      - '.github/workflows/player-combat-feedback-dispatch-plan.yml'
  push:
    branches:
      - 'agent/kizil-ufuk-combat-feedback-dispatch-20260924-r11'

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact ancestry
        shell: bash
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          MAIN="$(git rev-parse origin/main)"
          test "$BASE" = "$MAIN"
      - name: Run focused proof
        run: node --experimental-strip-types scripts/checkPlayerCombatFeedbackDispatchPlan.mjs
      - name: Check TypeScript syntax
        run: node --experimental-strip-types --check src/3d/gameplay/playerCombatFeedbackDispatchPlan.ts
