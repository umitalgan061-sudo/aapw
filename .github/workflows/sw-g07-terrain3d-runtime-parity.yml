name: SW G07 Terrain3D Runtime Parity

on:
  push:
    branches:
      - terrain/sw-g07-runtime-parity-mainbf0d-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'src/3d/world/g07Terrain3dRuntimeParity.js'
      - 'src/3d/world/terrain.js'
      - 'scripts/checkSWG07Terrain3dRuntimeParity.js'
      - 'godot/terrain-authoring/corner_claims/SW.json'
      - '.github/workflows/sw-g07-terrain3d-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-g07-terrain3d-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and scope gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/g07Terrain3dRuntimeParity.js|src/3d/world/terrain.js|scripts/checkSWG07Terrain3dRuntimeParity.js|godot/terrain-authoring/corner_claims/SW.json|\.github/workflows/sw-g07-terrain3d-runtime-parity.yml)$' | wc -l)" -eq 0
          git diff --quiet origin/main...HEAD -- godot/terrain-authoring/addons/zylann.hterrain godot/terrain-authoring/terrain3d.lock.json

      - name: Syntax
        run: |
          set -euo pipefail
          node --check src/3d/world/g07Terrain3dRuntimeParity.js
          node --check src/3d/world/terrain.js
          node --check scripts/checkSWG07Terrain3dRuntimeParity.js

      - name: Install Chromium runtime dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Real Three.js G07 parity and determinism
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSWG07Terrain3dRuntimeParity.js | tee /tmp/g07-parity-first.log
          node scripts/checkSWG07Terrain3dRuntimeParity.js | tee /tmp/g07-parity-second.log
          diff -u /tmp/g07-parity-first.log /tmp/g07-parity-second.log
          grep -F 'SW_G07_TERRAIN3D_RUNTIME_PARITY_OK' /tmp/g07-parity-first.log

      - name: Terrain and world safety
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-4.6.3.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.6.3"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install and verify pinned Terrain3D 1.0.2
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/Terrain3D_v1.0.2-stable.zip"
          SRC="$RUNNER_TEMP/terrain3d-src"
          curl --fail --location --retry 3 'https://github.com/TokisanGames/Terrain3D/releases/download/v1.0.2-stable/Terrain3D_v1.0.2-stable.zip' --output "$ZIP"
          echo 'a071850250ec5e596aa54da61c01d75768774eb379ee997584d426a45f4884a2  '"$ZIP" | sha256sum -c -
          mkdir -p "$SRC"
          unzip -q "$ZIP" -d "$SRC"
          PLUGIN_DIR="$(find "$SRC" -type d -path '*/addons/terrain_3d' -print -quit)"
          test -n "$PLUGIN_DIR"
          rm -rf godot/terrain-authoring/addons/terrain_3d
          cp -R "$PLUGIN_DIR" godot/terrain-authoring/addons/terrain_3d
          test -f godot/terrain-authoring/addons/terrain_3d/plugin.cfg

      - name: Real Terrain3D import save and LOD0 bake twice
        run: |
          set -euo pipefail
          mkdir -p godot/terrain-authoring/.terrain3d-proof
          node scripts/checkSWG07NearDetail.mjs --emit-probe=godot/terrain-authoring/.terrain3d-proof/g07-near-detail-probe.json
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 60
          G07_NEAR_DETAIL_PROOF_SUFFIX=parity-a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g07_terrain3d_near_detail.gd | tee /tmp/g07-t3d-a.log
          G07_NEAR_DETAIL_PROOF_SUFFIX=parity-b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g07_terrain3d_near_detail.gd | tee /tmp/g07-t3d-b.log
          grep -F 'SW_G07_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK' /tmp/g07-t3d-a.log
          grep -F 'SW_G07_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK' /tmp/g07-t3d-b.log
          diff -u <(grep 'G07_TERRAIN3D_NEAR_DETAIL_METRICS=' /tmp/g07-t3d-a.log) <(grep 'G07_TERRAIN3D_NEAR_DETAIL_METRICS=' /tmp/g07-t3d-b.log)

      - name: HTerrain and browser regressions
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee /tmp/hterrain.log
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' /tmp/hterrain.log
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js
          node scripts/checkTechnicalDebt.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD
