name: modern-typescript-core

on:
  push:
    branches:
      - 'agent/typescript-modern-core-r1-20260916'
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'src/3d/modern/**'
      - 'docs/MODERN_TYPESCRIPT_CORE.md'
      - '.github/workflows/modern-typescript-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'src/3d/modern/**'
      - 'docs/MODERN_TYPESCRIPT_CORE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-typescript-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript 7 strict verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install modern dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Strict typecheck
        run: npm run typecheck

      - name: Deterministic acceptance
        run: npm run test:modern

      - name: Full modern acceptance suite
        run: node --import tsx src/3d/modern/modernAcceptance.ts

      - name: Production bundle
        run: npm run build:modern

      - name: Repository language guard
        run: |
          test -d src/3d/modern
          test -f tsconfig.json
          test -f vite.config.ts
          test -f package.json
          node -e "const p=require('./package.json'); if(!p.type || p.type!=='module') process.exit(1);"
