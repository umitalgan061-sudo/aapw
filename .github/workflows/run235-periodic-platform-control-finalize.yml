name: Run 235 Periodic Platform Control Finalize

on:
  push:
    branches:
      - agent/run235-periodic-platform-control
    paths:
      - '.github/workflows/run235-periodic-platform-control-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run235-periodic-platform-control-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starting remote-main concurrency and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Reverify platform safety gates
        run: |
          set -euo pipefail
          if [ -f package.json ]; then npm audit --audit-level=high; else echo 'npm audit N/A: package.json is absent.'; fi
          node scripts/checkServiceWorkerCache.js
          node scripts/checkPwaInstallability.js
          node scripts/checkMobilePerfBudget.js
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/checkWorldReferenceWaterMask.js
          node scripts/checkWorldReferenceAlignment.js
          node scripts/checkWorldReferenceHydrologyExtent.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/analyzePerfTrend.js
          node scripts/checkTechnicalDebt.js
          node scripts/smokeTestGame3D.js
      - name: Final pre-record remote-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append Run235 verified records
        run: |
          set -euo pipefail
          if ! grep -Fq '### Run235 platform-control superseding note' GOVERNANCE.md; then
            cat >> GOVERNANCE.md <<'EOF'

### Run235 platform-control superseding note (2026-08-11)
The latest periodic platform control is now **run 235 (2026-08-11)**, superseding the historical run199 maintenance note without deleting it. `package.json` remains absent, so `npm audit` remains N/A. PWA installability and service-worker cache completeness PASS; mobile Chromium render sampling remains inside budget at 35 draw calls / 195929 triangles / 30 geometries / 22 textures; seeded-random, canonical world-reference/water/alignment/hydrology, 14/14 terrain-seat safety and the 14-seat road network all PASS; performance-trend analysis reports no sustained heap drift; technical-debt guard and full 2D-offline + 3D-WebGL browser smoke PASS. The first Run235 workflow attempt failed only because its new workflow omitted Playwright installation before `checkMobilePerfBudget.js`; additive V2 corrected the harness without changing product/runtime source. The next periodic platform-control window is approximately **run 255-265**, unless a phase completion or material platform change justifies an earlier check.
EOF
          fi
          if ! grep -Fq '**Run 235 (2026-08-11, periodic platform control refresh):**' RULES_CHANGELOG.md; then
            cat >> RULES_CHANGELOG.md <<'EOF'

- **Run 235 (2026-08-11, periodic platform control refresh):** §15/run199 maintenance state was due for refresh. V1 correctly passed checkout, additive-only, audit-applicability and PWA gates but exposed a workflow-only missing-Playwright prerequisite before mobile perf; additive V2 installed Playwright/Chromium and then PASSed mobile render budget (35 draw calls / 195929 triangles / 30 geometries / 22 textures), seeded/world-reference/hydrology, 14/14 terrain-seat, road-network, perf-trend, technical-debt, full 2D-offline/3D-WebGL smoke, console and final remote-main/additive gates. Runtime/product source delta remains 0. Next platform-control window ~run255-265.
EOF
          fi
          if ! grep -Fq '## Run 235 — Periodic platform control refresh' 3D_GAME_PROGRESS.md; then
            cat >> 3D_GAME_PROGRESS.md <<'EOF'

## Run 235 — Periodic platform control refresh
- Governance §15/run199 periodic platform state was due for its 20-30 run refresh; this task intentionally changes no runtime/product source.
- RCA: initial workflow `31437856686` passed checkout, additive-only, audit-applicability and PWA gates, then failed because the new workflow invoked `checkMobilePerfBudget.js` before installing Playwright. No product/runtime failure occurred. Additive V2 corrected only the verification harness.
- Corrected V2 workflow `31437913596` PASS and independent World Event Determinism Guard `31437913425` PASS. `package.json` remains absent, therefore npm audit is N/A.
- PWA cache/installability PASS. Mobile Chromium sample: 35 draw calls, 195929 triangles, 30 geometries, 22 textures; measurable draw-call/triangle budgets PASS. Texture-memory bytes remain unavailable from `renderer.info` and are not invented.
- Seed policy PASS; canonical reference map/water/alignment/hydrology PASS; current map-bounds cover 67.3% of the normalized reference rectangle; seat-safe hydrology overlay remains 14/14. Terrain-seat safety 14/14 PASS and the 13-edge/14-seat road network remains connected, total 20.24 km, <=20° grade safety PASS.
- Perf trend covers 180 rows through run234; jsHeapUsedMB first-half 316.0 MB vs second-half 337.2 MB (1.07x), reported as no sustained upward drift. Technical-debt guard PASS with 0 newly-added debt markers and 0 forbidden temporary-solution additions.
- Full browser smoke PASS: 2D offline/no-CDN resilience is preserved and 3D mode reaches GAME_READY with zero 3D console/page errors. Runtime/product source delta: 0. Technical debt introduced: 0. Risk: LOW. ADR not required because this is periodic verification/maintenance only.
- Next safe step: re-read current main and concurrent Run232/Run233 state; if their editor surfaces are settled, continue the previously recorded missing/unknown-asset scene-load regression, otherwise select an independent additive-only regression/maintenance task.
EOF
          fi
          if ! grep -Fq 'run235,2026-08-11,periodic-platform-control' perf_log.csv; then
            printf '%s\n' 'run235,2026-08-11,periodic-platform-control,,35,195929,30,22,,"periodic platform control; PWA/cache, mobile budget, determinism/world, terrain/road, perf trend, debt and full browser smoke PASS; runtime/product delta 0"' >> perf_log.csv
          fi
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          if ! grep -Fq 'Run235 periodic platform control' STABLE_TAGS.md; then
            printf '%s — Run235 periodic platform control; PWA/cache, mobile 35 draw calls/195929 triangles, determinism/world safety, perf trend/debt and full browser smoke verified; runtime delta 0.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit and publish checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GOVERNANCE.md RULES_CHANGELOG.md 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          if git diff --cached --quiet; then
            echo 'Run235 records already present.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'docs(run235): record periodic platform checkpoint'
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check "$CURRENT_MAIN" HEAD
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run235-periodic-platform-control
          git push origin "$STABLE_TAG" || true
