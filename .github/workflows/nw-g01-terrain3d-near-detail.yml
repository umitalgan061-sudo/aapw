name: NW G01 Terrain3D Near Detail

on:
  push:
    branches:
      - agent/buzul-muhafizi-g01-near-detail-exact-48a6-20260814
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/nw/g01_near_detail.mjs'
      - 'scripts/checkNWG01NearDetail.mjs'
      - 'godot/terrain-authoring/scripts/validate_g01_terrain3d_near_detail.gd'
      - '.github/workflows/nw-g01-terrain3d-near-detail.yml'
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: nw-g01-terrain3d-near-detail-${{ github.ref }}
  cancel-in-progress: true

env: { TZ: Europe/Istanbul }

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact-main bounded four-file scope and quota
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA"...HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          test "$(echo "$CHANGED" | grep -Ev '^(godot/terrain-authoring/geocells/nw/g01_near_detail.mjs|scripts/checkNWG01NearDetail.mjs|godot/terrain-authoring/scripts/validate_g01_terrain3d_near_detail.gd|\.github/workflows/nw-g01-terrain3d-near-detail.yml)$' | wc -l)" -eq 0
          A="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$1}END{print s+0}')"
          D="$(git diff --numstat "$BASE_SHA"...HEAD | awk '{s+=$2}END{print s+0}')"
          echo "Near Detail quota: additions=$A deletions=$D total=$((A+D))"
          test $((A+D)) -le 1000
          for protected in g01_hydrology.mjs g01_biome.mjs g01_relief.mjs g01_rock_snow.mjs g01_road_path.mjs; do
            git diff --quiet "$BASE_SHA"...HEAD -- "godot/terrain-authoring/geocells/nw/$protected"
          done
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/roads.js
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/addons/zylann.hterrain
          git diff --quiet "$BASE_SHA"...HEAD -- service-worker.js

      - name: Install Playwright Chromium for merged live-road regression
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Reprove merged G01 stack and deterministic Near Detail twice
        run: |
          set -euo pipefail
          node scripts/checkNWG01Hydrology.mjs
          node scripts/checkNWG01Biome.mjs
          node scripts/checkNWG01Relief.mjs
          node scripts/checkNWG01RockSnow.mjs
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" timeout 180s node scripts/checkNWG01RoadPath.mjs | tee "$RUNNER_TEMP/g01-road.log"
          grep -F 'NW_G01_ROAD_PATH_VALIDATION_OK' "$RUNNER_TEMP/g01-road.log"
          node --check godot/terrain-authoring/geocells/nw/g01_near_detail.mjs
          node --check scripts/checkNWG01NearDetail.mjs
          PROOF='godot/terrain-authoring/.terrain3d-proof/g01-near-detail-probe.json'
          node scripts/checkNWG01NearDetail.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/g01-near-a.log"
          cp "$PROOF" "$RUNNER_TEMP/g01-near-probe-a.json"
          node scripts/checkNWG01NearDetail.mjs --emit-probe="$PROOF" | tee "$RUNNER_TEMP/g01-near-b.log"
          cp "$PROOF" "$RUNNER_TEMP/g01-near-probe-b.json"
          cmp "$RUNNER_TEMP/g01-near-a.log" "$RUNNER_TEMP/g01-near-b.log"
          cmp "$RUNNER_TEMP/g01-near-probe-a.json" "$RUNNER_TEMP/g01-near-probe-b.json"
          grep -F 'NW_G01_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g01-near-a.log"

      - name: Install pinned Terrain3D and preserve HTerrain
        run: |
          set -euo pipefail
          cp godot/terrain-authoring/project.godot "$RUNNER_TEMP/project.godot.before-terrain3d"
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then ok=1; break; fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'version="1.0.2"' godot/terrain-authoring/addons/terrain_3d/plugin.cfg
          grep -F 'res://addons/zylann.hterrain/plugin.cfg' godot/terrain-authoring/project.godot
          grep -F 'res://addons/terrain_3d/plugin.cfg' godot/terrain-authoring/project.godot

      - name: Download official Godot 4.6.3 editor
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot-4.6.3.zip"; DIR="$RUNNER_TEMP/godot-4.6.3"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Height Control Color four-region seam persistence and LOD0 proof twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45 2>&1 | tee "$RUNNER_TEMP/t3d-editor.log"
          ! grep -E 'ERROR:.*(Terrain3D|terrain_3d)|Failed loading resource.*terrain_3d' "$RUNNER_TEMP/t3d-editor.log"
          G01_NEAR_DETAIL_PROOF_SUFFIX=a timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g01_terrain3d_near_detail.gd 2>&1 | tee "$RUNNER_TEMP/g01-near-t3d-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g01-near-detail-imported-topdown.png "$RUNNER_TEMP/g01-near-a.png"
          G01_NEAR_DETAIL_PROOF_SUFFIX=b timeout 300s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g01_terrain3d_near_detail.gd 2>&1 | tee "$RUNNER_TEMP/g01-near-t3d-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g01-near-detail-imported-topdown.png "$RUNNER_TEMP/g01-near-b.png"
          grep -F 'NW_G01_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g01-near-t3d-a.log"
          grep -F 'NW_G01_TERRAIN3D_NEAR_DETAIL_VALIDATION_OK' "$RUNNER_TEMP/g01-near-t3d-b.log"
          cmp "$RUNNER_TEMP/g01-near-a.png" "$RUNNER_TEMP/g01-near-b.png"
          python3 - "$RUNNER_TEMP/g01-near-t3d-a.log" "$RUNNER_TEMP/g01-near-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          prefix='G01_TERRAIN3D_NEAR_DETAIL_METRICS='
          def metric(p):
              for line in Path(p).read_text().splitlines():
                  if line.startswith(prefix): return json.loads(line[len(prefix):])
              raise SystemExit('Near Detail metrics missing')
          a,b=metric(sys.argv[1]),metric(sys.argv[2])
          stable=('terrain3dVersion','regionSize','regionCount','alignedSamples','seamSamples','materialSeamSamples','maxHeightError','maxBlendError','maxColorError','maxRoughnessError','maxSeamHeightError','maxSeamBlendError','maxSeamColorError','maxSeamRoughnessError','outputChecksum','canonicalWaterCells','canonicalLandCells','phantomRoadSamples','phantomPathSamples','bakedSurfaces','bakedVertices','savedRegionFiles','previewPath')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert str(a['terrain3dVersion']).startswith('1.0.2') and a['regionCount'] >= 4 and a['savedRegionFiles'] >= 4
          assert a['alignedSamples'] == 4225 and a['canonicalWaterCells'] == 88 and a['canonicalLandCells'] == 8
          assert a['maxHeightError'] <= .015 and a['maxBlendError'] <= .006 and a['maxColorError'] <= .006 and a['maxRoughnessError'] <= .006
          assert a['maxSeamHeightError'] <= .025 and a['maxSeamBlendError'] <= .006 and a['maxSeamColorError'] <= .006 and a['maxSeamRoughnessError'] <= .006
          assert a['phantomRoadSamples'] == 0 and a['phantomPathSamples'] == 0 and a['bakedSurfaces'] >= 1 and a['bakedVertices'] > 0
          print('NW_G01_TERRAIN3D_NEAR_DETAIL_STABLE_OK')
          PY

      - name: HTerrain world settlement road PWA mobile and browser regressions
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

      - name: Restore authoring bootstrap mutations
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/project.godot.before-terrain3d"; then cp "$RUNNER_TEMP/project.godot.before-terrain3d" godot/terrain-authoring/project.godot; fi
          rm -rf godot/terrain-authoring/addons/terrain_3d
          git restore --worktree -- godot/terrain-authoring/addons/zylann.hterrain
          git clean -fdx -- godot/terrain-authoring/terrain_data
          git diff --exit-code -- godot/terrain-authoring/project.godot
          git diff --exit-code -- godot/terrain-authoring/addons/zylann.hterrain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nw-g01-terrain3d-near-detail-proof
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            godot/terrain-authoring/.terrain3d-proof/g01-near-detail-probe.json
            godot/terrain-authoring/.terrain3d-proof/g01-near-detail-imported-topdown.png
            ${{ runner.temp }}/g01-near-t3d-a.log
            ${{ runner.temp }}/g01-near-t3d-b.log
