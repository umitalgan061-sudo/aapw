name: Run 250 Editor Multiobject Offgrid Load Exact Head

on:
  push:
    branches:
      - agent/run250-editor-multiobject-offgrid-load
    paths:
      - '.github/workflows/run250-editor-multiobject-offgrid-load-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run250-editor-multiobject-offgrid-load-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact head against current main
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          node --check scripts/checkRun250EditorMultiobjectOffgridLoad.js
          node --check src/3d/editor/EditorLocalSession.js
          git diff --check
      - name: Verify Run250 checkpoint records
        run: |
          set -euo pipefail
          grep -Fq '## Run 250 — World Editor multi-object off-grid scene import regression' 3D_GAME_PROGRESS.md
          grep -Fq 'run250,2026-08-11,editor-multiobject-offgrid-load' perf_log.csv
          grep -Fq 'Run250 editor multi-object off-grid scene import regression' STABLE_TAGS.md
          grep -Fq '31462280852' 3D_GAME_PROGRESS.md
          grep -Fq '31462280861' 3D_GAME_PROGRESS.md
