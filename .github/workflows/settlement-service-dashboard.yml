name: settlement-service-dashboard
on:
  pull_request:
    paths:
      - 'src/3d/gameplay/settlementServiceDashboard.js'
      - 'scripts/checkSettlementServiceDashboard.mjs'
      - '.github/workflows/settlement-service-dashboard.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute contract
        run: node scripts/checkSettlementServiceDashboard.mjs
      - name: Syntax
        run: node --check src/3d/gameplay/settlementServiceDashboard.js
      - name: Ownership boundary
        run: |
          ! grep -nE "EditorMaterialStudio|MaterialAssignmentCore|WorldAssetPlacementPipeline" src/3d/gameplay/settlementServiceDashboard.js
      - name: Diff budget
        run: |
          test "$(git diff --numstat origin/main...HEAD | awk '{a+=$1;d+=$2} END{print a+d+0}')" -le 3000
