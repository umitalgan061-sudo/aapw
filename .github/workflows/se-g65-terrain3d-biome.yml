name: SE G65 Terrain3D Biome

on:
  push:
    branches: [agent/kizil-ufuk-g65-biome-r3-20260813]
  pull_request:
    branches: [main]
    paths:
      - 'godot/terrain-authoring/geocells/se/g65_biome.mjs'
      - 'scripts/checkSEG65Biome.mjs'
      - 'godot/terrain-authoring/scripts/validate_g65_terrain3d_biome.gd'
      - '.github/workflows/se-g65-terrain3d-biome.yml'

permissions:
  contents: read

env:
  BASE_SHA: f0ea87e2115afac9284d9c5bb807fbff37da9d1c

concurrency:
  group: se-g65-terrain3d-biome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Exact main and five-file scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --name-only "$BASE_SHA"...HEAD | sort | tr '\n' ' ')" = ".github/workflows/se-g65-terrain3d-biome.yml .github/workflows/se-g65-terrain3d-hydrology-r5.yml godot/terrain-authoring/geocells/se/g65_biome.mjs godot/terrain-authoring/scripts/validate_g65_terrain3d_biome.gd scripts/checkSEG65Biome.mjs "
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py

      - name: Merged G65 hydrology regression
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g65_hydrology.mjs
          node --check scripts/checkSEG65Hydrology.mjs
          node scripts/checkSEG65Hydrology.mjs | tee "$RUNNER_TEMP/g65-hydrology.log"
          grep -F 'SE_G65_HYDROLOGY_SOURCE_OK' "$RUNNER_TEMP/g65-hydrology.log"

      - name: G65 biome determinism hydrology and probe
        run: |
          set -euo pipefail
          node --check godot/terrain-authoring/geocells/se/g65_biome.mjs
          node --check scripts/checkSEG65Biome.mjs
          node scripts/checkSEG65Biome.mjs | tee "$RUNNER_TEMP/g65-biome-a.log"
          node scripts/checkSEG65Biome.mjs | tee "$RUNNER_TEMP/g65-biome-b.log"
          cmp "$RUNNER_TEMP/g65-biome-a.log" "$RUNNER_TEMP/g65-biome-b.log"
          grep -F 'SE_G65_BIOME_OK' "$RUNNER_TEMP/g65-biome-a.log"
          node scripts/checkSEG65Biome.mjs --write-probe
          test -s godot/terrain-authoring/.terrain3d-proof/g65-biome-probe.json

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install.log"
          grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install.log"
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"; DIR="$RUNNER_TEMP/godot"; mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"; "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real Terrain3D color import save and LOD0 bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G65_BIOME_PROOF_SUFFIX=a timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_biome.gd | tee "$RUNNER_TEMP/g65-t3d-a.log"
          G65_BIOME_PROOF_SUFFIX=b timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g65_terrain3d_biome.gd | tee "$RUNNER_TEMP/g65-t3d-b.log"
          grep -F 'SE_G65_TERRAIN3D_BIOME_VALIDATION_OK' "$RUNNER_TEMP/g65-t3d-a.log"
          grep -F 'SE_G65_TERRAIN3D_BIOME_VALIDATION_OK' "$RUNNER_TEMP/g65-t3d-b.log"
          python3 - "$RUNNER_TEMP/g65-t3d-a.log" "$RUNNER_TEMP/g65-t3d-b.log" <<'PY'
          import json, sys
          from pathlib import Path
          def metrics(path):
              for line in Path(path).read_text().splitlines():
                  if line.startswith('G65_TERRAIN3D_BIOME_METRICS='):
                      return json.loads(line.split('=',1)[1])
              raise SystemExit('metrics missing')
          a,b=metrics(sys.argv[1]),metrics(sys.argv[2])
          stable=('terrain3dVersion','regionSize','regionCount','sampleCount','maxColorError','outputChecksum','bakedSurfaces','bakedVertices','savedRegionFiles')
          assert {k:a[k] for k in stable} == {k:b[k] for k in stable}
          assert a['savedRegionFiles'] >= 1 and b['savedRegionFiles'] >= 1
          assert a['savedRegionBytes'] > 0 and b['savedRegionBytes'] > 0
          print('SE_G65_TERRAIN3D_BIOME_STABLE_OK')
          PY

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: HTerrain world road PWA and browser regression
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          node scripts/terrainSeatSafetyCheck.js
          node scripts/roadNetworkSafetyCheck.js
          node scripts/checkRoadVisualContract.js
          node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          node scripts/checkMobilePerfBudget.js
          node scripts/smokeTestGame3D.js

      - name: Final exact-main freshness
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
