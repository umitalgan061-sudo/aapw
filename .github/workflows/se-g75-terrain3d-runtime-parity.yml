name: SE G75 Terrain3D Runtime Parity

on:
  push:
    branches:
      - agent/kizil-ufuk-g75-runtime-parity-20260813
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/checkSEG75Terrain3DRuntimeParity.mjs'
      - 'godot/terrain-authoring/scripts/validate_g75_terrain3d_runtime_parity.gd'
      - '.github/workflows/se-g75-terrain3d-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se-g75-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 2e156694b37b34717946eb493346e3efc825132a

jobs:
  validate:
    if: github.event_name != 'pull_request' || contains(github.head_ref, 'g75')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact-main and bounded scope
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -Ev '^(src/3d/world/worldReferenceTerrainAdapter.js|scripts/checkSEG75Terrain3DRuntimeParity.mjs|godot/terrain-authoring/scripts/validate_g75_terrain3d_runtime_parity.gd|\.github/workflows/se-g75-terrain3d-runtime-parity.yml)$' | wc -l)" -eq 0
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/terrain3d.lock.json
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/tools/install_terrain3d.py
          git diff --quiet "$BASE_SHA"...HEAD -- godot/terrain-authoring/corner_claims/SE.json
          git diff --quiet "$BASE_SHA"...HEAD -- src/3d/world/terrain.js

      - name: Capture deterministic G75 authored source twice
        run: |
          set -euo pipefail
          node --check src/3d/world/worldReferenceTerrainAdapter.js
          node --check scripts/checkSEG75Terrain3DRuntimeParity.mjs
          node scripts/checkSEG75Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-runtime-source.json "$RUNNER_TEMP/source-a.json"
          node scripts/checkSEG75Terrain3DRuntimeParity.mjs | tee "$RUNNER_TEMP/source-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-runtime-source.json "$RUNNER_TEMP/source-b.json"
          cmp "$RUNNER_TEMP/source-a.log" "$RUNNER_TEMP/source-b.log"
          cmp "$RUNNER_TEMP/source-a.json" "$RUNNER_TEMP/source-b.json"
          grep -F 'SE_G75_RUNTIME_PARITY_SOURCE_OK' "$RUNNER_TEMP/source-a.log"

      - name: Install pinned Terrain3D
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python3 godot/terrain-authoring/tools/install_terrain3d.py --refresh | tee "$RUNNER_TEMP/t3d-install-$attempt.log"; then
              grep -F 'TERRAIN3D_INSTALL_OK' "$RUNNER_TEMP/t3d-install-$attempt.log"
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" -eq 1
          python3 godot/terrain-authoring/tools/install_terrain3d.py --verify-only | tee "$RUNNER_TEMP/t3d-verify.log"
          grep -F 'TERRAIN3D_VERIFY_OK' "$RUNNER_TEMP/t3d-verify.log"

      - name: Download Godot 4.6.3
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/godot.zip"
          DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DIR"
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.6.3' --output "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          GODOT_BIN="$(find "$DIR" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -F '4.6.3'
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Real 257 guard Terrain3D bake twice
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --editor --path godot/terrain-authoring --quit-after 45
          G75_RUNTIME_PARITY_PROOF_SUFFIX=a timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g75_terrain3d_runtime_parity.gd | tee "$RUNNER_TEMP/bake-a.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-runtime-bake.json "$RUNNER_TEMP/bake-a.json"
          cp godot/terrain-authoring/.terrain3d-proof/g75-runtime-bake-topdown.png "$RUNNER_TEMP/bake-a.png"
          G75_RUNTIME_PARITY_PROOF_SUFFIX=b timeout 240s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_g75_terrain3d_runtime_parity.gd | tee "$RUNNER_TEMP/bake-b.log"
          cp godot/terrain-authoring/.terrain3d-proof/g75-runtime-bake.json "$RUNNER_TEMP/bake-b.json"
          cp godot/terrain-authoring/.terrain3d-proof/g75-runtime-bake-topdown.png "$RUNNER_TEMP/bake-b.png"
          grep -F 'SE_G75_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake-a.log"
          grep -F 'SE_G75_TERRAIN3D_RUNTIME_BAKE_OK' "$RUNNER_TEMP/bake-b.log"
          jq -S 'del(.savedRegionBytes)' "$RUNNER_TEMP/bake-a.json" > "$RUNNER_TEMP/bake-a-canonical.json"
          jq -S 'del(.savedRegionBytes)' "$RUNNER_TEMP/bake-b.json" > "$RUNNER_TEMP/bake-b-canonical.json"
          sha256sum "$RUNNER_TEMP/bake-a-canonical.json" "$RUNNER_TEMP/bake-b-canonical.json" "$RUNNER_TEMP/bake-a.png" "$RUNNER_TEMP/bake-b.png"
          cmp "$RUNNER_TEMP/bake-a-canonical.json" "$RUNNER_TEMP/bake-b-canonical.json"
          cmp "$RUNNER_TEMP/bake-a.png" "$RUNNER_TEMP/bake-b.png"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Verify Terrain3D bake in real Three.js world coordinates
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSEG75Terrain3DRuntimeParity.mjs --verify | tee "$RUNNER_TEMP/runtime.log"
          grep -F 'SE_G75_TERRAIN3D_RUNTIME_PARITY_OK' "$RUNNER_TEMP/runtime.log"

      - name: Prior G75 layers HTerrain world PWA and safety regression
        run: |
          set -euo pipefail
          node scripts/checkSEG75NearDetail.mjs
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkSEG75RoadPath.mjs
          timeout 180s "$GODOT_BIN" --headless --path godot/terrain-authoring --script res://scripts/validate_hterrain_authoring.gd | tee "$RUNNER_TEMP/hterrain.log"
          grep -F 'HTERRAIN_AUTHORING_VALIDATION_OK' "$RUNNER_TEMP/hterrain.log"
          node scripts/checkSeededRandomPolicy.js
          node scripts/checkWorldReferenceMap.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/terrainSeatSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/roadNetworkSafetyCheck.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkRoadVisualContract.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMedievalRoadSurface.js
          node scripts/checkPwaInstallability.js
          node scripts/checkServiceWorkerCache.js
          node scripts/checkTechnicalDebt.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/checkMobilePerfBudget.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/smokeTestGame3D.js

      - name: Final exact-main gate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: se-g75-terrain3d-runtime-parity-proof
          include-hidden-files: true
          path: |
            godot/terrain-authoring/.terrain3d-proof/g75-runtime-source.json
            godot/terrain-authoring/.terrain3d-proof/g75-runtime-bake.json
            godot/terrain-authoring/.terrain3d-proof/g75-runtime-bake-topdown.png
          if-no-files-found: warn
