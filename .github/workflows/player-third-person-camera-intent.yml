name: Player Third-Person Camera Intent

on:
  pull_request:
    paths:
      - 'src/3d/gameplay/playerThirdPersonCameraIntent.ts'
      - 'scripts/checkPlayerThirdPersonCameraIntent.mjs'
      - '.github/workflows/player-third-person-camera-intent.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact PR ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: TypeScript syntax
        run: node --experimental-strip-types --check src/3d/gameplay/playerThirdPersonCameraIntent.ts
      - name: Focused proof
        run: node scripts/checkPlayerThirdPersonCameraIntent.mjs
