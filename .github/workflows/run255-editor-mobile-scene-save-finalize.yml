name: Run 255 Editor Mobile Scene Save Finalize

on:
  push:
    branches:
      - agent/run255-editor-mobile-scene-save
    paths:
      - '.github/workflows/run255-editor-mobile-scene-save-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run255-editor-mobile-scene-save-finalize-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Istanbul

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact-main and additive gates
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$(git merge-base HEAD "$CURRENT_MAIN")"
          node --check scripts/checkRun255EditorMobileSceneSave.js
          node --check src/3d/editor/worldEditor.js
          node --check src/3d/editor/EditorLocalSession.js
          node --check src/3d/editor/EditorSceneSerializer.js
          node scripts/checkAdditiveOnlyDiff.js "$CURRENT_MAIN" HEAD
          git diff --check
      - name: Append verified Run255 records
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          TAG="stable-${STAMP}"
          MARKER='## Run 255 — World Editor mobile scene JSON save/download regression'
          if ! grep -Fq "$MARKER" 3D_GAME_PROGRESS.md; then
            printf '\n%s\n' "$MARKER" >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Permanent additive-only Chromium regression extends Run254 mobile import coverage through the real `Kaydet JSON` browser-download path in a `390x844`, touch-enabled, DPR 2 mobile context.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- An off-grid `marker-tree` scene is first imported with exact identity, position `[-15.375, 0.125, 22.625]`, signed rotation `[0.625, -1.375, 2.125]`, non-uniform scale `[0.007, 1.875, 0.625]`, and serialized snap `true` / `2.5` while pre-load live snap is `true` / `4.25`.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- The test then clicks the real mobile toolbar `Kaydet JSON` control, captures the actual browser download, verifies filename `westeros-world.scene.json`, parses the downloaded bytes, and confirms schema/world/editor/object/instanceGroups content matches canonical serializer output exactly.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Save completion toast is `Scene JSON hazırlandı.`; saving does not mutate the live scene, owner grid-hidden/disabled policy and stable history remain intact, and browser console/page errors remain zero. Three mobile screenshots plus the actual downloaded JSON are retained as evidence.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Validation workflow `31465809740` PASS: syntax, focused mobile import+download regression, PWA cache/installability, mobile performance, deterministic/world-reference/hydrology, terrain/road safety, perf trend, technical-debt audit, full browser smoke, final remote-main/additive-only gates and artifact upload all PASS.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- World Event Determinism Guard `31465809687` PASS on the same Run255 head.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Runtime/product source delta: 0 lines changed in Run255. Test/workflow/checkpoint-only publication. Technical debt introduced: 0. Risk: LOW. Confidence: 5/5. ADR not required.' >> 3D_GAME_PROGRESS.md
            printf '%s\n' '- Next safe step: refresh remote main/concurrent branches and continue only a distinct additive-only World Editor mobile persistence regression, such as an actual downloaded-file save→load roundtrip, without overlapping stale Run252-local or Run253 unknown-only scopes.' >> 3D_GAME_PROGRESS.md
          fi
          if ! grep -Fq 'run255,2026-08-11,editor-mobile-scene-save' perf_log.csv; then
            printf 'run255,%s,editor-mobile-scene-save,,,,,,,"test-only real mobile/touch scene JSON browser-download fidelity regression; runtime draw calls/triangles unchanged; mobile perf budget and full smoke PASS"\n' "$(date +%Y-%m-%d)" >> perf_log.csv
          fi
          if ! grep -Fq 'Run255 editor mobile scene JSON save/download regression' STABLE_TAGS.md; then
            printf '%s — Run255 editor mobile scene JSON save/download regression; actual mobile browser download preserves canonical schema/editor/object transform content exactly; PWA/perf/determinism/smoke gates verified.\n' "$TAG" >> STABLE_TAGS.md
          fi
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          if git diff --quiet -- 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md; then
            echo 'Run255 checkpoint records already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3D_GAME_PROGRESS.md perf_log.csv STABLE_TAGS.md
          git diff --cached --check
          git commit -m 'docs(run255): record mobile scene save checkpoint'
          git tag "$STABLE_TAG"
          git push origin HEAD:agent/run255-editor-mobile-scene-save
          git push origin "$STABLE_TAG" || true
