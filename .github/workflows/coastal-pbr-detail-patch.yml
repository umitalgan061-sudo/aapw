name: Coastal PBR Detail Patch
on:
  push:
    branches: [chatgpt/coastal-relief-realism-20260815]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/coastal-relief-realism-20260815
      - name: Apply exact shader/capture patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/3d/world/worldReferenceSurfaceTerrainVisual.js')
          text = path.read_text()
          replacements = [
            ("\tshaderColorMicroVariation: 0.028,", "\tshaderColorMicroVariation: 0.048,"),
            ("\tshaderRoughnessMicroVariation: 0.03,", "\tshaderRoughnessMicroVariation: 0.045,"),
            (".replace('#include <common>', '#include <common>\\nvarying vec3 vPindexQualityWorldPosition;')\n\t\t\t.replace('#include <begin_vertex>', '#include <begin_vertex>\\nvPindexQualityWorldPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;');",
             ".replace('#include <common>', '#include <common>\\nvarying vec3 vPindexQualityWorldPosition;\\nvarying vec3 vPindexQualityWorldNormal;')\n\t\t\t.replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\\nvPindexQualityWorldNormal = normalize(mat3(modelMatrix) * objectNormal);')\n\t\t\t.replace('#include <begin_vertex>', '#include <begin_vertex>\\nvPindexQualityWorldPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;');"),
            ("uniform vec4 pindexQualityMapTransform;\\nvarying vec3 vPindexQualityWorldPosition;')",
             "uniform vec4 pindexQualityMapTransform;\\nvarying vec3 vPindexQualityWorldPosition;\\nvarying vec3 vPindexQualityWorldNormal;')"),
            ("float pindexQualityDry=pindexQualityAtlasColor.a;\\nfloat pindexQualityHeightRock=",
             "float pindexQualityDry=pindexQualityAtlasColor.a;\\nfloat pindexQualitySlope=1.0-clamp(abs(normalize(vPindexQualityWorldNormal).y),0.0,1.0);\\nfloat pindexQualitySteepRock=smoothstep(0.12,0.52,pindexQualitySlope)*pindexQualityDry;\\nfloat pindexQualityHeightRock="),
            ("pindexQualityColor=mix(pindexQualityColor,vec3(${PINDEX_QUALITY_V2_ROCK_COLOR.r.toFixed(6)},${PINDEX_QUALITY_V2_ROCK_COLOR.g.toFixed(6)},${PINDEX_QUALITY_V2_ROCK_COLOR.b.toFixed(6)}),pindexQualityHeightRock*${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.elevationRockBlend.toFixed(3)});\\nfloat pindexQualityNorthSnow=",
             "pindexQualityColor=mix(pindexQualityColor,vec3(${PINDEX_QUALITY_V2_ROCK_COLOR.r.toFixed(6)},${PINDEX_QUALITY_V2_ROCK_COLOR.g.toFixed(6)},${PINDEX_QUALITY_V2_ROCK_COLOR.b.toFixed(6)}),pindexQualityHeightRock*${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.elevationRockBlend.toFixed(3)});\\nvec2 pindexQualityRockUv=vPindexQualityWorldPosition.xz*0.067;\\nvec4 pindexQualityRockNoiseA=texture2D(pindexQualityDetailAtlas,pindexQualityRockUv);\\nvec4 pindexQualityRockNoiseB=texture2D(pindexQualityDetailAtlas,pindexQualityRockUv*2.41+vec2(0.43,0.71));\\nfloat pindexQualityRockMottle=clamp(pindexQualityRockNoiseA.g*0.62+pindexQualityRockNoiseB.r*0.38,0.0,1.0);\\nvec3 pindexQualitySlopeRock=vec3(${PINDEX_QUALITY_V2_ROCK_COLOR.r.toFixed(6)},${PINDEX_QUALITY_V2_ROCK_COLOR.g.toFixed(6)},${PINDEX_QUALITY_V2_ROCK_COLOR.b.toFixed(6)})*mix(0.72,1.14,pindexQualityRockMottle);\\npindexQualityColor=mix(pindexQualityColor,pindexQualitySlopeRock,pindexQualitySteepRock*0.68);\\nfloat pindexQualityLowCoast=(1.0-smoothstep(10.0,28.0,vPindexQualityWorldPosition.y))*pindexQualityDry*(1.0-pindexQualitySteepRock);\\npindexQualityColor=mix(pindexQualityColor,vec3(0.48,0.45,0.34),pindexQualityLowCoast*0.14);\\nfloat pindexQualityNorthSnow="),
            ("float pindexQualityGrain=(pindexQualityNoiseA.r*2.0-1.0)*0.64+(pindexQualityNoiseB.g*2.0-1.0)*0.36;\\npindexQualityColor*=1.0+pindexQualityGrain*mix(0.012,${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderColorMicroVariation.toFixed(3)},pindexQualityAtlasData.a);",
             "float pindexQualityGrain=(pindexQualityNoiseA.r*2.0-1.0)*0.56+(pindexQualityNoiseB.g*2.0-1.0)*0.30+(pindexQualityRockNoiseB.b*2.0-1.0)*0.14;\\npindexQualityColor*=1.0+pindexQualityGrain*mix(0.016,${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderColorMicroVariation.toFixed(3)},pindexQualityDry);"),
            ("roughnessFactor=clamp(roughnessFactor+pindexQualityRoughNoise*${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderRoughnessMicroVariation.toFixed(3)},0.04,1.0);",
             "roughnessFactor=clamp(roughnessFactor+pindexQualityRoughNoise*${RUNTIME_PINDEX_TERRAIN_QUALITY_V2_POLICY.shaderRoughnessMicroVariation.toFixed(3)}+pindexQualitySteepRock*0.045,0.18,1.0);")
          ]
          for old, new in replacements:
            if new in text:
              continue
            if text.count(old) != 1:
              raise SystemExit(f'shader patch anchor drifted: {old[:100]}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/coastal-relief-realism-validation.yml')
          w = workflow.read_text()
          old = "                state.sky.visible = false;\n                state.stars.visible = false;"
          new = "                state.sky.visible = true;\n                state.stars.visible = false;"
          if new not in w:
            if w.count(old) != 1:
              raise SystemExit('capture sky anchor drifted')
            w = w.replace(old, new, 1)
          workflow.write_text(w)
          PY
          node --check src/3d/world/worldReferenceSurfaceTerrainVisual.js
          git diff --check
      - name: Commit branch-only patch
        run: |
          set -euo pipefail
          if git diff --quiet -- src/3d/world/worldReferenceSurfaceTerrainVisual.js .github/workflows/coastal-relief-realism-validation.yml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/world/worldReferenceSurfaceTerrainVisual.js .github/workflows/coastal-relief-realism-validation.yml
          git commit -m 'terrain: add slope-aware realistic surface detail'
          git push origin HEAD:chatgpt/coastal-relief-realism-20260815
