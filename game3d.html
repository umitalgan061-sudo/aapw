<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
<meta name="theme-color" content="#c8960a">
<meta name="description" content="Westeros 3D Dünya — TypeScript-first modern açık dünya runtime">
<meta name="color-scheme" content="dark">
<title>Westeros — 3D Dünya</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preload" as="image" href="./giriş.png" fetchpriority="high">
<link rel="stylesheet" href="game3d.css">
<style>
  :root { --entry-gold:#c8960a; --entry-bg:#050505; }
  html.run266-entry-gate-open, html.run266-entry-gate-open body { overflow:hidden!important; overscroll-behavior:none; }
  .run266-entry-gate { position:fixed; inset:0; z-index:2147483000; display:block; min-width:100vw; min-height:100dvh; overflow:hidden; background:var(--entry-bg); touch-action:none; user-select:none; -webkit-user-select:none; }
  .run266-entry-gate[hidden] { display:none!important; }
  .run266-entry-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; pointer-events:none; -webkit-user-drag:none; }
  .run266-entry-shade { position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.04) 45%,rgba(0,0,0,.18)); }
  .run266-entry-action { position:absolute; top:50%; transform:translate(-50%,-50%); min-width:clamp(112px,18vw,190px); min-height:56px; padding:14px 22px; border-radius:12px; border:2px solid rgba(255,255,255,.7); color:#fff; font:800 clamp(15px,1.8vw,21px)/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.02em; text-shadow:0 1px 2px rgba(0,0,0,.85); box-shadow:0 12px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.18); -webkit-tap-highlight-color:transparent; }
  #run266-entry-back { left:clamp(88px,16vw,250px); background:linear-gradient(180deg,#df3f3f,#9d1515); border-color:rgba(255,190,190,.92); cursor:not-allowed; }
  #run266-entry-enter { left:auto; right:clamp(20px,10vw,150px); transform:translateY(-50%); background:linear-gradient(180deg,#42c96a,#177c36); border-color:rgba(190,255,205,.95); cursor:pointer; }
  #run266-entry-enter:hover,#run266-entry-enter:focus-visible { filter:brightness(1.08); box-shadow:0 14px 36px rgba(0,0,0,.48),0 0 0 4px rgba(105,255,145,.2); outline:none; }
  @media (max-width:720px),(pointer:coarse) { .run266-entry-action{min-width:112px;min-height:54px;padding:13px 16px;font-size:15px;} #run266-entry-back{left:22%;} #run266-entry-enter{right:7%;} }
  @media (prefers-reduced-motion:reduce) { .run266-entry-action { transition:none!important; } }
  #game3d-canvas { display:block; width:100vw; height:100dvh; }
  .g3d-entry-status { position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); z-index:2147482999; transform:translateX(-50%); padding:7px 12px; border-radius:999px; background:rgba(0,0,0,.55); color:rgba(255,255,255,.78); font:500 12px/1.2 system-ui,sans-serif; pointer-events:none; opacity:0; transition:opacity .2s ease; }
  .g3d-entry-status[data-visible="true"] { opacity:1; }
</style>
<script type="importmap">
{ "imports": { "three": "./src/3d/vendor/three/three.module.js", "three/addons/": "./src/3d/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="run266-entry-gate" class="run266-entry-gate" role="dialog" aria-modal="true" aria-label="3D dünyaya giriş">
  <img class="run266-entry-art" src="./giriş.png" alt="" fetchpriority="high" decoding="async">
  <div class="run266-entry-shade" aria-hidden="true"></div>
  <button id="run266-entry-back" class="run266-entry-action" type="button" aria-disabled="true" tabindex="-1">Geri dön</button>
  <button id="run266-entry-enter" class="run266-entry-action" type="button">Giriş yap</button>
</div>
<canvas id="game3d-canvas" aria-label="Westeros 3D dünya"></canvas>
<div id="game3d-loading" class="g3d-loading" role="status" aria-live="polite"><div>Westeros 3D dünyası yükleniyor&hellip;</div></div>
<div id="game3d-entry-status" class="g3d-entry-status" aria-hidden="true"></div>
<a class="g3d-back-link" href="index.html">&larr; 2D Haritaya Dön</a>
<a class="g3d-back-link" href="rts.html" style="left:auto;right:max(12px, env(safe-area-inset-right));">⚔ RTS Komutanlık</a>
<script type="module">
  import { bootModernGame3D } from './src/3d/modern/gameEntry.ts';

  const loading = document.getElementById('game3d-loading');
  const status = document.getElementById('game3d-entry-status');
  const setStatus = (value, visible = false) => {
    if (!status) return;
    status.textContent = value;
    status.dataset.visible = String(visible);
    status.setAttribute('aria-hidden', String(!visible));
  };

  const editorPatch = new URLSearchParams(location.search).get('editorPatch') === '1';
  if (editorPatch) await import('./src/3d/editor/EditorGamePatchPreviewGateSafe.js');

  const session = await bootModernGame3D({
    canvasId: 'game3d-canvas',
    loadingId: 'game3d-loading',
    installGate: true,
    startLoop: true,
    onReady: (readySession) => {
      loading?.classList.add('g3d-loading-hidden');
      setStatus(`Modern runtime • ${readySession.runtime.capabilities.backend}`, true);
      window.dispatchEvent(new CustomEvent('aapw:modern-game3d-ready', { detail: readySession }));
      window.setTimeout(() => setStatus('', false), 2200);
    },
    onError: (error) => {
      setStatus('3D runtime başlatılamadı', true);
      console.error('[game3d] modern bootstrap failed', error);
    },
  });

  if (!session) {
    loading?.classList.remove('g3d-loading-hidden');
  }
</script>
</body>
</html>
