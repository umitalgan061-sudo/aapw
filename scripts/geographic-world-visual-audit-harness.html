<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AAPW Geographic World Visual Audit</title>
<style>
html,body{margin:0;height:100%;background:#0c0805;color:#eee;font:13px system-ui,sans-serif}
#game3d-canvas{display:block;width:100%;height:100%}
#proof{position:fixed;z-index:10;left:12px;top:12px;right:12px;max-height:55vh;overflow:auto;padding:12px;background:#000b;border:1px solid #666;border-radius:7px;white-space:pre-wrap}
.ok{border-color:#5c9}.bad{border-color:#c66}
</style>
</head>
<body>
<canvas id="game3d-canvas"></canvas>
<pre id="proof">Booting production scene…</pre>
<script type="module">
import { createScene } from '../src/3d/sceneManager.js';

const proof = document.querySelector('#proof');
const pageErrors = [];
const consoleErrors = [];
window.addEventListener('error', (event) => pageErrors.push(String(event.error || event.message || 'window-error')));
window.addEventListener('unhandledrejection', (event) => pageErrors.push(String(event.reason || 'unhandled-rejection')));
window.addEventListener('console-error', (event) => consoleErrors.push(String(event.detail || 'console-error')));

const originalConsoleError = console.error;
console.error = (...args) => {
  consoleErrors.push(args.map((value) => typeof value === 'string' ? value : JSON.stringify(value)).join(' '));
  originalConsoleError(...args);
};

function wait(ms){return new Promise((resolve)=>setTimeout(resolve,ms));}
function finite(value){return Number.isFinite(Number(value));}
function childByName(root,name){return root?.children?.find((child)=>child?.name===name)||null;}

try {
  const state = createScene(document.querySelector('#game3d-canvas'));
  await wait(2500);
  const terrainCount = state.scene.children.filter((child)=>child?.name?.startsWith?.('terrain-chunk')).length;
  const checks = {
    hasScene: Boolean(state.scene),
    hasWater: Boolean(state.water),
    hasRiver: Boolean(state.river),
    hasSettlements: Boolean(state.settlements),
    hasRoads: Boolean(state.roads),
    hasGeology: Boolean(state.naturalGeology),
    hasVegetation: Boolean(state.vegetation),
    hasVillages: Boolean(state.villages),
    hasSettlementSeats: Array.isArray(state.settlementSeats) && state.settlementSeats.length > 0,
    terrainChunkCount: terrainCount,
    roadEdgeCount: Array.isArray(state.roadEdges) ? state.roadEdges.length : 0,
    vegetationPlacedCount: state.vegetation?.userData?.northClimateVegetation?.winterTreeCount !== undefined
      ? (state.vegetation.userData.northClimateVegetation.winterTreeCount + state.vegetation.userData.northClimateVegetation.temperateTreeCount)
      : null,
    settlementPropReady: Boolean(state.geographicSettlementPropsReady),
    noFatalRuntimeError: pageErrors.length === 0,
  };

  const failures = [];
  for (const [key,value] of Object.entries(checks)) {
    if (typeof value === 'boolean' && !value) failures.push(key);
  }
  if (checks.terrainChunkCount <= 0) failures.push('terrainChunkCount');
  if (checks.hasSettlementSeats && checks.roadEdgeCount <= 0) failures.push('roadEdgeCount');
  if (checks.vegetationPlacedCount !== null && !finite(checks.vegetationPlacedCount)) failures.push('vegetationPlacedCount');

  const pixelCanvas = document.querySelector('#game3d-canvas');
  const gl = pixelCanvas.getContext('webgl2') || pixelCanvas.getContext('webgl');
  let pixel = null;
  if (gl) {
    const buffer = new Uint8Array(4);
    gl.readPixels(1,1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,buffer);
    pixel = [...buffer];
    if (buffer[3] === 0) failures.push('gpu-alpha-zero');
  }

  const payload = {
    ok: failures.length === 0,
    failures,
    pageErrors,
    consoleErrors: consoleErrors.slice(-20),
    checks,
    gpu: { available: Boolean(gl), pixel },
    settlement: state.geographicSettlementPropsReady
      ? { status: await state.geographicSettlementPropsReady.then((result)=>result?.ok ? 'ok' : 'failed') }
      : { status: 'not-started' },
  };
  window.__GEOGRAPHIC_WORLD_VISUAL_AUDIT__ = payload;
  proof.textContent = JSON.stringify(payload,null,2);
  proof.className = payload.ok ? 'ok' : 'bad';
} catch (error) {
  const payload = { ok:false, failures:[String(error)], pageErrors, consoleErrors };
  window.__GEOGRAPHIC_WORLD_VISUAL_AUDIT__ = payload;
  proof.textContent = JSON.stringify(payload,null,2);
  proof.className = 'bad';
}
</script>
</body>
</html>
